name: Daily Engineering Highlights

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Manual trigger for testing

concurrency:
  # Workflow-level: prevents two whole runs of this workflow from interleaving.
  # Within a single run, the doodle and selected_projects jobs deliberately run
  # in parallel and resolve their push race with rebase-retry below.
  group: daily-highlights
  cancel-in-progress: false

jobs:
  doodle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # full history so rebase-on-push can find a common ancestor

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Generate stats SVG (mechanical)
        run: python .github/scripts/generate-stats-svg.py

      - name: Generate doodle and recent activity (Claude)
        id: claude
        uses: anthropics/claude-code-action@1b422b3517b51140e4484faab676c5e68b914866 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--model claude-opus-4-7 --permission-mode acceptEdits --allowedTools "Bash(gh:*),Bash(git:*),Bash(date:*),Bash(jq:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are updating Brandon Fryslie's GitHub profile README with daily engineering highlights.

            TODAY: Run `date -u '+%Y-%m-%d %A'` to get today's ISO date and day of week.

            Read the CLAUDE.md file first for SVG constraints and project context.

            The stats SVG (assets/daily-stats.svg) has already been regenerated by a prior step. Do not touch that file.

            ## Task 1: Archive Previous Highlights

            1. Read README.md and extract content between `<!-- RECENT-ACTIVITY:START -->` and `<!-- RECENT-ACTIVITY:END -->`
            2. Look for a date in the extracted content — match both "Updated ..." and "Last updated ..." patterns (e.g., "Updated March 17, 2026" or "Last updated February 18, 2026")
            3. Convert the found date to ISO format (YYYY-MM-DD) for the archive filename
            4. If a date was found and `daily-archive/YYYY-MM-DD.md` doesn't already exist:
               - Create `daily-archive/` directory if needed
               - Save the extracted content to `daily-archive/YYYY-MM-DD.md`
            5. If no datable previous content or archive already exists, skip

            ## Task 2: Gather Commit Data

            Use `gh api` to fetch commit activity across all of Brandon's public repos.

            Past 24 hours:
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[] | {repo: .repository.full_name, msg: .commit.message, date: .commit.committer.date}'

            Past 7 days:
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[] | {repo: .repository.full_name, msg: .commit.message, date: .commit.committer.date}'

            Past 30 days (count and repos — use --paginate to capture all pages):
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '{total: .total_count, repos: [.items[].repository.full_name]}' | jq -s '{total: (.[0].total // 0), repos: [.[].repos[]] | unique}'

            Recent repo info:
              gh api "users/brandon-fryslie/repos?sort=pushed&per_page=10" --jq '.[] | {name, description, language, pushed_at}'

            ## Task 3: Create Daily Doodle SVG

            Create `assets/daily-highlight.svg` (800x200px). This is the creative centerpiece — like a Google Doodle for this GitHub profile.

            **Theme picking — work this list top-to-bottom and stop at the first real hook for today's date:**

            1. **Brandon's birthday: February 16.** If today is Feb 16, the theme MUST be birthday / celebration (cake, candles, confetti, "another trip around the sun," etc.). No substitute.
            2. **Major holidays and observances on today's date.** US federal holidays, widely-known international days (Valentine's Day, St. Patrick's Day, Pi Day Mar 14, Earth Day Apr 22, Halloween, Thanksgiving, Christmas, New Year's, etc.). Also tech/science-flavored observances: Ada Lovelace Day (2nd Tuesday of October), World Backup Day (Mar 31), SysAdmin Appreciation Day (last Friday of July), Alan Turing's birthday (Jun 23), etc.
            3. **Notable tech, science, or cultural anniversaries landing on this exact date.** First moon landing (Jul 20, 1969), release of the first iPhone (Jun 29, 2007), birth of the web (Mar 12, 1989), etc. Pick something that would be recognizable and visually rich.
            4. **Verifiable signals from `gh api` only.** If `gh api` surfaces a concrete, date-appropriate event on a repo you can inspect — a recent release, tag, milestone, or announcement that Brandon would plausibly care about — use that as the theme. Cite the source repo/release in the SVG's theme comment. Do NOT draw on general world knowledge of "current events" — if you cannot verify a concrete signal via a tool call, skip this option entirely.
            5. **Season / day-of-week vibe** only as a fallback if nothing above fits (Monday reset energy, Friday momentum, deep-winter cold, high-summer sun, spring bloom, autumn decay, etc.).

            Name the theme explicitly in a short HTML comment at the top of the SVG (e.g. `<!-- theme: Pi Day (March 14) -->`) so future runs can avoid repeating yesterday's pick.

            Choose ONE theme and go all in. The SVG must:
            1. **Display today's date prominently and legibly.** The full date (e.g. "April 24, 2026" or "Apr 24 · 2026") is a primary visual element — large, high-contrast, easy to read at a glance from a normal browser zoom level. It should not be hidden in a corner, used as decorative micro-text, or so blended into the background that it disappears. It should still be *integrated into* the artwork (woven into the theme, not pasted on top), but readability comes first.
            2. Have animated motion (CSS @keyframes and/or SMIL animations)
            3. Be visually striking and unique — this should NOT look like a template

            **Hard constraints (GitHub renders SVGs as <img> tags):**
            - NO JavaScript (stripped by GitHub sanitizer)
            - No :hover or pseudo-classes (no events in <img> context)
            - No <foreignObject> or <a> links (stripped)
            - Use CSS @keyframes and/or SMIL <animate>/<animateTransform>
            - Use prime-number durations (7s, 11s, 13s) with staggered delays for organic motion
            - font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif
            - Dark background (#0d1117) to match the profile
            - All text in the SVG must be legible — adequate size and contrast against its background, no decorative micro-text that disappears at normal zoom.

            **Creative direction:**
            - Think Google Doodle energy: playful, clever, surprising
            - The date should be integrated INTO the artwork, not just slapped on top
            - Use SVG features creatively: gradients, filters (feTurbulence, feDisplacementMap), clip paths, masks, patterns
            - Motion should feel alive — particles, morphing shapes, floating elements, wave effects
            - Each day should feel completely different from the last
            - Study the existing SVGs in assets/ (e.g., atelier-banner.svg, vision.svg) for quality reference

            Be bold. Be weird. Be creative. This is art, not a dashboard widget.

            ## Task 4: Update README

            README.md has TWO marker pairs you must update. Keep every marker exactly as it appears — replace ONLY the content between each pair.

            ### Marker pair 1: `<!-- DAILY-DOODLE:START -->` / `<!-- DAILY-DOODLE:END -->`

            These live at the very top of the README. Replace the content between them with:

            A single centered div containing an img tag pointing to `./assets/daily-highlight.svg`, width 800, with alt text "Daily highlight". Nothing else.

            ### Marker pair 2: `<!-- RECENT-ACTIVITY:START -->` / `<!-- RECENT-ACTIVITY:END -->`

            Replace the content between them with:

            An h2 heading "Recent Engineering Work"

            An italic line with "Updated [full date]"

            An h3 "Today" section: 1-3 sentences listing what shipped in the last 24 hours, by repo. If no commits, write "No new commits today."

            An h3 "This Week" section: 2-5 sentences listing what shipped in the past 7 days, grouped by repo. State what changed; do not characterize its quality or significance.

            An h3 "This Month" section: 2-4 sentences listing the dominant repos by commit volume in the past 30 days and what work happened in each. Numbers and concrete deliverables only.

            A horizontal rule, then a details/summary block titled "Previous highlights" containing links to the most recent daily-archive files (up to 7, newest first). Format each as [YYYY-MM-DD](./daily-archive/YYYY-MM-DD.md). If no archives exist, write "No previous highlights yet."

            ### Writing Guidelines

            **Tone: matter-of-fact reporting. Third-person past tense. Plain verbs ("Added", "Renamed", "Migrated", "Fixed"). Name repos and concrete artifacts. No editorial adjectives, no promotional framing, no characterization of engineering quality — describe what code did or where it landed, and stop there.**

            - ACCURACY IS PARAMOUNT. Only reference real commits and real work. Never fabricate.
            - Routine commits (merge commits, CI tweaks, dependency bumps, typo fixes) get one neutral sentence at most, or are folded into a single line.
            - Keep scannable.
            - Do NOT include commit hashes or SHAs.

            ## Final note

            Do NOT run `git commit` or `git push`. A subsequent shell step in the workflow will stage your changes, commit them as `chore: update daily engineering highlights`, and push with rebase-retry so it can race the parallel selected-projects job safely. Just write the files and finish.

      - name: Verify Claude result
        id: parse_claude
        run: |
          set -euo pipefail
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution_file missing — the action did not run to completion."
            exit 1
          fi
          RESULT=$(jq -c '[.[] | select(.type=="result")] | last' "$EXEC_FILE")
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::Claude execution output has no result entry — shape unexpected."
            exit 1
          fi
          IS_ERROR=$(echo "$RESULT" | jq -r '.is_error')
          DENIALS=$(echo "$RESULT" | jq -r '.permission_denials_count // 0')
          echo "Doodle Claude: is_error=$IS_ERROR permission_denials_count=$DENIALS"
          if [ "$IS_ERROR" != "false" ]; then
            echo "::error::Doodle Claude reported is_error=$IS_ERROR"
            exit 1
          fi
          if [ "$DENIALS" -gt 0 ]; then
            echo "::error::Doodle Claude had $DENIALS permission denials."
            exit 1
          fi

      - name: Commit and push (rebase-retry on race with parallel job)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage exactly what this job is responsible for. Restrict to these
          # paths so we can't accidentally pick up stray files in the runner.
          git add README.md assets/daily-stats.svg assets/daily-highlight.svg daily-archive/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::error::Doodle job produced no staged changes — Claude did not write the expected files."
            exit 1
          fi

          git commit -m 'chore: update daily engineering highlights'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebase failed (real conflict). Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-highlights-doodle
          path: |
            README.md
            assets/daily-highlight.svg
            assets/daily-stats.svg
            daily-archive/
          if-no-files-found: ignore

  selected_projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Rotate Selected Projects (Claude)
        id: claude
        uses: anthropics/claude-code-action@1b422b3517b51140e4484faab676c5e68b914866 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--model claude-opus-4-7 --permission-mode acceptEdits --allowedTools "Bash(gh:*),Bash(git:*),Bash(date:*),Bash(jq:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are rotating the Selected Projects table on Brandon Fryslie's GitHub profile. This is the only thing you do — do not touch the daily-highlight SVG, the RECENT-ACTIVITY block, the daily-stats SVG, or anything else. Those are handled by a parallel job.

            Read the CLAUDE.md file first for project context.

            ## Selection

            README.md has a marker pair `<!-- SELECTED-PROJECTS:START -->` / `<!-- SELECTED-PROJECTS:END -->` wrapping a six-cell project table. Replace the content between those markers with up to six projects Brandon has actually made substantial recent commits to.

            1. Aggregate Brandon's commits per repo over the past 90 days:
               `gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[].repository.full_name' | sort | uniq -c | sort -rn`
            2. A repo qualifies as "substantial" if it has at least **10 commits by Brandon** in those 90 days.
            3. Pick the top 6 qualifying repos by commit count.
            4. If fewer than 6 qualify, fill remaining slots with the highest-commit-count repos from the past 365 days that have at least 5 commits. If still short of 6, render fewer cells rather than padding with low-activity repos.

            ## Per-repo metadata

            For each chosen repo, fetch:
            `gh api repos/<owner>/<name> --jq '{description, language, stargazers_count, license: .license.spdx_id}'`

            Do NOT fabricate any field — if it's empty or null, omit it.

            ## Render

            Replace the content between the markers with a 2-column HTML `<table>` matching the existing layout: 3 cells per `<td width="50%" valign="top">`. Each cell:

            ```
            ### [<repo-name>](https://github.com/brandon-fryslie/<repo-name>)
            **<one-line metadata: e.g. "Go · MIT" or "TypeScript · 41★">**

            <2–3 sentences of plain description: what the project is, what it does, plus one sentence on what shipped recently in it.>
            ```

            ## Tone

            Matter-of-fact reporting. Third-person past tense. Plain verbs ("Added", "Renamed", "Migrated", "Fixed"). Name concrete artifacts. No editorial adjectives, no promotional framing, no characterization of engineering quality — describe what the project does and what code recently landed, and stop there.

            ## Final note

            Do NOT run `git commit` or `git push`. A subsequent shell step in the workflow will stage your changes, commit them as `chore: rotate selected projects`, and push with rebase-retry so it can race the parallel doodle job safely. Just edit the file and finish.

      - name: Verify Claude result
        id: parse_claude
        run: |
          set -euo pipefail
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution_file missing — the action did not run to completion."
            exit 1
          fi
          RESULT=$(jq -c '[.[] | select(.type=="result")] | last' "$EXEC_FILE")
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::Claude execution output has no result entry — shape unexpected."
            exit 1
          fi
          IS_ERROR=$(echo "$RESULT" | jq -r '.is_error')
          DENIALS=$(echo "$RESULT" | jq -r '.permission_denials_count // 0')
          echo "Projects Claude: is_error=$IS_ERROR permission_denials_count=$DENIALS"
          if [ "$IS_ERROR" != "false" ]; then
            echo "::error::Projects Claude reported is_error=$IS_ERROR"
            exit 1
          fi
          if [ "$DENIALS" -gt 0 ]; then
            echo "::error::Projects Claude had $DENIALS permission denials."
            exit 1
          fi

      - name: Commit and push (rebase-retry on race with parallel job)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add README.md

          if git diff --cached --quiet; then
            # Legitimate no-op: no qualifying rotation today, or the same six repos.
            echo "Selected Projects: no changes to commit; skipping push."
            exit 0
          fi

          git commit -m 'chore: rotate selected projects'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebase failed (real conflict). Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
