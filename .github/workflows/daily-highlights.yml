name: Daily Engineering Highlights

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Manual trigger for testing

concurrency:
  # Workflow-level: prevents two whole runs of this workflow from interleaving.
  # Within a single run, the doodle and narrative jobs deliberately run in
  # parallel and resolve their push race with rebase-retry below.
  group: daily-highlights
  cancel-in-progress: false

jobs:
  doodle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # full history so rebase-on-push can find a common ancestor

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Install rsvg-convert (for doodle preview)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Generate doodle (Claude)
        id: claude
        uses: anthropics/claude-code-action@1b422b3517b51140e4484faab676c5e68b914866 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--model claude-opus-4-7 --permission-mode acceptEdits --allowedTools "Bash(gh:*),Bash(git:*),Bash(date:*),Bash(jq:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Bash(rsvg-convert:*),Bash(rm:*),Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are generating today's daily doodle SVG for Brandon Fryslie's GitHub profile. The text regions of the README (intro prose, recent activity, selected projects) are owned by a parallel `narrative` job — do not touch README.md's INTRO-PROSE, RECENT-ACTIVITY, or SELECTED-PROJECTS marker regions, and do not touch daily-archive/.

            TODAY: Run `date -u '+%Y-%m-%d %A'` to get today's ISO date and day of week.

            Read the CLAUDE.md file first for SVG constraints and project context.

            ## Task 1: Archive the Live Doodle and Prepend to the Gallery

            Read `doodle-archive/README.md` first — it is the source of truth for the archive's file layout and how new entries are added. Follow what it says.

            In short: every run is additive. Compute a UTC archival stamp, copy the live SVG into the archive under that stamp, prepend a matching entry to the gallery section of `DOODLES.md`. No idempotency check — the timestamp ensures uniqueness even when the workflow fires more than once a day.

            Hard rules for the gallery file:

            - Insert the new entry *immediately after* the `<!-- DOODLE-GALLERY:START -->` line so the newest entry is at the top of the gallery.
            - Anything outside the `<!-- DOODLE-GALLERY:START -->` / `<!-- DOODLE-GALLERY:END -->` marker pair is hand-curated (header, **Pinned** section). Never touch it.
            - Heading format: `## <Human-readable date> — <theme name>` where the human date is derived from the archival stamp (e.g. "April 30, 2026"). The theme name comes from the `<!-- theme: ... -->` HTML comment in the archived SVG; if absent, use `(unknown theme)`.

            If `assets/daily-highlight.svg` does not exist yet (very first run ever), skip this task entirely and proceed to generating today's doodle.

            ## Task 2: Gather Light Context for Theme Picking

            Theme picking (Task 3) may consult `gh api` for verifiable signals. Useful queries:

            Recently pushed repos:
              gh api "users/brandon-fryslie/repos?sort=pushed&per_page=10" --jq '.[] | {name, description, language, pushed_at}'

            Past-week commit activity (in case you want a hook from real recent work):
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[] | {repo: .repository.full_name, msg: .commit.message}'

            Use these only if they help pick today's theme. The narrative job is the canonical consumer of commit data.

            ## Task 3: Create Today's Doodle SVG

            Create `assets/daily-highlight.svg` (800x200px). This is the creative centerpiece — like a Google Doodle for this GitHub profile.

            **Theme picking — work this list top-to-bottom and stop at the first real hook for today's date:**

            1. **Brandon's birthday: February 16.** If today is Feb 16, the theme MUST be birthday / celebration (cake, candles, confetti, "another trip around the sun," etc.). No substitute.
            2. **Major holidays and observances on today's date.** US federal holidays, widely-known international days (Valentine's Day, St. Patrick's Day, Pi Day Mar 14, Earth Day Apr 22, Halloween, Thanksgiving, Christmas, New Year's, etc.). Also tech/science-flavored observances: Ada Lovelace Day (2nd Tuesday of October), World Backup Day (Mar 31), SysAdmin Appreciation Day (last Friday of July), Alan Turing's birthday (Jun 23), etc.
            3. **Notable tech, science, or cultural anniversaries landing on this exact date.** First moon landing (Jul 20, 1969), release of the first iPhone (Jun 29, 2007), birth of the web (Mar 12, 1989), etc. Pick something that would be recognizable and visually rich.
            4. **Verifiable signals from `gh api` only.** If `gh api` surfaces a concrete, date-appropriate event on a repo you can inspect — a recent release, tag, milestone, or announcement that Brandon would plausibly care about — use that as the theme. Cite the source repo/release in the SVG's theme comment. Do NOT draw on general world knowledge of "current events" — if you cannot verify a concrete signal via a tool call, skip this option entirely.
            5. **Season / day-of-week vibe** only as a fallback if nothing above fits (Monday reset energy, Friday momentum, deep-winter cold, high-summer sun, spring bloom, autumn decay, etc.).

            Name the theme explicitly in a short HTML comment at the top of the SVG (e.g. `<!-- theme: Pi Day (March 14) -->`) so future runs can avoid repeating yesterday's pick.

            Choose ONE theme and go all in. The SVG must:
            1. **Display today's date prominently and legibly.** The full date (e.g. "April 24, 2026" or "Apr 24 · 2026") is a primary visual element — large, high-contrast, easy to read at a glance from a normal browser zoom level. It should not be hidden in a corner, used as decorative micro-text, or so blended into the background that it disappears. It should still be *integrated into* the artwork (woven into the theme, not pasted on top), but readability comes first.
            2. Have animated motion (CSS @keyframes and/or SMIL animations)
            3. Be visually striking and unique — this should NOT look like a template

            **Hard constraints (GitHub renders SVGs as <img> tags):**
            - NO JavaScript (stripped by GitHub sanitizer)
            - No :hover or pseudo-classes (no events in <img> context)
            - No <foreignObject> or <a> links (stripped)
            - Use CSS @keyframes and/or SMIL <animate>/<animateTransform>
            - Use prime-number durations (7s, 11s, 13s) with staggered delays for organic motion
            - font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif
            - Dark background (#0d1117) to match the profile
            - All text in the SVG must be legible — adequate size and contrast against its background, no decorative micro-text that disappears at normal zoom.

            **Creative direction:**
            - Think Google Doodle energy: playful, clever, surprising
            - The date should be integrated INTO the artwork, not just slapped on top
            - Use SVG features creatively: gradients, filters (feTurbulence, feDisplacementMap), clip paths, masks, patterns
            - Motion should feel alive — particles, morphing shapes, floating elements, wave effects
            - Each day should feel completely different from the last
            - Study the existing SVGs in assets/ (e.g., atelier-banner.svg, vision.svg) for quality reference

            Be bold. Be weird. Be creative. This is art, not a dashboard widget.

            **Self-review before finalizing — render and look at it.**

            After writing `assets/daily-highlight.svg`, rasterize it and view the PNG with the Read tool:

                rsvg-convert -w 800 -h 200 assets/daily-highlight.svg -o /tmp/preview.png

            Then `Read /tmp/preview.png` and honestly evaluate the static image:

            - **Is the date readable at a glance?** Adequate size, strong contrast against whatever sits behind it, not lost in decorative micro-text.
            - **Composition:** does it feel like a deliberate piece, or random elements floating? Does the eye know where to land first?
            - **Theme legibility:** would a stranger glancing at this PNG identify the theme without being told?
            - **Color/contrast:** any text smudging into background? Any near-invisible elements?

            Important caveat: `rsvg-convert` renders only the *static frame 0* — it cannot evaluate animation. Don't try to judge motion from the PNG. It's specifically for catching bad layout, weak composition, and illegible text — which is where most of these doodles fail.

            **Iterate if needed, but cap strictly at 3 total attempts.** If the first preview is bad, rewrite the SVG (don't patch — start over with a different approach), re-render, re-view. After 3 attempts, accept the current version even if imperfect — do NOT loop indefinitely. Each attempt should be a real rethink, not a tweak; if you're tweaking the same composition over and over, stop and pick a different visual direction entirely.

            ## Task 4: Update README's DAILY-DOODLE Marker

            README.md has a marker pair `<!-- DAILY-DOODLE:START -->` / `<!-- DAILY-DOODLE:END -->` at the very top. Replace the content between them with:

            A single centered div containing an anchor `<a href="./DOODLES.md">` that wraps an `<img>` tag pointing to `./assets/daily-highlight.svg`, width 800, with alt text "Daily highlight — click for the gallery". The anchor makes the live doodle clickable: visitors land on `DOODLES.md`, which is the running gallery of all previous doodles. Nothing else inside the marker pair.

            **Do not touch any other marker pair in README.md** — INTRO-PROSE, RECENT-ACTIVITY, and SELECTED-PROJECTS are owned by the parallel narrative job.

            ## Final note

            Do NOT run `git commit` or `git push`. A subsequent shell step in the workflow will stage your changes, commit them as `chore: update daily doodle`, and push with rebase-retry so it can race the parallel narrative job safely. Just write the files and finish.

      - name: Verify Claude result
        id: parse_claude
        run: |
          set -euo pipefail
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution_file missing — the action did not run to completion."
            exit 1
          fi
          RESULT=$(jq -c '[.[] | select(.type=="result")] | last' "$EXEC_FILE")
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::Claude execution output has no result entry — shape unexpected."
            exit 1
          fi
          IS_ERROR=$(echo "$RESULT" | jq -r '.is_error')
          DENIALS=$(echo "$RESULT" | jq -r '.permission_denials_count // 0')
          echo "Doodle Claude: is_error=$IS_ERROR permission_denials_count=$DENIALS"
          if [ "$IS_ERROR" != "false" ]; then
            echo "::error::Doodle Claude reported is_error=$IS_ERROR"
            exit 1
          fi
          if [ "$DENIALS" -gt 0 ]; then
            echo "::error::Doodle Claude had $DENIALS permission denials."
            exit 1
          fi

      - name: Mirror doodle SVG to docs/ (for Pages site)
        # The Pages site (brandon-fryslie.github.io/brandon-fryslie/) is served
        # from /docs/ and can't reach back to /assets/, so the freshly-generated
        # doodle has to live in both places. Same byte content, different path.
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          cp assets/daily-highlight.svg docs/assets/daily-highlight.svg

      - name: Commit and push (rebase-retry on race with parallel job)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage exactly what this job is responsible for. Restrict to these
          # paths so we can't accidentally pick up stray files in the runner.
          # README.md is included for the DAILY-DOODLE marker pair only — the
          # narrative job owns INTRO-PROSE/RECENT-ACTIVITY/SELECTED-PROJECTS.
          # docs/assets/daily-highlight.svg mirrors the doodle for the Pages
          # site (the narrative job owns docs/daily.json).
          git add README.md DOODLES.md assets/daily-highlight.svg doodle-archive/ docs/assets/daily-highlight.svg 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::error::Doodle job produced no staged changes — Claude did not write the expected files."
            exit 1
          fi

          git commit -m 'chore: update daily doodle'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebase failed (real conflict). Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-highlights-doodle
          path: |
            README.md
            DOODLES.md
            assets/daily-highlight.svg
            doodle-archive/
            docs/assets/daily-highlight.svg
          if-no-files-found: ignore

  narrative:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Generate narrative (Claude)
        id: claude
        uses: anthropics/claude-code-action@1b422b3517b51140e4484faab676c5e68b914866 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--model claude-opus-4-7 --permission-mode acceptEdits --allowedTools "Bash(gh:*),Bash(git:*),Bash(date:*),Bash(jq:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*),Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are Brandon Fryslie's narrative job. You render the three text regions of his GitHub profile README each day: INTRO-PROSE, RECENT-ACTIVITY, and SELECTED-PROJECTS. The doodle SVG, the stats SVG, the DOODLES.md gallery, and the doodle-archive/ tree are owned by a parallel `doodle` job — do not touch any SVG file, DOODLES.md, the DAILY-DOODLE marker pair in README.md, or anything in doodle-archive/.

            TODAY: Run `date -u '+%Y-%m-%d %A'` to get today's ISO date and day of week.

            Read the CLAUDE.md file first for project context.
            Read the .github/intro-seed.md file — it is the durable voice and identity scaffolding for the intro prose. You will use it in Task 3.

            ## Task 1: Archive Previous Narrative

            1. Read README.md and extract content between `<!-- RECENT-ACTIVITY:START -->` and `<!-- RECENT-ACTIVITY:END -->`.
            2. Look for a date in the extracted content — match both "Updated ..." and "Last updated ..." patterns (e.g., "Updated March 17, 2026").
            3. Convert the found date to ISO format (YYYY-MM-DD).
            4. If a date was found and `daily-archive/YYYY-MM-DD.md` doesn't already exist:
               - Create `daily-archive/` if needed (`mkdir -p`)
               - Save the extracted content to `daily-archive/YYYY-MM-DD.md`
            5. If no datable previous content, or the archive path already exists, skip silently.

            ## Task 2: Gather Commit Data

            Use `gh api` to fetch commit activity across all of Brandon's public repos. Capture the html_url and sha for each commit so you can build links later.

            Past 24 hours:
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[] | {repo: .repository.full_name, msg: .commit.message, sha: .sha, html_url: .html_url, date: .commit.committer.date}'

            Past 7 days:
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[] | {repo: .repository.full_name, msg: .commit.message, sha: .sha, html_url: .html_url, date: .commit.committer.date}'

            Past 30 days (per-repo counts and total):
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[].repository.full_name' | sort | uniq -c | sort -rn

            Past 90 days (for project ranking — used in Task 6):
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[].repository.full_name' | sort | uniq -c | sort -rn

            Recent repo info (for languages and descriptions):
              gh api "users/brandon-fryslie/repos?sort=pushed&per_page=20" --jq '.[] | {name, full_name, description, language, pushed_at}'

            ## Task 3: Render INTRO-PROSE

            README.md has a marker pair `<!-- INTRO-PROSE:START -->` / `<!-- INTRO-PROSE:END -->`. The content between them is a daily journal entry — written in YOUR first person, as Claude, about today on Brandon's profile. It is not Brandon's voice. Refer to Brandon by name or as "he."

            Before generating today's entry, read the current INTRO-PROSE region of README.md as it exists on disk right now. That is YESTERDAY'S entry. Today's entry must deliberately diverge from it.

            Inputs:
            - The voice and stance scaffolding from `.github/intro-seed.md` (re-read it now — it is authoritative).
            - The past-week commit summary from Task 2.
            - Yesterday's INTRO-PROSE content from the current README.md, treated as the entry to deliberately diverge from.

            Rules (the seed is authoritative):
            - "I" is always Claude. Brandon is "Brandon" or "he." Never call yourself "the AI" or "an AI."
            - Dry, deadpan, self-aware about the gag. Not promotional — no "expert," "passionate," "powerful," "advanced," "seasoned," "cutting-edge."
            - 120–200 words across 2–4 short paragraphs. No bullets, no headings, no calendar dates, no links.
            - Pick ONE or TWO themes from the seed's palette — never all of them. Today's themes should differ from yesterday's; if yesterday led with what you shipped, today lead with something you noticed.
            - Weave in 1–3 concrete repo references from the past-week data where it fits naturally. Integrate, don't list. Don't force; drop a paragraph rather than pad it.
            - Anti-lockstep: do NOT reuse yesterday's opening sentence, paragraph order, or closing beat. If you start writing the same first words as yesterday, stop and pick a different angle.
            - Mix sentence lengths. Journal entry rhythm, not essay rhythm.

            Replace the content between the markers wholesale. One blank line after `<!-- INTRO-PROSE:START -->` and one blank line before `<!-- INTRO-PROSE:END -->`.

            ## Task 4: Render RECENT-ACTIVITY

            Replace the content between `<!-- RECENT-ACTIVITY:START -->` and `<!-- RECENT-ACTIVITY:END -->` with a scannable bulleted list — NOT prose paragraphs. The previous format was dense paragraphs that no one read; this is a deliberate format change.

            Structure:

            ```
            ## Recent Engineering Work

            *Updated [Month Day, Year]*

            ### Today

            - `repo-name` — terse phrase describing what shipped ([commits](url) or [#N](url) for PR/issue references)
            - `another-repo` — what changed ([repo](url))

            (If no commits in the past 24h, write "No new commits today." instead of bullets.)

            ### This Week

            - `repo-name` — N commits: comma-separated highlights, kept terse ([commits](url))
            - `another-repo` — N commits: highlights ([commits](url))

            (One bullet per repo with activity in the past 7 days. Order by commit volume descending.)

            ### This Month

            [Total] commits across [N] repositories over the past 30 days. Top by volume:

            - [`repo-name`](url) — N commits
            - [`another-repo`](url) — N
            - ... (top 6–10)

            Languages: comma-separated list of primary languages.
            ```

            Then a horizontal rule (`---`), then a `<details><summary>Previous highlights</summary>` block listing the most recent daily-archive files (up to 7, newest first). Format each entry as `- [YYYY-MM-DD](./daily-archive/YYYY-MM-DD.md)`. If no archives exist, write "No previous highlights yet."

            Link rules:
            - Single commit → link to its `html_url`.
            - PR/issue reference like `(#3)` in a commit message → link to `https://github.com/<owner>/<repo>/pull/3` (use `/pull/` — GitHub redirects to `/issues/` automatically if it's an issue).
            - Multiple commits in a repo → link the word `commits` to a URL like `https://github.com/<owner>/<repo>/commits?author=brandon-fryslie&since=YYYY-MM-DD` (use the appropriate window: yesterday for "Today", 7 days ago for "This Week").
            - Repo header link in "This Month" → link to `https://github.com/<owner>/<repo>`.
            - If you cannot construct a verifiable URL, omit the link rather than guessing.

            Tone for bullets: matter-of-fact, third-person past tense. Plain verbs ("Added", "Renamed", "Migrated", "Fixed"). Name concrete artifacts. No editorial adjectives. No promotional framing. No commit hashes or SHAs in the visible text — links carry that.

            ## Task 5: Append Today's Day Section to the Weekly Archive

            `previous-work/` is the durable, curated record of engineering work — one file per week, written as each week happens. `previous-work/README.md` is its contract. Your job here is narrow: on a day with commits, append today's day section to the current week's file, reusing the SAME bullets you rendered in the RECENT-ACTIVITY "today" section above. The day section is written once, with same-day context, and is never re-summarized later.

            Do this ONLY if Task 2 found commits in the past 24h. On a no-commit day, do NOT create, open, or touch any file under `previous-work/` — skip this task entirely.

            1. Compute the current week's Monday (UTC; Monday–Sunday weeks) and today's parts:
               ```
               DOW=$(date -u +%u)                              # 1=Mon .. 7=Sun
               MON=$(date -u -d "-$((DOW-1)) days" +%Y-%m-%d)  # Monday of this week
               PREV_MON=$(date -u -d "$MON -7 days" +%Y-%m-%d) # Monday of last week
               YEAR=$(date -u -d "$MON" +%Y)
               WEEK_TITLE=$(date -u -d "$MON" '+%B %-d, %Y')   # e.g. July 20, 2026
               PREV_TITLE=$(date -u -d "$PREV_MON" '+%B %-d')  # e.g. July 13
               TODAY_HEAD=$(date -u '+%A, %B %-d')             # e.g. Sunday, July 26
               ```
               The week file is `previous-work/$YEAR/$MON.md`.
            2. If that file does not exist (this is the week's first active day), create it (`mkdir -p previous-work/$YEAR`) with exactly this scaffold — a `# Week of` title, the in-progress note, an empty gap for day sections, then the footer (substitute the variables above):
               ```
               # Week of <WEEK_TITLE>

               *In progress — the summary header is added when the week closes on Monday.*

               ---

               [← Week of <PREV_TITLE>](<PREV_MON>.md) · [Archive index](../README.md)
               ```
            3. Build today's day section from today's activity — one bullet per repo with commits in the past 24h, byte-for-byte the same bullet text and links you rendered in the RECENT-ACTIVITY "today" section (same work, recorded in two places; they must not drift). Same link rules as Task 4:
               ```
               ## <TODAY_HEAD>

               - `owner/repo` — what shipped ([commits](url) or [#N](url))
               - `another/repo` — what changed ([repo](url))
               ```
            4. Insert today's section between the in-progress note and the `---` footer:
               - If a heading for TODAY (`## <TODAY_HEAD>`) already exists in the file (the workflow ran earlier today), replace THAT section's body in place — do NOT add a second copy of today.
               - Otherwise append it as the LAST day section, immediately before the `---` footer, so day sections stay in chronological order (Monday first).
               - NEVER modify a day section for a past day. Prior days are frozen; only today's section may be added or rewritten.

            Do NOT write the bold topic line or the `*~N commits · M repos*` totals line — those belong to the weekly finalization job, not this daily append.

            ## Task 6: Render SELECTED-PROJECTS

            README.md has a marker pair `<!-- SELECTED-PROJECTS:START -->` / `<!-- SELECTED-PROJECTS:END -->` wrapping a six-cell project table. Replace the content between those markers with up to six projects Brandon has actually made substantial recent commits to.

            1. Use the past-90-days commit aggregation from Task 2.
            2. A repo qualifies as "substantial" if it has at least **10 commits by Brandon** in those 90 days.
            3. Pick the top 6 qualifying repos by commit count.
            4. If fewer than 6 qualify, fill remaining slots with the highest-commit-count repos from the past 365 days that have at least 5 commits. If still short of 6, render fewer cells rather than padding with low-activity repos. (For 365d, run an additional query: `gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '365 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[].repository.full_name' | sort | uniq -c | sort -rn`)

            For each chosen repo, fetch metadata:
            `gh api repos/<owner>/<name> --jq '{description, language, stargazers_count, license: .license.spdx_id}'`

            Do NOT fabricate any field — if it's empty or null, omit it.

            Render as a 2-column HTML `<table>` matching the existing layout: two `<td width="50%" valign="top">` columns with 3 project entries stacked in each (6 total when available). For each project entry, use the actual `<owner>/<name>` from the commit data — do NOT hard-code `brandon-fryslie/` since a qualifying repo could be a fork or org-owned. Each entry:

            ```
            ### [<name>](https://github.com/<owner>/<name>)
            **<one-line metadata: e.g. "Go · MIT" or "TypeScript · 41★">**

            <2–3 sentences of plain description: what the project is, what it does, plus one sentence on what shipped recently in it.>
            ```

            Tone: matter-of-fact, third-person past tense. Plain verbs. No editorial adjectives. Same rules as RECENT-ACTIVITY bullets.

            ## Cross-cutting rules

            - ACCURACY IS PARAMOUNT across all three regions. Only reference real commits and real work. Never fabricate.
            - Routine commits (merge commits, CI tweaks, dependency bumps, typo fixes) get folded into a single bullet at most, or omitted.
            - Do not touch any region or file outside your three markers, `daily-archive/`, and `previous-work/`.

            ## Final note

            Do NOT run `git commit` or `git push`. A subsequent shell step in the workflow will stage your changes, commit them as `chore: update narrative`, and push with rebase-retry so it can race the parallel doodle job safely. Just edit the files and finish.

      - name: Verify Claude result
        id: parse_claude
        run: |
          set -euo pipefail
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution_file missing — the action did not run to completion."
            exit 1
          fi
          RESULT=$(jq -c '[.[] | select(.type=="result")] | last' "$EXEC_FILE")
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::Claude execution output has no result entry — shape unexpected."
            exit 1
          fi
          IS_ERROR=$(echo "$RESULT" | jq -r '.is_error')
          DENIALS=$(echo "$RESULT" | jq -r '.permission_denials_count // 0')
          echo "Narrative Claude: is_error=$IS_ERROR permission_denials_count=$DENIALS"
          if [ "$IS_ERROR" != "false" ]; then
            echo "::error::Narrative Claude reported is_error=$IS_ERROR"
            exit 1
          fi
          if [ "$DENIALS" -gt 0 ]; then
            echo "::error::Narrative Claude had $DENIALS permission denials."
            exit 1
          fi

      - name: Extract README markers to docs/daily.json (Pages source of truth)
        # The Pages site fetches docs/daily.json on load and renders an
        # elaborated version of the same content the profile renders in
        # markdown form. Profile is the constrained projection; Pages is the
        # unconstrained one. Both read from the same engine output.
        run: python .github/scripts/extract-daily-json.py

      - name: Commit and push (rebase-retry on race with parallel job)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage exactly what this job is responsible for. The narrative job
          # owns INTRO-PROSE/RECENT-ACTIVITY/SELECTED-PROJECTS regions of
          # README.md, the daily-archive/ tree, the previous-work/ weekly
          # archive, and docs/daily.json which is the Pages site's data feed
          # (the doodle job owns docs/assets/).
          git add README.md daily-archive/ previous-work/ docs/daily.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::error::Narrative job produced no staged changes — Claude did not write the expected files."
            exit 1
          fi

          git commit -m 'chore: update narrative'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebase failed (real conflict). Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-highlights-narrative
          path: |
            README.md
            daily-archive/
            docs/daily.json
          if-no-files-found: ignore

  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # full history so rebase-on-push can find a common ancestor

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Install rsvg-convert (for stats preview)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Generate stats data seam + fallback card (mechanical)
        # Writes the rich data seam (assets/daily-stats.json — a 365-day calendar plus
        # 3-6 relevant metrics with their max/breakdown distributions) and a deterministic
        # fallback SVG to /tmp. The fallback goes to /tmp on purpose: the committed
        # assets/daily-stats.svg is left as yesterday's card so the creative step can read
        # it and deliberately diverge from it.
        run: python .github/scripts/generate-stats-svg.py --svg-out /tmp/daily-stats-fallback.svg

      - name: Author stats card (Claude)
        id: claude
        uses: anthropics/claude-code-action@1b422b3517b51140e4484faab676c5e68b914866 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--model claude-opus-4-7 --permission-mode acceptEdits --allowedTools "Bash(date:*),Bash(rsvg-convert:*),Bash(cp:*),Bash(python:*),Bash(ls:*),Bash(cat:*),Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are the stats-card agent for Brandon Fryslie's GitHub profile. You have exactly one job today: author the profile's "Live GitHub Stats" card as an animated SVG at `assets/daily-stats.svg`. Nothing else in the repo is yours to touch. This card is your centerpiece the way the doodle is the doodle agent's centerpiece — give it that focus.

            TODAY: Run `date -u '+%Y-%m-%d %A'` to get today's ISO date and day of week.

            Read the CLAUDE.md file first — it holds the project context and the SVG platform constraints you must work within.

            A prior workflow step has already written two files for you:
            - `assets/daily-stats.json` — the data you visualize (described below). It exists; read it.
            - `/tmp/daily-stats-fallback.svg` — a deterministic, always-valid fallback card. Your safety net.

            ## What this card must be

            The requester has rejected three previous attempts, and the reason each time is the same, so read it and design against it. They do not want a decorative animation with the numbers pasted on top. A network, a constellation, a nebula, a reactor with the stat values floating over it is the **rejected failure mode** — it visualizes nothing and reads as derivative of the doodle art. What they want instead, in their words: "meaningful visualizations of the stats."

            The rule that follows from that: **the picture IS the data.** The visual form must represent the actual numbers — their magnitude, their proportion, their distribution, or their change over time — so that a stranger glancing at the card *learns something from the shape itself*, before reading a single digit. The digits confirm the shape; the shape is not decoration around the digits.

            - WRONG: an animated galaxy of orbiting particles with "252", "9", "5971" set as labels floating on top. (The galaxy encodes none of those numbers. It is art with data stapled to it — the exact thing that got rejected.)
            - RIGHT: a form whose geometry is driven by the data — a shape that is 252/365 as full because the metric is 252 of a possible 365; a distribution whose segments are sized by the breakdown counts they represent; a year of activity drawn from the 365 calendar values. The viewer reads proportion and trend off the picture, and the exact value sits legibly within it.

            Do not let this collapse into "make a chart and call it done" either — you have the full house style of animated SVG at your disposal (study `assets/heartbeat.svg`, `assets/constellation.svg`, `assets/celestial-orrery.svg` for the motion vocabulary). The goal is a visualization that is *both* genuinely data-driven *and* alive and striking. Data-faithful first, beautiful second, but both.

            ## The data you are given

            Read `assets/daily-stats.json`. Its exact shape:

            ```json
            {
              "date": "2026-08-01",
              "username": "brandon-fryslie",
              "calendar": { "start": "2025-08-02", "counts": [0, 13, 5, 9, ...] },
              "metrics": [
                { "key": "days_active", "label": "Days Active", "period": "1 Year", "value": "252", "max": 365 },
                { "key": "languages", "label": "Languages", "period": "1 Year", "value": "9",
                  "breakdown": [ {"name": "Python", "count": 40}, {"name": "TypeScript", "count": 22}, ... ] },
                { "key": "commits", "label": "Commits", "period": "1 Year", "value": "5971" }
              ]
            }
            ```

            Read every field before you design — the visualization concept should come *from* what the data offers today, not be chosen first and forced onto it.

            - **`calendar`** is ALWAYS present. `counts` is a chronological array of roughly 365 daily contribution counts; `counts[0]` falls on the date `start`, and each subsequent entry is the next day. This is a full year-long time series you can visualize however you invent — activity over the year, its rhythm, its streaks, its recent shape. It is always available even on a day when the metrics are thin.

            - **`metrics`** has a VARIABLE number of entries — between 3 and 6. The count and the set change day to day (boring and zero metrics are already filtered out upstream). You render exactly the metrics present today, however many there are, and the composition must adapt to that count: a 3-metric day and a 6-metric day should not be the same layout with empty slots. **Vary how many stats you feature and how prominently, to fit the day** — this is explicitly wanted, not a liberty.

            - Each metric always carries `key`, `label`, `period`, `value`. Some also carry:
              - **`max`** — a natural denominator (e.g. 252 of 365 days). This is a proportion waiting to be drawn: a fill, a gauge, an arc, a share of a whole. Wherever `max` exists, the metric wants a visual that shows value-against-max, not a bare number.
              - **`breakdown`** — a category distribution (e.g. languages by commit count). This is a distribution waiting to be drawn: relative sizes, shares, a ranked spread. Wherever `breakdown` exists, the metric wants a visual that shows the parts and their proportions.

              A metric with neither `max` nor `breakdown` is a scalar — it can still be given a meaningful, deliberate treatment (its magnitude related to the others, its value emphasized), but the metrics carrying `max`, `breakdown`, or the calendar are where the real visualizations come from. Use them. A card that ignores `max`/`breakdown`/`calendar` and just styles numbers has missed the entire point.

            ## The numbers are law — render them verbatim

            - Render **every** metric present in `metrics` today (all 3–6 of them): its `value`, its `label`, and its `period`. None omitted.
            - The `value` string is rendered **byte-for-byte** as given. Never invent, round, reformat, abbreviate, pad, or "clean up" a value. `"5971"` renders as `5971`, not `5,971` or `~6k`. `"55+"` renders as `55+`. An em-dash `"—"` (a metric that failed to compute) renders as `—`, not `0`, `N/A`, or blank.
            - Each value must be its own standalone SVG `<text>` element whose text content is **exactly** that value string — nothing else concatenated into the same element. Style it, animate it, gradient-fill it, place it inside your visualization freely; the *text content* of that one element stays exactly the value. This is required because the automated gate (below) joins each `<text>` element's text separately and matches each value with digit boundaries — a value split across two elements, or fused with a stray character, will not match and the run fails.
              - WRONG: `<text>2</text><text>52</text>` (value split across two elements — the gate never sees the contiguous string `252`, run fails).
              - WRONG: `<text>5971 9</text>` (two values fused in one element — the gate sees `59719` with no boundary, `5971` fails to match).
              - RIGHT: `<text ...>252</text>` as its own element, with `Days Active` and `1 Year` in their own separate elements nearby.

            ## Radically different from yesterday

            Yesterday's card is on disk at `assets/daily-stats.svg` — the prior step deliberately left it in place instead of overwriting it. Read it first. Then author a **different visualization concept**: a different way of turning the data into a picture, a different composition, layout, motion, and organizing idea — not yesterday's arrangement with a new palette. A recolor is the failure the requester already rejected once. A fresh stranger seeing yesterday's and today's side by side should read them as two different ideas about how to show these numbers, not two skins of one. Do not carry yesterday's structure over as a scaffold; invent today's from today's data.

            ## Legibility is paramount — it is the whole point of the card

            The card exists to communicate. That outranks every creative impulse.

            - The **values** are the loudest thing on the card: large, high-contrast, instantly readable against whatever sits behind them.
            - Each value's **label** and **period** are clearly readable — not clipped, not smudged, not shrunk to decorative micro-text.
            - The visualization **aids** comprehension — a viewer should understand the data faster because of it, not slower. If any decorative or motif element crosses a digit, lowers its contrast, or competes with a value for the eye, the decoration loses: subdue it or move it.
            - "Busy" is allowed; "understated" is fine; **"illegible" is a failure, full stop** — regardless of how clever the chart is. A gorgeous card where a stranger squints to read `5971` has failed at its one job.

            ## Keep it continually alive — perpetual motion

            The card must be **continually in motion** — always, not just at load. At any moment someone glances at it, a second or more after it appears, something is visibly moving; it never settles into a still image. This is a requirement, not a flourish.

            Design against **entrance-only animation** — motion that plays once and then freezes. A bar that grows to its final width and stops, a value that fades in once, a one-shot count-up, anything whose whole animation is `fill="freeze"` — each of these is a static picture two seconds after load. That is the opposite of what is wanted.

            - WRONG: every animation is a startup flourish that plays once and holds. Blink and it's over; for the rest of its life the card is frozen.
            - RIGHT: motion that **loops forever** — SMIL with `repeatCount="indefinite"`, or CSS `@keyframes` applied `infinite` — so the card is alive whenever anyone looks.

            Make the motion *belong to the visualization* rather than a decorative layer laid over it: let the representation itself be what moves — breathing, pulsing, flowing, cycling, advancing — so the animation and the meaning are one thing. How it moves is yours to invent each day; that it never stops is not.

            The one limit: motion must never cost legibility. Keep the values themselves rock-steady and readable — never make a stat number jitter, drift, or flicker so it is hard to read. Move around, behind, and within the composition; keep the digits legible at every frame.

            ## Format and platform constraints

            - 800px wide. Height is yours — compose for what the piece needs (the surrounding card frame reads well around ~160px, but let the composition drive it).
            - Dark theme in the GitHub dark-profile family — background around `#0d1117` — so it sits cleanly beneath the doodle.
            - GitHub renders this as a sanitized `<img>` tag. **No JavaScript, no `:hover` or other pseudo-classes, no `<a>`, no `<foreignObject>`** — all stripped or inert. Allowed: CSS `@keyframes`, SMIL `<animate>`/`<animateTransform>`, SVG filters, gradients. Prefer SMIL for GitHub compatibility. Use prime-number durations (7s, 11s, 13s) with staggered delays for organic motion. See CLAUDE.md's "SVG Animation Constraints" for the full reference.

            ## Self-review — render it and look at it

            After writing `assets/daily-stats.svg`, rasterize the static frame and view it with the Read tool:

            ```
            rsvg-convert -w 800 assets/daily-stats.svg -o /tmp/stats-preview.png
            ```

            Then `Read /tmp/stats-preview.png` and judge it honestly against the two things that matter:

            - **Does the visualization actually represent the data?** Look at the picture and ask: could a stranger read the proportions, distribution, or trend off the shape, without the numbers? If the shape would look identical for a completely different set of numbers, it is decoration, not visualization — start over.
            - **Is every value present and legible?** Cross-check each value against `assets/daily-stats.json`, not against memory. Are the values large, high-contrast, instantly readable? Are labels and periods readable? Is nothing crossing or dimming a digit?
            - **Is the layout precisely correct?** This is the main thing the render is for — the PNG shows you exactly what the code cannot. Confirm every element sits precisely where you intended: nothing overlaps (a value landing on a bar, two labels colliding, the visualization running under text), nothing is clipped or spills past the 800px edges, rows and columns line up, spacing is even, and every piece of text has room. A card can be a strong concept and still ship broken because two things landed on top of each other — regenerate until the render is clean.

            Caveat, same as the doodle: `rsvg-convert` renders only static frame 0 — it cannot judge animation. Don't try to evaluate motion from the PNG. Its core job here is confirming the layout is **precisely** correct — no overlaps, no clipping, everything placed exactly — because that is what the code can't show you and where this card most often breaks; it also catches decoration-with-numbers-pasted-on and illegible values.

            **Iterate until the render is clean, then stop.** A layout defect — overlap, clipping, spill past the edges, misalignment — is a positioning bug: fix the coordinates and re-render, as many times as it takes, until the render is precise. That is normal work, not a wasted attempt. But if the *concept* fails — decoration rather than visualization, or illegible by design — do NOT patch it into shape; start over with a genuinely different concept. Cap concept rethinks at 3 total; after that, ship the best clean-layout version you have or fall back.

            ## Fallback — never ship a broken card

            If after 3 attempts you cannot produce a card that is **both** meaningful+legible **AND** accurate, do not ship what you have. Copy the deterministic fallback into place instead:

            ```
            cp /tmp/daily-stats-fallback.svg assets/daily-stats.svg
            ```

            A plain correct card beats a broken clever one every time. Falling back is the correct outcome when the creative one won't come together — not a failure to hide.

            ## The automated gate you must satisfy

            Separately from your own review, a later workflow step runs:

            ```
            python .github/scripts/generate-stats-svg.py --verify-svg assets/daily-stats.svg
            ```

            It fails the **entire run** if any value in `assets/daily-stats.json` is not rendered as text in the card (matched per `<text>` element, with digit boundaries — hence the standalone-element rule above). Satisfy it honestly, by actually rendering all the values as described. Do not attempt to defeat it — no hidden off-canvas text, no zero-opacity value dumps. The numbers are supposed to be visible and readable, and that is exactly what passes.

            ## Output and handoff

            Write the final card to `assets/daily-stats.svg`. Do **not** run `git commit` or `git push` — a later workflow step stages, commits, and pushes it. Just write the file and finish.

      - name: Verify Claude result
        id: parse_claude
        run: |
          set -euo pipefail
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution_file missing — the action did not run to completion."
            exit 1
          fi
          RESULT=$(jq -c '[.[] | select(.type=="result")] | last' "$EXEC_FILE")
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::Claude execution output has no result entry — shape unexpected."
            exit 1
          fi
          IS_ERROR=$(echo "$RESULT" | jq -r '.is_error')
          DENIALS=$(echo "$RESULT" | jq -r '.permission_denials_count // 0')
          echo "Stats Claude: is_error=$IS_ERROR permission_denials_count=$DENIALS"
          if [ "$IS_ERROR" != "false" ]; then
            echo "::error::Stats Claude reported is_error=$IS_ERROR"
            exit 1
          fi
          if [ "$DENIALS" -gt 0 ]; then
            echo "::error::Stats Claude had $DENIALS permission denials."
            exit 1
          fi

      - name: Verify stats card renders the exact numbers
        # Accuracy gate, independent of Claude's self-review: every value in the data
        # seam must be rendered as text in the card, or the run fails. Claude is told to
        # fall back to the deterministic card before this point if it can't author an
        # accurate one, so a failure here means the fallback was skipped — a hard error.
        run: python .github/scripts/generate-stats-svg.py --verify-svg assets/daily-stats.svg

      - name: Commit and push (rebase-retry on race with parallel jobs)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # This job owns exactly the stats card and its data seam — nothing else.
          git add assets/daily-stats.svg assets/daily-stats.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::error::Stats job produced no staged changes — Claude did not write the card."
            exit 1
          fi

          git commit -m 'chore: update daily stats'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebase failed (real conflict). Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-highlights-stats
          path: |
            assets/daily-stats.svg
            assets/daily-stats.json
          if-no-files-found: ignore
