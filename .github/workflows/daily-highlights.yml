name: Daily Engineering Highlights

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Manual trigger for testing

jobs:
  highlights:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Generate stats SVGs (mechanical)
        run: python .github/scripts/generate-stats-svg.py

      - name: Generate highlights with Claude (creative)
        uses: anthropics/claude-code-action@1b422b3517b51140e4484faab676c5e68b914866 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are updating Brandon Fryslie's GitHub profile README with daily engineering highlights.

            TODAY: Run `date -u '+%Y-%m-%d %A'` to get today's ISO date and day of week (e.g., "2026-03-17 Monday"). Use the day of week for accent color selection.

            Read the CLAUDE.md file first for SVG constraints and project context.

            The stats SVGs (assets/daily-stats.svg and assets/tech-constellation.svg) have already been regenerated by a prior step. Do not touch those files.

            ## Task 1: Archive Previous Highlights

            1. Read README.md and extract content between `<!-- RECENT-ACTIVITY:START -->` and `<!-- RECENT-ACTIVITY:END -->`
            2. Look for a date in the extracted content — match both "Updated ..." and "Last updated ..." patterns (e.g., "Updated March 17, 2026" or "Last updated February 18, 2026")
            3. Convert the found date to ISO format (YYYY-MM-DD) for the archive filename
            4. If a date was found and `daily-archive/YYYY-MM-DD.md` doesn't already exist:
               - Create `daily-archive/` directory if needed
               - Save the extracted content to `daily-archive/YYYY-MM-DD.md`
            5. If no datable previous content or archive already exists, skip

            ## Task 2: Gather Commit Data

            Use `gh api` to fetch commit activity across all of Brandon's public repos.

            Past 24 hours:
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[] | {repo: .repository.full_name, msg: .commit.message, date: .commit.committer.date}'

            Past 7 days:
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '.items[] | {repo: .repository.full_name, msg: .commit.message, date: .commit.committer.date}'

            Past 30 days (count and repos — use --paginate to capture all pages):
              gh api "search/commits?q=author:brandon-fryslie+committer-date:>$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=100&sort=committer-date" --paginate --jq '{total: .total_count, repos: [.items[].repository.full_name]}' | jq -s '{total: (.[0].total // 0), repos: [.[].repos[]] | unique}'

            Recent repo info:
              gh api "users/brandon-fryslie/repos?sort=pushed&per_page=10" --jq '.[] | {name, description, language, pushed_at}'

            ## Task 3: Create Daily SVG

            Create an original, artistic animated SVG at `assets/daily-highlight.svg` (800x140px). This is the creative centerpiece — make it visually striking and unique each day.

            Design constraints (GitHub renders SVGs as <img> tags):
            - NO JavaScript (stripped by GitHub sanitizer)
            - No :hover or other pseudo-classes (no events in <img> context)
            - No <foreignObject> or <a> links (stripped)
            - Use CSS @keyframes and/or SMIL <animate>/<animateTransform> for animation
            - Use prime-number durations (7s, 11s, 13s) with staggered delays for organic feel
            - font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif

            Design direction:
            - Dark background (#0d1117) matching the profile aesthetic
            - Display today's date prominently in clean, modern typography
            - Include a subtle tagline derived from the actual commits (e.g., "compiler pipelines & auth gateways" or "SVG animations & shell tooling")
            - Think of it as an engineering journal entry header — elegant, minimal, but with personality
            - Vary accent colors by day of week:
              Mon=#58a6ff, Tue=#3fb950, Wed=#d29922, Thu=#f78166, Fri=#bc8cff, Sat=#79c0ff, Sun=#56d364
            - Add subtle animated elements: pulsing dots, drifting lines, breathing glows, traveling particles
            - Be creative with the composition — this should look handcrafted, not templated

            Study the existing SVGs in assets/ (e.g., atelier-banner.svg, vision.svg, tech-constellation.svg) for style reference. Match their quality.

            ## Task 4: Update README

            In README.md, find the `<!-- RECENT-ACTIVITY:START -->` and `<!-- RECENT-ACTIVITY:END -->` markers. Keep both markers exactly as they are. Replace ONLY the content between them (do not duplicate or remove the markers themselves). The new content between the markers should be:

            An h2 heading "Recent Engineering Work"

            An italic line with "Updated [full date]"

            A centered div with an img tag pointing to ./assets/daily-highlight.svg, width 800

            An h3 "Today" section: 1-3 sentences summarizing the last 24 hours. What was built and why it matters. If no commits, write "No new commits today."

            An h3 "This Week" section: 2-5 sentences covering 7 days. Group by project or theme. Highlight technical depth, architecture decisions, tooling work.

            An h3 "This Month" section: 2-4 sentences with the broader 30-day narrative. What themes emerge? What problems is Brandon solving? Emphasize versatility and judgment.

            A horizontal rule, then a details/summary block titled "Previous highlights" containing links to the most recent daily-archive files (up to 7, newest first). Format each as [YYYY-MM-DD](./daily-archive/YYYY-MM-DD.md). If no archives exist, write "No previous highlights yet."

            ### Writing Guidelines

            - ACCURACY IS PARAMOUNT. Only reference real commits and real work. Never fabricate.
            - Third person voice: "Implemented...", "Architected...", "Refined..."
            - Subtly promotional: position Brandon as a thoughtful, capable senior engineer
            - Show technical depth without being verbose
            - If commits are routine (merge commits, CI updates), characterize honestly without inflating
            - Keep scannable — employers skim profiles
            - Do NOT include commit hashes or SHAs

            ## Task 5: Commit and push

            After all file changes are complete, commit and push:
            ```
            git add README.md assets/*.svg daily-archive/
            git commit -m 'chore: update daily engineering highlights'
            git push
            ```

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-highlights
          path: |
            README.md
            assets/daily-highlight.svg
            assets/daily-stats.svg
            assets/tech-constellation.svg
            daily-archive/
          if-no-files-found: ignore
