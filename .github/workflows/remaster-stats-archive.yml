name: Remaster Stats Archive

# Replace deterministic-era cards in `stats-archive/` with cards authored from the same
# day's real data. Dispatch-only: this rewrites history's pictures, so it runs when asked
# and never on a schedule.
#
# One matrix job per card. Each reconstructs that day's numbers with
# `generate-stats-svg.py --as-of`, hands them to the stats-card agent under the exact
# prompt the daily job uses (.github/prompts/stats-card.md — one source of truth for the
# card's creative direction), gates the result, drops it into that day's archive slot,
# and pushes. A final `gallery` job re-renders STATS.md once, after them all.
#
# Run it:
#   gh workflow run remaster-stats-archive.yml -f limit=8
#   gh workflow run remaster-stats-archive.yml -f stamps='2026-03-01-062057 2026-03-02-062619'
#
# Re-running is how you make progress: a remastered slot stops being a candidate, so each
# run picks up where the last one stopped and a failed card is simply retried by the next
# run. `limit` is how many cards one dispatch attempts; `max-parallel` below is how many
# of them run at once. Sizing a dispatch is a question of how long you want to leave it
# unattended and how much agent work you want in flight — not of correctness.
#
# Why the remaster jobs may run concurrently: each one stages exactly the two files of its
# own slot — `archive` reports them, nothing globs for them — and no two slots share a
# path, so the rebase-retry push loop can never hit a real conflict between them. That is
# the same property that lets daily-highlights.yml's three jobs race. Regenerating STATS.md
# is the one write they would all have shared, so it is not theirs: it moved to `gallery`,
# which runs once when the tree is final. [LAW:one-source-of-truth]

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many cards to remaster in this run (matrix ceiling is 256)'
        required: false
        default: '8'
      stamps:
        description: 'Space-separated archive stamps (YYYY-MM-DD-HHMMSS) to target instead of the newest pending'
        required: false
        default: ''

# Shared with daily-highlights.yml and weekly-archive.yml on purpose: this job writes
# stats-archive/ and STATS.md, which the daily `stats` job also writes. Two runs holding
# different ideas of the archive tree must never overlap.
concurrency:
  group: daily-highlights
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      stamps: ${{ steps.pick.outputs.stamps }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # master, not the dispatch SHA — the same reason `gallery` below needs it, and
          # the more expensive one to get wrong. Which slots are pending is read off the
          # archive tree, and this run may have sat in the shared concurrency queue behind
          # another one that remastered dozens of them. Selecting against the tree as it
          # stood at dispatch hands those finished slots to the matrix again: the jobs all
          # pass, each burning a full agent invocation to overwrite a card that was
          # already authored. Twenty of them did exactly that before this was caught.
          ref: master

      - name: Pick the slots to remaster
        id: pick
        env:
          # Through the environment, never interpolated into the script body: a workflow
          # input is untrusted text, and `${{ }}` inside a run block pastes it in as shell
          # source.
          LIMIT: ${{ inputs.limit }}
          STAMPS: ${{ inputs.stamps }}
        run: |
          set -euo pipefail
          args=(select --limit "$LIMIT")
          for stamp in $STAMPS; do args+=(--stamp "$stamp"); done
          picked="$(python .github/scripts/remaster-stats-card.py "${args[@]}")"
          echo "stamps=${picked}" >> "$GITHUB_OUTPUT"
          echo "Selected: ${picked}" >> "$GITHUB_STEP_SUMMARY"

  remaster:
    needs: select
    if: needs.select.outputs.stamps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false    # one card that won't come together must not cancel the rest
      # Twenty at a time — GitHub's concurrent-job ceiling for a public repo, so this is as
      # wide as the platform goes. Nothing here is throttled for safety: the jobs write
      # disjoint paths (see the header), so width costs nothing but concurrent agent work.
      # Contention is expected and harmless — in the 4-wide validation run two jobs
      # finished 12s apart, both had their first push rejected, and both rebased onto the
      # other and landed on attempt 2. Jobs past the ceiling queue rather than fail.
      max-parallel: 20
      matrix:
        stamp: ${{ fromJSON(needs.select.outputs.stamps) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # the push loop rebases; a shallow clone cannot

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Stage the slot (mechanical)
        # Puts the card this one should diverge from at assets/daily-stats.svg — the path
        # the prompt names — and reports the instant this card's data must describe.
        id: stage
        run: |
          set -euo pipefail
          as_of="$(python .github/scripts/remaster-stats-card.py stage '${{ matrix.stamp }}')"
          echo "as_of=${as_of}" >> "$GITHUB_OUTPUT"
          echo "Remastering ${{ matrix.stamp }} with data as of ${as_of}"

      - name: Reconstruct that day's data seam (mechanical)
        # The same generator the daily job runs, pinned to the archived card's own instant.
        # Fallback card goes to /tmp so the staged divergence target survives at
        # assets/daily-stats.svg.
        run: |
          python .github/scripts/generate-stats-svg.py \
            --as-of '${{ steps.stage.outputs.as_of }}' \
            --svg-out /tmp/daily-stats-fallback.svg

      - name: Load the stats prompt (single source of truth)
        run: |
          {
            echo 'STATS_PROMPT<<STATS_PROMPT_EOF'
            cat .github/prompts/stats-card.md
            echo 'STATS_PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Author stats card (Claude)
        id: claude
        uses: anthropics/claude-code-action@1b422b3517b51140e4484faab676c5e68b914866 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: '--model claude-opus-4-7 --permission-mode acceptEdits --allowedTools "Bash(date:*),Bash(rsvg-convert:*),Bash(cp:*),Bash(python:*),Bash(ls:*),Bash(cat:*),Read,Write,Edit,Glob,Grep"'
          prompt: ${{ env.STATS_PROMPT }}

      - name: Verify Claude result
        run: |
          set -euo pipefail
          EXEC_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "::error::Claude execution_file missing — the action did not run to completion."
            exit 1
          fi
          RESULT=$(jq -c '[.[] | select(.type=="result")] | last' "$EXEC_FILE")
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::Claude execution output has no result entry — shape unexpected."
            exit 1
          fi
          IS_ERROR=$(echo "$RESULT" | jq -r '.is_error')
          DENIALS=$(echo "$RESULT" | jq -r '.permission_denials_count // 0')
          echo "Remaster Claude: is_error=$IS_ERROR permission_denials_count=$DENIALS"
          if [ "$IS_ERROR" != "false" ]; then
            echo "::error::Remaster Claude reported is_error=$IS_ERROR"
            exit 1
          fi
          if [ "$DENIALS" -gt 0 ]; then
            echo "::error::Remaster Claude had $DENIALS permission denials."
            exit 1
          fi

      - name: Verify the card renders the exact numbers
        run: python .github/scripts/generate-stats-svg.py --verify-svg assets/daily-stats.svg

      - name: Move the card into its archive slot (mechanical)
        # Also restores assets/daily-stats.{svg,json} from HEAD, so the commit below holds
        # the archive and nothing else. Fails if the agent fell back to the deterministic
        # card — that is a no-op for a slot that already has one, and archiving it would
        # retire the slot from the pending set without remastering anything.
        #
        # Its stdout is the list of paths it wrote — the staging list for the commit step.
        run: |
          set -euo pipefail
          python .github/scripts/remaster-stats-card.py archive '${{ matrix.stamp }}' \
            --fallback /tmp/daily-stats-fallback.svg > /tmp/remastered-paths.txt
          if [ ! -s /tmp/remastered-paths.txt ]; then
            echo "::error::archive reported no written paths for ${{ matrix.stamp }}."
            exit 1
          fi
          cat /tmp/remastered-paths.txt

      - name: Commit and push (rebase-retry)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Exactly this slot's two files, named by the script that wrote them. Nothing
          # else: the live card and seam were borrowed as the agent's workspace and
          # already handed back, and STATS.md belongs to the `gallery` job. Staging by
          # this list rather than by directory is what makes concurrent remasters safe —
          # two jobs can rebase past each other because they never touch one path.
          git add --pathspec-from-file=/tmp/remastered-paths.txt

          if git diff --cached --quiet; then
            echo "::error::Remaster produced no staged changes for ${{ matrix.stamp }}."
            exit 1
          fi

          git commit -m 'chore: remaster stats card for ${{ matrix.stamp }}'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebase failed (real conflict). Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Upload the remastered card
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remastered-${{ matrix.stamp }}
          path: |
            stats-archive/**/${{ matrix.stamp }}.svg
            stats-archive/**/${{ matrix.stamp }}.json
          if-no-files-found: warn

  gallery:
    # STATS.md is regenerated from the whole archive tree, so it is the one file every
    # remaster would have rewritten. Rendering it once here — after the last card lands —
    # is what frees those jobs to run concurrently.
    #
    # `always()` because a run where some cards failed still improved the tree for the
    # ones that succeeded, and the gallery should describe what is actually on disk.
    # `select` is listed even though `remaster` already depends on it: a transitive need
    # is not in the `needs` context, and the condition below reads it.
    needs: [select, remaster]
    if: always() && needs.select.result == 'success' && needs.select.outputs.stamps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # master, not the dispatch SHA: the cards this job describes were pushed by the
          # matrix jobs after this run started, so checking out `github.sha` would render
          # a gallery of the tree as it stood before any of them landed.
          ref: master
          fetch-depth: 0  # sync-stats-archive.py reads the full card history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Re-render the gallery from the archive tree (mechanical)
        run: python .github/scripts/sync-stats-archive.py

      - name: Commit and push (rebase-retry)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The gallery and any slots the sync filled in from history — this job's paths.
          git add stats-archive STATS.md

          # Unlike a remaster, "nothing changed" is a real outcome here: if every card in
          # this run failed, the tree is what the gallery already described. Success.
          if git diff --cached --quiet; then
            echo "Gallery already matches the archive tree; nothing to commit."
            exit 0
          fi

          git commit -m 'chore: re-render stats gallery'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected — fetching and rebasing."
            git fetch origin master
            if ! git rebase origin/master; then
              echo "::error::Rebase failed (real conflict). Aborting."
              git rebase --abort || true
              exit 1
            fi
            sleep $(( (RANDOM % 4) + 1 ))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
