name: Generate Daily Stats SVG (disabled - replaced by daily-highlights.yml)

on:
  workflow_dispatch:  # Manual trigger only — effectively disabled

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate stats SVG
        run: python .github/scripts/generate-stats-svg.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update daily stats SVGs'
          file_pattern: 'assets/daily-stats.svg assets/tech-constellation.svg'
