name: Update Recent Activity (disabled - replaced by daily-highlights.yml)

on:
  workflow_dispatch:  # Manual trigger only — effectively disabled

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update recent activity section
        run: python .github/scripts/update-recent-activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update recent activity section'
          file_pattern: 'README.md'
