name: Export Claude OAuth (one-time)

# One-time workflow to export CLAUDE_CODE_OAUTH_TOKEN as an encrypted artifact.
# Delete this file after use.

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: 'One-time passphrase for encrypting the output'
        required: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt and upload token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          mkdir -p out

          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "api_key" > out/secret_type.txt
            printf '%s' "$ANTHROPIC_API_KEY" | \
              openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$PASSPHRASE" -out out/secret.enc
            echo "::notice::Encrypted ANTHROPIC_API_KEY"
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "oauth_token" > out/secret_type.txt
            printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | \
              openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:"$PASSPHRASE" -out out/secret.enc
            echo "::notice::Encrypted CLAUDE_CODE_OAUTH_TOKEN"
          else
            echo "::error::Neither secret is set"
            exit 1
          fi

          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: claude-secret
          path: out/
          retention-days: 1
