name: Weekly Archive Finalization

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Monday (YYYY-MM-DD) of the week to finalize. Leave empty for a self-healing scan of the last 4 completed weeks (same as the Monday cron).'
        required: false
        type: string
  schedule:
    # Monday 07:00 UTC — an hour after the daily-highlights 06:00 UTC run, so a
    # new week's doodle/narrative push can't race this job's first checkout.
    - cron: '0 7 * * 1'

concurrency:
  # Shares the daily-highlights group so a finalization run can never race a
  # daily doodle/narrative push — both push to master and use the same
  # rebase-retry loop in finalize-week.yml.
  group: daily-highlights
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # Pure date arithmetic, no repo state needed: decide which Monday(s) the
  # finalize job should attempt. An explicit input targets exactly one week
  # (manual override); no input — whether from the Monday cron or a bare
  # dispatch — scans the last 4 completed weeks, oldest first, so a failed or
  # skipped run self-heals on the next one. Per-week "does it actually need
  # finalizing" stays a single enforcer inside finalize-week.yml.
  resolve-weeks:
    runs-on: ubuntu-latest
    outputs:
      weeks: ${{ steps.candidates.outputs.weeks }}
    steps:
      - name: Compute candidate weeks
        id: candidates
        run: |
          set -euo pipefail
          INPUT_WEEK="${{ inputs.week }}"
          if [ -n "$INPUT_WEEK" ]; then
            WEEKS_JSON=$(jq -nc --arg w "$INPUT_WEEK" '[$w]')
            echo "Explicit target week: $INPUT_WEEK"
          else
            TODAY_DOW=$(date -u +%u)
            THIS_MON=$(date -u -d "-$((TODAY_DOW-1)) days" +%Y-%m-%d)
            W1=$(date -u -d "$THIS_MON -7 days" +%Y-%m-%d)
            W2=$(date -u -d "$W1 -7 days" +%Y-%m-%d)
            W3=$(date -u -d "$W2 -7 days" +%Y-%m-%d)
            W4=$(date -u -d "$W3 -7 days" +%Y-%m-%d)
            WEEKS_JSON=$(jq -nc --arg w1 "$W1" --arg w2 "$W2" --arg w3 "$W3" --arg w4 "$W4" '[$w4, $w3, $w2, $w1]')
            echo "Self-healing scan of last 4 completed weeks, oldest first: $WEEKS_JSON"
          fi
          echo "weeks=$WEEKS_JSON" >> "$GITHUB_OUTPUT"

  # One reusable-workflow call per candidate week, oldest first, one at a
  # time — max-parallel:1 keeps the commit/push sequence serial within this
  # run so pushes never race each other (only the shared concurrency group
  # above needs to guard against OTHER runs). Each call is independently
  # skip-or-finalize; fail-fast:false means one bad week never blocks the
  # rest from self-healing in the same run.
  finalize:
    needs: resolve-weeks
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        week: ${{ fromJson(needs.resolve-weeks.outputs.weeks) }}
    uses: ./.github/workflows/finalize-week.yml
    with:
      week: ${{ matrix.week }}
    secrets: inherit
