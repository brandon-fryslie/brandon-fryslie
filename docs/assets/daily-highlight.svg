<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Discovery of Neptune — 180th Anniversary (September 23, 1846) -->
<!-- about:
On the night of 23 September 1846, at the Berlin Observatory, Johann Gottfried Galle pointed a nine-inch refractor at a patch of sky in Aquarius and, within an hour, found an eighth-magnitude object exactly where a letter from Paris had said it would be. The letter was from Urbain Le Verrier, who had spent months analysing tiny irregularities in Uranus's orbit and calculated, by pure Newtonian mechanics, the position of the planet that must be tugging on it. Neptune became the first world found on paper before it was found in the sky. Galle wrote back four days later: "the planet whose position you have indicated really exists."

The left half is Neptune itself — a deep-blue orb with faint horizontal cloud bands drifting east, a slow-rolling Great Dark Spot, a soft rim-lit crescent, and a starfield behind it. A telescope reticle circles the planet, its crosshair centred, while Le Verrier's perturbation math ghosts faintly across the field. On the right, a large SEPTEMBER 23, 2026 headline anchors a NEPTUNE · 180 YEARS subhead, an italic GALLE · LE VERRIER · BERLIN · 1846 tertiary, a dim PREDICTION · PERTURBATION · OBSERVATION roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 23, 2026 — the 180th anniversary of the discovery of Neptune on September 23, 1846 at the Berlin Observatory. On the left half, Neptune as a large deep-blue orb with faint horizontal cloud bands drifting east, a slow-rolling Great Dark Spot, a soft rim-lit crescent, and a starfield behind it, with a telescope reticle circling the planet and Le Verrier's perturbation math ghosting faintly across the field. On the right, a large cream SEPTEMBER 23, 2026 headline underlined by a deep-blue-to-cyan sweep, a cyan NEPTUNE · 180 YEARS subhead, an italic pale-blue GALLE · LE VERRIER · BERLIN · 1846 tertiary, a dim PREDICTION · PERTURBATION · OBSERVATION roster, and a Georgia-italic 'the planet whose position you have indicated really exists.' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Neptune sphere: lit from upper-left -->
    <radialGradient id="neptuneGrad" cx="0.35" cy="0.32" r="0.82">
      <stop offset="0%"   stop-color="#7ec4ff"/>
      <stop offset="25%"  stop-color="#4a86e0"/>
      <stop offset="60%"  stop-color="#2755aa"/>
      <stop offset="90%"  stop-color="#122c66"/>
      <stop offset="100%" stop-color="#060e28"/>
    </radialGradient>

    <!-- Atmospheric band tint -->
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a8ccff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#c8dcff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a8ccff" stop-opacity="0"/>
    </linearGradient>

    <!-- Sweep underline gradient -->
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#122c66"/>
      <stop offset="50%"  stop-color="#4a86e0"/>
      <stop offset="100%" stop-color="#7ec4ff"/>
    </linearGradient>

    <!-- Rim highlight -->
    <radialGradient id="rimLight" cx="0.28" cy="0.26" r="0.5">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip to Neptune's disk for band motion -->
    <clipPath id="neptuneClip">
      <circle cx="0" cy="0" r="62"/>
    </clipPath>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="planetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="starTwinkle" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Starfield -->
  <g fill="#e6edff" filter="url(#starTwinkle)">
    <circle cx="28" cy="24" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="72" cy="52" r="0.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="18" r="0.9"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="176" r="0.6"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="120" r="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="30" r="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="170" r="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="278" cy="184" r="0.5"><animate attributeName="opacity" values="0.35;0.85;0.35" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="102" cy="180" r="0.4"><animate attributeName="opacity" values="0.3;0.75;0.3" dur="13s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="316" cy="72" r="0.5"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="7s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="14" r="0.6"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="11s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="8" cy="70" r="0.4"><animate attributeName="opacity" values="0.3;0.75;0.3" dur="13s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="188" r="0.5"/>
    <circle cx="196" cy="8" r="0.4"/>
    <circle cx="264" cy="46" r="0.5"/>
  </g>

  <!-- Ghostly Le Verrier perturbation math in the field -->
  <g font-family="'Georgia', 'Times New Roman', serif" font-style="italic" fill="#7ec4ff" opacity="0.14" letter-spacing="0.4">
    <text x="14" y="46" font-size="9">
      &#948;r = &#8721; a&#8345; sin(n&#969;t + &#966;&#8345;)
      <animate attributeName="opacity" values="0.08;0.22;0.08" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="222" y="42" font-size="8">
      &#916;&#955; &#8776; +1&#176;
      <animate attributeName="opacity" values="0.1;0.24;0.1" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="18" y="172" font-size="8">
      &#955; = 326&#176; 32&#8242; (Le Verrier, 31 Aug 1846)
      <animate attributeName="opacity" values="0.08;0.22;0.08" dur="13s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="272" y="152" font-size="7.5">
      a &#8776; 36.15 AU
      <animate attributeName="opacity" values="0.1;0.22;0.1" dur="7s" begin="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ============================== LEFT: NEPTUNE ============================== -->
  <g transform="translate(180,100)">

    <!-- Outer soft halo -->
    <circle r="72" fill="#2755aa" opacity="0.14" filter="url(#planetGlow)"/>
    <circle r="66" fill="#4a86e0" opacity="0.10" filter="url(#planetGlow)"/>

    <!-- Planet body -->
    <circle r="62" fill="url(#neptuneGrad)"/>

    <!-- Atmospheric bands + Great Dark Spot, clipped to disk -->
    <g clip-path="url(#neptuneClip)">
      <!-- Wide moving band shading -->
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="-124 0; 0 0" dur="47s" repeatCount="indefinite"/>
        <!-- Band 1 -->
        <ellipse cx="0" cy="-30" rx="120" ry="4" fill="url(#bandGrad)" opacity="0.55"/>
        <ellipse cx="124" cy="-30" rx="120" ry="4" fill="url(#bandGrad)" opacity="0.55"/>
        <!-- Band 2 (equator, thicker/lighter) -->
        <ellipse cx="0" cy="-6" rx="120" ry="6" fill="url(#bandGrad)" opacity="0.42"/>
        <ellipse cx="124" cy="-6" rx="120" ry="6" fill="url(#bandGrad)" opacity="0.42"/>
        <!-- Band 3 (equator second stripe) -->
        <ellipse cx="0" cy="10" rx="120" ry="3" fill="url(#bandGrad)" opacity="0.28"/>
        <ellipse cx="124" cy="10" rx="120" ry="3" fill="url(#bandGrad)" opacity="0.28"/>
        <!-- Band 4 -->
        <ellipse cx="0" cy="28" rx="120" ry="3.5" fill="url(#bandGrad)" opacity="0.4"/>
        <ellipse cx="124" cy="28" rx="120" ry="3.5" fill="url(#bandGrad)" opacity="0.4"/>
      </g>

      <!-- Great Dark Spot - rolls slowly across the disk -->
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="-90 0; 90 0; -90 0" dur="53s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="-8" rx="14" ry="7" fill="#0e2050" opacity="0.72"/>
        <ellipse cx="-2" cy="-9" rx="6" ry="3" fill="#050e28" opacity="0.6"/>
        <!-- Bright "companion" cloud below dark spot -->
        <ellipse cx="4" cy="4" rx="6" ry="2" fill="#eaf3ff" opacity="0.4"/>
      </g>

      <!-- Secondary small dark spot -->
      <g>
        <animateTransform attributeName="transform" type="translate"
                          values="90 0; -90 0; 90 0" dur="41s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="20" rx="8" ry="3.5" fill="#0e2050" opacity="0.5"/>
      </g>

      <!-- Subtle terminator shadow (right side) -->
      <ellipse cx="26" cy="0" rx="52" ry="62" fill="#050810" opacity="0.34"/>
    </g>

    <!-- Rim light -->
    <circle r="62" fill="url(#rimLight)"/>

    <!-- Fine limb edge -->
    <circle r="62" fill="none" stroke="#7ec4ff" stroke-width="0.5" opacity="0.35"/>

    <!-- Telescope reticle (encircling Neptune from Berlin Observatory eyepiece) -->
    <g stroke="#c9d9ff" stroke-width="0.7" fill="none" opacity="0.55">
      <circle r="78"/>
      <circle r="82" stroke-dasharray="1 3"/>
      <!-- Crosshair extending past the limb -->
      <line x1="-96" y1="0" x2="-70" y2="0" stroke-width="0.6"/>
      <line x1="70" y1="0" x2="96" y2="0" stroke-width="0.6"/>
      <line x1="0" y1="-96" x2="0" y2="-70" stroke-width="0.6"/>
      <line x1="0" y1="70" x2="0" y2="96" stroke-width="0.6"/>
      <!-- Tick marks around the reticle -->
      <g stroke-width="0.6">
        <line x1="55.15" y1="-55.15" x2="58.69" y2="-58.69"/>
        <line x1="-55.15" y1="-55.15" x2="-58.69" y2="-58.69"/>
        <line x1="55.15" y1="55.15" x2="58.69" y2="58.69"/>
        <line x1="-55.15" y1="55.15" x2="-58.69" y2="58.69"/>
      </g>
      <!-- Slow reticle rotation -->
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="97s" repeatCount="indefinite"/>
    </g>

    <!-- Tiny observation label under the reticle -->
    <text x="0" y="102" text-anchor="middle" font-family="'Georgia', serif" font-style="italic"
          font-size="8" fill="#7ec4ff" opacity="0.7" letter-spacing="0.6">
      &#593;: 21&#8341; 53&#7504; &#8226; &#948;: &#8722;13&#176; 24&#8242;
    </text>

    <!-- Discovery-moment pulse: a brief flash at the reticle center to mark "found" -->
    <circle r="3" fill="#eaf3ff" opacity="0" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.55;0.6;0.7;1" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;2;5;10;2" keyTimes="0;0.55;0.6;0.7;1" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Triton — a tiny moon drifting past -->
  <g>
    <circle r="1.8" fill="#c9d9ff" opacity="0.85" filter="url(#softGlow)">
      <animateMotion path="M 300 60 A 130 46 0 0 1 60 140 A 130 46 0 0 1 300 60" dur="43s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============================== RIGHT: TEXT STACK ============================== -->
  <g transform="translate(400,0)">

    <!-- Small orbital insignia top-right (Neptune symbol ♆) -->
    <g transform="translate(348,18)" opacity="0.9">
      <circle cx="10" cy="10" r="11" fill="none" stroke="#4a86e0" stroke-width="0.7" opacity="0.6"/>
      <text x="10" y="14.5" text-anchor="middle" font-family="'Georgia', serif" font-size="14" fill="#7ec4ff">&#9798;</text>
      <animateTransform attributeName="transform" type="translate"
                        values="348 18; 348 17; 348 18" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- Faint bracket rules -->
    <g opacity="0.10" stroke="#7ec4ff" stroke-width="0.6" fill="none">
      <path d="M 20 22 h 40"/>
      <path d="M 20 180 h 30"/>
    </g>

    <!-- Date headline (primary anchor) -->
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" fill="#f2f4fa" letter-spacing="1.1">
      SEPTEMBER 23, 2026
    </text>

    <!-- Sweep underline -->
    <line x1="20" y1="70" x2="362" y2="70" stroke="url(#sweepGrad)" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 342; 220 122; 342 0; 220 122; 0 342"
               keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
    </line>

    <!-- Subhead: NEPTUNE · 180 YEARS -->
    <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.5">
      <tspan fill="#7ec4ff">NEPTUNE</tspan><tspan fill="#f2f4fa"> &#183; 180 YEARS</tspan>
    </text>

    <!-- Tertiary italic -->
    <text x="20" y="117" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#a8c4f5" letter-spacing="0.4">
      GALLE &#183; LE VERRIER &#183; BERLIN &#183; 1846
    </text>

    <!-- Spec roster -->
    <text x="20" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="600" fill="#8b95a5" letter-spacing="2.5" opacity="0.98">
      PREDICTION &#183; PERTURBATION &#183; OBSERVATION
    </text>

    <!-- Caption (Galle to Le Verrier) -->
    <text x="20" y="172" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#d8dfec">
      &#8220;the planet whose position you have indicated really exists.&#8221;
    </text>

    <!-- Pulse indicator — a small cyan node -->
    <circle cx="380" cy="138" r="2.2" fill="#7ec4ff" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
