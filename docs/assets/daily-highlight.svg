<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: National Coffee Day (September 29) -->
<!-- about:
On the last day of September, calendars across the United States mark National Coffee Day — a small commercial holiday that grew from a 2005 promotion into a widely observed date. Coffee itself is older and more mysterious. Legend places its discovery in ninth-century Ethiopia, where the goatherd Kaldi noticed his flock frisking after nibbling a certain shrub. Sufi mystics in Yemen were the first to brew it around the fifteenth century, keeping monks awake through night prayers. It reached Venice in 1615, London in 1652, Vienna in 1683. The world now drinks roughly two billion cups a day; this note is being written under one of them.

The scene is a warm counter at close range. On the left, a ceramic mug of espresso sits with a glowing crema layer and slow curling wisps of steam rising and dissolving above it. In the centre, a large cream SEPTEMBER 29, 2026 headline anchors an amber NATIONAL COFFEE DAY subhead, an italic ETHIOPIA · YEMEN · THE WORLD tertiary, and a Georgia-italic 'one cup, one small ritual' caption. On the right, a small cluster of roasted beans rests on the counter with faint aroma trails rising and a single ripe red coffee cherry on a green sprig recalling the plant they came from.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 29, 2026 — US National Coffee Day. On the left, a warm ceramic mug of espresso with a glowing crema layer on top and slow curling wisps of steam rising above it. On the right, a small cluster of roasted coffee beans with faint aroma trails rising, and a single ripe red coffee cherry on a green leafy sprig recalling the plant they came from. In the centre, a large cream SEPTEMBER 29, 2026 headline underlined by a coffee-to-cream-to-amber sweep, an amber NATIONAL COFFEE DAY subhead, an italic ETHIOPIA · YEMEN · THE WORLD tertiary, a dim GROUND · BREWED · POURED · SIPPED roster, and a Georgia-italic 'one cup, one small ritual' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0a0705"/>
      <stop offset="1"   stop-color="#150c08"/>
    </linearGradient>

    <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#a89578"/>
      <stop offset="0.35" stop-color="#ede0c4"/>
      <stop offset="0.75" stop-color="#c8b89c"/>
      <stop offset="1"    stop-color="#8a7860"/>
    </linearGradient>

    <linearGradient id="espressoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1808"/>
      <stop offset="1" stop-color="#180705"/>
    </linearGradient>

    <radialGradient id="cremaGrad" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0"   stop-color="#e6b880"/>
      <stop offset="0.6" stop-color="#b48048"/>
      <stop offset="1"   stop-color="#6a4020"/>
    </radialGradient>

    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#6a3820"/>
      <stop offset="0.5" stop-color="#f5ecd8"/>
      <stop offset="1"   stop-color="#d4a848"/>
    </linearGradient>

    <radialGradient id="beanGrad" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0"   stop-color="#7a4020"/>
      <stop offset="0.55" stop-color="#4a2410"/>
      <stop offset="1"   stop-color="#2a1408"/>
    </radialGradient>

    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a8048"/>
      <stop offset="1" stop-color="#2a4028"/>
    </linearGradient>

    <radialGradient id="cherryGrad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0"   stop-color="#f56848"/>
      <stop offset="0.5" stop-color="#c02818"/>
      <stop offset="1"   stop-color="#5a1008"/>
    </radialGradient>

    <filter id="steamBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Faint panel rules -->
  <g stroke="#2a1a10" stroke-width="0.5" opacity="0.4" fill="none">
    <line x1="0" y1="30" x2="800" y2="30"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
  </g>

  <!-- Counter grain -->
  <g stroke="#1a100a" stroke-width="0.4" opacity="0.3">
    <line x1="0" y1="184" x2="800" y2="184"/>
    <line x1="0" y1="188" x2="800" y2="188"/>
    <line x1="0" y1="192" x2="800" y2="192"/>
    <line x1="0" y1="196" x2="800" y2="196"/>
  </g>

  <!-- ============================== LEFT: COFFEE MUG ============================== -->
  <g>
    <!-- Mug shadow -->
    <ellipse cx="115" cy="176" rx="58" ry="4.5" fill="#000" opacity="0.45"/>

    <!-- Handle (drawn behind, appears from side of mug) -->
    <path d="M 168 108 Q 200 112 200 138 Q 200 164 168 160"
          fill="none" stroke="url(#mugGrad)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 168 116 Q 190 120 190 138 Q 190 154 168 152"
          fill="none" stroke="#2a1a10" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <!-- Mug body (slight taper) -->
    <path d="M 60 96 L 168 96 L 162 172 Q 160 174 158 174 L 72 174 Q 70 174 68 172 Z"
          fill="url(#mugGrad)" stroke="#3a2818" stroke-width="1"/>

    <!-- Vertical highlight streak on mug -->
    <path d="M 74 100 L 80 168" stroke="#faf0d8" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
    <path d="M 148 102 L 152 168" stroke="#3a2818" stroke-width="1.4" opacity="0.5" stroke-linecap="round"/>

    <!-- Rim: outer dark ellipse (inside of mug edge) -->
    <ellipse cx="114" cy="96" rx="54" ry="8" fill="#2a1408"/>

    <!-- Espresso surface -->
    <ellipse cx="114" cy="96" rx="52" ry="7" fill="url(#espressoGrad)"/>

    <!-- Crema layer floating on the espresso -->
    <ellipse cx="114" cy="96" rx="51" ry="6.5" fill="url(#cremaGrad)" opacity="0.9"/>

    <!-- Latte art swirl (subtle rosetta) -->
    <g fill="none" opacity="0.55">
      <path d="M 82 96 Q 96 91 114 94 Q 132 97 146 92" stroke="#f5ecd8" stroke-width="1.2"/>
      <path d="M 90 99 Q 104 101 114 98 Q 126 95 138 100" stroke="#f5ecd8" stroke-width="0.9" opacity="0.75"/>
      <ellipse cx="114" cy="96" rx="6" ry="1.3" fill="#f5ecd8" opacity="0.4"/>
    </g>

    <!-- Slow surface glint on crema (crema is 'alive') -->
    <ellipse cx="100" cy="94" rx="4" ry="1" fill="#faf0d8" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="98;122;98" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Mug base line -->
    <path d="M 72 172 L 158 172" stroke="#2a1408" stroke-width="0.8" opacity="0.6"/>

    <!-- ============ Steam wisps (rise + dissolve) ============ -->
    <g stroke="#d4c4a8" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#steamBlur)">
      <!-- Wisp 1: left, curling right -->
      <g opacity="0">
        <path d="M 92 90 C 88 78 96 66 92 54 C 88 42 96 30 92 18 C 90 12 94 6 92 0"/>
        <animate attributeName="opacity" values="0;0.75;0.55;0" keyTimes="0;0.3;0.7;1" dur="7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 -34" keyTimes="0;1" dur="7s" repeatCount="indefinite"/>
      </g>
      <!-- Wisp 2: middle -->
      <g opacity="0">
        <path d="M 114 90 C 118 78 110 66 114 54 C 118 42 110 30 114 18 C 116 12 112 6 114 0"/>
        <animate attributeName="opacity" values="0;0.85;0.55;0" keyTimes="0;0.3;0.7;1" dur="7s" begin="2.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 -34" keyTimes="0;1" dur="7s" begin="2.3s" repeatCount="indefinite"/>
      </g>
      <!-- Wisp 3: right, curling left -->
      <g opacity="0">
        <path d="M 136 90 C 140 78 132 66 136 54 C 140 42 132 30 136 18 C 138 12 134 6 136 0"/>
        <animate attributeName="opacity" values="0;0.75;0.55;0" keyTimes="0;0.3;0.7;1" dur="7s" begin="4.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 -34" keyTimes="0;1" dur="7s" begin="4.6s" repeatCount="indefinite"/>
      </g>
      <!-- Wisp 4: very light thin, offset -->
      <g opacity="0" stroke-width="1">
        <path d="M 102 90 C 100 76 108 62 104 48 C 102 36 106 22 104 10"/>
        <animate attributeName="opacity" values="0;0.55;0.4;0" keyTimes="0;0.3;0.7;1" dur="11s" begin="1.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 22;0 -36" keyTimes="0;1" dur="11s" begin="1.1s" repeatCount="indefinite"/>
      </g>
      <!-- Wisp 5: another light thin -->
      <g opacity="0" stroke-width="1">
        <path d="M 126 90 C 128 76 120 62 124 48 C 126 36 122 22 124 10"/>
        <animate attributeName="opacity" values="0;0.55;0.4;0" keyTimes="0;0.3;0.7;1" dur="11s" begin="6.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 22;0 -36" keyTimes="0;1" dur="11s" begin="6.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Mug caption -->
    <text x="115" y="196" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.6" font-weight="700" fill="#8a6c50" letter-spacing="1.8" opacity="0.9">
      ESPRESSO &#183; DOUBLE &#183; NO SUGAR
    </text>
  </g>

  <!-- ============================== CENTRE TEXT STACK ============================== -->

  <!-- Date headline -->
  <text x="410" y="60" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f5ecd8" letter-spacing="1.6">
    SEPTEMBER 29, 2026
  </text>

  <!-- Underline sweep -->
  <line x1="252" y1="72" x2="568" y2="72" stroke="url(#underlineGrad)" stroke-width="2.6" stroke-linecap="round">
    <animate attributeName="stroke-dasharray"
             values="0 316;220 96;316 0;220 96;0 316"
             keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
  </line>

  <!-- Subhead -->
  <text x="410" y="93" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2.4" xml:space="preserve">
    <tspan fill="#d4a848">NATIONAL  </tspan><tspan fill="#f5ecd8">COFFEE DAY</tspan>
  </text>

  <!-- Tertiary italic -->
  <text x="410" y="112" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#c48848" letter-spacing="0.7">
    ETHIOPIA &#183; YEMEN &#183; THE WORLD
  </text>

  <!-- Caption -->
  <text x="410" y="132" text-anchor="middle"
        font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#a89484" opacity="0.95">
    &#8220;one cup, one small ritual&#8221;
  </text>

  <!-- Small roster -->
  <text x="410" y="180" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.6" font-weight="700" fill="#6a5040" letter-spacing="1.8" opacity="0.9">
    GROUND &#183; BREWED &#183; POURED &#183; SIPPED
  </text>

  <!-- ============================== RIGHT: COFFEE BEANS + CHERRY ============================== -->
  <g transform="translate(680 118)">

    <!-- Aroma trails rising up over the beans -->
    <g stroke="#a88868" stroke-width="1.1" fill="none" stroke-linecap="round">
      <g opacity="0">
        <path d="M -28 -34 C -32 -46 -24 -58 -28 -70 C -32 -80 -24 -92 -28 -104"/>
        <animate attributeName="opacity" values="0;0.6;0.35;0" keyTimes="0;0.3;0.7;1" dur="11s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 -34" keyTimes="0;1" dur="11s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <path d="M 4 -38 C 8 -50 0 -62 4 -74 C 8 -84 0 -96 4 -108"/>
        <animate attributeName="opacity" values="0;0.7;0.35;0" keyTimes="0;0.3;0.7;1" dur="11s" begin="3.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 -34" keyTimes="0;1" dur="11s" begin="3.7s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <path d="M 32 -32 C 28 -44 36 -56 32 -68 C 28 -78 36 -90 32 -102"/>
        <animate attributeName="opacity" values="0;0.6;0.35;0" keyTimes="0;0.3;0.7;1" dur="11s" begin="7.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 -34" keyTimes="0;1" dur="11s" begin="7.3s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Coffee cherry on sprig (upper right) -->
    <g transform="translate(46 -52)">
      <!-- Stem -->
      <path d="M 2 22 Q 0 12 -4 2 Q -6 -6 -8 -12" fill="none" stroke="#5a4020" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Leaf -->
      <path d="M -8 -12 Q -22 -18 -26 -6 Q -22 0 -10 -6 Q -8 -8 -8 -12 Z" fill="url(#leafGrad)" stroke="#2a3818" stroke-width="0.5"/>
      <path d="M -20 -9 L -10 -8" stroke="#3a5028" stroke-width="0.4" opacity="0.8"/>
      <!-- Ripe cherry -->
      <circle cx="4" cy="18" r="6.5" fill="url(#cherryGrad)" stroke="#5a1008" stroke-width="0.6">
        <animate attributeName="r" values="6.3;6.8;6.3" dur="7s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="2" cy="15.8" rx="2.2" ry="1.4" fill="#faa088" opacity="0.7"/>
      <circle cx="4" cy="12" r="0.7" fill="#1a0505"/>
    </g>

    <!-- Bean 1 (top left) -->
    <g transform="translate(-38 -14) rotate(-32)">
      <ellipse cx="0" cy="0" rx="18" ry="11" fill="url(#beanGrad)" stroke="#1a0805" stroke-width="0.6"/>
      <path d="M -13.5 0 Q -8 -3 0 -3 Q 8 -3 13.5 0 Q 8 3 0 3 Q -8 3 -13.5 0"
            fill="none" stroke="#0a0402" stroke-width="1.4"/>
      <ellipse cx="-6" cy="-4.5" rx="3.4" ry="1.4" fill="#a05828" opacity="0.55"/>
    </g>

    <!-- Bean 2 (right upper) -->
    <g transform="translate(22 -6) rotate(38)">
      <ellipse cx="0" cy="0" rx="19" ry="12" fill="url(#beanGrad)" stroke="#1a0805" stroke-width="0.6"/>
      <path d="M -14.5 0 Q -9 -3 0 -3 Q 9 -3 14.5 0 Q 9 3 0 3 Q -9 3 -14.5 0"
            fill="none" stroke="#0a0402" stroke-width="1.4"/>
      <ellipse cx="-6" cy="-4.5" rx="3.6" ry="1.4" fill="#a05828" opacity="0.55"/>
    </g>

    <!-- Bean 3 (centre front, slow rotate) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="41s" repeatCount="indefinite"/>
      <g transform="translate(-10 20)">
        <ellipse cx="0" cy="0" rx="17" ry="10.5" fill="url(#beanGrad)" stroke="#1a0805" stroke-width="0.6"/>
        <path d="M -12.5 0 Q -7 -3 0 -3 Q 7 -3 12.5 0 Q 7 3 0 3 Q -7 3 -12.5 0"
              fill="none" stroke="#0a0402" stroke-width="1.4"/>
        <ellipse cx="-5" cy="-4" rx="3" ry="1.2" fill="#a05828" opacity="0.5"/>
      </g>
    </g>

    <!-- Bean 4 (bottom right) -->
    <g transform="translate(30 26) rotate(-22)">
      <ellipse cx="0" cy="0" rx="16" ry="10" fill="url(#beanGrad)" stroke="#1a0805" stroke-width="0.6"/>
      <path d="M -12 0 Q -7 -3 0 -3 Q 7 -3 12 0 Q 7 3 0 3 Q -7 3 -12 0"
            fill="none" stroke="#0a0402" stroke-width="1.4"/>
      <ellipse cx="-5" cy="-4" rx="2.8" ry="1.2" fill="#a05828" opacity="0.5"/>
    </g>

    <!-- Bean 5 (small, back) -->
    <g transform="translate(-4 -22) rotate(15)" opacity="0.85">
      <ellipse cx="0" cy="0" rx="14" ry="9" fill="url(#beanGrad)" stroke="#1a0805" stroke-width="0.5"/>
      <path d="M -10 0 Q -6 -3 0 -3 Q 6 -3 10 0 Q 6 3 0 3 Q -6 3 -10 0"
            fill="none" stroke="#0a0402" stroke-width="1.2"/>
    </g>

    <!-- Origin caption -->
    <text x="0" y="58" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.6" font-weight="700" fill="#8a6c50" letter-spacing="2.0" opacity="0.9">
      ARABICA &#183; DARK ROAST
    </text>
  </g>

</svg>
