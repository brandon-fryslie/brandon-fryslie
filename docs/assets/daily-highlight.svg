<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: JAWS — 51st anniversary of theatrical release (June 20, 1975, Universal Pictures, directed by Steven Spielberg, score by John Williams; the film that invented the summer blockbuster). Banner adaptation: moonlit Atlantic at night with a great-white shark seen in profile, body filling the lower two-thirds in a mid-tone slate silhouette, the unmistakable triangular dorsal fin breaking the surface mid-frame, jaws cracked open with two rows of teeth, the small lone backstroke swimmer at upper right is the prey, blood-red "JAWS" wordmark in tall-condensed style anchored at far left, primary headline "JUNE 20, 2026" set in big bone-white sans across the top, "51 YEARS · DUN · DUN · DUN · JUNE 20, 1975" subhead beneath with the three DUN beats pulsing red on the John Williams two-note rhythm, italic tertiary "AMITY ISLAND · UNIVERSAL PICTURES · DIR. STEVEN SPIELBERG" along the bottom. Slow rolling water-surface ripple, drifting moon-shaft light, bubble columns rising from the shark. Palette: abyss black-blue (#020812 → #07182f), shark slate (#1d2c4a), bone-white teeth and text, JAWS blood-red (#c8102e), moonlight pale-cyan, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 20, 2026 — JAWS 51st anniversary of theatrical release (June 20, 1975, Universal Pictures, directed by Steven Spielberg). A moonlit Atlantic banner: a great-white shark in profile fills the lower two-thirds, slate silhouette swimming rightward with its triangular dorsal fin breaking the surface mid-frame and jaws cracked open showing two rows of teeth; a small lone backstroke swimmer at the upper right is the prey. Blood-red JAWS wordmark anchors the left. Headline JUNE 20, 2026 set centered in large bone-white sans across the top, 51 YEARS · DUN · DUN · DUN · JUNE 20, 1975 as subhead with the three DUN beats pulsing red on the John Williams two-note rhythm, AMITY ISLAND · UNIVERSAL PICTURES · DIR. STEVEN SPIELBERG as italic tertiary line along the bottom.">
  <defs>
    <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d1117"/>
      <stop offset="38%" stop-color="#0a1832"/>
      <stop offset="70%" stop-color="#06122a"/>
      <stop offset="100%" stop-color="#020812"/>
    </linearGradient>
    <linearGradient id="sharkBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2a3c60"/>
      <stop offset="55%" stop-color="#1d2c4a"/>
      <stop offset="100%" stop-color="#0c1530"/>
    </linearGradient>
    <linearGradient id="sharkBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1d2c4a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#36507f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#48689d" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#dff1ff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#82c8ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#82c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lightShaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#bfe6ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#bfe6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="ripple" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="11" result="noise">
        <animate attributeName="baseFrequency" values="0.012 0.06;0.02 0.08;0.012 0.06" dur="13s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="0.7"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redBleed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <symbol id="bubble" viewBox="-3 -3 6 6" overflow="visible">
      <circle r="2.2" fill="none" stroke="#bfe6ff" stroke-width="0.5" opacity="0.85"/>
      <circle cx="-0.7" cy="-0.7" r="0.5" fill="#eaf6ff" opacity="0.9"/>
    </symbol>
  </defs>

  <!-- Ocean column -->
  <rect width="800" height="200" fill="url(#oceanGrad)"/>

  <!-- Moonlight pool centered overhead-right -->
  <ellipse cx="560" cy="42" rx="280" ry="36" fill="url(#moonGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Underwater light shafts -->
  <g opacity="0.65">
    <path d="M 470 92 L 455 200 L 520 200 L 510 92 Z" fill="url(#lightShaft)">
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M 600 92 L 585 200 L 640 200 L 640 92 Z" fill="url(#lightShaft)">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="13s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 720 92 L 705 200 L 760 200 L 760 92 Z" fill="url(#lightShaft)">
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="7s"  begin="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Water surface line — wavy via ripple filter -->
  <g filter="url(#ripple)">
    <path d="M 0 95 Q 100 91 200 95 T 400 95 T 600 95 T 800 95 L 800 99 L 0 99 Z"
          fill="#1b3a66" opacity="0.55"/>
    <path d="M 0 98 Q 120 94 240 98 T 480 98 T 800 98"
          stroke="#bfe6ff" stroke-width="0.6" fill="none" opacity="0.55"/>
  </g>

  <!-- ============================ -->
  <!--  GREAT WHITE — body group   -->
  <!-- ============================ -->
  <g>
    <!-- subtle forward-glide rise/fall -->
    <animateTransform attributeName="transform" type="translate"
                      values="0,2; 0,-2; 0,2" dur="13s" repeatCount="indefinite"/>

    <!-- BELLY-LIGHT pass first (lighter underside fill behind dark body) -->
    <path d="
        M 60 175
        C 90 192, 180 200, 280 198
        C 380 196, 460 192, 520 178
        L 600 168
        L 560 158
        C 470 165, 360 165, 270 160
        C 200 158, 130 158, 80 160 Z"
          fill="url(#sharkBelly)" opacity="0.55"/>

    <!-- MAIN BODY silhouette — long sleek great-white profile, head pointing RIGHT toward swimmer -->
    <path d="
        M 30 165
        C 60 200, 200 218, 360 210
        C 460 205, 540 196, 590 178
        C 615 168, 640 158, 660 152
        C 678 148, 690 144, 695 138
        C 700 132, 698 126, 686 122
        C 670 118, 645 117, 620 118
        C 580 122, 530 130, 470 138
        C 380 144, 280 145, 180 138
        C 130 134, 90 130, 60 132
        C 40 134, 30 140, 28 148
        C 28 154, 28 160, 30 165 Z"
          fill="url(#sharkBody)"/>

    <!-- BACK ridge highlight (top edge) -->
    <path d="
        M 60 132
        C 90 130, 130 134, 180 138
        C 280 145, 380 144, 470 138
        C 530 130, 580 122, 620 118
        C 645 117, 670 118, 686 122"
          stroke="#3d5a8c" stroke-width="1" fill="none" opacity="0.85"/>

    <!-- DORSAL FIN — the iconic triangle, breaking the water surface mid-frame -->
    <path d="
        M 330 138
        L 360 60
        L 395 138 Z"
          fill="url(#sharkBody)"/>
    <!-- Dorsal back-edge highlight -->
    <path d="M 360 60 L 330 138" stroke="#4a6aa0" stroke-width="1.1" fill="none" opacity="0.9"/>
    <!-- Water ripple ring around the dorsal where it pierces the surface -->
    <ellipse cx="362" cy="96" rx="32" ry="3" fill="none" stroke="#bfe6ff" stroke-width="0.6" opacity="0.7">
      <animate attributeName="rx" values="22;48;22" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.1;0.85" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="362" cy="96" rx="20" ry="2" fill="none" stroke="#bfe6ff" stroke-width="0.5" opacity="0.6">
      <animate attributeName="rx" values="14;36;14" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.05;0.7" dur="11s" begin="2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- PECTORAL FIN — long sickle shape under the belly -->
    <path d="
        M 460 170
        Q 470 200, 440 218
        Q 410 218, 410 192
        Q 420 175, 460 170 Z"
          fill="#152244" opacity="0.95"/>

    <!-- TAIL — strong caudal at left -->
    <path d="
        M 30 165
        Q -5 175, -10 200
        L -10 200
        Q 5 155, 30 145 Z"
          fill="url(#sharkBody)"/>
    <path d="
        M 30 145
        Q 8 130, -2 100
        Q 22 130, 40 150 Z"
          fill="#1d2c4a"/>

    <!-- GILL SLITS -->
    <g stroke="#0a1428" stroke-width="1.3" fill="none" opacity="0.9">
      <path d="M 540 132 Q 542 142 540 152"/>
      <path d="M 552 132 Q 554 142 552 152"/>
      <path d="M 564 132 Q 566 142 564 152"/>
      <path d="M 576 132 Q 578 142 576 152"/>
    </g>

    <!-- EYE — small, black, lifeless, with a hint of red glint -->
    <circle cx="640" cy="134" r="3.4" fill="#0a0d14"/>
    <circle cx="640" cy="134" r="3.4" fill="none" stroke="#3a0510" stroke-width="0.7"/>
    <circle cx="638.7" cy="132.8" r="0.7" fill="#c8102e" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- OPEN MOUTH — dark interior + two rows of triangular teeth -->
    <!-- Mouth interior (red-black) -->
    <path d="
        M 640 152
        C 660 152, 680 150, 692 144
        C 686 158, 670 164, 650 164
        C 644 162, 640 158, 640 152 Z"
          fill="#1a0008" opacity="0.95"/>
    <!-- Upper jaw teeth row -->
    <g fill="#f3f4f6">
      <polygon points="646,150 649,158 652,150"/>
      <polygon points="654,149 657,158 660,149"/>
      <polygon points="662,148 665,158 668,148"/>
      <polygon points="670,147 673,157 676,147"/>
      <polygon points="678,146 681,156 684,146"/>
      <polygon points="686,146 689,155 692,146"/>
    </g>
    <!-- Lower jaw teeth row -->
    <g fill="#e7ebf0">
      <polygon points="648,164 651,158 654,164"/>
      <polygon points="656,165 659,158 662,165"/>
      <polygon points="664,165 667,158 670,165"/>
      <polygon points="672,164 675,158 678,164"/>
      <polygon points="680,163 683,158 686,163"/>
    </g>
  </g>

  <!-- Lone backstroke swimmer at upper right (small, vulnerable) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 0,1.5; 0,0" dur="7s" repeatCount="indefinite"/>
    <g transform="translate(720,90)" opacity="0.95">
      <ellipse cx="0" cy="0" rx="10" ry="2.2" fill="#020812"/>
      <circle cx="10" cy="-1.5" r="2.0" fill="#020812"/>
      <path d="M -10 0 Q -15 -1.5 -18 0 Q -15 2 -10 1 Z" fill="#020812"/>
      <ellipse cx="2" cy="-3" rx="5" ry="0.7" fill="#bfe6ff" opacity="0.6">
        <animate attributeName="opacity" values="0.25;0.8;0.25" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="14" ry="3" fill="none" stroke="#bfe6ff" stroke-width="0.4" opacity="0.5">
        <animate attributeName="rx" values="12;22;12" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="11s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- Bubble columns rising from the shark -->
  <g>
    <use href="#bubble" x="260" y="190">
      <animate attributeName="y" values="190;105" dur="11s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="11s" begin="0s" repeatCount="indefinite"/>
    </use>
    <use href="#bubble" x="370" y="195">
      <animate attributeName="y" values="195;100" dur="13s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="2s" repeatCount="indefinite"/>
    </use>
    <use href="#bubble" x="495" y="200">
      <animate attributeName="y" values="200;105" dur="11s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="4s" repeatCount="indefinite"/>
    </use>
    <use href="#bubble" x="160" y="190">
      <animate attributeName="y" values="190;110" dur="13s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="13s" begin="3s" repeatCount="indefinite"/>
    </use>
    <use href="#bubble" x="600" y="195">
      <animate attributeName="y" values="195;105" dur="11s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="6s" repeatCount="indefinite"/>
    </use>
    <use href="#bubble" x="700" y="185">
      <animate attributeName="y" values="185;102" dur="7s"  begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s"  begin="1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Top title shadow band so the headline reads cleanly -->
  <rect x="0" y="0" width="800" height="78" fill="url(#titleShadow)"/>

  <!-- PRIMARY DATE HEADLINE -->
  <text x="400" y="40" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="36" font-weight="800" fill="#ffffff" letter-spacing="4"
        filter="url(#textGlow)">
    JUNE 20, 2026
  </text>

  <!-- Subhead "DUN · DUN · DUN" with John Williams two-note pulse -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     font-size="11" font-weight="700" letter-spacing="5" fill="#ffd1d6" text-anchor="middle">
    <text x="210" y="66">51 YEARS</text>
    <text x="310" y="66" fill="#c8102e">
      DUN
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0s"   repeatCount="indefinite"/>
    </text>
    <text x="375" y="66" fill="#c8102e">
      DUN
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.45s" repeatCount="indefinite"/>
    </text>
    <text x="440" y="66" fill="#c8102e">
      DUN
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </text>
    <text x="560" y="66">JUNE 20, 1975</text>
  </g>

  <!-- JAWS wordmark — blood red, tall-condensed feel via vertical scale -->
  <g transform="translate(36,168)">
    <text x="0" y="0"
          font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
          font-size="44" font-weight="900" fill="#c8102e" opacity="0.55"
          letter-spacing="2" transform="scale(1,1.8)" filter="url(#redBleed)">
      JAWS
    </text>
    <text x="0" y="0"
          font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
          font-size="44" font-weight="900" fill="#c8102e"
          letter-spacing="2" transform="scale(1,1.8)" stroke="#5a0612" stroke-width="0.8">
      JAWS
      <animate attributeName="opacity" values="0.92;1;0.92" dur="7s" repeatCount="indefinite"/>
    </text>
    <line x1="2" y1="6" x2="118" y2="6" stroke="#c8102e" stroke-width="1.2" opacity="0.85"/>
  </g>

  <!-- Tertiary italic credit line -->
  <text x="400" y="192" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" font-weight="500" fill="#cfd8e8" letter-spacing="2.6" font-style="italic" opacity="0.92">
    AMITY ISLAND  ·  UNIVERSAL PICTURES  ·  DIR. STEVEN SPIELBERG
  </text>
</svg>
