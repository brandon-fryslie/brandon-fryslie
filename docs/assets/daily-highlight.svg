<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Einstein–Szilárd Letter to FDR (August 2, 1939) — 87 years ago today, Albert Einstein signed the letter drafted by Leo Szilárd warning President Franklin D. Roosevelt that recent uranium fission research made it "conceivable... that extremely powerful bombs of a new type may... be constructed." Delivered by Alexander Sachs in October 1939, the letter led directly to the Advisory Committee on Uranium and ultimately the Manhattan Project. A composed tableau on an 800x200 canvas: on the left, a slightly-tilted cream sheet of stationery dated "August 2nd, 1939" with a letterhead, salutation, several typed body lines, and a cursive "A. Einstein" signature that writes itself in from left to right; superimposed over the paper is a translucent atomic-orbit motif — an amber-gold pulsing nucleus at the center with three cyan/green/pink orbital ellipses continuously rotating and electrons tracing them — with chain-reaction pulses expanding outward from behind. On the right, a huge cream AUGUST 2, 2026 headline, an amber EINSTEIN–SZILÁRD LETTER · 87 YEARS subhead, and italic 2 AUGUST 1939 · TO F.D. ROOSEVELT · URANIUM CHAIN REACTION · MANHATTAN PROJECT PRECURSOR tertiary. Background deep navy #050810. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 2, 2026 — 87th anniversary of the Einstein–Szilárd letter to President Franklin D. Roosevelt, signed August 2, 1939. On the left, a slightly-tilted cream sheet of stationery dated 'August 2nd, 1939' with letterhead, salutation, typed body lines, a closing 'Yours very truly,' and a cursive signature that writes itself in from left to right. Superimposed over the paper is a translucent atomic-orbit motif: an amber-gold pulsing nucleus at the center with three cyan, green, and pink orbital ellipses continuously rotating and electrons tracing them, with chain-reaction pulses expanding outward. On the right, a huge cream AUGUST 2, 2026 headline, an amber EINSTEIN–SZILÁRD LETTER · 87 YEARS subhead, and italic 2 AUGUST 1939 · TO F.D. ROOSEVELT · URANIUM CHAIN REACTION · MANHATTAN PROJECT PRECURSOR tertiary.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#050810"/>
      <stop offset="1" stop-color="#02040a"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e8c6"/>
      <stop offset="0.5" stop-color="#ecdcb2"/>
      <stop offset="1" stop-color="#d5bc82"/>
    </linearGradient>

    <linearGradient id="paperShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>

    <radialGradient id="nucleusGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c8"/>
      <stop offset="0.3" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#a1571a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pulseGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffb454" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 0.06 0"/>
    </filter>

    <style>
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 1.4px;
        fill: #f3ecd8;
      }
      .subhead {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 2.4px;
        fill: #ffb454;
      }
      .tertiary {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-style: italic;
        font-weight: 500;
        letter-spacing: 1.4px;
        fill: #8a99b0;
      }
      .typed {
        font-family: 'Courier New', 'Liberation Mono', Courier, monospace;
        font-weight: 600;
        fill: #3d2f16;
      }
      .tag {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Faint background stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="430" cy="26" r="0.8"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="20" r="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="32" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="24" r="0.6"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="34" r="0.8"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="11s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="465" cy="178" r="0.7"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="182" r="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="745" cy="172" r="0.6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="11s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Chain reaction pulse rings (behind letter) -->
  <g transform="translate(190, 100)">
    <circle r="20" fill="url(#pulseGrad)" opacity="0">
      <animate attributeName="r" values="10;95" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="url(#pulseGrad)" opacity="0">
      <animate attributeName="r" values="10;95" dur="11s" begin="3.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="11s" begin="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="url(#pulseGrad)" opacity="0">
      <animate attributeName="r" values="10;95" dur="11s" begin="7.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="11s" begin="7.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ LEFT: LETTER ============ -->
  <g transform="translate(50, 22) rotate(-3.5 140 78)">
    <!-- Drop shadow -->
    <rect x="4" y="6" width="272" height="150" rx="2" fill="#000000" opacity="0.55" filter="url(#softGlow)"/>
    <!-- Paper -->
    <rect x="0" y="0" width="272" height="150" rx="2" fill="url(#paper)" stroke="#9a7f4e" stroke-width="0.6"/>
    <!-- Paper aged noise -->
    <rect x="0" y="0" width="272" height="150" rx="2" fill="#000000" filter="url(#paperNoise)" opacity="0.35"/>
    <!-- Sepia edge shade -->
    <rect x="0" y="0" width="272" height="150" rx="2" fill="url(#paperShade)" opacity="0.55"/>

    <!-- Letterhead -->
    <text x="14" y="20" class="typed" font-size="8" fill="#5a4826" font-weight="700">Albert Einstein</text>
    <text x="14" y="29" class="typed" font-size="6" fill="#5a4826" opacity="0.85">Old Grove Rd., Nassau Point</text>
    <text x="14" y="36" class="typed" font-size="6" fill="#5a4826" opacity="0.85">Peconic, Long Island</text>

    <!-- Date -->
    <text x="200" y="26" class="typed" font-size="7.5" fill="#3d2f16">August 2nd, 1939</text>

    <!-- Salutation -->
    <text x="14" y="56" class="typed" font-size="7" fill="#3d2f16">F. D. Roosevelt, President of the United States</text>

    <!-- Typed body lines (short bars simulating text) -->
    <g stroke="#3d2f16" stroke-width="1" opacity="0.68" stroke-linecap="butt">
      <line x1="14" y1="68" x2="256" y2="68"/>
      <line x1="14" y1="76" x2="248" y2="76"/>
      <line x1="14" y1="84" x2="252" y2="84"/>
      <line x1="14" y1="92" x2="228" y2="92"/>
      <line x1="14" y1="100" x2="256" y2="100"/>
      <line x1="14" y1="108" x2="240" y2="108"/>
      <line x1="14" y1="116" x2="204" y2="116"/>
    </g>

    <!-- Closing -->
    <text x="152" y="130" class="typed" font-size="7.5" fill="#3d2f16">Yours very truly,</text>

    <!-- Cursive signature that writes in -->
    <g transform="translate(150, 142)">
      <path d="M 0 0 c 3 -6 9 -7 12 -1 c 1 3 -4 6 -5 3 c -1 -3 4 -6 8 -3 c 4 3 -2 8 3 8 c 4 0 3 -8 8 -6 c 3 1 3 6 6 6 c 3 0 5 -7 9 -5 c 3 1 -2 6 1 7 c 3 1 6 -6 10 -5 c 3 1 -2 6 2 7 c 4 1 9 -5 13 -1 c 3 3 -2 6 1 7 c 3 1 7 -3 11 -1 c 3 1 -2 6 1 7"
        fill="none" stroke="#132251" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="200" stroke-dashoffset="200">
        <animate attributeName="stroke-dashoffset" values="200;200;0;0;200" keyTimes="0;0.15;0.55;0.9;1" dur="13s" repeatCount="indefinite"/>
      </path>
      <!-- Underline flourish -->
      <path d="M 4 8 q 30 4 65 -1 q 20 -3 24 -7" fill="none" stroke="#132251" stroke-width="0.7" stroke-linecap="round" opacity="0.7"
        stroke-dasharray="110" stroke-dashoffset="110">
        <animate attributeName="stroke-dashoffset" values="110;110;110;0;0;110" keyTimes="0;0.15;0.6;0.75;0.9;1" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- ============ ATOMIC ORBIT MOTIF (over letter) ============ -->
  <g transform="translate(190, 100)" opacity="0.92">
    <!-- Orbit 1 (rotates as a group for extra motion) -->
    <g>
      <ellipse cx="0" cy="0" rx="72" ry="22" fill="none" stroke="#4fd7ff" stroke-width="1.1" opacity="0.75"/>
      <circle r="3.6" fill="#4fd7ff" filter="url(#softGlow)">
        <animateMotion path="M 72 0 A 72 22 0 1 1 -72 0 A 72 22 0 1 1 72 0" dur="7s" repeatCount="indefinite" rotate="auto"/>
      </circle>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="43s" repeatCount="indefinite"/>
    </g>
    <!-- Orbit 2 -->
    <g transform="rotate(60)">
      <ellipse cx="0" cy="0" rx="72" ry="22" fill="none" stroke="#7fe4a3" stroke-width="1.1" opacity="0.75"/>
      <circle r="3.6" fill="#7fe4a3" filter="url(#softGlow)">
        <animateMotion path="M 72 0 A 72 22 0 1 1 -72 0 A 72 22 0 1 1 72 0" dur="11s" repeatCount="indefinite" rotate="auto"/>
      </circle>
    </g>
    <!-- Orbit 3 -->
    <g transform="rotate(120)">
      <ellipse cx="0" cy="0" rx="72" ry="22" fill="none" stroke="#ff9dc0" stroke-width="1.1" opacity="0.75"/>
      <circle r="3.6" fill="#ff9dc0" filter="url(#softGlow)">
        <animateMotion path="M 72 0 A 72 22 0 1 1 -72 0 A 72 22 0 1 1 72 0" dur="13s" repeatCount="indefinite" rotate="auto"/>
      </circle>
    </g>

    <!-- Nucleus -->
    <circle r="16" fill="url(#nucleusGrad)" filter="url(#bigGlow)">
      <animate attributeName="r" values="14;19;14" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#ffe1a8"/>
    <circle r="2.4" fill="#fff8e2"/>
  </g>

  <!-- ============ RIGHT: TEXT ============ -->
  <g>
    <text x="388" y="80" class="headline" font-size="40">
      AUGUST 2, 2026
      <animate attributeName="opacity" values="0.94;1;0.94" dur="7s" repeatCount="indefinite"/>
    </text>

    <text x="388" y="112" class="subhead" font-size="13">EINSTEIN–SZILÁRD LETTER · 87 YEARS</text>

    <!-- Underline accent -->
    <line x1="388" y1="120" x2="388" y2="120" stroke="#ffb454" stroke-width="1.4" opacity="0.75">
      <animate attributeName="x2" values="388;720;720;388" dur="11s" keyTimes="0;0.35;0.85;1" repeatCount="indefinite"/>
    </line>

    <text x="388" y="146" class="tertiary" font-size="10">2 AUGUST 1939 · TO F.D. ROOSEVELT</text>
    <text x="388" y="162" class="tertiary" font-size="10">URANIUM CHAIN REACTION · MANHATTAN PROJECT PRECURSOR</text>
    <text x="388" y="180" class="tertiary" font-size="9" fill="#6b7f97">SIGNED PECONIC, NY · DELIVERED OCT 1939 BY A. SACHS</text>
  </g>

  <!-- Small corner tag: uranium symbol -->
  <g transform="translate(720, 30)" opacity="0.85">
    <text x="0" y="-6" class="tag" font-size="6.5" fill="#6b7f97">ATOMIC NO. 92</text>
    <circle cx="8" cy="10" r="8" fill="none" stroke="#ffb454" stroke-width="0.8" opacity="0.75"/>
    <text x="8" y="14" text-anchor="middle" class="tag" font-size="8" fill="#ffb454">U</text>
  </g>

  <!-- Subtle divider glow bar -->
  <line x1="370" y1="34" x2="370" y2="166" stroke="#ffb454" stroke-width="0.6" opacity="0.28"/>
</svg>
