<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: World Telecommunication and Information Society Day / ITU founded May 17, 1865 (161st anniversary) — signal towers, radio waves, Morse code dots and dashes, networked nodes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 17, 2026 — World Telecommunication Day, 161 years of the ITU">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#13243d"/>
      <stop offset="60%" stop-color="#0f1a2c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <linearGradient id="signal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="signal2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Subtle grid / ground line -->
  <g opacity="0.18" stroke="#22d3ee" stroke-width="0.5">
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="180" x2="800" y2="180" opacity="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" opacity="0.4"/>
  </g>

  <!-- Distant network nodes, twinkling -->
  <g fill="#22d3ee">
    <circle cx="60" cy="35" r="1.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="55" r="1.2">
      <animate attributeName="opacity" values="1;0.2;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="30" r="1.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="40" r="1.6">
      <animate attributeName="opacity" values="1;0.3;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="65" r="1.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="30" r="1.4">
      <animate attributeName="opacity" values="1;0.3;1" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- LEFT TOWER -->
  <g transform="translate(110,170)">
    <!-- mast -->
    <polygon points="-2,0 2,0 1,-90 -1,-90" fill="url(#tower)"/>
    <!-- crossbeams -->
    <line x1="-10" y1="-30" x2="10" y2="-30" stroke="#64748b" stroke-width="1"/>
    <line x1="-7" y1="-50" x2="7" y2="-50" stroke="#64748b" stroke-width="1"/>
    <line x1="-5" y1="-70" x2="5" y2="-70" stroke="#64748b" stroke-width="1"/>
    <!-- guys -->
    <line x1="0" y1="-90" x2="-14" y2="0" stroke="#475569" stroke-width="0.6"/>
    <line x1="0" y1="-90" x2="14" y2="0" stroke="#475569" stroke-width="0.6"/>
    <!-- beacon -->
    <circle cx="0" cy="-92" r="2.4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-92" r="6" fill="url(#pulseGlow)">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- emanating arcs -->
    <g fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.7">
      <path d="M 10,-92 A 14,14 0 0 1 10,-78">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M 18,-92 A 22,22 0 0 1 18,-70">
        <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 26,-92 A 30,30 0 0 1 26,-62">
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- RIGHT TOWER -->
  <g transform="translate(690,170)">
    <polygon points="-2,0 2,0 1,-90 -1,-90" fill="url(#tower)"/>
    <line x1="-10" y1="-30" x2="10" y2="-30" stroke="#64748b" stroke-width="1"/>
    <line x1="-7" y1="-50" x2="7" y2="-50" stroke="#64748b" stroke-width="1"/>
    <line x1="-5" y1="-70" x2="5" y2="-70" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="-90" x2="-14" y2="0" stroke="#475569" stroke-width="0.6"/>
    <line x1="0" y1="-90" x2="14" y2="0" stroke="#475569" stroke-width="0.6"/>
    <circle cx="0" cy="-92" r="2.4" fill="#f59e0b">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-92" r="6" fill="#f59e0b" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- mirrored arcs facing left -->
    <g fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.7">
      <path d="M -10,-92 A 14,14 0 0 0 -10,-78">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M -18,-92 A 22,22 0 0 0 -18,-70">
        <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </path>
      <path d="M -26,-92 A 30,30 0 0 0 -26,-62">
        <animate attributeName="opacity" values="0;0.5;0" dur="3s" begin="1.3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Long horizontal signal wave traveling between towers -->
  <g>
    <path d="M 122,78 Q 200,58 280,78 T 440,78 T 600,78 T 678,78"
          fill="none" stroke="url(#signal)" stroke-width="1.6" opacity="0.85" filter="url(#soft)">
      <animate attributeName="stroke-dasharray" values="0,800;400,400;800,0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 122,90 Q 200,110 280,90 T 440,90 T 600,90 T 678,90"
          fill="none" stroke="url(#signal2)" stroke-width="1.4" opacity="0.8" filter="url(#soft)">
      <animate attributeName="stroke-dasharray" values="800,0;400,400;0,800" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Morse-code: traveling dots and dashes along an invisible track -->
  <g fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Dots/dashes drifting left to right -->
    <g opacity="0.85">
      <circle cx="0" cy="0" r="2.2">
        <animateTransform attributeName="transform" type="translate" from="125,134" to="675,134" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="13s" repeatCount="indefinite"/>
      </circle>
      <rect x="-6" y="-1.2" width="12" height="2.4" rx="1">
        <animateTransform attributeName="transform" type="translate" from="125,134" to="675,134" dur="13s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="13s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="0" cy="0" r="2.2">
        <animateTransform attributeName="transform" type="translate" from="125,134" to="675,134" dur="13s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="13s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <rect x="-6" y="-1.2" width="12" height="2.4" rx="1">
        <animateTransform attributeName="transform" type="translate" from="125,134" to="675,134" dur="13s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="13s" begin="6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="0" cy="0" r="2.2">
        <animateTransform attributeName="transform" type="translate" from="125,134" to="675,134" dur="13s" begin="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="13s" begin="8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Central title block: today's date prominent -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- backing plate so text is always legible over animations -->
    <rect x="240" y="20" width="320" height="64" rx="8" fill="#0d1117" opacity="0.78"/>
    <rect x="240" y="20" width="320" height="64" rx="8" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <!-- date -->
    <text x="400" y="58" font-size="32" font-weight="700" fill="#f1f5f9" letter-spacing="2">
      MAY 17 · 2026
    </text>
    <!-- subline -->
    <text x="400" y="76" font-size="10" font-weight="500" fill="#22d3ee" letter-spacing="3">
      WORLD TELECOMMUNICATION DAY
    </text>
  </g>

  <!-- Anniversary tagline below the title -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="160" font-size="11" fill="#94a3b8" letter-spacing="1.5">
      ITU founded 17 May 1865 — 161 years of getting humans to talk across distance
    </text>
    <!-- Morse for "ITU" : .. - ..- -->
    <g fill="#f59e0b">
      <circle cx="365" cy="178" r="1.6"/>
      <circle cx="372" cy="178" r="1.6"/>
      <rect x="382" y="176.6" width="10" height="2.8" rx="1"/>
      <circle cx="402" cy="178" r="1.6"/>
      <circle cx="409" cy="178" r="1.6"/>
      <rect x="419" y="176.6" width="10" height="2.8" rx="1"/>
    </g>
    <text x="441" y="181" font-size="8" fill="#475569" letter-spacing="2" text-anchor="start">· I T U ·</text>
  </g>

  <!-- Faint scanning sweep across whole composition -->
  <rect x="0" y="0" width="80" height="200" fill="url(#signal)" opacity="0.08">
    <animateTransform attributeName="transform" type="translate" from="-80,0" to="800,0" dur="11s" repeatCount="indefinite"/>
  </rect>
</svg>
