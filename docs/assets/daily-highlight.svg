<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: The New York Times — 175th Anniversary (September 18, 1851) -->
<!-- about:
On 18 September 1851, a four-page broadsheet called The New-York Daily Times went on sale on the streets of lower Manhattan for one cent. Its founders, Henry Jarvis Raymond and George Jones, promised a paper that would stay calmly in the middle of the loud, partisan press of the era — no more hot temper than a subject demanded, no less. It ran European dispatches lifted from the previous week's steamer, a column of city commerce, and one page of advertisements. The name shortened to The New York Times in 1857; the motto "All the News That's Fit to Print" arrived in 1897. A hundred and seventy-five years later the paper still comes out every morning, and its masthead still uses the same blackletter it wore on day one.

The left half is Volume I, Number 1, laid out on a warm cream broadsheet with an ink-heavy serif masthead, a dated dateline reading THURSDAY, SEPTEMBER 18, 1851 · PRICE ONE CENT, and three columns of ruled text where a press-bar slowly sweeps top to bottom, printing the page fresh on each pass. On the right, a large SEPTEMBER 18, 2026 headline anchors a cream THE NEW YORK TIMES · 175 YEARS subhead, an italic amber RAYMOND · JONES · MANHATTAN tertiary, a dim TIMES · DAILY · PRESS · INK roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 18, 2026 — the 175th anniversary of the first edition of The New York Times, published on September 18, 1851. On the left half, a warm cream broadsheet page with an ink-heavy blackletter-style serif masthead reading 'The New-York Daily Times', a thin rule beneath, a dated line 'VOL. I · NO. 1 · THURSDAY, SEPTEMBER 18, 1851 · PRICE ONE CENT', and three columns of ruled body text with a few small headline caps ('EUROPE.', 'COMMERCE.', 'THE CITY.') as a press-blade shadow slowly sweeps top-to-bottom across the page. On the right, a large cream SEPTEMBER 18, 2026 headline underlined by a cream-to-amber sweep, a cream THE NEW YORK TIMES · 175 YEARS subhead, an italic amber RAYMOND · JONES · MANHATTAN tertiary, a dim TIMES · DAILY · PRESS · INK roster, and a Georgia-italic 'all the news that's fit to print.' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f4ecd6"/>
      <stop offset="55%"  stop-color="#ecdfbe"/>
      <stop offset="100%" stop-color="#d9c89a"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f2ecd8"/>
      <stop offset="55%"  stop-color="#e8c98a"/>
      <stop offset="100%" stop-color="#c98a3a"/>
    </linearGradient>
    <!-- Press-blade wet-ink shadow that sweeps down the page -->
    <linearGradient id="pressBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1408" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#1a1408" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#0d0a05" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#1a1408" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1a1408" stop-opacity="0"/>
    </linearGradient>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <!-- Subtle newsprint speckle -->
    <filter id="speckle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.05
                             0 0 0 0 0.03
                             0 0 0 0 0.02
                             0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Clip path for the paper page so animations don't spill -->
    <clipPath id="paperClip">
      <rect x="22" y="17" width="356" height="166" rx="2" ry="2"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Faint compositor's rules on the right side -->
  <g opacity="0.08" stroke="#c98a3a" stroke-width="0.5" fill="none">
    <path d="M 420 10 h 40 v 22 h 60"/>
    <path d="M 720 24 v 30 h -40"/>
    <path d="M 440 184 h 60 v -18 h 100"/>
    <path d="M 770 170 h -30 v -28"/>
  </g>

  <!-- ============================== LEFT: NEWSPAPER PAGE ============================== -->
  <g transform="translate(20,15) rotate(-1 180 85)" filter="url(#paperShadow)">
    <!-- Page -->
    <rect x="0" y="0" width="360" height="170" rx="2" ry="2" fill="url(#paperGrad)" stroke="#8b7a4a" stroke-width="0.6"/>
    <!-- Speckle layer (very subtle) -->
    <rect x="0" y="0" width="360" height="170" fill="#f4ecd6" filter="url(#speckle)" opacity="0.6"/>

    <g clip-path="url(#paperClip)">
      <!-- Masthead: "The New-York Daily Times" -->
      <text x="180" y="36" text-anchor="middle"
            font-family="'Times New Roman', 'Times', 'Georgia', serif"
            font-size="21" font-weight="900" font-style="normal" fill="#141008"
            letter-spacing="0.6">
        <tspan font-style="italic" font-size="19">The</tspan>
        <tspan font-weight="900" letter-spacing="1.2"> New-York Daily Times</tspan>
      </text>

      <!-- Rule under masthead -->
      <line x1="30" y1="43" x2="330" y2="43" stroke="#141008" stroke-width="0.8"/>
      <line x1="30" y1="45.5" x2="330" y2="45.5" stroke="#141008" stroke-width="0.4"/>

      <!-- Dateline -->
      <text x="180" y="55" text-anchor="middle"
            font-family="'Times New Roman', 'Times', serif"
            font-size="6.5" fill="#241a0d" letter-spacing="1.4" font-weight="600">
        VOL. I. · NO. 1. · NEW-YORK, THURSDAY, SEPTEMBER 18, 1851. · PRICE ONE CENT.
      </text>
      <line x1="30" y1="59" x2="330" y2="59" stroke="#241a0d" stroke-width="0.3"/>

      <!-- Three columns of body text (ruled lines) -->
      <g stroke="#241a0d" stroke-width="0.45" stroke-linecap="round" opacity="0.72">
        <!-- Column 1 -->
        <text x="35" y="70" font-family="'Times New Roman', serif" font-size="6.5"
              font-weight="900" fill="#141008" letter-spacing="0.8">EUROPE.</text>
        <line x1="35" y1="77" x2="105" y2="77"/>
        <line x1="35" y1="82" x2="112" y2="82"/>
        <line x1="35" y1="87" x2="108" y2="87"/>
        <line x1="35" y1="92" x2="115" y2="92"/>
        <line x1="35" y1="97" x2="103" y2="97"/>
        <line x1="35" y1="102" x2="112" y2="102"/>
        <line x1="35" y1="107" x2="98" y2="107"/>
        <line x1="35" y1="112" x2="115" y2="112"/>
        <line x1="35" y1="117" x2="107" y2="117"/>
        <line x1="35" y1="122" x2="115" y2="122"/>
        <line x1="35" y1="127" x2="94" y2="127"/>
        <line x1="35" y1="132" x2="113" y2="132"/>
        <line x1="35" y1="137" x2="105" y2="137"/>
        <line x1="35" y1="142" x2="115" y2="142"/>
        <line x1="35" y1="147" x2="100" y2="147"/>
        <line x1="35" y1="152" x2="112" y2="152"/>
        <line x1="35" y1="157" x2="88" y2="157"/>

        <!-- Column 2 -->
        <text x="128" y="70" font-family="'Times New Roman', serif" font-size="6.5"
              font-weight="900" fill="#141008" letter-spacing="0.8">COMMERCE.</text>
        <line x1="128" y1="77" x2="205" y2="77"/>
        <line x1="128" y1="82" x2="200" y2="82"/>
        <line x1="128" y1="87" x2="207" y2="87"/>
        <line x1="128" y1="92" x2="196" y2="92"/>
        <line x1="128" y1="97" x2="205" y2="97"/>
        <line x1="128" y1="102" x2="192" y2="102"/>
        <line x1="128" y1="107" x2="204" y2="107"/>
        <line x1="128" y1="112" x2="200" y2="112"/>
        <text x="128" y="120" font-family="'Times New Roman', serif" font-size="6.5"
              font-weight="900" fill="#141008" letter-spacing="0.8">THE CITY.</text>
        <line x1="128" y1="127" x2="205" y2="127"/>
        <line x1="128" y1="132" x2="196" y2="132"/>
        <line x1="128" y1="137" x2="207" y2="137"/>
        <line x1="128" y1="142" x2="190" y2="142"/>
        <line x1="128" y1="147" x2="205" y2="147"/>
        <line x1="128" y1="152" x2="200" y2="152"/>
        <line x1="128" y1="157" x2="185" y2="157"/>

        <!-- Column 3 -->
        <text x="222" y="70" font-family="'Times New Roman', serif" font-size="6.5"
              font-weight="900" fill="#141008" letter-spacing="0.8">ADVERTISEMENTS.</text>
        <line x1="222" y1="77" x2="298" y2="77"/>
        <line x1="222" y1="82" x2="303" y2="82"/>
        <line x1="222" y1="87" x2="292" y2="87"/>
        <line x1="222" y1="92" x2="303" y2="92"/>
        <line x1="222" y1="97" x2="288" y2="97"/>
        <line x1="222" y1="102" x2="300" y2="102"/>
        <line x1="222" y1="107" x2="295" y2="107"/>
        <line x1="222" y1="112" x2="303" y2="112"/>
        <line x1="222" y1="117" x2="280" y2="117"/>
        <line x1="222" y1="122" x2="303" y2="122"/>
        <line x1="222" y1="127" x2="295" y2="127"/>
        <line x1="222" y1="132" x2="303" y2="132"/>
        <line x1="222" y1="137" x2="288" y2="137"/>
        <line x1="222" y1="142" x2="302" y2="142"/>
        <line x1="222" y1="147" x2="295" y2="147"/>
        <line x1="222" y1="152" x2="303" y2="152"/>
        <line x1="222" y1="157" x2="278" y2="157"/>
      </g>

      <!-- Column separators -->
      <line x1="121" y1="64" x2="121" y2="162" stroke="#8b7a4a" stroke-width="0.35" opacity="0.5"/>
      <line x1="215" y1="64" x2="215" y2="162" stroke="#8b7a4a" stroke-width="0.35" opacity="0.5"/>

      <!-- Press-blade sweep (fresh ink laid on the page) -->
      <rect x="22" y="0" width="336" height="44" fill="url(#pressBlade)">
        <animate attributeName="y" values="-40;170;-40" keyTimes="0;0.5;1" dur="11s" repeatCount="indefinite"/>
      </rect>

      <!-- Bell / press indicator: tiny ink drop pulse near the bottom -->
      <circle cx="330" cy="163" r="1.6" fill="#141008" opacity="0.65">
        <animate attributeName="r" values="1.3;2.2;1.3" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Folded corner (bottom-right) -->
    <path d="M 358 168 l -12 -2 l 14 -6 z" fill="#c9b579" stroke="#8b7a4a" stroke-width="0.3"/>
  </g>

  <!-- ============================== RIGHT: TEXT STACK ============================== -->
  <g transform="translate(400,0)">

    <!-- Small newsboy/paperboy hint: a rolled-newspaper icon in the top-right corner -->
    <g transform="translate(354,14)" opacity="0.9">
      <!-- Rolled paper -->
      <rect x="0" y="6" width="28" height="9" rx="2" ry="2" fill="#f2ecd8" stroke="#c98a3a" stroke-width="0.5"/>
      <!-- Twine tie -->
      <rect x="12" y="4" width="1.8" height="13" fill="#c98a3a"/>
      <!-- Masthead peek -->
      <line x1="3" y1="9.5" x2="10" y2="9.5" stroke="#141008" stroke-width="0.7"/>
      <line x1="3" y1="11.5" x2="9" y2="11.5" stroke="#241a0d" stroke-width="0.4"/>
      <line x1="3" y1="13" x2="8" y2="13" stroke="#241a0d" stroke-width="0.4"/>
      <!-- Subtle nod -->
      <animateTransform attributeName="transform" type="translate"
                        values="354 14; 354 13; 354 14" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- Faint bracket rules -->
    <g opacity="0.10" stroke="#e8c98a" stroke-width="0.6" fill="none">
      <path d="M 20 22 h 40"/>
      <path d="M 20 180 h 30"/>
    </g>

    <!-- Date headline (primary anchor) -->
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" fill="#f2f4fa" letter-spacing="1.1">
      SEPTEMBER 18, 2026
    </text>

    <!-- Sweep underline -->
    <line x1="20" y1="70" x2="362" y2="70" stroke="url(#sweepGrad)" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 342; 220 122; 342 0; 220 122; 0 342"
               keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
    </line>

    <!-- Subhead: NYT · 175 YEARS -->
    <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.5">
      <tspan fill="#e8c98a">THE NEW YORK TIMES</tspan><tspan fill="#f2f4fa"> · 175 YEARS</tspan>
    </text>

    <!-- Tertiary italic -->
    <text x="20" y="117" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#c98a3a" letter-spacing="0.4">
      RAYMOND · JONES · MANHATTAN
    </text>

    <!-- Spec roster -->
    <text x="20" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="600" fill="#8b7a4a" letter-spacing="2.5" opacity="0.98">
      TIMES · DAILY · PRESS · INK
    </text>

    <!-- Caption -->
    <text x="20" y="172" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#d8dfec">
      &#8220;all the news that&#8217;s fit to print.&#8221;
    </text>

    <!-- Ink drop indicator -->
    <circle cx="380" cy="138" r="2.2" fill="#c98a3a" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
