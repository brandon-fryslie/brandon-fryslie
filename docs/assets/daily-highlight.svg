<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Thanksgiving Day (November 26, 2026) -->
<!-- about:
Thanksgiving Day in the United States falls on the fourth Thursday of November by federal statute — Franklin Roosevelt signed the date into law on 26 December 1941 after two years of calendar politics with retailers who wanted a longer shopping season. The holiday itself is far older: a three-day harvest feast held at Plymouth Colony in the autumn of 1621 between fifty-odd English settlers and about ninety Wampanoag under Massasoit is the scene usually invoked, though Abraham Lincoln is the one who made it an annual national day in 1863, in the thick of the Civil War, after a letter-writing campaign by Sarah Josepha Hale. What has stayed constant for four centuries is the smaller gesture underneath the pageant — a table, more food than any one person can eat, and the small ceremony of saying out loud what the year gave you.

The scene is a cornucopia tipped on its side. On the left, a woven horn of plenty curves across the canvas; pumpkins, apples, an ear of corn, and a sheaf of wheat spill from its mouth and roll toward the centre. Autumn leaves drift down across the whole canvas on slow, staggered paths. On the right, a cream NOVEMBER 26, 2026 headline sits over a double cream-and-cranberry bar, a cream THANKSGIVING DAY · 405 YEARS subhead, an italic amber PLYMOUTH · 1621 · HARVEST FEAST tertiary, a dim HARVEST · GRATITUDE · GATHERING · HOME · AUTUMN roster, and a Georgia-italic caption at the base reading: For what we are about to receive.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for November 26, 2026 — Thanksgiving Day in the United States. On the left, a woven cornucopia tipped on its side spills a pumpkin, an apple, an ear of corn, and a sheaf of wheat across the canvas; autumn leaves drift downward in staggered motion across the whole scene. On the right, a cream NOVEMBER 26, 2026 headline sits over a double cream-and-cranberry bar, a cream THANKSGIVING DAY · 405 YEARS subhead, an italic amber PLYMOUTH · 1621 · HARVEST FEAST tertiary, a dim HARVEST · GRATITUDE · GATHERING · HOME · AUTUMN roster, and a Georgia-italic caption at the base reading: For what we are about to receive.">
  <defs>
    <!-- Warm dusk backdrop -->
    <radialGradient id="bg" cx="0.35" cy="0.5" r="0.9">
      <stop offset="0"   stop-color="#1e140a"/>
      <stop offset="0.55" stop-color="#140c06"/>
      <stop offset="1"   stop-color="#0a0604"/>
    </radialGradient>

    <!-- Cornucopia weave gradient -->
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0"   stop-color="#8a5a24"/>
      <stop offset="0.5" stop-color="#b57b36"/>
      <stop offset="1"   stop-color="#6b3f17"/>
    </linearGradient>
    <linearGradient id="hornLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a35a"/>
      <stop offset="1" stop-color="#7a4818"/>
    </linearGradient>

    <!-- Pumpkin -->
    <radialGradient id="pumpkin" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0"   stop-color="#ffb46a"/>
      <stop offset="0.5" stop-color="#e07b1f"/>
      <stop offset="1"   stop-color="#8a3e0a"/>
    </radialGradient>

    <!-- Apple -->
    <radialGradient id="apple" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0"   stop-color="#f27a6a"/>
      <stop offset="0.6" stop-color="#b32a1d"/>
      <stop offset="1"   stop-color="#5a0f07"/>
    </radialGradient>

    <!-- Corn kernel -->
    <linearGradient id="corn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#a8701a"/>
    </linearGradient>

    <!-- Wheat stalk -->
    <linearGradient id="wheat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c47a"/>
      <stop offset="1" stop-color="#7a5820"/>
    </linearGradient>

    <!-- One autumn leaf shape, re-used for drifting leaves -->
    <path id="leaf" d="M 0 -6 Q 5 -4 5 0 Q 5 4 0 6 Q -5 4 -5 0 Q -5 -4 0 -6 Z" />

    <!-- Maple-leaf silhouette -->
    <path id="maple" d="M 0 -7 L 2 -2 L 7 -3 L 4 1 L 8 4 L 2 4 L 3 8 L 0 5 L -3 8 L -2 4 L -8 4 L -4 1 L -7 -3 L -2 -2 Z"/>
  </defs>

  <style>
    .headline  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 1.5px; }
    .sub       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 2.4px; }
    .tert      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 1.8px; font-style: italic; }
    .roster    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 2.4px; }
    .caption   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .stamp     { font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }

    /* Text pulse */
    @keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.86; } }
    .fade-1 { animation: softPulse 13s ease-in-out infinite; }
    .fade-2 { animation: softPulse 13s ease-in-out 0.4s infinite; }
    .fade-3 { animation: softPulse 13s ease-in-out 0.8s infinite; }
    .fade-4 { animation: softPulse 13s ease-in-out 1.2s infinite; }
    .fade-5 { animation: softPulse 13s ease-in-out 1.6s infinite; }
    .fade-6 { animation: softPulse 13s ease-in-out 2.0s infinite; }

    /* Caption glimmer */
    @keyframes capGlim { 0%,100% { opacity: 0.82; } 50% { opacity: 1; } }
    .cap { animation: capGlim 13s ease-in-out infinite; }

    /* Bar draw */
    @keyframes barDraw { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
    .bar { transform-origin: left center; transform-box: fill-box; animation: barDraw 1.4s cubic-bezier(.3,.9,.2,1) 0.4s both; }

    /* Pumpkin rocks gently */
    @keyframes rock { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    .rocker { animation: rock 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    /* Apple wobble */
    @keyframes wobble { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-2px) rotate(-5deg); } }
    .wobbler { animation: wobble 11s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    /* Candle-warm glow pulsing */
    @keyframes glow { 0%,100% { opacity: 0.35; } 50% { opacity: 0.6; } }
    .glow { animation: glow 11s ease-in-out infinite; }

    /* Wheat sway */
    @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    .sway { animation: sway 13s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  </style>

  <!-- Backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Warm hearthlight wash -->
  <ellipse cx="200" cy="110" rx="220" ry="110" fill="#c47b22" opacity="0.08" class="glow"/>

  <!-- ============ DRIFTING AUTUMN LEAVES (background layer) ============ -->
  <g opacity="0.75">
    <!-- Each leaf: falls vertically with SMIL animateMotion + slow rotate -->
    <use href="#maple" x="0" y="0" fill="#c04a1a">
      <animateMotion dur="13s" repeatCount="indefinite" path="M 60 -10 Q 50 60 70 120 Q 55 180 65 220" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#maple" x="0" y="0" fill="#e5a53a">
      <animateMotion dur="17s" begin="-3s" repeatCount="indefinite" path="M 220 -15 Q 240 70 215 140 Q 235 200 220 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="13s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#maple" x="0" y="0" fill="#a52a1d">
      <animateMotion dur="19s" begin="-7s" repeatCount="indefinite" path="M 480 -10 Q 465 60 490 130 Q 470 190 485 220"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="17s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#maple" x="0" y="0" fill="#d9792b">
      <animateMotion dur="23s" begin="-11s" repeatCount="indefinite" path="M 660 -12 Q 680 70 655 150 Q 675 200 660 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="19s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#maple" x="0" y="0" fill="#c76a1a">
      <animateMotion dur="29s" begin="-13s" repeatCount="indefinite" path="M 760 -15 Q 745 80 770 150 Q 755 200 765 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="23s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#maple" x="0" y="0" fill="#b05a2a" opacity="0.7">
      <animateMotion dur="31s" begin="-17s" repeatCount="indefinite" path="M 380 -10 Q 395 80 365 140 Q 385 200 370 230"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="29s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- ============ LEFT: CORNUCOPIA TABLEAU ============ -->
  <!-- Wooden-table ground line -->
  <path d="M 10 170 Q 200 165 395 172" stroke="#3a2614" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- Cornucopia body: woven horn, curving from upper right tip down to open mouth facing right -->
  <!-- Horn outline (tip at top-left, opens toward lower-right) -->
  <g>
    <!-- Main horn body -->
    <path d="M 55 70
             Q 30 60 20 85
             Q 15 115 45 135
             Q 90 165 180 160
             Q 230 155 255 140
             Q 240 125 210 125
             Q 170 120 140 108
             Q 100 92 80 78 Z"
          fill="url(#horn)" stroke="#3a2010" stroke-width="1"/>

    <!-- Horn rim / opening -->
    <ellipse cx="240" cy="132" rx="22" ry="12" fill="url(#hornLip)" stroke="#3a2010" stroke-width="0.8"/>
    <ellipse cx="240" cy="132" rx="16" ry="8" fill="#2a1608"/>

    <!-- Weave texture: diagonal cross-hatch strokes along the horn -->
    <g stroke="#6b3f17" stroke-width="0.6" fill="none" opacity="0.65">
      <path d="M 50 75 Q 70 95 60 120"/>
      <path d="M 75 78 Q 90 100 85 128"/>
      <path d="M 100 85 Q 110 110 110 140"/>
      <path d="M 130 95 Q 135 120 140 150"/>
      <path d="M 160 105 Q 160 130 170 156"/>
      <path d="M 190 115 Q 185 135 195 158"/>
      <path d="M 220 122 Q 215 140 230 155"/>
    </g>
    <g stroke="#d9a35a" stroke-width="0.5" fill="none" opacity="0.55">
      <path d="M 40 95 Q 100 105 180 128"/>
      <path d="M 35 115 Q 100 125 190 148"/>
      <path d="M 50 140 Q 110 150 200 158"/>
    </g>
  </g>

  <!-- Spilled bounty — positioned coming out of the horn's mouth, rolling right -->

  <!-- Wheat sheaf (tucked just inside horn opening, leaning out) -->
  <g class="sway" transform="translate(250,118)">
    <g stroke="url(#wheat)" stroke-width="1" fill="none">
      <line x1="0" y1="18" x2="-2" y2="-8"/>
      <line x1="0" y1="18" x2="3"  y2="-10"/>
      <line x1="0" y1="18" x2="-6" y2="-6"/>
      <line x1="0" y1="18" x2="7"  y2="-6"/>
    </g>
    <!-- grain heads -->
    <g fill="url(#wheat)">
      <ellipse cx="-2" cy="-10" rx="1.8" ry="4"/>
      <ellipse cx="3"  cy="-12" rx="1.8" ry="4"/>
      <ellipse cx="-6" cy="-8"  rx="1.6" ry="3.5"/>
      <ellipse cx="7"  cy="-8"  rx="1.6" ry="3.5"/>
    </g>
  </g>

  <!-- Pumpkin — big, on the ground to the right of horn mouth -->
  <g class="rocker" transform="translate(290,152)">
    <g>
      <!-- stem -->
      <path d="M -2 -22 Q 0 -27 3 -22 Q 4 -18 1 -16 Q -3 -17 -2 -22 Z" fill="#4a5a1f"/>
      <!-- body: three overlapping ovals for the ridged pumpkin look -->
      <ellipse cx="-11" cy="-7" rx="10" ry="14" fill="url(#pumpkin)"/>
      <ellipse cx="11"  cy="-7" rx="10" ry="14" fill="url(#pumpkin)"/>
      <ellipse cx="0"   cy="-8" rx="15" ry="16" fill="url(#pumpkin)"/>
      <!-- ridge lines -->
      <g stroke="#7a3a0a" stroke-width="0.6" fill="none" opacity="0.6">
        <path d="M -8 -18 Q -10 -8 -8 4"/>
        <path d="M 8  -18 Q 10 -8 8 4"/>
        <path d="M 0 -22 Q 0 -8 0 5"/>
      </g>
    </g>
  </g>

  <!-- Apple — just past the pumpkin -->
  <g class="wobbler" transform="translate(338,158)">
    <path d="M -2 -10 Q 0 -13 2 -10" stroke="#4a3010" stroke-width="0.8" fill="none"/>
    <path d="M 0 -10 Q 3 -13 5 -10" stroke="#3a5a1a" stroke-width="0.8" fill="none"/>
    <ellipse cx="0" cy="-3" rx="7" ry="7.5" fill="url(#apple)"/>
    <!-- highlight -->
    <ellipse cx="-2.5" cy="-5" rx="1.8" ry="1" fill="#ffd0b8" opacity="0.7"/>
  </g>

  <!-- Ear of corn — rolled out to the right with husk pulled back -->
  <g transform="translate(220,160)">
    <!-- husk leaves -->
    <path d="M 0 0 Q -15 -4 -22 -2 Q -18 2 -4 3 Z" fill="#6b8e23" opacity="0.85"/>
    <path d="M 0 0 Q -10 4 -18 7 Q -10 8 -2 6 Z" fill="#8aa83a" opacity="0.85"/>
    <!-- cob -->
    <ellipse cx="8" cy="0" rx="14" ry="4.5" fill="url(#corn)"/>
    <!-- kernel dots -->
    <g fill="#8a5a10" opacity="0.6">
      <circle cx="0"  cy="-1.5" r="0.7"/>
      <circle cx="4"  cy="0"    r="0.7"/>
      <circle cx="8"  cy="-1.5" r="0.7"/>
      <circle cx="12" cy="0"    r="0.7"/>
      <circle cx="16" cy="-1.5" r="0.7"/>
      <circle cx="2"  cy="1.5"  r="0.7"/>
      <circle cx="6"  cy="1.5"  r="0.7"/>
      <circle cx="10" cy="1.5"  r="0.7"/>
      <circle cx="14" cy="1.5"  r="0.7"/>
    </g>
  </g>

  <!-- Small scattered berries (cranberries) -->
  <g fill="#8b1a1a">
    <circle cx="360" cy="162" r="2.2"/>
    <circle cx="368" cy="167" r="1.8"/>
    <circle cx="355" cy="168" r="1.5"/>
    <circle cx="373" cy="162" r="1.5"/>
    <circle cx="378" cy="168" r="2"/>
  </g>

  <!-- Micro label -->
  <text x="18" y="190" font-size="6" class="stamp" fill="#a87a4a" opacity="0.75">HORN OF PLENTY</text>

  <!-- ============ VERTICAL SEPARATOR ============ -->
  <line x1="405" y1="30" x2="405" y2="170" stroke="#3a2614" stroke-width="0.6" opacity="0.7"/>

  <!-- ============ RIGHT TEXT COLUMN ============ -->
  <text x="425" y="60" font-size="26" class="headline fade-1" fill="#f5e6c8">NOVEMBER 26, 2026</text>

  <g transform="translate(425,70)">
    <rect class="bar" x="0" y="0" width="320" height="3" fill="#f5e6c8"/>
    <rect class="bar" x="0" y="5" width="240" height="2" fill="#a52a2a"/>
  </g>

  <text x="425" y="97" font-size="14" class="sub fade-2" fill="#f5e6c8">THANKSGIVING DAY · 405 YEARS</text>

  <text x="425" y="117" font-size="10.5" class="tert fade-3" fill="#e5a53a">PLYMOUTH · 1621 · HARVEST FEAST</text>

  <text x="425" y="140" font-size="8" class="roster fade-4" fill="#9a8260">HARVEST · GRATITUDE · GATHERING · HOME · AUTUMN</text>

  <text x="425" y="168" font-size="12" class="caption cap fade-5" fill="#d9c9a0">For what we are about to receive.</text>

  <!-- Stamp card: fourth Thursday notation -->
  <g class="fade-6" transform="translate(685,30)">
    <rect x="0" y="0" width="90" height="30" fill="none" stroke="#a52a2a" stroke-opacity="0.55" stroke-width="0.6"/>
    <text x="45" y="12" font-size="6" class="stamp" fill="#e5a53a" text-anchor="middle" opacity="0.9">FOURTH THURSDAY</text>
    <text x="45" y="22" font-size="7.5" class="stamp" fill="#e5a53a" text-anchor="middle" opacity="0.95">26 NOV 2026</text>
  </g>
</svg>
