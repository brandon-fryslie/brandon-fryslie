<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Summer Solstice (June 21, 2026) — longest day of the year in the Northern Hemisphere; the Sun reaches its northernmost point above the Tropic of Cancer. Visualized with the iconic Stonehenge sunrise alignment: trilithon silhouettes along the horizon with a giant radiant sun rising between the central stones, slow-rotating sun rays, drifting heat-shimmer particles, deep dawn-violet sky burning down to molten gold, large bone-white date "JUNE 21, 2026" headline across the top, "SUMMER SOLSTICE · LONGEST DAY" subhead, italic "STONEHENGE ALIGNED · TROPIC OF CANCER · NORTHERN HEMISPHERE" tertiary. Palette: dawn violet (#1a0d3a → #3a1252), molten amber-gold (#ffb02e → #ffe98a), stone slate (#2a2630), bone-white (#f5eed6), solstice ember red (#ff5a2c), over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 21, 2026 — Summer Solstice. A massive radiant sun rises between the central trilithon stones of a Stonehenge silhouette along the horizon, long beams of light rotating slowly outward across a dawn-violet to molten-gold sky. Heat-shimmer particles drift upward. Large bone-white headline JUNE 21, 2026 spans the top with SUMMER SOLSTICE · LONGEST DAY beneath and an italic tertiary line STONEHENGE ALIGNED · TROPIC OF CANCER · NORTHERN HEMISPHERE along the bottom.">
  <defs>
    <!-- Sky: dawn violet melting into molten gold at the horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d0826"/>
      <stop offset="35%"  stop-color="#2a1150"/>
      <stop offset="65%"  stop-color="#7a1f4a"/>
      <stop offset="85%"  stop-color="#ff7a2c"/>
      <stop offset="100%" stop-color="#ffd566"/>
    </linearGradient>

    <!-- Sun disc gradient -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fff7c8"/>
      <stop offset="55%"  stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#ff6a1a"/>
    </radialGradient>

    <!-- Soft halo aura around the sun -->
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd97a" stop-opacity="0.85"/>
      <stop offset="60%"  stop-color="#ff8a2c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3a1252" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground gradient, baked earth at the foreground -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5a2a18"/>
      <stop offset="100%" stop-color="#1a0a08"/>
    </linearGradient>

    <!-- Heat-shimmer turbulence for the warm-air look near the horizon -->
    <filter id="shimmer" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="6">
        <animate attributeName="baseFrequency" dur="13s" values="0.012 0.06;0.018 0.09;0.012 0.06" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>

    <!-- Soft glow filter for text and stones rim-light -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- A single long, thin sun ray. We'll <use> it 16 times in a rotating group. -->
    <polygon id="ray" points="0,-6 520,0 0,6" fill="#ffd97a" opacity="0.18"/>

    <!-- Clip the rays so they don't paint above the date area -->
    <clipPath id="skyclip">
      <rect x="0" y="0" width="800" height="200"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- Sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Rotating sun rays (behind everything) -->
  <g clip-path="url(#skyclip)" style="mix-blend-mode:screen">
    <g transform="translate(400,178)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="61s" repeatCount="indefinite"/>
        <!-- 16 rays around the disc -->
        <use href="#ray" transform="rotate(0)"/>
        <use href="#ray" transform="rotate(22.5)"/>
        <use href="#ray" transform="rotate(45)"/>
        <use href="#ray" transform="rotate(67.5)"/>
        <use href="#ray" transform="rotate(90)"/>
        <use href="#ray" transform="rotate(112.5)"/>
        <use href="#ray" transform="rotate(135)"/>
        <use href="#ray" transform="rotate(157.5)"/>
        <use href="#ray" transform="rotate(180)"/>
        <use href="#ray" transform="rotate(202.5)"/>
        <use href="#ray" transform="rotate(225)"/>
        <use href="#ray" transform="rotate(247.5)"/>
        <use href="#ray" transform="rotate(270)"/>
        <use href="#ray" transform="rotate(292.5)"/>
        <use href="#ray" transform="rotate(315)"/>
        <use href="#ray" transform="rotate(337.5)"/>
      </g>
    </g>

    <!-- A second, slower set of bolder rays, counter-rotating, for layered shimmer -->
    <g transform="translate(400,178)" opacity="0.55">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="360" to="0" dur="97s" repeatCount="indefinite"/>
        <use href="#ray" transform="rotate(11)"   opacity="0.85"/>
        <use href="#ray" transform="rotate(56)"   opacity="0.85"/>
        <use href="#ray" transform="rotate(101)"  opacity="0.85"/>
        <use href="#ray" transform="rotate(146)"  opacity="0.85"/>
        <use href="#ray" transform="rotate(191)"  opacity="0.85"/>
        <use href="#ray" transform="rotate(236)"  opacity="0.85"/>
        <use href="#ray" transform="rotate(281)"  opacity="0.85"/>
        <use href="#ray" transform="rotate(326)"  opacity="0.85"/>
      </g>
    </g>
  </g>

  <!-- Sun aura (breathing) -->
  <circle cx="400" cy="178" r="120" fill="url(#aura)">
    <animate attributeName="r" values="118;132;118" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Sun disc — rising between the central trilithon stones -->
  <circle cx="400" cy="178" r="58" fill="url(#sun)">
    <animate attributeName="cy" values="184;172;184" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- Sun-glare horizontal flare on the horizon -->
  <ellipse cx="400" cy="178" rx="380" ry="6" fill="#ffe98a" opacity="0.45">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="360;400;360" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Drifting heat-shimmer particles (gold motes rising) -->
  <g fill="#ffe98a" opacity="0.85">
    <circle cx="160" cy="180" r="1.6">
      <animate attributeName="cy" values="200;60" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="180" r="1.2">
      <animate attributeName="cy" values="200;50" dur="17s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="17s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="180" r="1.8">
      <animate attributeName="cy" values="200;70" dur="19s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="19s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="182" r="1.4">
      <animate attributeName="cy" values="200;55" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="182" r="1.5">
      <animate attributeName="cy" values="200;60" dur="13s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="180" r="1.2">
      <animate attributeName="cy" values="200;65" dur="17s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="17s" begin="-9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="180" r="1.6">
      <animate attributeName="cy" values="200;55" dur="19s" begin="-11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="19s" begin="-11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="180" r="1.3">
      <animate attributeName="cy" values="200;70" dur="13s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="13s" begin="-6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="180" r="1.8">
      <animate attributeName="cy" values="200;60" dur="11s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="-4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Stonehenge trilithon silhouettes along the horizon, with heat shimmer -->
  <g filter="url(#shimmer)">
    <!-- Left outer trilithon (smaller, further away) -->
    <g fill="#1a1422">
      <rect x="90"  y="150" width="14" height="42"/>
      <rect x="120" y="150" width="14" height="42"/>
      <rect x="86"  y="144" width="52" height="8"/>
    </g>
    <!-- Left mid trilithon -->
    <g fill="#221a2a">
      <rect x="180" y="138" width="18" height="54"/>
      <rect x="216" y="138" width="18" height="54"/>
      <rect x="176" y="130" width="62" height="10"/>
    </g>
    <!-- Central trilithon — sun rises between these uprights -->
    <g fill="#2a2030">
      <rect x="332" y="120" width="26" height="72"/>
      <rect x="442" y="120" width="26" height="72"/>
      <rect x="326" y="108" width="148" height="14"/>
    </g>
    <!-- Right mid trilithon -->
    <g fill="#221a2a">
      <rect x="566" y="138" width="18" height="54"/>
      <rect x="602" y="138" width="18" height="54"/>
      <rect x="562" y="130" width="62" height="10"/>
    </g>
    <!-- Right outer trilithon -->
    <g fill="#1a1422">
      <rect x="666" y="150" width="14" height="42"/>
      <rect x="696" y="150" width="14" height="42"/>
      <rect x="662" y="144" width="52" height="8"/>
    </g>

    <!-- Foreground ground line -->
    <rect x="0" y="190" width="800" height="10" fill="url(#ground)"/>
  </g>

  <!-- Rim-light on the stones' tops facing the sun -->
  <g fill="#ffb46a" opacity="0.5">
    <rect x="326" y="108" width="148" height="2"/>
    <rect x="176" y="130" width="62" height="2"/>
    <rect x="562" y="130" width="62" height="2"/>
  </g>

  <!-- ===== Text layer ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Subtle dark band behind the headline to guarantee legibility against bright sky -->
    <rect x="0" y="2" width="800" height="44" fill="#0d0826" opacity="0.55"/>

    <!-- Primary headline: today's date -->
    <text x="400" y="38" text-anchor="middle"
          font-size="34" font-weight="800" letter-spacing="6"
          fill="#f7eed0" filter="url(#softglow)">
      JUNE 21, 2026
    </text>

    <!-- Subhead with a pulsing solstice ember accent -->
    <text x="400" y="62" text-anchor="middle"
          font-size="13" font-weight="700" letter-spacing="6"
          fill="#ffd97a">
      SUMMER SOLSTICE
      <tspan fill="#ff5a2c">  ·  </tspan>
      <tspan>LONGEST DAY OF THE YEAR</tspan>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- Dark band behind tertiary line for legibility against dark stones -->
    <rect x="0" y="176" width="800" height="20" fill="#0d0826" opacity="0.78"/>

    <!-- Tertiary italic line -->
    <text x="400" y="190" text-anchor="middle"
          font-size="11" font-style="italic" font-weight="600" letter-spacing="4"
          fill="#ffe98a">
      STONEHENGE ALIGNED  ·  TROPIC OF CANCER  ·  NORTHERN HEMISPHERE
    </text>
  </g>

  <!-- Vignette to keep the eye centered on the sun + headline -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="800" height="200" fill="url(#vignette)"/>
</svg>
