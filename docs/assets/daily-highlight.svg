<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Gossamer Condor — 49th Anniversary (August 23, 1977) -->
<!-- about:
On the morning of 23 August 1977, at Shafter Airport north of Bakersfield, California, a 137-pound aircraft made of aluminium tubing, piano wire, mylar film, and corrugated cardboard ribs completed a figure-eight course around two pylons half a mile apart. Its pilot, Bryan Allen, pedalled a bicycle drivetrain that turned a rear pusher propeller; the aircraft — designed by Paul MacCready and a small volunteer team — was the Gossamer Condor, and the flight won the £50,000 Kremer Prize, seventeen years old and until that morning unclaimed. Human-powered flight had been attempted since Icarus; Condor was the first machine to prove it could actually be done. Two years later Allen would pedal MacCready's follow-up, the Gossamer Albatross, across the English Channel.

The left half is the Condor over Shafter at dawn: an enormous translucent wing spanning most of the frame, delicate rib lines glowing under a low amber sun, the pilot silhouetted in the pod pedalling a bicycle drivetrain, a slow pusher propeller spinning behind, and a long horizontal stabilizer forward on a slender boom. Distant Central Valley hills scroll by beneath. On the right, a large AUGUST 23, 2026 headline anchors a silver GOSSAMER CONDOR · 49 YEARS subhead, an italic amber MACCREADY · ALLEN · SHAFTER · KREMER PRIZE tertiary, a dim cyan MYLAR · ALUMINIUM · PIANO WIRE · 137 LB roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 23, 2026 — the 49th anniversary of the Gossamer Condor winning the Kremer Prize for the first sustained, controlled human-powered flight. On the left half, the Condor flies at dawn over the Central Valley: an enormous translucent single-wing spans most of the panel with delicate rib lines glowing in warm sunlight, the pilot silhouetted in a small transparent pod pedals a bicycle drivetrain, a slow pusher propeller spins behind, and a long horizontal stabilizer on a slender forward boom leads the aircraft. Low golden hills scroll below under a pale peach-to-blue dawn sky with a hazy sun. On the right, a huge cream AUGUST 23, 2026 headline underlined by a gold-to-amber sweep, a silver GOSSAMER CONDOR · 49 YEARS subhead trailed by cream · SINCE 1977, an italic amber MACCREADY · ALLEN · SHAFTER · KREMER PRIZE tertiary, a dim cyan MYLAR · ALUMINIUM · PIANO WIRE · 137 LB roster, and a Georgia-italic 'a bicycle that learned to fly.' caption at the base.">
  <defs>
    <linearGradient id="dawnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#12213a"/>
      <stop offset="35%"  stop-color="#3a4870"/>
      <stop offset="70%"  stop-color="#c8895a"/>
      <stop offset="100%" stop-color="#f4c48a"/>
    </linearGradient>
    <linearGradient id="hillsFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a4a68"/>
      <stop offset="100%" stop-color="#3a3050"/>
    </linearGradient>
    <linearGradient id="hillsMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8a5a48"/>
      <stop offset="100%" stop-color="#4a2f28"/>
    </linearGradient>
    <linearGradient id="hillsNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9a6a3a"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>
    <radialGradient id="sunHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fff2c8" stop-opacity="0.85"/>
      <stop offset="40%"  stop-color="#f4b866" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8895a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fff8e0"/>
      <stop offset="80%"  stop-color="#ffd48a"/>
      <stop offset="100%" stop-color="#f4a860"/>
    </radialGradient>
    <linearGradient id="wingSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5efe0" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#e2d5a8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#a89460" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="stabSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f5efe0" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#c8b988" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f4c48a" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#f4c48a" stop-opacity="1"/>
      <stop offset="48%"  stop-color="#f5efe0" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#c8895a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3a2818" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky background (dawn) -->
  <rect x="0" y="0" width="360" height="200" fill="url(#dawnSky)"/>

  <!-- Sun halo & disc, low on the horizon behind the hills -->
  <ellipse cx="70" cy="150" rx="70" ry="60" fill="url(#sunHalo)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="70" cy="150" r="15" fill="url(#sunDisc)">
    <animate attributeName="r" values="14.5;15.5;14.5" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Distant hills (scrolling slowly right-to-left) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -40 0; 0 0" dur="53s" repeatCount="indefinite"/>
    <path d="M -40 168 L 0 160 L 40 164 L 90 156 L 140 162 L 200 154 L 260 160 L 320 156 L 400 162 L 400 200 L -40 200 Z"
          fill="url(#hillsFar)" opacity="0.85"/>
  </g>

  <!-- Mid hills (scroll faster) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -70 0; 0 0" dur="37s" repeatCount="indefinite"/>
    <path d="M -70 180 L 0 174 L 60 178 L 120 170 L 180 176 L 240 172 L 300 178 L 360 174 L 430 180 L 430 200 L -70 200 Z"
          fill="url(#hillsMid)" opacity="0.9"/>
  </g>

  <!-- Near ground (scroll fastest) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -120 0; 0 0" dur="23s" repeatCount="indefinite"/>
    <path d="M -120 194 L 0 190 L 60 192 L 120 188 L 180 191 L 240 189 L 300 192 L 360 190 L 480 194 L 480 200 L -120 200 Z"
          fill="url(#hillsNear)"/>
  </g>

  <!-- Faint high haze streaks -->
  <g stroke="#f4c48a" stroke-width="0.5" fill="none" opacity="0.35">
    <path d="M 0 62 Q 90 58 180 62 T 360 62">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="17s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 82 Q 100 78 200 82 T 360 82">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="19s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ THE GOSSAMER CONDOR ============ -->
  <!-- Whole aircraft drifts gently as one unit (a slow bob) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 4 -2; 0 0; -3 1; 0 0" dur="13s" repeatCount="indefinite"/>

    <!-- Forward outrigger boom to the horizontal stabilizer/canard (long slender) -->
    <line x1="180" y1="118" x2="66" y2="102" stroke="#3a2f22" stroke-width="0.7" opacity="0.85"/>
    <!-- Boom brace wires (piano wire look) -->
    <line x1="180" y1="118" x2="120" y2="94" stroke="#8a7f5a" stroke-width="0.25" opacity="0.6"/>
    <line x1="180" y1="118" x2="120" y2="112" stroke="#8a7f5a" stroke-width="0.25" opacity="0.6"/>

    <!-- Forward horizontal stabilizer / canard (translucent) with a very gentle bend -->
    <path d="M 30 100 Q 66 96 102 100 L 100 106 Q 66 102 32 106 Z"
          fill="url(#stabSkin)" stroke="#a89460" stroke-width="0.35" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate"
        values="-0.6 66 102; 0.6 66 102; -0.6 66 102"
        dur="11s" repeatCount="indefinite"/>
    </path>
    <!-- Stabilizer rib lines -->
    <g stroke="#a89460" stroke-width="0.2" opacity="0.5">
      <line x1="40" y1="99" x2="40" y2="106"/>
      <line x1="52" y1="98" x2="52" y2="106"/>
      <line x1="66" y1="97" x2="66" y2="105"/>
      <line x1="80" y1="98" x2="80" y2="106"/>
      <line x1="92" y1="99" x2="92" y2="106"/>
    </g>

    <!-- ============ MAIN WING (enormous, translucent, subtle flex) ============ -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-0.4 180 84; 0.4 180 84; -0.4 180 84"
        dur="17s" repeatCount="indefinite"/>

      <!-- The wing planform: leading edge slightly curved forward, trailing edge slightly aft; huge span -->
      <path d="M 40 88
               Q 110 82 180 80
               Q 250 82 320 88
               L 322 100
               Q 250 98 180 96
               Q 110 98 38 100 Z"
            fill="url(#wingSkin)" stroke="#a89460" stroke-width="0.5" opacity="0.92"/>

      <!-- Rib lines running chord-wise across the wing (many, close together) -->
      <g stroke="#8a7f5a" stroke-width="0.28" opacity="0.7">
        <line x1="48"  y1="88" x2="46"  y2="100"/>
        <line x1="62"  y1="86" x2="60"  y2="100"/>
        <line x1="76"  y1="85" x2="74"  y2="99"/>
        <line x1="90"  y1="84" x2="88"  y2="99"/>
        <line x1="104" y1="83" x2="102" y2="99"/>
        <line x1="118" y1="82" x2="116" y2="98"/>
        <line x1="132" y1="82" x2="130" y2="98"/>
        <line x1="146" y1="81" x2="144" y2="98"/>
        <line x1="160" y1="80" x2="158" y2="97"/>
        <line x1="174" y1="80" x2="172" y2="97"/>
        <line x1="188" y1="80" x2="186" y2="97"/>
        <line x1="202" y1="80" x2="200" y2="97"/>
        <line x1="216" y1="81" x2="214" y2="97"/>
        <line x1="230" y1="82" x2="228" y2="98"/>
        <line x1="244" y1="82" x2="242" y2="98"/>
        <line x1="258" y1="83" x2="256" y2="98"/>
        <line x1="272" y1="84" x2="270" y2="99"/>
        <line x1="286" y1="85" x2="284" y2="99"/>
        <line x1="300" y1="86" x2="298" y2="99"/>
        <line x1="314" y1="87" x2="312" y2="100"/>
      </g>

      <!-- Main spar tube -->
      <line x1="42" y1="90" x2="320" y2="90" stroke="#3a2f22" stroke-width="0.9" opacity="0.85"/>
      <!-- Trailing edge cable -->
      <line x1="40" y1="99" x2="322" y2="99" stroke="#5a4a30" stroke-width="0.35" opacity="0.7"/>

      <!-- Kingpost above the wing for the bracing wires -->
      <line x1="180" y1="88" x2="180" y2="66" stroke="#3a2f22" stroke-width="0.55"/>
      <!-- Bracing wires from kingpost down to the wing (top rigging) -->
      <g stroke="#8a7f5a" stroke-width="0.22" opacity="0.7">
        <line x1="180" y1="66" x2="70"  y2="88"/>
        <line x1="180" y1="66" x2="110" y2="86"/>
        <line x1="180" y1="66" x2="145" y2="84"/>
        <line x1="180" y1="66" x2="215" y2="84"/>
        <line x1="180" y1="66" x2="250" y2="86"/>
        <line x1="180" y1="66" x2="290" y2="88"/>
      </g>
    </g>

    <!-- ============ PILOT POD (transparent gondola beneath center wing) ============ -->
    <!-- Pod outline (fuselage/gondola frame) -->
    <path d="M 160 108 Q 158 118 168 132 L 200 132 Q 210 118 208 108 Z"
          fill="#0d1117" fill-opacity="0.35" stroke="#3a2f22" stroke-width="0.6"/>
    <!-- Pod transparent skin highlight -->
    <path d="M 162 110 Q 160 118 168 128 L 200 128 Q 208 118 206 110"
          fill="none" stroke="#f5efe0" stroke-width="0.3" opacity="0.55"/>

    <!-- Vertical support strut from pod up to main spar (single tube visible through pod) -->
    <line x1="184" y1="108" x2="184" y2="90" stroke="#3a2f22" stroke-width="0.55"/>

    <!-- PILOT silhouette pedalling -->
    <!-- Head -->
    <circle cx="184" cy="114" r="3.2" fill="#141821"/>
    <!-- Torso (leaning slightly forward, aero position) -->
    <path d="M 182 117 L 178 128 L 188 128 L 190 117 Z" fill="#141821"/>
    <!-- Front leg pedalling: pivots at hip near 184,126 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-25 184 126; 25 184 126; -25 184 126"
        dur="2s" repeatCount="indefinite"/>
      <line x1="184" y1="126" x2="188" y2="134" stroke="#141821" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Back leg pedalling (opposite phase) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="25 184 126; -25 184 126; 25 184 126"
        dur="2s" repeatCount="indefinite"/>
      <line x1="184" y1="126" x2="180" y2="134" stroke="#141821" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <!-- Arms forward on the control bar -->
    <line x1="184" y1="118" x2="174" y2="120" stroke="#141821" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Bicycle chainring visible below pilot (small dark circle) -->
    <circle cx="184" cy="130" r="2.2" fill="none" stroke="#3a2f22" stroke-width="0.5"/>
    <circle cx="184" cy="130" r="0.8" fill="#3a2f22"/>

    <!-- Drive shaft running back to propeller (long thin line, angled up slightly) -->
    <line x1="186" y1="128" x2="248" y2="112" stroke="#3a2f22" stroke-width="0.6" opacity="0.85"/>
    <!-- Support strut for drive shaft -->
    <line x1="220" y1="120" x2="220" y2="98" stroke="#3a2f22" stroke-width="0.35" opacity="0.7"/>

    <!-- ============ PUSHER PROPELLER (behind pilot, rotating) ============ -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 248 108; 360 248 108"
        dur="1.5s" repeatCount="indefinite"/>
      <!-- Two-blade propeller, long and slender -->
      <path d="M 248 92 Q 250 100 248 108 Q 246 100 248 92 Z" fill="#2a2015" opacity="0.9"/>
      <path d="M 248 124 Q 250 116 248 108 Q 246 116 248 124 Z" fill="#2a2015" opacity="0.9"/>
      <!-- Hub -->
      <circle cx="248" cy="108" r="1.4" fill="#3a2f22"/>
    </g>
    <!-- Prop disc blur (a faint elliptical hint of the spinning arc) -->
    <ellipse cx="248" cy="108" rx="3" ry="17" fill="none" stroke="#f5efe0" stroke-width="0.25" opacity="0.28"/>

  </g>

  <!-- A single tiny bird for scale, drifting -->
  <g opacity="0.6">
    <path d="M 300 60 q 3 -2 6 0 q 3 -2 6 0" fill="none" stroke="#3a2818" stroke-width="0.6">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 20 -6; 40 -2; 60 -8" dur="29s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Seam between sky panel and text panel -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <rect x="360" y="0" width="440" height="200" fill="#0d1117"/>

  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 23, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#c8d4e8">GOSSAMER CONDOR</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;49 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;·&#160;1977</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    MACCREADY · ALLEN · SHAFTER · KREMER PRIZE
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7fd4b8" letter-spacing="1" opacity="0.9">
    MYLAR · ALUMINIUM · PIANO WIRE · 137 LB
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;a bicycle that learned to fly.&#8221;
  </text>
</svg>
