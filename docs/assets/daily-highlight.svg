<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: International Dance Day (April 29) — UNESCO observance honoring Jean-Georges Noverre's birthday -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="April 29, 2026 — International Dance Day">
  <defs>
    <radialGradient id="stage" cx="0.5" cy="1" r="1.1">
      <stop offset="0%" stop-color="#3a1240"/>
      <stop offset="55%" stop-color="#180a26"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3d8b" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff3d8b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7b5cff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ribbonC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6b3d" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="dateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff3d8b"/>
    </linearGradient>

    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#fff7d6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .marquee { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: 0.18em; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 0.42em; }
      .floorline { stroke: #ffffff; stroke-opacity: 0.08; stroke-width: 1; }

      @keyframes spotSweep1 { 0%,100% { transform: translateX(-30px) rotate(-6deg); } 50% { transform: translateX(30px) rotate(6deg); } }
      @keyframes spotSweep2 { 0%,100% { transform: translateX(20px) rotate(5deg); } 50% { transform: translateX(-20px) rotate(-5deg); } }
      @keyframes flicker { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }

      .spot1 { transform-origin: 200px 0px; animation: spotSweep1 11s ease-in-out infinite, flicker 7s ease-in-out infinite; }
      .spot2 { transform-origin: 600px 0px; animation: spotSweep2 13s ease-in-out infinite, flicker 11s ease-in-out infinite; }

      @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
      .dateText { animation: shimmer 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Stage backdrop -->
  <rect width="800" height="200" fill="url(#stage)"/>

  <!-- Faint stage floor perspective lines -->
  <g class="floorline">
    <line x1="0" y1="172" x2="800" y2="172"/>
    <line x1="0" y1="184" x2="800" y2="184"/>
    <line x1="0" y1="196" x2="800" y2="196"/>
  </g>

  <!-- Theatre spotlights (animated cones from above) -->
  <g class="spot1">
    <ellipse cx="200" cy="200" rx="180" ry="220" fill="url(#spot)"/>
  </g>
  <g class="spot2">
    <ellipse cx="600" cy="200" rx="180" ry="220" fill="url(#spot)"/>
  </g>

  <!-- Ribbon trails — flowing arcs that sweep behind dancers -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M 60 150 Q 160 40 260 150 T 460 150" fill="none" stroke="url(#ribbonA)" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d"
        dur="11s" repeatCount="indefinite"
        values="
          M 60 150 Q 160 40 260 150 T 460 150;
          M 60 150 Q 160 90 260 110 T 460 150;
          M 60 150 Q 160 30 260 160 T 460 150;
          M 60 150 Q 160 40 260 150 T 460 150"/>
      <animate attributeName="stroke-dasharray" values="0,600;600,0;0,600" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M 340 160 Q 460 50 580 150 T 760 140" fill="none" stroke="url(#ribbonB)" stroke-width="5" stroke-linecap="round">
      <animate attributeName="d"
        dur="13s" repeatCount="indefinite"
        values="
          M 340 160 Q 460 50 580 150 T 760 140;
          M 340 160 Q 460 110 580 80 T 760 140;
          M 340 160 Q 460 30 580 170 T 760 140;
          M 340 160 Q 460 50 580 150 T 760 140"/>
    </path>
    <path d="M 120 170 Q 260 90 400 160 T 700 130" fill="none" stroke="url(#ribbonC)" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <animate attributeName="d"
        dur="17s" repeatCount="indefinite"
        values="
          M 120 170 Q 260 90 400 160 T 700 130;
          M 120 170 Q 260 130 400 90 T 700 130;
          M 120 170 Q 260 60 400 180 T 700 130;
          M 120 170 Q 260 90 400 160 T 700 130"/>
    </path>
  </g>

  <!-- DANCER 1 — leaping ballet figure on the left -->
  <g transform="translate(140 130)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,8; 0,-14; 0,8" dur="7s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-6;6;-6" dur="11s" repeatCount="indefinite"/>
        <!-- Head -->
        <circle cx="0" cy="-44" r="6" fill="#ffd9b8"/>
        <!-- Torso -->
        <path d="M -3 -38 C -8 -28 -7 -10 -2 0 C 3 -10 4 -28 3 -38 Z" fill="#ff3d8b"/>
        <!-- Tutu skirt -->
        <path d="M -22 -2 Q 0 -14 22 -2 L 18 8 Q 0 -2 -18 8 Z" fill="#ffd166" opacity="0.95"/>
        <!-- Arms -->
        <path d="M -2 -32 Q -22 -42 -32 -56" stroke="#ffd9b8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 2 -32 Q 22 -42 34 -54" stroke="#ffd9b8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Legs (one extended in arabesque) -->
        <path d="M -2 0 Q -6 16 -10 30" stroke="#ffd9b8" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M 2 0 Q 24 6 50 -2" stroke="#ffd9b8" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- Pointed foot -->
        <circle cx="50" cy="-2" r="2.5" fill="#ffd9b8"/>
      </g>
    </g>
  </g>

  <!-- DANCER 2 — modern/contemporary in the middle -->
  <g transform="translate(400 132)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,4; 0,-10; 0,4" dur="11s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="8;-10;8" dur="13s" repeatCount="indefinite"/>
        <!-- Head -->
        <circle cx="0" cy="-46" r="6" fill="#ffd9b8"/>
        <!-- Torso (longer, leaning) -->
        <path d="M -4 -40 C -10 -22 -8 -4 -2 4 C 4 -4 6 -22 4 -40 Z" fill="#7b5cff"/>
        <!-- Free-flowing skirt -->
        <path d="M -18 2 Q 0 -8 22 0 L 26 14 Q 0 6 -22 14 Z" fill="#22d3ee" opacity="0.9"/>
        <!-- One arm reaching up, other flowing out -->
        <path d="M -2 -36 Q -10 -56 -6 -78" stroke="#ffd9b8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 2 -36 Q 28 -34 44 -22" stroke="#ffd9b8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Legs (in fourth/lunge) -->
        <path d="M -2 4 Q -8 22 -22 32" stroke="#ffd9b8" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M 2 4 Q 14 18 28 32" stroke="#ffd9b8" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- DANCER 3 — energetic spin on the right -->
  <g transform="translate(660 134)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,6; 0,-12; 0,6" dur="13s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-12;12;-12" dur="7s" repeatCount="indefinite"/>
        <!-- Head -->
        <circle cx="0" cy="-44" r="6" fill="#ffd9b8"/>
        <!-- Torso -->
        <path d="M -3 -38 C -8 -26 -6 -8 -1 2 C 4 -8 5 -26 3 -38 Z" fill="#ff6b3d"/>
        <!-- Twirling skirt — wider on one side from spin -->
        <path d="M -28 0 Q 0 -16 24 -2 L 28 12 Q 0 4 -32 12 Z" fill="#ffd166" opacity="0.92"/>
        <!-- Arms outstretched -->
        <path d="M -2 -34 Q -24 -36 -42 -28" stroke="#ffd9b8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 2 -34 Q 24 -36 40 -26" stroke="#ffd9b8" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Legs in attitude -->
        <path d="M -2 2 Q -4 18 -8 32" stroke="#ffd9b8" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M 2 2 Q 18 12 32 4" stroke="#ffd9b8" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Floating glints/sparkles -->
  <g fill="#ffd166" opacity="0.85">
    <circle cx="80" cy="60" r="1.6">
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="40" r="1.2">
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="50" r="1.8">
      <animate attributeName="opacity" values="0;1;0" dur="13s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="36" r="1.4">
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="28" r="1.1">
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Marquee plate behind the date for legibility -->
  <g>
    <rect x="220" y="62" width="360" height="56" rx="6"
      fill="#0d1117" fill-opacity="0.55" stroke="#ffd166" stroke-opacity="0.55" stroke-width="1"/>
    <!-- Inner accent ticks -->
    <line x1="232" y1="70" x2="232" y2="110" stroke="#ffd166" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="568" y1="70" x2="568" y2="110" stroke="#ffd166" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- The Date — the prominent visual anchor -->
  <text x="400" y="103" text-anchor="middle"
        class="marquee dateText"
        font-size="30"
        fill="url(#dateGrad)"
        filter="url(#glow)">APRIL 29 · 2026</text>

  <!-- Sub-label -->
  <text x="400" y="40" text-anchor="middle"
        class="sub"
        font-size="11"
        fill="#ffd166"
        opacity="0.92">INTERNATIONAL DANCE DAY</text>

  <!-- Tiny ornamental footer -->
  <text x="400" y="158" text-anchor="middle"
        class="sub"
        font-size="8"
        fill="#ffffff"
        opacity="0.45">UNESCO · SINCE 1982 · NOVERRE</text>
</svg>
