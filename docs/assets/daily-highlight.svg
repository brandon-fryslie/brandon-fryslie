<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Nadia Comăneci's Perfect 10 — 50th anniversary (July 18, 1976, Montreal Olympics). The 14-year-old Romanian gymnast scored the first perfect 10 in Olympic history on the uneven bars, but the scoreboard had been designed to only display up to 9.99 — so it read "1.00" instead. A late-70s stadium scoreboard tableau: deep navy stadium darkness with warm rim-light, five Olympic rings across the top, a silhouetted gymnast mid-release on the uneven bars at the left, a big amber-LED scoreboard on the right displaying 1.00 that occasionally glitches to 10.00, a large ivory JULY 18, 2026 headline center-right, a red-yellow-blue NADIA COMĂNECI · PERFECT 10 · 50 YEARS subhead (echoing the Romanian tricolor), and italic MONTREAL 1976 · UNEVEN BARS · "THE BOARD SHOWED 1.00" tertiary along the bottom. Palette: stadium navy #0a0e17, warm rim #1c2436, scoreboard black #050505, LED amber #ffb020, LED bright #ffe090, LED shadow #a04000, ivory #f5efd7, Romania blue #002b7f, Romania yellow #fcd116, Romania red #ce1126, ring blue #0081c8, ring yellow #fcb131, ring green #00a651, ring red #ee334e. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 18, 2026 — 50th anniversary of Nadia Comăneci's Perfect 10 at the Montreal Olympics, July 18, 1976. A silhouetted gymnast mid-release on the uneven bars on the left, five Olympic rings across the top, a late-70s amber-LED scoreboard on the right glitching between 1.00 and 10.00, a large JULY 18, 2026 headline, NADIA COMĂNECI · PERFECT 10 · 50 YEARS subhead in Romanian tricolor, and MONTREAL 1976 · UNEVEN BARS · THE BOARD SHOWED 1.00 tertiary along the bottom.">
  <defs>
    <!-- deep stadium darkness with a soft warm floor light -->
    <radialGradient id="bg" cx="50%" cy="110%" r="90%">
      <stop offset="0%" stop-color="#2a2438"/>
      <stop offset="35%" stop-color="#141a2a"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>

    <!-- scoreboard bezel gradient -->
    <linearGradient id="bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>

    <!-- LED glow -->
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe090" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>

    <!-- gymnast fill -->
    <linearGradient id="gym" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5efd7"/>
      <stop offset="100%" stop-color="#c9a56b"/>
    </linearGradient>

    <!-- seven-segment digit builder: use a symbol per digit -->
    <!-- Each digit sits in a 30x50 viewbox. Segments a,b,c,d,e,f,g. -->
    <!-- Rather than symbols per digit, we draw digits inline as grouped rects with opacity animations. -->

    <!-- spotlight beam -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe090" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffe090" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- soft spotlight beams -->
  <polygon points="150,-10 250,-10 320,210 80,210" fill="url(#beam)" opacity="0.6"/>
  <polygon points="560,-10 660,-10 720,210 500,210" fill="url(#beam)" opacity="0.35"/>

  <!-- floor line -->
  <line x1="20" y1="188" x2="780" y2="188" stroke="#3a4358" stroke-width="1" opacity="0.5"/>

  <!-- ===== OLYMPIC RINGS (top) ===== -->
  <g transform="translate(400 22)" opacity="0.95">
    <g fill="none" stroke-width="3">
      <circle cx="-48" cy="0" r="10" stroke="#0081c8"/>
      <circle cx="-24" cy="0" r="10" stroke="#fcb131"/>
      <circle cx="0"   cy="0" r="10" stroke="#e8e8e8"/>
      <circle cx="24"  cy="0" r="10" stroke="#00a651"/>
      <circle cx="48"  cy="0" r="10" stroke="#ee334e"/>
    </g>
    <!-- gentle glow pulse -->
    <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- ===== GYMNAST + UNEVEN BARS (left) ===== -->
  <!-- Two uneven bars: low bar and high bar -->
  <g stroke="#e8dcc0" stroke-width="3" stroke-linecap="round">
    <!-- high bar -->
    <line x1="40" y1="70" x2="240" y2="70"/>
    <!-- low bar -->
    <line x1="40" y1="140" x2="240" y2="140"/>
    <!-- uprights -->
    <line x1="45" y1="30" x2="45" y2="185" stroke="#7a6a4a" stroke-width="4"/>
    <line x1="235" y1="30" x2="235" y2="185" stroke="#7a6a4a" stroke-width="4"/>
  </g>

  <!-- gymnast: stylized mid-release figure floating above the high bar -->
  <g>
    <!-- slow drift up and settle -->
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -6; 0 0; 0 -3; 0 0" dur="11s" repeatCount="indefinite"/>
    <g transform="translate(140 55)" fill="url(#gym)" stroke="#7a5c30" stroke-width="0.8">
      <!-- gentle body sway -->
      <animateTransform attributeName="transform" type="rotate"
        values="-6 0 0; 6 0 0; -6 0 0" dur="13s" repeatCount="indefinite" additive="sum"/>
      <!-- torso -->
      <ellipse cx="0" cy="0" rx="9" ry="16"/>
      <!-- leotard accent (Romanian tricolor stripe) -->
      <rect x="-9" y="-4" width="18" height="3" fill="#002b7f"/>
      <rect x="-9" y="-1" width="18" height="3" fill="#fcd116"/>
      <rect x="-9" y="2"  width="18" height="3" fill="#ce1126"/>
      <!-- head -->
      <circle cx="0" cy="-22" r="7"/>
      <!-- hair bun -->
      <circle cx="6" cy="-27" r="3" fill="#3a2a18"/>
      <!-- arms outstretched upward (release move) -->
      <path d="M -6 -10 Q -22 -18 -30 -30" stroke="url(#gym)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M  6 -10 Q  22 -18  30 -30" stroke="url(#gym)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- hands -->
      <circle cx="-30" cy="-30" r="3"/>
      <circle cx="30" cy="-30" r="3"/>
      <!-- legs together, pointed toes -->
      <path d="M -3 14 Q -6 30 -3 44" stroke="url(#gym)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M  3 14 Q  6 30  3 44" stroke="url(#gym)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- feet -->
      <ellipse cx="-3" cy="46" rx="3" ry="2"/>
      <ellipse cx="3"  cy="46" rx="3" ry="2"/>
    </g>
  </g>

  <!-- little chalk-dust puffs floating up from the bars -->
  <g fill="#f5efd7" opacity="0.7">
    <circle cx="80" cy="140" r="1.6">
      <animate attributeName="cy" values="140;110;80" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="140" r="1.2">
      <animate attributeName="cy" values="140;115;90" dur="11s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.6;0.3;0" dur="11s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="200" cy="140" r="1.4">
      <animate attributeName="cy" values="140;105;70" dur="13s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.6;0.2;0" dur="13s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="60" cy="70" r="1.2">
      <animate attributeName="cy" values="70;55;40" dur="11s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0.5;0.2;0" dur="11s" repeatCount="indefinite" begin="3s"/>
    </circle>
  </g>

  <!-- ===== SCOREBOARD (upper-right) ===== -->
  <g transform="translate(605 60)">
    <!-- bezel -->
    <rect x="-90" y="-32" width="180" height="64" rx="6" ry="6" fill="url(#bezel)" stroke="#3a3a3a" stroke-width="1.5"/>
    <!-- inner panel -->
    <rect x="-84" y="-26" width="168" height="52" rx="3" ry="3" fill="#050505" stroke="#1a1a1a" stroke-width="1"/>

    <!-- LED glow behind digits -->
    <ellipse cx="0" cy="0" rx="70" ry="20" fill="url(#ledGlow)"/>

    <!-- Score digits: alternate between "1.00" (~4s) and "10.00" (~1s) -->
    <!-- We use two text groups toggled via opacity animation -->
    <g font-family="'Courier New', Consolas, monospace" font-weight="700" text-anchor="middle" letter-spacing="2">
      <!-- "1.00" reading (the bug) -->
      <g fill="#ffb020">
        <text x="0" y="12" font-size="42" style="text-shadow:0 0 6px #ff9500">1.00</text>
        <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;0.65;0.72;0.75;0.92;1" dur="7s" repeatCount="indefinite"/>
      </g>
      <!-- "10.00" reveal (the truth) -->
      <g fill="#ffe090">
        <text x="0" y="12" font-size="34">10.00</text>
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.65;0.72;0.75;0.92;1" dur="7s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- small "SCORE" label -->
    <text x="-72" y="-14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#8a7a4a" letter-spacing="2">SCORE</text>
    <!-- small "BARS" label -->
    <text x="72" y="-14" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#8a7a4a" letter-spacing="2">BARS</text>

    <!-- flicker line -->
    <line x1="-84" y1="0" x2="84" y2="0" stroke="#000" stroke-width="0.5" opacity="0.15"/>

    <!-- tiny caption under the scoreboard -->
    <text x="0" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="600" fill="#c9b280" letter-spacing="2" opacity="0.9">
      THE BOARD WASN'T BUILT FOR A TEN
    </text>
  </g>

  <!-- ===== TEXT BLOCK ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Big date headline -->
    <text x="500" y="145" text-anchor="middle" font-size="38" font-weight="800" fill="#f5efd7" letter-spacing="2">
      JULY 18, 2026
    </text>

    <!-- Romania tricolor accent bar under the date -->
    <g>
      <rect x="380" y="152" width="80" height="3" fill="#002b7f"/>
      <rect x="460" y="152" width="80" height="3" fill="#fcd116"/>
      <rect x="540" y="152" width="80" height="3" fill="#ce1126"/>
    </g>

    <!-- subhead -->
    <text x="500" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#fcd116" letter-spacing="4">
      NADIA COMĂNECI · PERFECT 10 · 50 YEARS
    </text>

    <!-- tertiary -->
    <text x="500" y="192" text-anchor="middle" font-size="9" font-weight="500" font-style="italic" fill="#a89878" letter-spacing="2">
      MONTREAL 1976 · UNEVEN BARS · "THE BOARD SHOWED 1.00"
    </text>
  </g>

  <!-- subtle stadium confetti/light specks -->
  <g fill="#f5efd7" opacity="0.55">
    <circle cx="330" cy="45" r="1">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="30" r="1.2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="13s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="720" cy="180" r="1">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="7s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="280" cy="180" r="1.2">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="11s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="20" cy="100" r="1">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="13s" repeatCount="indefinite" begin="4s"/>
    </circle>
  </g>
</svg>
