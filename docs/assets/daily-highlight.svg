<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: First UPC barcode ever scanned (June 26, 1974, Marsh Supermarket, Troy, Ohio — a 10-pack of Wrigley's Juicy Fruit chewing gum, 67¢; the original pack now in the Smithsonian). 52nd anniversary of point-of-sale automation. Visualized as a 1970s checkout-lane tableau: a large UPC-A barcode dominates the center over a soft retail-tile field, a thin red ruby-laser line sweeps horizontally across the bars in slow rhythm with a faint scatter glow, the 12-digit UPC number row below the bars, a stylized golden Wrigley's Juicy Fruit gum pack stands at right with its red banner and yellow body, a curling thermal-receipt strip at left shows "67¢" and "THANK YOU", a faint scan-beep arc pulses outward when the laser crosses a bar boundary. Large bone-white "JUNE 26, 2026" headline anchors the top with "FIRST UPC SCAN · 52 YEARS" cyan subhead beneath; italic "WRIGLEY'S JUICY FRUIT · MARSH SUPERMARKET · TROY, OHIO · JUNE 26, 1974" tertiary along the bottom. Palette: bone-white bars, deep ink ground, retail laser-red, Juicy-Fruit gold and crimson, thermal cream, cyan retail-display accent, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: 52nd anniversary of the first UPC barcode ever scanned, June 26, 1974, at Marsh Supermarket in Troy Ohio on a pack of Wrigley's Juicy Fruit gum">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#141a26"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.7">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2030" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2030" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2030" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gumPack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="50%" stop-color="#f3c948"/>
      <stop offset="100%" stop-color="#b38712"/>
    </linearGradient>
    <linearGradient id="receipt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf3da"/>
      <stop offset="100%" stop-color="#d9c8a4"/>
    </linearGradient>
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#floor)"/>

  <!-- Subtle retail-tile grid -->
  <g stroke="#1d2536" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="100" y1="155" x2="80" y2="200"/>
    <line x1="250" y1="155" x2="240" y2="200"/>
    <line x1="400" y1="155" x2="400" y2="200"/>
    <line x1="550" y1="155" x2="560" y2="200"/>
    <line x1="700" y1="155" x2="720" y2="200"/>
  </g>

  <!-- ===== THERMAL RECEIPT (left) ===== -->
  <g transform="translate(54 70)">
    <!-- curled paper -->
    <path d="M 0 0 L 70 0 L 70 80 Q 65 95 50 90 Q 38 86 35 95 Q 30 105 18 100 Q 10 96 8 105 L 0 100 Z"
          fill="url(#receipt)" stroke="#8a7a4c" stroke-width="0.6" opacity="0.95"/>
    <!-- header line -->
    <text x="35" y="11" text-anchor="middle" font-family="Courier, monospace" font-size="6.5" font-weight="700" fill="#3a2e10">MARSH SUPER</text>
    <text x="35" y="19" text-anchor="middle" font-family="Courier, monospace" font-size="5" fill="#3a2e10">TROY OH</text>
    <!-- divider -->
    <line x1="6" y1="24" x2="64" y2="24" stroke="#3a2e10" stroke-width="0.4" stroke-dasharray="2 1.5"/>
    <!-- line items -->
    <text x="6" y="33" font-family="Courier, monospace" font-size="5.5" fill="#3a2e10">JUICY FRUIT</text>
    <text x="64" y="33" text-anchor="end" font-family="Courier, monospace" font-size="5.5" fill="#3a2e10">.67</text>
    <line x1="6" y1="38" x2="64" y2="38" stroke="#3a2e10" stroke-width="0.4" stroke-dasharray="2 1.5"/>
    <!-- big total -->
    <text x="6" y="48" font-family="Courier, monospace" font-size="6.5" font-weight="700" fill="#3a2e10">TOTAL</text>
    <text x="64" y="50" text-anchor="end" font-family="Courier, monospace" font-size="11" font-weight="900" fill="#3a2e10">67¢</text>
    <!-- thank you -->
    <text x="35" y="63" text-anchor="middle" font-family="Courier, monospace" font-size="5.5" font-weight="700" fill="#7a3010">★ THANK YOU ★</text>
    <text x="35" y="71" text-anchor="middle" font-family="Courier, monospace" font-size="4.5" fill="#3a2e10">06·26·1974</text>
  </g>

  <!-- ===== UPC BARCODE (center) ===== -->
  <!-- bars: hand-tuned widths/positions to read as a real UPC-A symbol -->
  <g fill="#f4f1e8" filter="url(#softGlow)">
    <!-- left guard 101 -->
    <rect x="200" y="60" width="2" height="92"/>
    <rect x="204" y="60" width="2" height="92"/>
    <!-- digit 0 (0001101) -->
    <rect x="210" y="60" width="6" height="86"/>
    <rect x="218" y="60" width="4" height="86"/>
    <!-- digit 4 (0100011) -->
    <rect x="226" y="60" width="2" height="86"/>
    <rect x="232" y="60" width="6" height="86"/>
    <!-- digit 1 (0011001) -->
    <rect x="242" y="60" width="4" height="86"/>
    <rect x="252" y="60" width="2" height="86"/>
    <!-- digit 1 (0011001) -->
    <rect x="256" y="60" width="4" height="86"/>
    <rect x="266" y="60" width="2" height="86"/>
    <!-- digit 0 -->
    <rect x="270" y="60" width="6" height="86"/>
    <rect x="278" y="60" width="4" height="86"/>
    <!-- digit 0 -->
    <rect x="286" y="60" width="6" height="86"/>
    <rect x="294" y="60" width="4" height="86"/>
    <!-- center guard 01010 -->
    <rect x="302" y="60" width="2" height="92"/>
    <rect x="306" y="60" width="2" height="92"/>
    <rect x="310" y="60" width="2" height="92"/>
    <!-- digit 0 -->
    <rect x="316" y="60" width="4" height="86"/>
    <rect x="322" y="60" width="6" height="86"/>
    <!-- digit 0 -->
    <rect x="332" y="60" width="4" height="86"/>
    <rect x="338" y="60" width="6" height="86"/>
    <!-- digit 1 -->
    <rect x="348" y="60" width="2" height="86"/>
    <rect x="354" y="60" width="4" height="86"/>
    <!-- digit 9 -->
    <rect x="362" y="60" width="6" height="86"/>
    <rect x="374" y="60" width="4" height="86"/>
    <!-- digit 8 -->
    <rect x="382" y="60" width="2" height="86"/>
    <rect x="388" y="60" width="6" height="86"/>
    <!-- digit 4 -->
    <rect x="398" y="60" width="2" height="86"/>
    <rect x="406" y="60" width="6" height="86"/>
    <!-- right guard 101 -->
    <rect x="416" y="60" width="2" height="92"/>
    <rect x="420" y="60" width="2" height="92"/>
  </g>

  <!-- UPC digits row -->
  <g font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#f4f1e8" letter-spacing="1">
    <text x="195" y="166" text-anchor="end">0</text>
    <text x="258" y="166" text-anchor="middle">41100</text>
    <text x="350" y="166" text-anchor="middle">00194</text>
    <text x="427" y="166" text-anchor="start">8</text>
  </g>

  <!-- Laser sweep (vertical red bar moving across the barcode) -->
  <g>
    <rect x="0" y="56" width="3" height="98" fill="url(#laser)" filter="url(#laserGlow)" opacity="0.95">
      <animate attributeName="x" values="196;426;196" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" calcMode="spline"/>
    </rect>
    <!-- scatter glow following laser -->
    <circle cy="105" r="14" fill="#ff2030" opacity="0.35" filter="url(#laserGlow)">
      <animate attributeName="cx" values="196;426;196" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" calcMode="spline"/>
      <animate attributeName="opacity" values="0.25;0.5;0.25" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Scan-beep arc that pulses outward -->
  <g stroke="#5fd1ff" stroke-width="1.2" fill="none" opacity="0.0">
    <circle cx="311" cy="105" r="8">
      <animate attributeName="r" values="6;46" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="311" cy="105" r="8">
      <animate attributeName="r" values="6;46" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== JUICY FRUIT GUM PACK (right) ===== -->
  <g transform="translate(680 58)">
    <!-- soft shadow -->
    <rect x="2" y="4" width="78" height="100" rx="3" fill="#000" opacity="0.4"/>
    <!-- pack body -->
    <rect x="0" y="0" width="78" height="100" rx="3" fill="url(#gumPack)" stroke="#7a5a08" stroke-width="0.7"/>
    <!-- top foil -->
    <rect x="0" y="0" width="78" height="10" rx="3" fill="#e0d49a"/>
    <line x1="4" y1="5" x2="74" y2="5" stroke="#a48c40" stroke-width="0.5" stroke-dasharray="2 1"/>
    <!-- red banner top -->
    <rect x="0" y="14" width="78" height="20" fill="#c8202c"/>
    <text x="39" y="22" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="6.5" font-weight="900" fill="#fbf3da" letter-spacing="1">WRIGLEY'S</text>
    <text x="39" y="30" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-style="italic" font-weight="900" fill="#fbf3da" letter-spacing="1">Juicy Fruit</text>
    <!-- center crest -->
    <ellipse cx="39" cy="55" rx="26" ry="14" fill="#fbf3da" stroke="#8a6a18" stroke-width="0.6"/>
    <text x="39" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="5" font-weight="700" fill="#8a2018" letter-spacing="1">CHEWING</text>
    <text x="39" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="5" font-weight="700" fill="#8a2018" letter-spacing="1">GUM</text>
    <!-- 10 sticks marker -->
    <rect x="14" y="74" width="50" height="14" rx="1.5" fill="#fbf3da" stroke="#8a6a18" stroke-width="0.5"/>
    <text x="39" y="84" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="8" font-weight="900" fill="#c8202c" letter-spacing="2">10 STICKS</text>
    <!-- bottom red strip with a stylized mini barcode -->
    <rect x="0" y="92" width="78" height="8" fill="#c8202c"/>
    <g fill="#fbf3da">
      <rect x="6" y="94" width="1" height="4"/>
      <rect x="9" y="94" width="2" height="4"/>
      <rect x="13" y="94" width="1" height="4"/>
      <rect x="16" y="94" width="2" height="4"/>
      <rect x="20" y="94" width="1" height="4"/>
      <rect x="23" y="94" width="3" height="4"/>
      <rect x="28" y="94" width="1" height="4"/>
      <rect x="31" y="94" width="2" height="4"/>
      <rect x="35" y="94" width="1" height="4"/>
      <rect x="38" y="94" width="3" height="4"/>
      <rect x="43" y="94" width="1" height="4"/>
      <rect x="46" y="94" width="2" height="4"/>
      <rect x="50" y="94" width="1" height="4"/>
      <rect x="53" y="94" width="2" height="4"/>
      <rect x="57" y="94" width="1" height="4"/>
      <rect x="60" y="94" width="3" height="4"/>
      <rect x="65" y="94" width="1" height="4"/>
      <rect x="68" y="94" width="2" height="4"/>
      <rect x="72" y="94" width="1" height="4"/>
    </g>
    <!-- subtle floating animation -->
    <animateTransform attributeName="transform" type="translate" values="680 58;680 56;680 58" dur="11s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Vignette over the whole composition -->
  <rect width="800" height="200" fill="url(#vignette)" pointer-events="none"/>

  <!-- ===== TYPOGRAPHY ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- dark backing pill for date legibility against barcode -->
    <rect x="220" y="12" width="360" height="28" rx="3" fill="#0d1117" opacity="0.78"/>
    <!-- date headline -->
    <text x="400" y="33" text-anchor="middle" font-size="26" font-weight="900" letter-spacing="6" fill="#fbf3da">JUNE 26, 2026</text>
    <!-- subhead -->
    <text x="400" y="50" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="6" fill="#5fd1ff">FIRST UPC SCAN · 52 YEARS</text>
    <!-- tertiary along bottom -->
    <rect x="120" y="184" width="560" height="14" rx="2" fill="#0d1117" opacity="0.7"/>
    <text x="400" y="194" text-anchor="middle" font-size="8" font-style="italic" font-weight="700" letter-spacing="2.5" fill="#f0d6a0">WRIGLEY'S JUICY FRUIT · MARSH SUPERMARKET · TROY, OHIO · JUNE 26, 1974</text>
  </g>
</svg>
