<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: The Great Clock at Westminster (Big Ben) — 167th anniversary of keeping time (May 31, 1859 — clock movement at the Palace of Westminster, London, first kept time; mechanism by Edward John Dent / Edmund Beckett Denison); gothic clocktower silhouette over a foggy London night, illuminated clock face with moving hands and swinging pendulum, gaslight gold + Westminster blue palette -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 31, 2026 — Great Clock at the Palace of Westminster (Big Ben) 167th anniversary of keeping time">
  <defs>
    <!-- Night London sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#070a18"/>
      <stop offset="0.45" stop-color="#0e1428"/>
      <stop offset="0.75" stop-color="#1a2240"/>
      <stop offset="1"    stop-color="#2a2a3c"/>
    </linearGradient>

    <!-- Soft moon glow halo -->
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#f5ecc0" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#f5ecc0" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#f5ecc0" stop-opacity="0"/>
    </radialGradient>

    <!-- Fog over the Thames -->
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3a4060" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#5a607a" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#80869c" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Stone of tower (cool gothic) -->
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1c2238"/>
      <stop offset="0.5" stop-color="#252c44"/>
      <stop offset="1"   stop-color="#141a2e"/>
    </linearGradient>

    <!-- Brass / illuminated dial -->
    <radialGradient id="dialFace" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff6c8"/>
      <stop offset="0.55" stop-color="#f5d878"/>
      <stop offset="0.85" stop-color="#c89030"/>
      <stop offset="1"    stop-color="#704818"/>
    </radialGradient>

    <radialGradient id="dialGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0"   stop-color="#fff0b8" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f0c860" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#704818" stop-opacity="0"/>
    </radialGradient>

    <!-- Pendulum brass bob -->
    <radialGradient id="brass" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0"   stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#d8a040"/>
      <stop offset="1"   stop-color="#5a3008"/>
    </radialGradient>

    <!-- Date plaque gilt -->
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0a0d1e"/>
      <stop offset="1"   stop-color="#070918"/>
    </linearGradient>

    <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff0b8"/>
      <stop offset="0.5" stop-color="#e8c060"/>
      <stop offset="1"   stop-color="#a07820"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- A single twinkling star -->
    <symbol id="star" overflow="visible">
      <circle r="0.9" fill="#f5ecc0"/>
    </symbol>
  </defs>

  <!-- ===== Sky ===== -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Moon -->
  <g transform="translate(120 48)">
    <circle r="44" fill="url(#moonGlow)" filter="url(#bigGlow)"/>
    <circle r="14" fill="#f3eac0" opacity="0.92"/>
    <circle r="14" cx="3.5" cy="-2" fill="#0e1428" opacity="0.55"/>
  </g>

  <!-- Stars (twinkle) -->
  <g>
    <use href="#star" x="40"  y="22"><animate attributeName="opacity" values="0.2;1;0.2" dur="7s"  repeatCount="indefinite"/></use>
    <use href="#star" x="70"  y="60"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" begin="-2s" repeatCount="indefinite"/></use>
    <use href="#star" x="190" y="14"><animate attributeName="opacity" values="0.2;1;0.2" dur="13s" begin="-4s" repeatCount="indefinite"/></use>
    <use href="#star" x="232" y="40"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="7s"  begin="-1s" repeatCount="indefinite"/></use>
    <use href="#star" x="306" y="22"><animate attributeName="opacity" values="0.2;1;0.2" dur="11s" begin="-3s" repeatCount="indefinite"/></use>
    <use href="#star" x="362" y="52"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="13s" begin="-5s" repeatCount="indefinite"/></use>
    <use href="#star" x="430" y="18"><animate attributeName="opacity" values="0.2;1;0.2" dur="7s"  begin="-2s" repeatCount="indefinite"/></use>
    <use href="#star" x="478" y="58"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="11s" begin="-4s" repeatCount="indefinite"/></use>
    <use href="#star" x="528" y="22"><animate attributeName="opacity" values="0.2;1;0.2" dur="13s" begin="-1s" repeatCount="indefinite"/></use>
    <use href="#star" x="752" y="14"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s"  begin="-3s" repeatCount="indefinite"/></use>
    <use href="#star" x="780" y="48"><animate attributeName="opacity" values="0.2;1;0.2" dur="11s" begin="-5s" repeatCount="indefinite"/></use>
  </g>

  <!-- Distant skyline silhouette (Westminster + Parliament rooflines, low) -->
  <g fill="#0a0e1e" opacity="0.95">
    <path d="M 0 175 L 0 160 L 22 160 L 22 155 L 38 155 L 38 150 L 54 150 L 54 158 L 76 158 L 76 152 L 94 152 L 94 156 L 116 156 L 116 150 L 140 150 L 140 145 L 156 145 L 156 138 L 162 138 L 162 145 L 180 145 L 180 152 L 210 152 L 210 148 L 244 148 L 244 144 L 262 144 L 262 138 L 268 138 L 268 144 L 290 144 L 290 150 L 320 150 L 320 154 L 360 154 L 360 158 L 410 158 L 410 152 L 458 152 L 458 156 L 510 156 L 510 175 Z"/>
    <!-- right side, parliament-ish -->
    <path d="M 510 175 L 510 158 L 540 158 L 540 152 L 554 152 L 554 145 L 562 145 L 562 152 L 576 152 L 576 158 L 596 158 L 596 175 Z"/>
    <path d="M 720 175 L 720 162 L 744 162 L 744 156 L 762 156 L 762 162 L 786 162 L 786 158 L 800 158 L 800 175 Z"/>
  </g>

  <!-- Gentle window lights in the skyline -->
  <g fill="#f0c060" opacity="0.85">
    <rect x="46"  y="160" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" repeatCount="indefinite"/></rect>
    <rect x="86"  y="157" width="2" height="2"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="13s" begin="-3s" repeatCount="indefinite"/></rect>
    <rect x="148" y="152" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s"  begin="-1s" repeatCount="indefinite"/></rect>
    <rect x="218" y="156" width="2" height="2"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="11s" begin="-2s" repeatCount="indefinite"/></rect>
    <rect x="278" y="148" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="-5s" repeatCount="indefinite"/></rect>
    <rect x="372" y="160" width="2" height="2"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s"  begin="-2s" repeatCount="indefinite"/></rect>
    <rect x="430" y="158" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" begin="-4s" repeatCount="indefinite"/></rect>
    <rect x="478" y="160" width="2" height="2"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="13s" begin="-1s" repeatCount="indefinite"/></rect>
    <rect x="740" y="166" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s"  begin="-3s" repeatCount="indefinite"/></rect>
    <rect x="770" y="164" width="2" height="2"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="11s" begin="-5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ===== The Elizabeth Tower (Big Ben) on the right ===== -->
  <g transform="translate(640 0)">
    <!-- aura behind tower from clock face -->
    <ellipse cx="0" cy="90" rx="120" ry="100" fill="url(#dialGlow)" opacity="0.55"/>

    <!-- Spire pinnacle + cross at the top -->
    <g fill="url(#stone)" stroke="#070918" stroke-width="0.5">
      <!-- ornate spire (octagonal pyramid + tip) -->
      <path d="M -22 26 L -10 8 L 0 0 L 10 8 L 22 26 Z"/>
      <!-- small finial cross / orb -->
      <rect x="-1.2" y="-8" width="2.4" height="10" fill="#d8a040"/>
      <circle cx="0" cy="-9" r="2.2" fill="#d8a040"/>
      <!-- crown band -->
      <rect x="-26" y="26" width="52" height="6" fill="#1c2238" stroke="#0a0e1c" stroke-width="0.5"/>
      <!-- four corner pinnacles -->
      <g>
        <path d="M -30 32 L -27 22 L -24 32 Z"/>
        <path d="M -10 32 L -8  22 L -6  32 Z"/>
        <path d="M  6  32 L  8  22 L  10 32 Z"/>
        <path d="M  24 32 L 27  22 L 30  32 Z"/>
      </g>
    </g>

    <!-- belfry (open arched gallery) -->
    <g>
      <rect x="-34" y="32" width="68" height="22" fill="url(#stone)" stroke="#070918" stroke-width="0.5"/>
      <g fill="#040612" opacity="0.95">
        <path d="M -28 54 L -28 42 Q -22 36 -16 42 L -16 54 Z"/>
        <path d="M -12 54 L -12 42 Q  -6 36   0 42 L  0 54 Z"/>
        <path d="M   4 54 L   4 42 Q  10 36  16 42 L 16 54 Z"/>
        <path d="M  20 54 L  20 42 Q  24 36  28 42 L 28 54 Z"/>
      </g>
      <!-- soft warm bell-light inside belfry -->
      <ellipse cx="0" cy="46" rx="22" ry="6" fill="#f0c060" opacity="0.25" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.18;0.32;0.18" dur="11s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Clock stage (broader stone block holding the dial) -->
    <rect x="-58" y="54" width="116" height="86" fill="url(#stone)" stroke="#070918" stroke-width="0.6"/>

    <!-- decorative ribs at top + bottom of clock stage -->
    <g stroke="#080a18" stroke-width="0.7" opacity="0.9">
      <line x1="-58" y1="58" x2="58" y2="58"/>
      <line x1="-58" y1="62" x2="58" y2="62"/>
      <line x1="-58" y1="134" x2="58" y2="134"/>
      <line x1="-58" y1="138" x2="58" y2="138"/>
    </g>

    <!-- ===== ILLUMINATED CLOCK DIAL ===== -->
    <g transform="translate(0 96)">
      <!-- outer brass rim glow -->
      <circle r="44" fill="url(#dialGlow)" opacity="0.85" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.70;0.95;0.70" dur="13s" repeatCount="indefinite"/>
      </circle>
      <!-- outer rim -->
      <circle r="38" fill="#3a2810" stroke="#1a0e04" stroke-width="1.4"/>
      <!-- dial face -->
      <circle r="34" fill="url(#dialFace)" stroke="#704818" stroke-width="0.8"/>

      <!-- inner ornament band -->
      <circle r="29" fill="none" stroke="#704818" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.55"/>

      <!-- minute ticks -->
      <g stroke="#3a2008" stroke-width="0.6">
        <line x1="0" y1="-33" x2="0" y2="-29"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(30)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(60)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(90)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(120)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(150)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(180)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(210)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(240)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(270)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(300)"/>
        <line x1="0" y1="-33" x2="0" y2="-29" transform="rotate(330)"/>
      </g>

      <!-- Roman numerals (IIII per horological tradition) -->
      <g font-family="Georgia, 'Times New Roman', serif" font-size="7.6" font-weight="900"
         fill="#2a1408" text-anchor="middle">
        <text x="0"    y="-22">XII</text>
        <text x="11.5" y="-19.5">I</text>
        <text x="20"   y="-12">II</text>
        <text x="24"   y="-1">III</text>
        <text x="20.5" y="9.5">IIII</text>
        <text x="11.5" y="17">V</text>
        <text x="0"    y="23">VI</text>
        <text x="-11.5" y="17">VII</text>
        <text x="-20"  y="9.5">VIII</text>
        <text x="-25"  y="-1">IX</text>
        <text x="-20"  y="-12">X</text>
        <text x="-12"  y="-19.5">XI</text>
      </g>

      <!-- HOUR hand (sweeps a full revolution in 13s - decorative not real time) -->
      <g>
        <line x1="0" y1="0" x2="0" y2="-16" stroke="#1a0a04" stroke-width="2.4" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="89s" repeatCount="indefinite"/>
      </g>
      <!-- MINUTE hand -->
      <g>
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#1a0a04" stroke-width="1.6" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="13s" repeatCount="indefinite"/>
      </g>
      <!-- SECOND hand (gold) -->
      <g>
        <line x1="0" y1="3" x2="0" y2="-28" stroke="#d83020" stroke-width="0.8" stroke-linecap="round"/>
        <circle cx="0" cy="-22" r="1.4" fill="#d83020"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="3s" repeatCount="indefinite"/>
      </g>
      <!-- center cap -->
      <circle r="2.4" fill="#1a0a04"/>
      <circle r="1.2" fill="#d8a040"/>
    </g>

    <!-- "1859" tablet beneath the dial -->
    <g transform="translate(0 152)">
      <rect x="-22" y="-7" width="44" height="14" rx="1.5" fill="#0a0d1c" stroke="#d8a040" stroke-width="0.6"/>
      <text x="0" y="3.5" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="9" font-weight="900" fill="#f0c060" letter-spacing="2.5">EST · 1859</text>
    </g>

    <!-- Tower shaft (continues below to bottom of canvas) -->
    <rect x="-48" y="166" width="96" height="34" fill="url(#stone)" stroke="#070918" stroke-width="0.5"/>
    <!-- vertical mullions on shaft -->
    <g stroke="#080a18" stroke-width="0.5" opacity="0.9">
      <line x1="-36" y1="166" x2="-36" y2="200"/>
      <line x1="-18" y1="166" x2="-18" y2="200"/>
      <line x1="0"   y1="166" x2="0"   y2="200"/>
      <line x1="18"  y1="166" x2="18"  y2="200"/>
      <line x1="36"  y1="166" x2="36"  y2="200"/>
    </g>
  </g>

  <!-- ===== Swinging pendulum (on the left, in front of the date area) ===== -->
  <g transform="translate(390 30)">
    <!-- pivot -->
    <circle r="2" fill="#d8a040"/>
    <!-- pendulum: a group that rotates around (0,0) -->
    <g>
      <line x1="0" y1="0" x2="0" y2="118" stroke="#7a5018" stroke-width="1.2"/>
      <circle cx="0" cy="120" r="9" fill="url(#brass)" stroke="#3a2008" stroke-width="0.6"/>
      <!-- adjustment nut on bob -->
      <rect x="-1.4" y="126" width="2.8" height="4" fill="#3a2008"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="-14;14;-14" dur="2.4s" repeatCount="indefinite"
                        calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </g>
    <!-- decorative gear (small, behind pivot) -->
    <g opacity="0.5" stroke="#7a5018" stroke-width="0.6" fill="none">
      <circle cx="0" cy="-12" r="6"/>
      <g>
        <line x1="0"  y1="-19" x2="0"  y2="-17"/>
        <line x1="5"  y1="-15" x2="3.6" y2="-13.6"/>
        <line x1="7"  y1="-12" x2="5"   y2="-12"/>
        <line x1="5"  y1="-9"  x2="3.6" y2="-10.4"/>
        <line x1="0"  y1="-7"  x2="0"   y2="-5"/>
        <line x1="-5" y1="-9"  x2="-3.6" y2="-10.4"/>
        <line x1="-7" y1="-12" x2="-5"   y2="-12"/>
        <line x1="-5" y1="-15" x2="-3.6" y2="-13.6"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="29s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- ===== Thames fog band ===== -->
  <rect x="0" y="160" width="800" height="40" fill="url(#fog)" opacity="0.85"/>
  <ellipse cx="200" cy="180" rx="280" ry="14" fill="#9aa0b4" opacity="0.35">
    <animate attributeName="cx" values="180;240;180" dur="29s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="540" cy="186" rx="240" ry="10" fill="#9aa0b4" opacity="0.3">
    <animate attributeName="cx" values="560;500;560" dur="31s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== Typography: date + commemorative line ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Big date plaque -->
    <rect x="22" y="60" width="356" height="64" rx="3" fill="url(#plaque)" opacity="0.92"/>
    <rect x="22" y="60" width="356" height="64" rx="3" fill="none" stroke="url(#gilt)" stroke-width="1.1" opacity="0.85"/>
    <!-- gilded corners (decorative L-marks) -->
    <g stroke="#e8c060" stroke-width="0.9" fill="none" opacity="0.85">
      <path d="M 30 66 L 30 74 M 30 66 L 38 66"/>
      <path d="M 370 66 L 370 74 M 370 66 L 362 66"/>
      <path d="M 30 118 L 30 110 M 30 118 L 38 118"/>
      <path d="M 370 118 L 370 110 M 370 118 L 362 118"/>
    </g>

    <text x="200" y="96" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="30" font-weight="900" fill="#fff6c8" letter-spacing="4.5">
      MAY 31 · 2026
    </text>
    <text x="200" y="114" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="9.5" font-weight="700" fill="#e8c060" letter-spacing="3.2">
      THE GREAT CLOCK · 167 YEARS
    </text>

    <!-- Top banner subtitle -->
    <text x="200" y="38" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="11" font-weight="700" fill="#c8b078" letter-spacing="5" opacity="0.95">
      WESTMINSTER · LONDON
    </text>

    <!-- bottom commemorative line -->
    <text x="200" y="146" text-anchor="middle"
          font-size="8.5" fill="#a8b0c8" letter-spacing="2.2" opacity="0.9">
      31 MAY 1859 — THE MOVEMENT FIRST KEEPS TIME
    </text>
    <text x="200" y="160" text-anchor="middle"
          font-size="7.2" fill="#7a8298" letter-spacing="1.5" opacity="0.8" font-style="italic">
      Dent · Denison · Palace of Westminster
    </text>
  </g>
</svg>
