<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Anne Frank's 97th birthday (born June 12, 1929, Frankfurt am Main; author of the Diary). Open diary at center with butterflies rising from the pages (a long-standing memorial motif), a flickering candle at left, warm sepia + candlelight palette over the GitHub dark background. The date is set on the right-hand page in serif type. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 12, 2026 — Anne Frank's 97th birthday (born June 12, 1929)">
  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="55%" r="62%">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#7d4a1b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candleHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd97a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#f08a2c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4e6c6"/>
      <stop offset="100%" stop-color="#d4b486"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1deb2"/>
      <stop offset="100%" stop-color="#c9a674"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b2614"/>
      <stop offset="100%" stop-color="#371509"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c1408"/>
      <stop offset="50%" stop-color="#1d0904"/>
      <stop offset="100%" stop-color="#3c1408"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.25
                             0 0 0 0 0.15
                             0 0 0 0 0.05
                             0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- butterfly: flapping wings, ~22px wide -->
    <g id="bf">
      <ellipse cx="0" cy="0" rx="0.8" ry="6" fill="#2a1810"/>
      <g>
        <path d="M0,-1 C-10,-12 -16,-6 -13,2 C-16,9 -7,11 0,3 Z" fill="#f4a05a"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-6 0 0; -28 0 0; -6 0 0" dur="0.55s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M0,-1 C10,-12 16,-6 13,2 C16,9 7,11 0,3 Z" fill="#f6c177"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="6 0 0; 28 0 0; 6 0 0" dur="0.55s" repeatCount="indefinite"/>
      </g>
      <circle cx="-0.5" cy="-7" r="0.6" fill="#1a0e06"/>
      <circle cx="0.5" cy="-7" r="0.6" fill="#1a0e06"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="200" fill="#0d1117"/>
  <ellipse cx="400" cy="115" rx="430" ry="135" fill="url(#warmGlow)"/>

  <!-- distant candle halo (drawn before candle for atmosphere) -->
  <circle cx="80" cy="110" r="95" fill="url(#candleHalo)">
    <animate attributeName="r" values="92;100;94;98;92" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.9;0.95;0.85" dur="2.3s" repeatCount="indefinite"/>
  </circle>

  <!-- desk shadow under book -->
  <ellipse cx="400" cy="178" rx="295" ry="9" fill="#000" opacity="0.55"/>

  <!-- open diary -->
  <g transform="translate(400 120)">
    <!-- back cover wrap -->
    <path d="M-262,42 L-252,56 L252,56 L262,42 L240,32 L-240,32 Z" fill="url(#cover)"/>
    <path d="M-262,42 L-260,28 L-240,32 Z" fill="#2a0e06"/>
    <path d="M262,42 L260,28 L240,32 Z" fill="#2a0e06"/>

    <!-- pages -->
    <path d="M-240,32 L-8,30 L-8,-52 L-238,-46 Q-242,-10 -240,32 Z" fill="url(#leftPage)"/>
    <path d="M8,30 L240,32 Q242,-10 238,-46 L8,-52 Z" fill="url(#rightPage)"/>

    <!-- subtle paper grain overlay -->
    <path d="M-240,32 L-8,30 L-8,-52 L-238,-46 Q-242,-10 -240,32 Z" fill="#000" opacity="0" filter="url(#paperGrain)"/>
    <path d="M8,30 L240,32 Q242,-10 238,-46 L8,-52 Z" fill="#000" opacity="0" filter="url(#paperGrain)"/>

    <!-- spine -->
    <path d="M-8,30 L-8,-52 L0,-56 L8,-52 L8,30 L0,32 Z" fill="url(#spine)"/>

    <!-- LEFT PAGE: subtitle and handwritten lines -->
    <text x="-124" y="-32" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="11" font-style="italic" fill="#3a1d0a" opacity="0.95">Anne Frank · born 1929</text>
    <g stroke="#4a2a14" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M-225,-14 q42,-3 82,0 t80,2"/>
      <path d="M-225,-2 q52,-2 100,1 t60,1"/>
      <path d="M-225,10 q42,2 90,-1 t70,2"/>
      <path d="M-225,22 q60,-1 90,2 t50,-1"/>
    </g>
    <!-- small inkblot detail -->
    <ellipse cx="-90" cy="22" rx="2.6" ry="1.4" fill="#2a1408" opacity="0.6"/>

    <!-- RIGHT PAGE: the date -->
    <text x="124" y="-10" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="30" font-weight="700" fill="#2a1306"
          letter-spacing="1.2">June 12</text>
    <text x="124" y="18" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="22" fill="#5a2c10"
          letter-spacing="4">2 0 2 6</text>
    <line x1="46" y1="26" x2="202" y2="26" stroke="#5a3a1a" stroke-width="0.6" opacity="0.45"/>

    <!-- red ribbon bookmark trailing down -->
    <path d="M-3,-52 L-3,48 L0,42 L3,48 L3,-52 Z" fill="#a02436"/>
    <path d="M-3,48 L0,42 L3,48 L0,55 Z" fill="#7c1a28"/>

    <!-- butterflies emerging from the diary -->
    <!-- bf 1: drifts up and left -->
    <g>
      <g transform="scale(1)"><use href="#bf"/></g>
      <animateTransform attributeName="transform" type="translate"
                        values="80,-38; 70,-58; 92,-78; 78,-100; 96,-118"
                        dur="11s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="0; -8; 4; -6; 0"
                        dur="11s" repeatCount="indefinite"/>
    </g>
    <!-- bf 2: smaller, drifts up and right -->
    <g>
      <g transform="scale(0.7)"><use href="#bf"/></g>
      <animateTransform attributeName="transform" type="translate"
                        values="-50,-30; -32,-50; -60,-72; -40,-92; -64,-114"
                        dur="13s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="0; 6; -4; 8; 0"
                        dur="13s" repeatCount="indefinite"/>
    </g>
    <!-- bf 3: medium, gentle climb -->
    <g>
      <g transform="scale(0.85)"><use href="#bf"/></g>
      <animateTransform attributeName="transform" type="translate"
                        values="20,-20; 6,-40; 32,-60; 10,-82; 28,-102"
                        dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- candle (left) -->
  <g transform="translate(80 130)">
    <!-- holder dish -->
    <ellipse cx="0" cy="50" rx="24" ry="4" fill="#000" opacity="0.55"/>
    <path d="M-20,46 L20,46 L15,54 L-15,54 Z" fill="#3a2614"/>
    <ellipse cx="0" cy="46" rx="20" ry="3.5" fill="#5a3a22"/>
    <!-- candle body -->
    <rect x="-7" y="2" width="14" height="44" fill="#efe1c5"/>
    <rect x="-7" y="2" width="3" height="44" fill="#d2c19c"/>
    <rect x="5" y="2" width="2" height="44" fill="#fff5dc" opacity="0.6"/>
    <ellipse cx="0" cy="2" rx="7" ry="2.2" fill="#fff5dc"/>
    <!-- wax drip -->
    <path d="M-5,12 q1,8 0,16" stroke="#d4c39c" stroke-width="1.4" fill="none" opacity="0.8"/>
    <!-- wick -->
    <line x1="0" y1="0" x2="0" y2="-7" stroke="#1a1208" stroke-width="1.3"/>
    <!-- flame outer glow -->
    <ellipse cx="0" cy="-14" rx="22" ry="30" fill="#f6c177" opacity="0.22" filter="url(#softBlur)">
      <animate attributeName="opacity" values="0.18;0.32;0.22;0.28;0.18" dur="2.3s" repeatCount="indefinite"/>
    </ellipse>
    <!-- outer flame -->
    <path d="M0,-7 C-5,-13 -5,-22 0,-28 C5,-22 5,-13 0,-7 Z" fill="#ffd97a">
      <animate attributeName="d"
        values="M0,-7 C-5,-13 -5,-22 0,-28 C5,-22 5,-13 0,-7 Z;
                M0,-7 C-4,-14 -6,-23 0,-30 C6,-23 4,-14 0,-7 Z;
                M0,-7 C-6,-14 -4,-21 0,-26 C4,-21 6,-14 0,-7 Z;
                M0,-7 C-5,-13 -5,-22 0,-28 C5,-22 5,-13 0,-7 Z"
        dur="1.1s" repeatCount="indefinite"/>
    </path>
    <!-- inner flame -->
    <path d="M0,-10 C-2,-14 -3,-20 0,-23 C3,-20 2,-14 0,-10 Z" fill="#ff8a3c">
      <animate attributeName="d"
        values="M0,-10 C-2,-14 -3,-20 0,-23 C3,-20 2,-14 0,-10 Z;
                M0,-10 C-3,-13 -2,-21 0,-25 C2,-21 3,-13 0,-10 Z;
                M0,-10 C-2,-14 -3,-20 0,-23 C3,-20 2,-14 0,-10 Z"
        dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- flame hot core -->
    <ellipse cx="0" cy="-15" rx="1.3" ry="3" fill="#fff4d2">
      <animate attributeName="ry" values="3;4;2.6;3" dur="0.6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- one stray butterfly drifting at upper right -->
  <g>
    <g transform="scale(0.75)"><use href="#bf"/></g>
    <animateTransform attributeName="transform" type="translate"
                      values="700,70; 680,50; 720,40; 690,30; 720,20"
                      dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- floating dust motes / light particles -->
  <g fill="#f6c177" opacity="0.7">
    <circle cx="0" cy="0" r="1.2">
      <animateTransform attributeName="transform" type="translate"
                        values="180,160; 200,80; 220,20" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="1">
      <animateTransform attributeName="transform" type="translate"
                        values="620,170; 600,90; 640,30" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="0.9">
      <animateTransform attributeName="transform" type="translate"
                        values="280,160; 290,90; 270,20" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="1.1">
      <animateTransform attributeName="transform" type="translate"
                        values="520,170; 500,100; 540,30" dur="11s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
