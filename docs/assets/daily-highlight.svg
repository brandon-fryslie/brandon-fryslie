<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: google.com Registered — 29th Anniversary (September 15, 1997) -->
<!-- about:
On 15 September 1997, two Stanford graduate students named Larry Page and Sergey Brin registered the domain google.com. Their search engine had been running out of Stanford under the name BackRub since 1996, indexing the early web by the structure of its inbound links rather than by keyword frequency, and the new name was a play on "googol" — the number 10 to the 100th — meant to advertise their appetite for indexing everything. Incorporation as Google Inc. followed almost exactly a year later, in a friend's Menlo Park garage. Twenty-nine years on, the domain is arguably the busiest address on the public internet.

The left half is the domain being born: a retro browser window renders "https://google.com" into its address bar one character at a time under a blinking caret, while the six Google-palette dots below bounce in the classic loader cadence. A WHOIS stub at the base flashes CREATED: 1997-09-15. On the right, a large SEPTEMBER 15, 2026 headline anchors a blue GOOGLE.COM · 29 YEARS subhead, an italic REGISTERED · STANFORD · 1997 tertiary, a dim PAGE · BRIN · GOOGOL · WHOIS roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 15, 2026 — the 29th anniversary of the registration of google.com. On the left half, a retro browser window: a title bar with three dots, a rounded address bar in which 'https://google.com' is typed out character by character beneath a blinking caret, and beneath it a row of six dots in the Google palette (blue, red, yellow, blue, green, red) bouncing in sequence, with a small WHOIS stub reading CREATED: 1997-09-15. On the right, a large cream SEPTEMBER 15, 2026 headline underlined by a blue-red-yellow-green sweep, a blue GOOGLE.COM subhead trailed by cream · 29 YEARS, an italic amber REGISTERED · STANFORD · 1997 tertiary, a dim green PAGE · BRIN · GOOGOL · WHOIS roster, and a Georgia-italic 'so the whole web could be indexed.' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f2733"/>
      <stop offset="100%" stop-color="#161c26"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a3342"/>
      <stop offset="100%" stop-color="#1e2530"/>
    </linearGradient>
    <linearGradient id="urlBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>
    <!-- Google-palette rainbow sweep for underline -->
    <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4285F4"/>
      <stop offset="33%"  stop-color="#EA4335"/>
      <stop offset="66%"  stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- (typing clip-path removed — URL sits fully rendered for consistency across renderers) -->
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- ============================== LEFT: BROWSER WINDOW ============================== -->
  <g transform="translate(20,20)">
    <!-- Window body -->
    <rect x="0" y="0" width="360" height="160" rx="8" ry="8" fill="url(#chromeGrad)" stroke="#2a3342" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="360" height="26" rx="8" ry="8" fill="url(#titleGrad)"/>
    <rect x="0" y="18" width="360" height="8" fill="url(#titleGrad)"/>
    <!-- Traffic-light dots -->
    <circle cx="14" cy="13" r="4.5" fill="#EA4335" opacity="0.85"/>
    <circle cx="28" cy="13" r="4.5" fill="#FBBC05" opacity="0.85"/>
    <circle cx="42" cy="13" r="4.5" fill="#34A853" opacity="0.85"/>
    <!-- Tab handle -->
    <path d="M 60 26 L 66 12 L 130 12 L 136 26 Z" fill="#2c3644"/>
    <text x="72" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="8.5" font-weight="600" fill="#c8d0dc" letter-spacing="0.6">google.com</text>

    <!-- Address bar row -->
    <!-- Nav arrows -->
    <g fill="#5c6a7e">
      <path d="M 14 52 l -5 4 l 5 4 z"/>
      <path d="M 24 52 l 5 4 l -5 4 z" opacity="0.55"/>
      <circle cx="40" cy="56" r="4" fill="none" stroke="#5c6a7e" stroke-width="1.1"/>
      <path d="M 38 55.5 l 2 -2 l 2 2 M 40 53.5 v 5" stroke="#5c6a7e" stroke-width="1.1" fill="none"/>
    </g>

    <!-- URL bar -->
    <rect x="52" y="46" width="252" height="24" rx="12" ry="12" fill="url(#urlBarGrad)" stroke="#2a3342" stroke-width="0.8"/>
    <!-- Lock icon -->
    <g transform="translate(60,54)">
      <rect x="0" y="4" width="9" height="7" rx="1.2" fill="#34A853" opacity="0.9"/>
      <path d="M 1.5 4 v -1.5 a 3 3 0 0 1 6 0 v 1.5" stroke="#34A853" stroke-width="1.1" fill="none" opacity="0.9"/>
    </g>

    <!-- URL (fully rendered) -->
    <text x="76" y="63" font-family="'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="12.5" font-weight="600" letter-spacing="0.4">
      <tspan fill="#7d8a9e">https://</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan><tspan fill="#e8ecf3">.com</tspan>
    </text>
    <!-- Blinking caret parked at end of URL -->
    <rect x="298" y="49" width="1.6" height="18" fill="#e8ecf3">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Refresh icon -->
    <g transform="translate(312,52)" fill="none" stroke="#7d8a9e" stroke-width="1.2">
      <path d="M 8 4 a 4 4 0 1 0 3.8 5.2"/>
      <path d="M 8 1.5 l 0.6 3 l -3 -0.5" stroke-linejoin="round"/>
    </g>
    <!-- Star icon -->
    <g transform="translate(332,53)" fill="none" stroke="#7d8a9e" stroke-width="1.1">
      <path d="M 4 0 l 1.2 2.5 l 2.8 0.3 l -2.1 1.9 l 0.6 2.8 l -2.5 -1.4 l -2.5 1.4 l 0.6 -2.8 l -2.1 -1.9 l 2.8 -0.3 z"/>
    </g>

    <!-- Divider under address bar -->
    <line x1="0" y1="82" x2="360" y2="82" stroke="#242c39" stroke-width="1"/>

    <!-- ========== Loading dots (six, Google palette) ========== -->
    <g transform="translate(64,116)">
      <!-- Baseline "track" for context -->
      <line x1="0" y1="12" x2="232" y2="12" stroke="#1e2632" stroke-width="1"/>
      <!-- Six dots: G-o-o-g-l-e colors -->
      <circle cx="10"  cy="12" r="7" fill="#4285F4" filter="url(#dotGlow)">
        <animate attributeName="cy" values="12;0;12;12;12;12;12;12;12;12;12;12" keyTimes="0;0.08;0.16;0.24;0.32;0.40;0.48;0.56;0.64;0.72;0.80;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="52"  cy="12" r="7" fill="#EA4335" filter="url(#dotGlow)">
        <animate attributeName="cy" values="12;12;0;12;12;12;12;12;12;12;12;12" keyTimes="0;0.08;0.16;0.24;0.32;0.40;0.48;0.56;0.64;0.72;0.80;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="94"  cy="12" r="7" fill="#FBBC05" filter="url(#dotGlow)">
        <animate attributeName="cy" values="12;12;12;0;12;12;12;12;12;12;12;12" keyTimes="0;0.08;0.16;0.24;0.32;0.40;0.48;0.56;0.64;0.72;0.80;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="136" cy="12" r="7" fill="#4285F4" filter="url(#dotGlow)">
        <animate attributeName="cy" values="12;12;12;12;0;12;12;12;12;12;12;12" keyTimes="0;0.08;0.16;0.24;0.32;0.40;0.48;0.56;0.64;0.72;0.80;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="178" cy="12" r="7" fill="#34A853" filter="url(#dotGlow)">
        <animate attributeName="cy" values="12;12;12;12;12;0;12;12;12;12;12;12" keyTimes="0;0.08;0.16;0.24;0.32;0.40;0.48;0.56;0.64;0.72;0.80;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="220" cy="12" r="7" fill="#EA4335" filter="url(#dotGlow)">
        <animate attributeName="cy" values="12;12;12;12;12;12;0;12;12;12;12;12" keyTimes="0;0.08;0.16;0.24;0.32;0.40;0.48;0.56;0.64;0.72;0.80;1" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- WHOIS stub -->
    <g transform="translate(64,140)" font-family="'SFMono-Regular', Menlo, Consolas, monospace"
       font-size="7.5" letter-spacing="0.4">
      <text x="0" y="0" fill="#5c6a7e">WHOIS</text>
      <text x="34" y="0" fill="#8a97ab">google.com</text>
      <text x="0" y="10" fill="#5c6a7e">CREATED:</text>
      <text x="50" y="10" fill="#34A853" font-weight="700">
        1997-09-15
        <animate attributeName="opacity" values="1;0.55;1;1;1" keyTimes="0;0.06;0.12;0.9;1" dur="7s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- ============================== RIGHT: TEXT STACK ============================== -->
  <g transform="translate(400,0)">

    <!-- Faint schematic backdrop marks -->
    <g opacity="0.10" stroke="#8fb4ff" stroke-width="0.6" fill="none">
      <path d="M 20 22 h 40"/>
      <path d="M 320 40 h 40"/>
      <path d="M 20 180 h 30"/>
    </g>

    <!-- Date headline -->
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" fill="#f2f4fa" letter-spacing="1.1">
      SEPTEMBER 15, 2026
    </text>

    <!-- Sweep underline with Google palette -->
    <line x1="20" y1="70" x2="362" y2="70" stroke="url(#gSweep)" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 342; 200 142; 342 0; 200 142; 0 342"
               keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
    </line>

    <!-- Subhead -->
    <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.5">
      <tspan fill="#4285F4">GOOGLE.COM</tspan><tspan fill="#f2f4fa"> · 29 YEARS</tspan>
    </text>

    <!-- Tertiary italic -->
    <text x="20" y="117" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#FBBC05" letter-spacing="0.4">
      REGISTERED · STANFORD · 1997
    </text>

    <!-- Spec roster -->
    <text x="20" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="600" fill="#6a86b8" letter-spacing="2.5" opacity="0.95">
      PAGE · BRIN · GOOGOL · WHOIS
    </text>

    <!-- Caption -->
    <text x="20" y="172" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#d8dfec">
      &#8220;so the whole web could be indexed.&#8221;
    </text>

    <!-- Small quiet indicator (blue) -->
    <circle cx="380" cy="138" r="2.2" fill="#4285F4" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
