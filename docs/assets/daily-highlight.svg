<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Linux 0.01 Released — 35th Anniversary (September 17, 1991) -->
<!-- about:
On 17 September 1991, a 21-year-old computer-science student in Helsinki named Linus Torvalds uploaded linux-0.01.tar.gz — 63 files, about ten thousand lines of C and 386 assembly — to a directory on ftp.funet.fi and quietly emailed a few people on the comp.os.minix newsgroup a pointer to it. Three weeks earlier he had introduced it there as "just a hobby, won't be big and professional like gnu." Version 0.01 could not yet self-host, ran only on a 386 with a hard disk and a Minix filesystem, and had exactly one user. Thirty-five years later the same kernel boots most of the internet, every Android phone, and every one of the top 500 supercomputers on Earth.

The left half is a green-phosphor CRT booting Linux 0.01: scanlines drift across a curved screen while boot messages type themselves in one line at a time — kernel version, memory sizing, VFS mount, an FTP fetch of the tarball from funet.fi — and settle into a blinking prompt. On the right, a large SEPTEMBER 17, 2026 headline anchors a phosphor-green LINUX 0.01 · 35 YEARS subhead, an italic amber TORVALDS · HELSINKI · FTP.FUNET.FI tertiary, a dim green 386 · MINIX · GCC · KERNEL roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 17, 2026 — the 35th anniversary of the release of Linux 0.01. On the left half, a retro green-phosphor CRT terminal with a rounded bezel and drifting scanlines shows Linux 0.01 boot messages typing themselves in line by line — kernel version, memory sizing, VFS mount, an FTP fetch from funet.fi — ending at a blinking dollar prompt. On the right, a large cream SEPTEMBER 17, 2026 headline underlined by a green-to-amber sweep, a phosphor-green LINUX 0.01 subhead trailed by cream · 35 YEARS, an italic amber TORVALDS · HELSINKI · FTP.FUNET.FI tertiary, a dim green 386 · MINIX · GCC · KERNEL roster, and a Georgia-italic 'just a hobby, won't be big and professional like gnu.' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#242a34"/>
      <stop offset="50%"  stop-color="#161b23"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>
    <radialGradient id="screenGrad" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0%"   stop-color="#0a1a12"/>
      <stop offset="70%"  stop-color="#050d09"/>
      <stop offset="100%" stop-color="#020604"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4aff7d"/>
      <stop offset="55%"  stop-color="#8fe0a0"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>
    <!-- Subtle CRT phosphor glow -->
    <filter id="phosGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.55"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#4aff7d" opacity="0.06"/>
    </pattern>
    <!-- Screen curvature clip -->
    <clipPath id="screenClip">
      <rect x="34" y="34" width="332" height="132" rx="14" ry="14"/>
    </clipPath>
    <!-- Vignette to fake CRT curvature -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Faint circuit-trace grid on the right side -->
  <g opacity="0.06" stroke="#4aff7d" stroke-width="0.5" fill="none">
    <path d="M 420 10 h 40 v 20 h 60"/>
    <path d="M 700 20 v 30 h -40"/>
    <path d="M 440 180 h 60 v -20 h 100"/>
    <path d="M 760 170 h -30 v -30"/>
  </g>

  <!-- ============================== LEFT: CRT TERMINAL ============================== -->
  <g transform="translate(20,15)">
    <!-- Bezel outer -->
    <rect x="0" y="0" width="360" height="170" rx="16" ry="16" fill="url(#bezelGrad)" stroke="#2a3040" stroke-width="1"/>
    <!-- Bezel inner rim -->
    <rect x="6" y="6" width="348" height="158" rx="12" ry="12" fill="none" stroke="#0a0d13" stroke-width="1.2"/>
    <!-- Power LED -->
    <circle cx="18" cy="160" r="2.2" fill="#4aff7d" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="163" font-family="'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="5.5" fill="#3a5a44" letter-spacing="0.9">PWR</text>
    <text x="330" y="163" font-family="'SFMono-Regular', Menlo, Consolas, monospace"
          font-size="5.5" fill="#3a5a44" letter-spacing="0.9">VT100</text>

    <!-- Screen -->
    <rect x="16" y="16" width="328" height="128" rx="14" ry="14" fill="url(#screenGrad)"/>

    <g clip-path="url(#screenClip)">
      <!-- Slight screen glow layer -->
      <rect x="16" y="16" width="328" height="128" fill="#4aff7d" opacity="0.02"/>

      <!-- Terminal text -->
      <g font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="8" letter-spacing="0.2" filter="url(#phosGlow)">
        <!-- Header status bar -->
        <text x="42" y="30" fill="#2ea85a" font-weight="600">linux 0.01</text>
        <text x="320" y="30" fill="#2ea85a" text-anchor="end">tty0</text>
        <line x1="42" y1="34" x2="320" y2="34" stroke="#1e5c34" stroke-width="0.5"/>

        <!-- Boot log — all lines visible at rest; motion elsewhere. -->
        <text x="42" y="48" fill="#4aff7d">Linux version 0.01 (torvalds@kruuna)</text>
        <text x="42" y="58" fill="#4aff7d">(gcc version 1.40) 1991-09-17</text>
        <text x="42" y="68" fill="#4aff7d">Memory: 3800K/4096K available</text>
        <text x="42" y="78" fill="#4aff7d">Console: 80x25 EGA+</text>
        <text x="42" y="88" fill="#4aff7d">VFS: Mounted root (minix fs)</text>
        <text x="42" y="102" fill="#8fe0a0"><tspan fill="#2ea85a">$</tspan> ftp ftp.funet.fi</text>
        <text x="42" y="112" fill="#4aff7d">Connected. cd /pub/OS/Linux</text>
        <text x="42" y="122" fill="#4aff7d">get linux-0.01.tar.gz ...71K <tspan fill="#ffb000">OK</tspan></text>
        <!-- Final prompt with blinking cursor -->
        <text x="42" y="136" fill="#8fe0a0"><tspan fill="#2ea85a">$</tspan> uname -sr</text>
        <text x="42" y="146" fill="#4aff7d">Linux 0.01</text>
        <!-- Blinking cursor block after the version -->
        <rect x="88" y="139" width="5.5" height="8" fill="#4aff7d">
          <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Drifting scanlines overlay -->
      <rect x="16" y="16" width="328" height="128" fill="url(#scanlines)">
        <animateTransform attributeName="transform" type="translate" from="0 -4" to="0 0" dur="7s" repeatCount="indefinite"/>
      </rect>

      <!-- Moving bright scan bar -->
      <rect x="16" width="328" height="18" fill="#4aff7d" opacity="0.05">
        <animate attributeName="y" values="16;144;16" keyTimes="0;0.5;1" dur="11s" repeatCount="indefinite"/>
      </rect>

      <!-- CRT vignette -->
      <rect x="16" y="16" width="328" height="128" fill="url(#vignette)"/>
    </g>

    <!-- Screen frame highlight (top) -->
    <path d="M 20 20 Q 180 12 340 20" stroke="#2a3040" stroke-width="0.8" fill="none" opacity="0.6"/>
  </g>

  <!-- ============================== RIGHT: TEXT STACK ============================== -->
  <g transform="translate(400,0)">

    <!-- Tiny penguin silhouette hint in top-right corner -->
    <g transform="translate(360,18)" opacity="0.85">
      <!-- Body -->
      <ellipse cx="7" cy="12" rx="6.5" ry="8.5" fill="#1a1f28" stroke="#2a3040" stroke-width="0.6"/>
      <!-- Belly -->
      <ellipse cx="7" cy="14" rx="4" ry="6" fill="#f2f4fa"/>
      <!-- Head -->
      <circle cx="7" cy="4.5" r="4" fill="#1a1f28" stroke="#2a3040" stroke-width="0.5"/>
      <!-- Eyes -->
      <circle cx="5.5" cy="4" r="0.9" fill="#f2f4fa"/>
      <circle cx="8.5" cy="4" r="0.9" fill="#f2f4fa"/>
      <circle cx="5.6" cy="4.1" r="0.4" fill="#0d1117"/>
      <circle cx="8.6" cy="4.1" r="0.4" fill="#0d1117"/>
      <!-- Beak -->
      <path d="M 5.5 5.8 Q 7 7.2 8.5 5.8 Z" fill="#ffb000"/>
      <!-- Feet -->
      <ellipse cx="4.5" cy="20" rx="2.2" ry="1" fill="#ffb000"/>
      <ellipse cx="9.5" cy="20" rx="2.2" ry="1" fill="#ffb000"/>
      <!-- Subtle breathing -->
      <animateTransform attributeName="transform" type="translate" values="360 18; 360 17; 360 18" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- Faint schematic marks -->
    <g opacity="0.10" stroke="#8fe0a0" stroke-width="0.6" fill="none">
      <path d="M 20 22 h 40"/>
      <path d="M 20 180 h 30"/>
    </g>

    <!-- Date headline -->
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" fill="#f2f4fa" letter-spacing="1.1">
      SEPTEMBER 17, 2026
    </text>

    <!-- Sweep underline (phosphor to amber) -->
    <line x1="20" y1="70" x2="362" y2="70" stroke="url(#sweepGrad)" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 342; 220 122; 342 0; 220 122; 0 342"
               keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
    </line>

    <!-- Subhead -->
    <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.5">
      <tspan fill="#4aff7d">LINUX 0.01</tspan><tspan fill="#f2f4fa"> · 35 YEARS</tspan>
    </text>

    <!-- Tertiary italic -->
    <text x="20" y="117" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#ffb000" letter-spacing="0.4">
      TORVALDS · HELSINKI · FTP.FUNET.FI
    </text>

    <!-- Spec roster -->
    <text x="20" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="600" fill="#6a8b78" letter-spacing="2.5" opacity="0.95">
      386 · MINIX · GCC · KERNEL
    </text>

    <!-- Caption -->
    <text x="20" y="172" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#d8dfec">
      &#8220;just a hobby, won&#8217;t be big and professional&#8230;&#8221;
    </text>

    <!-- Quiet phosphor indicator -->
    <circle cx="380" cy="138" r="2.2" fill="#4aff7d" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
