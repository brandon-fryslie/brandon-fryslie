<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: World Environment Day (June 5, UN observance — established 1972, 54th annual) — living planet with a tree growing from a verdant Earth hemisphere, drifting leaves, rising spores of light, sunrise palette over deep forest greens -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 5, 2026 — World Environment Day, UN observance established 1972, 54th annual; living planet with a tree growing out of its crown, drifting leaves, glowing rising spores, sunrise over forest palette">
  <defs>
    <!-- Sky: deep night fading to a soft forest dawn at the bottom -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0d1117"/>
      <stop offset="0.45" stop-color="#0f2032"/>
      <stop offset="0.82" stop-color="#1a3b3a"/>
      <stop offset="1"    stop-color="#214c3a"/>
    </linearGradient>

    <!-- Earth oceans -->
    <radialGradient id="ocean" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0"    stop-color="#3aa6c2"/>
      <stop offset="0.45" stop-color="#1f6f9b"/>
      <stop offset="0.85" stop-color="#0e2f55"/>
      <stop offset="1"    stop-color="#06182e"/>
    </radialGradient>

    <!-- Earth continents -->
    <radialGradient id="land" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0"   stop-color="#6cd07a"/>
      <stop offset="0.5" stop-color="#2f8d4d"/>
      <stop offset="1"   stop-color="#0f3a23"/>
    </radialGradient>

    <!-- Tree trunk -->
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#3a2418"/>
      <stop offset="0.5" stop-color="#7a4a26"/>
      <stop offset="1"   stop-color="#3a2418"/>
    </linearGradient>

    <!-- Foliage greens -->
    <radialGradient id="leafA" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0"   stop-color="#a9e08a"/>
      <stop offset="0.7" stop-color="#3f9a4a"/>
      <stop offset="1"   stop-color="#15532a"/>
    </radialGradient>
    <radialGradient id="leafC" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0"   stop-color="#7be0c4"/>
      <stop offset="0.65" stop-color="#2c9a82"/>
      <stop offset="1"   stop-color="#0d3a32"/>
    </radialGradient>

    <!-- Warm dawn-leaf accents -->
    <radialGradient id="leafB" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0"   stop-color="#f6d56b"/>
      <stop offset="0.6" stop-color="#c08a2f"/>
      <stop offset="1"   stop-color="#5a3a14"/>
    </radialGradient>

    <!-- Glow for spores/fireflies -->
    <radialGradient id="spore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff6c5"/>
      <stop offset="0.5" stop-color="#e8c062" stop-opacity="0.7"/>
      <stop offset="1"   stop-color="#e8c062" stop-opacity="0"/>
    </radialGradient>

    <!-- Atmosphere halo -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#7ce0c8" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#7ce0c8" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#7ce0c8" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow for typography -->
    <filter id="typeGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Faint stars -->
  <g fill="#ffffff">
    <circle cx="60"  cy="14" r="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="24" r="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="10" r="0.6"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="13s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="12" r="0.6"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="11s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="28" r="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="18" r="0.8"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="13s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="36" r="0.6"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="7s" begin="-1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Rising spores / fireflies -->
  <g>
    <circle r="2.2" fill="url(#spore)">
      <animateMotion path="M 110 200 Q 120 120 100 40" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.6" fill="url(#spore)">
      <animateMotion path="M 220 210 Q 240 130 215 30" dur="17s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="17s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="url(#spore)">
      <animateMotion path="M 320 200 Q 310 110 335 20" dur="19s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="19s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.4" fill="url(#spore)">
      <animateMotion path="M 410 200 Q 420 130 405 40" dur="23s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="23s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="url(#spore)">
      <animateMotion path="M 520 210 Q 540 120 515 30" dur="29s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="29s" begin="-9s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="url(#spore)">
      <animateMotion path="M 640 200 Q 630 130 660 30" dur="31s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="31s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="url(#spore)">
      <animateMotion path="M 740 210 Q 730 120 760 20" dur="37s" begin="-11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="37s" begin="-11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Distant birds -->
  <g stroke="#0d1117" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M 0 0 q 3 -3 6 0 q 3 -3 6 0">
      <animateTransform attributeName="transform" type="translate"
                        values="780 60; 500 75; 250 65" dur="61s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 0 q 2.5 -2.5 5 0 q 2.5 -2.5 5 0">
      <animateTransform attributeName="transform" type="translate"
                        values="800 80; 520 95; 270 85" dur="71s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== Earth (lower-left, partial sphere rising from bottom) ===== -->
  <g transform="translate(160 230)">
    <!-- Atmosphere halo -->
    <circle r="135" fill="url(#halo)">
      <animate attributeName="opacity" values="0.6;0.95;0.6" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Ocean disk -->
    <circle r="118" fill="url(#ocean)"/>

    <!-- Continents (stylized) -->
    <g fill="url(#land)">
      <path d="M -86 -42 q 24 -18 52 -10 q 22 6 28 24 q 4 18 -14 26 q -22 10 -42 0 q -28 -14 -24 -40 Z"/>
      <path d="M -10 -10 q 18 -6 32 6 q 12 14 4 30 q -14 18 -36 12 q -16 -6 -14 -26 q 2 -14 14 -22 Z"/>
      <path d="M 40 -64 q 22 -4 36 10 q 6 18 -8 26 q -22 10 -34 -4 q -8 -16 6 -32 Z"/>
      <path d="M -70 30 q 26 -6 44 10 q 8 18 -10 30 q -28 12 -46 -8 q -10 -16 12 -32 Z"/>
      <path d="M 22 36 q 22 -4 34 12 q 6 18 -14 28 q -22 8 -34 -8 q -8 -18 14 -32 Z"/>
    </g>

    <!-- Cloud swirl -->
    <g fill="#ffffff" opacity="0.18">
      <path d="M -110 -10 q 30 -8 60 4 q 28 12 64 0 q 22 -6 36 4 q -34 14 -76 6 q -32 -6 -58 4 q -16 6 -26 -18 Z"/>
      <path d="M -90 40 q 36 -10 70 6 q 26 12 56 4 q -24 16 -64 6 q -36 -10 -62 -16 Z"/>
    </g>

    <!-- Highlight crescent (sunrise on Earth's limb) -->
    <ellipse cx="-58" cy="-30" rx="60" ry="24" fill="#ffffff" opacity="0.08"/>

    <!-- Outer ring -->
    <circle r="118" fill="none" stroke="#7ce0c8" stroke-width="0.6" opacity="0.65"/>
  </g>

  <!-- ===== Tree growing from the top of the Earth ===== -->
  <g transform="translate(160 112)">
    <animateTransform attributeName="transform" type="rotate"
                      values="-1.4 0 50; 1.4 0 50; -1.4 0 50" dur="13s" repeatCount="indefinite" additive="sum"/>

    <!-- Trunk -->
    <path d="M -4 50 C -5 30 -3 10 0 -10 C 3 10 5 30 4 50 Z" fill="url(#trunk)"/>

    <!-- Branches -->
    <g stroke="#5a3818" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M 0 -8 q -14 -10 -28 -22"/>
      <path d="M 0 -8 q 16 -10 30 -20"/>
      <path d="M 0 -22 q -10 -10 -22 -16"/>
      <path d="M 0 -22 q 12 -10 24 -14"/>
      <path d="M 0 -34 q -6 -10 -14 -16"/>
      <path d="M 0 -34 q 8 -10 16 -16"/>
      <path d="M 0 -42 q 0 -10 0 -18"/>
    </g>

    <!-- Foliage cluster -->
    <g>
      <ellipse cx="0"   cy="-50" rx="34" ry="22" fill="url(#leafA)"/>
      <ellipse cx="-26" cy="-40" rx="26" ry="20" fill="url(#leafC)"/>
      <ellipse cx="26"  cy="-40" rx="26" ry="20" fill="url(#leafA)"/>
      <ellipse cx="-16" cy="-58" rx="22" ry="18" fill="url(#leafA)"/>
      <ellipse cx="16"  cy="-58" rx="22" ry="18" fill="url(#leafC)"/>
      <ellipse cx="0"   cy="-66" rx="18" ry="14" fill="url(#leafA)"/>
      <ellipse cx="-34" cy="-26" rx="14" ry="11" fill="url(#leafA)"/>
      <ellipse cx="34"  cy="-26" rx="14" ry="11" fill="url(#leafC)"/>

      <!-- Dawn-warm accent leaves -->
      <circle cx="-22" cy="-62" r="3"   fill="url(#leafB)"/>
      <circle cx="12"  cy="-68" r="2.4" fill="url(#leafB)"/>
      <circle cx="28"  cy="-50" r="2.6" fill="url(#leafB)"/>
      <circle cx="-30" cy="-44" r="2.2" fill="url(#leafB)"/>
      <circle cx="6"   cy="-44" r="2"   fill="url(#leafB)"/>
    </g>
  </g>

  <!-- ===== Drifting leaves (foreground) — leaf paths inlined so size is correct ===== -->
  <g>
    <!-- Leaf 1 -->
    <g>
      <animateMotion path="M 250 -10 C 260 50 240 110 270 200" dur="17s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="11s" repeatCount="indefinite"/>
        <path d="M 0 -6 C 5 -4 6 0 0 6 C -6 0 -5 -4 0 -6 Z" fill="url(#leafA)" stroke="#0d1117" stroke-width="0.3"/>
      </g>
    </g>
    <!-- Leaf 2 -->
    <g>
      <animateMotion path="M 390 -10 C 370 60 420 130 390 210" dur="19s" begin="-3s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="13s" repeatCount="indefinite"/>
        <path d="M 0 -5 C 4 -3 5 0 0 5 C -5 0 -4 -3 0 -5 Z" fill="url(#leafC)" stroke="#0d1117" stroke-width="0.3"/>
      </g>
    </g>
    <!-- Leaf 3 (gold) -->
    <g>
      <animateMotion path="M 470 -10 C 490 50 460 140 490 210" dur="23s" begin="-6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="17s" repeatCount="indefinite"/>
        <path d="M 0 -5 C 4 -3 5 0 0 5 C -5 0 -4 -3 0 -5 Z" fill="url(#leafB)" stroke="#0d1117" stroke-width="0.3"/>
      </g>
    </g>
    <!-- Leaf 4 -->
    <g>
      <animateMotion path="M 720 -10 C 700 80 740 140 710 210" dur="29s" begin="-9s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="19s" repeatCount="indefinite"/>
        <path d="M 0 -5 C 4 -3 5 0 0 5 C -5 0 -4 -3 0 -5 Z" fill="url(#leafA)" stroke="#0d1117" stroke-width="0.3"/>
      </g>
    </g>
    <!-- Leaf 5 -->
    <g>
      <animateMotion path="M 560 -10 C 580 80 540 160 590 210" dur="31s" begin="-4s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="23s" repeatCount="indefinite"/>
        <path d="M 0 -4 C 3 -2 4 0 0 4 C -4 0 -3 -2 0 -4 Z" fill="url(#leafB)" stroke="#0d1117" stroke-width="0.3"/>
      </g>
    </g>
  </g>

  <!-- ===== Typography block (right side) ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Top chip -->
    <g transform="translate(370 22)">
      <rect x="0" y="0" width="400" height="18" fill="#a9e08a"/>
      <text x="200" y="13" text-anchor="middle"
            font-size="10" font-weight="800" fill="#0d1117" letter-spacing="3">
        WORLD ENVIRONMENT DAY · UN · SINCE 1972
      </text>
    </g>

    <!-- BIG DATE -->
    <text x="570" y="100" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="44" font-weight="900" fill="#ffffff" letter-spacing="3"
          filter="url(#typeGlow)">
      JUNE 5 · 2026
    </text>

    <!-- Underline rule -->
    <g stroke="#a9e08a" stroke-width="1.1" opacity="0.95">
      <line x1="380" y1="116" x2="760" y2="116"/>
      <circle cx="380" cy="116" r="2.2" fill="#a9e08a"/>
      <circle cx="760" cy="116" r="2.2" fill="#a9e08a"/>
    </g>

    <!-- Subtitle -->
    <text x="570" y="140" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="17" font-style="italic" fill="#a9e08a" letter-spacing="2.5">
      Only One Earth
    </text>

    <!-- Tag -->
    <text x="570" y="160" text-anchor="middle"
          font-size="9.5" font-weight="700" fill="#cfeec0" letter-spacing="3.4" opacity="0.95">
      54TH ANNUAL OBSERVANCE
    </text>
  </g>

  <!-- Corner ticks framing the typography block -->
  <g stroke="#a9e08a" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M 370 14 L 370 26 M 370 14 L 382 14"/>
    <path d="M 770 14 L 770 26 M 770 14 L 758 14"/>
    <path d="M 370 168 L 370 156 M 370 168 L 382 168"/>
    <path d="M 770 168 L 770 156 M 770 168 L 758 168"/>
  </g>

  <!-- Bottom footer telemetry -->
  <g font-family="Courier New, monospace">
    <text x="400" y="190" text-anchor="middle"
          font-size="7.6" fill="#9fd9a8" letter-spacing="2.8" opacity="0.85">
      ECOSYSTEM · STEWARDSHIP · ONE BIOSPHERE · KEEP THE LIGHTS ON FOR THE NEXT TENANTS
    </text>
  </g>

  <!-- Vignette -->
  <rect width="800" height="200" fill="url(#vignette)" pointer-events="none"/>
</svg>
