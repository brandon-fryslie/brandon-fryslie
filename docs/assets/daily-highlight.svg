<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: E.T. the Extra-Terrestrial — 44th anniversary of theatrical release (June 11, 1982, Universal Pictures, directed by Steven Spielberg, score by John Williams); iconic silhouette of Elliott and E.T. flying past a giant full moon on a BMX bicycle, starry summer-night sky, drifting cloud layer, glowing fingertip motif, deep navy → moonlight palette -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 11, 2026 — 44th anniversary of E.T. the Extra-Terrestrial released June 11, 1982">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="35%" stop-color="#0a1230"/>
      <stop offset="70%" stop-color="#13245a"/>
      <stop offset="100%" stop-color="#1a3270"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7d8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#fde6a2" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#e6c060" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moon" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0%" stop-color="#fff9e3"/>
      <stop offset="55%" stop-color="#f4dc94"/>
      <stop offset="100%" stop-color="#c8a04a"/>
    </radialGradient>

    <radialGradient id="finger" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff2b0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffb04a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7d0"/>
      <stop offset="55%" stop-color="#f3d36a"/>
      <stop offset="100%" stop-color="#a8762a"/>
    </linearGradient>

    <filter id="craterShade">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <filter id="moonSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" in="SourceAlpha" result="blur"/>
      <feFlood flood-color="#fff2b0" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cloudBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <!-- twinkle star symbol -->
    <symbol id="star" overflow="visible">
      <circle r="1" fill="#fff7d8"/>
    </symbol>

    <!-- BMX bicycle + Elliott + E.T. silhouette, facing right -->
    <symbol id="bike" overflow="visible">
      <g fill="#02030a">
        <!-- rear wheel -->
        <circle cx="-22" cy="0" r="14" fill="none" stroke="#02030a" stroke-width="2.4"/>
        <circle cx="-22" cy="0" r="2.4"/>
        <!-- front wheel -->
        <circle cx="22" cy="0" r="14" fill="none" stroke="#02030a" stroke-width="2.4"/>
        <circle cx="22" cy="0" r="2.4"/>
        <!-- spokes (sketchy) -->
        <line x1="-22" y1="-13" x2="-22" y2="13" stroke="#02030a" stroke-width="0.6"/>
        <line x1="-35" y1="0" x2="-9" y2="0" stroke="#02030a" stroke-width="0.6"/>
        <line x1="-31.6" y1="-9.2" x2="-12.4" y2="9.2" stroke="#02030a" stroke-width="0.6"/>
        <line x1="-31.6" y1="9.2" x2="-12.4" y2="-9.2" stroke="#02030a" stroke-width="0.6"/>
        <line x1="22" y1="-13" x2="22" y2="13" stroke="#02030a" stroke-width="0.6"/>
        <line x1="9" y1="0" x2="35" y2="0" stroke="#02030a" stroke-width="0.6"/>
        <line x1="12.4" y1="-9.2" x2="31.6" y2="9.2" stroke="#02030a" stroke-width="0.6"/>
        <line x1="12.4" y1="9.2" x2="31.6" y2="-9.2" stroke="#02030a" stroke-width="0.6"/>
        <!-- frame -->
        <path d="M-22,0 L0,-14 L22,0 M-22,0 L0,0 L18,-14 L22,0 M0,-14 L-2,-22 L8,-22"
              stroke="#02030a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- handlebars -->
        <path d="M14,-22 L18,-26 L22,-22" stroke="#02030a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <!-- seat -->
        <path d="M-6,-22 L4,-22" stroke="#02030a" stroke-width="3" stroke-linecap="round"/>

        <!-- Elliott silhouette (rider) -->
        <!-- legs -->
        <path d="M-2,-22 L-8,-12 L-6,-6" stroke="#02030a" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <path d="M2,-22 L8,-14 L6,-8" stroke="#02030a" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        <!-- torso (leaning forward) -->
        <path d="M-1,-22 L8,-36 L18,-30" stroke="#02030a" stroke-width="4.4" stroke-linecap="round" fill="none"/>
        <!-- arms onto handlebars -->
        <path d="M8,-36 L18,-26" stroke="#02030a" stroke-width="2.4" stroke-linecap="round"/>
        <!-- head -->
        <circle cx="9" cy="-40" r="4.2"/>
        <!-- hood/hair tuft trailing -->
        <path d="M5,-43 L0,-41 L4,-39 Z"/>

        <!-- Basket on the handlebars -->
        <rect x="20" y="-26" width="20" height="10" rx="1.5" fill="#02030a"/>
        <line x1="22" y1="-26" x2="22" y2="-16" stroke="#1a1f30" stroke-width="0.5"/>
        <line x1="26" y1="-26" x2="26" y2="-16" stroke="#1a1f30" stroke-width="0.5"/>
        <line x1="30" y1="-26" x2="30" y2="-16" stroke="#1a1f30" stroke-width="0.5"/>
        <line x1="34" y1="-26" x2="34" y2="-16" stroke="#1a1f30" stroke-width="0.5"/>
        <line x1="38" y1="-26" x2="38" y2="-16" stroke="#1a1f30" stroke-width="0.5"/>
        <line x1="20" y1="-22" x2="40" y2="-22" stroke="#1a1f30" stroke-width="0.5"/>

        <!-- E.T. silhouette peeking out of basket, wrapped in white sheet -->
        <path fill="#e8e6da" d="M22,-28 Q24,-40 30,-42 Q36,-40 38,-28 L38,-26 L22,-26 Z"/>
        <!-- E.T. head -->
        <ellipse cx="30" cy="-36" rx="4.2" ry="3.6" fill="#7a6240"/>
        <!-- E.T. neck (slight extend) -->
        <rect x="29" y="-33" width="2" height="2" fill="#7a6240"/>
        <!-- E.T. eyes -->
        <circle cx="28.4" cy="-37" r="0.7" fill="#0a0a0a"/>
        <circle cx="31.6" cy="-37" r="0.7" fill="#0a0a0a"/>
      </g>
    </symbol>

    <clipPath id="frame"><rect x="0" y="0" width="800" height="200" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- night sky -->
    <rect width="800" height="200" fill="url(#sky)"/>

    <!-- distant stars -->
    <g>
      <use href="#star" x="40" y="22"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/></use>
      <use href="#star" x="92" y="48"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="11s" repeatCount="indefinite"/></use>
      <use href="#star" x="148" y="18"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="13s" begin="-2s" repeatCount="indefinite"/></use>
      <use href="#star" x="208" y="62"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="-1s" repeatCount="indefinite"/></use>
      <use href="#star" x="252" y="32"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="11s" begin="-3s" repeatCount="indefinite"/></use>
      <use href="#star" x="304" y="14"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" repeatCount="indefinite"/></use>
      <use href="#star" x="352" y="58"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" begin="-1.5s" repeatCount="indefinite"/></use>
      <use href="#star" x="402" y="20"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" begin="-2.5s" repeatCount="indefinite"/></use>
      <use href="#star" x="468" y="42"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="13s" begin="-4s" repeatCount="indefinite"/></use>
      <use href="#star" x="222" y="92"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" begin="-0.5s" repeatCount="indefinite"/></use>
      <use href="#star" x="64" y="84"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="-2.2s" repeatCount="indefinite"/></use>
      <use href="#star" x="378" y="96"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" begin="-3.5s" repeatCount="indefinite"/></use>
      <use href="#star" x="124" y="108"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="11s" begin="-1.8s" repeatCount="indefinite"/></use>
      <use href="#star" x="282" y="124"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" begin="-2.8s" repeatCount="indefinite"/></use>
      <use href="#star" x="752" y="34"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" begin="-1.1s" repeatCount="indefinite"/></use>
      <use href="#star" x="710" y="68"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="13s" begin="-3.2s" repeatCount="indefinite"/></use>
      <use href="#star" x="780" y="92"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s" begin="-0.8s" repeatCount="indefinite"/></use>
      <use href="#star" x="166" y="138"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" begin="-2.3s" repeatCount="indefinite"/></use>
      <use href="#star" x="346" y="148"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="-1.6s" repeatCount="indefinite"/></use>
      <use href="#star" x="244" y="150"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" begin="-2.9s" repeatCount="indefinite"/></use>
    </g>

    <!-- moon glow halo -->
    <circle cx="560" cy="105" r="125" fill="url(#moonGlow)"/>

    <!-- the giant moon -->
    <g filter="url(#moonSoft)">
      <circle cx="560" cy="105" r="80" fill="url(#moon)"/>
      <!-- craters -->
      <g fill="#caa050" opacity="0.55" filter="url(#craterShade)">
        <circle cx="530" cy="80" r="9"/>
        <circle cx="580" cy="78" r="5"/>
        <circle cx="595" cy="118" r="11"/>
        <circle cx="540" cy="135" r="7"/>
        <circle cx="510" cy="115" r="6"/>
        <circle cx="572" cy="148" r="4"/>
        <circle cx="555" cy="105" r="3"/>
        <circle cx="610" cy="92" r="3"/>
      </g>
      <g fill="#e8c878" opacity="0.4">
        <circle cx="532" cy="78" r="3"/>
        <circle cx="593" cy="116" r="4"/>
        <circle cx="540" cy="133" r="2.5"/>
      </g>
    </g>

    <!-- drifting clouds across the moon (animated translate) -->
    <g opacity="0.42" filter="url(#cloudBlur)">
      <ellipse cx="0" cy="138" rx="80" ry="9" fill="#1d2a55">
        <animateTransform attributeName="transform" type="translate" values="-100,0;900,0" dur="29s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="92" rx="60" ry="7" fill="#1d2a55">
        <animateTransform attributeName="transform" type="translate" values="-200,0;1000,0" dur="37s" begin="-12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="64" rx="50" ry="6" fill="#1d2a55">
        <animateTransform attributeName="transform" type="translate" values="-200,0;1000,0" dur="43s" begin="-22s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- shooting star streak -->
    <g stroke="#fff2b0" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="0" x2="32" y2="-12" opacity="0">
        <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.85;0.92;1" dur="11s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="80,30;240,80" dur="11s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- The bicycle silhouette flying past the moon -->
    <g>
      <use href="#bike" x="540" y="110">
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,-3; 0,0; 0,2; 0,0" dur="7s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- Glowing fingertip — small magical detail, beside E.T. (offset from bike position) -->
    <g>
      <circle cx="582" cy="74" r="6" fill="url(#finger)">
        <animate attributeName="r" values="5;9;5" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="582" cy="74" r="1.6" fill="#fff7d0"/>
    </g>

    <!-- horizon treeline silhouette at the bottom -->
    <g fill="#02030a">
      <path d="M0,200 L0,182
               L28,178 L40,184 L60,170 L72,180 L94,176 L104,182 L130,166 L142,180
               L168,178 L180,182 L210,168 L228,182 L258,176 L274,184 L306,170 L322,184
               L356,178 L372,184 L404,170 L420,184 L452,178 L470,184 L504,168 L522,184
               L556,178 L572,184 L604,170 L624,184 L656,178 L676,184 L708,170 L728,184
               L756,178 L778,184 L800,180 L800,200 Z"/>
      <!-- a couple of tall conifer silhouettes -->
      <path d="M126,184 L132,156 L138,184 Z"/>
      <path d="M404,184 L412,150 L420,184 Z"/>
      <path d="M656,184 L662,158 L668,184 Z"/>
    </g>

    <!-- TITLE + DATE block, integrated into the sky on the left -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <!-- eyebrow -->
      <text x="32" y="32" font-size="10" letter-spacing="5" fill="#f3d36a" opacity="0.95">UNIVERSAL · STEVEN SPIELBERG · 1982</text>

      <!-- main title — "E.T." big -->
      <text x="32" y="82" font-size="54" font-weight="900" letter-spacing="2" fill="url(#goldText)" filter="url(#textGlow)">E.T.</text>

      <!-- subtitle inline beside E.T. -->
      <text x="158" y="66" font-size="13" font-weight="700" letter-spacing="4" fill="#f7e9b0">THE EXTRA-</text>
      <text x="158" y="82" font-size="13" font-weight="700" letter-spacing="4" fill="#f7e9b0">TERRESTRIAL</text>

      <!-- phone home tagline below the title row -->
      <text x="32" y="106" font-size="11" letter-spacing="6" fill="#c4b88a" font-style="italic">"E.T. PHONE HOME"</text>

      <!-- date pill -->
      <g transform="translate(32,118)">
        <rect x="0" y="0" width="240" height="34" rx="17" fill="#05060d" opacity="0.78" stroke="#f3d36a" stroke-opacity="0.85" stroke-width="1.1"/>
        <text x="120" y="23" font-size="18" font-weight="800" letter-spacing="4" text-anchor="middle" fill="#fff2b0">JUNE 11 · 2026</text>
      </g>

      <!-- subtitle anniversary -->
      <text x="32" y="170" font-size="10" letter-spacing="4" fill="#e0b870" opacity="0.95">44th ANNIVERSARY · MUSIC BY JOHN WILLIAMS</text>
    </g>

    <!-- subtle vignette -->
    <rect width="800" height="200" fill="url(#vignette)" pointer-events="none"/>
  </g>

  <defs>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.85">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
</svg>
