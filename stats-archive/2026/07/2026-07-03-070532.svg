<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brandon Fryslie GitHub stats for July 03, 2026">
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e4429" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e6edf3" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e6edf3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chartClip">
      <rect x="20" y="42" width="760" height="115"/>
    </clipPath>
  </defs>

  <!-- Canvas background + soft frame -->
  <rect width="800" height="300" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="299" rx="6" ry="6" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- ===== HEADER ===== -->
  <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6fc">Live GitHub Stats</text>
  <text x="780" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">past 12 months &#183; Jul 03, 2026</text>
  <line x1="20" y1="32" x2="780" y2="32" stroke="#21262d" stroke-width="1"/>

  <!-- ===== MONTHLY ACTIVITY SPINE ===== -->
  <!-- Reference gridlines: 0 (baseline) and 2029 (peak) -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="2 4">
    <line x1="34" y1="48" x2="770" y2="48"/>
    <line x1="34" y1="155" x2="770" y2="155"/>
  </g>
  <text x="30" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#484f58" text-anchor="end">2029</text>
  <text x="30" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#484f58" text-anchor="end">0</text>

  <!-- Area chart -->
  <g clip-path="url(#chartClip)">
    <path d="M 40,155 L 40,154.5 L 100,153.6 L 160,154.9 L 220,153.8 L 280,151.0 L 340,133.8 L 400,86.5 L 460,82.0 L 520,107.8 L 580,117.3 L 640,95.8 L 700,48 L 760,149.9 L 760,155 Z" fill="url(#areaFill)"/>
    <path d="M 40,154.5 L 100,153.6 L 160,154.9 L 220,153.8 L 280,151.0 L 340,133.8 L 400,86.5 L 460,82.0 L 520,107.8 L 580,117.3 L 640,95.8 L 700,48 L 760,149.9" fill="none" stroke="#39d353" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Continuously sweeping highlight -->
    <rect x="-80" y="42" width="80" height="115" fill="url(#sweep)">
      <animate attributeName="x" from="-80" to="800" dur="13s" repeatCount="indefinite"/>
    </rect>

    <!-- Data-point dots -->
    <g fill="#39d353">
      <circle cx="40"  cy="154.5" r="2"/>
      <circle cx="100" cy="153.6" r="2"/>
      <circle cx="160" cy="154.9" r="2"/>
      <circle cx="220" cy="153.8" r="2"/>
      <circle cx="280" cy="151.0" r="2"/>
      <circle cx="340" cy="133.8" r="2.5"/>
      <circle cx="400" cy="86.5"  r="2.5"/>
      <circle cx="460" cy="82.0"  r="2.5"/>
      <circle cx="520" cy="107.8" r="2.5"/>
      <circle cx="580" cy="117.3" r="2.5"/>
      <circle cx="640" cy="95.8"  r="2.5"/>
    </g>
    <!-- Peak (Jun 2026) -->
    <circle cx="700" cy="48" r="4" fill="#39d353">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.65;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- Partial month marker (Jul 2026, month-in-progress) -->
    <circle cx="760" cy="149.9" r="2.5" fill="#0d1117" stroke="#39d353" stroke-width="1.2"/>
  </g>

  <!-- Peak callout -->
  <text x="700" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="middle">Jun peak</text>

  <!-- Month axis -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">
    <text x="40"  y="169">Jul</text>
    <text x="100" y="169">Aug</text>
    <text x="160" y="169">Sep</text>
    <text x="220" y="169">Oct</text>
    <text x="280" y="169">Nov</text>
    <text x="340" y="169">Dec</text>
    <text x="400" y="169">Jan</text>
    <text x="460" y="169">Feb</text>
    <text x="520" y="169">Mar</text>
    <text x="580" y="169">Apr</text>
    <text x="640" y="169">May</text>
    <text x="700" y="169">Jun</text>
    <text x="760" y="169">Jul</text>
  </g>

  <!-- Panel divider -->
  <line x1="20" y1="180" x2="780" y2="180" stroke="#21262d" stroke-width="1"/>

  <!-- ===== METRIC PANEL ===== -->

  <!-- Cell A: Days Active donut (has max=365) -->
  <g>
    <circle cx="72" cy="222" r="22" fill="none" stroke="#21262d" stroke-width="5"/>
    <g transform="rotate(-90 72 222)">
      <circle cx="72" cy="222" r="22" fill="none" stroke="#f2cc60" stroke-width="5"
              stroke-dasharray="88.63 49.60" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.75;1;0.75" dur="11s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="72" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f0f6fc" text-anchor="middle">234</text>
    <text x="72" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="middle">Days Active</text>
    <text x="72" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">1 Year &#183; of 365</text>
  </g>

  <line x1="150" y1="192" x2="150" y2="285" stroke="#21262d" stroke-width="1"/>

  <!-- Cell B: Active Repos + breakdown -->
  <g>
    <text x="162" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#c9d1d9">Active Repos</text>
    <text x="162" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#39d353">7</text>
    <text x="162" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#8b949e">7 Days</text>
    <text x="162" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#6e7681">by commits</text>

    <!-- Breakdown: name | bar | count. Bar length = count/26 * 60. -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#c9d1d9">
      <!-- oscilla-animator-v2 : 26 (100%) -->
      <text x="258" y="207">oscilla-animator-v2</text>
      <rect x="376" y="201" width="60" height="6" rx="1" fill="#26a641">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="11s" repeatCount="indefinite"/>
      </rect>
      <text x="458" y="207" text-anchor="end">26</text>

      <!-- slopspot-paste : 20 (77%) -->
      <text x="258" y="220">slopspot-paste</text>
      <rect x="376" y="214" width="46.2" height="6" rx="1" fill="#26a641">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="11s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="458" y="220" text-anchor="end">20</text>

      <!-- cc-candybar : 5 (19%) -->
      <text x="258" y="233">cc-candybar</text>
      <rect x="376" y="227" width="11.5" height="6" rx="1" fill="#26a641">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="11s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="458" y="233" text-anchor="end">5</text>

      <!-- links-issue-tracker : 5 (19%) -->
      <text x="258" y="246">links-issue-tracker</text>
      <rect x="376" y="240" width="11.5" height="6" rx="1" fill="#26a641">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="11s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="458" y="246" text-anchor="end">5</text>

      <!-- crom : 4 (15%) -->
      <text x="258" y="259">crom</text>
      <rect x="376" y="253" width="9.2" height="6" rx="1" fill="#26a641">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="11s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="458" y="259" text-anchor="end">4</text>

      <!-- design-snatch : 3 (12%) -->
      <text x="258" y="272">design-snatch</text>
      <rect x="376" y="266" width="6.9" height="6" rx="1" fill="#26a641">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="11s" begin="2.5s" repeatCount="indefinite"/>
      </rect>
      <text x="458" y="272" text-anchor="end">3</text>
    </g>
  </g>

  <line x1="472" y1="192" x2="472" y2="285" stroke="#21262d" stroke-width="1"/>

  <!-- Cell C: 4 scalar chips in 2x2 grid -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Chip 1: Commits · 30 Days -->
    <rect x="484" y="200" width="3" height="34" rx="1" fill="#ffa657">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="494" y="228" font-size="24" font-weight="700" fill="#f0f6fc">988</text>
    <text x="620" y="215" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="end">Commits</text>
    <text x="620" y="230" font-size="9" fill="#8b949e" text-anchor="end">30 Days</text>

    <!-- Chip 2: PRs Merged · All Time -->
    <rect x="634" y="200" width="3" height="34" rx="1" fill="#58a6ff">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="7s" begin="1.75s" repeatCount="indefinite"/>
    </rect>
    <text x="644" y="228" font-size="24" font-weight="700" fill="#f0f6fc">1684</text>
    <text x="774" y="215" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="end">PRs Merged</text>
    <text x="774" y="230" font-size="9" fill="#8b949e" text-anchor="end">All Time</text>

    <!-- Chip 3: Longest Streak · 1 Year -->
    <rect x="484" y="246" width="3" height="34" rx="1" fill="#f2cc60">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="494" y="274" font-size="24" font-weight="700" fill="#f0f6fc">82</text>
    <text x="620" y="261" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="end">Longest Streak</text>
    <text x="620" y="276" font-size="9" fill="#8b949e" text-anchor="end">1 Year</text>

    <!-- Chip 4: My Issues Closed · 1 Year -->
    <rect x="634" y="246" width="3" height="34" rx="1" fill="#f778ba">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="7s" begin="5.25s" repeatCount="indefinite"/>
    </rect>
    <text x="644" y="274" font-size="24" font-weight="700" fill="#f0f6fc">69</text>
    <text x="774" y="261" font-size="11" font-weight="600" fill="#c9d1d9" text-anchor="end">My Issues Closed</text>
    <text x="774" y="276" font-size="9" fill="#8b949e" text-anchor="end">1 Year</text>
  </g>
</svg>
