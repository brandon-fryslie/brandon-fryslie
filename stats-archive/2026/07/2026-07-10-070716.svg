<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1f6b2e"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="langShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelScan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chartClip"><rect x="24" y="52" width="752" height="120"/></clipPath>
    <clipPath id="panelsClip"><rect x="20" y="200" width="760" height="140"/></clipPath>
    <clipPath id="langBarClip"><rect x="299" y="294" width="200" height="10"/></clipPath>
  </defs>

  <!-- background -->
  <rect x="0.5" y="0.5" width="799" height="359" rx="8" fill="#0d1117" stroke="#30363d"/>

  <!-- header -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#c9d1d9">Live GitHub Stats</text>
  <text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">past 12 months · through 2026-07-10</text>
  <line x1="24" y1="40" x2="776" y2="40" stroke="#30363d"/>

  <!-- chart baseline -->
  <line x1="24" y1="170" x2="776" y2="170" stroke="#30363d"/>

  <!-- streak highlight band (spans Jan 9 → Apr 1, days 183–264) -->
  <g clip-path="url(#chartClip)">
    <rect x="387" y="52" width="153" height="118" fill="#f0883e" opacity="0.10">
      <animate attributeName="opacity" values="0.08;0.20;0.08" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="387" y="52" width="153" height="118" fill="none" stroke="#f0883e" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="387" y1="52" x2="387" y2="170" stroke="#f0883e" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="540" y1="52" x2="540" y2="170" stroke="#f0883e" stroke-opacity="0.6" stroke-width="1"/>
  </g>

  <!-- monthly bars (Jul25 → Jul26; height normalized to max=2014) -->
  <g fill="url(#barGrad)">
    <rect x="26"  y="168" width="52" height="2"   rx="1"/>
    <rect x="84"  y="167" width="52" height="3"   rx="1"/>
    <rect x="142" y="168" width="52" height="2"   rx="1"/>
    <rect x="200" y="167" width="52" height="3"   rx="1"/>
    <rect x="258" y="165" width="52" height="5"   rx="1"/>
    <rect x="316" y="147" width="52" height="23"  rx="1"/>
    <rect x="374" y="94"  width="52" height="76"  rx="1"/>
    <rect x="432" y="94"  width="52" height="76"  rx="1"/>
    <rect x="490" y="119" width="52" height="51"  rx="1"/>
    <rect x="548" y="127" width="52" height="43"  rx="1"/>
    <rect x="606" y="104" width="52" height="66"  rx="1"/>
    <rect x="664" y="56"  width="52" height="114" rx="1"/>
    <rect x="722" y="153" width="52" height="17"  rx="1"/>
  </g>

  <!-- scanning highlight across chart -->
  <g clip-path="url(#chartClip)">
    <rect y="52" width="160" height="118" fill="url(#scanGrad)">
      <animate attributeName="x" from="-160" to="800" dur="17s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Streak label inside the highlighted band -->
  <g text-anchor="middle" fill="#f0883e">
    <text x="463" y="74" font-size="22" font-weight="700">82</text>
    <text x="463" y="88" font-size="9" letter-spacing="1.2" font-weight="600">DAY LONGEST STREAK</text>
  </g>

  <!-- month axis -->
  <g font-size="9" fill="#6e7681" text-anchor="middle">
    <text x="52" y="184">Jul</text>
    <text x="110" y="184">Aug</text>
    <text x="168" y="184">Sep</text>
    <text x="226" y="184">Oct</text>
    <text x="284" y="184">Nov</text>
    <text x="342" y="184">Dec</text>
    <text x="400" y="184" fill="#f0883e">Jan</text>
    <text x="458" y="184" fill="#f0883e">Feb</text>
    <text x="516" y="184" fill="#f0883e">Mar</text>
    <text x="574" y="184">Apr</text>
    <text x="632" y="184">May</text>
    <text x="690" y="184">Jun</text>
    <text x="748" y="184">Jul</text>
  </g>

  <!-- section divider -->
  <line x1="24" y1="196" x2="776" y2="196" stroke="#30363d"/>

  <!-- vertical panel dividers -->
  <line x1="269" y1="204" x2="269" y2="340" stroke="#21262d"/>
  <line x1="530" y1="204" x2="530" y2="340" stroke="#21262d"/>

  <!-- ============ PANEL 1: Days Active 29/30 ============ -->
  <g text-anchor="middle">
    <text x="128" y="248" font-size="40" font-weight="700" fill="#3fb950">29</text>
    <text x="170" y="248" font-size="18" font-weight="500" fill="#6e7681">/30</text>
    <text x="144" y="266" font-size="12" font-weight="600" fill="#c9d1d9">Days Active</text>
    <text x="144" y="278" font-size="10" fill="#8b949e">30 Days</text>
  </g>
  <!-- 10x3 dot grid: 29 filled green, 1 empty -->
  <g fill="#3fb950">
    <circle cx="84.5" cy="290" r="3"/><circle cx="96.5" cy="290" r="3"/><circle cx="108.5" cy="290" r="3"/><circle cx="120.5" cy="290" r="3"/><circle cx="132.5" cy="290" r="3"/><circle cx="144.5" cy="290" r="3"/><circle cx="156.5" cy="290" r="3"/><circle cx="168.5" cy="290" r="3"/><circle cx="180.5" cy="290" r="3"/><circle cx="192.5" cy="290" r="3"/>
    <circle cx="84.5" cy="302" r="3"/><circle cx="96.5" cy="302" r="3"/><circle cx="108.5" cy="302" r="3"/><circle cx="120.5" cy="302" r="3"/><circle cx="132.5" cy="302" r="3"/><circle cx="144.5" cy="302" r="3"/><circle cx="156.5" cy="302" r="3"/><circle cx="168.5" cy="302" r="3"/><circle cx="180.5" cy="302" r="3"/><circle cx="192.5" cy="302" r="3"/>
    <circle cx="84.5" cy="314" r="3"/><circle cx="96.5" cy="314" r="3"/><circle cx="108.5" cy="314" r="3"/><circle cx="120.5" cy="314" r="3"/><circle cx="132.5" cy="314" r="3"/><circle cx="144.5" cy="314" r="3"/><circle cx="156.5" cy="314" r="3"/><circle cx="168.5" cy="314" r="3"/><circle cx="180.5" cy="314" r="3"/>
  </g>
  <circle cx="192.5" cy="314" r="3" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- ============ PANEL 2: Languages 9 ============ -->
  <g text-anchor="middle">
    <text x="399.5" y="248" font-size="40" font-weight="700" fill="#d2a8ff">9</text>
    <text x="399.5" y="266" font-size="12" font-weight="600" fill="#c9d1d9">Languages</text>
    <text x="399.5" y="278" font-size="10" fill="#8b949e">1 Year</text>
  </g>
  <!-- stacked horizontal bar, 200px wide, segments proportional to line counts -->
  <g>
    <rect x="299" y="294" width="200" height="10" rx="2" fill="#161b22"/>
    <rect x="299" y="294" width="135" height="10" fill="#3178c6"/>
    <rect x="434" y="294" width="39"  height="10" fill="#ffd43b"/>
    <rect x="473" y="294" width="18"  height="10" fill="#00ADD8"/>
    <rect x="491" y="294" width="3"   height="10" fill="#89e051"/>
    <rect x="494" y="294" width="2"   height="10" fill="#e34c26"/>
    <rect x="496" y="294" width="1"   height="10" fill="#a371f7"/>
    <rect x="497" y="294" width="1"   height="10" fill="#f1e05a"/>
    <rect x="498" y="294" width="1"   height="10" fill="#844FBA"/>
    <rect x="299" y="294" width="200" height="10" rx="2" fill="none" stroke="#30363d" stroke-width="0.5"/>
    <!-- shimmer sweep across bar -->
    <g clip-path="url(#langBarClip)">
      <rect y="294" width="80" height="10" fill="url(#langShimmer)">
        <animate attributeName="x" from="220" to="520" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <!-- legend: top 3 languages -->
  <g font-size="9" fill="#8b949e">
    <circle cx="314" cy="318" r="3" fill="#3178c6"/><text x="321" y="321">TypeScript</text>
    <circle cx="388" cy="318" r="3" fill="#ffd43b"/><text x="395" y="321">Python</text>
    <circle cx="443" cy="318" r="3" fill="#00ADD8"/><text x="450" y="321">Go</text>
    <text x="475" y="321" fill="#6e7681">+5 more</text>
  </g>

  <!-- ============ PANEL 3: My Issues Closed 87 ============ -->
  <g text-anchor="middle">
    <text x="661" y="248" font-size="40" font-weight="700" fill="#58a6ff">87</text>
    <text x="661" y="266" font-size="12" font-weight="600" fill="#c9d1d9">My Issues Closed</text>
    <text x="661" y="278" font-size="10" fill="#8b949e">All Time</text>
  </g>
  <!-- 18x5 dot grid: 87 filled blue, 3 empty (bottom-right corner) -->
  <g fill="#58a6ff">
    <!-- rows 0-3: 72 dots -->
    <circle cx="558.5" cy="290" r="3"/><circle cx="570.5" cy="290" r="3"/><circle cx="582.5" cy="290" r="3"/><circle cx="594.5" cy="290" r="3"/><circle cx="606.5" cy="290" r="3"/><circle cx="618.5" cy="290" r="3"/><circle cx="630.5" cy="290" r="3"/><circle cx="642.5" cy="290" r="3"/><circle cx="654.5" cy="290" r="3"/><circle cx="666.5" cy="290" r="3"/><circle cx="678.5" cy="290" r="3"/><circle cx="690.5" cy="290" r="3"/><circle cx="702.5" cy="290" r="3"/><circle cx="714.5" cy="290" r="3"/><circle cx="726.5" cy="290" r="3"/><circle cx="738.5" cy="290" r="3"/><circle cx="750.5" cy="290" r="3"/><circle cx="762.5" cy="290" r="3"/>
    <circle cx="558.5" cy="298" r="3"/><circle cx="570.5" cy="298" r="3"/><circle cx="582.5" cy="298" r="3"/><circle cx="594.5" cy="298" r="3"/><circle cx="606.5" cy="298" r="3"/><circle cx="618.5" cy="298" r="3"/><circle cx="630.5" cy="298" r="3"/><circle cx="642.5" cy="298" r="3"/><circle cx="654.5" cy="298" r="3"/><circle cx="666.5" cy="298" r="3"/><circle cx="678.5" cy="298" r="3"/><circle cx="690.5" cy="298" r="3"/><circle cx="702.5" cy="298" r="3"/><circle cx="714.5" cy="298" r="3"/><circle cx="726.5" cy="298" r="3"/><circle cx="738.5" cy="298" r="3"/><circle cx="750.5" cy="298" r="3"/><circle cx="762.5" cy="298" r="3"/>
    <circle cx="558.5" cy="306" r="3"/><circle cx="570.5" cy="306" r="3"/><circle cx="582.5" cy="306" r="3"/><circle cx="594.5" cy="306" r="3"/><circle cx="606.5" cy="306" r="3"/><circle cx="618.5" cy="306" r="3"/><circle cx="630.5" cy="306" r="3"/><circle cx="642.5" cy="306" r="3"/><circle cx="654.5" cy="306" r="3"/><circle cx="666.5" cy="306" r="3"/><circle cx="678.5" cy="306" r="3"/><circle cx="690.5" cy="306" r="3"/><circle cx="702.5" cy="306" r="3"/><circle cx="714.5" cy="306" r="3"/><circle cx="726.5" cy="306" r="3"/><circle cx="738.5" cy="306" r="3"/><circle cx="750.5" cy="306" r="3"/><circle cx="762.5" cy="306" r="3"/>
    <circle cx="558.5" cy="314" r="3"/><circle cx="570.5" cy="314" r="3"/><circle cx="582.5" cy="314" r="3"/><circle cx="594.5" cy="314" r="3"/><circle cx="606.5" cy="314" r="3"/><circle cx="618.5" cy="314" r="3"/><circle cx="630.5" cy="314" r="3"/><circle cx="642.5" cy="314" r="3"/><circle cx="654.5" cy="314" r="3"/><circle cx="666.5" cy="314" r="3"/><circle cx="678.5" cy="314" r="3"/><circle cx="690.5" cy="314" r="3"/><circle cx="702.5" cy="314" r="3"/><circle cx="714.5" cy="314" r="3"/><circle cx="726.5" cy="314" r="3"/><circle cx="738.5" cy="314" r="3"/><circle cx="750.5" cy="314" r="3"/><circle cx="762.5" cy="314" r="3"/>
    <!-- row 4: 15 filled -->
    <circle cx="558.5" cy="322" r="3"/><circle cx="570.5" cy="322" r="3"/><circle cx="582.5" cy="322" r="3"/><circle cx="594.5" cy="322" r="3"/><circle cx="606.5" cy="322" r="3"/><circle cx="618.5" cy="322" r="3"/><circle cx="630.5" cy="322" r="3"/><circle cx="642.5" cy="322" r="3"/><circle cx="654.5" cy="322" r="3"/><circle cx="666.5" cy="322" r="3"/><circle cx="678.5" cy="322" r="3"/><circle cx="690.5" cy="322" r="3"/><circle cx="702.5" cy="322" r="3"/><circle cx="714.5" cy="322" r="3"/><circle cx="726.5" cy="322" r="3"/>
  </g>
  <!-- row 4: 3 empty -->
  <g fill="none" stroke="#30363d" stroke-width="1">
    <circle cx="738.5" cy="322" r="3"/><circle cx="750.5" cy="322" r="3"/><circle cx="762.5" cy="322" r="3"/>
  </g>

  <!-- global panel scan overlay -->
  <g clip-path="url(#panelsClip)">
    <rect y="200" width="160" height="140" fill="url(#panelScan)">
      <animate attributeName="x" from="-160" to="800" dur="13s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
