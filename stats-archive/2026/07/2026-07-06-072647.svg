<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf58f"/>
      <stop offset="0.5" stop-color="#39d353"/>
      <stop offset="1" stop-color="#0e4429"/>
    </linearGradient>
    <linearGradient id="barGradDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f4877"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <clipPath id="chartClip"><rect x="20" y="60" width="760" height="152"/></clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="480" rx="8" fill="url(#bg)"/>

  <!-- Header -->
  <text x="24" y="28" font-size="14" font-weight="700" fill="#f0f6fc">Live GitHub Stats</text>
  <text x="776" y="28" font-size="12" fill="#8b949e" text-anchor="end">July 6, 2026</text>
  <line x1="24" y1="44" x2="776" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- =========== ZONE 2: Contribution Rhythm (monthly bars) =========== -->
  <text x="24" y="66" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="0.5">CONTRIBUTIONS · past 12 months</text>
  <text x="776" y="66" font-size="10" fill="#6e7681" text-anchor="end">by month · peak 2014 in June</text>

  <!-- Baseline -->
  <line x1="24" y1="196" x2="776" y2="196" stroke="#30363d" stroke-width="1"/>
  <!-- Faint mid gridline (represents ~1007, half of peak) -->
  <line x1="24" y1="144" x2="776" y2="144" stroke="#21262d" stroke-width="1" stroke-dasharray="2,3"/>

  <g clip-path="url(#chartClip)">
    <!-- Bar 0: Jul '25 (9) -->
    <rect x="24" y="194" width="44" height="2" fill="url(#barGradDim)" fill-opacity="0.55"/>
    <!-- Bar 1: Aug '25 (27) -->
    <rect x="83" y="194" width="44" height="2" fill="url(#barGradDim)" fill-opacity="0.55"/>
    <!-- Bar 2: Sep '25 (2) -->
    <rect x="142" y="194" width="44" height="2" fill="url(#barGradDim)" fill-opacity="0.55"/>
    <!-- Bar 3: Oct '25 (22) -->
    <rect x="201" y="194" width="44" height="2" fill="url(#barGradDim)" fill-opacity="0.55"/>
    <!-- Bar 4: Nov '25 (78) -->
    <rect x="260" y="192" width="44" height="4" fill="url(#barGradDim)" fill-opacity="0.7"/>
    <!-- Bar 5: Dec '25 (413) -->
    <rect x="319" y="174" width="44" height="22" fill="url(#barGrad)" fill-opacity="0.85"/>
    <!-- Bar 6: Jan '26 (1330) -->
    <rect x="378" y="127" width="44" height="69" fill="url(#barGrad)" fill-opacity="0.9"/>
    <!-- Bar 7: Feb '26 (1348) -->
    <rect x="437" y="126" width="44" height="70" fill="url(#barGrad)" fill-opacity="0.9"/>
    <!-- Bar 8: Mar '26 (891) -->
    <rect x="496" y="150" width="44" height="46" fill="url(#barGrad)" fill-opacity="0.9"/>
    <!-- Bar 9: Apr '26 (760) -->
    <rect x="555" y="156" width="44" height="40" fill="url(#barGrad)" fill-opacity="0.9"/>
    <!-- Bar 10: May '26 (1162) -->
    <rect x="614" y="135" width="44" height="61" fill="url(#barGrad)" fill-opacity="0.92"/>
    <!-- Bar 11: Jun '26 (2014) — peak -->
    <rect x="673" y="91" width="44" height="105" fill="url(#barGrad)" fill-opacity="1"/>
    <!-- Bar 12: Jul '26 (181, partial) -->
    <rect x="732" y="187" width="44" height="9" fill="url(#barGrad)" fill-opacity="0.75"/>

    <!-- Continuous glow-pulse on each bar top (SMIL, indefinite) -->
    <rect x="24" y="192" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.35;0" dur="7s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="83" y="192" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.35;0" dur="7s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="142" y="192" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.35;0" dur="7s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="201" y="192" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.35;0" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" y="190" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.4;0" dur="7s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="319" y="172" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="378" y="125" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="437" y="124" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="496" y="148" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="555" y="154" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.55;0" dur="7s" begin="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="614" y="133" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="4.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="673" y="89" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.75;0" dur="7s" begin="4.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="732" y="185" width="44" height="4" fill="#7cf58f" opacity="0.0">
      <animate attributeName="opacity" values="0;0.5;0" dur="7s" begin="4.8s" repeatCount="indefinite"/>
    </rect>

    <!-- Sweep highlight scans left-to-right forever -->
    <rect x="-140" y="60" width="140" height="140" fill="url(#sweep)">
      <animate attributeName="x" from="-140" to="780" dur="13s" repeatCount="indefinite"/>
    </rect>

    <!-- Peak marker dot above Jun bar -->
    <circle cx="695" cy="91" r="3" fill="#7cf58f">
      <animate attributeName="r" values="3;5;3" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.55;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Peak value label above Jun bar -->
  <text x="695" y="83" font-size="10" font-weight="600" fill="#7cf58f" text-anchor="middle">2014</text>

  <!-- Month labels below chart -->
  <text x="46" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Jul</text>
  <text x="105" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Aug</text>
  <text x="164" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Sep</text>
  <text x="223" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Oct</text>
  <text x="282" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Nov</text>
  <text x="341" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Dec</text>
  <text x="400" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Jan</text>
  <text x="459" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Feb</text>
  <text x="518" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Mar</text>
  <text x="577" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Apr</text>
  <text x="636" y="210" font-size="9" fill="#6e7681" text-anchor="middle">May</text>
  <text x="695" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Jun</text>
  <text x="754" y="210" font-size="9" fill="#6e7681" text-anchor="middle">Jul</text>
  <!-- Year dividers -->
  <text x="311" y="220" font-size="8" fill="#484f58" text-anchor="middle">2025</text>
  <text x="489" y="220" font-size="8" fill="#484f58" text-anchor="middle">2026</text>

  <!-- =========== ZONE 3: KPIs =========== -->
  <!-- Cell 1: Days Active donut gauge -->
  <circle cx="88" cy="278" r="42" fill="none" stroke="#21262d" stroke-width="12"/>
  <!-- Filled arc: 237/365 of circumference (circumference = 263.89); dash_on = 171.44, dash_off = 92.45 -->
  <circle cx="88" cy="278" r="42" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="171.44 92.45" transform="rotate(-90 88 278)">
    <animate attributeName="stroke-opacity" values="1;0.72;1" dur="4.3s" repeatCount="indefinite"/>
  </circle>
  <!-- Endpoint marker: arc endpoint at angle = -90 + 360*(237/365) = 143.75deg
       x = 88 + 42*cos(143.75) = 88 - 33.87 = 54.13
       y = 278 + 42*sin(143.75) = 278 + 24.83 = 302.83 -->
  <circle cx="54.13" cy="302.83" r="4" fill="#7cf58f">
    <animate attributeName="r" values="4;6;4" dur="2.7s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="1;0.55;1" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <!-- Value in donut center (font-size 22 → baseline offset ~7 to visually center on cy) -->
  <text x="88" y="285" font-size="22" font-weight="700" fill="url(#numGrad)" text-anchor="middle">237</text>

  <!-- Text right of donut -->
  <text x="148" y="264" font-size="13" font-weight="600" fill="#c9d1d9">Days Active</text>
  <text x="148" y="282" font-size="11" fill="#8b949e">of 365 days</text>
  <text x="148" y="298" font-size="10" fill="#6e7681">1 Year · 65% active</text>

  <!-- Cell 2: PRs Merged (big number) -->
  <text x="400" y="284" font-size="42" font-weight="700" fill="url(#numGrad)" text-anchor="middle">1709</text>
  <text x="400" y="306" font-size="12" font-weight="600" fill="#c9d1d9" text-anchor="middle">PRs Merged</text>
  <text x="400" y="322" font-size="10" fill="#8b949e" text-anchor="middle">All Time</text>

  <!-- Cell 3: Issues Closed -->
  <text x="649" y="284" font-size="42" font-weight="700" fill="url(#numGrad)" text-anchor="middle">87</text>
  <text x="649" y="306" font-size="12" font-weight="600" fill="#c9d1d9" text-anchor="middle">My Issues Closed</text>
  <text x="649" y="322" font-size="10" fill="#8b949e" text-anchor="middle">All Time</text>

  <!-- Vertical separators between KPI cells -->
  <line x1="278" y1="234" x2="278" y2="326" stroke="#21262d" stroke-width="1"/>
  <line x1="522" y1="234" x2="522" y2="326" stroke="#21262d" stroke-width="1"/>

  <!-- Divider between KPI row and distributions -->
  <line x1="24" y1="342" x2="776" y2="342" stroke="#21262d" stroke-width="1"/>

  <!-- =========== ZONE 4: Active Repos stacked bar =========== -->
  <!-- Caption: value + label left, meta right -->
  <text x="24" y="358" font-size="14" font-weight="700" fill="#f0f6fc">54</text>
  <text x="48" y="358" font-size="11" font-weight="600" fill="#c9d1d9">Active Repos</text>
  <text x="776" y="358" font-size="10" fill="#6e7681" text-anchor="end">top 6 by commits · 1 Year</text>

  <!-- Stacked bar (26 tall, y=366..392). Total=3326. bar_w=752, x0=24.
       oscilla-animator-v2 1701 → 384.55w, x=24
       cc-dump             439 → 99.26w,  x=408.55
       dotfiles            396 → 89.53w,  x=507.81
       slopspot-web        269 → 60.82w,  x=597.34
       links-issue-tracker 265 → 59.92w,  x=658.16
       cc-candybar         256 → 57.88w,  x=718.08 -->
  <rect x="24" y="366" width="384.55" height="26" fill="#58a6ff" fill-opacity="0.94"/>
  <rect x="408.55" y="366" width="99.26" height="26" fill="#39d353" fill-opacity="0.94"/>
  <rect x="507.81" y="366" width="89.53" height="26" fill="#f778ba" fill-opacity="0.94"/>
  <rect x="597.34" y="366" width="60.82" height="26" fill="#f0883e" fill-opacity="0.94"/>
  <rect x="658.16" y="366" width="59.92" height="26" fill="#a371f7" fill-opacity="0.94"/>
  <rect x="718.08" y="366" width="57.88" height="26" fill="#79c0ff" fill-opacity="0.94"/>

  <!-- Segment shimmer animations (perpetual) -->
  <rect x="24" y="366" width="384.55" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="11s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="408.55" y="366" width="99.26" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="11s" begin="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="507.81" y="366" width="89.53" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="11s" begin="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="597.34" y="366" width="60.82" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="11s" begin="3.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="658.16" y="366" width="59.92" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="11s" begin="5.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="718.08" y="366" width="57.88" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="11s" begin="6.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Segment labels inside (only if segment >= ~60px wide) -->
  <!-- oscilla-animator-v2 fits in 384px -->
  <text x="216.28" y="383" font-size="11" font-weight="600" fill="#0d1117" text-anchor="middle">oscilla-animator-v2</text>
  <!-- cc-dump fits in 99px -->
  <text x="458.18" y="383" font-size="10" font-weight="600" fill="#0d1117" text-anchor="middle">cc-dump</text>
  <!-- dotfiles fits in 89px -->
  <text x="552.58" y="383" font-size="10" font-weight="600" fill="#0d1117" text-anchor="middle">dotfiles</text>
  <!-- slopspot fits abbreviated -->
  <text x="627.75" y="383" font-size="9" font-weight="600" fill="#0d1117" text-anchor="middle">slopspot</text>
  <!-- links-issue-tracker → "lit" -->
  <text x="688.12" y="383" font-size="9" font-weight="600" fill="#0d1117" text-anchor="middle">lit</text>
  <!-- cc-candybar → "candybar" -->
  <text x="747.02" y="383" font-size="9" font-weight="600" fill="#0d1117" text-anchor="middle">candybar</text>

  <!-- Sweep highlight over repos bar -->
  <rect x="-100" y="366" width="100" height="26" fill="url(#sweep)">
    <animate attributeName="x" from="-100" to="776" dur="19s" repeatCount="indefinite"/>
  </rect>

  <!-- =========== ZONE 5: Languages stacked bar =========== -->
  <text x="24" y="416" font-size="14" font-weight="700" fill="#f0f6fc">13</text>
  <text x="44" y="416" font-size="11" font-weight="600" fill="#c9d1d9">Languages</text>
  <text x="776" y="416" font-size="10" fill="#6e7681" text-anchor="end">top 8 by commits · All Time</text>

  <!-- Stacked bar y=424..450 (26 tall). Total=6133.
       TypeScript    3861 → 473.50w, x=24
       Python        1174 → 143.95w, x=497.50
       Go            504  → 61.79w,  x=641.45
       Shell         275  → 33.72w,  x=703.24
       HTML          129  → 15.82w,  x=736.96
       CoffeeScript  109  → 13.37w,  x=752.78
       JavaScript    66   → 8.10w,   x=766.15
       CSS           15   → 1.85w,   x=774.25 -->
  <rect x="24" y="424" width="473.50" height="26" fill="#3178c6" fill-opacity="0.95"/>
  <rect x="497.50" y="424" width="143.95" height="26" fill="#3572A5" fill-opacity="0.95"/>
  <rect x="641.45" y="424" width="61.79" height="26" fill="#00ADD8" fill-opacity="0.95"/>
  <rect x="703.24" y="424" width="33.72" height="26" fill="#89e051" fill-opacity="0.95"/>
  <rect x="736.96" y="424" width="15.82" height="26" fill="#e34c26" fill-opacity="0.95"/>
  <rect x="752.78" y="424" width="13.37" height="26" fill="#244776" fill-opacity="0.95"/>
  <rect x="766.15" y="424" width="8.10" height="26" fill="#f1e05a" fill-opacity="0.95"/>
  <rect x="774.25" y="424" width="1.85" height="26" fill="#c9d1d9" fill-opacity="0.95"/>

  <!-- Segment shimmer animations -->
  <rect x="24" y="424" width="473.50" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="13s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="497.50" y="424" width="143.95" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="13s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="641.45" y="424" width="61.79" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="13s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="703.24" y="424" width="33.72" height="26" fill="#ffffff" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0;0.16;0" dur="13s" begin="4.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Language labels inside segments (font 10pt at ~5px/char): show only where they fit -->
  <text x="260.75" y="441" font-size="11" font-weight="600" fill="#f0f6fc" text-anchor="middle">TypeScript</text>
  <text x="569.48" y="441" font-size="11" font-weight="600" fill="#f0f6fc" text-anchor="middle">Python</text>
  <text x="672.35" y="441" font-size="10" font-weight="600" fill="#0d1117" text-anchor="middle">Go</text>
  <text x="720.10" y="441" font-size="9" font-weight="600" fill="#0d1117" text-anchor="middle">Shell</text>

  <!-- Sweep highlight over languages bar -->
  <rect x="-100" y="424" width="100" height="26" fill="url(#sweep)">
    <animate attributeName="x" from="-100" to="776" dur="23s" repeatCount="indefinite"/>
