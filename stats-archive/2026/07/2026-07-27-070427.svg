<svg width="800" height="308" viewBox="0 0 800 308" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live GitHub stats">
  <defs>
    <linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ff5e0"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="158" x2="0" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4aa3ff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#48beff"/>
      <stop offset="1" stop-color="#7ff5e0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64ffda" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#64ffda" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff5e0"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <clipPath id="chartClip">
      <rect x="22" y="66" width="744" height="96"/>
    </clipPath>
    <clipPath id="streakFillClip">
      <rect x="605" y="230" width="35.95" height="10" rx="2"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="800" height="308" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="307" rx="10" fill="#11161d" stroke="#21262d" stroke-width="1"/>

  <!-- header -->
  <circle cx="26" cy="26" r="4" fill="#64ffda">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3" font-weight="600">Live GitHub Stats</text>
  <text x="780" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9aa4b2" text-anchor="end">Updated July 27, 2026</text>
  <line x1="20" y1="44" x2="780" y2="44" stroke="#21262d" stroke-width="1"/>

  <!-- chart caption + axis note -->
  <text x="20" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">Contributions, past 12 months &#183; weekly</text>
  <text x="780" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="end">peak week 605</text>

  <!-- baseline line for chart -->
  <line x1="24" y1="158.5" x2="764" y2="158.5" stroke="#21262d" stroke-width="1"/>

  <!-- weekly bars (53 weeks, height proportional to that week's total contributions; max week = 605 = 90px) -->
  <g clip-path="url(#chartClip)" fill="url(#barGrad)">
    <rect x="24" y="156.7" width="12" height="1.3"/>
    <rect x="38" y="156.1" width="12" height="1.9"/>
    <rect x="52" y="156.7" width="12" height="1.3"/>
    <rect x="80" y="156.5" width="12" height="1.5"/>
    <rect x="108" y="156.5" width="12" height="1.5"/>
    <rect x="150" y="157.4" width="12" height="0.6"/>
    <rect x="164" y="156.5" width="12" height="1.5"/>
    <rect x="178" y="157.3" width="12" height="0.7"/>
    <rect x="192" y="156.5" width="12" height="1.5"/>
    <rect x="206" y="156.4" width="12" height="1.6"/>
    <rect x="220" y="155.2" width="12" height="2.8"/>
    <rect x="234" y="150.6" width="12" height="7.4"/>
    <rect x="248" y="157.4" width="12" height="0.6"/>
    <rect x="262" y="156.5" width="12" height="1.5"/>
    <rect x="276" y="157.3" width="12" height="0.7"/>
    <rect x="290" y="153.1" width="12" height="4.9"/>
    <rect x="304" y="143.7" width="12" height="14.3"/>
    <rect x="318" y="122.6" width="12" height="35.4"/>
    <rect x="332" y="151.3" width="12" height="6.7"/>
    <rect x="346" y="139.3" width="12" height="18.7"/>
    <rect x="360" y="121.9" width="12" height="36.1"/>
    <rect x="374" y="83.2"  width="12" height="74.8"/>
    <rect x="388" y="90.2"  width="12" height="67.8"/>
    <rect x="402" y="104.9" width="12" height="53.1"/>
    <rect x="416" y="122.1" width="12" height="35.9"/>
    <rect x="430" y="116.8" width="12" height="41.2"/>
    <rect x="444" y="87.6"  width="12" height="70.4"/>
    <rect x="458" y="131.7" width="12" height="26.3"/>
    <rect x="472" y="104.7" width="12" height="53.3"/>
    <rect x="486" y="131.1" width="12" height="26.9"/>
    <rect x="500" y="137.5" width="12" height="20.5"/>
    <rect x="514" y="146.4" width="12" height="11.6"/>
    <rect x="528" y="134.9" width="12" height="23.1"/>
    <rect x="542" y="131.1" width="12" height="26.9"/>
    <rect x="556" y="132.7" width="12" height="25.3"/>
    <rect x="570" y="123.5" width="12" height="34.5"/>
    <rect x="584" y="108.6" width="12" height="49.4"/>
    <rect x="598" y="141.9" width="12" height="16.1"/>
    <rect x="612" y="131.8" width="12" height="26.2"/>
    <rect x="626" y="92.2"  width="12" height="65.8"/>
    <rect x="640" y="100.3" width="12" height="57.7"/>
    <rect x="654" y="76.8"  width="12" height="81.2"/>
    <rect x="668" y="86.9"  width="12" height="71.1"/>
    <rect x="682" y="68.0"  width="12" height="90.0"/>
    <rect x="696" y="136.7" width="12" height="21.3"/>
    <rect x="710" y="119.8" width="12" height="38.2"/>
    <rect x="724" y="153.8" width="12" height="4.2"/>
    <rect x="738" y="147.3" width="12" height="10.7"/>
    <rect x="752" y="148.3" width="12" height="9.7"/>

    <!-- perpetual scan sweep across the chart -->
    <rect x="0" y="66" width="70" height="94" fill="url(#scanGrad)">
      <animate attributeName="x" from="-70" to="770" dur="19s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- divider under chart -->
  <line x1="20" y1="180" x2="780" y2="180" stroke="#21262d" stroke-width="1"/>

  <!-- ============ PANEL 1: Active Repos ============ -->
  <text x="113" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#numGrad)" text-anchor="middle">55</text>
  <!-- stacked bar of top-6 repos, widths proportional to commit counts (total 3421) -->
  <g>
    <rect x="33" y="230" width="160" height="10" fill="#161b22" rx="2"/>
    <rect x="33.00"  y="230" width="79.86" height="10" fill="#64ffda" rx="2">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="112.86" y="230" width="20.67" height="10" fill="#48beff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" begin="-0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="133.53" y="230" width="19.32" height="10" fill="#ffd479">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" begin="-1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="152.85" y="230" width="14.92" height="10" fill="#ff7eb6">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" begin="-2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="167.77" y="230" width="12.77" height="10" fill="#b392f0">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" begin="-3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="180.54" y="230" width="12.46" height="10" fill="#ff9d5a" rx="2">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" begin="-4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="113" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Active Repos</text>
  <text x="113" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9aa4b2" text-anchor="middle">1 Year</text>

  <!-- ============ PANEL 2: Commits (66) with 7-day activity sparkline ============ -->
  <text x="304" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#numGrad)" text-anchor="middle">66</text>
  <!-- 7 bars = past 7 days of daily contributions (context for a 7-day count); max in the window = 48 = 12px -->
  <g fill="#64ffda">
    <rect x="264" y="248.5" width="8" height="1.5" rx="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="5.5s" begin="-0.0s" repeatCount="indefinite"/></rect>
    <rect x="276" y="249.0" width="8" height="1.0" rx="1" opacity="0.3"/>
    <rect x="288" y="249.0" width="8" height="1.0" rx="1" opacity="0.3"/>
    <rect x="300" y="249.0" width="8" height="1.0" rx="1" opacity="0.3"/>
    <rect x="312" y="243.0" width="8" height="7.0" rx="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="5.5s" begin="-1.1s" repeatCount="indefinite"/></rect>
    <rect x="324" y="238.0" width="8" height="12.0" rx="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="5.5s" begin="-2.2s" repeatCount="indefinite"/></rect>
    <rect x="336" y="245.75" width="8" height="4.25" rx="1"><animate attributeName="opacity" values="0.6;1;0.6" dur="5.5s" begin="-3.3s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="264" y1="250.5" x2="344" y2="250.5" stroke="#30363d" stroke-width="0.5"/>
  <text x="304" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Commits</text>
  <text x="304" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9aa4b2" text-anchor="middle">7 Days</text>

  <!-- ============ PANEL 3: Languages ============ -->
  <text x="494" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#numGrad)" text-anchor="middle">9</text>
  <!-- stacked bar of 8 languages by commit-count share (total 5808); tiny slivers preserved for honesty -->
  <g>
    <rect x="414" y="230" width="160" height="10" fill="#161b22" rx="2"/>
    <rect x="414.00" y="230" width="108.51" height="10" fill="#3178c6" rx="2">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="-0.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="522.51" y="230" width="31.96" height="10" fill="#ffd847">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="-1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="554.47" y="230" width="15.37" height="10" fill="#00ADD8">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="-2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="569.84" y="230" width="2.01" height="10" fill="#89e051">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="-3.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="571.85" y="230" width="1.63" height="10" fill="#e34c26">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="-4.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="573.48" y="230" width="0.30" height="10" fill="#a371f7"/>
    <rect x="573.78" y="230" width="0.19" height="10" fill="#f1e05a"/>
    <rect x="573.97" y="230" width="0.06" height="10" fill="#c39bd3" rx="2"/>
  </g>
  <text x="494" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Languages</text>
  <text x="494" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9aa4b2" text-anchor="middle">1 Year</text>

  <!-- ============ PANEL 4: Longest Streak (82 days of a 365-day year) ============ -->
  <text x="685" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#numGrad)" text-anchor="middle">82</text>
  <g>
    <!-- track = full year (365) -->
    <rect x="605" y="230" width="160" height="10" fill="#161b22" rx="2"/>
    <!-- filled portion = the 82-day streak = 35.95px = 82/365 of the track -->
    <rect x="605" y="230" width="35.95" height="10" fill="url(#streakGrad)" rx="2"/>
    <!-- pulse traveling along the filled portion, clipped to the streak region -->
    <g clip-path="url(#streakFillClip)">
      <rect x="0" y="230" width="16" height="10" fill="#ffffff" opacity="0.55">
        <animate attributeName="x" from="591" to="641" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- monthly tick marks along the full year track (every ~30 days) -->
    <g fill="#30363d">
      <rect x="618.15" y="228" width="0.6" height="2"/><rect x="618.15" y="240" width="0.6" height="2"/>
      <rect x="631.30" y="228" width="0.6" height="2"/><rect x="631.30" y="240" width="0.6" height="2"/>
      <rect x="644.45" y="228" width="0.6" height="2"/><rect x="644.45" y="240" width="0.6" height="2"/>
      <rect x="657.60" y="228" width="0.6" height="2"/><rect x="657.60" y="240" width="0.6" height="2"/>
      <rect x="670.75" y="228" width="0.6" height="2"/><rect x="670.75" y="240" width="0.6" height="2"/>
      <rect x="683.90" y="228" width="0.6" height="2"/><rect x="683.90" y="240" width="0.6" height="2"/>
      <rect x="697.05" y="228" width="0.6" height="2"/><rect x="697.05" y="240" width="0.6" height="2"/>
      <rect x="710.21" y="228" width="0.6" height="2"/><rect x="710.21" y="240" width="0.6" height="2"/>
      <rect x="723.36" y="228" width="0.6" height="2"/><rect x="723.36" y="240" width="0.6" height="2"/>
      <rect x="736.51" y="228" width="0.6" height="2"/><rect x="736.51" y="240" width="0.6" height="2"/>
      <rect x="749.66" y="228" width="0.6" height="2"/><rect x="749.66" y="240" width="0.6" height="2"/>
      <rect x="762.81" y="228" width="0.6" height="2"/><rect x="762.81" y="240" width="0.6" height="2"/>
    </g>
    <!-- endcap marker at streak tip -->
    <circle cx="640.95" cy="235" r="3.5" fill="#7ff5e0">
      <animate attributeName="r" values="3;4.5;3" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="685" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Longest Streak</text>
  <text x="685" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#9aa4b2" text-anchor="middle">1 Year</text>
</svg>
