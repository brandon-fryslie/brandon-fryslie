<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live GitHub stats for brandon-fryslie on 2026-02-24: past 12 months of monthly contributions climbing from a quiet spring into a 1428-event peak in February 2026; 2475 commits in 1 Year, 95 PRs merged All Time, 9 issues closed in 1 Year, 3 active repos in 7 Days led by oscilla-animator-v2 with 350 commits.">
