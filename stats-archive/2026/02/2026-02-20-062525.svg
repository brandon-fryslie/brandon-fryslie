      <rect x="689.32" y="86"  width="10" height="90"  fill="url(#streakGrad)"/>
      <rect x="703.43" y="80"  width="10" height="96"  fill="url(#streakGrad)"/>
      <rect x="717.55" y="76"  width="10" height="100" fill="url(#streakGrad)"/>
      <rect x="731.66" y="145" width="10" height="31"  fill="url(#streakGrad)"/>
      <rect x="745.77" y="135" width="10" height="41"  fill="url(#streakGrad)"/>
      <rect x="759.89" y="150" width="10" height="26"  fill="url(#streakGrad)"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4.7s" repeatCount="indefinite"/>
    </g>

    <!-- Moving highlight sweep (continuous motion) -->
    <rect x="-80" y="76" width="80" height="100" fill="url(#sweepGrad)">
      <animate attributeName="x" from="-80" to="880" dur="13s" repeatCount="indefinite"/>
    </rect>
