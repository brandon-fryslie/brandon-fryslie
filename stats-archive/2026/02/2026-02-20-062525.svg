<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Live GitHub Stats">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6a8"/>
      <stop offset="1" stop-color="#f0883e"/>
    </linearGradient>
    <linearGradient id="daysGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="340" fill="#0d1117"/>

  <!-- Header -->
  <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">Live GitHub Stats</text>
  <text x="776" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681" text-anchor="end">brandon-fryslie · Feb 20, 2026</text>
  <line x1="20" y1="48" x2="780" y2="48" stroke="#21262d" stroke-width="1" opacity="0.7"/>

