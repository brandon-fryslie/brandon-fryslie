  <text x="280" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#c9d1d9">Languages</text>
  <text x="280" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">All Time</text>
  <rect x="280.00" y="272" width="129.03" height="5" fill="#3178c6"/>
  <rect x="409.03" y="272" width="47.93"  height="5" fill="#ffd43b"/>
  <rect x="456.96" y="272" width="19.45"  height="5" fill="#89e051"/>
  <rect x="476.41" y="272" width="18.46"  height="5" fill="#00add8"/>
  <rect x="494.87" y="272" width="9.02"   height="5" fill="#6d84c9"/>
  <rect x="503.89" y="272" width="5.79"   height="5" fill="#e34c26"/>
  <rect x="509.68" y="272" width="5.21"   height="5" fill="#f1e05a"/>
  <rect x="514.89" y="272" width="1.11"   height="5" fill="#c8302f"/>

  <!-- Tile C: Active Repos — stacked breakdown bar (segments sized by commit share) -->
  <!-- Repo counts (7 days): cc-dump 100 · oscilla-animator-v2 79 · brandon-fryslie 21 = 200. Segments of 236: 118.00 · 93.22 · 24.78 -->
  <text x="536" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#58a6ff">3</text>
  <text x="536" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#c9d1d9">Active Repos</text>
  <text x="536" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">7 Days</text>
  <rect x="536.00" y="272" width="118.00" height="5" fill="#f78166"/>
  <rect x="654.00" y="272" width="93.22"  height="5" fill="#a371f7"/>
  <rect x="747.22" y="272" width="24.78"  height="5" fill="#3fb950"/>

  <!-- Row 2: scalar metrics, inline (value · label · period) -->
  <!-- Longest Streak — color matches the streak-highlighted bars above -->
  <text x="24"  y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffa657">43</text>
  <text x="58"  y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Longest Streak</text>
  <text x="153" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">· 1 Year</text>

  <text x="280" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#58a6ff">2610</text>
  <text x="341" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">Commits</text>
  <text x="392" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">· All Time</text>

  <text x="536" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#58a6ff">1</text>
  <text x="557" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#c9d1d9">My Issues Closed</text>
  <text x="665" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">· 30 Days</text>
