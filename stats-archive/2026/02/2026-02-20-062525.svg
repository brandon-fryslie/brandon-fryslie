    <rect x="40.11" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="110.68" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="124.79" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="138.91" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="153.02" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="167.13" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="251.81" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="294.15" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="421.17" y="175" width="10" height="1" fill="#21262d"/>
    <rect x="449.40" y="175" width="10" height="1" fill="#21262d"/>

    <!-- Active non-streak bars (weeks 0..45) -->
    <rect x="26.00"  y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="54.23"  y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="68.34"  y="172" width="10" height="4"  fill="url(#barGrad)"/>
    <rect x="82.45"  y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="96.57"  y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="181.25" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="195.36" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="209.47" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="223.59" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="237.70" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="265.92" y="173" width="10" height="3"  fill="url(#barGrad)"/>
    <rect x="280.04" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="308.26" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="322.38" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="336.49" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="350.60" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="364.72" y="173" width="10" height="3"  fill="url(#barGrad)"/>
    <rect x="378.83" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="392.94" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="407.06" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="435.28" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="463.51" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="477.62" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="491.74" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="505.85" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="519.96" y="174" width="10" height="2"  fill="url(#barGrad)"/>
    <rect x="534.08" y="173" width="10" height="3"  fill="url(#barGrad)"/>
    <rect x="548.19" y="170" width="10" height="6"  fill="url(#barGrad)"/>
    <rect x="562.30" y="168" width="10" height="8"  fill="url(#barGrad)"/>
    <rect x="576.42" y="174" width="10" height="2"  fill="url(#barGrad)"/>
