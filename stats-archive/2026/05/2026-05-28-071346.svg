<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="calFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a7f3d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c674"/>
      <stop offset="1" stop-color="#8f6b1a"/>
    </linearGradient>
    <clipPath id="calClip"><rect x="24" y="60" width="752" height="76"/></clipPath>
    <clipPath id="langClip"><rect x="190" y="234" width="116" height="20" rx="3"/></clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="340" fill="#0d1117"/>

  <!-- Header -->
  <text x="24" y="26" font-size="14" font-weight="600" fill="#e6edf3">Live GitHub Stats</text>
  <text x="776" y="26" font-size="12" fill="#8b949e" text-anchor="end">May 28, 2026</text>
  <line x1="24" y1="36" x2="776" y2="36" stroke="#30363d"/>
  <text x="776" y="52" font-size="10" fill="#8b949e" text-anchor="end">past 12 months</text>

  <!-- Calendar spine: 53 weekly totals as filled area chart -->
  <g clip-path="url(#calClip)">
    <path d="M 24,134 L 24,132.9 L 38.5,133.0 L 52.9,133.9 L 67.4,132.3 L 81.9,133.9 L 96.3,134 L 110.8,133.9 L 125.2,133.8 L 139.7,133.4 L 154.2,133.5 L 168.6,132.2 L 183.1,133.1 L 197.5,133.9 L 212.0,133.9 L 226.5,134 L 240.9,133.9 L 255.4,134 L 269.9,133.9 L 284.3,133.6 L 298.8,133.8 L 313.2,133.4 L 327.7,133.1 L 342.2,132.9 L 356.6,130.8 L 371.1,128.7 L 385.5,133.6 L 400.0,133.5 L 414.5,132.6 L 428.9,128.4 L 443.4,120.0 L 457.8,106.0 L 472.3,131.7 L 486.8,105.6 L 501.2,85.1 L 515.7,79.4 L 530.1,75.3 L 544.6,111.9 L 559.1,109.4 L 573.5,64.0 L 588.0,103.1 L 602.5,96.1 L 616.9,108.1 L 631.4,106.5 L 645.8,126.2 L 660.3,113.0 L 674.8,125.5 L 689.2,111.3 L 703.7,103.8 L 718.2,101.6 L 732.6,109.4 L 747.1,117.2 L 761.5,91.4 L 776,121 L 776,134 Z" fill="url(#calFill)"/>
    <polyline points="24,132.9 38.5,133.0 52.9,133.9 67.4,132.3 81.9,133.9 96.3,134 110.8,133.9 125.2,133.8 139.7,133.4 154.2,133.5 168.6,132.2 183.1,133.1 197.5,133.9 212.0,133.9 226.5,134 240.9,133.9 255.4,134 269.9,133.9 284.3,133.6 298.8,133.8 313.2,133.4 327.7,133.1 342.2,132.9 356.6,130.8 371.1,128.7 385.5,133.6 400.0,133.5 414.5,132.6 428.9,128.4 443.4,120.0 457.8,106.0 472.3,131.7 486.8,105.6 501.2,85.1 515.7,79.4 530.1,75.3 544.6,111.9 559.1,109.4 573.5,64.0 588.0,103.1 602.5,96.1 616.9,108.1 631.4,106.5 645.8,126.2 660.3,113.0 674.8,125.5 689.2,111.3 703.7,103.8 718.2,101.6 732.6,109.4 747.1,117.2 761.5,91.4 776,121" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Sweep highlight travels left-to-right forever -->
    <rect x="-90" y="60" width="90" height="76" fill="url(#sweep)">
      <animate attributeName="x" from="-90" to="800" dur="17s" repeatCount="indefinite"/>
    </rect>
    <!-- Baseline -->
    <line x1="24" y1="134" x2="776" y2="134" stroke="#30363d" stroke-width="0.5"/>
    <!-- Peak marker pulses at the year's high week (573.5, 64) -->
    <circle cx="573.5" cy="64" r="2.5" fill="#a7f3d0">
      <animate attributeName="r" values="2.5;5.5;2.5" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="24" y1="150" x2="776" y2="150" stroke="#21262d"/>

  <!-- =============== METRIC PANELS =============== -->

  <!-- Panel 1: Days Active 29 / 30 — semicircular gauge -->
  <g>
    <circle cx="96" cy="248" r="34" fill="none" stroke="#21262d" stroke-width="6"/>
    <!-- Filled arc: 29/30 * 360 = 348 degrees clockwise from top -->
    <path d="M 96,214 A 34,34 0 1 1 88.93,214.74" fill="none" stroke="#3fb950" stroke-width="6" stroke-linecap="round"/>
    <!-- Shimmer chasing along the filled arc -->
    <path d="M 96,214 A 34,34 0 1 1 88.93,214.74" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 200" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-214" dur="11s" repeatCount="indefinite"/>
    </path>
    <text x="96" y="257" font-size="26" font-weight="700" fill="#3fb950" text-anchor="middle">29</text>
    <text x="96" y="306" font-size="12" fill="#c9d1d9" text-anchor="middle">Days Active</text>
    <text x="96" y="322" font-size="10" fill="#8b949e" text-anchor="middle">30 Days</text>
  </g>

  <!-- Panel 2: Languages 10 — horizontal stacked bar sized by lines per language -->
  <g>
    <text x="248" y="222" font-size="26" font-weight="700" fill="#58a6ff" text-anchor="middle">10</text>
    <g clip-path="url(#langClip)">
      <rect x="190" y="234" width="79.19" height="20" fill="#3178c6"/>
      <rect x="269.19" y="234" width="25.03" height="20" fill="#3572A5"/>
      <rect x="294.22" y="234" width="9.66" height="20" fill="#00ADD8"/>
      <rect x="303.88" y="234" width="1.61" height="20" fill="#89e051"/>
      <rect x="305.49" y="234" width="0.29" height="20" fill="#563d7c"/>
      <rect x="305.78" y="234" width="0.08" height="20" fill="#e34c26"/>
      <rect x="305.86" y="234" width="0.08" height="20" fill="#f1e05a"/>
      <rect x="305.94" y="234" width="0.06" height="20" fill="#844FBA"/>
      <!-- Sheen sweeps across the bar -->
      <rect x="150" y="234" width="30" height="20" fill="url(#sheen)">
        <animate attributeName="x" from="150" to="336" dur="11s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- Dominant-language legend under bar -->
    <text x="192" y="270" font-size="9" fill="#79b8ff" font-weight="600">TS</text>
    <text x="272" y="270" font-size="9" fill="#8ab4d8" font-weight="600">Py</text>
    <text x="248" y="306" font-size="12" fill="#c9d1d9" text-anchor="middle">Languages</text>
    <text x="248" y="322" font-size="10" fill="#8b949e" text-anchor="middle">1 Year</text>
  </g>

  <!-- Panel 3: Active Repos 8 — six vertical bars sized by per-repo commit counts -->
  <g>
    <text x="400" y="210" font-size="24" font-weight="700" fill="#d29922" text-anchor="middle">8</text>
    <!-- Bars: slopspot-web 50, tmux-control-mode-js 39, promptctl 32, rich-js 26, cc-candybar 25, links-issue-tracker 24 -->
    <rect x="348" y="222" width="14" height="62" fill="url(#barGold)" rx="1">
      <animate attributeName="opacity" values="1;0.75;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="366" y="235.6" width="14" height="48.4" fill="url(#barGold)" rx="1">
      <animate attributeName="opacity" values="1;0.75;1" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="384" y="244.3" width="14" height="39.7" fill="url(#barGold)" rx="1">
      <animate attributeName="opacity" values="1;0.75;1" dur="13s" repeatCount="indefinite"/>
    </rect>
    <rect x="402" y="251.8" width="14" height="32.2" fill="url(#barGold)" rx="1">
      <animate attributeName="opacity" values="1;0.75;1" dur="17s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="253" width="14" height="31" fill="url(#barGold)" rx="1">
      <animate attributeName="opacity" values="1;0.75;1" dur="19s" repeatCount="indefinite"/>
    </rect>
    <rect x="438" y="254.2" width="14" height="29.8" fill="url(#barGold)" rx="1">
      <animate attributeName="opacity" values="1;0.75;1" dur="23s" repeatCount="indefinite"/>
    </rect>
    <!-- Baseline -->
    <line x1="346" y1="284.5" x2="454" y2="284.5" stroke="#30363d" stroke-width="0.5"/>
    <text x="400" y="306" font-size="12" fill="#c9d1d9" text-anchor="middle">Active Repos</text>
    <text x="400" y="322" font-size="10" fill="#8b949e" text-anchor="middle">7 Days</text>
  </g>

  <!-- Panel 4: Commits 4646 — 30-day sparkline of contribution activity -->
  <g>
    <text x="552" y="210" font-size="26" font-weight="700" fill="#79c0ff" text-anchor="middle">4646</text>
    <!-- Baseline -->
    <line x1="490" y1="282" x2="614" y2="282" stroke="#30363d" stroke-width="0.5"/>
    <!-- Base line -->
    <polyline points="490,262.9 494.3,260.7 498.6,273.4 502.8,282 507.1,254.3 511.4,261.6 515.7,259.3 519.9,260.2 524.2,265.2 528.5,261.1 532.8,261.6 537.0,277.9 541.3,275.2 545.6,282 549.9,275.2 554.1,276.1 558.4,272.9 562.7,265.7 567.0,277.0 571.2,268.4 575.5,276.6 579.8,281.1 584.1,254.8 588.3,263.4 592.6,272.9 596.9,228 601.2,243.4 605.5,272.9 609.7,254.8 614,261.1" fill="none" stroke="#1f6feb" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Chasing dash overlay -->
    <polyline points="490,262.9 494.3,260.7 498.6,273.4 502.8,282 507.1,254.3 511.4,261.6 515.7,259.3 519.9,260.2 524.2,265.2 528.5,261.1 532.8,261.6 537.0,277.9 541.3,275.2 545.6,282 549.9,275.2 554.1,276.1 558.4,272.9 562.7,265.7 567.0,277.0 571.2,268.4 575.5,276.6 579.8,281.1 584.1,254.8 588.3,263.4 592.6,272.9 596.9,228 601.2,243.4 605.5,272.9 609.7,254.8 614,261.1" fill="none" stroke="#a5d6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 260">
      <animate attributeName="stroke-dashoffset" from="0" to="-278" dur="7s" repeatCount="indefinite"/>
    </polyline>
    <!-- Peak marker at index 25 (value 119) -->
    <circle cx="596.9" cy="228" r="2.5" fill="#a5d6ff">
      <animate attributeName="r" values="2.5;5;2.5" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="552" y="306" font-size="12" fill="#c9d1d9" text-anchor="middle">Commits</text>
    <text x="552" y="322" font-size="10" fill="#8b949e" text-anchor="middle">All Time</text>
  </g>

  <!-- Panel 5: PRs Merged 736 — donut ring filled by 736/4646 share of commits -->
  <g>
    <circle cx="704" cy="248" r="30" fill="none" stroke="#21262d" stroke-width="6"/>
    <!-- Filled arc: 736/4646 = 15.84% * 360 = 57 degrees -->
    <path d="M 704,218 A 30,30 0 0 1 729.17,231.68" fill="none" stroke="#ff7b72" stroke-width="6" stroke-linecap="round"/>
    <!-- Orbiting spark -->
    <g>
      <circle cx="704" cy="218" r="2.5" fill="#ffa198"/>
      <animateTransform attributeName="transform" type="rotate" from="0 704 248" to="360 704 248" dur="9s" repeatCount="indefinite"/>
    </g>
    <text x="704" y="255" font-size="20" font-weight="700" fill="#ff7b72" text-anchor="middle">736</text>
    <text x="704" y="306" font-size="12" fill="#c9d1d9" text-anchor="middle">PRs Merged</text>
    <text x="704" y="322" font-size="10" fill="#8b949e" text-anchor="middle">All Time</text>
  </g>
</svg>
