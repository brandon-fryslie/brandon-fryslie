<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Live GitHub stats">
  <defs>
    <linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#a5f3a2"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a020"/>
      <stop offset="1" stop-color="#f4c260"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brickScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee787" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <pattern id="streakStripes" width="8" height="14" patternUnits="userSpaceOnUse">
      <rect width="8" height="14" fill="url(#streakGrad)"/>
      <path d="M -4 14 L 4 0 M 0 14 L 8 0 M 4 14 L 12 0" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.28"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="8 0" dur="1.4s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="brickClip"><rect x="581" y="140" width="152" height="70" rx="1"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="800" height="250" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="249" rx="10" fill="#11161d" stroke="#1f2a37" stroke-width="1"/>

  <!-- header -->
  <circle cx="30" cy="26" r="3.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3" font-weight="600">Live GitHub Stats</text>
  <text x="776" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681" text-anchor="end">May 29, 2026</text>
  <text x="42" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">a year of commits — past 12 months</text>
  <line x1="24" y1="54" x2="776" y2="54" stroke="#1f2a37" stroke-width="1"/>

  <!-- panel dividers -->
  <line x1="278" y1="66" x2="278" y2="236" stroke="#1f2a37" stroke-width="1" opacity="0.6"/>
  <line x1="522" y1="66" x2="522" y2="236" stroke="#1f2a37" stroke-width="1" opacity="0.6"/>

  <!-- ============================================================ -->
  <!-- PANEL A: Days Active — arc gauge, sweep = 212/365 of full circle -->
  <!-- Circumference 2π*52 = 326.73;  filled length = 326.73 * 212/365 = 189.75 -->
  <!-- ============================================================ -->

  <!-- 12 monthly reference ticks around the ring (outside the arc) -->
  <g stroke="#1f2a37" stroke-width="1">
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(0 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(30 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(60 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(90 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(120 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(150 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(180 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(210 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(240 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(270 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(300 156 130)"/>
    <line x1="156" y1="66" x2="156" y2="71" transform="rotate(330 156 130)"/>
  </g>

  <!-- background ring -->
  <circle cx="156" cy="130" r="52" fill="none" stroke="#1f2a37" stroke-width="12"/>

  <!-- filled arc (fraction of year) — starts at top, sweeps clockwise -->
  <circle cx="156" cy="130" r="52" fill="none" stroke="url(#arcGrad)" stroke-width="12"
          stroke-dasharray="189.75 326.73" stroke-linecap="round"
          transform="rotate(-90 156 130)"/>

  <!-- a bright shimmer that orbits the ring, perpetual motion -->
  <g transform="translate(156 130)">
    <circle cx="0" cy="-52" r="3.5" fill="#a5f3a2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-52" r="1.8" fill="#ffffff" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- endpoint marker at end of filled arc (angle 209.1° from top clockwise) -->
  <circle cx="130.7" cy="175.5" r="4.5" fill="#7ee787">
    <animate attributeName="r" values="4.5;6;4.5" dur="2.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130.7" cy="175.5" r="2" fill="#ffffff"/>

  <!-- center number: THE value -->
  <text x="156" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="url(#numGrad)" font-weight="700" text-anchor="middle">212</text>
  <text x="156" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">of 365 days</text>

  <!-- panel A footer -->
  <text x="156" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle" font-weight="600">Days Active</text>
  <text x="156" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">1 Year</text>

  <!-- ============================================================ -->
  <!-- PANEL B: Longest Streak — 365-unit-year track with 82 consecutive lit -->
  <!-- Track x=302..498 (196px wide = 365 days). Highlight width = 196*82/365 = 44.05 -->
  <!-- Streak placed in last third of the year, its approximate real location -->
  <!-- ============================================================ -->

  <!-- big value above track -->
  <text x="400" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="url(#numGrad)" font-weight="700" text-anchor="middle">82</text>
  <text x="400" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">consecutive days</text>

  <!-- year track (represents 365 days) -->
  <rect x="302" y="145" width="196" height="16" rx="3" fill="#1a212b" stroke="#242c37" stroke-width="1"/>

  <!-- dim daily grid marks inside the track (every ~30 days, subtle) -->
  <g stroke="#242c37" stroke-width="0.5" opacity="0.7">
    <line x1="318.33" y1="146" x2="318.33" y2="160"/>
    <line x1="334.67" y1="146" x2="334.67" y2="160"/>
    <line x1="351.00" y1="146" x2="351.00" y2="160"/>
    <line x1="367.33" y1="146" x2="367.33" y2="160"/>
    <line x1="383.67" y1="146" x2="383.67" y2="160"/>
    <line x1="400.00" y1="146" x2="400.00" y2="160"/>
    <line x1="416.33" y1="146" x2="416.33" y2="160"/>
    <line x1="432.67" y1="146" x2="432.67" y2="160"/>
    <line x1="449.00" y1="146" x2="449.00" y2="160"/>
    <line x1="465.33" y1="146" x2="465.33" y2="160"/>
    <line x1="481.67" y1="146" x2="481.67" y2="160"/>
  </g>

  <!-- highlighted streak: 44.05px wide (82/365 of 196), placed at ~65% into year -->
  <rect x="429.4" y="145" width="44.05" height="16" rx="3" fill="url(#streakStripes)"/>
  <!-- soft outer glow (via opaque outline stroke) -->
  <rect x="429.4" y="145" width="44.05" height="16" rx="3" fill="none" stroke="#f0a020" stroke-width="1" opacity="0.9"/>

  <!-- streak breathing pulse (subtle) -->
  <rect x="429.4" y="145" width="44.05" height="16" rx="3" fill="#f0a020" opacity="0.0">
    <animate attributeName="opacity" values="0;0.25;0" dur="4.7s" repeatCount="indefinite"/>
  </rect>

  <!-- month tick marks below track (12 dividers = 13 marks) -->
  <g stroke="#8b949e" stroke-width="0.7" opacity="0.6">
    <line x1="302.00" y1="163" x2="302.00" y2="167"/>
    <line x1="318.33" y1="163" x2="318.33" y2="166"/>
    <line x1="334.67" y1="163" x2="334.67" y2="166"/>
    <line x1="351.00" y1="163" x2="351.00" y2="166"/>
    <line x1="367.33" y1="163" x2="367.33" y2="166"/>
    <line x1="383.67" y1="163" x2="383.67" y2="166"/>
    <line x1="400.00" y1="163" x2="400.00" y2="167"/>
    <line x1="416.33" y1="163" x2="416.33" y2="166"/>
    <line x1="432.67" y1="163" x2="432.67" y2="166"/>
    <line x1="449.00" y1="163" x2="449.00" y2="166"/>
    <line x1="465.33" y1="163" x2="465.33" y2="166"/>
    <line x1="481.67" y1="163" x2="481.67" y2="166"/>
    <line x1="498.00" y1="163" x2="498.00" y2="167"/>
  </g>

  <!-- endpoint date labels: year window -->
  <text x="302" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#6e7681" text-anchor="start">May '25</text>
  <text x="498" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#6e7681" text-anchor="end">May '26</text>

  <!-- panel B footer -->
  <text x="400" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle" font-weight="600">Longest Streak</text>
  <text x="400" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">1 Year</text>

  <!-- ============================================================ -->
  <!-- PANEL C: Commits — brick stack (each brick = 100 commits) -->
  <!-- 41 full bricks + 1 partial (11% filled) = 4111. Grid 6 rows × 7 cols. -->
  <!-- Grid rooted at x=581, y=140. Brick 20w×10h, gap 2. Row 6 (top) has partial. -->
  <!-- ============================================================ -->

  <!-- big value above grid -->
  <text x="657" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="url(#numGrad)" font-weight="700" text-anchor="middle">4111</text>
  <text x="657" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">each brick = 100 commits</text>

  <!-- 42 brick cells: bottom-up, left-to-right (n=1..42). Partial at n=42. -->
  <g>
    <!-- Row 5 (bottom, y=200): bricks 1-7 -->
    <rect x="581" y="200" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="603" y="200" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="625" y="200" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="647" y="200" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="669" y="200" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="691" y="200" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="713" y="200" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <!-- Row 4 (y=188): bricks 8-14 -->
    <rect x="581" y="188" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="603" y="188" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="625" y="188" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="647" y="188" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="669" y="188" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="691" y="188" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="713" y="188" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <!-- Row 3 (y=176): bricks 15-21 -->
    <rect x="581" y="176" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="603" y="176" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="625" y="176" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="647" y="176" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="669" y="176" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="691" y="176" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="713" y="176" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <!-- Row 2 (y=164): bricks 22-28 -->
    <rect x="581" y="164" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="603" y="164" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="625" y="164" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="647" y="164" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="669" y="164" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="691" y="164" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="713" y="164" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <!-- Row 1 (y=152): bricks 29-35 -->
    <rect x="581" y="152" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="603" y="152" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="625" y="152" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="647" y="152" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="669" y="152" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="691" y="152" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="713" y="152" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <!-- Row 0 (top, y=140): bricks 36-41 full, brick 42 partial -->
    <rect x="581" y="140" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="603" y="140" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="625" y="140" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="647" y="140" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="669" y="140" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <rect x="691" y="140" width="20" height="10" rx="1" fill="url(#brickGrad)"/>
    <!-- brick 42 = 11 commits → 11% of a 10-height brick = 1.1px fill from bottom -->
    <rect x="713" y="140" width="20" height="10" rx="1" fill="#1a212b" stroke="#242c37" stroke-width="0.5"/>
    <rect x="713" y="148.9" width="20" height="1.1" rx="0.5" fill="url(#brickGrad)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- brick scanline: perpetual light-band travels bottom-to-top through grid -->
  <g clip-path="url(#brickClip)">
    <rect x="581" y="0" width="152" height="14" fill="url(#brickScan)">
      <animate attributeName="y" values="210;140;140" keyTimes="0;0.85;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.85;1" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- panel C footer -->
  <text x="657" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle" font-weight="600">Commits</text>
  <text x="657" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">1 Year</text>
</svg>
