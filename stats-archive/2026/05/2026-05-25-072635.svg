<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live GitHub stats">
  <defs>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#a5d6ff"/>
    </linearGradient>
    <linearGradient id="streakGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#ffb464"/>
    </linearGradient>
    <symbol id="colDim" overflow="visible">
      <rect x="0" y="0" width="5" height="5" rx="1" fill="#21262d"/>
      <rect x="0" y="6" width="5" height="5" rx="1" fill="#21262d"/>
      <rect x="0" y="12" width="5" height="5" rx="1" fill="#21262d"/>
      <rect x="0" y="18" width="5" height="5" rx="1" fill="#21262d"/>
      <rect x="0" y="24" width="5" height="5" rx="1" fill="#21262d"/>
      <rect x="0" y="30" width="5" height="5" rx="1" fill="#21262d"/>
      <rect x="0" y="36" width="5" height="5" rx="1" fill="#21262d"/>
    </symbol>
    <symbol id="colLit" overflow="visible">
      <rect x="0" y="0" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="6" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="12" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="18" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="24" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="30" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="36" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
    </symbol>
    <symbol id="colPartial" overflow="visible">
      <rect x="0" y="0" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="6" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="12" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="18" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="24" width="5" height="5" rx="1" fill="url(#streakGlow)"/>
      <rect x="0" y="30" width="5" height="5" rx="1" fill="#21262d"/>
      <rect x="0" y="36" width="5" height="5" rx="1" fill="#21262d"/>
