      <circle cx="0" cy="4" r="1.3" fill="#d2a8ff"/>
      <circle cx="0" cy="8" r="1.3" fill="#d2a8ff"/>
      <circle cx="0" cy="12" r="1.3" fill="#d2a8ff"/>
      <circle cx="0" cy="16" r="1.3" fill="#d2a8ff"/>
      <circle cx="0" cy="20" r="1.3" fill="#d2a8ff"/>
      <circle cx="0" cy="24" r="1.3" fill="#d2a8ff"/>
      <circle cx="0" cy="28" r="1.3" fill="#d2a8ff"/>
      <circle cx="0" cy="32" r="1.3" fill="#d2a8ff"/>
