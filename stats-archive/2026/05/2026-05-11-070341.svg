    <line x1="732" y1="186" x2="768" y2="150" stroke="#0d1117" stroke-width="0.75" opacity="0.6"/>
    <line x1="737" y1="186" x2="768" y2="155" stroke="#0d1117" stroke-width="0.75" opacity="0.6"/>
