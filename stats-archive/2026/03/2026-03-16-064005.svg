<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c0ff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79c0ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.4;1.0;-0.4" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.0;1.4;0.0" dur="11s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="repoSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.4;1.0;-0.4" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.0;1.4;0.0" dur="13s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="chartClip">
      <rect x="22" y="130" width="756" height="106"/>
    </clipPath>
    <clipPath id="barClip">
      <rect x="22" y="258" width="756" height="26" rx="3"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="340" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="339" fill="none" stroke="#21262d" stroke-width="1" rx="6"/>

  <!-- header -->
  <text x="22" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9" font-weight="600">brandon-fryslie &#183; a year in commits</text>
  <text x="778" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681" text-anchor="end">March 16, 2026</text>
  <line x1="22" y1="42" x2="778" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- three big metric callouts. each value is its own standalone <text> element. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="150" y="82" font-size="34" fill="#58a6ff" font-weight="700" text-anchor="middle">2848</text>
    <text x="150" y="102" font-size="11" fill="#8b949e" text-anchor="middle">Commits &#183; 1 Year</text>

    <text x="400" y="82" font-size="34" fill="#3fb950" font-weight="700" text-anchor="middle">32</text>
    <text x="400" y="102" font-size="11" fill="#8b949e" text-anchor="middle">Issues Closed &#183; 1 Year</text>

    <text x="650" y="82" font-size="34" fill="#d29922" font-weight="700" text-anchor="middle">34</text>
    <text x="650" y="102" font-size="11" fill="#8b949e" text-anchor="middle">Active Repos &#183; 1 Year</text>
  </g>

  <!-- chart section header -->
  <text x="22" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">weekly contributions &#183; past 12 months</text>
  <text x="778" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="end">peak week 605 &#183; latest week 171</text>

  <!-- chart baseline -->
  <line x1="22" y1="232" x2="778" y2="232" stroke="#21262d" stroke-width="1"/>

  <!-- 52 weekly bars, chronological. h = weekly-sum &#215; (94/605). zero weeks omitted; nonzero
       weeks floored at 1px so a week-with-activity is still readable against a quiet week. -->
  <g clip-path="url(#chartClip)">
    <rect x="38" y="230.1" width="11" height="1.9" fill="url(#barFill)"/>
    <rect x="52" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="66" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="136" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="150" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="178" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="192" y="230.4" width="11" height="1.6" fill="url(#barFill)"/>
    <rect x="206" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="234" y="229.7" width="11" height="2.3" fill="url(#barFill)"/>
    <rect x="276" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="290" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="304" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="318" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="332" y="228.6" width="11" height="3.4" fill="url(#barFill)"/>
    <rect x="360" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="374" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="402" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="444" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="458" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="472" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="486" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="500" y="230.3" width="11" height="1.7" fill="url(#barFill)"/>
    <rect x="514" y="229.0" width="11" height="3.0" fill="url(#barFill)"/>
    <rect x="528" y="224.2" width="11" height="7.8" fill="url(#barFill)"/>
    <rect x="542" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="556" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="570" y="231.0" width="11" height="1.0" fill="url(#barFill)"/>
    <rect x="584" y="227.8" width="11" height="4.2" fill="url(#barFill)"/>
    <rect x="598" y="218.8" width="11" height="13.2" fill="url(#barFill)"/>
    <rect x="612" y="205.9" width="11" height="26.1" fill="url(#barFill)"/>
    <rect x="626" y="211.8" width="11" height="20.2" fill="url(#barFill)"/>
    <rect x="640" y="212.7" width="11" height="19.3" fill="url(#barFill)"/>
    <rect x="654" y="202.8" width="11" height="29.2" fill="url(#barFill)"/>
    <rect x="668" y="159.8" width="11" height="72.2" fill="url(#barFill)"/>
    <rect x="682" y="152.6" width="11" height="79.4" fill="url(#barFill)"/>
    <rect x="696" y="171.4" width="11" height="60.6" fill="url(#barFill)"/>
    <rect x="710" y="212.1" width="11" height="19.9" fill="url(#barFill)"/>
    <rect x="724" y="191.5" width="11" height="40.5" fill="url(#barFill)"/>
    <rect x="738" y="138.0" width="11" height="94.0" fill="url(#barFill)"/>
    <!-- current week: gold, breathing -->
    <rect x="752" y="205.4" width="11" height="26.6" fill="#d29922" opacity="0.92">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- sweep highlight (perpetual) -->
    <rect x="22" y="130" width="756" height="106" fill="url(#sweep)"/>
  </g>

  <!-- pulsing dot above current week bar -->
  <circle cx="757.5" cy="200.5" r="2.6" fill="#f0f6fc" stroke="#d29922" stroke-width="1">
    <animate attributeName="r" values="2.6;4.8;2.6" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- month ticks below chart -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8.5" fill="#484f58">
    <text x="71.5" y="244" text-anchor="middle">Apr</text>
    <text x="197.5" y="244" text-anchor="middle">Jun</text>
    <text x="309.5" y="244" text-anchor="middle">Aug</text>
    <text x="435.5" y="244" text-anchor="middle">Oct</text>
    <text x="561.5" y="244" text-anchor="middle">Dec</text>
    <text x="687.5" y="244" text-anchor="middle">Feb</text>
  </g>

  <!-- repo breakdown proportional bar. widths encode each repo's share of 2848 total commits -->
  <text x="22" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">commits per repo &#183; segment width = share of 2848</text>

  <g clip-path="url(#barClip)">
    <!-- oscilla-animator-v2: 1615 / 2848 = 56.7% (428.7px) -->
    <rect x="22" y="258" width="428.7" height="26" fill="#58a6ff" opacity="0.92">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- cc-dump: 434 / 2848 = 15.2% (115.2px) -->
    <rect x="450.7" y="258" width="115.2" height="26" fill="#3fb950" opacity="0.92">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="8s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <!-- oscilla-animator: 227 / 2848 = 8.0% (60.3px) -->
    <rect x="565.9" y="258" width="60.3" height="26" fill="#d29922" opacity="0.92">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="9s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <!-- chaperone-auth-gateway: 188 / 2848 = 6.6% (49.9px) -->
    <rect x="626.2" y="258" width="49.9" height="26" fill="#f778ba" opacity="0.92">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="10s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- dotfiles: 161 / 2848 = 5.7% (42.7px) -->
    <rect x="676.1" y="258" width="42.7" height="26" fill="#a5a5ff" opacity="0.92">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <!-- brandon-fryslie: 144 / 2848 = 5.1% (38.2px) -->
    <rect x="718.8" y="258" width="38.2" height="26" fill="#79c0ff" opacity="0.92">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="12s" begin="2.0s" repeatCount="indefinite"/>
    </rect>
    <!-- other 28 repos: 79 / 2848 = 2.8% (21px) -->
    <rect x="757.0" y="258" width="21.0" height="26" fill="#484f58" opacity="0.92">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="13s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <!-- inline label in the dominant segment -->
    <text x="236.4" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0d1117" font-weight="700" text-anchor="middle">oscilla-animator-v2 &#183; 1615</text>
    <text x="508.3" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#0d1117" font-weight="700" text-anchor="middle">cc-dump &#183; 434</text>
    <!-- highlight sweep across repo bar -->
    <rect x="22" y="258" width="756" height="26" fill="url(#repoSweep)"/>
  </g>

  <!-- legend row for the narrow segments -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#8b949e">
    <rect x="22" y="293" width="6" height="6" fill="#d29922"/>
    <text x="31" y="299">oscilla-animator 227</text>
    <rect x="155" y="293" width="6" height="6" fill="#f778ba"/>
    <text x="164" y="299">chaperone-auth-gateway 188</text>
    <rect x="325" y="293" width="6" height="6" fill="#a5a5ff"/>
    <text x="334" y="299">dotfiles 161</text>
    <rect x="418" y="293" width="6" height="6" fill="#79c0ff"/>
    <text x="427" y="299">brandon-fryslie 144</text>
    <rect x="545" y="293" width="6" height="6" fill="#484f58"/>
    <text x="554" y="299">other 28 repos 79</text>
  </g>

  <!-- bottom caption -->
  <text x="22" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">bar heights encode weekly commits; the year&#8217;s late eruption is the shape itself</text>
  <text x="778" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681" text-anchor="end">gold bar = current week</text>
</svg>
