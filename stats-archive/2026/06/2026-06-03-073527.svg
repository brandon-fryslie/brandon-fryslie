      <rect x="612" y="262" width="126" height="6" rx="2" fill="#3178c6"/>
      <text x="775" y="269" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">497</text>

      <text x="538" y="287" font-size="9" fill="#8b949e">Python</text>
