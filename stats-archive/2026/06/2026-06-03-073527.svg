      <rect x="292" y="139" width="10" height="1"  fill="#0e4429"/>
      <rect x="304" y="139" width="10" height="1"  fill="#0e4429"/>
      <rect x="316" y="139" width="10" height="1"  fill="#0e4429"/>
      <rect x="328" y="138" width="10" height="2"  fill="#0e4429"/>
      <rect x="340" y="137" width="10" height="3"  fill="#0e4429"/>
      <rect x="352" y="132" width="10" height="8"  fill="#006d32"/>
      <rect x="364" y="139" width="10" height="1"  fill="#0e4429"/>
      <rect x="376" y="139" width="10" height="1"  fill="#0e4429"/>
      <rect x="388" y="139" width="10" height="1"  fill="#0e4429"/>
      <rect x="400" y="135" width="10" height="5"  fill="#0e4429"/>
      <rect x="412" y="125" width="10" height="15" fill="#006d32"/>
