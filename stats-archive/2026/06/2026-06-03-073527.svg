      <text x="281" y="269" font-size="9" fill="#8b949e">oscilla-animator-v2</text>
      <rect x="384" y="262" width="104" height="6" rx="2" fill="#58a6ff"/>
      <text x="515" y="269" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">1649</text>

      <text x="281" y="284" font-size="9" fill="#8b949e">cc-dump</text>
      <rect x="384" y="277" width="27.7" height="6" rx="2" fill="#58a6ff" fill-opacity="0.85"/>
      <text x="515" y="284" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">439</text>

      <text x="281" y="299" font-size="9" fill="#8b949e">dotfiles</text>
      <rect x="384" y="292" width="18.1" height="6" rx="2" fill="#58a6ff" fill-opacity="0.75"/>
      <text x="515" y="299" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">287</text>

      <text x="281" y="314" font-size="9" fill="#8b949e">oscilla-animator</text>
      <rect x="384" y="307" width="14.3" height="6" rx="2" fill="#58a6ff" fill-opacity="0.7"/>
      <text x="515" y="314" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">227</text>

      <text x="281" y="329" font-size="9" fill="#8b949e">chaperone-auth-gw</text>
      <rect x="384" y="322" width="11.9" height="6" rx="2" fill="#58a6ff" fill-opacity="0.6"/>
      <text x="515" y="329" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">188</text>

      <text x="281" y="344" font-size="9" fill="#8b949e">cc-candybar</text>
      <rect x="384" y="337" width="11.5" height="6" rx="2" fill="#58a6ff" fill-opacity="0.55"/>
      <text x="515" y="344" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">183</text>
    </g>

