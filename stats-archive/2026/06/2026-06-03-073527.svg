      <stop offset="0" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#79c0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepDim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26a641"/>
      <stop offset="1" stop-color="#39d353"/>
