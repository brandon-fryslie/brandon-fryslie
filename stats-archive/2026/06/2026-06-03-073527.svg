    <!-- gauge circumference = 2*pi*44 = 276.46; fill fraction 214/365 -> dash = 162.10 -->
    <circle cx="140" cy="272" r="44" fill="none" stroke="#21262d" stroke-width="8"/>
    <circle cx="140" cy="272" r="44" fill="none" stroke="url(#gaugeGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="162.10 276.46" transform="rotate(-90 140 272)"/>
    <!-- rotating dashed decorative ring, keeps the gauge continually alive -->
    <circle cx="140" cy="272" r="52" fill="none" stroke="#58a6ff" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="0 140 272" to="360 140 272" dur="23s" repeatCount="indefinite"/>
    </circle>
    <!-- small counter-rotating inner dash ring -->
    <circle cx="140" cy="272" r="34" fill="none" stroke="#58a6ff" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="1 5">
      <animateTransform attributeName="transform" type="rotate" from="360 140 272" to="0 140 272" dur="31s" repeatCount="indefinite"/>
    </circle>
    <text x="140" y="283" font-size="30" font-weight="700" fill="#58a6ff" text-anchor="middle">214</text>
    <text x="140" y="302" font-size="10" fill="#8b949e" text-anchor="middle">of 365 days</text>
    <text x="140" y="336" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">Days Active</text>
    <text x="140" y="350" font-size="10" fill="#8b949e" text-anchor="middle">1 Year</text>

