      <text x="538" y="305" font-size="9" fill="#8b949e">Go</text>
      <rect x="612" y="298" width="19.0" height="6" rx="2" fill="#00add8"/>
      <text x="775" y="305" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">75</text>

      <text x="538" y="323" font-size="9" fill="#8b949e">Shell</text>
      <rect x="612" y="316" width="4.1" height="6" rx="2" fill="#89e051"/>
      <text x="775" y="323" font-size="9" font-weight="600" fill="#f0f6fc" text-anchor="end">16</text>

