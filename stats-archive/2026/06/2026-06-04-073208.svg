    </rect>
  </g>
  <!-- Quarter tick marks -->
  <line x1="67.5"  y1="256" x2="67.5"  y2="270" stroke="#484f58" stroke-width="0.5" opacity="0.6"/>
  <line x1="111"   y1="256" x2="111"   y2="270" stroke="#484f58" stroke-width="0.5" opacity="0.6"/>
  <line x1="154.5" y1="256" x2="154.5" y2="270" stroke="#484f58" stroke-width="0.5" opacity="0.6"/>

  <text x="24"  y="286" font-size="10" fill="#7d8590">of 365 possible days</text>
  <text x="198" y="286" font-size="10" fill="#7d8590" text-anchor="end">59%</text>

