  <!-- Panel 3: Languages — 13 with breakdown top 8 -->
  <!-- ============================================================ -->
  <text x="412" y="220" font-size="28" font-weight="700" fill="#a371f7">13</text>
  <text x="452" y="214" font-size="12" fill="#e6edf3">Languages</text>
  <text x="452" y="230" font-size="10" fill="#7d8590">All Time</text>

  <!-- Stacked 100% bar, x=412..586 (width 174), y=250, h=12 -->
  <!-- total=5145. segments: TS 3177 (107.44), Py 1045 (35.34), Go 399 (13.49), Sh 254 (8.59), CS 109 (3.69), HTML 82 (2.77), JS 64 (2.16), CSS 15 (0.51) -->
  <rect x="412"    y="250" width="107.44" height="12" fill="#3178c6"><animate attributeName="opacity" values="0.8;1;0.8" dur="7s" begin="0s" repeatCount="indefinite"/></rect>
  <rect x="519.44" y="250" width="35.34"  height="12" fill="#3572a5"><animate attributeName="opacity" values="0.8;1;0.8" dur="11s" begin="0.3s" repeatCount="indefinite"/></rect>
  <rect x="554.78" y="250" width="13.49"  height="12" fill="#00add8"><animate attributeName="opacity" values="0.8;1;0.8" dur="13s" begin="0.6s" repeatCount="indefinite"/></rect>
  <rect x="568.27" y="250" width="8.59"   height="12" fill="#89e051"><animate attributeName="opacity" values="0.8;1;0.8" dur="7s" begin="0.9s" repeatCount="indefinite"/></rect>
  <rect x="576.86" y="250" width="3.69"   height="12" fill="#244776"><animate attributeName="opacity" values="0.8;1;0.8" dur="11s" begin="1.2s" repeatCount="indefinite"/></rect>
  <rect x="580.55" y="250" width="2.77"   height="12" fill="#e34c26"><animate attributeName="opacity" values="0.8;1;0.8" dur="13s" begin="1.5s" repeatCount="indefinite"/></rect>
  <rect x="583.32" y="250" width="2.16"   height="12" fill="#f1e05a"><animate attributeName="opacity" values="0.8;1;0.8" dur="7s" begin="1.8s" repeatCount="indefinite"/></rect>
  <rect x="585.48" y="250" width="0.52"   height="12" fill="#563d7c"><animate attributeName="opacity" values="0.8;1;0.8" dur="11s" begin="2.1s" repeatCount="indefinite"/></rect>
  <rect x="412" y="250" width="174" height="12" rx="2" fill="none" stroke="#484f58" stroke-width="0.5" opacity="0.7"/>

  <!-- Legend: 2 cols × 4 rows, col_w=87 -->
  <g font-size="9" fill="#7d8590">
    <rect x="412" y="272" width="6" height="6" rx="1" fill="#3178c6"/><text x="422" y="278">TypeScript</text>
    <rect x="499" y="272" width="6" height="6" rx="1" fill="#244776"/><text x="509" y="278">CoffeeScript</text>
    <rect x="412" y="285" width="6" height="6" rx="1" fill="#3572a5"/><text x="422" y="291">Python</text>
    <rect x="499" y="285" width="6" height="6" rx="1" fill="#e34c26"/><text x="509" y="291">HTML</text>
    <rect x="412" y="298" width="6" height="6" rx="1" fill="#00add8"/><text x="422" y="304">Go</text>
    <rect x="499" y="298" width="6" height="6" rx="1" fill="#f1e05a"/><text x="509" y="304">JavaScript</text>
    <rect x="412" y="311" width="6" height="6" rx="1" fill="#89e051"/><text x="422" y="317">Shell</text>
    <rect x="499" y="311" width="6" height="6" rx="1" fill="#563d7c"/><text x="509" y="317">CSS</text>
  </g>

  <!-- ============================================================ -->
  <!-- Panel 4: Longest Streak — 82 days in a year -->
  <!-- ============================================================ -->
