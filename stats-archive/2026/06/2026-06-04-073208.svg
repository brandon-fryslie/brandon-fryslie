  <rect x="312" y="252" width="76" height="6" rx="1.5" fill="#161b22"/>
  <rect x="312" y="252" width="76" height="6" rx="1.5" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="392" y="258" font-size="9" fill="#7d8590">1649</text>

  <!-- Row 2: cc-dump = 439 (bar 20.24) -->
  <text x="306" y="269" font-size="9" fill="#7d8590" text-anchor="end">cc-dump</text>
  <rect x="312" y="263" width="76" height="6" rx="1.5" fill="#161b22"/>
  <rect x="312" y="263" width="20.24" height="6" rx="1.5" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="11s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
  <text x="392" y="269" font-size="9" fill="#7d8590">439</text>

