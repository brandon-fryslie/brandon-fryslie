  <text x="306" y="280" font-size="9" fill="#7d8590" text-anchor="end">dotfiles</text>
  <rect x="312" y="274" width="76" height="6" rx="1.5" fill="#161b22"/>
  <rect x="312" y="274" width="13.55" height="6" rx="1.5" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="13s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="392" y="280" font-size="9" fill="#7d8590">294</text>

  <!-- Row 4: oscilla-animator = 227 (bar 10.46) -->
  <text x="306" y="291" font-size="9" fill="#7d8590" text-anchor="end">oscilla-animator</text>
  <rect x="312" y="285" width="76" height="6" rx="1.5" fill="#161b22"/>
  <rect x="312" y="285" width="10.46" height="6" rx="1.5" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="392" y="291" font-size="9" fill="#7d8590">227</text>

  <!-- Row 5: cc-candybar = 195 (bar 8.99) -->
  <text x="306" y="302" font-size="9" fill="#7d8590" text-anchor="end">cc-candybar</text>
  <rect x="312" y="296" width="76" height="6" rx="1.5" fill="#161b22"/>
  <rect x="312" y="296" width="8.99" height="6" rx="1.5" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="11s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="392" y="302" font-size="9" fill="#7d8590">195</text>

  <!-- Row 6: links-issue-tracker = 190 (bar 8.76) -->
  <text x="306" y="313" font-size="9" fill="#7d8590" text-anchor="end">links-issue-tracker</text>
  <rect x="312" y="307" width="76" height="6" rx="1.5" fill="#161b22"/>
  <rect x="312" y="307" width="8.76" height="6" rx="1.5" fill="#58a6ff" opacity="0.9">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="13s" begin="2.0s" repeatCount="indefinite"/>
  </rect>
  <text x="392" y="313" font-size="9" fill="#7d8590">190</text>

