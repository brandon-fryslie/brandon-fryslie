  <text x="646" y="214" font-size="12" fill="#e6edf3">Longest Streak</text>
  <text x="646" y="230" font-size="10" fill="#7d8590">1 Year</text>

  <!-- Timeline of the year with 82-day streak highlighted -->
  <!-- Bar x=606..776 (w=170), y=262, h=10 -->
  <!-- 82/365 = 22.5%, fill width = 170*0.2247 = 38.19 -->
  <rect x="606" y="262" width="170" height="10" rx="3" fill="#161b22" stroke="#484f58" stroke-width="0.75"/>
  <rect x="606" y="262" width="38.19" height="10" rx="3" fill="url(#streakFill)"/>
  <rect x="606" y="262" width="38.19" height="10" rx="3" fill="#e3b341" opacity="0.15">
    <animate attributeName="opacity" values="0.05;0.4;0.05" dur="3.7s" repeatCount="indefinite"/>
  </rect>
  <!-- Sheen across the streak bar -->
  <g clip-path="url(#streakBarClip)">
    <rect x="580" y="262" width="30" height="10" fill="url(#sheen)">
      <animate attributeName="x" from="580" to="646" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Quarter ticks on 365-day track -->
  <line x1="648.5" y1="262" x2="648.5" y2="272" stroke="#484f58" stroke-width="0.5" opacity="0.6"/>
  <line x1="691"   y1="262" x2="691"   y2="272" stroke="#484f58" stroke-width="0.5" opacity="0.6"/>
  <line x1="733.5" y1="262" x2="733.5" y2="272" stroke="#484f58" stroke-width="0.5" opacity="0.6"/>

  <text x="606" y="288" font-size="10" fill="#7d8590">consecutive days</text>
  <text x="776" y="288" font-size="10" fill="#7d8590" text-anchor="end">22% of year</text>

  <text x="606" y="316" font-size="9" fill="#484f58">longest unbroken run</text>
</svg>
