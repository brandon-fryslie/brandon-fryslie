  <!-- ============================================================ -->
  <text x="24" y="220" font-size="28" font-weight="700" fill="#3fb950">214</text>
  <text x="82" y="214" font-size="12" fill="#e6edf3">Days Active</text>
  <text x="82" y="230" font-size="10" fill="#7d8590">1 Year</text>

