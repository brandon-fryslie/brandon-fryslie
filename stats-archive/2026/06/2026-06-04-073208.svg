<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="peakBarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="daysFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="streakFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d29922" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="daysBarClip"><rect x="24" y="256" width="102.4" height="14" rx="4"/></clipPath>
    <clipPath id="streakBarClip"><rect x="606" y="262" width="39.15" height="10" rx="3"/></clipPath>
  </defs>

  <rect width="800" height="340" fill="#0d1117"/>

  <!-- Title bar -->
  <text x="24" y="26" font-size="14" font-weight="600" fill="#e6edf3">Live GitHub Stats</text>
  <text x="776" y="26" font-size="12" fill="#7d8590" text-anchor="end">Jun 4, 2026</text>
  <line x1="24" y1="40" x2="776" y2="40" stroke="#484f58" stroke-width="1" opacity="0.5"/>

  <!-- Section label -->
  <text x="24" y="54" font-size="10" fill="#7d8590">Contributions · past 12 months</text>
  <text x="776" y="54" font-size="10" fill="#7d8590" text-anchor="end">peak 30 days: 1,607</text>

  <!-- Baseline for bars -->
  <line x1="24" y1="160" x2="776" y2="160" stroke="#484f58" stroke-width="0.75" opacity="0.7"/>

  <!-- Faint horizontal gridlines at quartiles of 1607 -->
  <line x1="24" y1="135" x2="776" y2="135" stroke="#30363d" stroke-width="0.5" opacity="0.5" stroke-dasharray="2,3"/>
  <line x1="24" y1="110" x2="776" y2="110" stroke="#30363d" stroke-width="0.5" opacity="0.5" stroke-dasharray="2,3"/>
  <line x1="24" y1="85"  x2="776" y2="85"  stroke="#30363d" stroke-width="0.5" opacity="0.5" stroke-dasharray="2,3"/>
  <line x1="24" y1="60"  x2="776" y2="60"  stroke="#30363d" stroke-width="0.5" opacity="0.5" stroke-dasharray="2,3"/>

  <!-- 13 monthly bars: values [24, 12, 24, 2, 22, 78, 401, 1181, 1607, 887, 714, 1105, 369] scaled to max=1607, height=100 -->
  <g>
    <rect x="30"  y="158.5" width="44" height="1.5"   rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.7;1;0.7" dur="7s"  repeatCount="indefinite"/></rect>
    <rect x="88"  y="159.3" width="44" height="0.75"  rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.7;1;0.7" dur="11s" begin="0.4s" repeatCount="indefinite"/></rect>
    <rect x="146" y="158.5" width="44" height="1.5"   rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.7;1;0.7" dur="13s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="204" y="159.9" width="44" height="0.12"  rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.7;1;0.7" dur="7s"  begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="262" y="158.6" width="44" height="1.37"  rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.7;1;0.7" dur="11s" begin="1.6s" repeatCount="indefinite"/></rect>
    <rect x="320" y="155.1" width="44" height="4.85"  rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.7;1;0.7" dur="13s" begin="2.0s" repeatCount="indefinite"/></rect>
    <rect x="378" y="135"   width="44" height="24.95" rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="2.4s" repeatCount="indefinite"/></rect>
    <rect x="436" y="86.5"  width="44" height="73.49" rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.8;1;0.8" dur="11s" begin="2.8s" repeatCount="indefinite"/></rect>
    <rect x="494" y="60"    width="44" height="100"   rx="1" fill="url(#peakBarGrad)"><animate attributeName="opacity" values="0.85;1;0.85" dur="7s" begin="3.2s" repeatCount="indefinite"/></rect>
    <rect x="552" y="104.8" width="44" height="55.2"  rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.8;1;0.8" dur="13s" begin="3.6s" repeatCount="indefinite"/></rect>
    <rect x="610" y="115.6" width="44" height="44.4"  rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.8;1;0.8" dur="11s" begin="4.0s" repeatCount="indefinite"/></rect>
    <rect x="668" y="91.2"  width="44" height="68.76" rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.8;1;0.8" dur="7s"  begin="4.4s" repeatCount="indefinite"/></rect>
    <rect x="726" y="137"   width="44" height="22.96" rx="1" fill="url(#barGrad)"><animate attributeName="opacity" values="0.75;1;0.75" dur="13s" begin="4.8s" repeatCount="indefinite"/></rect>
