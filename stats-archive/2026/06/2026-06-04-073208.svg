    <text x="110" y="176">Jul</text>
    <text x="168" y="176">Aug</text>
    <text x="226" y="176">Sep</text>
    <text x="284" y="176">Oct</text>
    <text x="342" y="176">Nov</text>
    <text x="400" y="176">Dec</text>
    <text x="458" y="176">Jan</text>
    <text x="516" y="176">Feb</text>
    <text x="574" y="176">Mar</text>
    <text x="632" y="176">Apr</text>
    <text x="690" y="176">May</text>
    <text x="748" y="176">Jun</text>
