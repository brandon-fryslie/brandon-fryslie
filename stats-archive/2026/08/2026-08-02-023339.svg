<!-- concept: Twelve Months + Distribution — a 13-column monthly-aggregate bar chart is the hero
     (each bar = one month of the past 12; bar height ∝ that month's contribution total,
     peak Jun 2014 sets the ceiling); four scalar tiles below hold the day's numerals
     (133 · 10 · 87 · 181) as the loudest visual layer; a full-width horizontal
     proportional-segment bar at the base visualizes the Active Repos breakdown
     (each segment's WIDTH = that repo's share of the 118 commits across 6 repos).
     Distinct from yesterday's daily/weekly-ribbon + dot-grid arrangement in
     bin granularity, spine, and composition. -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="Live GitHub stats">
  <defs>
    <linearGradient id="numGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="partialGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f5f3ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5f3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="segSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chartClip"><rect x="30" y="48" width="740" height="160"/></clipPath>
    <clipPath id="segClip"><rect x="30" y="308" width="740" height="20"/></clipPath>
  </defs>

  <!-- CARD FRAME -->
  <rect width="800" height="340" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="339" rx="12" fill="#0f0d17" stroke="#241a3d"/>

  <!-- HEADER -->
  <circle cx="26" cy="22" r="3.5" fill="#a78bfa">
    <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Live GitHub Stats</text>
  <text x="780" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b7ca8" text-anchor="end">Updated August 02, 2026 · @brandon-fryslie</text>
  <line x1="20" y1="42" x2="780" y2="42" stroke="#241a3d" stroke-width="1"/>

  <!-- MONTHLY HERO CHART -->
  <text x="30" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">Contributions · past 12 months · bar height ∝ that month's total</text>
  <text x="770" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#a78bfa" text-anchor="end">8701 total · Jun 2014 peak</text>

  <!-- gridlines (dashed) at peak and mid; baseline solid -->
  <line x1="30" y1="185" x2="770" y2="185" stroke="#241a3d" stroke-width="1"/>
  <line x1="30" y1="120" x2="770" y2="120" stroke="#1a1230" stroke-width="1" stroke-dasharray="2 5"/>
  <line x1="30" y1="55"  x2="770" y2="55"  stroke="#1a1230" stroke-width="1" stroke-dasharray="2 5"/>
  <!-- Y-axis scale (left, dim) -->
  <text x="14" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#4a3670">0</text>
  <text x="14" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#4a3670">1K</text>
  <text x="14" y="58"  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#4a3670">2K</text>

  <!-- 13 monthly bars (Aug '25 → Aug '26). pitch=55, bar_w=44, x0=42, baseline y=185, peak height=130 -->
  <g clip-path="url(#chartClip)">
    <!-- Aug '25 = 24 -->
    <rect x="42"  y="182.50" width="44" height="2.50"   rx="1" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- Sep '25 = 2 -->
    <rect x="97"  y="182.50" width="44" height="2.50"   rx="1" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="11s" repeatCount="indefinite"/>
    </rect>
    <!-- Oct '25 = 22 -->
    <rect x="152" y="182.50" width="44" height="2.50"   rx="1" fill="url(#barGrad)">
