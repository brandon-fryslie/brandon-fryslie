  <text x="559" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">May</text>
  <text x="614" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#fde68a" text-anchor="middle">Jun</text>
  <text x="669" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">Jul</text>
  <text x="724" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">Aug 2d</text>

  <!-- divider -->
  <line x1="20" y1="212" x2="780" y2="212" stroke="#241a3d" stroke-width="1"/>

