  <text x="284" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">413</text>
  <text x="339" y="95"  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">1330</text>
  <text x="394" y="94"  font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">1348</text>
  <text x="449" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">891</text>
  <text x="504" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">760</text>
