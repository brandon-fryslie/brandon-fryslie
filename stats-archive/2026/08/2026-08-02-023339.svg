    </rect>
    <!-- Nov '25 = 78 -->
    <rect x="207" y="179.97" width="44" height="5.03"   rx="1" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
    <!-- Dec '25 = 413 -->
    <rect x="262" y="158.35" width="44" height="26.65"  rx="1.5" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.82;1;0.82" dur="11s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <!-- Jan '26 = 1330 -->
    <rect x="317" y="99.17"  width="44" height="85.83"  rx="1.5" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="13s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Feb '26 = 1348 -->
    <rect x="372" y="98.01"  width="44" height="86.99"  rx="1.5" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- Mar '26 = 891 -->
    <rect x="427" y="127.51" width="44" height="57.49"  rx="1.5" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.82;1;0.82" dur="11s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <!-- Apr '26 = 760 -->
    <rect x="482" y="135.96" width="44" height="49.04"  rx="1.5" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.82;1;0.82" dur="13s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <!-- May '26 = 1162 -->
    <rect x="537" y="110.02" width="44" height="74.98"  rx="1.5" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" begin="2.3s" repeatCount="indefinite"/>
    </rect>
    <!-- Jun '26 = 2014 (peak) -->
    <rect x="592" y="55.00"  width="44" height="130.00" rx="1.5" fill="url(#peakGrad)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="11s" repeatCount="indefinite"/>
    </rect>
    <!-- Jul '26 = 536 -->
    <rect x="647" y="150.41" width="44" height="34.59"  rx="1.5" fill="url(#barGrad)">
      <animate attributeName="opacity" values="0.82;1;0.82" dur="13s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <!-- Aug '26 partial (2 days) = 121 -->
    <rect x="702" y="177.19" width="44" height="7.81"   rx="1" fill="url(#partialGrad)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3.7s" repeatCount="indefinite"/>
    </rect>

    <!-- sweep highlight -->
    <rect x="-160" y="50" width="160" height="140" fill="url(#sweep)">
      <animate attributeName="x" from="-160" to="800" dur="17s" repeatCount="indefinite"/>
    </rect>
  </g>

