<!-- concept: year-in-three-views. calendar → weekly area chart (the arc of the year, peak
     week marked). days_active → filled ring-gauge (250/365 by geometry). active_repos →
     ranked horizontal bars sized by breakdown counts. prs_merged → peer scalar. shapes
     encode magnitude, proportion, distribution; digits confirm what the geometry says. -->
<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live GitHub stats">
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5eead4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6fffb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6fffb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6fffb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="barShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6fffb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="areaClip">
      <path d="M 32,168 L 32,167.6 46.2,164.8 60.3,168 74.5,167.9 88.6,167.9 102.8,167.9 116.9,168 131.1,168 145.2,167.9 159.4,167.6 173.5,167 187.7,167.9 201.9,167 216,165.1 230.2,160.4 244.3,167.4 258.5,167.6 272.6,167.3 286.8,164.6 300.9,158.7 315.1,149.3 329.2,140.5 343.4,164.8 357.5,129.9 371.7,101.5 385.9,107.3 400,99.2 414.2,151.7 428.3,136.5 442.5,73.8 456.6,145.3 470.8,114.9 484.9,142 499.1,143.3 513.2,157.2 527.4,145 541.5,156.6 555.7,140.4 569.9,123.8 584,130.6 598.2,147.4 612.3,143.4 626.5,111.7 640.6,101.5 654.8,96.8 668.9,96.3 683.1,72 697.2,151.5 711.4,137.2 725.5,156.5 739.7,158.4 753.8,148.1 768,148.9 L 768,168 Z"/>
    </clipPath>
    <clipPath id="barsClip">
      <rect x="228" y="208" width="90" height="82"/>
    </clipPath>
  </defs>

  <!-- card frame -->
  <rect width="800" height="340" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="339" rx="12" fill="#0f141b" stroke="#1f2b36"/>

  <!-- header -->
  <circle cx="28" cy="26" r="3.8" fill="#5eead4">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Live GitHub Stats</text>
  <text x="776" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681" text-anchor="end">August 01, 2026</text>

  <!-- area-chart section title -->
  <text x="24" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b95a1">Contributions · past 12 months</text>
  <text x="776" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5eead4" font-weight="600" text-anchor="end">8708 total · peak week 667 · peak day 213</text>

  <!-- baseline + subtle grid ticks -->
  <line x1="32" y1="120" x2="768" y2="120" stroke="#1f2b36" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <line x1="32" y1="168" x2="768" y2="168" stroke="#243241" stroke-width="1"/>

  <!-- filled area (weekly totals: each column is one week's height) -->
  <path d="M 32,168 L 32,167.6 46.2,164.8 60.3,168 74.5,167.9 88.6,167.9 102.8,167.9 116.9,168 131.1,168 145.2,167.9 159.4,167.6 173.5,167 187.7,167.9 201.9,167 216,165.1 230.2,160.4 244.3,167.4 258.5,167.6 272.6,167.3 286.8,164.6 300.9,158.7 315.1,149.3 329.2,140.5 343.4,164.8 357.5,129.9 371.7,101.5 385.9,107.3 400,99.2 414.2,151.7 428.3,136.5 442.5,73.8 456.6,145.3 470.8,114.9 484.9,142 499.1,143.3 513.2,157.2 527.4,145 541.5,156.6 555.7,140.4 569.9,123.8 584,130.6 598.2,147.4 612.3,143.4 626.5,111.7 640.6,101.5 654.8,96.8 668.9,96.3 683.1,72 697.2,151.5 711.4,137.2 725.5,156.5 739.7,158.4 753.8,148.1 768,148.9 L 768,168 Z" fill="url(#areaFill)"/>

  <!-- moving highlight sweep across the area, continuously -->
  <g clip-path="url(#areaClip)">
    <rect x="-260" y="72" width="260" height="96" fill="url(#sweep)">
      <animate attributeName="x" values="-260;800" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- area outline stroke -->
  <path d="M 32,167.6 L 46.2,164.8 60.3,168 74.5,167.9 88.6,167.9 102.8,167.9 116.9,168 131.1,168 145.2,167.9 159.4,167.6 173.5,167 187.7,167.9 201.9,167 216,165.1 230.2,160.4 244.3,167.4 258.5,167.6 272.6,167.3 286.8,164.6 300.9,158.7 315.1,149.3 329.2,140.5 343.4,164.8 357.5,129.9 371.7,101.5 385.9,107.3 400,99.2 414.2,151.7 428.3,136.5 442.5,73.8 456.6,145.3 470.8,114.9 484.9,142 499.1,143.3 513.2,157.2 527.4,145 541.5,156.6 555.7,140.4 569.9,123.8 584,130.6 598.2,147.4 612.3,143.4 626.5,111.7 640.6,101.5 654.8,96.8 668.9,96.3 683.1,72 697.2,151.5 711.4,137.2 725.5,156.5 739.7,158.4 753.8,148.1 768,148.9" fill="none" stroke="#7ff2dd" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>

  <!-- peak-week marker (week of Jun 19–25, 667 contributions) -->
  <line x1="683.1" y1="72" x2="683.1" y2="168" stroke="#5eead4" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.55"/>
  <circle cx="683.1" cy="72" r="3.6" fill="#e6fffb">
    <animate attributeName="r" values="3.6;5.8;3.6" dur="3.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="3.1s" repeatCount="indefinite"/>
  </circle>

  <!-- month tick labels along the axis -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#5f6f7e" text-anchor="middle">
    <text x="62.3" y="182">Aug</text>
    <text x="123.8" y="182">Sep</text>
    <text x="185.3" y="182">Oct</text>
    <text x="246.8" y="182">Nov</text>
    <text x="308.3" y="182">Dec</text>
    <text x="370.8" y="182">Jan</text>
    <text x="430.3" y="182">Feb</text>
    <text x="489.8" y="182">Mar</text>
    <text x="551.3" y="182">Apr</text>
    <text x="612.8" y="182">May</text>
    <text x="674.3" y="182">Jun</text>
    <text x="735.8" y="182">Jul</text>
  </g>

  <!-- divider -->
  <line x1="24" y1="198" x2="776" y2="198" stroke="#1f2b36" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- Column A: Active Repos — big scalar + ranked horizontal bars -->
  <!-- ============================================================ -->
  <!-- number stack (left half of column) -->
  <text x="100" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#num)" text-anchor="middle">17</text>
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9fb1c1" text-anchor="middle">Active Repos</text>
  <text x="100" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5f6f7e" text-anchor="middle">30 Days</text>

  <!-- 6 horizontal bars, sized by breakdown commit counts. max = 57 → 88px -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#8b95a1">
    <!-- row 1: links-issue-tracker 57 -->
    <text x="222" y="220" text-anchor="end">links-issue-tracker</text>
    <rect x="228" y="215.5" width="88" height="5" rx="1.5" fill="#5eead4" opacity="0.92"/>
    <text x="320" y="220" fill="#c9d2dc">57</text>
    <!-- row 2: laws 50 -->
    <text x="222" y="234" text-anchor="end">laws</text>
    <rect x="228" y="229.5" width="77" height="5" rx="1.5" fill="#4ed3c0" opacity="0.90"/>
    <text x="309" y="234" fill="#c9d2dc">50</text>
    <!-- row 3: tinkerpadai-web 34 -->
    <text x="222" y="248" text-anchor="end">tinkerpadai-web</text>
    <rect x="228" y="243.5" width="52" height="5" rx="1.5" fill="#3fb9a8" opacity="0.88"/>
    <text x="284" y="248" fill="#c9d2dc">34</text>
    <!-- row 4: tmux-control-mode-js 29 -->
    <text x="222" y="262" text-anchor="end">tmux-control-mode-js</text>
    <rect x="228" y="257.5" width="45" height="5" rx="1.5" fill="#309e8f" opacity="0.86"/>
    <text x="277" y="262" fill="#c9d2dc">29</text>
    <!-- row 5: slopspot-paste 27 -->
    <text x="222" y="276" text-anchor="end">slopspot-paste</text>
    <rect x="228" y="271.5" width="42" height="5" rx="1.5" fill="#238478" opacity="0.84"/>
    <text x="274" y="276" fill="#c9d2dc">27</text>
    <!-- row 6: cc-candybar 27 -->
    <text x="222" y="290" text-anchor="end">cc-candybar</text>
    <rect x="228" y="285.5" width="42" height="5" rx="1.5" fill="#1a6a61" opacity="0.82"/>
    <text x="274" y="290" fill="#c9d2dc">27</text>
  </g>

  <!-- perpetual shimmer sweep across the bar block, subtle so it doesn't wash values -->
  <g clip-path="url(#barsClip)">
    <rect x="120" y="208" width="40" height="82" fill="url(#barShimmer)">
      <animate attributeName="x" values="120;360" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============================================================ -->
  <!-- Column B: Days Active — ring gauge, arc length = 250/365      -->
  <!-- ============================================================ -->
  <!-- background ring -->
  <circle cx="440" cy="244" r="42" fill="none" stroke="#1a2632" stroke-width="7"/>
  <!-- filled arc: 250/365 = 68.49% of circumference (2π·42 = 263.89). Length = 180.75 -->
  <g transform="rotate(-90 440 244)">
    <circle cx="440" cy="244" r="42" fill="none" stroke="#5eead4" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="180.75 263.89">
      <animate attributeName="stroke-opacity" values="1;0.72;1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- tick marks around ring at 90° intervals (visual reference of 0/25/50/75/100%) -->
  <g stroke="#3d5062" stroke-width="1" opacity="0.6">
    <line x1="440" y1="196" x2="440" y2="200"/>
    <line x1="488" y1="244" x2="484" y2="244"/>
    <line x1="440" y1="292" x2="440" y2="288"/>
    <line x1="392" y1="244" x2="396" y2="244"/>
  </g>
  <!-- traveling dot along the ring, continuous motion -->
  <g>
    <circle cx="440" cy="202" r="3.2" fill="#e6fffb">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 440 244" to="360 440 244"
                        dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- big value centered in ring -->
  <text x="440" y="253" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="url(#num)" text-anchor="middle">250</text>
  <!-- small subcaption inside ring below the value: fraction denominator -->
  <text x="440" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7d8b99" text-anchor="middle">of 365</text>
  <!-- label + period below gauge -->
  <text x="440" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9fb1c1" text-anchor="middle">Days Active</text>
  <text x="440" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5f6f7e" text-anchor="middle">1 Year</text>

  <!-- ============================================================ -->
  <!-- Column C: PRs Merged — peer scalar, magnitude emphasized     -->
  <!-- ============================================================ -->
  <text x="668" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#num)" text-anchor="middle">1916</text>
  <text x="668" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9fb1c1" text-anchor="middle">PRs Merged</text>
  <text x="668" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5f6f7e" text-anchor="middle">All Time</text>

  <!-- Column-C data glyph: 20 ticks (each = ~100 PRs), last tick alpha = 0.16 for the
       remainder 16 of the last hundred. Data-encoded, not decorative: the count of
       filled ticks is 1916/100. -->
  <g fill="#5eead4">
    <rect x="596" y="298" width="5" height="6" rx="1"/>
    <rect x="604" y="298" width="5" height="6" rx="1"/>
    <rect x="612" y="298" width="5" height="6" rx="1"/>
    <rect x="620" y="298" width="5" height="6" rx="1"/>
    <rect x="628" y="298" width="5" height="6" rx="1"/>
    <rect x="636" y="298" width="5" height="6" rx="1"/>
    <rect x="644" y="298" width="5" height="6" rx="1"/>
    <rect x="652" y="298" width="5" height="6" rx="1"/>
    <rect x="660" y="298" width="5" height="6" rx="1"/>
    <rect x="668" y="298" width="5" height="6" rx="1"/>
    <rect x="676" y="298" width="5" height="6" rx="1"/>
    <rect x="684" y="298" width="5" height="6" rx="1"/>
    <rect x="692" y="298" width="5" height="6" rx="1"/>
    <rect x="700" y="298" width="5" height="6" rx="1"/>
    <rect x="708" y="298" width="5" height="6" rx="1"/>
    <rect x="716" y="298" width="5" height="6" rx="1"/>
    <rect x="724" y="298" width="5" height="6" rx="1"/>
    <rect x="732" y="298" width="5" height="6" rx="1"/>
    <rect x="740" y="298" width="5" height="6" rx="1"/>
    <!-- last tick: 16% of 100 = 16 PRs, rendered at 0.16 opacity -->
    <rect x="748" y="298" width="5" height="6" rx="1" opacity="0.16"/>
  </g>
  <!-- traveling emphasis: a single tick brightens as a wave passes through -->
  <rect x="596" y="298" width="5" height="6" rx="1" fill="#f0fdfa" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="x" values="596;604;612;620;628;636;644;652;660;668;676;684;692;700;708;716;724;732;740" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="668" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" fill="#546374" text-anchor="middle">each ▮ ≈ 100 PRs</text>
</svg>
