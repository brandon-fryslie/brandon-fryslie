    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- Axis captions (uses calendar.label verbatim) -->
  <text x="24" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">Apr 2025</text>
  <text x="400" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">past 12 months · daily contributions · gold span = longest streak</text>
  <text x="776" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681" text-anchor="end">Apr 2026</text>

  <!-- ==================== ROW A: three scalar cards ==================== -->

  <!-- Card 1: My Issues Closed = 80 (visualized as 10×8 dot grid) -->
