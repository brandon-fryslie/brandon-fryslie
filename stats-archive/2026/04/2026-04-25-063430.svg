  <text x="780" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="end">Saturday · April 25, 2026</text>
  <line x1="20" y1="42" x2="780" y2="42" stroke="#21262d" stroke-width="1"/>

