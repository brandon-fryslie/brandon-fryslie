    <rect x="533" y="329" width="1.3" height="4" rx="0.5" fill="#89e051"/>
    <!-- JavaScript 1 -->
    <text x="527" y="339" fill="#8b949e" text-anchor="end">JavaScript</text>
    <rect x="533" y="336" width="0.8" height="4" rx="0.4" fill="#f1e05a"/>
