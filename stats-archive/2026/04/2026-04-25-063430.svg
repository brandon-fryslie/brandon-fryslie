    <rect x="533" y="301" width="240" height="4" rx="1" fill="#3178c6"/>
    <!-- Python 78 -->
    <text x="527" y="311" fill="#8b949e" text-anchor="end">Python</text>
    <rect x="533" y="308" width="52.0" height="4" rx="1" fill="#3572a5"/>
    <!-- Go 22 -->
    <text x="527" y="318" fill="#8b949e" text-anchor="end">Go</text>
    <rect x="533" y="315" width="14.7" height="4" rx="1" fill="#00add8"/>
    <!-- HTML 3 -->
