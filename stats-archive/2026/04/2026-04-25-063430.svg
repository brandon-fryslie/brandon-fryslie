  <text x="32" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#a5d6ff">80</text>
  <text x="32" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#6e7681">All Time</text>
  <rect x="182" y="212" width="60" height="48" fill="url(#dot80)"/>
  <g clip-path="url(#grid80Clip)">
    <rect x="122" y="212" width="60" height="48" fill="url(#segShim)">
