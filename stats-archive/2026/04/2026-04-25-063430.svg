  <line x1="20" y1="278" x2="780" y2="278" stroke="#21262d" stroke-width="1"/>

  <!-- ==================== ROW B: two breakdown panels ==================== -->

  <!-- Panel 1: Active Repos = 46 (breakdown: top 6 as horizontal bars) -->
  <text x="28" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Active Repos</text>
  <text x="108" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3">46</text>
