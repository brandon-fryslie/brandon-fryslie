  <text x="536" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#7d8590" letter-spacing="0.8">LONGEST STREAK</text>
