    <animate attributeName="opacity" values="0;0.08;0" dur="11s" repeatCount="indefinite"/>
  </rect>
  <rect x="183.63" y="292" width="57.08" height="14" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.08;0" dur="11s" begin="-3s" repeatCount="indefinite"/>
  </rect>
  <rect x="240.71" y="292" width="19.64" height="14" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.08;0" dur="11s" begin="-6s" repeatCount="indefinite"/>
  </rect>

