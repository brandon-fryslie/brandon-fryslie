<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <linearGradient id="bar-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79c0ff">
        <animate attributeName="stop-color" values="#79c0ff;#a5d6ff;#79c0ff" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f6feb">
        <animate attributeName="stop-color" values="#1f6feb;#388bfd;#1f6feb" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a5d6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="number-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff">
        <animate attributeName="stop-color" values="#79c0ff;#a5d6ff;#79c0ff" dur="13s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a5d6ff">
        <animate attributeName="stop-color" values="#a5d6ff;#79c0ff;#a5d6ff" dur="13s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chart-clip">
      <rect x="24" y="76" width="752" height="120"/>
    </clipPath>
    <clipPath id="days-clip">
      <rect x="280" y="292" width="119.66" height="14" rx="3"/>
    </clipPath>
    <clipPath id="streak-clip">
      <rect x="722.08" y="292" width="53.92" height="14" rx="3"/>
    </clipPath>
  </defs>

