  <rect x="183.63" y="292" width="57.08" height="14" fill="#ffa657"/>
  <rect x="240.71" y="292" width="19.64" height="14" fill="#7ee787"/>
  <rect x="260.35" y="292" width="3.65" height="14" fill="#6e7681"/>

