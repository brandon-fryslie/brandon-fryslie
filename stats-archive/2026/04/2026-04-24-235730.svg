<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6ffe9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gaugeShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a8ffb5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="gaugeClip"><rect x="415" y="298" width="84.77" height="8" rx="4"/></clipPath>
  </defs>

  <rect width="800" height="340" fill="url(#bg)"/>

  <!-- Header -->
  <text x="25" y="22" font-size="13" font-weight="600" fill="#c9d1d9" letter-spacing="0.3">Live GitHub Stats</text>
  <text x="775" y="22" font-size="11" fill="#8b949e" text-anchor="end">April 24, 2026 · past 12 months</text>
  <line x1="25" y1="32" x2="775" y2="32" stroke="#21262d" stroke-width="1"/>

  <!-- Longest-streak bracket, positioned over the days-264..345 span of the calendar -->
  <g id="streak">
    <line x1="560" y1="50" x2="726" y2="50" stroke="#f0f6fc" stroke-width="1.2" stroke-opacity="0.75"/>
    <line x1="560" y1="47" x2="560" y2="53" stroke="#f0f6fc" stroke-width="1.2" stroke-opacity="0.75"/>
    <line x1="726" y1="47" x2="726" y2="53" stroke="#f0f6fc" stroke-width="1.2" stroke-opacity="0.75"/>
    <text x="643" y="44" font-size="9.5" fill="#c9d1d9" text-anchor="middle">longest streak</text>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Calendar baseline -->
  <line x1="25" y1="178.5" x2="775" y2="178.5" stroke="#30363d" stroke-width="1"/>

  <!-- Weekly contribution bars (53 weekly bins of daily counts, height ∝ weekly total, color ∝ intensity) -->
  <g id="bars">
    <rect x="53.30" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="67.45" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="81.60" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="95.75" y="176.0" width="12" height="2.0" fill="#006d32" rx="1"/>
    <rect x="109.90" y="175.8" width="12" height="2.2" fill="#006d32" rx="1"/>
    <rect x="138.20" y="174.7" width="12" height="3.3" fill="#006d32" rx="1"/>
    <rect x="152.35" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="180.65" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="194.80" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="208.95" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="223.10" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="237.25" y="174.4" width="12" height="3.6" fill="#006d32" rx="1"/>
    <rect x="251.40" y="176.0" width="12" height="2.0" fill="#006d32" rx="1"/>
    <rect x="265.55" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="279.70" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="308.00" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="350.45" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="364.60" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="378.75" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="392.90" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="407.05" y="175.4" width="12" height="2.6" fill="#006d32" rx="1"/>
    <rect x="421.20" y="173.5" width="12" height="4.5" fill="#006d32" rx="1"/>
    <rect x="435.35" y="166.1" width="12" height="11.9" fill="#26a641" rx="1"/>
    <rect x="449.50" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="463.65" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="477.80" y="176.0" width="12" height="2.0" fill="#0e4429" rx="1"/>
    <rect x="491.95" y="170.1" width="12" height="7.9" fill="#26a641" rx="1"/>
    <rect x="506.10" y="155.1" width="12" height="22.9" fill="#26a641" rx="1"/>
    <rect x="520.25" y="121.2" width="12" height="56.8" fill="#39d353" rx="1"/>
    <rect x="534.40" y="167.3" width="12" height="10.7" fill="#26a641" rx="1"/>
    <rect x="548.55" y="147.9" width="12" height="30.1" fill="#39d353" rx="1"/>
    <rect x="562.70" y="120.0" width="12" height="58.0" fill="#39d353" rx="1"/>
    <rect x="576.85" y="58.0"  width="12" height="120.0" fill="#57e389" rx="1"/>
    <rect x="591.00" y="69.2"  width="12" height="108.8" fill="#57e389" rx="1"/>
    <rect x="605.15" y="92.8"  width="12" height="85.2" fill="#57e389" rx="1"/>
    <rect x="619.30" y="120.5" width="12" height="57.5" fill="#39d353" rx="1"/>
    <rect x="633.45" y="111.9" width="12" height="66.1" fill="#39d353" rx="1"/>
    <rect x="647.60" y="65.2"  width="12" height="112.8" fill="#57e389" rx="1"/>
    <rect x="661.75" y="135.8" width="12" height="42.2" fill="#39d353" rx="1"/>
    <rect x="675.90" y="92.6"  width="12" height="85.4" fill="#57e389" rx="1"/>
    <rect x="690.05" y="134.8" width="12" height="43.2" fill="#39d353" rx="1"/>
