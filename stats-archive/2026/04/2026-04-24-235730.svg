  <!-- Sweep highlight passing over the bars perpetually -->
  <rect x="-140" y="55" width="140" height="124" fill="url(#sweep)" pointer-events="none">
    <animate attributeName="x" from="-140" to="800" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- Month labels beneath the bars -->
  <g font-size="9.5" fill="#8b949e" text-anchor="middle">
    <text x="45" y="193">May</text>
    <text x="102" y="193">Jun</text>
    <text x="158" y="193">Jul</text>
    <text x="229" y="193">Aug</text>
    <text x="286" y="193">Sep</text>
    <text x="342" y="193">Oct</text>
    <text x="413" y="193">Nov</text>
    <text x="470" y="193">Dec</text>
    <text x="540" y="193">Jan</text>
    <text x="597" y="193">Feb</text>
    <text x="654" y="193">Mar</text>
    <text x="710" y="193">Apr</text>
  </g>

  <!-- Divider between calendar and metrics -->
  <line x1="25" y1="208" x2="775" y2="208" stroke="#21262d" stroke-width="1"/>

  <!-- Cell 1 — Commits (3345) : scalar, calendar above IS its distribution -->
  <text x="110" y="240" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="middle">3345</text>
  <text x="110" y="262" font-size="13" font-weight="500" fill="#c9d1d9" text-anchor="middle">Commits</text>
  <text x="110" y="277" font-size="10.5" fill="#8b949e" text-anchor="middle">1 Year</text>
  <rect x="25" y="298" width="170" height="8" rx="4" fill="#26a641" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="110" y="320" font-size="9" fill="#6e7681" text-anchor="middle">total across the year shown above</text>

  <!-- Cell 2 — Languages (9) : stacked bar visualizes the breakdown by commit share -->
  <text x="300" y="240" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="middle">9</text>
  <text x="300" y="262" font-size="13" font-weight="500" fill="#c9d1d9" text-anchor="middle">Languages</text>
  <text x="300" y="277" font-size="10.5" fill="#8b949e" text-anchor="middle">1 Year</text>
  <g>
    <rect x="215.00" y="298" width="108.00" height="8" fill="#3178c6">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="323.00" y="298" width="38.65" height="8" fill="#3572A5">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="8s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="361.65" y="298" width="13.30" height="8" fill="#00ADD8">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="9s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="374.95" y="298" width="2.00" height="8" fill="#89e051"/>
    <rect x="376.95" y="298" width="2.00" height="8" fill="#e34c26"/>
    <rect x="378.95" y="298" width="2.00" height="8" fill="#A97BFF"/>
    <rect x="380.95" y="298" width="2.00" height="8" fill="#f1e05a"/>
    <rect x="382.95" y="298" width="2.00" height="8" fill="#844FBA"/>
  </g>
  <text x="300" y="320" font-size="9" fill="#6e7681" text-anchor="middle">by commit share · TypeScript leads</text>

  <!-- Cell 3 — Days Active (182) : proportional gauge, 182/365 fill with shimmer -->
  <text x="500" y="240" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="middle">182</text>
  <text x="500" y="262" font-size="13" font-weight="500" fill="#c9d1d9" text-anchor="middle">Days Active</text>
  <text x="500" y="277" font-size="10.5" fill="#8b949e" text-anchor="middle">1 Year</text>
  <rect x="415" y="298" width="170" height="8" rx="4" fill="#21262d"/>
  <rect x="415" y="298" width="84.77" height="8" rx="4" fill="#39d353"/>
  <rect x="383" y="298" width="32" height="8" fill="url(#gaugeShimmer)" clip-path="url(#gaugeClip)">
    <animate attributeName="x" from="383" to="499.77" dur="4s" repeatCount="indefinite"/>
  </rect>
  <line x1="499.77" y1="296" x2="499.77" y2="308" stroke="#c9d1d9" stroke-width="1"/>
  <text x="500" y="320" font-size="9" fill="#6e7681" text-anchor="middle">of 365 possible · 50%</text>

  <!-- Cell 4 — Longest Streak (82) : proportional bar, 82/365 fill, connected to bracket above -->
  <text x="690" y="240" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="middle">82</text>
  <text x="690" y="262" font-size="13" font-weight="500" fill="#c9d1d9" text-anchor="middle">Longest Streak</text>
  <text x="690" y="277" font-size="10.5" fill="#8b949e" text-anchor="middle">1 Year</text>
  <rect x="605" y="298" width="170" height="8" rx="4" fill="#21262d"/>
  <rect x="605" y="298" width="38.19" height="8" rx="4" fill="#f0f6fc" opacity="0.85">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="690" y="320" font-size="9" fill="#6e7681" text-anchor="middle">consecutive days · span marked above</text>
</svg>
