<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: U.S. Semiquincentennial · July 2, 1776 Continental Congress vote for independence — 250th anniversary of the Lee Resolution ("Resolved: That these United Colonies are, and of right ought to be, free and independent States"), which passed 12-0 with New York abstaining, in Philadelphia's Pennsylvania State House. This is the "true" independence day; John Adams wrote to Abigail on July 3, 1776 that "The Second Day of July 1776, will be the most memorable Epocha, in the History of America." Visualized as a Founders' desktop tableau at candlelight: a wide aged parchment banner dominates the composition with a large ink-black "JULY 2, 2026" headline in serif capitals, red "SEMIQUINCENTENNIAL · 250 YEARS · INDEPENDENCE VOTED" subhead beneath, and italic navy "LEE RESOLUTION · CONTINENTAL CONGRESS · PHILADELPHIA · JULY 2, 1776" tertiary along the lower edge; a signature flourish curls under the headline. A lit taper candle with a flickering amber flame stands at far left casting a warm halo across the parchment; a black-plumed goose quill dips into a squat ink pot at far right with a slow ink droplet falling from the nib. Thirteen bone-white stars twinkle in a gentle Betsy-Ross arc across the deep-indigo night sky above the parchment. Palette: parchment cream #f5e4bb, aged umber #7a5a2a, ink #1a1208, Old Glory red #b22234 and blue #3c3b6e, candlelight amber #ffb347 and flame-cream #fff4b0, bone-white stars, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: U.S. Semiquincentennial July 2 2026, 250th anniversary of the Continental Congress vote for independence — an aged parchment banner with a large JULY 2 2026 headline, red SEMIQUINCENTENNIAL 250 YEARS INDEPENDENCE VOTED subhead, italic LEE RESOLUTION CONTINENTAL CONGRESS PHILADELPHIA JULY 2 1776 tertiary, a candle at left with flickering flame, a quill in an inkwell at right with a slow ink drop, and thirteen twinkling stars in a Betsy Ross arc across the night sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161638"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e4bb"/>
      <stop offset="0.5" stop-color="#ecd49a"/>
      <stop offset="1" stop-color="#cba872"/>
    </linearGradient>
    <linearGradient id="edgeShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5a2a" stop-opacity="0.6"/>
      <stop offset="0.08" stop-color="#7a5a2a" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#7a5a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a5a2a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="topBottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a2a" stop-opacity="0.35"/>
      <stop offset="0.15" stop-color="#7a5a2a" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#7a5a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a5a2a" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="candleglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quillglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#fff4b0"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#d84315" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background night sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- 13 stars in a Betsy-Ross arc across the top; staggered twinkles -->
  <g fill="#f5f0e6">
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(155,32)"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="0s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(196,26)"><animate attributeName="opacity" values="0.35;1;0.35" dur="11s" begin="0.6s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(237,21)"><animate attributeName="opacity" values="0.35;1;0.35" dur="13s" begin="1.2s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(278,17)"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="1.8s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(319,15)"><animate attributeName="opacity" values="0.35;1;0.35" dur="11s" begin="2.4s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(360,14)"><animate attributeName="opacity" values="0.35;1;0.35" dur="13s" begin="3.0s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(400,13)"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="3.6s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(440,14)"><animate attributeName="opacity" values="0.35;1;0.35" dur="11s" begin="4.2s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(481,15)"><animate attributeName="opacity" values="0.35;1;0.35" dur="13s" begin="4.8s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(522,17)"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="5.4s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(563,21)"><animate attributeName="opacity" values="0.35;1;0.35" dur="11s" begin="6.0s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(604,26)"><animate attributeName="opacity" values="0.35;1;0.35" dur="13s" begin="6.6s" repeatCount="indefinite"/></polygon>
    <polygon points="0,-6 1.35,-1.86 5.7,-1.85 2.19,0.71 3.53,4.86 0,2.3 -3.53,4.86 -2.19,0.71 -5.7,-1.85 -1.35,-1.86" transform="translate(645,32)"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" begin="7.2s" repeatCount="indefinite"/></polygon>
  </g>

  <!-- candle halo behind parchment left edge -->
  <ellipse cx="70" cy="130" rx="110" ry="80" fill="url(#candleglow)">
    <animate attributeName="opacity" values="0.75;1;0.7;0.95;0.75" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="110;118;108;114;110" dur="1.7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- soft ambient glow behind quill -->
  <ellipse cx="725" cy="150" rx="80" ry="55" fill="url(#quillglow)"/>

  <!-- parchment banner -->
  <g filter="url(#drop)">
    <rect x="130" y="50" width="540" height="130" fill="url(#parchment)" rx="4"/>
    <rect x="130" y="50" width="540" height="130" fill="url(#edgeShade)" rx="4"/>
    <rect x="130" y="50" width="540" height="130" fill="url(#topBottomShade)" rx="4"/>
  </g>

  <!-- age spots on parchment -->
  <g fill="#8b6a3a" opacity="0.15">
    <ellipse cx="180" cy="70" rx="8" ry="3"/>
    <ellipse cx="620" cy="165" rx="10" ry="3"/>
    <circle cx="240" cy="170" r="2.5"/>
    <circle cx="560" cy="62" r="2"/>
    <ellipse cx="470" cy="75" rx="4" ry="1.5"/>
  </g>

  <!-- burn/tear marks at corners -->
  <path d="M 130 50 Q 148 56 152 68 Q 142 62 130 66 Z" fill="#6b4a1a" opacity="0.5"/>
  <path d="M 670 50 Q 652 56 648 68 Q 658 62 670 66 Z" fill="#6b4a1a" opacity="0.5"/>
  <path d="M 130 180 Q 148 174 152 162 Q 142 168 130 164 Z" fill="#6b4a1a" opacity="0.5"/>
  <path d="M 670 180 Q 652 174 648 162 Q 658 168 670 164 Z" fill="#6b4a1a" opacity="0.5"/>

  <!-- ornamental brackets flanking the headline -->
  <g stroke="#3c3b6e" stroke-width="1.2" fill="none" opacity="0.75">
    <path d="M 165 95 L 175 95 L 175 105"/>
    <path d="M 165 82 Q 152 95 165 108"/>
    <path d="M 635 95 L 625 95 L 625 105"/>
    <path d="M 635 82 Q 648 95 635 108"/>
  </g>

  <!-- headline: JULY 2, 2026 -->
  <text x="400" y="103" font-family="'Georgia', 'Times New Roman', serif" font-size="42" font-weight="900" letter-spacing="4" text-anchor="middle" fill="#1a1208">JULY 2, 2026</text>

  <!-- signature flourish beneath headline -->
  <path d="M 250 118 Q 320 125 400 121 Q 480 117 550 122" stroke="#1a1208" stroke-width="1.2" fill="none" opacity="0.75"/>
  <path d="M 545 122 Q 555 122 558 127 Q 555 126 552 123" stroke="#1a1208" stroke-width="1.2" fill="none" opacity="0.75"/>

  <!-- subhead -->
  <text x="400" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#b22234">SEMIQUINCENTENNIAL · 250 YEARS · INDEPENDENCE VOTED</text>

  <!-- separator dots -->
  <g fill="#b22234">
    <circle cx="200" cy="152" r="1.5"/>
    <circle cx="400" cy="152" r="1.5"/>
    <circle cx="600" cy="152" r="1.5"/>
  </g>

  <!-- tertiary italic ribbon -->
  <text x="400" y="167" font-family="'Georgia', 'Times New Roman', serif" font-size="10" font-style="italic" letter-spacing="1.5" text-anchor="middle" fill="#3c3b6e">LEE RESOLUTION · CONTINENTAL CONGRESS · PHILADELPHIA · JULY 2, 1776</text>

  <!-- Candle at far left -->
  <g>
    <!-- candlestick base -->
    <ellipse cx="60" cy="184" rx="18" ry="3" fill="#3a2818" opacity="0.55"/>
    <rect x="46" y="176" width="28" height="8" fill="#a67b3a" rx="1.5"/>
    <rect x="50" y="174" width="20" height="4" fill="#c9a870"/>
    <!-- candle body -->
    <rect x="54" y="146" width="12" height="30" fill="#f4e2b8"/>
    <rect x="54" y="146" width="4" height="30" fill="#ecd49a"/>
    <ellipse cx="60" cy="146" rx="6" ry="1.6" fill="#e8d29c"/>
    <!-- wax drip -->
    <path d="M 54 150 Q 51 158 53 162 L 58 158 Z" fill="#ecd49a"/>
    <!-- wick -->
    <line x1="60" y1="146" x2="60" y2="140" stroke="#2a1a08" stroke-width="1.2"/>
    <!-- flame outer -->
    <ellipse cx="60" cy="132" rx="5" ry="11" fill="url(#flame)">
      <animate attributeName="ry" values="11;13;10;12;11" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="5;4.6;5.3;4.8;5" dur="1.7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- flame core -->
    <ellipse cx="60" cy="134" rx="2.4" ry="6" fill="#fff4b0" opacity="0.9">
      <animate attributeName="ry" values="6;7;5;6.5;6" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.85;1;0.9" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>
    <!-- ember sparks drifting up -->
    <circle cx="60" cy="120" r="0.8" fill="#ffb347">
      <animate attributeName="cy" values="120;100;90" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="60;62;58" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="120" r="0.6" fill="#ffb347">
      <animate attributeName="cy" values="120;95;85" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="60;57;61" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Quill and inkwell at far right -->
  <g transform="translate(725, 118)">
    <!-- inkwell shadow -->
    <ellipse cx="0" cy="66" rx="28" ry="4" fill="#0a0603" opacity="0.6"/>
    <!-- inkwell body -->
    <path d="M -22 32 Q -22 30 -18 30 L 18 30 Q 22 30 22 32 L 22 60 Q 22 64 0 64 Q -22 64 -22 60 Z" fill="#3a2818"/>
    <!-- inkwell rim highlight -->
    <path d="M -22 32 Q -22 30 -18 30 L 18 30 Q 22 30 22 32" stroke="#c9a870" stroke-width="0.6" fill="none" opacity="0.7"/>
    <!-- inkwell top opening -->
    <ellipse cx="0" cy="32" rx="18" ry="4" fill="#0a0603"/>
    <ellipse cx="0" cy="32" rx="14" ry="2.5" fill="#1a1208"/>
    <!-- ink meniscus glint -->
    <ellipse cx="-4" cy="31" rx="4" ry="0.8" fill="#3c3b6e" opacity="0.5"/>

    <!-- Quill with gentle sway -->
    <g>
      <!-- shaft -->
      <path d="M 2 32 L 12 -58" stroke="#2a1a08" stroke-width="1.5" fill="none"/>
      <!-- feather blade -->
      <path d="M 12 -58 Q 28 -50 32 -32 Q 24 -28 20 -12 Q 30 -8 26 10 Q 14 16 8 24 L 6 12 Q 8 -22 12 -58 Z" fill="#f5f0e6" opacity="0.94"/>
      <!-- feather shadow band -->
      <path d="M 12 -58 Q 22 -50 24 -32 Q 18 -28 16 -12 Q 22 -8 20 10 Q 12 15 8 22 Z" fill="#e8d29c" opacity="0.35"/>
      <!-- barbs -->
      <path d="M 10 -50 L 26 -46 M 10 -40 L 28 -36 M 10 -30 L 26 -24 M 10 -20 L 26 -14 M 10 -10 L 24 -4 M 10 0 L 22 6 M 10 10 L 18 16" stroke="#a67b3a" stroke-width="0.6" opacity="0.55" fill="none"/>
      <!-- rachis -->
      <path d="M 8 -50 L 8 22" stroke="#a67b3a" stroke-width="0.4" opacity="0.5" fill="none"/>
      <!-- nib -->
      <path d="M 2 32 L 0 38 L 4 38 Z" fill="#1a1208"/>
      <animateTransform attributeName="transform" type="rotate" values="-22;-19;-22;-25;-22" dur="11s" repeatCount="indefinite"/>
    </g>

    <!-- ink drop falling from nib into inkwell -->
    <circle cx="2" cy="34" r="1.6" fill="#0a0603">
      <animate attributeName="cy" values="34;46;46" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- ripple on ink surface -->
    <ellipse cx="0" cy="32" rx="2" ry="0.5" fill="none" stroke="#3c3b6e" stroke-width="0.6" opacity="0">
      <animate attributeName="rx" values="2;10;14" dur="5s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="2.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
