<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Apollo 11 launch — July 16, 1969 (57th anniversary of the Saturn V liftoff from Kennedy Space Center Launch Complex 39A that carried Armstrong, Aldrin, and Collins to the Moon). A dawn-sky launch tableau: predawn navy fading to warm horizon orange, a towering Saturn V rocket climbing on a brilliant orange-white flame column with a rolling exhaust plume, silhouetted launch umbilical tower on the left, palm-tree silhouettes on the horizon, a crescent Moon and stars in the upper right, contrail streamers, a large ivory JULY 16, 2026 headline dominating center-right, a bright APOLLO 11 · 57 YEARS · LIFTOFF JULY 16, 1969 subhead, and italic KENNEDY SPACE CENTER · LC-39A · WE CHOOSE TO GO tertiary along the bottom. Palette: deep navy #050a24, midnight blue #0d1b45, dawn violet #3d1f5c, dawn orange #ff6b1a, flame yellow #ffe066, flame white #fffbe0, rocket white #f4f4ef, rocket shadow #8a8f9a, moon cream #f5ecc9, star silver #dfe8ff, ember red #d8391a. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 16, 2026 — 57th anniversary of the Apollo 11 launch. A dawn Florida sky at Kennedy Space Center Launch Complex 39A with a Saturn V rocket ascending on a brilliant white-and-orange flame column, silhouetted launch tower on the left, palm silhouettes on the horizon, a crescent Moon and stars in the upper right, a large JULY 16, 2026 headline center-right, APOLLO 11 · 57 YEARS · LIFTOFF JULY 16, 1969 subhead, and KENNEDY SPACE CENTER · LC-39A · WE CHOOSE TO GO tertiary.">
  <defs>
    <!-- Dawn sky: deep navy top-left, warmer orange near horizon-right -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a24"/>
      <stop offset="35%" stop-color="#0d1b45"/>
      <stop offset="70%" stop-color="#3d1f5c"/>
      <stop offset="90%" stop-color="#a03a30"/>
      <stop offset="100%" stop-color="#ff6b1a"/>
    </linearGradient>

    <!-- Horizon glow band -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#ff8a3a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb060" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Rocket body gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a8f9a"/>
      <stop offset="35%" stop-color="#f4f4ef"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#6c7180"/>
    </linearGradient>

    <!-- Flame gradient -->
    <radialGradient id="flame" cx="50%" cy="15%" r="85%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="18%" stop-color="#ffe066"/>
      <stop offset="45%" stop-color="#ff9a2a"/>
      <stop offset="75%" stop-color="#d8391a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4a1208" stop-opacity="0"/>
    </radialGradient>

    <!-- Bright flame core -->
    <radialGradient id="flameCore" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffbe0"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>

    <!-- Text metallic ivory gradient -->
    <linearGradient id="ivoryText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5ecc9"/>
      <stop offset="100%" stop-color="#c9a870"/>
    </linearGradient>

    <!-- Moon crescent gradient -->
    <radialGradient id="moon" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fffdf0"/>
      <stop offset="55%" stop-color="#f5ecc9"/>
      <stop offset="100%" stop-color="#c9b483"/>
    </radialGradient>

    <!-- Exhaust smoke turbulence -->
    <filter id="smokeNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>

    <!-- Soft glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger flame glow -->
    <filter id="flameGlow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Star cluster symbol -->
    <symbol id="star" viewBox="-2 -2 4 4">
      <circle r="0.8" fill="#dfe8ff"/>
    </symbol>

    <!-- Saturn V rocket (stylized, tall) -->
    <symbol id="saturnV" viewBox="0 0 40 200" overflow="visible">
      <!-- Escape tower spike -->
      <line x1="20" y1="0" x2="20" y2="12" stroke="#dfe8ff" stroke-width="0.8"/>
      <!-- Command module cone -->
      <path d="M14 24 L20 12 L26 24 Z" fill="url(#rocketBody)" stroke="#6c7180" stroke-width="0.4"/>
      <!-- Service module -->
      <rect x="14" y="24" width="12" height="10" fill="#c9d0da" stroke="#6c7180" stroke-width="0.3"/>
      <!-- S-IVB (3rd stage) -->
      <rect x="13" y="34" width="14" height="26" fill="url(#rocketBody)" stroke="#6c7180" stroke-width="0.3"/>
      <rect x="13" y="36" width="14" height="1.6" fill="#0d1b45"/>
      <text x="20" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="4.5" font-weight="900" fill="#0d1b45">USA</text>
      <!-- Interstage ring -->
      <rect x="12" y="60" width="16" height="2" fill="#6c7180"/>
      <!-- S-II (2nd stage) -->
      <rect x="12" y="62" width="16" height="40" fill="url(#rocketBody)" stroke="#6c7180" stroke-width="0.3"/>
      <rect x="12" y="66" width="16" height="2" fill="#0d1b45"/>
      <rect x="12" y="98" width="16" height="2" fill="#0d1b45"/>
      <!-- Interstage ring -->
      <rect x="11" y="102" width="18" height="2.5" fill="#6c7180"/>
      <!-- S-IC (1st stage) - largest -->
      <rect x="11" y="104.5" width="18" height="72" fill="url(#rocketBody)" stroke="#6c7180" stroke-width="0.3"/>
      <!-- USA vertical block -->
      <rect x="11" y="112" width="18" height="4" fill="#0d1b45"/>
      <text x="20" y="115.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="3.6" font-weight="900" fill="#f4f4ef">UNITED STATES</text>
      <!-- Roll pattern black stripes -->
      <rect x="11" y="128" width="4" height="30" fill="#1a1f2a"/>
      <rect x="25" y="128" width="4" height="30" fill="#1a1f2a"/>
      <!-- APOLLO 11 badge -->
      <circle cx="20" cy="146" r="4" fill="#f4f4ef" stroke="#0d1b45" stroke-width="0.4"/>
      <text x="20" y="147.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="3" font-weight="900" fill="#0d1b45">11</text>
      <!-- Fin fairings -->
      <path d="M11 168 L6 176 L11 176 Z" fill="#6c7180"/>
      <path d="M29 168 L34 176 L29 176 Z" fill="#6c7180"/>
      <!-- F-1 engine skirt -->
      <rect x="10" y="176" width="20" height="6" fill="#3a3f4a"/>
      <!-- Engine bells -->
      <path d="M11 182 L10 190 L14 190 L14 182 Z" fill="#2a2f3a"/>
      <path d="M14 182 L14 190 L18 190 L18 182 Z" fill="#1a1f2a"/>
      <path d="M18 182 L18 190 L22 190 L22 182 Z" fill="#2a2f3a"/>
      <path d="M22 182 L22 190 L26 190 L26 182 Z" fill="#1a1f2a"/>
      <path d="M26 182 L26 190 L30 190 L29 182 Z" fill="#2a2f3a"/>
    </symbol>
  </defs>

  <!-- 1. Sky -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- 2. Horizon glow band -->
  <rect x="0" y="150" width="800" height="50" fill="url(#horizonGlow)"/>

  <!-- 3. Distant stars (upper left/right, sparse) -->
  <g opacity="0.95">
    <circle cx="60"  cy="22"  r="0.9" fill="#dfe8ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="40"  r="0.7" fill="#dfe8ff"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="16"  r="1.0" fill="#f5ecc9"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="34"  r="0.7" fill="#dfe8ff"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="18"  r="0.9" fill="#dfe8ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="24"  r="0.7" fill="#dfe8ff"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="14"  r="1.1" fill="#f5ecc9"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="46"  r="0.8" fill="#dfe8ff"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="9s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="42"  r="0.6" fill="#dfe8ff"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="28"  r="0.7" fill="#dfe8ff"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="8s" begin="-3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 4. Crescent Moon (upper right, the destination) -->
  <g transform="translate(715 44)" filter="url(#glow)">
    <circle r="17" fill="url(#moon)"/>
    <circle r="17" cx="7" fill="#0d1b45"/>
    <circle cx="-4" cy="-3" r="1.2" fill="#c9b483" opacity="0.7"/>
    <circle cx="-6" cy="4"  r="0.8" fill="#c9b483" opacity="0.6"/>
    <circle cx="-2" cy="7"  r="1.0" fill="#c9b483" opacity="0.55"/>
  </g>

  <!-- 5. Palm silhouettes on the horizon (Florida) -->
  <g fill="#0a0d1a" opacity="0.95">
    <!-- distant palm 1 -->
    <g transform="translate(30 180)">
      <rect x="-1" y="-22" width="2" height="22" fill="#0a0d1a"/>
      <path d="M0 -22 Q-10 -26 -18 -22 M0 -22 Q10 -26 18 -22 M0 -22 Q-6 -30 -14 -32 M0 -22 Q6 -30 14 -32 M0 -22 Q0 -32 -2 -34"
            stroke="#0a0d1a" stroke-width="1.6" fill="none"/>
    </g>
    <g transform="translate(430 184)">
      <rect x="-1" y="-18" width="2" height="18" fill="#0a0d1a"/>
      <path d="M0 -18 Q-8 -22 -14 -18 M0 -18 Q8 -22 14 -18 M0 -18 Q-5 -25 -12 -27 M0 -18 Q5 -25 12 -27 M0 -18 Q0 -27 -2 -29"
            stroke="#0a0d1a" stroke-width="1.4" fill="none"/>
    </g>
    <g transform="translate(560 186)">
      <rect x="-1" y="-14" width="2" height="14" fill="#0a0d1a"/>
      <path d="M0 -14 Q-6 -17 -11 -14 M0 -14 Q6 -17 11 -14 M0 -14 Q-4 -20 -9 -22 M0 -14 Q4 -20 9 -22"
            stroke="#0a0d1a" stroke-width="1.2" fill="none"/>
    </g>
  </g>

  <!-- 6. Launch umbilical tower (left of rocket) -->
  <g stroke="#1a1f2a" stroke-width="1.4" fill="none" opacity="0.95">
    <!-- vertical mast -->
    <line x1="98"  y1="30"  x2="98"  y2="190"/>
    <line x1="108" y1="30"  x2="108" y2="190"/>
    <!-- crossbraces -->
    <line x1="98"  y1="46"  x2="108" y2="60"/>
    <line x1="108" y1="46"  x2="98"  y2="60"/>
    <line x1="98"  y1="70"  x2="108" y2="84"/>
    <line x1="108" y1="70"  x2="98"  y2="84"/>
    <line x1="98"  y1="94"  x2="108" y2="108"/>
    <line x1="108" y1="94"  x2="98"  y2="108"/>
    <line x1="98"  y1="118" x2="108" y2="132"/>
    <line x1="108" y1="118" x2="98"  y2="132"/>
    <line x1="98"  y1="142" x2="108" y2="156"/>
    <line x1="108" y1="142" x2="98"  y2="156"/>
    <line x1="98"  y1="166" x2="108" y2="180"/>
    <line x1="108" y1="166" x2="98"  y2="180"/>
    <!-- horizontal ties (swing arms) -->
    <line x1="108" y1="60"  x2="140" y2="60"/>
    <line x1="108" y1="90"  x2="140" y2="90"/>
    <line x1="108" y1="120" x2="140" y2="120"/>
    <line x1="108" y1="150" x2="140" y2="150"/>
    <!-- top crown / lightning mast -->
    <line x1="103" y1="30"  x2="103" y2="14"/>
    <circle cx="103" cy="12" r="1.6" fill="#dfe8ff"/>
  </g>

  <!-- 7. Rolling exhaust smoke cloud at pad base (huge, textured) -->
  <g opacity="0.85" filter="url(#smokeNoise)">
    <ellipse cx="200" cy="196" rx="140" ry="20" fill="#e8dbb8"/>
    <ellipse cx="140" cy="188" rx="55"  ry="18" fill="#f2e8c9"/>
    <ellipse cx="260" cy="188" rx="65"  ry="20" fill="#f2e8c9"/>
    <ellipse cx="330" cy="196" rx="55"  ry="14" fill="#d8c99a"/>
    <ellipse cx="90"  cy="196" rx="45"  ry="12" fill="#c9b47f"/>
  </g>

  <!-- 8. Flame column beneath rocket (broad glow) -->
  <g filter="url(#flameGlow)" opacity="0.9">
    <ellipse cx="185" cy="188" rx="50" ry="42" fill="url(#flame)"/>
  </g>

  <!-- 9. Main flame plume -->
  <g>
    <path d="M170 130 Q160 160 152 190 Q168 196 185 194 Q202 196 218 190 Q210 160 200 130 Z"
          fill="url(#flame)">
      <animate attributeName="d"
               values="M170 130 Q160 160 152 190 Q168 196 185 194 Q202 196 218 190 Q210 160 200 130 Z;
                       M170 130 Q156 162 148 192 Q168 198 185 194 Q202 198 222 192 Q214 162 200 130 Z;
                       M170 130 Q162 158 154 188 Q168 194 185 194 Q202 194 216 188 Q208 158 200 130 Z;
                       M170 130 Q160 160 152 190 Q168 196 185 194 Q202 196 218 190 Q210 160 200 130 Z"
               dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- inner core -->
    <path d="M176 132 Q170 158 165 186 Q175 190 185 190 Q195 190 205 186 Q200 158 194 132 Z"
          fill="url(#flameCore)">
      <animate attributeName="opacity" values="0.85;1;0.9;1;0.85" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <!-- flame flicker tongues -->
    <path d="M182 190 Q185 200 188 190 Q186 196 182 190 Z" fill="#fffbe0" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="0.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 10. Saturn V rocket -->
  <g transform="translate(165 -46)">
    <use href="#saturnV" width="40" height="200">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0.6 -0.4; -0.4 0.5; 0 0"
                        dur="0.35s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 11. Contrail streamers curving up from where the rocket has already climbed -->
  <g opacity="0.55" fill="none" stroke="#f4f4ef" stroke-linecap="round">
    <path d="M186 194 Q182 130 178 60" stroke-width="6" opacity="0.35"/>
    <path d="M186 194 Q184 130 181 40" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- 12. Rising embers / sparks -->
  <g>
    <circle r="1.2" fill="#ffe066">
      <animateMotion path="M185 190 Q195 150 220 100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.0" fill="#ff9a2a">
      <animateMotion path="M180 190 Q160 140 130 90" dur="3.5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;0" dur="3.5s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle r="0.9" fill="#fffbe0">
      <animateMotion path="M190 190 Q210 150 245 110" dur="2.8s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.85;0" dur="2.8s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.1" fill="#ffb060">
      <animateMotion path="M175 190 Q150 145 118 100" dur="3.2s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;0" dur="3.2s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.3" fill="#ffe066">
      <animateMotion path="M195 190 Q225 145 265 90" dur="3.4s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.8;0" dur="3.4s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 13. Main headline (JULY 16, 2026) — dominant, in the sky area -->
  <g filter="url(#glow)">
    <text x="530" y="98" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="52" font-weight="900" letter-spacing="3.5" fill="url(#ivoryText)"
          stroke="#3d1f5c" stroke-width="0.5">
      JULY 16, 2026
    </text>
  </g>

  <!-- 14. Subhead -->
  <text x="530" y="132" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="800" letter-spacing="3.8" fill="#ffb060">
    APOLLO 11 · 57 YEARS · LIFTOFF JULY 16, 1969
  </text>

  <!-- 15. Tertiary italic caption -->
  <text x="530" y="172" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" font-style="italic" font-weight="700" letter-spacing="2.4" fill="#f5ecc9" opacity="0.92">
    KENNEDY SPACE CENTER · LC-39A · WE CHOOSE TO GO
  </text>

  <!-- 16. Subtle T+MET counter -->
  <text x="784" y="192" text-anchor="end"
        font-family="Menlo, Consolas, monospace"
        font-size="9" font-weight="700" fill="#8a8f9a" opacity="0.7">
    T+00:00:57
  </text>
</svg>
