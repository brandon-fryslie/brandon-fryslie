<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Canada Day (July 1, 2026) — 159th anniversary of Canadian Confederation. On July 1, 1867 the British North America Act took effect and Canada became a self-governing dominion of the British Empire, uniting the provinces of Ontario, Quebec, New Brunswick, and Nova Scotia. Federal statutory holiday, celebrated with fireworks on Parliament Hill in Ottawa. Visualized as a night-time Ottawa tableau: a large Canadian flag banner spans the composition with two vertical Canadian-red bands flanking a bone-white center panel, an 11-point stylized red maple leaf pulses at the heart of the center panel, silhouette of the Peace Tower of Parliament Hill rises into a starry night sky at right, three bright fireworks bursts blossom above the tower in red, white, and gold, drifting maple leaves rotate slowly across the frame, faint aurora shimmer along the top. Large bone-white "JULY 1, 2026" headline anchors the top center of the white panel with red "CANADA DAY · CONFEDERATION · 159 YEARS" subhead beneath; italic "DOMINION OF CANADA · JULY 1, 1867 · OTTAWA" tertiary along the bottom. Palette: Canadian red #d52b1e, bone-white, night indigo, Peace Tower slate, firework gold and rose, aurora teal, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: Canada Day 2026, 159th anniversary of Canadian Confederation, with a Canadian flag banner, a pulsing red maple leaf, the Peace Tower silhouette, and fireworks over Ottawa">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#141a2a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="redBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e53826"/>
      <stop offset="0.5" stop-color="#d52b1e"/>
      <stop offset="1" stop-color="#a51a12"/>
    </linearGradient>
    <linearGradient id="whitePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#e6e0d0"/>
    </linearGradient>
    <radialGradient id="leafGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ff5a3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d52b1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0d0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ff4630" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d52b1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffd45a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c07018" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireWhite" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#e8f0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6fa8d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- stylized 11-point Canadian maple leaf -->
    <symbol id="mapleLeaf" viewBox="-50 -55 100 110">
      <path d="M 0 -48
               L 6 -30
               L 22 -34
               L 15 -18
               L 32 -14
               L 26 -4
               L 44 4
               L 32 8
               L 38 22
               L 20 20
               L 22 34
               L 8 26
               L 4 46
               L -4 46
               L -8 26
               L -22 34
               L -20 20
               L -38 22
               L -32 8
               L -44 4
               L -26 -4
               L -32 -14
               L -15 -18
               L -22 -34
               L -6 -30
               Z" fill="#d52b1e"/>
    </symbol>
  </defs>

  <!-- night sky background -->
  <rect width="800" height="200" fill="url(#nightSky)"/>

  <!-- faint aurora ribbon -->
  <g opacity="0.35" filter="url(#softGlow)">
    <path d="M 0 30 Q 200 12 400 30 T 800 28" stroke="#3fbfa8" stroke-width="2" fill="none" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 42 Q 220 22 420 40 T 800 40" stroke="#5adfc0" stroke-width="1.5" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- starfield -->
  <g fill="#e8edf5">
    <circle cx="30" cy="18" r="0.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="52" r="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="14" r="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="65" r="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="20" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="52" r="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="18" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="55" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="70" r="0.4"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="35" r="0.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- FLAG BANNER: two red bands + center white panel spanning much of the composition -->
  <g>
    <!-- left red band -->
    <rect x="20" y="30" width="130" height="140" fill="url(#redBand)"/>
    <!-- center white panel (double width, per Canadian flag proportions) -->
    <rect x="150" y="30" width="260" height="140" fill="url(#whitePanel)"/>
    <!-- right red band -->
    <rect x="410" y="30" width="130" height="140" fill="url(#redBand)"/>
    <!-- subtle banner shadow at top and bottom for depth -->
    <rect x="20" y="30" width="520" height="3" fill="#000" opacity="0.25"/>
    <rect x="20" y="167" width="520" height="3" fill="#000" opacity="0.25"/>

    <!-- gentle wave animation via transform origin along vertical center -->
    <g style="transform-origin: 280px 100px; transform-box: fill-box;">
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.015;1 1" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- leaf glow behind the maple leaf -->
    <ellipse cx="280" cy="108" rx="70" ry="55" fill="url(#leafGlow)">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Maple leaf at center-white panel, slightly enlarged, with subtle breathing pulse -->
    <g transform="translate(280, 108)">
      <g style="transform-origin: center; transform-box: fill-box;">
        <animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="11s" repeatCount="indefinite"/>
        <use href="#mapleLeaf" x="-42" y="-46" width="84" height="92"/>
      </g>
    </g>
  </g>

  <!-- Peace Tower silhouette (Ottawa Parliament Hill) at right of the flag -->
  <g transform="translate(600, 30)">
    <!-- main tower shaft -->
    <rect x="30" y="45" width="40" height="115" fill="#1c2230"/>
    <rect x="30" y="45" width="40" height="115" fill="#2a3244" opacity="0.7"/>
    <!-- window band (illuminated) -->
    <g fill="#ffd680" opacity="0.85">
      <rect x="35" y="70" width="4" height="6"/>
      <rect x="43" y="70" width="4" height="6"/>
      <rect x="51" y="70" width="4" height="6"/>
      <rect x="59" y="70" width="4" height="6"/>
      <rect x="35" y="85" width="4" height="6"/>
      <rect x="43" y="85" width="4" height="6"/>
      <rect x="51" y="85" width="4" height="6"/>
      <rect x="59" y="85" width="4" height="6"/>
    </g>
    <!-- clock face -->
    <circle cx="50" cy="55" r="7" fill="#f0e0a8"/>
    <circle cx="50" cy="55" r="7" fill="none" stroke="#1c2230" stroke-width="0.8"/>
    <line x1="50" y1="55" x2="50" y2="50" stroke="#1c2230" stroke-width="0.9"/>
    <line x1="50" y1="55" x2="53" y2="55" stroke="#1c2230" stroke-width="0.9"/>
    <!-- clock face glow -->
    <circle cx="50" cy="55" r="10" fill="#f0e0a8" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.35;0.15" dur="13s" repeatCount="indefinite"/>
    </circle>
    <!-- copper-green peaked roof -->
    <path d="M 25 45 L 50 8 L 75 45 Z" fill="#3a6b5a"/>
    <path d="M 30 45 L 50 15 L 70 45 Z" fill="#4a836e" opacity="0.7"/>
    <!-- spire -->
    <line x1="50" y1="8" x2="50" y2="-2" stroke="#3a6b5a" stroke-width="1.5"/>
    <circle cx="50" cy="-2" r="1.5" fill="#e8d068"/>
    <!-- base parliament ledge -->
    <rect x="15" y="155" width="70" height="15" fill="#1c2230"/>
  </g>

  <!-- Fireworks bursts above the tower -->
  <g filter="url(#softGlow)">
    <!-- burst 1: red, upper right -->
    <g transform="translate(660, 45)">
      <circle r="0" fill="url(#fireRed)">
        <animate attributeName="r" values="0;22;0" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.35;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#ff5a3a" stroke-width="0.8" fill="none" opacity="0.9">
        <g>
          <line x1="0" y1="0" x2="0" y2="-14"/>
          <line x1="0" y1="0" x2="10" y2="-10"/>
          <line x1="0" y1="0" x2="14" y2="0"/>
          <line x1="0" y1="0" x2="10" y2="10"/>
          <line x1="0" y1="0" x2="0" y2="14"/>
          <line x1="0" y1="0" x2="-10" y2="10"/>
          <line x1="0" y1="0" x2="-14" y2="0"/>
          <line x1="0" y1="0" x2="-10" y2="-10"/>
          <animateTransform attributeName="transform" type="scale" values="0.1;1.6;0.1" keyTimes="0;0.4;1" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="7s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- burst 2: white/blue, top center-right -->
    <g transform="translate(720, 25)">
      <circle r="0" fill="url(#fireWhite)">
        <animate attributeName="r" values="0;16;0" keyTimes="0;0.4;1" dur="11s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="11s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#e8f0ff" stroke-width="0.7" fill="none" opacity="0.9">
        <g>
          <line x1="0" y1="0" x2="0" y2="-12"/>
          <line x1="0" y1="0" x2="8" y2="-8"/>
          <line x1="0" y1="0" x2="12" y2="0"/>
          <line x1="0" y1="0" x2="8" y2="8"/>
          <line x1="0" y1="0" x2="0" y2="12"/>
          <line x1="0" y1="0" x2="-8" y2="8"/>
          <line x1="0" y1="0" x2="-12" y2="0"/>
          <line x1="0" y1="0" x2="-8" y2="-8"/>
          <animateTransform attributeName="transform" type="scale" values="0.1;1.5;0.1" keyTimes="0;0.4;1" dur="11s" begin="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="11s" begin="2s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- burst 3: gold, upper-left of tower -->
    <g transform="translate(590, 35)">
      <circle r="0" fill="url(#fireGold)">
        <animate attributeName="r" values="0;20;0" keyTimes="0;0.4;1" dur="13s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="13s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#ffd45a" stroke-width="0.7" fill="none" opacity="0.9">
        <g>
          <line x1="0" y1="0" x2="0" y2="-14"/>
          <line x1="0" y1="0" x2="10" y2="-10"/>
          <line x1="0" y1="0" x2="14" y2="0"/>
          <line x1="0" y1="0" x2="10" y2="10"/>
          <line x1="0" y1="0" x2="0" y2="14"/>
          <line x1="0" y1="0" x2="-10" y2="10"/>
          <line x1="0" y1="0" x2="-14" y2="0"/>
          <line x1="0" y1="0" x2="-10" y2="-10"/>
          <animateTransform attributeName="transform" type="scale" values="0.1;1.7;0.1" keyTimes="0;0.4;1" dur="13s" begin="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="13s" begin="4s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>

  <!-- drifting maple leaves (small, background layer) -->
  <g opacity="0.6">
    <g transform="translate(0, 0)">
      <use href="#mapleLeaf" x="-6" y="-6" width="12" height="12" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="80,-10; 60,180" dur="17s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="11s" additive="sum" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(0, 0)">
      <use href="#mapleLeaf" x="-5" y="-5" width="10" height="10" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="500,-8; 470,190" dur="19s" begin="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="13s" additive="sum" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(0, 0)">
      <use href="#mapleLeaf" x="-4" y="-4" width="8" height="8" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="750,-6; 740,190" dur="23s" begin="1.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" additive="sum" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- HEADLINE — on the white panel of the flag -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" filter="url(#textShadow)">
    <text x="280" y="58" font-size="26" font-weight="900" fill="#111418" text-anchor="middle" letter-spacing="3">JULY 1, 2026</text>
    <text x="280" y="74" font-size="9" font-weight="800" fill="#a51a12" text-anchor="middle" letter-spacing="3.2">CANADA DAY · CONFEDERATION · 159 YEARS</text>
  </g>

  <!-- tertiary along the bottom (below the flag) -->
  <text x="400" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-style="italic" fill="#8fa0b8" text-anchor="middle" letter-spacing="2.5">DOMINION OF CANADA · JULY 1, 1867 · OTTAWA</text>
</svg>
