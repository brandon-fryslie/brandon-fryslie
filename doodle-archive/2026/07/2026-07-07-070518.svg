<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Lennon meets McCartney (July 6, 1957 — St. Peter's Church garden fete, Woolton, Liverpool) — 69th anniversary of the day 16-year-old John Lennon's skiffle group The Quarrymen played the church fete and 15-year-old Paul McCartney was introduced backstage; two weeks later John invited Paul to join. This is the origin point of The Beatles. Tableau: a warm English summer afternoon at a Liverpool church fete — St. Peter's stone church silhouette with steeple at right, colorful bunting triangles strung across the sky, a low wooden fete stage at center with two guitars leaning against a mic stand, a tea urn and cake stand at left, floating musical notes rising from the stage, a distant crowd of tiny figures at the base, and a big warm-cream "JULY 6, 2026" headline anchoring the sky. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: 69th anniversary of the day John Lennon and Paul McCartney first met at the St. Peter's Church garden fete in Woolton, Liverpool on July 6, 1957 — the origin of The Beatles. A warm English summer afternoon at a village church fete: rolling green churchyard grass at the base, St. Peter's Church silhouette with square Norman tower at right, colorful triangular bunting strung across a golden-blue sky, a small wooden fete stage at center with two guitars (one acoustic, one hollow-body) leaning against a vintage mic stand, a tea urn and a tiered cake stand at left, floating musical eighth notes and quarter notes rising from the stage, a distant crowd of tiny figures along the base, drifting summer clouds. Large warm-cream JULY 6, 2026 headline dominates the upper center, red WOOLTON · LIVERPOOL · WHERE THE BEATLES BEGAN subhead beneath, and italic silver ST. PETER'S CHURCH FETE · LENNON MEETS McCARTNEY · JULY 6, 1957 tertiary along the very bottom edge.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.15" stop-color="#1e2a4a"/>
      <stop offset="0.5" stop-color="#c07a3a"/>
      <stop offset="0.85" stop-color="#f4c96b"/>
      <stop offset="1" stop-color="#f8d98c"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7a3a"/>
      <stop offset="1" stop-color="#1c3a1e"/>
    </linearGradient>
    <linearGradient id="stageWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#3e2a15"/>
    </linearGradient>
    <linearGradient id="titleCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.55" stop-color="#f7e8a8"/>
      <stop offset="1" stop-color="#d4a548"/>
    </linearGradient>
    <linearGradient id="guitarBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b76c"/>
      <stop offset="1" stop-color="#8a5624"/>
    </linearGradient>
    <linearGradient id="guitarBody2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c22b2b"/>
      <stop offset="1" stop-color="#6a1616"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#f4c96b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f4c96b" stop-opacity="0"/>
    </radialGradient>
    <filter id="titleGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Reusable musical eighth note -->
    <symbol id="note" overflow="visible">
      <ellipse cx="0" cy="0" rx="3.4" ry="2.4" transform="rotate(-18)" fill="#fff6d8"/>
      <rect x="2.6" y="-14" width="1.4" height="14" fill="#fff6d8"/>
      <path d="M 4 -14 Q 12 -12 10 -4" stroke="#fff6d8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </symbol>
    <!-- Reusable quarter note -->
    <symbol id="qnote" overflow="visible">
      <ellipse cx="0" cy="0" rx="3.4" ry="2.4" transform="rotate(-18)" fill="#fff6d8"/>
      <rect x="2.6" y="-14" width="1.4" height="14" fill="#fff6d8"/>
    </symbol>

    <!-- Tiny crowd figure silhouette -->
    <symbol id="person" overflow="visible">
      <circle cx="0" cy="-8" r="1.6" fill="#1a1108"/>
      <rect x="-1.6" y="-6" width="3.2" height="6" rx="0.6" fill="#1a1108"/>
    </symbol>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Warm summer sun halo -->
  <g transform="translate(120,58)">
    <circle r="34" fill="url(#sunGlow)"/>
    <circle r="12" fill="#fff4c2" opacity="0.85">
      <animate attributeName="r" values="12;13.5;12" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Drifting clouds -->
  <g fill="#fff6d8" opacity="0.72">
    <g>
      <ellipse cx="0" cy="0" rx="18" ry="6"/>
      <ellipse cx="-10" cy="-3" rx="10" ry="5"/>
      <ellipse cx="10" cy="-2" rx="12" ry="5"/>
      <animateTransform attributeName="transform" type="translate" values="230,40;280,42;230,40" dur="41s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.55">
      <ellipse cx="0" cy="0" rx="14" ry="5"/>
      <ellipse cx="-8" cy="-2" rx="8" ry="4"/>
      <ellipse cx="9" cy="-1" rx="10" ry="4"/>
      <animateTransform attributeName="transform" type="translate" values="540,28;480,30;540,28" dur="53s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== ST. PETER'S CHURCH silhouette, right ===== -->
  <g transform="translate(640,90)" fill="#2a2436">
    <!-- Nave -->
    <rect x="0" y="20" width="90" height="60"/>
    <!-- Roof line -->
    <polygon points="0,20 90,20 84,14 6,14"/>
    <!-- Square Norman tower -->
    <rect x="-40" y="0" width="36" height="80"/>
    <!-- Crenellations on tower -->
    <rect x="-40" y="-4" width="6" height="6"/>
    <rect x="-30" y="-4" width="6" height="6"/>
    <rect x="-20" y="-4" width="6" height="6"/>
    <rect x="-10" y="-4" width="6" height="6"/>
    <!-- Arched windows on tower -->
    <path d="M -32 22 h 8 v 12 a 4 4 0 0 0 -8 0 z" fill="#f4c96b" opacity="0.85"/>
    <path d="M -18 22 h 8 v 12 a 4 4 0 0 0 -8 0 z" fill="#f4c96b" opacity="0.85"/>
    <!-- Nave windows -->
    <g fill="#f4c96b" opacity="0.85">
      <path d="M 10 34 h 6 v 12 a 3 3 0 0 0 -6 0 z"/>
      <path d="M 26 34 h 6 v 12 a 3 3 0 0 0 -6 0 z"/>
      <path d="M 42 34 h 6 v 12 a 3 3 0 0 0 -6 0 z"/>
      <path d="M 58 34 h 6 v 12 a 3 3 0 0 0 -6 0 z"/>
      <path d="M 74 34 h 6 v 12 a 3 3 0 0 0 -6 0 z"/>
    </g>
    <!-- Door -->
    <path d="M 42 62 h 10 v 18 a 5 5 0 0 0 -10 0 z" fill="#1a1108"/>
    <!-- Small cross on tower -->
    <rect x="-24" y="-14" width="2" height="10" fill="#2a2436"/>
    <rect x="-26" y="-11" width="6" height="2" fill="#2a2436"/>
  </g>

  <!-- ===== BUNTING (colorful triangles strung across the sky) ===== -->
  <g>
    <!-- Rope curve -->
    <path d="M 20 40 Q 200 60 400 45 T 780 40" stroke="#5a3a1e" stroke-width="0.6" fill="none" opacity="0.7"/>
    <!-- Triangular flags -->
    <g stroke="#3e2a15" stroke-width="0.3">
      <polygon points="30,42 44,42 37,54" fill="#d94b4b">
        <animateTransform attributeName="transform" type="rotate" values="-4 37 42;4 37 42;-4 37 42" dur="7s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="52,44 66,44 59,56" fill="#f4c96b">
        <animateTransform attributeName="transform" type="rotate" values="4 59 44;-4 59 44;4 59 44" dur="11s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="74,46 88,46 81,58" fill="#3a7ac4">
        <animateTransform attributeName="transform" type="rotate" values="-4 81 46;4 81 46;-4 81 46" dur="13s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="96,48 110,48 103,60" fill="#4ea652">
        <animateTransform attributeName="transform" type="rotate" values="4 103 48;-4 103 48;4 103 48" dur="7s" begin="0.5s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="118,50 132,50 125,62" fill="#d94b4b">
        <animateTransform attributeName="transform" type="rotate" values="-4 125 50;4 125 50;-4 125 50" dur="11s" begin="1s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="140,51 154,51 147,63" fill="#f4c96b">
        <animateTransform attributeName="transform" type="rotate" values="4 147 51;-4 147 51;4 147 51" dur="13s" begin="1.5s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="162,52 176,52 169,64" fill="#3a7ac4">
        <animateTransform attributeName="transform" type="rotate" values="-4 169 52;4 169 52;-4 169 52" dur="7s" begin="2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="184,54 198,54 191,66" fill="#4ea652">
        <animateTransform attributeName="transform" type="rotate" values="4 191 54;-4 191 54;4 191 54" dur="11s" begin="2.5s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="206,54 220,54 213,66" fill="#d94b4b">
        <animateTransform attributeName="transform" type="rotate" values="-4 213 54;4 213 54;-4 213 54" dur="13s" begin="0.3s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="228,54 242,54 235,66" fill="#f4c96b">
        <animateTransform attributeName="transform" type="rotate" values="4 235 54;-4 235 54;4 235 54" dur="7s" begin="0.8s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="560,44 574,44 567,56" fill="#d94b4b">
        <animateTransform attributeName="transform" type="rotate" values="-4 567 44;4 567 44;-4 567 44" dur="11s" begin="1.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="582,43 596,43 589,55" fill="#3a7ac4">
        <animateTransform attributeName="transform" type="rotate" values="4 589 43;-4 589 43;4 589 43" dur="13s" begin="1.7s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="604,42 618,42 611,54" fill="#f4c96b">
        <animateTransform attributeName="transform" type="rotate" values="-4 611 42;4 611 42;-4 611 42" dur="7s" begin="2.2s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="626,41 640,41 633,53" fill="#4ea652">
        <animateTransform attributeName="transform" type="rotate" values="4 633 41;-4 633 41;4 633 41" dur="11s" begin="2.7s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="720,40 734,40 727,52" fill="#d94b4b">
        <animateTransform attributeName="transform" type="rotate" values="-4 727 40;4 727 40;-4 727 40" dur="13s" begin="0.6s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="742,40 756,40 749,52" fill="#f4c96b">
        <animateTransform attributeName="transform" type="rotate" values="4 749 40;-4 749 40;4 749 40" dur="7s" begin="1.1s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="764,40 778,40 771,52" fill="#3a7ac4">
        <animateTransform attributeName="transform" type="rotate" values="-4 771 40;4 771 40;-4 771 40" dur="11s" begin="1.6s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- ===== GRASS GROUND ===== -->
  <path d="M 0 158 Q 200 152 400 156 T 800 158 L 800 200 L 0 200 Z" fill="url(#grass)"/>

  <!-- Grass tufts -->
  <g stroke="#6b9a3a" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 40 178 L 40 172 M 42 178 L 44 173 M 38 178 L 36 173"/>
    <path d="M 100 182 L 100 176 M 102 182 L 104 177 M 98 182 L 96 177"/>
    <path d="M 200 180 L 200 174 M 202 180 L 204 175 M 198 180 L 196 175"/>
    <path d="M 340 184 L 340 178 M 342 184 L 344 179 M 338 184 L 336 179"/>
    <path d="M 520 182 L 520 176 M 522 182 L 524 177 M 518 182 L 516 177"/>
    <path d="M 700 180 L 700 174 M 702 180 L 704 175 M 698 180 L 696 175"/>
  </g>

  <!-- ===== TINY CROWD along base ===== -->
  <g>
    <use href="#person" x="60" y="182"/>
    <use href="#person" x="80" y="184"/>
    <use href="#person" x="105" y="183"/>
    <use href="#person" x="145" y="185"/>
    <use href="#person" x="170" y="184"/>
    <use href="#person" x="195" y="186"/>
    <use href="#person" x="235" y="185"/>
    <use href="#person" x="260" y="187"/>
    <use href="#person" x="500" y="185"/>
    <use href="#person" x="525" y="184"/>
    <use href="#person" x="555" y="186"/>
    <use href="#person" x="590" y="184"/>
    <use href="#person" x="620" y="186"/>
  </g>

  <!-- ===== FETE STAGE (center) ===== -->
  <g transform="translate(400,168)" filter="url(#drop)">
    <!-- Stage platform -->
    <rect x="-70" y="0" width="140" height="18" fill="url(#stageWood)"/>
    <!-- Front board planks -->
    <line x1="-70" y1="6" x2="70" y2="6" stroke="#2a1a08" stroke-width="0.5"/>
    <line x1="-70" y1="12" x2="70" y2="12" stroke="#2a1a08" stroke-width="0.5"/>
    <!-- Stage skirt (bunting) -->
    <path d="M -70 18 L -60 24 L -50 18 L -40 24 L -30 18 L -20 24 L -10 18 L 0 24 L 10 18 L 20 24 L 30 18 L 40 24 L 50 18 L 60 24 L 70 18 Z" fill="#c22b2b" opacity="0.9"/>

    <!-- Microphone stand -->
    <rect x="-1" y="-32" width="2" height="32" fill="#c8d4e0"/>
    <ellipse cx="0" cy="18" rx="8" ry="1.5" fill="#3a3a44"/>
    <!-- Mic head -->
    <ellipse cx="0" cy="-36" rx="4" ry="5" fill="#3a3a44"/>
    <circle cx="0" cy="-36" r="2.5" fill="#1a1a24"/>

    <!-- Acoustic guitar leaning left -->
    <g transform="translate(-32,-4) rotate(-14)">
      <!-- Body -->
      <ellipse cx="0" cy="6" rx="12" ry="16" fill="url(#guitarBody)"/>
      <ellipse cx="0" cy="-4" rx="8" ry="10" fill="url(#guitarBody)"/>
      <!-- Sound hole -->
      <circle cx="0" cy="4" r="3" fill="#1a1108"/>
      <!-- Bridge -->
      <rect x="-5" y="10" width="10" height="1.6" fill="#3e2a15"/>
      <!-- Neck -->
      <rect x="-1.6" y="-30" width="3.2" height="18" fill="#6a4a2a"/>
      <!-- Headstock -->
      <rect x="-3" y="-34" width="6" height="5" fill="#3e2a15"/>
      <!-- Strings (subtle) -->
      <line x1="-1" y1="-30" x2="-1" y2="10" stroke="#f5efd8" stroke-width="0.3" opacity="0.7"/>
      <line x1="0" y1="-30" x2="0" y2="10" stroke="#f5efd8" stroke-width="0.3" opacity="0.7"/>
      <line x1="1" y1="-30" x2="1" y2="10" stroke="#f5efd8" stroke-width="0.3" opacity="0.7"/>
    </g>

    <!-- Red hollow-body guitar leaning right -->
    <g transform="translate(32,-4) rotate(14)">
      <ellipse cx="0" cy="6" rx="11" ry="14" fill="url(#guitarBody2)"/>
      <ellipse cx="0" cy="-4" rx="7" ry="9" fill="url(#guitarBody2)"/>
      <!-- f-hole -->
      <path d="M -4 2 Q -6 6 -4 10" stroke="#1a0808" stroke-width="1.2" fill="none"/>
      <path d="M 4 2 Q 6 6 4 10" stroke="#1a0808" stroke-width="1.2" fill="none"/>
      <!-- Pickguard -->
      <path d="M 2 -2 L 6 6 L 4 12 L 0 8 Z" fill="#f5efd8" opacity="0.8"/>
      <!-- Bridge -->
      <rect x="-4" y="10" width="8" height="1.6" fill="#3a2a15"/>
      <!-- Neck -->
      <rect x="-1.6" y="-30" width="3.2" height="18" fill="#3e2a15"/>
      <!-- Headstock -->
      <rect x="-3" y="-34" width="6" height="5" fill="#1a1108"/>
    </g>

    <!-- Stage legs -->
    <rect x="-66" y="18" width="4" height="6" fill="#2a1a08"/>
    <rect x="62" y="18" width="4" height="6" fill="#2a1a08"/>
  </g>

  <!-- ===== TEA URN & CAKE STAND (left) ===== -->
  <g transform="translate(80,158)">
    <!-- Table -->
    <rect x="-40" y="20" width="80" height="3" fill="#5a3a1e"/>
    <rect x="-38" y="23" width="3" height="12" fill="#5a3a1e"/>
    <rect x="35" y="23" width="3" height="12" fill="#5a3a1e"/>
    <!-- Tea urn (silver, left) -->
    <rect x="-32" y="4" width="18" height="16" rx="2" fill="#c8d4e0"/>
    <rect x="-30" y="0" width="14" height="6" rx="1.5" fill="#c8d4e0"/>
    <circle cx="-23" cy="-2" r="2" fill="#c8d4e0"/>
    <!-- Spout -->
    <path d="M -14 10 L -8 12 L -8 14 L -14 14 Z" fill="#c8d4e0"/>
    <!-- Handle -->
    <path d="M -32 8 Q -38 12 -32 16" stroke="#c8d4e0" stroke-width="1.4" fill="none"/>
    <!-- Steam -->
    <g stroke="#fff6d8" stroke-width="1" fill="none" opacity="0.8">
      <path d="M -23 -4 Q -21 -8 -23 -12 Q -25 -16 -23 -20">
        <animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M -18 -4 Q -16 -8 -18 -12 Q -20 -16 -18 -20">
        <animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 3-tier cake stand (right of urn) -->
    <g transform="translate(20,0)">
      <!-- Center pole -->
      <rect x="-0.8" y="-16" width="1.6" height="36" fill="#c8d4e0"/>
      <!-- Bottom tier -->
      <ellipse cx="0" cy="20" rx="14" ry="2" fill="#f5efd8"/>
      <rect x="-12" y="16" width="24" height="4" rx="1" fill="#f5b8c8"/>
      <!-- Middle tier -->
      <ellipse cx="0" cy="8" rx="10" ry="1.6" fill="#f5efd8"/>
      <rect x="-8" y="4" width="16" height="4" rx="1" fill="#d4a548"/>
      <!-- Top tier (cupcake) -->
      <ellipse cx="0" cy="-6" rx="7" ry="1.4" fill="#f5efd8"/>
      <path d="M -5 -6 L -3 -14 L 3 -14 L 5 -6 Z" fill="#e8b76c"/>
      <circle cx="0" cy="-14" r="2" fill="#d94b4b"/>
    </g>
  </g>

  <!-- ===== FLOATING MUSICAL NOTES (drift near stage, kept below subhead) ===== -->
  <g>
    <g>
      <use href="#note" x="330" y="156"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-6,-14;0,0" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#qnote" x="470" y="156"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;8,-16;2,-2" dur="13s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="13s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#note" x="310" y="164"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-8,-18;-2,-4" dur="7s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="3s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#qnote" x="490" y="164"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;6,-16;-2,-2" dur="13s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="13s" begin="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== HEADLINE ===== -->
  <ellipse cx="400" cy="82" rx="270" ry="26" fill="#0d1117" opacity="0.42"/>
  <text x="400" y="92" font-family="'Georgia', 'Times New Roman', serif" font-size="44" font-weight="900" letter-spacing="5" text-anchor="middle" fill="url(#titleCream)" filter="url(#titleGlow)">JULY 6, 2026</text>

  <!-- Deco flourish under headline -->
  <g stroke="#f7e8a8" stroke-width="1" fill="none" opacity="0.75">
    <line x1="270" y1="104" x2="360" y2="104"/>
    <line x1="440" y1="104" x2="530" y2="104"/>
    <circle cx="400" cy="104" r="2" fill="#f7e8a8" stroke="none"/>
  </g>

  <!-- Subhead -->
  <text x="400" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="3.5" text-anchor="middle" fill="#f4c96b">WOOLTON  ·  LIVERPOOL  ·  WHERE THE BEATLES BEGAN</text>

  <!-- ===== TERTIARY italic line ===== -->
  <text x="400" y="199" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" font-style="italic" letter-spacing="2.2" text-anchor="middle" fill="#e8dcc4">ST. PETER'S CHURCH FETE  ·  LENNON MEETS McCARTNEY  ·  JULY 6, 1957</text>

</svg>
