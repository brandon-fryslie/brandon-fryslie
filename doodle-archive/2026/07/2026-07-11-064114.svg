<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Nikola Tesla's 170th birthday (July 10, 1856, Smiljan, Austrian Empire — modern-day Croatia). Inventor, electrical engineer, futurist; alternating current, induction motor, Tesla coil, wireless power dreams. Visualized as a high-voltage laboratory tableau: a towering copper-and-brass Tesla coil dominates the center-right with a bright toroidal top electrode from which crackling violet lightning arcs branch outward across a deep-indigo laboratory sky, an oscilloscope-style AC sine wave sweeps across the base, a slow-spinning induction rotor disc glows on the left, floating glass Geissler tubes drift around the frame casting a soft magenta glow, twinkling ozone particles, and a large bone-white JULY 10, 2026 headline dominating the upper center with a violet-cyan NIKOLA TESLA · 170 YEARS · BORN JULY 10, 1856 subhead beneath, and italic SMILJAN · AUSTRIAN EMPIRE · WIZARD OF THE WEST tertiary line along the very bottom edge. Palette: coil copper #b87333 and brass #d4a24a, toroid silver #e8ecf2, arc violet #b26cff and electric cyan #7fefff, sine-wave lime #a3ff9d, Geissler magenta #ff5cb2, ozone bone-white #f5efe6, deep indigo lab #0e1330 and #141a3a, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 10, 2026 — 170th birthday of Nikola Tesla, born July 10, 1856 in Smiljan. A high-voltage laboratory tableau: a towering copper-and-brass Tesla coil at center-right with a bright silver toroidal top electrode from which crackling violet lightning arcs branch outward across a deep-indigo laboratory sky, an animated lime-green AC sine wave sweeps across the base, a slow-spinning induction rotor disc glows on the left, floating magenta Geissler tubes drift around the frame casting a soft glow, twinkling ozone particles, a large bone-white JULY 10, 2026 headline dominating the upper center, a violet-cyan NIKOLA TESLA · 170 YEARS · BORN JULY 10, 1856 subhead beneath, and italic SMILJAN · AUSTRIAN EMPIRE · WIZARD OF THE WEST tertiary along the bottom edge.">
  <defs>
    <!-- Deep indigo lab sky -->
    <linearGradient id="labSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#0e1330"/>
    </linearGradient>

    <!-- Copper coil body gradient -->
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b3d1a"/>
      <stop offset="45%" stop-color="#b87333"/>
      <stop offset="55%" stop-color="#e6a668"/>
      <stop offset="100%" stop-color="#6b3d1a"/>
    </linearGradient>

    <!-- Brass base -->
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a24a"/>
      <stop offset="100%" stop-color="#6b4a1a"/>
    </linearGradient>

    <!-- Silver toroid -->
    <radialGradient id="toroid" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e8ecf2"/>
      <stop offset="100%" stop-color="#7a8a99"/>
    </radialGradient>

    <!-- Toroid inner ring (darker) -->
    <radialGradient id="toroidInner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#141a3a"/>
      <stop offset="100%" stop-color="#3a4a66"/>
    </radialGradient>

    <!-- Arc glow -->
    <radialGradient id="arcGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e6d0ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#b26cff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b26cff" stop-opacity="0"/>
    </radialGradient>

    <!-- Geissler tube glow -->
    <radialGradient id="geissler" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb8de"/>
      <stop offset="60%" stop-color="#ff5cb2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff5cb2" stop-opacity="0"/>
    </radialGradient>

    <!-- Rotor disc -->
    <radialGradient id="rotor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7fefff"/>
      <stop offset="55%" stop-color="#2a6a8a"/>
      <stop offset="100%" stop-color="#0e1330"/>
    </radialGradient>

    <!-- Text glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="arcBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- Sine wave path -->
    <path id="sineWave" d="M 0 172 Q 25 152 50 172 T 100 172 T 150 172 T 200 172 T 250 172 T 300 172 T 350 172 T 400 172 T 450 172 T 500 172 T 550 172 T 600 172 T 650 172 T 700 172 T 750 172 T 800 172"/>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="200" fill="url(#labSky)"/>

  <!-- Distant ozone particles (twinkling stars) -->
  <g fill="#f5efe6">
    <circle cx="60" cy="40" r="0.9" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="22" r="0.7" opacity="0.5">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="55" r="0.8" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="30" r="0.9" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="70" r="0.7" opacity="0.5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="18" r="0.6" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="13s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="15" r="0.6" opacity="0.6">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="45" r="0.5" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="11s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floor line -->
  <line x1="0" y1="185" x2="800" y2="185" stroke="#2a3454" stroke-width="1" opacity="0.6"/>

  <!-- AC sine wave running along base (electric lime green) -->
  <g opacity="0.85">
    <use href="#sineWave" fill="none" stroke="#a3ff9d" stroke-width="1.4" opacity="0.9" filter="url(#softGlow)">
      <animate attributeName="stroke-dasharray" values="0 1600;1600 0" dur="11s" repeatCount="indefinite"/>
    </use>
    <use href="#sineWave" fill="none" stroke="#4bd648" stroke-width="0.6" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 0" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Induction rotor disc, left side -->
  <g transform="translate(115, 130)">
    <!-- outer stator ring -->
    <circle r="34" fill="none" stroke="#6b4a1a" stroke-width="3" opacity="0.8"/>
    <circle r="34" fill="none" stroke="#d4a24a" stroke-width="1" opacity="0.7"/>
    <!-- spinning rotor -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      <circle r="28" fill="url(#rotor)"/>
      <!-- rotor bars -->
      <g stroke="#7fefff" stroke-width="1.6" opacity="0.85" fill="none">
        <line x1="-24" y1="0" x2="24" y2="0"/>
        <line x1="0" y1="-24" x2="0" y2="24"/>
        <line x1="-17" y1="-17" x2="17" y2="17"/>
        <line x1="-17" y1="17" x2="17" y2="-17"/>
      </g>
      <circle r="4" fill="#0e1330" stroke="#7fefff" stroke-width="1"/>
    </g>
    <!-- pulsing halo -->
    <circle r="40" fill="none" stroke="#7fefff" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="38;46;38" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="11s" repeatCount="indefinite"/>
    </circle>
    <!-- base plinth -->
    <rect x="-30" y="34" width="60" height="6" fill="url(#brass)"/>
  </g>

  <!-- Geissler tubes drifting (magenta glow orbs with tube glint) -->
  <g>
    <g transform="translate(50,90)">
      <ellipse cx="0" cy="0" rx="14" ry="5" fill="url(#geissler)"/>
      <ellipse cx="0" cy="0" rx="9" ry="2.4" fill="#ffb8de" opacity="0.9"/>
      <animateTransform attributeName="transform" type="translate" values="50,90;60,80;50,90" dur="13s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(260,60)">
      <ellipse cx="0" cy="0" rx="16" ry="5" fill="url(#geissler)" transform="rotate(20)"/>
      <ellipse cx="0" cy="0" rx="10" ry="2.4" fill="#ffb8de" opacity="0.9" transform="rotate(20)"/>
      <animateTransform attributeName="transform" type="translate" values="260,60;250,50;260,60" dur="11s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(720,110)">
      <ellipse cx="0" cy="0" rx="12" ry="4" fill="url(#geissler)" transform="rotate(-15)"/>
      <ellipse cx="0" cy="0" rx="7" ry="2" fill="#ffb8de" opacity="0.9" transform="rotate(-15)"/>
      <animateTransform attributeName="transform" type="translate" values="720,110;730,120;720,110" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Tesla Coil (center-right) -->
  <g transform="translate(560,0)">
    <!-- brass base plinth -->
    <rect x="-45" y="170" width="90" height="15" fill="url(#brass)" stroke="#4a2e10" stroke-width="0.6"/>
    <rect x="-52" y="180" width="104" height="5" fill="#3a2410"/>
    <!-- lower secondary coil form (tall cylinder) -->
    <rect x="-18" y="70" width="36" height="100" fill="#2a2018" stroke="#6b4a1a" stroke-width="0.6"/>
    <!-- copper windings (many thin horizontal lines) -->
    <g stroke="url(#copper)" stroke-width="1.2">
      <line x1="-18" y1="72" x2="18" y2="72"/>
      <line x1="-18" y1="76" x2="18" y2="76"/>
      <line x1="-18" y1="80" x2="18" y2="80"/>
      <line x1="-18" y1="84" x2="18" y2="84"/>
      <line x1="-18" y1="88" x2="18" y2="88"/>
      <line x1="-18" y1="92" x2="18" y2="92"/>
      <line x1="-18" y1="96" x2="18" y2="96"/>
      <line x1="-18" y1="100" x2="18" y2="100"/>
      <line x1="-18" y1="104" x2="18" y2="104"/>
      <line x1="-18" y1="108" x2="18" y2="108"/>
      <line x1="-18" y1="112" x2="18" y2="112"/>
      <line x1="-18" y1="116" x2="18" y2="116"/>
      <line x1="-18" y1="120" x2="18" y2="120"/>
      <line x1="-18" y1="124" x2="18" y2="124"/>
      <line x1="-18" y1="128" x2="18" y2="128"/>
      <line x1="-18" y1="132" x2="18" y2="132"/>
      <line x1="-18" y1="136" x2="18" y2="136"/>
      <line x1="-18" y1="140" x2="18" y2="140"/>
      <line x1="-18" y1="144" x2="18" y2="144"/>
      <line x1="-18" y1="148" x2="18" y2="148"/>
      <line x1="-18" y1="152" x2="18" y2="152"/>
      <line x1="-18" y1="156" x2="18" y2="156"/>
      <line x1="-18" y1="160" x2="18" y2="160"/>
      <line x1="-18" y1="164" x2="18" y2="164"/>
      <line x1="-18" y1="168" x2="18" y2="168"/>
    </g>
    <!-- coil edges (curved suggestion of cylinder) -->
    <ellipse cx="0" cy="170" rx="18" ry="4" fill="#4a2e10" opacity="0.85"/>
    <ellipse cx="0" cy="70" rx="18" ry="4" fill="#8a5a25"/>

    <!-- support neck between secondary and toroid -->
    <rect x="-4" y="55" width="8" height="18" fill="#4a3620"/>

    <!-- Toroid (top electrode) -->
    <ellipse cx="0" cy="50" rx="52" ry="16" fill="url(#toroid)"/>
    <ellipse cx="0" cy="48" rx="42" ry="9" fill="url(#toroidInner)" opacity="0.85"/>
    <!-- highlight sheen on toroid -->
    <ellipse cx="-14" cy="45" rx="20" ry="3" fill="#ffffff" opacity="0.5"/>

    <!-- Corona glow around toroid -->
    <ellipse cx="0" cy="50" rx="70" ry="24" fill="url(#arcGlow)" opacity="0.55">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Lightning arcs branching from toroid -->
  <g stroke-linecap="round" fill="none" filter="url(#arcBlur)">
    <!-- arc left-far -->
    <path d="M 540 50 L 505 40 L 490 55 L 460 45 L 445 60 L 420 50" stroke="#b26cff" stroke-width="1.6" opacity="0.9">
      <animate attributeName="opacity" values="1;0.1;0.85;0.2;1" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 540 50 L 505 40 L 490 55 L 460 45 L 445 60 L 420 50" stroke="#e6d0ff" stroke-width="0.7" opacity="0.9">
      <animate attributeName="opacity" values="1;0;1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <!-- arc left-up -->
    <path d="M 550 45 L 530 25 L 510 32 L 490 18 L 470 26" stroke="#7fefff" stroke-width="1.4" opacity="0.85">
      <animate attributeName="opacity" values="0.1;1;0.2;0.9;0.1" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 550 45 L 530 25 L 510 32 L 490 18 L 470 26" stroke="#ffffff" stroke-width="0.5" opacity="0.9">
      <animate attributeName="opacity" values="0;1;0;1;0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <!-- arc right-far -->
    <path d="M 580 48 L 615 38 L 630 55 L 660 42 L 685 58 L 715 48" stroke="#b26cff" stroke-width="1.6" opacity="0.85">
      <animate attributeName="opacity" values="0.9;0.15;0.9;0.2;0.9" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 580 48 L 615 38 L 630 55 L 660 42 L 685 58 L 715 48" stroke="#e6d0ff" stroke-width="0.7" opacity="0.9">
      <animate attributeName="opacity" values="1;0;1;0;1" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <!-- arc right-up short -->
    <path d="M 572 42 L 590 22 L 610 30 L 630 20" stroke="#7fefff" stroke-width="1.4" opacity="0.9">
      <animate attributeName="opacity" values="0.2;1;0.15;0.9;0.2" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 572 42 L 590 22 L 610 30 L 630 20" stroke="#ffffff" stroke-width="0.5" opacity="0.9">
      <animate attributeName="opacity" values="0;1;0;1;0" dur="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- top short crackle -->
    <path d="M 560 40 L 555 20 L 565 12 L 558 4" stroke="#e6d0ff" stroke-width="1.2" opacity="0.9">
      <animate attributeName="opacity" values="0.2;1;0.1;1;0.2" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Little spark particles -->
  <g fill="#e6d0ff">
    <circle cx="470" cy="30" r="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="55" r="1">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="35" r="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="60" r="1">
      <animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HEADLINE: date -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- subtle backing plate behind headline for legibility -->
    <rect x="120" y="30" width="360" height="60" rx="4" fill="#0d1117" opacity="0.55"/>

    <text x="300" y="72" font-size="38" font-weight="800" letter-spacing="2" fill="#f5efe6" filter="url(#softGlow)">
      JULY 10, 2026
    </text>

    <!-- subhead -->
    <text x="300" y="98" font-size="12" font-weight="700" letter-spacing="3" fill="#b26cff">
      NIKOLA TESLA
      <tspan fill="#7fefff"> · 170 YEARS · </tspan>
      <tspan fill="#b26cff">BORN JULY 10, 1856</tspan>
    </text>

    <!-- tertiary -->
    <text x="400" y="196" font-size="8.5" font-style="italic" letter-spacing="2.5" fill="#a3b3c8" opacity="0.9">
      SMILJAN · AUSTRIAN EMPIRE · WIZARD OF THE WEST
    </text>
  </g>

</svg>
