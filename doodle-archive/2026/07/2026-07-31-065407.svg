<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: 96th Anniversary of the First FIFA World Cup Final (July 30, 1930) — Uruguay 4, Argentina 2 at Estadio Centenario in Montevideo. Uruguay hosted, and won on home soil, the inaugural FIFA World Cup. Only 13 national teams participated. Stadium capacity ~93,000. A stadium-night tableau on an 800x200 canvas: on the left, a large slowly-rotating black-and-white 1930s panel football with a warm rim-light and cast glow; behind it, a silhouetted crescent of the Estadio Centenario's arched stands with pinpoint golden crowd lights and a lit floodlight tower; wide sky-blue horizontal bands (Uruguay flag palette) sit as a background chorus; a small gold Jules Rimet-style trophy silhouette rises to the right of the ball; sky-blue and gold confetti drift down through the frame; a large cream JULY 30, 2026 headline dominates the right; a sky-blue FIRST WORLD CUP FINAL · 96 YEARS subhead; italic MONTEVIDEO · 30 JULY 1930 · URUGUAY 4 · ARGENTINA 2 · ESTADIO CENTENARIO tertiary. Palette: cobalt-night #0a1428, deep-navy #10203f, stadium-blue #1e3a6e, uruguay-blue #59b7e8, cream #f5efd8, ball-black #0a0a0a, trophy-gold #f2c94a, warm-gold #d4a94a. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 30, 2026 — 96th anniversary of the first FIFA World Cup Final (Uruguay 4, Argentina 2 at Estadio Centenario in Montevideo on July 30, 1930). A stadium-night tableau: on the left, a large slowly-rotating black-and-white 1930s panel football with a warm rim-light; behind it, silhouetted arched stands of Estadio Centenario dotted with golden crowd lights and a lit floodlight tower; wide sky-blue horizontal bands across the background; a small gold Jules Rimet-style trophy silhouette to the right of the ball; sky-blue and gold confetti drifting down; a large cream JULY 30, 2026 headline on the right; a sky-blue FIRST WORLD CUP FINAL · 96 YEARS subhead; italic MONTEVIDEO · 30 JULY 1930 · URUGUAY 4 · ARGENTINA 2 · ESTADIO CENTENARIO tertiary.">
  <defs>
    <!-- Stadium-night background -->
    <radialGradient id="sky" cx="50%" cy="40%" r="80%">
      <stop offset="0%"   stop-color="#1e3a6e"/>
      <stop offset="55%"  stop-color="#10203f"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </radialGradient>

    <!-- Ball white panel gradient -->
    <radialGradient id="ballWhite" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f5efd8"/>
      <stop offset="100%" stop-color="#a89c78"/>
    </radialGradient>

    <!-- Ball glow -->
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f2c94a" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#d4a94a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4a94a" stop-opacity="0"/>
    </radialGradient>

    <!-- Trophy gradient -->
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffe28a"/>
      <stop offset="50%"  stop-color="#f2c94a"/>
      <stop offset="100%" stop-color="#8f6a1e"/>
    </linearGradient>

    <!-- Floodlight beam -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f5efd8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5efd8" stop-opacity="0"/>
    </linearGradient>

    <!-- Text cushion behind headline -->
    <linearGradient id="cushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0a1428" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#0a1428" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0a1428" stop-opacity="0"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="80%">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Ball surface: 1930s panel pattern.
         Draw white base + curved black pentagon-hex panels inside a clipped circle. -->
    <clipPath id="ballClip">
      <circle cx="0" cy="0" r="60"/>
    </clipPath>

    <!-- Confetti symbols -->
    <symbol id="confBlue" overflow="visible">
      <rect x="-3" y="-1.5" width="6" height="3" fill="#59b7e8"/>
    </symbol>
    <symbol id="confGold" overflow="visible">
      <rect x="-3" y="-1.5" width="6" height="3" fill="#f2c94a"/>
    </symbol>
    <symbol id="confCream" overflow="visible">
      <rect x="-3" y="-1.5" width="6" height="3" fill="#f5efd8"/>
    </symbol>

    <!-- Filter for slight grain on the ball -->
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="1" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="0.6"/>
    </filter>
  </defs>

  <!-- ================================================================ -->
  <!-- Base stadium sky                                                   -->
  <!-- ================================================================ -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Uruguay sky-blue horizontal chorus bands (background flag palette) -->
  <g opacity="0.15">
    <rect x="0" y="20"  width="800" height="10" fill="#59b7e8"/>
    <rect x="0" y="52"  width="800" height="10" fill="#59b7e8"/>
    <rect x="0" y="84"  width="800" height="10" fill="#59b7e8"/>
    <rect x="0" y="116" width="800" height="10" fill="#59b7e8"/>
    <rect x="0" y="148" width="800" height="10" fill="#59b7e8"/>
  </g>

  <!-- ================================================================ -->
  <!-- Stadium silhouette: arched stands + floodlight tower               -->
  <!-- ================================================================ -->
  <g>
    <!-- Distant far stands -->
    <path d="M 0,155 Q 200,120 400,132 Q 600,144 800,120 L 800,200 L 0,200 Z"
          fill="#0a1428" opacity="0.9"/>
    <!-- Nearer curved stand crescent behind the ball -->
    <path d="M 30,180 Q 180,90 340,110 Q 400,116 400,150 L 400,200 L 30,200 Z"
          fill="#050a18" opacity="0.95"/>

    <!-- Crowd pinpoint lights along stand ridgelines -->
    <g fill="#f2c94a">
      <circle cx="60"  cy="168" r="0.8"/>
      <circle cx="80"  cy="152" r="0.7"/>
      <circle cx="100" cy="138" r="0.9"/>
      <circle cx="122" cy="126" r="0.7"/>
      <circle cx="146" cy="115" r="0.9"/>
      <circle cx="170" cy="106" r="0.8"/>
      <circle cx="196" cy="98"  r="0.9"/>
      <circle cx="222" cy="94"  r="0.8"/>
      <circle cx="250" cy="94"  r="0.9"/>
      <circle cx="278" cy="98"  r="0.7"/>
      <circle cx="308" cy="104" r="0.9"/>
      <circle cx="338" cy="112" r="0.8"/>
      <circle cx="368" cy="121" r="0.7"/>
      <circle cx="396" cy="131" r="0.9"/>
      <!-- twinkle -->
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </g>
    <!-- Second twinkle row, offset phase -->
    <g fill="#d4a94a" opacity="0.85">
      <circle cx="70"  cy="160" r="0.6"/>
      <circle cx="92"  cy="146" r="0.6"/>
      <circle cx="114" cy="132" r="0.7"/>
      <circle cx="138" cy="120" r="0.6"/>
      <circle cx="162" cy="111" r="0.7"/>
      <circle cx="188" cy="102" r="0.6"/>
      <circle cx="214" cy="96"  r="0.7"/>
      <circle cx="240" cy="94"  r="0.6"/>
      <circle cx="268" cy="96"  r="0.7"/>
      <circle cx="296" cy="101" r="0.6"/>
      <circle cx="322" cy="108" r="0.7"/>
      <circle cx="352" cy="117" r="0.6"/>
      <circle cx="382" cy="127" r="0.7"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="11s" repeatCount="indefinite"/>
    </g>

    <!-- Floodlight tower (far left) -->
    <g>
      <line x1="24" y1="200" x2="24" y2="52" stroke="#050a18" stroke-width="2.5"/>
      <line x1="18" y1="180" x2="30" y2="180" stroke="#050a18" stroke-width="1.6"/>
      <line x1="17" y1="150" x2="31" y2="150" stroke="#050a18" stroke-width="1.6"/>
      <line x1="16" y1="118" x2="32" y2="118" stroke="#050a18" stroke-width="1.6"/>
      <line x1="15" y1="86"  x2="33" y2="86"  stroke="#050a18" stroke-width="1.6"/>
      <!-- Floodlight rig -->
      <rect x="10" y="42" width="28" height="12" fill="#050a18"/>
      <!-- Lamp glow -->
      <circle cx="24" cy="48" r="4" fill="#f5efd8">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="11s" repeatCount="indefinite"/>
      </circle>
      <!-- Beam -->
      <path d="M 24,52 L 200,200 L -80,200 Z" fill="url(#beam)" opacity="0.55"/>
    </g>

    <!-- Far right subtle tower -->
    <g opacity="0.55">
      <line x1="410" y1="200" x2="410" y2="70" stroke="#050a18" stroke-width="1.4"/>
      <rect x="402" y="62" width="16" height="8" fill="#050a18"/>
      <circle cx="410" cy="66" r="2" fill="#f5efd8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- The Football — slowly rotating 1930s panel ball                    -->
  <!-- Centered at (200, 110), radius 60                                  -->
  <!-- ================================================================ -->
  <g transform="translate(200,110)">
    <!-- Cast glow -->
    <circle r="82" fill="url(#ballGlow)"/>

    <!-- Ground shadow -->
    <ellipse cx="0" cy="72" rx="56" ry="7" fill="#000" opacity="0.55"/>

    <!-- Rotating ball group -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="37s" repeatCount="indefinite"/>

      <!-- White ball base -->
      <circle r="60" fill="url(#ballWhite)"/>

      <!-- Black panel pattern (stylized 1930s pentagon+hexagon look) -->
      <g clip-path="url(#ballClip)" fill="#0a0a0a">
        <!-- Central pentagon -->
        <polygon points="0,-22 21,-7 13,18 -13,18 -21,-7"/>
        <!-- Six surrounding hex-ish patches around the pentagon -->
        <polygon points="0,-58 26,-40 21,-7 0,-22 -21,-7 -26,-40"/>
        <polygon points="26,-40 55,-24 52,7 34,20 13,18 21,-7"/>
        <polygon points="55,-24 60,10 45,38 34,20 52,7"/>
        <polygon points="34,20 45,38 20,55 -20,55 -45,38 -34,20"/>
        <polygon points="-55,-24 -26,-40 -21,-7 -34,20 -45,38 -60,10"/>
        <polygon points="-26,-40 0,-58 26,-40" opacity="0"/>
        <!-- top-left hex ring (partial) -->
        <polygon points="0,-58 -26,-40 -55,-24 -60,10 -45,38 -20,55 20,55 45,38 60,10 55,-24 26,-40"
                 fill="none" stroke="#0a0a0a" stroke-width="1.6"/>
        <!-- panel seam accents -->
        <g fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round">
          <line x1="0" y1="-22" x2="0" y2="-58"/>
          <line x1="21" y1="-7" x2="55" y2="-24"/>
          <line x1="13" y1="18" x2="34" y2="20"/>
          <line x1="-13" y1="18" x2="-34" y2="20"/>
          <line x1="-21" y1="-7" x2="-55" y2="-24"/>
        </g>
      </g>

      <!-- Subtle laces / stitching arc across center panel -->
      <g stroke="#0a0a0a" stroke-width="0.8" opacity="0.7">
        <line x1="-6" y1="-10" x2="-6" y2="8"/>
        <line x1="6" y1="-10" x2="6" y2="8"/>
        <line x1="-8" y1="-6"  x2="8" y2="-6"/>
        <line x1="-8" y1="0"   x2="8" y2="0"/>
        <line x1="-8" y1="6"   x2="8" y2="6"/>
      </g>

      <!-- Highlight bloom (top-left) — rendered on rotating ball so it moves too, but subtle -->
      <ellipse cx="-24" cy="-26" rx="14" ry="8" fill="#ffffff" opacity="0.28"/>
    </g>

    <!-- Fixed rim-light + specular so ball still feels lit even while spinning -->
    <circle r="60" fill="none" stroke="#f5efd8" stroke-width="1" opacity="0.35"/>
    <ellipse cx="-20" cy="-22" rx="18" ry="10" fill="#ffffff" opacity="0.18" filter="url(#grain)"/>

    <!-- Gentle bounce -->
    <animateTransform attributeName="transform" type="translate"
                      values="200 110; 200 106; 200 110" dur="13s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- ================================================================ -->
  <!-- Jules Rimet-style trophy silhouette (right of ball)                -->
  <!-- ================================================================ -->
  <g transform="translate(330,58)">
    <!-- glow -->
    <ellipse cx="0" cy="30" rx="26" ry="10" fill="#f2c94a" opacity="0.18"/>

    <!-- Base plinth -->
    <rect x="-16" y="52" width="32" height="8" fill="url(#trophyGold)"/>
    <rect x="-19" y="60" width="38" height="4" fill="#8f6a1e"/>

    <!-- Stem -->
    <path d="M -6,52 L -8,40 L -14,32 L 14,32 L 8,40 L 6,52 Z" fill="url(#trophyGold)"/>

    <!-- Winged Victory-style figure holding a bowl overhead: stylized silhouette -->
    <!-- Body -->
    <path d="M -5,32 C -8,20 -6,10 0,4 C 6,10 8,20 5,32 Z" fill="url(#trophyGold)"/>
    <!-- Wings/arms holding bowl (abstract) -->
    <path d="M -14,20 C -18,12 -16,4 -8,2 L -3,10 Z" fill="url(#trophyGold)"/>
    <path d="M 14,20 C 18,12 16,4 8,2 L 3,10 Z" fill="url(#trophyGold)"/>
    <!-- Head + bowl -->
    <circle cx="0" cy="-4" r="4" fill="url(#trophyGold)"/>
    <path d="M -14,-6 Q 0,-20 14,-6 Q 0,-2 -14,-6 Z" fill="url(#trophyGold)"/>
    <!-- Rim shine -->
    <path d="M -12,-8 Q 0,-16 12,-8" stroke="#ffe28a" stroke-width="1" fill="none" opacity="0.85"/>

    <!-- Twinkle sparkle -->
    <g fill="#ffe28a">
      <circle cx="18" cy="-2" r="1.4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-16" cy="10" r="1.1">
        <animate attributeName="opacity" values="1;0.2;1" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="26" r="1">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Very gentle sway on the trophy -->
    <animateTransform attributeName="transform" type="translate"
                      values="330 58; 330 56; 330 58" dur="11s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- ================================================================ -->
  <!-- Confetti drifting down                                             -->
  <!-- ================================================================ -->
  <g>
    <g><use href="#confBlue" transform="translate(90,-10)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -10; 6 210" dur="11s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="7s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g><use href="#confGold" transform="translate(170,-30)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -30; -8 220" dur="13s" repeatCount="indefinite" begin="1s"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;-360" dur="11s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g><use href="#confCream" transform="translate(260,-20)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -20; 10 220" dur="13s" repeatCount="indefinite" begin="2s"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="13s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g><use href="#confBlue" transform="translate(360,-40)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -40; -6 220" dur="11s" repeatCount="indefinite" begin="0.5s"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;-360" dur="7s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g><use href="#confGold" transform="translate(430,-10)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -10; 8 220" dur="7s" repeatCount="indefinite" begin="1.7s"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="13s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g><use href="#confCream" transform="translate(530,-30)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -30; -10 220" dur="13s" repeatCount="indefinite" begin="3s"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;-360" dur="11s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g><use href="#confBlue" transform="translate(620,-20)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -20; 6 220" dur="11s" repeatCount="indefinite" begin="0.8s"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="7s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g><use href="#confGold" transform="translate(720,-40)"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -40; -8 220" dur="13s" repeatCount="indefinite" begin="2.4s"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;-360" dur="11s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <!-- ================================================================ -->
  <!-- Text block (right side)                                            -->
  <!-- ================================================================ -->
  <rect x="380" y="46" width="420" height="112" fill="url(#cushion)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="790" y="98" text-anchor="end"
          fill="#f5efd8" font-size="34" font-weight="800" letter-spacing="1.8"
          style="paint-order: stroke; stroke: #0a1428; stroke-width: 4px; stroke-linejoin: round;">
      JULY 30, 2026
    </text>
    <text x="790" y="122" text-anchor="end"
          fill="#59b7e8" font-size="14" font-weight="800" letter-spacing="3.4"
          style="paint-order: stroke; stroke: #0a1428; stroke-width: 3px; stroke-linejoin: round;">
      FIRST WORLD CUP FINAL · 96 YEARS
    </text>
    <text x="790" y="142" text-anchor="end"
          fill="#f2c94a" font-size="9.2" font-style="italic" letter-spacing="1.6"
          style="paint-order: stroke; stroke: #0a1428; stroke-width: 2.5px; stroke-linejoin: round;">
      MONTEVIDEO · 30 JULY 1930 · URUGUAY 4 · ARGENTINA 2 · ESTADIO CENTENARIO
    </text>
  </g>

  <!-- Vignette -->
  <rect width="800" height="200" fill="url(#vig)"/>
</svg>
