<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Apollo 11 Moon Landing — July 20, 1969 (57th anniversary). Neil Armstrong and Buzz Aldrin landed the Lunar Module Eagle in Mare Tranquillitatis at 20:17 UTC; Armstrong stepped onto the lunar surface at 02:56 UTC on July 21 with "one small step for [a] man, one giant leap for mankind." A lunar-surface tableau: deep-space starfield behind, cratered gray Mare Tranquillitatis foreground, the Lunar Module "Eagle" with landing gear and gold thermal blankets on the left, Buzz Aldrin silhouette planting the American flag beside a trail of bootprints, a small blue-and-white Earth suspended in the black sky at upper right (Earthrise), a large ivory JULY 20, 2026 headline dominating center-right, a gold APOLLO 11 · 57 YEARS · TRANQUILITY BASE subhead, and italic MARE TRANQUILLITATIS · 20 JULY 1969 · ONE SMALL STEP tertiary. Palette: void black #0d1117, deep space #05070d, lunar gray #b8bcc4, lunar highlight #d9dce2, lunar shadow #4a4f58, crater rim #5c626b, Earth ocean #2a5aa8, Earth cloud #f0f4fb, Earth land #4a7f42, flag red #cf1e2e, flag white #f2f2f2, flag blue #1e3a72, LEM gold foil #d9a54a, LEM foil highlight #f5cf6e, ivory #f0e6cc, star silver #e8f0ff, beacon amber #ffcf5e. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 20, 2026 — 57th anniversary of the Apollo 11 Moon Landing on July 20, 1969. A lunar surface tableau in Mare Tranquillitatis with the Lunar Module Eagle on the left, an astronaut planting the American flag next to a trail of bootprints, a small Earthrise in the upper-right sky, a large ivory JULY 20, 2026 headline center-right, a gold APOLLO 11 · 57 YEARS · TRANQUILITY BASE subhead, and MARE TRANQUILLITATIS · 20 JULY 1969 · ONE SMALL STEP tertiary along the bottom.">
  <defs>
    <!-- Deep space gradient: pure black-space at top, a whisper of Earth's blue glow near the horizon -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#050710"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>

    <!-- Lunar surface gradient: sunlit gray fading to cooler shadowed tone -->
    <linearGradient id="regolith" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8e93a0"/>
      <stop offset="50%" stop-color="#a8adb7"/>
      <stop offset="100%" stop-color="#6a6f78"/>
    </linearGradient>

    <!-- Earth marble: ocean blue with a subtle atmospheric ring -->
    <radialGradient id="earth" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5a8fd4"/>
      <stop offset="55%" stop-color="#2a5aa8"/>
      <stop offset="100%" stop-color="#0d2a6a"/>
    </radialGradient>

    <radialGradient id="earthGlow" cx="50%" cy="50%" r="55%">
      <stop offset="70%" stop-color="#4a7fd0" stop-opacity="0"/>
      <stop offset="90%" stop-color="#7ab0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7ab0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Regolith texture: fine noise for grainy moondust -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.57  0 0 0 0 0.62  0 0 0 0.28 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Soft glow for stars, beacon, and Earth halo -->
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Sharper glow for the LEM beacon -->
    <filter id="beaconGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Reusable star -->
    <g id="star">
      <circle r="0.9" fill="#e8f0ff"/>
    </g>

    <!-- Reusable bootprint (small chevron ellipse) -->
    <g id="boot">
      <ellipse cx="0" cy="0" rx="2.4" ry="1.4" fill="#5c626b" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="1.8" ry="0.9" fill="#3d424b" opacity="0.9"/>
    </g>

    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 1px; }
      .h2 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 2.4px; }
      .h3 { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-style: italic; letter-spacing: 1.6px; }

      /* Twinkling stars */
      .tw { animation: twinkle 7s ease-in-out infinite; transform-origin: center; }
      @keyframes twinkle {
        0%,100% { opacity: 0.35; }
        50%     { opacity: 1;    }
      }
      .tw.d1 { animation-delay: -1.1s; animation-duration: 11s; }
      .tw.d2 { animation-delay: -2.7s; animation-duration: 13s; }
      .tw.d3 { animation-delay: -3.9s; animation-duration: 7s;  }
      .tw.d4 { animation-delay: -5.3s; animation-duration: 11s; }
      .tw.d5 { animation-delay: -6.1s; animation-duration: 13s; }

      /* Headline gentle breathe */
      .breathe { animation: breathe 11s ease-in-out infinite; transform-origin: center; }
      @keyframes breathe {
        0%,100% { opacity: 0.95; }
        50%     { opacity: 1; }
      }

      /* Earth slow orbit rotation (surface features drift) */
      .spin { animation: spin 47s linear infinite; transform-origin: 705px 55px; }
      @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- ================= SKY ================= -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Starfield (twinkle in staggered phases) -->
  <g>
    <use href="#star" class="tw d1" x="40"  y="20"/>
    <use href="#star" class="tw d3" x="75"  y="45"/>
    <use href="#star" class="tw d2" x="130" y="18"/>
    <use href="#star" class="tw d4" x="185" y="55"/>
    <use href="#star" class="tw d5" x="230" y="25"/>
    <use href="#star" class="tw d1" x="270" y="70"/>
    <use href="#star" class="tw d3" x="315" y="30"/>
    <use href="#star" class="tw d2" x="360" y="15"/>
    <use href="#star" class="tw d4" x="405" y="50"/>
    <use href="#star" class="tw d5" x="450" y="22"/>
    <use href="#star" class="tw d1" x="495" y="45"/>
    <use href="#star" class="tw d3" x="540" y="18"/>
    <use href="#star" class="tw d2" x="585" y="60"/>
    <use href="#star" class="tw d4" x="625" y="25"/>
    <use href="#star" class="tw d5" x="770" y="20"/>
    <use href="#star" class="tw d1" x="755" y="95"/>
    <use href="#star" class="tw d2" x="20"  y="70"/>
    <use href="#star" class="tw d3" x="105" y="82"/>
    <use href="#star" class="tw d4" x="250" y="88"/>
    <use href="#star" class="tw d5" x="380" y="80"/>
    <use href="#star" class="tw d1" x="470" y="88"/>
    <use href="#star" class="tw d2" x="560" y="90"/>
    <use href="#star" class="tw d3" x="660" y="88"/>
  </g>

  <!-- Bright named stars, slightly larger with soft glow -->
  <g filter="url(#soft)">
    <circle class="tw d2" cx="345" cy="42"  r="1.6" fill="#ffffff"/>
    <circle class="tw d4" cx="510" cy="32"  r="1.6" fill="#ffffff"/>
    <circle class="tw d1" cx="205" cy="78"  r="1.4" fill="#ffffff"/>
    <circle class="tw d3" cx="620" cy="72"  r="1.4" fill="#ffffff"/>
  </g>

  <!-- ================= EARTHRISE ================= -->
  <g>
    <!-- Atmospheric halo -->
    <circle cx="705" cy="55" r="34" fill="url(#earthGlow)"/>
    <!-- Earth disc -->
    <circle cx="705" cy="55" r="22" fill="url(#earth)"/>
    <!-- Continents (stylized, slowly rotating) -->
    <g class="spin" clip-path="circle(22px at 705 55)">
      <g fill="#4a7f42" opacity="0.9">
        <!-- Americas-ish blob -->
        <path d="M690,42 q4,-3 8,-1 q3,4 -1,7 q-2,5 -5,4 q-4,-2 -5,-6 q-1,-3 3,-4 Z"/>
        <!-- Africa/Europe-ish blob -->
        <path d="M710,50 q6,2 6,8 q1,6 -4,10 q-5,2 -7,-3 q-3,-6 1,-11 q1,-4 4,-4 Z"/>
        <!-- Asia/Australia-ish blob -->
        <path d="M718,60 q5,-1 7,4 q1,4 -3,6 q-6,1 -7,-4 q-1,-4 3,-6 Z"/>
      </g>
      <!-- Cloud swirl overlay -->
      <g fill="#f0f4fb" opacity="0.5">
        <path d="M694,50 q4,-2 8,0 q3,3 -1,5 q-4,2 -8,-1 q-1,-2 1,-4 Z"/>
        <path d="M708,66 q5,1 7,4 q-1,3 -5,3 q-4,0 -6,-3 q0,-3 4,-4 Z"/>
      </g>
    </g>
    <!-- Terminator shadow (sliver of night) -->
    <path d="M705,33 a22,22 0 0 1 0,44 a12,22 0 0 0 0,-44 Z" fill="#000" opacity="0.35"/>
    <!-- Highlight rim -->
    <circle cx="705" cy="55" r="22" fill="none" stroke="#8ab0e8" stroke-width="0.4" opacity="0.55"/>
  </g>

  <!-- ================= LUNAR SURFACE ================= -->
  <g>
    <!-- Horizon curve (subtle undulation) -->
    <path d="M0,135 Q90,128 180,132 T360,130 T540,133 T720,131 T800,134 L800,200 L0,200 Z" fill="url(#regolith)"/>
    <!-- Regolith grain texture -->
    <path d="M0,135 Q90,128 180,132 T360,130 T540,133 T720,131 T800,134 L800,200 L0,200 Z" filter="url(#grain)" opacity="0.9"/>

    <!-- Craters (ellipses with soft rims) -->
    <g opacity="0.85">
      <!-- big crater right of astronaut -->
      <ellipse cx="330" cy="170" rx="42" ry="7" fill="#4a4f58"/>
      <ellipse cx="330" cy="168" rx="42" ry="7" fill="none" stroke="#d9dce2" stroke-width="0.7" opacity="0.55"/>
      <!-- mid crater -->
      <ellipse cx="450" cy="185" rx="28" ry="4.5" fill="#5c626b"/>
      <ellipse cx="450" cy="183" rx="28" ry="4.5" fill="none" stroke="#d9dce2" stroke-width="0.5" opacity="0.5"/>
      <!-- far right small crater -->
      <ellipse cx="620" cy="178" rx="22" ry="4" fill="#4a4f58"/>
      <ellipse cx="620" cy="176" rx="22" ry="4" fill="none" stroke="#d9dce2" stroke-width="0.5" opacity="0.5"/>
      <!-- tiny dimples -->
      <ellipse cx="540" cy="192" rx="10" ry="2" fill="#4a4f58" opacity="0.6"/>
      <ellipse cx="700" cy="190" rx="14" ry="2.5" fill="#4a4f58" opacity="0.6"/>
      <ellipse cx="770" cy="180" rx="8" ry="1.8" fill="#4a4f58" opacity="0.55"/>
    </g>

    <!-- Sunlit rock highlights (tiny pale specks) -->
    <g fill="#d9dce2" opacity="0.75">
      <circle cx="240" cy="150" r="0.9"/>
      <circle cx="410" cy="156" r="0.7"/>
      <circle cx="580" cy="160" r="0.9"/>
      <circle cx="672" cy="165" r="0.7"/>
      <circle cx="380" cy="175" r="0.6"/>
    </g>
  </g>

  <!-- ================= BOOTPRINT TRAIL ================= -->
  <g>
    <use href="#boot" x="150" y="160" transform="rotate(-8 150 160)"/>
    <use href="#boot" x="165" y="167" transform="rotate(6 165 167)"/>
    <use href="#boot" x="182" y="163" transform="rotate(-4 182 163)"/>
    <use href="#boot" x="200" y="170" transform="rotate(8 200 170)"/>
    <use href="#boot" x="218" y="166" transform="rotate(-6 218 166)"/>
    <use href="#boot" x="238" y="172" transform="rotate(4 238 172)"/>
  </g>

  <!-- ================= LUNAR MODULE "EAGLE" ================= -->
  <g transform="translate(80,100)">
    <!-- Landing shadow -->
    <ellipse cx="0" cy="52" rx="42" ry="4" fill="#000" opacity="0.55"/>

    <!-- Descent stage (octagonal-ish base, gold foil) -->
    <g>
      <path d="M-28,30 L-32,42 L-24,50 L24,50 L32,42 L28,30 Z" fill="#d9a54a"/>
      <path d="M-28,30 L-32,42 L-24,50 L24,50 L32,42 L28,30 Z" fill="none" stroke="#8a6a2a" stroke-width="0.8"/>
      <!-- Foil creases (subtle vertical lines) -->
      <g stroke="#8a6a2a" stroke-width="0.35" opacity="0.55">
        <line x1="-20" y1="30" x2="-20" y2="50"/>
        <line x1="-10" y1="30" x2="-10" y2="50"/>
        <line x1="0"   y1="30" x2="0"   y2="50"/>
        <line x1="10"  y1="30" x2="10"  y2="50"/>
        <line x1="20"  y1="30" x2="20"  y2="50"/>
      </g>
      <!-- Descent engine bell -->
      <path d="M-6,50 L-10,58 L10,58 L6,50 Z" fill="#3a3e46" stroke="#1a1c22" stroke-width="0.5"/>
    </g>

    <!-- Landing legs + footpads -->
    <g stroke="#c8ccd4" stroke-width="1.3" fill="none">
      <line x1="-28" y1="34" x2="-42" y2="58"/>
      <line x1="28"  y1="34" x2="42"  y2="58"/>
      <line x1="-15" y1="42" x2="-22" y2="60"/>
      <line x1="15"  y1="42" x2="22"  y2="60"/>
    </g>
    <g fill="#c8ccd4">
      <circle cx="-42" cy="58" r="2.5"/>
      <circle cx="42"  cy="58" r="2.5"/>
      <circle cx="-22" cy="60" r="1.8"/>
      <circle cx="22"  cy="60" r="1.8"/>
    </g>

    <!-- Ladder on right leg -->
    <g stroke="#c8ccd4" stroke-width="0.5" opacity="0.85">
      <line x1="24" y1="30" x2="34" y2="52"/>
      <line x1="26" y1="34" x2="30" y2="34"/>
      <line x1="28" y1="40" x2="32" y2="40"/>
      <line x1="30" y1="46" x2="34" y2="46"/>
    </g>

    <!-- Ascent stage (crumpled foil, triangular cabin) -->
    <g>
      <!-- Body -->
      <path d="M-22,0 L-24,30 L24,30 L22,0 Z" fill="#c8ccd4"/>
      <path d="M-22,0 L-24,30 L24,30 L22,0 Z" fill="none" stroke="#7a7f88" stroke-width="0.6"/>
      <!-- Foil crumple texture (diagonal streaks) -->
      <g stroke="#7a7f88" stroke-width="0.3" opacity="0.65">
        <line x1="-20" y1="5"  x2="-16" y2="28"/>
        <line x1="-12" y1="2"  x2="-8"  y2="28"/>
        <line x1="-4"  y1="4"  x2="0"   y2="28"/>
        <line x1="4"   y1="2"  x2="8"   y2="28"/>
        <line x1="12"  y1="5"  x2="16"  y2="28"/>
      </g>
      <!-- Cabin windows (two triangular) -->
      <path d="M-16,4 L-8,4 L-10,12 L-16,12 Z" fill="#1a1c22" stroke="#7a7f88" stroke-width="0.4"/>
      <path d="M8,4 L16,4 L16,12 L10,12 Z"   fill="#1a1c22" stroke="#7a7f88" stroke-width="0.4"/>
      <!-- Window glint -->
      <path d="M-14,6 L-11,6 L-12,10 Z" fill="#7ab0ff" opacity="0.7"/>
      <path d="M10,6 L14,6 L13,10 Z"    fill="#7ab0ff" opacity="0.7"/>

      <!-- Docking port on top -->
      <rect x="-4" y="-6" width="8" height="6" fill="#c8ccd4" stroke="#7a7f88" stroke-width="0.4"/>
      <!-- Antennas -->
      <line x1="-14" y1="-2" x2="-20" y2="-14" stroke="#c8ccd4" stroke-width="0.6"/>
      <line x1="14"  y1="-2" x2="22"  y2="-16" stroke="#c8ccd4" stroke-width="0.6"/>
      <circle cx="-20" cy="-14" r="1" fill="#c8ccd4"/>
      <circle cx="22"  cy="-16" r="1" fill="#c8ccd4"/>
    </g>

    <!-- Blinking beacon on top -->
    <circle cx="0" cy="-10" r="1.8" fill="#ffcf5e" filter="url(#beaconGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5;2.4;1.5" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- Beacon flare ring -->
    <circle cx="0" cy="-10" r="4" fill="none" stroke="#ffcf5e" stroke-width="0.6" opacity="0.55">
      <animate attributeName="r" values="2;7;2" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= ASTRONAUT + FLAG ================= -->
  <g transform="translate(255,140)">
    <!-- Ground shadow -->
    <ellipse cx="0" cy="30" rx="10" ry="1.8" fill="#000" opacity="0.55"/>

    <!-- Astronaut body (EVA suit silhouette) -->
    <g fill="#e6e8ec" stroke="#7a7f88" stroke-width="0.5">
      <!-- Backpack (PLSS) -->
      <rect x="-6" y="-6" width="9" height="14" rx="1" fill="#c8ccd4"/>
      <!-- Torso -->
      <rect x="-5" y="0" width="10" height="14" rx="2"/>
      <!-- Helmet -->
      <circle cx="0" cy="-6" r="5"/>
      <!-- Visor (gold) -->
      <path d="M-3.5,-8 a3.5,3.5 0 0 1 7,0 a3.5,3.5 0 0 1 -7,0 Z" fill="#d9a54a" opacity="0.9"/>
      <path d="M-3,-7.5 a3,3 0 0 1 6,0" fill="none" stroke="#f5cf6e" stroke-width="0.4"/>
      <!-- Arm reaching to flagpole -->
      <path d="M5,3 Q10,2 12,-2" fill="none" stroke="#e6e8ec" stroke-width="3" stroke-linecap="round"/>
      <!-- Left arm at side -->
      <path d="M-5,3 L-7,10" fill="none" stroke="#e6e8ec" stroke-width="3" stroke-linecap="round"/>
      <!-- Legs -->
      <rect x="-4" y="13" width="3.5" height="12" rx="1"/>
      <rect x="0.5" y="13" width="3.5" height="12" rx="1"/>
      <!-- Boots -->
      <ellipse cx="-2.2" cy="26" rx="2.4" ry="1.4" fill="#7a7f88"/>
      <ellipse cx="2.2"  cy="26" rx="2.4" ry="1.4" fill="#7a7f88"/>
    </g>
    <!-- Chest control panel -->
    <rect x="-3" y="3" width="6" height="4" fill="#7a7f88"/>
    <!-- Suit tubing -->
    <path d="M-2,-1 Q-6,-3 -6,-5" stroke="#c8ccd4" stroke-width="0.5" fill="none"/>

    <!-- Flag pole -->
    <line x1="14" y1="-16" x2="14" y2="16" stroke="#e6e8ec" stroke-width="1"/>
    <!-- Horizontal cross-bar (the actual Apollo flag had a rod to hold it out in vacuum) -->
    <line x1="14" y1="-16" x2="34" y2="-16" stroke="#e6e8ec" stroke-width="1"/>
    <!-- Flag with subtle wave (SMIL path animation on the outline shape) -->
    <g>
      <path d="M14,-16 L34,-16 L34,-4 L14,-4 Z" fill="#f2f2f2" stroke="#7a7f88" stroke-width="0.35">
        <animate attributeName="d"
                 values="M14,-16 L34,-16 L34,-4 L14,-4 Z;
                         M14,-16 L34,-15 L34,-3 L14,-4 Z;
                         M14,-16 L34,-17 L34,-5 L14,-4 Z;
                         M14,-16 L34,-16 L34,-4 L14,-4 Z"
                 dur="13s" repeatCount="indefinite"/>
      </path>
      <!-- Blue canton -->
      <path d="M14,-16 L23,-16 L23,-10 L14,-10 Z" fill="#1e3a72">
        <animate attributeName="d"
                 values="M14,-16 L23,-16 L23,-10 L14,-10 Z;
                         M14,-16 L23,-15.5 L23,-9.5 L14,-10 Z;
                         M14,-16 L23,-16.5 L23,-10.5 L14,-10 Z;
                         M14,-16 L23,-16 L23,-10 L14,-10 Z"
                 dur="13s" repeatCount="indefinite"/>
      </path>
      <!-- Red stripes -->
      <g fill="#cf1e2e">
        <rect x="23"  y="-16" width="11" height="1.6"/>
        <rect x="23"  y="-12.8" width="11" height="1.6"/>
        <rect x="23"  y="-9.6"  width="11" height="1.6"/>
        <rect x="14"  y="-6.4"  width="20" height="1.6"/>
        <rect x="14"  y="-3.2"  width="20" height="1.2"/>
      </g>
      <!-- Star field dots -->
      <g fill="#f2f2f2">
        <circle cx="16" cy="-14.5" r="0.4"/>
        <circle cx="18.5" cy="-14.5" r="0.4"/>
        <circle cx="21" cy="-14.5" r="0.4"/>
        <circle cx="17" cy="-12.5" r="0.4"/>
        <circle cx="19.5" cy="-12.5" r="0.4"/>
        <circle cx="16" cy="-11" r="0.4"/>
        <circle cx="18.5" cy="-11" r="0.4"/>
        <circle cx="21" cy="-11" r="0.4"/>
      </g>
    </g>
  </g>

  <!-- Faint kicked-up dust puff near astronaut boots -->
  <g fill="#d9dce2" opacity="0.35" filter="url(#soft)">
    <circle cx="248" cy="170" r="2">
      <animate attributeName="opacity" values="0.05;0.4;0.05" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="262" cy="171" r="1.4">
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= HEADLINE ================= -->
  <g class="breathe">
    <text x="345" y="72" class="h1" font-size="44" fill="#f0e6cc">JULY 20, 2026</text>
    <!-- Gold underline -->
    <rect x="346" y="80" width="332" height="2" fill="#d9a54a" opacity="0.9"/>
  </g>

  <!-- Subhead: gold -->
  <text x="345" y="106" class="h2" font-size="13" fill="#d9a54a">
    APOLLO 11
    <animate attributeName="opacity" values="0.9;1;0.9" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="440" y="106" class="h2" font-size="13" fill="#f0e6cc" opacity="0.9">·  57 YEARS  ·  TRANQUILITY BASE</text>

  <!-- Tertiary line -->
  <text x="345" y="126" class="h3" font-size="10" fill="#b8bcc4" opacity="0.92">
    MARE TRANQUILLITATIS  ·  20 JULY 1969  ·  ONE SMALL STEP
  </text>

  <!-- Rim vignette -->
  <rect width="800" height="200" fill="none" stroke="#000" stroke-width="2" opacity="0.35"/>
</svg>
