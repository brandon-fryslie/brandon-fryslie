<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Rembrandt van Rijn's 420th birthday (July 15, 1606, Leiden) — Dutch Golden Age master of chiaroscuro. A dark studio tableau built around a classic Rembrandt-lighting triangle: deep umber background with a golden key-light shaft from the upper right sculpting a rim-lit silhouette of Rembrandt on the left (beret, ruff collar, cloaked shoulder); a small easel behind him with a suggested self-portrait underpainting; a wooden painter's palette tucked into the lower-right corner with paint dabs; amber dust motes drifting up in the beam; craquelure varnish texture; a large ivory JULY 15, 2026 headline seated in the triangle of light; a gold REMBRANDT VAN RIJN · 420 YEARS subhead; italic LEIDEN · 15 JULY 1606 · MASTER OF CHIAROSCURO tertiary along the bottom. Palette: deep umber #1a0f08, warm sienna #6b3a1a, amber gold #c88a2c, bright gold #e6b04a, ivory #f0d9a4, cream highlight #f5e6c0, vermilion #a83820, bronze shadow #4a2f18. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 15, 2026 — the 420th birthday of Rembrandt van Rijn (born July 15, 1606, Leiden). A dark Dutch Golden Age studio tableau with a golden chiaroscuro spotlight from the upper right, a rim-lit silhouette of Rembrandt in beret and ruff collar on the left with a small easel behind him, a wooden painter's palette with paint dabs tucked into the lower-right corner, amber dust motes rising in the light beam, a cracked oil-varnish texture, a large ivory JULY 15, 2026 headline in the light triangle, a gold REMBRANDT VAN RIJN · 420 YEARS subhead, and italic LEIDEN · 15 JULY 1606 · MASTER OF CHIAROSCURO tertiary along the bottom.">
  <defs>
    <!-- Deep studio background gradient (dark) -->
    <radialGradient id="studio" cx="65%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#3a2410"/>
      <stop offset="18%" stop-color="#241606"/>
      <stop offset="55%" stop-color="#120a04"/>
      <stop offset="100%" stop-color="#080502"/>
    </radialGradient>

    <!-- Warm golden key-light glow -->
    <radialGradient id="keylight" cx="60%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f5e6c0" stop-opacity="0.6"/>
      <stop offset="28%" stop-color="#e6b04a" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#c88a2c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c88a2c" stop-opacity="0"/>
    </radialGradient>

    <!-- Volumetric beam gradient (angled shaft of light) -->
    <linearGradient id="beam" x1="95%" y1="0%" x2="35%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c0" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c88a2c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c88a2c" stop-opacity="0"/>
    </linearGradient>

    <!-- Text metallic gold gradient -->
    <linearGradient id="goldtext" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="45%" stop-color="#f0d9a4"/>
      <stop offset="70%" stop-color="#c88a2c"/>
      <stop offset="100%" stop-color="#8b5a1a"/>
    </linearGradient>

    <!-- Rim-light gradient on the figure -->
    <linearGradient id="rim" x1="100%" y1="20%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#f5e6c0" stop-opacity="1"/>
      <stop offset="18%" stop-color="#c88a2c" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#4a2f18" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0a0603" stop-opacity="0"/>
    </linearGradient>

    <!-- Palette wood gradient -->
    <radialGradient id="wood" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#a06a34"/>
      <stop offset="60%" stop-color="#6b3a1a"/>
      <stop offset="100%" stop-color="#3a1f0c"/>
    </radialGradient>

    <!-- Cracked-varnish craquelure texture -->
    <filter id="craquelure" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.05
                0 0 0 0 0.03
                0 0 0 0 0.02
                0 0 0 1.3 -0.78"/>
    </filter>

    <!-- Soft glow around text -->
    <filter id="softglow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blur for flicker glow -->
    <filter id="flicker" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Rembrandt silhouette symbol -->
    <symbol id="rembrandt" viewBox="0 0 120 200" overflow="visible">
      <!-- Beret (soft floppy cap) -->
      <path d="M18 34 Q10 22 22 14 Q40 4 62 6 Q88 8 100 22 Q106 32 96 40 Q78 46 60 42 Q40 46 24 42 Q18 40 18 34 Z"
            fill="#1a0f08"/>
      <path d="M22 32 Q16 26 26 20 Q42 12 62 14 Q84 16 94 26 Q96 30 88 34 Q70 38 58 36 Q40 38 26 36 Q22 34 22 32 Z"
            fill="#0a0603" opacity="0.6"/>
      <!-- Head -->
      <path d="M28 42 Q26 68 34 88 Q42 100 58 102 Q78 104 88 92 Q96 78 96 60 Q96 50 92 42 Q78 46 60 42 Q40 46 28 42 Z"
            fill="#1a0f08"/>
      <!-- Ruff collar -->
      <ellipse cx="60" cy="118" rx="46" ry="12" fill="#0a0603"/>
      <ellipse cx="60" cy="116" rx="44" ry="10" fill="#1a0f08"/>
      <path d="M60 108 Q78 108 92 116 Q94 122 88 126 Q76 122 62 122 Q46 122 34 126 Q28 122 30 116 Q44 108 60 108 Z"
            fill="none" stroke="#3a2410" stroke-width="0.8" opacity="0.7"/>
      <!-- Cloak / shoulder mass -->
      <path d="M4 200 L4 148 Q10 128 30 122 Q48 128 60 128 Q76 128 92 122 Q114 128 118 150 L118 200 Z"
            fill="#0a0603"/>
      <!-- Rim light on face edge and shoulder (right side, catching key light) -->
      <path d="M92 44 Q98 60 96 78 Q94 92 86 100 Q80 106 74 108 L74 100 Q84 92 90 78 Q94 60 90 46 Z"
            fill="url(#rim)"/>
      <path d="M114 148 Q118 168 118 200 L108 200 Q106 180 108 156 Q110 148 114 148 Z"
            fill="url(#rim)" opacity="0.75"/>
      <!-- Classic Rembrandt cheek-triangle highlight -->
      <path d="M78 68 L86 72 L84 82 L76 78 Z" fill="#e6b04a" opacity="0.6"/>
      <ellipse cx="82" cy="76" rx="3.5" ry="2.5" fill="#f0d9a4" opacity="0.55"/>
      <!-- Beret rim highlight -->
      <path d="M90 20 Q102 26 98 36 Q94 40 88 38 Q92 30 88 22 Q89 20 90 20 Z" fill="#8b5a1a" opacity="0.65"/>
    </symbol>

    <!-- Small easel symbol behind figure -->
    <symbol id="easel" viewBox="0 0 100 140" overflow="visible">
      <line x1="50" y1="6" x2="60" y2="138" stroke="#4a2f18" stroke-width="2"/>
      <line x1="50" y1="6" x2="18" y2="138" stroke="#6b3a1a" stroke-width="2.4"/>
      <line x1="50" y1="6" x2="82" y2="138" stroke="#6b3a1a" stroke-width="2.4"/>
      <line x1="24" y1="104" x2="76" y2="104" stroke="#4a2f18" stroke-width="1.4"/>
      <g transform="translate(22,28)">
        <rect x="0" y="0" width="56" height="72" fill="#3a2818" stroke="#8b5a1a" stroke-width="1.2"/>
        <ellipse cx="28" cy="30" rx="15" ry="20" fill="#5a3818" opacity="0.85"/>
        <ellipse cx="34" cy="26" rx="6" ry="8" fill="#a06a34" opacity="0.7"/>
        <ellipse cx="35" cy="22" rx="2.4" ry="3" fill="#e6b04a" opacity="0.55"/>
        <path d="M6 58 Q22 52 50 58" stroke="#c88a2c" stroke-width="1" fill="none" opacity="0.45"/>
      </g>
    </symbol>
  </defs>

  <!-- 1. Base -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#studio)"/>

  <!-- 2. Volumetric light beam shaft from upper right (classic Rembrandt triangle) -->
  <polygon points="800,0 800,120 240,200 460,0" fill="url(#beam)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="11s" repeatCount="indefinite"/>
  </polygon>

  <!-- 3. Golden key-light glow radial (source in upper right area) -->
  <rect width="800" height="200" fill="url(#keylight)">
    <animate attributeName="opacity" values="0.92;1;0.92" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- 4. Distant secondary warm glow behind figure -->
  <ellipse cx="200" cy="130" rx="80" ry="60" fill="#c88a2c" opacity="0.13" filter="url(#flicker)">
    <animate attributeName="opacity" values="0.10;0.18;0.11;0.15;0.10" dur="4.3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 5. Small easel behind Rembrandt on the far left -->
  <g transform="translate(6 40)" opacity="0.85">
    <use href="#easel" width="100" height="140"/>
  </g>

  <!-- 6. Rembrandt silhouette, rim-lit -->
  <g transform="translate(70 22)">
    <use href="#rembrandt" width="145" height="200"/>
  </g>

  <!-- 7. Floating gold dust motes rising in the beam -->
  <g>
    <circle r="1.4" fill="#f0d9a4" opacity="0.85">
      <animateMotion path="M340 200 Q360 130 400 20" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.1" fill="#e6b04a" opacity="0.8">
      <animateMotion path="M440 200 Q460 120 520 20" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#f5e6c0" opacity="0.75">
      <animateMotion path="M560 200 Q580 120 640 20" dur="17s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="17s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle r="0.9" fill="#c88a2c" opacity="0.7">
      <animateMotion path="M680 200 Q700 130 740 30" dur="9s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="9s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.2" fill="#e6b04a" opacity="0.8">
      <animateMotion path="M400 200 Q420 140 480 40" dur="14s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="14s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle r="0.8" fill="#f0d9a4" opacity="0.7">
      <animateMotion path="M620 200 Q635 140 670 50" dur="19s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="19s" begin="-9s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.0" fill="#f5e6c0" opacity="0.7">
      <animateMotion path="M500 200 Q520 130 570 30" dur="12s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="-4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 8. Cracked varnish craquelure texture overlay -->
  <rect width="800" height="200" fill="#000" filter="url(#craquelure)" opacity="0.42"/>

  <!-- 9. Warm vignette darkening the far edges -->
  <radialGradient id="vignette" cx="65%" cy="30%" r="95%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="800" height="200" fill="url(#vignette)"/>

  <!-- 10. Painter's palette tucked into lower-right corner, small, warm-lit -->
  <g transform="translate(700 158) rotate(-16) scale(0.68)">
    <path d="M0 0 Q0 -22 24 -30 Q60 -38 100 -30 Q128 -22 128 4 Q128 26 100 32 Q78 34 60 32 Q56 24 46 26 Q34 30 30 34 Q10 34 4 22 Q0 12 0 0 Z"
          fill="url(#wood)" stroke="#2a1608" stroke-width="1"/>
    <ellipse cx="46" cy="22" rx="6" ry="4" fill="#0a0603"/>
    <circle cx="26" cy="-14" r="5" fill="#a83820"/>
    <circle cx="42" cy="-22" r="4.5" fill="#e6b04a"/>
    <circle cx="60" cy="-24" r="5" fill="#f5e6c0"/>
    <circle cx="78" cy="-22" r="4.5" fill="#6b3a1a"/>
    <circle cx="96" cy="-16" r="5" fill="#8b5a1a"/>
    <circle cx="108" cy="-4" r="4" fill="#4a2f18"/>
    <circle cx="112" cy="12" r="4" fill="#1a0f08"/>
    <circle cx="24" cy="-16" r="1.4" fill="#f5e6c0" opacity="0.7"/>
    <circle cx="40" cy="-24" r="1.4" fill="#fff5d6" opacity="0.8"/>
    <circle cx="58" cy="-26" r="1.6" fill="#fff5d6" opacity="0.9"/>
    <circle cx="76" cy="-24" r="1.2" fill="#e6b04a" opacity="0.7"/>
    <circle cx="94" cy="-18" r="1.4" fill="#f0d9a4" opacity="0.7"/>
  </g>

  <!-- 11. Main date headline — inside the triangle of light, dominant -->
  <g filter="url(#softglow)">
    <text x="470" y="98" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="52" font-weight="900" letter-spacing="4" fill="url(#goldtext)"
          stroke="#4a2f18" stroke-width="0.6">
      JULY 15, 2026
    </text>
  </g>

  <!-- 12. Subhead — bright gold, shorter to avoid crowding the palette -->
  <text x="470" y="132" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="800" letter-spacing="4.6" fill="#e6b04a">
    REMBRANDT VAN RIJN · 420 YEARS
  </text>

  <!-- 13. Tertiary italic caption -->
  <text x="470" y="176" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" font-weight="700" letter-spacing="2.6" fill="#f0d9a4" opacity="0.92">
    LEIDEN · 15 JULY 1606 · MASTER OF CHIAROSCURO
  </text>

  <!-- 14. Faint painter's signature "R." in lower left, mimicking a canvas signature -->
  <text x="16" y="192"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" font-style="italic" fill="#8b5a1a" opacity="0.75">
    R.
  </text>
</svg>
