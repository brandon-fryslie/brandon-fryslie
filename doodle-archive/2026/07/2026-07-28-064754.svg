<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: 86th Anniversary of Bugs Bunny's Debut — "A Wild Hare" (Warner Bros / Merrie Melodies, directed by Tex Avery) released July 27, 1940. The first officially-recognized Bugs Bunny cartoon and the short in which his signature line "What's up, Doc?" first crossed his lips. A cartoon-meadow tableau on the left: a Looney Tunes-style concentric bullseye of red-orange-gold rings, a stylized grey bunny silhouette in front with tall floppy pink-lined ears (wiggling), a wide toothy grin, holding a fat orange carrot with a leafy green top across his chest; a cream speech bubble arcing up reading "WHAT'S UP, DOC?"; a low rolling green horizon with two tiny burrow holes; cartoon sparkle stars popping around the bullseye. Right side carries a big ivory JULY 27, 2026 headline, orange BUGS BUNNY · 86 YEARS subhead, italic A WILD HARE · 27 JULY 1940 · TEX AVERY tertiary. Palette: near-black #0d1117, ring red #d02a2a, ring orange #f26a1a, ring gold #f4c04a, bunny grey #e8e4dc, bunny shadow #b8b0a0, ear pink #f6a8c0, carrot orange #f68f2a, carrot deep #c85a10, leaf green #4aa02a, leaf shade #2f7018, sky #2c4a7a, grass #3a7a2a, cream #fff4d8, ivory #f4efdc, sub orange #ffb64a. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 27, 2026 — 86th anniversary of Bugs Bunny's debut in 'A Wild Hare' (Warner Bros, directed by Tex Avery, released July 27, 1940). A cartoon-meadow tableau: a Looney Tunes-style concentric bullseye of red-orange-gold rings on the left, a stylized grey bunny silhouette in front with tall floppy pink-lined wiggling ears, a wide toothy grin, holding a fat orange carrot with a leafy green top; a cream speech bubble arcing up reading WHAT'S UP, DOC?; a low rolling green horizon with two tiny burrow holes; cartoon sparkle stars popping around the bullseye. A large ivory JULY 27, 2026 headline dominates the upper right, with an orange BUGS BUNNY · 86 YEARS subhead and italic A WILD HARE · 27 JULY 1940 · TEX AVERY tertiary.">
  <defs>
    <!-- Sky-to-grass backdrop -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#132038"/>
      <stop offset="55%"  stop-color="#2c4a7a"/>
      <stop offset="70%"  stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Bunny fur gradient -->
    <linearGradient id="fur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f6f2e8"/>
      <stop offset="55%"  stop-color="#e8e4dc"/>
      <stop offset="100%" stop-color="#b8b0a0"/>
    </linearGradient>

    <!-- Inner-ear pink -->
    <linearGradient id="innerEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffc0d4"/>
      <stop offset="100%" stop-color="#e8809a"/>
    </linearGradient>

    <!-- Carrot -->
    <linearGradient id="carrot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffb060"/>
      <stop offset="55%"  stop-color="#f68f2a"/>
      <stop offset="100%" stop-color="#c85a10"/>
    </linearGradient>

    <!-- Carrot leaves -->
    <linearGradient id="leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7ed850"/>
      <stop offset="55%"  stop-color="#4aa02a"/>
      <stop offset="100%" stop-color="#2f7018"/>
    </linearGradient>

    <!-- Speech bubble -->
    <radialGradient id="bubble" cx="45%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#fff4d8"/>
      <stop offset="100%" stop-color="#f4d888"/>
    </radialGradient>

    <!-- Grass tone -->
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#4aa030"/>
      <stop offset="100%" stop-color="#1a4a12"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Sparkle radial -->
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff8dc" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#f4c04a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f4c04a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- =============================================================== -->
  <!-- Left: Looney Tunes-style concentric bullseye behind the bunny    -->
  <!-- Centered at (155, 100). Slowly counter-rotates for classic vibe. -->
  <!-- =============================================================== -->
  <g transform="translate(155,100)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="47s" repeatCount="indefinite"/>
      <circle r="112" fill="#d02a2a"/>
      <circle r="94"  fill="#f26a1a"/>
      <circle r="76"  fill="#f4c04a"/>
      <circle r="58"  fill="#f26a1a"/>
      <circle r="40"  fill="#d02a2a"/>
      <circle r="22"  fill="#f4c04a"/>
      <circle r="8"   fill="#fff4d8"/>
    </g>
    <!-- inner star burst that pulses -->
    <g fill="#fff4d8" opacity="0.7">
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="2.7s" repeatCount="indefinite"/>
      <polygon points="0,-118 4,-100 0,-96 -4,-100"/>
      <polygon points="118,0 100,4 96,0 100,-4"/>
      <polygon points="0,118 -4,100 0,96 4,100"/>
      <polygon points="-118,0 -100,-4 -96,0 -100,4"/>
    </g>
  </g>

  <!-- Ground / rolling horizon -->
  <path d="M 0,168 C 120,150 260,180 400,164 C 540,148 680,178 800,160 L 800,200 L 0,200 Z"
        fill="url(#grass)"/>
  <!-- Distant burrow holes -->
  <ellipse cx="490" cy="176" rx="14" ry="5" fill="#0d1117" opacity="0.85"/>
  <ellipse cx="720" cy="171" rx="10" ry="3.5" fill="#0d1117" opacity="0.85"/>
  <!-- Tiny grass tufts -->
  <g stroke="#7ed850" stroke-width="1" opacity="0.8" fill="none">
    <path d="M 460,176 l 2,-6 M 464,176 l -1,-7 M 468,176 l 2,-6"/>
    <path d="M 540,175 l 2,-6 M 544,175 l -1,-7"/>
    <path d="M 700,172 l 2,-6 M 704,172 l -1,-6"/>
  </g>

  <!-- =============================================================== -->
  <!-- BUNNY: stylized silhouette centered around (155, 130)             -->
  <!-- Long floppy ears wiggle; body sits in front of the bullseye.     -->
  <!-- =============================================================== -->
  <g>
    <!-- Body / haunches -->
    <ellipse cx="155" cy="185" rx="72" ry="22" fill="url(#fur)" stroke="#7a7060" stroke-width="1.2"/>

    <!-- Arms holding carrot (drawn behind carrot for clean overlap) -->
    <path d="M 108,168 C 96,158 96,146 110,142 C 128,138 148,140 158,148"
          fill="url(#fur)" stroke="#7a7060" stroke-width="1.2"/>
    <path d="M 202,168 C 214,158 214,146 200,142 C 182,138 162,140 152,148"
          fill="url(#fur)" stroke="#7a7060" stroke-width="1.2"/>

    <!-- Head -->
    <g transform="translate(155,128)">
      <ellipse cx="0" cy="0" rx="52" ry="42" fill="url(#fur)" stroke="#7a7060" stroke-width="1.2"/>

      <!-- Cheek fluff -->
      <ellipse cx="-32" cy="16" rx="16" ry="10" fill="#fff8ec" opacity="0.75"/>
      <ellipse cx="32"  cy="16" rx="16" ry="10" fill="#fff8ec" opacity="0.75"/>

      <!-- Ears — LEFT (wiggles) -->
      <g transform="translate(-18,-32)">
        <animateTransform attributeName="transform" type="rotate"
                          values="-6 0 32; 4 0 32; -6 0 32" dur="3.7s" repeatCount="indefinite" additive="sum"/>
        <path d="M 0,0 C -14,-30 -18,-70 -8,-92 C 2,-108 14,-100 14,-78 C 14,-54 10,-24 4,0 Z"
              fill="url(#fur)" stroke="#7a7060" stroke-width="1.2"/>
        <path d="M 0,-4 C -8,-28 -10,-60 -3,-80 C 4,-96 10,-90 10,-72 C 10,-52 6,-26 2,-4 Z"
              fill="url(#innerEar)"/>
      </g>
      <!-- Ears — RIGHT (wiggles opposite) -->
      <g transform="translate(18,-32)">
        <animateTransform attributeName="transform" type="rotate"
                          values="6 0 32; -4 0 32; 6 0 32" dur="3.7s" begin="-1.1s" repeatCount="indefinite" additive="sum"/>
        <path d="M 0,0 C 14,-30 18,-70 8,-92 C -2,-108 -14,-100 -14,-78 C -14,-54 -10,-24 -4,0 Z"
              fill="url(#fur)" stroke="#7a7060" stroke-width="1.2"/>
        <path d="M 0,-4 C 8,-28 10,-60 3,-80 C -4,-96 -10,-90 -10,-72 C -10,-52 -6,-26 -2,-4 Z"
              fill="url(#innerEar)"/>
      </g>

      <!-- Eyes -->
      <g>
        <ellipse cx="-16" cy="-8" rx="6" ry="8" fill="#f4efdc"/>
        <ellipse cx="16"  cy="-8" rx="6" ry="8" fill="#f4efdc"/>
        <!-- pupils, sneaky glance -->
        <circle cx="-13" cy="-6" r="3" fill="#0d1117">
          <animate attributeName="cx" values="-13;-18;-13;-13" dur="5.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="19"  cy="-6" r="3" fill="#0d1117">
          <animate attributeName="cx" values="19;14;19;19" dur="5.3s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Nose (little pink triangle) -->
      <path d="M -4,4 L 4,4 L 0,10 Z" fill="#f27a90" stroke="#8a1030" stroke-width="0.6"/>

      <!-- Mouth: cheeky grin -->
      <path d="M -14,16 C -8,26 8,26 14,16" fill="none" stroke="#3a1020" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Two front teeth peeking -->
      <rect x="-4" y="18" width="4" height="7" fill="#fff4d8" stroke="#3a1020" stroke-width="0.5" rx="0.6"/>
      <rect x="0"  y="18" width="4" height="7" fill="#fff4d8" stroke="#3a1020" stroke-width="0.5" rx="0.6"/>

      <!-- Whiskers -->
      <g stroke="#3a1020" stroke-width="0.7" opacity="0.7" fill="none" stroke-linecap="round">
        <line x1="-20" y1="12" x2="-42" y2="8"/>
        <line x1="-20" y1="16" x2="-42" y2="16"/>
        <line x1="20"  y1="12" x2="42"  y2="8"/>
        <line x1="20"  y1="16" x2="42"  y2="16"/>
      </g>
    </g>

    <!-- Carrot — big, held across the chest, subtle bob -->
    <g transform="translate(155,158)">
      <animateTransform attributeName="transform" type="translate"
                        values="155,158; 155,155; 155,158" dur="2.9s" repeatCount="indefinite"/>
      <!-- carrot body pointing right -->
      <path d="M -46,-8 L 46,-4 L 62,0 L 46,4 L -46,8 C -56,4 -56,-4 -46,-8 Z"
            fill="url(#carrot)" stroke="#7a3208" stroke-width="1"/>
      <!-- carrot ridges -->
      <g stroke="#c85a10" stroke-width="0.7" opacity="0.65" fill="none">
        <path d="M -30,-6 L -32,6"/>
        <path d="M -10,-7 L -12,7"/>
        <path d="M 10,-6 L 8,6"/>
        <path d="M 30,-5 L 28,5"/>
      </g>
      <!-- highlight -->
      <path d="M -36,-4 C -10,-6 20,-5 40,-2" fill="none" stroke="#ffd88a" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
      <!-- leafy top on the left -->
      <g transform="translate(-48,0)">
        <path d="M 0,0 C -10,-14 -18,-14 -20,-4 C -22,-14 -32,-14 -34,-4 C -30,-2 -22,4 -14,4 C -6,6 0,4 0,0 Z"
              fill="url(#leaf)" stroke="#1a4a12" stroke-width="0.9"/>
        <path d="M -6,-2 C -14,-14 -22,-10 -22,-2" fill="none" stroke="#7ed850" stroke-width="0.8" opacity="0.7"/>
        <path d="M -18,-2 C -26,-14 -32,-10 -30,-2" fill="none" stroke="#7ed850" stroke-width="0.8" opacity="0.7"/>
      </g>
    </g>

    <!-- Little paws on the carrot -->
    <ellipse cx="120" cy="158" rx="10" ry="7" fill="url(#fur)" stroke="#7a7060" stroke-width="1"/>
    <ellipse cx="190" cy="158" rx="10" ry="7" fill="url(#fur)" stroke="#7a7060" stroke-width="1"/>
  </g>

  <!-- =============================================================== -->
  <!-- Speech bubble — "WHAT'S UP, DOC?"                                 -->
  <!-- =============================================================== -->
  <g transform="translate(345,58)">
    <g>
      <animateTransform attributeName="transform" type="scale"
                        values="1 1; 1.04 1.06; 1 1" dur="2.3s" repeatCount="indefinite"/>
      <!-- bubble body -->
      <path d="M -78,-30
               C -100,-30 -100,20 -70,22
               C -60,32 -50,32 -40,26
               L 78,26
               C 100,26 100,-30 78,-30 Z"
            fill="url(#bubble)" stroke="#3a2010" stroke-width="1.6"/>
      <!-- pointer -->
      <path d="M -60,20 L -84,44 L -46,26 Z"
            fill="url(#bubble)" stroke="#3a2010" stroke-width="1.6"/>
      <text x="0" y="6" text-anchor="middle" fill="#3a2010" font-size="20" font-weight="900"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" letter-spacing="1">
        WHAT'S UP, DOC?
      </text>
    </g>
  </g>

  <!-- =============================================================== -->
  <!-- Cartoon sparkle stars popping around the bullseye                 -->
  <!-- =============================================================== -->
  <g fill="url(#spark)">
    <circle cx="60" cy="30" r="6">
      <animate attributeName="r" values="2;7;2" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="40" r="5">
      <animate attributeName="r" values="1;6;1" dur="3.7s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="120" r="4">
      <animate attributeName="r" values="1;5;1" dur="4.3s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="140" r="5">
      <animate attributeName="r" values="1;6;1" dur="3.1s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Four-point sparkle plus-signs -->
  <g stroke="#fff4d8" stroke-width="1.4" stroke-linecap="round">
    <g transform="translate(220,20)" opacity="0.9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/>
      <line x1="-6" y1="0" x2="6" y2="0"/>
      <line x1="0" y1="-6" x2="0" y2="6"/>
    </g>
    <g transform="translate(305,90)" opacity="0.85">
      <animate attributeName="opacity" values="1;0.2;1" dur="4.3s" repeatCount="indefinite"/>
      <line x1="-5" y1="0" x2="5" y2="0"/>
      <line x1="0" y1="-5" x2="0" y2="5"/>
    </g>
    <g transform="translate(20,60)" opacity="0.85">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.7s" repeatCount="indefinite"/>
      <line x1="-5" y1="0" x2="5" y2="0"/>
      <line x1="0" y1="-5" x2="0" y2="5"/>
    </g>
  </g>

  <!-- =============================================================== -->
  <!-- RIGHT: text block                                                 -->
  <!-- =============================================================== -->
  <!-- Dark cushion behind the headline for legibility -->
  <ellipse cx="605" cy="88" rx="200" ry="42" fill="#0d1117" opacity="0.7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Headline — the date, dominant -->
    <text x="785" y="90" text-anchor="end" fill="#f4efdc" font-size="34" font-weight="700" letter-spacing="1">
      JULY 27, 2026
    </text>

    <!-- Subhead — orange, honoree + years -->
    <text x="785" y="118" text-anchor="end" fill="#ffb64a" font-size="15" font-weight="700" letter-spacing="3">
      BUGS BUNNY · 86 YEARS
    </text>

    <!-- Tertiary — italic, small letter-spaced -->
    <text x="785" y="138" text-anchor="end" fill="#f6a8c0" font-size="10" font-style="italic" letter-spacing="2" opacity="0.95">
      A WILD HARE · 27 JULY 1940 · TEX AVERY
    </text>

    <!-- Stamp -->
    <text x="785" y="164" text-anchor="end" fill="#f4c04a" font-size="8" opacity="0.7" letter-spacing="3">
      WARNER BROS · MERRIE MELODIES · THAT'S ALL FOLKS!
    </text>
  </g>

  <!-- Vignette on top -->
  <rect width="800" height="200" fill="url(#vig)"/>
</svg>
