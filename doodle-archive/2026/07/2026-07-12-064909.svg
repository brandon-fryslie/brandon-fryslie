<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Skylab re-entry (July 11, 1979) — 47 years since NASA's first space station broke apart during atmospheric re-entry over the Indian Ocean and Western Australia, showering debris across the Shire of Esperance. A dramatic upper-atmosphere tableau: pre-dawn deep-navy space above, warm horizon glow across the middle, tumbling Skylab fragmenting mid-right with orange plasma sheath, four bright fiery debris streaks arcing down-left across the frame each leaving a long comet tail, sparks and ember embers popping, a red ochre Australian outback silhouette (low hills, spinifex, a solitary boab) along the bottom edge, twinkling stars fading into the plasma zone, a large cream JULY 11, 2026 headline dominating the upper center, an orange-cyan SKYLAB · 47 YEARS · RE-ENTRY JULY 11, 1979 subhead beneath, and italic SHIRE OF ESPERANCE · WESTERN AUSTRALIA · SKYLAB IS FALLING tertiary along the very bottom edge. Palette: void black #05070f, deep navy #0a1030, warm atmosphere glow #b04a1a and #ff8a3a and #ffc57a, plasma white-hot #fff5d0, ember orange #ff6b1a, cream text #f5efe6, dust cyan trail #7fc8ff, outback ochre #7a3818 and #4a1e0a, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 11, 2026 — 47th anniversary of Skylab's atmospheric re-entry on July 11, 1979 over Western Australia. A dramatic pre-dawn upper-atmosphere tableau: deep navy space fading to a warm ember horizon glow, tumbling Skylab wrapped in orange plasma at mid-right, four fiery comet-tail debris streaks arcing down-left across the frame, sparks flickering, red-ochre Australian outback silhouette along the bottom, twinkling stars, a large cream JULY 11, 2026 headline, an orange-cyan SKYLAB · 47 YEARS · RE-ENTRY JULY 11, 1979 subhead, and italic SHIRE OF ESPERANCE · WESTERN AUSTRALIA · SKYLAB IS FALLING tertiary along the bottom edge.">
  <defs>
    <!-- Sky: deep space top fading to warm re-entry glow near horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="35%" stop-color="#0a1030"/>
      <stop offset="70%" stop-color="#2a1a2a"/>
      <stop offset="88%" stop-color="#b04a1a"/>
      <stop offset="100%" stop-color="#ff8a3a"/>
    </linearGradient>

    <!-- Fireball core gradient -->
    <radialGradient id="fireCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="35%" stop-color="#ffd066"/>
      <stop offset="70%" stop-color="#ff6b1a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a1a05" stop-opacity="0"/>
    </radialGradient>

    <!-- Debris trail gradient (orange to transparent) -->
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe07a" stop-opacity="0"/>
      <stop offset="55%" stop-color="#ff8a3a" stop-opacity="0.6"/>
      <stop offset="90%" stop-color="#ffd066" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Skylab metal body -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9c9c9"/>
      <stop offset="50%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>

    <!-- Gold thermal foil hint -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6b96a"/>
      <stop offset="100%" stop-color="#7a5a20"/>
    </linearGradient>

    <!-- Plasma sheath around Skylab -->
    <radialGradient id="plasma" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff2c0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff8a3a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Outback ochre -->
    <linearGradient id="outback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a04820"/>
      <stop offset="60%" stop-color="#7a3818"/>
      <stop offset="100%" stop-color="#4a1e0a"/>
    </linearGradient>

    <!-- Text glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fireball glow -->
    <filter id="fireGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <!-- Reusable debris streak: a slim tapered trail with a bright head.
         Coordinates: trail runs from (-140,0) to (0,0). Head at (0,0). -->
    <g id="streak">
      <!-- long soft outer trail -->
      <path d="M -140 4 Q -70 0 0 0 Q -70 0 -140 -4 Z" fill="url(#trail)" opacity="0.65"/>
      <!-- inner bright trail -->
      <path d="M -95 1.6 Q -45 0 0 0 Q -45 0 -95 -1.6 Z" fill="#ffe07a" opacity="0.9"/>
      <!-- hot core head -->
      <circle cx="0" cy="0" r="7" fill="url(#fireCore)"/>
      <circle cx="0" cy="0" r="3" fill="#fff5d0"/>
      <!-- little tumbling sparks -->
      <circle cx="-30" cy="-3" r="0.9" fill="#ffe07a"/>
      <circle cx="-55" cy="2" r="0.7" fill="#ffb84a"/>
      <circle cx="-80" cy="-1.5" r="0.6" fill="#ff8a3a"/>
    </g>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Star field, fading toward the warm horizon zone -->
  <g fill="#f5efe6">
    <circle cx="45" cy="18" r="0.9" opacity="0.85">
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="32" r="0.7" opacity="0.65">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="14" r="0.6" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="42" r="0.8" opacity="0.55">
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="10" r="0.7" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="11s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="22" r="0.9" opacity="0.85">
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="13s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="8" r="0.6" opacity="0.65">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="35" r="0.7" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="11s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="12" r="0.9" opacity="0.8">
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="13s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="46" r="0.6" opacity="0.55">
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="7s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="60" r="0.5" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="11s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="55" r="0.5" opacity="0.5">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="13s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Warm horizon aurora band -->
  <ellipse cx="400" cy="180" rx="480" ry="30" fill="#ff8a3a" opacity="0.25" filter="url(#fireGlow)"/>
  <ellipse cx="400" cy="188" rx="520" ry="18" fill="#ffc57a" opacity="0.35"/>

  <!-- Australian outback silhouette (bottom edge) -->
  <path d="M 0 200 L 0 178 Q 40 172 90 176 Q 150 182 210 174 Q 270 168 320 174 Q 380 180 440 172 Q 500 166 560 175 Q 620 182 690 173 Q 740 168 800 176 L 800 200 Z"
        fill="url(#outback)"/>
  <!-- Faint distant hill layer for depth -->
  <path d="M 0 200 L 0 184 Q 100 180 200 184 Q 320 189 440 183 Q 560 178 680 184 Q 740 187 800 183 L 800 200 Z"
        fill="#4a1e0a" opacity="0.6"/>

  <!-- Solitary boab tree silhouette on lower right -->
  <g fill="#2a1005" opacity="0.9" transform="translate(690,170)">
    <ellipse cx="0" cy="4" rx="7" ry="12"/>
    <path d="M -3 -6 L -6 -14 M 0 -8 L 0 -18 M 3 -6 L 5 -15 M -5 -4 L -10 -12 M 5 -4 L 10 -13" stroke="#2a1005" stroke-width="1.2" fill="none"/>
    <circle cx="-7" cy="-14" r="2"/>
    <circle cx="1" cy="-19" r="2"/>
    <circle cx="7" cy="-16" r="2.2"/>
    <circle cx="-11" cy="-13" r="1.6"/>
    <circle cx="11" cy="-14" r="1.6"/>
  </g>

  <!-- Spinifex tufts along the bottom -->
  <g stroke="#5a2410" stroke-width="0.8" opacity="0.8">
    <path d="M 40 190 L 38 184 M 42 190 L 44 185 M 40 190 L 40 183" fill="none"/>
    <path d="M 180 191 L 178 186 M 182 191 L 184 187 M 180 191 L 180 184" fill="none"/>
    <path d="M 340 189 L 338 184 M 342 189 L 344 185 M 340 189 L 340 183" fill="none"/>
    <path d="M 520 191 L 518 186 M 522 191 L 524 187 M 520 191 L 520 184" fill="none"/>
    <path d="M 620 190 L 618 185 M 622 190 L 624 186 M 620 190 L 620 183" fill="none"/>
  </g>

  <!-- Debris streaks — arcing down-left, each a fireball with tapered trail.
       We rotate each 'streak' symbol so its trail points up-right and the head leads down-left.
       Streaks pulse in brightness with prime-number durations. -->

  <!-- Big lead debris — center -->
  <g transform="translate(360,110) rotate(28)">
    <use href="#streak">
      <animate attributeName="opacity" values="0.5;1;0.7;1;0.5" dur="1.3s" repeatCount="indefinite"/>
    </use>
    <!-- extra plasma bloom around head -->
    <circle cx="0" cy="0" r="14" fill="url(#fireCore)" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Secondary debris — upper -->
  <g transform="translate(230,70) rotate(32)">
    <use href="#streak">
      <animate attributeName="opacity" values="0.4;0.9;0.5;0.9;0.4" dur="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Small debris — high up left -->
  <g transform="translate(155,45) rotate(35) scale(0.7)">
    <use href="#streak">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="0.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Small debris — mid low left -->
  <g transform="translate(115,140) rotate(24) scale(0.55)">
    <use href="#streak">
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="0.7s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Tiny debris — deep left near horizon -->
  <g transform="translate(50,160) rotate(20) scale(0.45)">
    <use href="#streak">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Skylab, tumbling mid-right, wrapped in plasma. Tilted about 25deg, breaking apart. -->
  <g transform="translate(620,105) rotate(-18)">
    <!-- Plasma bow shock / sheath -->
    <ellipse cx="10" cy="0" rx="60" ry="28" fill="url(#plasma)" opacity="0.75">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="1.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="30" cy="0" rx="42" ry="14" fill="#fff5d0" opacity="0.7" filter="url(#fireGlow)">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Main workshop cylinder (Skylab body) -->
    <rect x="-32" y="-7" width="46" height="14" fill="url(#metal)" stroke="#2a2a2a" stroke-width="0.5"/>
    <!-- gold thermal foil section -->
    <rect x="-32" y="-7" width="16" height="14" fill="url(#gold)" opacity="0.9"/>
    <!-- rivet/segment lines -->
    <line x1="-32" y1="0" x2="14" y2="0" stroke="#3a3a3a" stroke-width="0.4"/>
    <line x1="-16" y1="-7" x2="-16" y2="7" stroke="#3a3a3a" stroke-width="0.4"/>
    <line x1="-4" y1="-7" x2="-4" y2="7" stroke="#3a3a3a" stroke-width="0.4"/>
    <line x1="8" y1="-7" x2="8" y2="7" stroke="#3a3a3a" stroke-width="0.4"/>

    <!-- Docking adapter forward end (right) -->
    <rect x="14" y="-4" width="8" height="8" fill="#6a6a6a" stroke="#2a2a2a" stroke-width="0.4"/>
    <rect x="22" y="-2" width="4" height="4" fill="#4a4a4a"/>

    <!-- Apollo Telescope Mount cross (windmill solar panels) atop the body -->
    <g transform="translate(-8,-7)">
      <!-- panel 1 (up) -->
      <rect x="-6" y="-16" width="12" height="9" fill="#0a2058" stroke="#1a3078" stroke-width="0.4"/>
      <line x1="-6" y1="-13" x2="6" y2="-13" stroke="#1a3078" stroke-width="0.3"/>
      <line x1="-6" y1="-10" x2="6" y2="-10" stroke="#1a3078" stroke-width="0.3"/>
      <line x1="-2" y1="-16" x2="-2" y2="-7" stroke="#1a3078" stroke-width="0.3"/>
      <line x1="2" y1="-16" x2="2" y2="-7" stroke="#1a3078" stroke-width="0.3"/>
    </g>
    <!-- one big surviving side solar wing (angled) -->
    <g transform="translate(-10,7) rotate(15)">
      <rect x="-4" y="0" width="8" height="18" fill="#0a2058" stroke="#1a3078" stroke-width="0.4"/>
      <line x1="-4" y1="6" x2="4" y2="6" stroke="#1a3078" stroke-width="0.3"/>
      <line x1="-4" y1="12" x2="4" y2="12" stroke="#1a3078" stroke-width="0.3"/>
    </g>

    <!-- A torn/broken panel drifting off -->
    <g transform="translate(20,-14) rotate(35)">
      <rect x="-3" y="-1" width="6" height="5" fill="#0a2058" stroke="#1a3078" stroke-width="0.3" opacity="0.85"/>
    </g>

    <!-- Small ember bits shedding -->
    <g fill="#ffd066">
      <circle cx="-38" cy="4" r="1.1">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-44" cy="-3" r="0.9">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-50" cy="6" r="0.7">
        <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Ambient sparks scattered across the mid-sky -->
  <g fill="#ffd066">
    <circle cx="290" cy="55" r="0.9">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="118" r="0.8">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="145" r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="130" r="0.9">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="90" r="0.7">
      <animate attributeName="opacity" values="0.25;0.95;0.25" dur="1.3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HEADLINE and text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- backing plate for legibility over busy sky -->
    <rect x="80" y="34" width="440" height="60" rx="4" fill="#05070f" opacity="0.55"/>

    <text x="300" y="76" font-size="38" font-weight="800" letter-spacing="2" fill="#f5efe6" filter="url(#softGlow)">
      JULY 11, 2026
    </text>

    <text x="300" y="102" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#ff8a3a">
      SKYLAB
      <tspan fill="#7fc8ff"> · 47 YEARS · </tspan>
      <tspan fill="#ff8a3a">RE-ENTRY JULY 11, 1979</tspan>
    </text>

    <text x="400" y="196" font-size="8.5" font-style="italic" letter-spacing="2.5" fill="#ffc57a" opacity="0.95">
      SHIRE OF ESPERANCE · WESTERN AUSTRALIA · SKYLAB IS FALLING
    </text>
  </g>

</svg>
