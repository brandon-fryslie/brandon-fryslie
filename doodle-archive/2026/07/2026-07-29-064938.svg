<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Marcel Duchamp's 139th Birthday — Born July 28, 1887, in Blainville-Crevon, Normandy, France. French-American Dada / conceptual artist whose readymades (Bicycle Wheel, 1913; Fountain, 1917) and cubo-futurist canvas Nude Descending a Staircase, No. 2 (1912) blew the doors off what could be called art. A Dada-museum tableau: a sepia-toned gallery-paper backdrop with a faint blueprint grid; on the left, Duchamp's Bicycle Wheel readymade — a wooden four-legged stool with an inverted bicycle-wheel bolted to its seat, spinning slowly; in the middle, Nude Descending a Staircase rendered as five cascading angular cubist figures stepping diagonally down-right across a stair-line; a hand-lettered R. MUTT 1917 signature scrawl floats near the wheel as a wink to Fountain; scattered geometric confetti drifts across the frame; a big ivory JULY 28, 2026 headline dominates the upper right; a brick-red MARCEL DUCHAMP · 139 YEARS subhead; italic NUDE DESCENDING A STAIRCASE · BLAINVILLE · 28 JULY 1887 · DADA tertiary. Palette: near-black #0d1117, gallery sepia #d4b896, warm cream #f0e4c8, ochre #b8860b, burnt umber #6b3510, brick red #a04030, ivory #f4efdc, muted teal #5a8080, wheel spoke steel #cfc8b8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 28, 2026 — Marcel Duchamp's 139th birthday (born July 28, 1887, Blainville-Crevon, France). A Dada-museum tableau on a sepia gallery-paper backdrop: Duchamp's Bicycle Wheel readymade (an inverted spinning wheel bolted to a wooden stool) on the left, five cascading cubist figures rendered as Nude Descending a Staircase stepping diagonally down-right across the middle, a hand-lettered R. MUTT 1917 signature floating as a wink to Fountain, scattered geometric confetti, a large ivory JULY 28, 2026 headline dominating the upper right, a brick-red MARCEL DUCHAMP · 139 YEARS subhead, and italic NUDE DESCENDING A STAIRCASE · BLAINVILLE · 28 JULY 1887 · DADA tertiary.">
  <defs>
    <!-- Sepia gallery paper -->
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c8a878"/>
      <stop offset="45%"  stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#a08258"/>
    </linearGradient>

    <!-- Wood stool -->
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#8a5028"/>
      <stop offset="55%"  stop-color="#6b3510"/>
      <stop offset="100%" stop-color="#3a1e08"/>
    </linearGradient>

    <!-- Wheel rim -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3a2818"/>
      <stop offset="50%"  stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#3a2818"/>
    </linearGradient>

    <!-- Cubist figure gradient — warm ochre planes -->
    <linearGradient id="fig1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8c078"/>
      <stop offset="100%" stop-color="#8a5c20"/>
    </linearGradient>
    <linearGradient id="fig2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d4a860"/>
      <stop offset="100%" stop-color="#6b3510"/>
    </linearGradient>
    <linearGradient id="fig3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c89848"/>
      <stop offset="100%" stop-color="#4a2010"/>
    </linearGradient>

    <!-- Paper grain filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35
                             0 0 0 0 0.22
                             0 0 0 0 0.10
                             0 0 0 0.12 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Text cushion -->
    <linearGradient id="cushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a1408" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Paper backdrop -->
  <rect width="800" height="200" fill="url(#paper)"/>
  <!-- Grain overlay -->
  <rect width="800" height="200" fill="#d4b896" filter="url(#grain)"/>

  <!-- Faint blueprint grid -->
  <g stroke="#6b3510" stroke-width="0.4" opacity="0.22" fill="none">
    <path d="M 0,25 L 800,25 M 0,50 L 800,50 M 0,75 L 800,75 M 0,100 L 800,100 M 0,125 L 800,125 M 0,150 L 800,150 M 0,175 L 800,175"/>
    <path d="M 25,0 L 25,200 M 75,0 L 75,200 M 125,0 L 125,200 M 175,0 L 175,200 M 225,0 L 225,200 M 275,0 L 275,200 M 325,0 L 325,200 M 375,0 L 375,200 M 425,0 L 425,200 M 475,0 L 475,200 M 525,0 L 525,200 M 575,0 L 575,200 M 625,0 L 625,200 M 675,0 L 675,200 M 725,0 L 725,200 M 775,0 L 775,200"/>
  </g>

  <!-- =============================================================== -->
  <!-- LEFT: Bicycle Wheel readymade (1913)                              -->
  <!-- Stool base + inverted wheel bolted to seat. Wheel spins slowly.   -->
  <!-- =============================================================== -->
  <g>
    <!-- Wooden stool seat (top of stool = bolt point for wheel) -->
    <ellipse cx="105" cy="150" rx="46" ry="10" fill="url(#wood)" stroke="#2a1808" stroke-width="1.2"/>
    <ellipse cx="105" cy="148" rx="46" ry="10" fill="#8a5028" opacity="0.4"/>
    <!-- Stool legs (four splayed) -->
    <g stroke="#2a1808" stroke-width="1.2" fill="url(#wood)">
      <path d="M 68,152 L 60,196 L 66,196 L 78,154 Z"/>
      <path d="M 142,152 L 150,196 L 144,196 L 132,154 Z"/>
      <path d="M 88,154 L 84,196 L 90,196 L 96,156 Z"/>
      <path d="M 122,154 L 126,196 L 120,196 L 114,156 Z"/>
    </g>
    <!-- Stool cross-bracing -->
    <g stroke="#2a1808" stroke-width="1" fill="none">
      <path d="M 70,178 L 138,178"/>
      <path d="M 80,188 L 128,188"/>
    </g>

    <!-- Fork stem rising from stool to wheel hub -->
    <rect x="102" y="86" width="6" height="64" fill="url(#wood)" stroke="#2a1808" stroke-width="1"/>
    <!-- Fork prongs cradling the axle -->
    <path d="M 92,84 L 105,72 L 118,84" fill="none" stroke="#2a1808" stroke-width="2"/>

    <!-- WHEEL — inverted, hub at (105,72). Spins around its own center. -->
    <g transform="translate(105,72)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0;360" dur="11s" repeatCount="indefinite"/>
        <!-- Tire (outer) -->
        <circle r="60" fill="none" stroke="url(#rim)" stroke-width="8"/>
        <!-- Inner rim -->
        <circle r="52" fill="none" stroke="#2a1808" stroke-width="2" opacity="0.75"/>
        <!-- Spokes -->
        <g stroke="#cfc8b8" stroke-width="1.2" opacity="0.9">
          <line x1="0" y1="-56" x2="0" y2="56"/>
          <line x1="-56" y1="0" x2="56" y2="0"/>
          <line x1="-40" y1="-40" x2="40" y2="40"/>
          <line x1="40" y1="-40" x2="-40" y2="40"/>
          <line x1="-20" y1="-52" x2="20" y2="52"/>
          <line x1="20" y1="-52" x2="-20" y2="52"/>
          <line x1="-52" y1="-20" x2="52" y2="20"/>
          <line x1="52" y1="-20" x2="-52" y2="20"/>
        </g>
        <!-- Hub -->
        <circle r="6" fill="#1a1008" stroke="#8a5028" stroke-width="1.2"/>
        <circle r="2.5" fill="#cfc8b8"/>
        <!-- Reflective glint on rim -->
        <path d="M -50,-32 A 60 60 0 0 1 -32,-50" fill="none" stroke="#f0e4c8" stroke-width="1.4" opacity="0.7"/>
      </g>
    </g>

    <!-- Small floor shadow -->
    <ellipse cx="105" cy="198" rx="60" ry="3" fill="#1a1008" opacity="0.35"/>
  </g>

  <!-- =============================================================== -->
  <!-- MIDDLE: Nude Descending a Staircase (1912)                        -->
  <!-- Five cascading cubist figures stepping down-right, ghosted trail. -->
  <!-- Stair diagonal beneath. Whole group has a faint breathing motion. -->
  <!-- =============================================================== -->
  <g transform="translate(190,20)">
    <!-- Stair diagonal (sepia line-drawing suggestion) -->
    <g stroke="#3a1e08" stroke-width="1.4" fill="none" opacity="0.65">
      <path d="M 10,140 L 40,140 L 40,150 L 70,150 L 70,160 L 100,160 L 100,170 L 130,170 L 130,180 L 160,180"/>
      <!-- risers hint -->
      <path d="M 40,150 L 40,140 M 70,160 L 70,150 M 100,170 L 100,160 M 130,180 L 130,170" opacity="0.5"/>
    </g>

    <!-- Ghost trail wisps behind figures -->
    <g fill="#8a5c20" opacity="0.15">
      <path d="M 8,20 L 34,15 L 42,55 L 22,110 L 14,90 Z"/>
      <path d="M 40,25 L 66,22 L 74,62 L 54,115 L 46,95 Z"/>
      <path d="M 72,32 L 98,30 L 106,70 L 86,120 L 78,102 Z"/>
    </g>

    <!-- FIGURE 1 (topmost, leftmost) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 0,-1.5; 0,0" dur="7s" repeatCount="indefinite"/>
      <!-- torso plane -->
      <polygon points="10,20 30,18 34,55 18,58" fill="url(#fig1)" stroke="#3a1e08" stroke-width="0.8"/>
      <!-- head plane -->
      <polygon points="18,4 32,4 30,20 16,20" fill="#e8c078" stroke="#3a1e08" stroke-width="0.8"/>
      <!-- limb plane -->
      <polygon points="8,55 22,58 26,95 12,92" fill="#c89848" stroke="#3a1e08" stroke-width="0.8"/>
      <!-- accent stripe -->
      <line x1="22" y1="20" x2="26" y2="55" stroke="#3a1e08" stroke-width="0.6" opacity="0.7"/>
    </g>

    <!-- FIGURE 2 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 0,-1.2; 0,0" dur="7s" begin="-1.4s" repeatCount="indefinite"/>
      <polygon points="42,25 62,24 66,62 50,65" fill="url(#fig2)" stroke="#3a1e08" stroke-width="0.8"/>
      <polygon points="48,10 64,10 62,26 46,26" fill="#d4a860" stroke="#3a1e08" stroke-width="0.8"/>
      <polygon points="42,62 56,65 60,102 44,100" fill="#a07028" stroke="#3a1e08" stroke-width="0.8"/>
      <line x1="54" y1="26" x2="58" y2="62" stroke="#3a1e08" stroke-width="0.6" opacity="0.7"/>
    </g>

    <!-- FIGURE 3 (middle, most defined) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 0,-1.6; 0,0" dur="7s" begin="-2.8s" repeatCount="indefinite"/>
      <polygon points="74,32 96,32 100,72 80,75" fill="url(#fig3)" stroke="#3a1e08" stroke-width="0.9"/>
      <polygon points="80,16 98,16 96,32 78,32" fill="#c89848" stroke="#3a1e08" stroke-width="0.8"/>
      <polygon points="72,72 90,75 94,112 76,110" fill="#8a5c20" stroke="#3a1e08" stroke-width="0.9"/>
      <!-- fanned motion planes -->
      <polygon points="96,32 108,40 104,58 96,52" fill="#e8c078" stroke="#3a1e08" stroke-width="0.6" opacity="0.85"/>
      <polygon points="90,75 100,82 98,100 88,96" fill="#a07028" stroke="#3a1e08" stroke-width="0.6" opacity="0.85"/>
      <line x1="86" y1="32" x2="90" y2="72" stroke="#3a1e08" stroke-width="0.6" opacity="0.7"/>
    </g>

    <!-- FIGURE 4 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 0,-1.2; 0,0" dur="7s" begin="-4.2s" repeatCount="indefinite"/>
      <polygon points="106,45 126,44 130,84 112,86" fill="url(#fig2)" stroke="#3a1e08" stroke-width="0.8"/>
      <polygon points="112,28 128,28 126,44 110,44" fill="#d4a860" stroke="#3a1e08" stroke-width="0.8"/>
      <polygon points="106,84 122,86 124,122 108,120" fill="#8a5c20" stroke="#3a1e08" stroke-width="0.8"/>
      <line x1="118" y1="44" x2="122" y2="84" stroke="#3a1e08" stroke-width="0.6" opacity="0.7"/>
    </g>

    <!-- FIGURE 5 (rightmost, faintest — ghost at bottom of stair) -->
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 0,-0.8; 0,0" dur="7s" begin="-5.6s" repeatCount="indefinite"/>
      <polygon points="136,56 156,55 160,95 142,97" fill="url(#fig1)" stroke="#3a1e08" stroke-width="0.8"/>
      <polygon points="142,40 158,40 156,56 140,56" fill="#e8c078" stroke="#3a1e08" stroke-width="0.8"/>
      <polygon points="136,95 152,97 154,132 138,130" fill="#a07028" stroke="#3a1e08" stroke-width="0.8"/>
      <line x1="148" y1="56" x2="152" y2="95" stroke="#3a1e08" stroke-width="0.6" opacity="0.7"/>
    </g>
  </g>

  <!-- =============================================================== -->
  <!-- R. MUTT 1917 signature (wink to Fountain)                         -->
  <!-- =============================================================== -->
  <g transform="translate(45,175) rotate(-8)">
    <text font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="11" fill="#2a1808" opacity="0.85" font-style="italic">
      R. Mutt 1917
    </text>
    <!-- underscribble -->
    <path d="M 0,3 C 15,6 40,4 58,7" fill="none" stroke="#2a1808" stroke-width="0.7" opacity="0.6"/>
  </g>

  <!-- =============================================================== -->
  <!-- Geometric confetti drifting                                        -->
  <!-- =============================================================== -->
  <g opacity="0.85">
    <polygon points="0,0 6,0 3,8" fill="#a04030" transform="translate(370,30)">
      <animateTransform attributeName="transform" type="translate"
                        values="370,30; 372,42; 370,30" dur="13s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="17s" repeatCount="indefinite" additive="sum"/>
    </polygon>
    <rect x="0" y="0" width="6" height="6" fill="#5a8080" transform="translate(410,150) rotate(20)">
      <animateTransform attributeName="transform" type="translate"
                        values="410,150; 412,158; 410,150" dur="11s" repeatCount="indefinite" additive="sum"/>
    </rect>
    <circle r="3" fill="#a04030" transform="translate(160,180)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,0 5,3 5,9 0,12 -5,9 -5,3" fill="none" stroke="#5a8080" stroke-width="0.8" transform="translate(20,30)">
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="19s" repeatCount="indefinite" additive="sum"/>
    </polygon>
  </g>

  <!-- =============================================================== -->
  <!-- RIGHT: Text block                                                 -->
  <!-- =============================================================== -->
  <!-- Dark cushion for text legibility -->
  <rect x="440" y="30" width="360" height="150" fill="url(#cushion)" opacity="0.88"/>
  <!-- Left edge accent -->
  <rect x="440" y="30" width="3" height="150" fill="#a04030"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Headline — the date, dominant -->
    <text x="785" y="82" text-anchor="end" fill="#f4efdc" font-size="34" font-weight="700" letter-spacing="1">
      JULY 28, 2026
    </text>

    <!-- Subhead -->
    <text x="785" y="110" text-anchor="end" fill="#e08060" font-size="15" font-weight="700" letter-spacing="3">
      MARCEL DUCHAMP · 139 YEARS
    </text>

    <!-- Tertiary -->
    <text x="785" y="132" text-anchor="end" fill="#d4b896" font-size="10" font-style="italic" letter-spacing="2" opacity="0.95">
      NUDE DESCENDING A STAIRCASE · DADA
    </text>

    <!-- Quaternary birthplace -->
    <text x="785" y="150" text-anchor="end" fill="#b8a888" font-size="9" letter-spacing="2" opacity="0.85">
      BLAINVILLE · 28 JULY 1887
    </text>

    <!-- Stamp -->
    <text x="785" y="170" text-anchor="end" fill="#8a8060" font-size="7.5" opacity="0.75" letter-spacing="3">
      BICYCLE WHEEL 1913 · FOUNTAIN 1917 · READYMADE
    </text>
  </g>

  <!-- Vignette on top -->
  <rect width="800" height="200" fill="url(#vig)"/>
</svg>
