<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Vincent van Gogh — 136 Years — Vincent van Gogh died on July 29, 1890, in Auvers-sur-Oise, France, at age 37. In the last ten weeks of his life he painted at a fever pitch, including "Wheatfield with Crows" and "Portrait of Dr. Gachet." His masterpiece "The Starry Night" was painted in June 1889 from the barred window of the Saint-Paul-de-Mausole asylum in Saint-Rémy-de-Provence. A Starry Night homage on an 800x200 canvas: a deep cobalt-and-indigo sky whipped with concentric painterly spiral brushstrokes forming two churning wind-currents across the upper half; a large crescent-moon-and-sun luminary in warm cadmium yellow at the upper right with radiating short brushstrokes; a scatter of eight-armed haloed stars distributed across the sky; a tall blue-black cypress flame rising along the left edge; a small silhouetted village with a spired church nestled at the base under the swirls; a warm-yellow JULY 29, 2026 headline in the lower right; cream VINCENT VAN GOGH · 136 YEARS subhead; italic AUVERS-SUR-OISE · 29 JULY 1890 · THE STARRY NIGHT tertiary. Palette: deep cobalt #1e3a8a, indigo #0f1a4a, midnight #050a1e, cadmium yellow #ffcf40, warm yellow #ffe066, cream #fff4c9, cypress green-black #0a1a12. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 29, 2026 — 136 years since Vincent van Gogh died on July 29, 1890 in Auvers-sur-Oise, France. A Starry Night homage: a deep cobalt-and-indigo sky whipped with painterly concentric spiral brushstrokes forming two churning wind-currents across the upper half; a large crescent-moon-sun luminary at the upper right with radiating brushstrokes; a scatter of eight-armed haloed stars; a tall blue-black cypress flame rising along the left edge; a small silhouetted village with a spired church nestled beneath the swirls; a warm-yellow JULY 29, 2026 headline in the lower right; a cream VINCENT VAN GOGH · 136 YEARS subhead; italic AUVERS-SUR-OISE · 29 JULY 1890 · THE STARRY NIGHT tertiary.">
  <defs>
    <!-- Sky gradient: indigo top, cobalt mid, midnight bottom -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0f1a4a"/>
      <stop offset="35%"  stop-color="#1e3a8a"/>
      <stop offset="80%"  stop-color="#0a1636"/>
      <stop offset="100%" stop-color="#050a1e"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffe066" stop-opacity="0.95"/>
      <stop offset="30%"  stop-color="#ffcf40" stop-opacity="0.55"/>
      <stop offset="75%"  stop-color="#ff9a1f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff9a1f" stop-opacity="0"/>
    </radialGradient>

    <!-- Star aura -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff4c9" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#ffe066" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffcf40" stop-opacity="0"/>
    </radialGradient>

    <!-- Impasto brushstroke wobble filter -->
    <filter id="impasto" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>

    <!-- Bigger wave filter for hills -->
    <filter id="hillTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.06" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>

    <!-- Reusable Van Gogh eight-arm star -->
    <symbol id="vgstar" overflow="visible">
      <circle r="10" fill="url(#starGlow)"/>
      <path d="M 0,-7 L 1.1,-1.1 L 7,0 L 1.1,1.1 L 0,7 L -1.1,1.1 L -7,0 L -1.1,-1.1 Z" fill="#fff4c9"/>
      <path d="M 0,-5 L 0.8,-0.8 L 5,0 L 0.8,0.8 L 0,5 L -0.8,0.8 L -5,0 L -0.8,-0.8 Z"
            fill="#ffe066" transform="rotate(22.5)"/>
      <circle r="1.3" fill="#ffffff"/>
    </symbol>

    <!-- Text cushion behind headline -->
    <linearGradient id="cushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#050a1e" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#050a1e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050a1e" stop-opacity="0"/>
    </linearGradient>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="55%" r="80%">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <!-- ================================================================== -->
  <!-- Base sky                                                             -->
  <!-- ================================================================== -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Horizontal wind-stroke bands across the whole sky (subtle) -->
  <g stroke-linecap="round" fill="none" opacity="0.55" filter="url(#impasto)">
    <path d="M -20,25 Q 100,15 240,28 Q 380,42 520,26 Q 660,12 820,28" stroke="#3a4aa0" stroke-width="2.5"/>
    <path d="M -20,45 Q 120,32 260,48 Q 400,62 540,44 Q 680,30 820,46" stroke="#4a5cb8" stroke-width="2"/>
    <path d="M -20,68 Q 140,55 280,72 Q 420,86 560,66 Q 700,50 820,68" stroke="#2a3a90" stroke-width="2.5"/>
    <path d="M -20,92 Q 120,78 260,96 Q 400,110 540,90 Q 680,74 820,92" stroke="#3a4aa0" stroke-width="2"/>
    <path d="M -20,118 Q 140,104 280,122 Q 420,138 560,116 Q 700,100 820,118" stroke="#25358a" stroke-width="2.5"/>
    <path d="M -20,140 Q 120,126 260,144 Q 400,160 540,140 Q 680,122 820,140" stroke="#1a2a78" stroke-width="2.2"/>
  </g>

  <!-- ================================================================== -->
  <!-- SWIRL A: large primary spiral (center-left, ~x=240, y=75)           -->
  <!-- Built from stacked concentric elliptical rings, each a brushstroke  -->
  <!-- ================================================================== -->
  <g transform="translate(240,75)" filter="url(#impasto)">
    <animateTransform attributeName="transform" type="rotate"
                      values="0;360" dur="61s" repeatCount="indefinite" additive="sum"/>
    <g fill="none" stroke-linecap="round" transform="rotate(-8)">
      <!-- outer rings (dark cobalt) -->
      <ellipse cx="0" cy="0" rx="128" ry="46" stroke="#3a4aa8" stroke-width="2" opacity="0.55"
               stroke-dasharray="60 30 40 50 80 40"/>
      <ellipse cx="0" cy="0" rx="118" ry="40" stroke="#5a70c8" stroke-width="1.8" opacity="0.6"
               stroke-dasharray="70 40 50 30 60 50"/>
      <ellipse cx="0" cy="0" rx="104" ry="34" stroke="#a3b8f2" stroke-width="1.6" opacity="0.7"
               stroke-dasharray="80 25 40 55 90 35"/>
      <!-- inner rings, brighter cream -->
      <ellipse cx="0" cy="0" rx="88"  ry="28" stroke="#c8d4f0" stroke-width="1.6" opacity="0.8"
               stroke-dasharray="60 20 55 30 70 25"/>
      <ellipse cx="0" cy="0" rx="72"  ry="22" stroke="#fff4c9" stroke-width="1.8" opacity="0.85"
               stroke-dasharray="55 22 40 28 60 30"/>
      <ellipse cx="0" cy="0" rx="56"  ry="17" stroke="#ffe066" stroke-width="1.6" opacity="0.85"
               stroke-dasharray="40 20 55 15 45 22"/>
      <ellipse cx="0" cy="0" rx="42"  ry="12" stroke="#fff4c9" stroke-width="1.4" opacity="0.9"
               stroke-dasharray="30 15 40 20 35 18"/>
      <ellipse cx="0" cy="0" rx="28"  ry="8"  stroke="#ffe066" stroke-width="1.4" opacity="0.9"
               stroke-dasharray="20 10 25 12"/>
      <ellipse cx="0" cy="0" rx="16"  ry="4.5" stroke="#fff4c9" stroke-width="1.2" opacity="0.95"/>
    </g>
    <!-- Bright core -->
    <circle cx="0" cy="0" r="7" fill="#fff4c9"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffe066" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- ================================================================== -->
  <!-- SWIRL B: smaller secondary spiral (right-of-center, ~x=470, y=65)    -->
  <!-- ================================================================== -->
  <g transform="translate(470,65)" filter="url(#impasto)">
    <animateTransform attributeName="transform" type="rotate"
                      values="360;0" dur="47s" repeatCount="indefinite" additive="sum"/>
    <g fill="none" stroke-linecap="round" transform="rotate(12)">
      <ellipse cx="0" cy="0" rx="92" ry="34" stroke="#3a4aa8" stroke-width="1.8" opacity="0.55"
               stroke-dasharray="50 25 45 30 55 30"/>
      <ellipse cx="0" cy="0" rx="80" ry="28" stroke="#6c82d4" stroke-width="1.6" opacity="0.7"
               stroke-dasharray="60 20 40 28 55 25"/>
      <ellipse cx="0" cy="0" rx="66" ry="22" stroke="#b8c8f0" stroke-width="1.6" opacity="0.75"
               stroke-dasharray="55 22 50 20 45 28"/>
      <ellipse cx="0" cy="0" rx="52" ry="17" stroke="#fff4c9" stroke-width="1.6" opacity="0.85"
               stroke-dasharray="45 18 35 22 50 20"/>
      <ellipse cx="0" cy="0" rx="38" ry="12" stroke="#ffe066" stroke-width="1.4" opacity="0.9"
               stroke-dasharray="30 15 40 12 30 18"/>
      <ellipse cx="0" cy="0" rx="24" ry="7"  stroke="#fff4c9" stroke-width="1.3" opacity="0.95"
               stroke-dasharray="20 10 25 10"/>
      <ellipse cx="0" cy="0" rx="12" ry="3.5" stroke="#ffe066" stroke-width="1.2" opacity="1"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="#ffe066"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffe066" stroke-width="0.8" opacity="0.55"/>
  </g>

  <!-- ================================================================== -->
  <!-- Moon-sun luminary (upper right)                                      -->
  <!-- ================================================================== -->
  <g transform="translate(710,52)">
    <circle r="52" fill="url(#moonGlow)">
      <animate attributeName="r" values="48;58;48" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" repeatCount="indefinite"/>
    </circle>
    <!-- disc + crescent bite -->
    <circle r="22" fill="#ffe066"/>
    <circle cx="8" cy="-3" r="18.5" fill="#0f1a4a"/>
    <!-- crescent tapered highlight -->
    <path d="M -16,-8 Q -20,0 -16,10 Q -12,14 -8,9 Q -14,0 -8,-11 Q -12,-14 -16,-8 Z"
          fill="#fff4c9" opacity="0.92"/>
    <!-- radiating short brushstrokes -->
    <g stroke="#ffcf40" stroke-width="1.5" stroke-linecap="round" opacity="0.85" filter="url(#impasto)">
      <line x1="0" y1="-30" x2="0"  y2="-40"/>
      <line x1="0" y1="30"  x2="0"  y2="40"/>
      <line x1="-30" y1="0" x2="-40" y2="0"/>
      <line x1="30"  y1="0" x2="40"  y2="0"/>
      <line x1="-22" y1="-22" x2="-30" y2="-30"/>
      <line x1="22"  y1="-22" x2="30"  y2="-30"/>
      <line x1="-22" y1="22"  x2="-30" y2="30"/>
      <line x1="22"  y1="22"  x2="30"  y2="30"/>
      <line x1="-13" y1="-27" x2="-16" y2="-36"/>
      <line x1="13"  y1="-27" x2="16"  y2="-36"/>
      <line x1="-27" y1="-13" x2="-36" y2="-16"/>
      <line x1="27"  y1="-13" x2="36"  y2="-16"/>
    </g>
  </g>

  <!-- ================================================================== -->
  <!-- Van Gogh eight-armed stars scattered across the sky                  -->
  <!-- ================================================================== -->
  <g>
    <g transform="translate(75,40)">
      <use href="#vgstar"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(365,25)">
      <use href="#vgstar" transform="scale(0.85)"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="11s" repeatCount="indefinite" begin="1s"/>
    </g>
    <g transform="translate(575,20)">
      <use href="#vgstar"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="13s" repeatCount="indefinite" begin="2s"/>
    </g>
    <g transform="translate(140,115)">
      <use href="#vgstar" transform="scale(0.7)"/>
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="11s" repeatCount="indefinite" begin="3s"/>
    </g>
    <g transform="translate(605,120)">
      <use href="#vgstar" transform="scale(0.6)"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="13s" repeatCount="indefinite" begin="4s"/>
    </g>
    <g transform="translate(340,125)">
      <use href="#vgstar" transform="scale(0.55)"/>
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="7s" repeatCount="indefinite" begin="5s"/>
    </g>
    <g transform="translate(500,130)">
      <use href="#vgstar" transform="scale(0.5)"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="11s" repeatCount="indefinite" begin="1.5s"/>
    </g>
  </g>

  <!-- ================================================================== -->
  <!-- Cypress flame silhouette (foreground, left)                          -->
  <!-- ================================================================== -->
  <g>
    <g transform="translate(55,200)">
      <animateTransform attributeName="transform" type="rotate"
                        values="-1.6 0 0; 1.6 0 0; -1.6 0 0" dur="13s" repeatCount="indefinite" additive="sum"/>
      <path d="M 0,0
               C -22,-25 -28,-60 -18,-95
               C -28,-120 -14,-145 -8,-165
               C -6,-178 -12,-188 -3,-200
               C 6,-188 -1,-178 4,-165
               C 12,-145 22,-120 14,-95
               C 24,-65 18,-30 0,0 Z"
            fill="#0a1a12"/>
      <g stroke="#1a3a2a" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.9">
        <path d="M -8,-20 Q -12,-55 -6,-95 Q -12,-135 -4,-180"/>
        <path d="M  5,-25 Q  12,-60 5,-100 Q 10,-140 1,-185"/>
        <path d="M -1,-45 Q  2,-85 -3,-125 Q 2,-165 -1,-192"/>
      </g>
      <g stroke="#0f2418" stroke-width="1" fill="none" stroke-linecap="round">
        <path d="M -16,-30 Q -22,-40 -16,-50"/>
        <path d="M  14,-45 Q  20,-55  14,-65"/>
        <path d="M -14,-80 Q -20,-90 -14,-100"/>
        <path d="M  12,-105 Q  18,-115 12,-125"/>
        <path d="M -12,-140 Q -18,-150 -12,-160"/>
      </g>
    </g>
  </g>

  <!-- ================================================================== -->
  <!-- Rolling hill horizon + tiny village with spired church               -->
  <!-- ================================================================== -->
  <g>
    <path d="M 0,175 Q 120,160 240,168 Q 360,178 480,170 Q 600,162 720,172 L 800,170 L 800,200 L 0,200 Z"
          fill="#0f1a4a" filter="url(#hillTexture)"/>
    <path d="M 0,185 Q 200,175 400,183 Q 600,190 800,180 L 800,200 L 0,200 Z"
          fill="#050a1e"/>

    <!-- Village huddle (~x=380, y=175) -->
    <g fill="#2b3a6b">
      <rect x="330" y="170" width="10" height="8"/>
      <rect x="342" y="167" width="8"  height="11"/>
      <rect x="352" y="171" width="9"  height="7"/>
      <rect x="365" y="168" width="12" height="10"/>
      <rect x="380" y="172" width="8"  height="6"/>
      <rect x="392" y="169" width="10" height="9"/>
      <rect x="405" y="171" width="9"  height="7"/>
      <rect x="416" y="174" width="7"  height="4"/>
    </g>
    <!-- Warm window lights -->
    <g fill="#ffcf40">
      <rect x="333" y="173" width="1.5" height="1.5"/>
      <rect x="345" y="171" width="1.5" height="1.5"/>
      <rect x="368" y="172" width="1.5" height="1.5"/>
      <rect x="395" y="172" width="1.5" height="1.5"/>
      <rect x="408" y="173" width="1.5" height="1.5"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </g>
    <!-- Church with tall spire -->
    <g fill="#2b3a6b">
      <rect x="374" y="158" width="10" height="20"/>
      <polygon points="373,158 385,158 379,148"/>
      <polygon points="378,148 380,148 379,133"/>
    </g>
    <g stroke="#4d5f9a" stroke-width="0.6">
      <line x1="379" y1="131" x2="379" y2="136"/>
      <line x1="377.5" y1="133" x2="380.5" y2="133"/>
    </g>
  </g>

  <!-- ================================================================== -->
  <!-- Text block (lower right)                                             -->
  <!-- ================================================================== -->
  <rect x="430" y="112" width="370" height="76" fill="url(#cushion)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="790" y="152" text-anchor="end"
          fill="#ffe066" font-size="30" font-weight="800" letter-spacing="1.5"
          style="paint-order: stroke; stroke: #050a1e; stroke-width: 3.5px; stroke-linejoin: round;">
      JULY 29, 2026
    </text>
    <text x="790" y="171" text-anchor="end"
          fill="#fff4c9" font-size="12" font-weight="700" letter-spacing="2.6"
          style="paint-order: stroke; stroke: #050a1e; stroke-width: 3px; stroke-linejoin: round;">
      VINCENT VAN GOGH · 136 YEARS
    </text>
    <text x="790" y="186" text-anchor="end"
          fill="#a3b8f2" font-size="9" font-style="italic" letter-spacing="2"
          style="paint-order: stroke; stroke: #050a1e; stroke-width: 2.5px; stroke-linejoin: round;">
      AUVERS-SUR-OISE · 29 JULY 1890 · THE STARRY NIGHT
    </text>
  </g>

  <!-- Vignette -->
  <rect width="800" height="200" fill="url(#vig)"/>
</svg>
