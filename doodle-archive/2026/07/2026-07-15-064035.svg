<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Bastille Day (July 14) — French national day, 237th anniversary of the Storming of the Bastille (July 14, 1789). A revolutionary tricolore tableau: silhouetted crumbling stone fortress on the left with a torch-bearing crowd surging toward it, a giant tricolore flag rippling across the right two-thirds (blue-white-red vertical bands), fireworks bursting overhead in bleu-blanc-rouge, a soaring Marianne-style Phrygian cap floating above the crowd, cobblestone foreground, drifting sparks, a large white JULY 14, 2026 headline dominating center-right, a red LIBERTÉ · ÉGALITÉ · FRATERNITÉ subhead, and italic PARIS · 14 JUILLET 1789 · LA BASTILLE · 237 YEARS tertiary along the bottom. Palette: France blue #0055a4, cream white #f5f5f5, France red #ef4135, torch amber #ffb020, deep night #0a0d2e, stone grey #5c5a58, warm ember #ff5722. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 14, 2026 — Bastille Day, 237th anniversary of the Storming of the Bastille (July 14, 1789). A revolutionary tricolore tableau with a silhouetted crumbling Bastille fortress and torch-bearing crowd on the left, a rippling blue-white-red tricolore flag filling the right, tricolore fireworks bursting overhead, a Phrygian liberty cap floating above, cobblestones in the foreground, drifting sparks, a large white JULY 14, 2026 headline center-right, a red LIBERTÉ · ÉGALITÉ · FRATERNITÉ subhead, and italic PARIS · 14 JUILLET 1789 · LA BASTILLE · 237 YEARS tertiary along the bottom.">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d2e"/>
      <stop offset="55%" stop-color="#1a1f4a"/>
      <stop offset="100%" stop-color="#2a1a1a"/>
    </linearGradient>

    <!-- Ember glow behind torches -->
    <radialGradient id="ember" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ff5722" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0"/>
    </radialGradient>

    <!-- Tricolore vertical bands as a gradient reference -->
    <linearGradient id="tricolore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055a4"/>
      <stop offset="33.33%" stop-color="#0055a4"/>
      <stop offset="33.34%" stop-color="#f5f5f5"/>
      <stop offset="66.66%" stop-color="#f5f5f5"/>
      <stop offset="66.67%" stop-color="#ef4135"/>
      <stop offset="100%" stop-color="#ef4135"/>
    </linearGradient>

    <!-- Cloth ripple filter -->
    <filter id="ripple" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7">
        <animate attributeName="baseFrequency" values="0.012 0.02;0.015 0.024;0.012 0.02" dur="11s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="8"/>
    </filter>

    <!-- Text glow -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Firework burst symbol -->
    <symbol id="burst" viewBox="-40 -40 80 80" overflow="visible">
      <g stroke-width="1.4" stroke-linecap="round" fill="none">
        <line x1="0" y1="0" x2="0" y2="-30"/>
        <line x1="0" y1="0" x2="21" y2="-21"/>
        <line x1="0" y1="0" x2="30" y2="0"/>
        <line x1="0" y1="0" x2="21" y2="21"/>
        <line x1="0" y1="0" x2="0" y2="30"/>
        <line x1="0" y1="0" x2="-21" y2="21"/>
        <line x1="0" y1="0" x2="-30" y2="0"/>
        <line x1="0" y1="0" x2="-21" y2="-21"/>
        <line x1="0" y1="0" x2="12" y2="-27"/>
        <line x1="0" y1="0" x2="27" y2="-12"/>
        <line x1="0" y1="0" x2="27" y2="12"/>
        <line x1="0" y1="0" x2="12" y2="27"/>
        <line x1="0" y1="0" x2="-12" y2="27"/>
        <line x1="0" y1="0" x2="-27" y2="12"/>
        <line x1="0" y1="0" x2="-27" y2="-12"/>
        <line x1="0" y1="0" x2="-12" y2="-27"/>
      </g>
      <circle r="2.4" fill="currentColor"/>
    </symbol>

    <!-- Torch symbol -->
    <symbol id="torch" viewBox="-6 -20 12 30" overflow="visible">
      <!-- flame -->
      <path d="M0 -18 Q4 -12 3 -6 Q1 -3 0 0 Q-1 -3 -3 -6 Q-4 -12 0 -18 Z" fill="#ffb020">
        <animate attributeName="d" values="M0 -18 Q4 -12 3 -6 Q1 -3 0 0 Q-1 -3 -3 -6 Q-4 -12 0 -18 Z;M0 -20 Q5 -13 3 -6 Q1 -3 0 0 Q-1 -3 -3 -6 Q-5 -13 0 -20 Z;M0 -18 Q4 -12 3 -6 Q1 -3 0 0 Q-1 -3 -3 -6 Q-4 -12 0 -18 Z" dur="0.7s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -14 Q2 -9 1.5 -5 Q0 -2 0 0 Q0 -2 -1.5 -5 Q-2 -9 0 -14 Z" fill="#ff5722"/>
      <!-- handle -->
      <rect x="-1" y="0" width="2" height="10" fill="#5c3a20"/>
    </symbol>

    <!-- Phrygian cap symbol -->
    <symbol id="phrygian" viewBox="-20 -20 40 40" overflow="visible">
      <!-- cap body -->
      <path d="M-14 6 Q-16 -6 -10 -12 Q0 -18 12 -14 Q18 -8 12 4 Q14 8 -14 8 Z" fill="#ef4135"/>
      <!-- cap fold -->
      <path d="M-14 6 Q-6 4 12 4 Q10 8 -14 8 Z" fill="#c22a1e"/>
      <!-- rosette / cockade -->
      <circle cx="-4" cy="-4" r="3.2" fill="#0055a4"/>
      <circle cx="-4" cy="-4" r="2" fill="#f5f5f5"/>
      <circle cx="-4" cy="-4" r="0.9" fill="#ef4135"/>
    </symbol>

    <!-- Crowd figure silhouette -->
    <symbol id="figure" viewBox="-8 -22 16 24" overflow="visible">
      <circle cx="0" cy="-18" r="3.2" fill="#0a0d2e"/>
      <path d="M-6 2 Q-6 -12 0 -14 Q6 -12 6 2 Z" fill="#0a0d2e"/>
    </symbol>
  </defs>

  <!-- 1. Night sky background -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- 2. Rippling tricolore covering the right two-thirds -->
  <g filter="url(#ripple)" opacity="0.88">
    <rect x="230" y="8" width="560" height="184" fill="url(#tricolore)"/>
    <!-- subtle cloth shading -->
    <rect x="230" y="8" width="560" height="184" fill="#000" opacity="0.08"/>
  </g>
  <!-- Flag pole shadow suggestion at left edge of flag -->
  <rect x="228" y="8" width="3" height="184" fill="#3a2a1a" opacity="0.6"/>

  <!-- 3. Ember glow behind the fortress / crowd -->
  <ellipse cx="130" cy="150" rx="180" ry="70" fill="url(#ember)">
    <animate attributeName="rx" values="180;200;180" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 4. Bastille fortress silhouette (crumbling) on the left -->
  <g fill="#5c5a58">
    <!-- main wall -->
    <path d="M20 180 L20 90 L50 78 L60 90 L60 74 L92 70 L100 82 L100 66 L138 62 L148 78 L148 68 L180 74 L188 88 L200 180 Z" fill="#3a3835"/>
    <!-- towers with crenellations -->
    <rect x="30" y="74" width="18" height="24" fill="#4a4845"/>
    <rect x="30" y="72" width="4" height="4"/>
    <rect x="38" y="72" width="4" height="4"/>
    <rect x="46" y="72" width="4" height="4"/>

    <rect x="70" y="60" width="24" height="30" fill="#4a4845"/>
    <rect x="70" y="58" width="4" height="4"/>
    <rect x="78" y="58" width="4" height="4"/>
    <rect x="86" y="58" width="4" height="4"/>

    <rect x="108" y="52" width="26" height="34" fill="#4a4845"/>
    <rect x="108" y="50" width="4" height="4"/>
    <rect x="116" y="50" width="4" height="4"/>
    <rect x="124" y="50" width="4" height="4"/>
    <rect x="132" y="50" width="4" height="4"/>

    <rect x="152" y="66" width="22" height="26" fill="#4a4845"/>
    <rect x="152" y="64" width="4" height="4"/>
    <rect x="160" y="64" width="4" height="4"/>
    <rect x="168" y="64" width="4" height="4"/>

    <!-- windows -->
    <rect x="36" y="86" width="4" height="8" fill="#ffb020" opacity="0.75">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="74" width="4" height="8" fill="#ff5722" opacity="0.75">
      <animate attributeName="opacity" values="0.6;0.95;0.6" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="118" y="68" width="4" height="10" fill="#ffb020" opacity="0.75">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="78" width="4" height="8" fill="#ff5722" opacity="0.75">
      <animate attributeName="opacity" values="0.55;0.85;0.55" dur="3.1s" repeatCount="indefinite"/>
    </rect>

    <!-- crumbling debris chunks (falling) -->
    <g>
      <rect x="102" y="46" width="6" height="6" fill="#4a4845">
        <animateTransform attributeName="transform" type="translate" values="0 0; 6 40; 6 40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="126" y="48" width="5" height="5" fill="#5c5a58">
        <animateTransform attributeName="transform" type="translate" values="0 0; -4 44; -4 44" dur="5s" begin="-1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0" dur="5s" begin="-1s" repeatCount="indefinite"/>
      </rect>
      <rect x="76" y="56" width="4" height="4" fill="#4a4845">
        <animateTransform attributeName="transform" type="translate" values="0 0; 3 46; 3 46" dur="3.5s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0" dur="3.5s" begin="-2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- 5. Cobblestone foreground band -->
  <g opacity="0.85">
    <rect x="0" y="180" width="230" height="20" fill="#2a2825"/>
    <g fill="#3a3835" stroke="#1a1815" stroke-width="0.5">
      <rect x="4" y="184" width="18" height="10" rx="2"/>
      <rect x="26" y="184" width="20" height="10" rx="2"/>
      <rect x="50" y="184" width="18" height="10" rx="2"/>
      <rect x="72" y="184" width="22" height="10" rx="2"/>
      <rect x="98" y="184" width="18" height="10" rx="2"/>
      <rect x="120" y="184" width="22" height="10" rx="2"/>
      <rect x="146" y="184" width="18" height="10" rx="2"/>
      <rect x="168" y="184" width="20" height="10" rx="2"/>
      <rect x="192" y="184" width="20" height="10" rx="2"/>
    </g>
  </g>

  <!-- 6. Crowd of figures surging toward fortress with torches -->
  <g>
    <use href="#figure" x="42" y="180" width="14" height="22"/>
    <use href="#torch" x="52" y="164" width="10" height="20">
      <animateTransform attributeName="transform" type="rotate" values="-3 52 164; 3 52 164; -3 52 164" dur="1.7s" repeatCount="indefinite"/>
    </use>

    <use href="#figure" x="68" y="180" width="14" height="22"/>
    <use href="#torch" x="62" y="160" width="10" height="20">
      <animateTransform attributeName="transform" type="rotate" values="4 62 160; -4 62 160; 4 62 160" dur="1.9s" repeatCount="indefinite"/>
    </use>

    <use href="#figure" x="92" y="180" width="14" height="22"/>
    <use href="#torch" x="102" y="160" width="10" height="20">
      <animateTransform attributeName="transform" type="rotate" values="-4 102 160; 4 102 160; -4 102 160" dur="2.1s" repeatCount="indefinite"/>
    </use>

    <use href="#figure" x="118" y="180" width="14" height="22"/>
    <use href="#figure" x="140" y="180" width="14" height="22"/>
    <use href="#torch" x="150" y="162" width="10" height="20">
      <animateTransform attributeName="transform" type="rotate" values="3 150 162; -5 150 162; 3 150 162" dur="1.5s" repeatCount="indefinite"/>
    </use>

    <use href="#figure" x="166" y="180" width="14" height="22"/>
    <use href="#figure" x="188" y="180" width="14" height="22"/>
    <use href="#torch" x="196" y="160" width="10" height="20">
      <animateTransform attributeName="transform" type="rotate" values="-3 196 160; 5 196 160; -3 196 160" dur="1.8s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 7. Phrygian cap floating above the crowd (allegorical Marianne) -->
  <g>
    <use href="#phrygian" x="90" y="18" width="60" height="42">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 3; 0 0" dur="7s" repeatCount="indefinite"/>
    </use>
    <!-- tiny stars around cap -->
    <circle cx="86" cy="28" r="1.1" fill="#f5f5f5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="152" cy="32" r="1.1" fill="#f5f5f5">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="14" r="1.4" fill="#ffb020">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 8. Fireworks over the flag -->
  <g>
    <g color="#0055a4">
      <use href="#burst" x="340" y="34" width="60" height="60">
        <animateTransform attributeName="transform" type="scale" values="0.2;1.1;1.2" dur="2.2s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
      </use>
    </g>
    <g color="#f5f5f5">
      <use href="#burst" x="470" y="24" width="70" height="70">
        <animateTransform attributeName="transform" type="scale" values="0.2;1.2;1.3" dur="2.6s" begin="-0.8s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="-0.8s" repeatCount="indefinite"/>
      </use>
    </g>
    <g color="#ef4135">
      <use href="#burst" x="600" y="30" width="66" height="66">
        <animateTransform attributeName="transform" type="scale" values="0.2;1.1;1.2" dur="2.4s" begin="-1.6s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      </use>
    </g>
    <g color="#ffb020">
      <use href="#burst" x="720" y="42" width="48" height="48">
        <animateTransform attributeName="transform" type="scale" values="0.2;1;1.1" dur="1.9s" begin="-0.4s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="1.9s" begin="-0.4s" repeatCount="indefinite"/>
      </use>
    </g>
    <g color="#f5f5f5">
      <use href="#burst" x="280" y="60" width="36" height="36">
        <animateTransform attributeName="transform" type="scale" values="0.2;0.9;1" dur="1.7s" begin="-1.1s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="1.7s" begin="-1.1s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- 9. Drifting sparks rising from the crowd -->
  <g>
    <circle r="1.6" fill="#ffb020">
      <animateMotion path="M80 170 Q90 110 100 40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.4" fill="#ff5722">
      <animateMotion path="M130 170 Q140 100 150 30" dur="8s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="#ffb020">
      <animateMotion path="M170 170 Q180 110 195 30" dur="6s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.2" fill="#ffb020">
      <animateMotion path="M60 170 Q68 120 80 60" dur="9s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.4" fill="#ff5722">
      <animateMotion path="M110 170 Q118 115 125 55" dur="7.5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="-1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 10. Main date headline — dominant, dark navy on the white band of the flag -->
  <g filter="url(#text-glow)">
    <text x="500" y="112" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="48" font-weight="900" letter-spacing="3" fill="#0a0d2e">
      JULY 14, 2026
    </text>
  </g>

  <!-- 11. Subhead — red on white -->
  <text x="500" y="138" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="800" letter-spacing="4" fill="#ef4135">
    LIBERTÉ · ÉGALITÉ · FRATERNITÉ
  </text>

  <!-- 12. Tertiary italic caption -->
  <text x="500" y="182" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10" font-style="italic" font-weight="700" letter-spacing="2.4" fill="#0a0d2e" opacity="0.85">
    PARIS · 14 JUILLET 1789 · LA BASTILLE · 237 YEARS
  </text>
</svg>
