<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Dolly the Sheep 30th anniversary (July 5, 1996 — Roslin Institute, Edinburgh) — first mammal cloned from an adult somatic cell. Pastoral twilight over Scottish hills with Dolly and two ghostly clone-siblings, a rotating luminous DNA double helix at right, the Roslin Institute silhouette on the left horizon, and a big JULY 5, 2026 headline anchoring the sky. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: 30th anniversary of Dolly the Sheep, the first mammal cloned from an adult somatic cell, born July 5, 1996 at the Roslin Institute near Edinburgh, Scotland. A pastoral twilight tableau: rolling green hills at the base, Dolly the fluffy black-faced sheep grazing at center with two faint clone-sibling sheep behind her, a rotating luminous DNA double helix on the right, the low silhouette of the Roslin Institute on the left horizon, twinkling stars and a soft crescent moon in a violet-to-navy sky. Large bone-white JULY 5, 2026 headline dominates the upper sky, a subhead reading DOLLY THE SHEEP · 30 YEARS · FIRST CLONED MAMMAL sits directly beneath, and an italic tertiary ROSLIN INSTITUTE · EDINBURGH · JULY 5, 1996 runs along the very bottom edge.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.32" stop-color="#1a1e3a"/>
      <stop offset="0.68" stop-color="#3a2c55"/>
      <stop offset="1" stop-color="#6a4a6e"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3560"/>
      <stop offset="1" stop-color="#26324a"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c5a3d"/>
      <stop offset="1" stop-color="#153a26"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e6b3a"/>
      <stop offset="1" stop-color="#0f2416"/>
    </linearGradient>
    <radialGradient id="woolShade" cx="0.45" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2ede0"/>
      <stop offset="1" stop-color="#b8b0a0"/>
    </radialGradient>
    <linearGradient id="titleCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9e6"/>
      <stop offset="0.55" stop-color="#f5efd8"/>
      <stop offset="1" stop-color="#e2cf9c"/>
    </linearGradient>
    <linearGradient id="dnaBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dnaPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbcfe8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8dd" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f5efd8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5efd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="helixHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="titleGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Reusable sheep -->
    <symbol id="sheep" overflow="visible">
      <!-- legs -->
      <rect x="-18" y="14" width="4" height="16" rx="1" fill="#1a1108"/>
      <rect x="-8" y="14" width="4" height="16" rx="1" fill="#1a1108"/>
      <rect x="6" y="14" width="4" height="16" rx="1" fill="#1a1108"/>
      <rect x="16" y="14" width="4" height="16" rx="1" fill="#1a1108"/>
      <!-- fluffy wool body: overlapping circles -->
      <g fill="url(#woolShade)">
        <circle cx="-16" cy="6" r="10"/>
        <circle cx="-6" cy="0" r="12"/>
        <circle cx="6" cy="-1" r="13"/>
        <circle cx="18" cy="4" r="11"/>
        <circle cx="-2" cy="10" r="10"/>
        <circle cx="12" cy="12" r="9"/>
        <circle cx="-14" cy="14" r="7"/>
      </g>
      <!-- tail -->
      <circle cx="-24" cy="6" r="4" fill="url(#woolShade)"/>
      <!-- head -->
      <ellipse cx="26" cy="2" rx="9" ry="7.5" fill="#1a1108"/>
      <!-- ear -->
      <path d="M 22 -5 L 20 -11 L 26 -7 Z" fill="#1a1108"/>
      <!-- eye -->
      <circle cx="29" cy="0" r="1.2" fill="#fff8dd"/>
      <circle cx="29" cy="0" r="0.6" fill="#0d1117"/>
      <!-- nose highlight -->
      <ellipse cx="32" cy="4" rx="2" ry="1.3" fill="#3a2a22"/>
    </symbol>

    <!-- Reusable grass tuft -->
    <symbol id="tuft" overflow="visible">
      <path d="M -3 0 L -2 -5 M 0 0 L 0 -7 M 3 0 L 2 -5" stroke="#4a7a3a" stroke-width="0.8" stroke-linecap="round" fill="none"/>
    </symbol>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Moon halo + crescent -->
  <g transform="translate(680,30)">
    <circle r="22" fill="url(#moonGlow)"/>
    <circle r="9" fill="#fff8dd" opacity="0.95"/>
    <circle cx="3" cy="-2" r="8" fill="#1a1e3a"/>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- Stars scattered across upper sky (skip zone above title) -->
  <g fill="#f5efd8">
    <circle cx="40" cy="18" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="10" r="1.4"><animate attributeName="opacity" values="1;0.4;1" dur="7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="142" cy="24" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="11s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="14" r="1.5"><animate attributeName="opacity" values="1;0.5;1" dur="7s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="8" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="308" cy="20" r="1.3"><animate attributeName="opacity" values="0.6;1;0.6" dur="7s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="18" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" begin="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="572" cy="8" r="1.4"><animate attributeName="opacity" values="1;0.5;1" dur="7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="618" cy="66" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="732" cy="12" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="768" cy="30" r="1.3"><animate attributeName="opacity" values="1;0.5;1" dur="11s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="418" cy="12" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="462" cy="26" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="4.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Drifting fireflies / pollen motes near hills -->
  <g fill="#f4c542" opacity="0.75">
    <circle cx="220" cy="132" r="0.9">
      <animate attributeName="cy" values="132;120;136;132" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="140" r="0.9">
      <animate attributeName="cy" values="140;126;142;140" dur="13s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="146" r="0.8">
      <animate attributeName="cy" values="146;132;148;146" dur="7s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== HILLS ===== -->
  <!-- Far ridge -->
  <path d="M 0 148 Q 120 130 240 142 T 480 140 T 720 138 T 800 144 L 800 200 L 0 200 Z" fill="url(#hillFar)" opacity="0.85"/>

  <!-- Roslin Institute silhouette on far ridge, left -->
  <g transform="translate(78,120)" opacity="0.85">
    <rect x="0" y="0" width="72" height="24" fill="#20263e"/>
    <rect x="72" y="6" width="16" height="18" fill="#20263e"/>
    <!-- tower -->
    <rect x="24" y="-14" width="10" height="14" fill="#20263e"/>
    <!-- lit windows -->
    <g fill="#f4c542" opacity="0.9">
      <rect x="6" y="6" width="3" height="4"/>
      <rect x="14" y="6" width="3" height="4"/>
      <rect x="22" y="6" width="3" height="4"/>
      <rect x="42" y="6" width="3" height="4"/>
      <rect x="50" y="6" width="3" height="4"/>
      <rect x="58" y="6" width="3" height="4"/>
      <rect x="6" y="14" width="3" height="4"/>
      <rect x="14" y="14" width="3" height="4"/>
      <rect x="22" y="14" width="3" height="4"/>
      <rect x="42" y="14" width="3" height="4"/>
      <rect x="50" y="14" width="3" height="4"/>
      <rect x="58" y="14" width="3" height="4"/>
      <rect x="76" y="12" width="3" height="4"/>
      <rect x="76" y="18" width="3" height="4"/>
      <rect x="27" y="-8" width="4" height="5"/>
    </g>
    <!-- roof line -->
    <rect x="0" y="-2" width="88" height="2" fill="#0f1424"/>
  </g>

  <!-- Mid ridge -->
  <path d="M 0 162 Q 100 148 220 158 T 460 156 T 700 154 T 800 160 L 800 200 L 0 200 Z" fill="url(#hillMid)"/>

  <!-- Near hill -->
  <path d="M 0 176 Q 140 164 300 172 T 580 172 T 800 170 L 800 200 L 0 200 Z" fill="url(#hillNear)"/>

  <!-- Grass tufts scattered along near hill -->
  <g>
    <use href="#tuft" x="60" y="177"/>
    <use href="#tuft" x="118" y="176"/>
    <use href="#tuft" x="182" y="175"/>
    <use href="#tuft" x="238" y="174"/>
    <use href="#tuft" x="298" y="176"/>
    <use href="#tuft" x="352" y="177"/>
    <use href="#tuft" x="410" y="178"/>
    <use href="#tuft" x="468" y="177"/>
    <use href="#tuft" x="522" y="176"/>
    <use href="#tuft" x="576" y="175"/>
    <use href="#tuft" x="628" y="174"/>
    <use href="#tuft" x="684" y="175"/>
    <use href="#tuft" x="742" y="176"/>
  </g>

  <!-- ===== HEADLINE — big, upper center ===== -->
  <ellipse cx="400" cy="60" rx="270" ry="26" fill="#0d1117" opacity="0.32"/>
  <text x="400" y="70" font-family="'Georgia', 'Times New Roman', serif" font-size="44" font-weight="900" letter-spacing="5" text-anchor="middle" fill="url(#titleCream)" filter="url(#titleGlow)">JULY 5, 2026</text>

  <!-- Deco flourish under headline -->
  <g stroke="#e2cf9c" stroke-width="1" fill="none" opacity="0.7">
    <line x1="270" y1="82" x2="360" y2="82"/>
    <line x1="440" y1="82" x2="530" y2="82"/>
    <circle cx="400" cy="82" r="2" fill="#e2cf9c" stroke="none"/>
  </g>

  <!-- Subhead -->
  <text x="400" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="3.5" text-anchor="middle" fill="#7dd3fc">DOLLY THE SHEEP  ·  30 YEARS  ·  FIRST CLONED MAMMAL</text>

  <!-- ===== GHOST CLONE SHEEP behind Dolly ===== -->
  <g transform="translate(300,158)" opacity="0.28">
    <use href="#sheep" transform="scale(0.75)"/>
    <animateTransform attributeName="transform" type="translate" values="300,158;296,158;300,158" dur="13s" repeatCount="indefinite" additive="replace"/>
  </g>
  <g transform="translate(480,160)" opacity="0.32">
    <use href="#sheep" transform="scale(0.8)"/>
    <animateTransform attributeName="transform" type="translate" values="480,160;484,160;480,160" dur="11s" begin="1s" repeatCount="indefinite" additive="replace"/>
  </g>

  <!-- ===== DOLLY (foreground, front-and-center) ===== -->
  <g filter="url(#drop)" transform="translate(392,168)">
    <use href="#sheep" transform="scale(1.15)"/>
    <animateTransform attributeName="transform" type="translate" values="392,168;392,166;392,168" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Small nameplate for Dolly (subtle) -->
  <text x="392" y="192" font-family="'Georgia', 'Times New Roman', serif" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#fff8dd" opacity="0.85">DOLLY</text>

  <!-- ===== DNA DOUBLE HELIX — right side ===== -->
  <g transform="translate(640,140)">
    <!-- Halo -->
    <ellipse cx="0" cy="0" rx="60" ry="46" fill="url(#helixHalo)" filter="url(#soft)"/>

    <!-- Helix group with slow horizontal-scale flip to imply rotation -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;0.2 1;-1 1;-0.2 1;1 1" keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>

      <!-- Strand A: sine curve (blue) -->
      <path d="M -22 -42 C -6 -34 6 -22 -22 -14 C -50 -6 -38 6 -22 14 C -6 22 6 34 -22 42"
            stroke="url(#dnaBlue)" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.95"/>
      <!-- Strand B: opposite phase (pink) -->
      <path d="M 22 -42 C 6 -34 -6 -22 22 -14 C 50 -6 38 6 22 14 C 6 22 -6 34 22 42"
            stroke="url(#dnaPink)" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.95"/>

      <!-- Base pair rungs -->
      <g stroke="#f5efd8" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
        <line x1="-22" y1="-42" x2="22" y2="-42"/>
        <line x1="-15" y1="-32" x2="15" y2="-32"/>
        <line x1="-8" y1="-22" x2="8" y2="-22"/>
        <line x1="-22" y1="-14" x2="22" y2="-14"/>
        <line x1="-15" y1="-4" x2="15" y2="-4"/>
        <line x1="-8" y1="6" x2="8" y2="6"/>
        <line x1="-22" y1="14" x2="22" y2="14"/>
        <line x1="-15" y1="24" x2="15" y2="24"/>
        <line x1="-8" y1="34" x2="8" y2="34"/>
        <line x1="-22" y1="42" x2="22" y2="42"/>
      </g>

      <!-- Base pair nucleotide dots (glowing) -->
      <g>
        <circle cx="-22" cy="-42" r="2" fill="#a5f3fc"/>
        <circle cx="22" cy="-42" r="2" fill="#fbcfe8"/>
        <circle cx="-22" cy="-14" r="2" fill="#a5f3fc"/>
        <circle cx="22" cy="-14" r="2" fill="#fbcfe8"/>
        <circle cx="-22" cy="14" r="2" fill="#a5f3fc"/>
        <circle cx="22" cy="14" r="2" fill="#fbcfe8"/>
        <circle cx="-22" cy="42" r="2" fill="#a5f3fc"/>
        <circle cx="22" cy="42" r="2" fill="#fbcfe8"/>
      </g>
    </g>

    <!-- Sparkle around helix -->
    <g fill="#fff8dd">
      <circle cx="-40" cy="-30" r="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="20" r="1">
        <animate attributeName="opacity" values="0;1;0" dur="11s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-38" cy="34" r="0.8">
        <animate attributeName="opacity" values="0;1;0" dur="13s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="38" cy="-38" r="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="7s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ===== TERTIARY italic line ===== -->
  <text x="400" y="199" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" font-style="italic" letter-spacing="2.2" text-anchor="middle" fill="#c8d4e0">ROSLIN INSTITUTE  ·  EDINBURGH  ·  JULY 5, 1996</text>

</svg>
