<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Charon Discovered (June 22, 1978) — 48th anniversary of James W. Christy's discovery of Pluto's largest moon at the US Naval Observatory Flagstaff Station. Pluto and Charon shown as a slow-rotating binary system about a common barycenter in the empty space between them (the only true binary in the solar system, both tidally locked). Pluto bears the heart-shaped Tombaugh Regio in cream; Charon shows the reddish polar Mordor Macula. Twinkling starfield, faint tilted orbital ellipse, large bone-white "JUNE 22, 2026" headline across the top, "CHARON DISCOVERED · 48 YEARS" subhead, italic "JAMES W. CHRISTY · US NAVAL OBSERVATORY · JUNE 22, 1978" tertiary. Palette: deep space navy (#070b1a → #0d1117), Pluto tan-rose (#d8a577 → #6b3b22), heart cream (#f6e5c0), Charon slate (#cfc8be → #4b4640), Mordor rust (#7a2a18), bone-white text (#f5eed6), over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 22, 2026 — 48th anniversary of the discovery of Charon, Pluto's largest moon, by James W. Christy at the US Naval Observatory on June 22, 1978. Pluto and Charon shown as a binary system slowly rotating around a common barycenter in deep space, with a faint tilted orbital ellipse and a twinkling starfield. The full date is set in large bone-white sans across the top, with CHARON DISCOVERED · 48 YEARS subhead, and JAMES W. CHRISTY · US NAVAL OBSERVATORY · JUNE 22, 1978 italic tertiary line along the bottom.">
  <defs>
    <!-- Space background gradient -->
    <radialGradient id="space" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0%"   stop-color="#0f1430"/>
      <stop offset="55%"  stop-color="#080a1c"/>
      <stop offset="100%" stop-color="#040611"/>
    </radialGradient>

    <!-- Pluto: warm tan/rose body -->
    <radialGradient id="pluto" cx="0.38" cy="0.36" r="0.7">
      <stop offset="0%"   stop-color="#e8c39a"/>
      <stop offset="45%"  stop-color="#b27a4e"/>
      <stop offset="100%" stop-color="#3c1e10"/>
    </radialGradient>

    <!-- Charon: cool slate body with subtle blue undertone -->
    <radialGradient id="charon" cx="0.38" cy="0.36" r="0.72">
      <stop offset="0%"   stop-color="#dcd6cc"/>
      <stop offset="55%"  stop-color="#807b74"/>
      <stop offset="100%" stop-color="#1c1b1a"/>
    </radialGradient>

    <!-- Mordor Macula reddish polar cap on Charon -->
    <radialGradient id="mordor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#9a3416" stop-opacity="0.95"/>
      <stop offset="70%"  stop-color="#5a1e0a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5a1e0a" stop-opacity="0"/>
    </radialGradient>

    <!-- Tombaugh Regio cream heart -->
    <radialGradient id="heart" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%"   stop-color="#fff5d6"/>
      <stop offset="70%"  stop-color="#f0d99a"/>
      <stop offset="100%" stop-color="#d8b884" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Soft glow halo for both bodies -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#9fb2d8" stop-opacity="0.35"/>
      <stop offset="70%"  stop-color="#9fb2d8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9fb2d8" stop-opacity="0"/>
    </radialGradient>

    <!-- Heart-shape path for Tombaugh Regio (Pluto), normalized around 0,0 -->
    <path id="tombaugh"
          d="M0,8 C -10,-2 -16,-8 -10,-12 C -5,-14 -1,-10 0,-6 C 1,-10 5,-14 10,-12 C 16,-8 10,-2 0,8 Z"/>

    <!-- A single dim mottled patch we'll reuse on Pluto for surface texture -->
    <circle id="splotch" r="6"/>

    <!-- Soft glow filter for headline text -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle noise filter for Pluto surface variation -->
    <filter id="surface" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.15
                             0 0 0 0 0.10
                             0 0 0 0 0.06
                             0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Canvas + deep space -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#space)"/>

  <!-- ===== Starfield (twinkling) ===== -->
  <g fill="#e8eef8">
    <!-- Bright twinklers -->
    <circle cx="60"  cy="78"  r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="110" cy="120" r="0.9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="155" cy="92"  r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="138" r="0.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s"  begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="248" cy="78"  r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="288" cy="148" r="0.7"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="13s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="100" r="1.0"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s"  begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="378" cy="158" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="84"  r="0.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="13s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="468" cy="146" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s"  begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="512" cy="98"  r="0.9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="552" cy="158" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="598" cy="78"  r="0.7"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="7s"  begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="638" cy="128" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="-8s" repeatCount="indefinite"/></circle>
    <circle cx="678" cy="92"  r="1.0"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="722" cy="148" r="0.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s"  begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="758" cy="108" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="-9s" repeatCount="indefinite"/></circle>
    <!-- Dimmer field of small stars -->
    <circle cx="40"  cy="120" r="0.5" opacity="0.55"/>
    <circle cx="92"  cy="160" r="0.4" opacity="0.45"/>
    <circle cx="180" cy="76"  r="0.5" opacity="0.6"/>
    <circle cx="230" cy="108" r="0.4" opacity="0.5"/>
    <circle cx="268" cy="130" r="0.5" opacity="0.55"/>
    <circle cx="310" cy="74"  r="0.4" opacity="0.5"/>
    <circle cx="356" cy="120" r="0.5" opacity="0.55"/>
    <circle cx="400" cy="152" r="0.4" opacity="0.45"/>
    <circle cx="440" cy="118" r="0.5" opacity="0.6"/>
    <circle cx="488" cy="78"  r="0.4" opacity="0.5"/>
    <circle cx="528" cy="128" r="0.5" opacity="0.55"/>
    <circle cx="570" cy="110" r="0.4" opacity="0.45"/>
    <circle cx="610" cy="158" r="0.5" opacity="0.55"/>
    <circle cx="660" cy="76"  r="0.4" opacity="0.5"/>
    <circle cx="704" cy="120" r="0.5" opacity="0.6"/>
    <circle cx="746" cy="80"  r="0.4" opacity="0.5"/>
    <circle cx="780" cy="138" r="0.5" opacity="0.55"/>
  </g>

  <!-- ===== Binary system: Pluto + Charon orbit a common barycenter ===== -->
  <!-- Barycenter is at (400, 116). Pluto sits ~46px left of it, Charon ~106px right of it. -->
  <!-- Whole assembly slowly rotates around the barycenter (tilted ellipse via group scaleY). -->

  <g transform="translate(400 116)">
    <!-- Faint orbital ellipse marking the mutual orbit path -->
    <ellipse cx="0" cy="0" rx="118" ry="22" fill="none"
             stroke="#3a4a78" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.55"/>

    <!-- Tilt the orbiting frame by skewing the rotation along a flatter ellipse:
         we apply a scaleY to compress vertical motion, producing a tilted-orbit feel. -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="53s" repeatCount="indefinite"/>

      <!-- Pluto at orbital radius -46 (smaller body on the close arc — barycenter outside Pluto) -->
      <g transform="translate(-46 0)">
        <!-- Counter-rotate so Pluto stays "upright" while the system rotates -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0" to="-360" dur="53s" repeatCount="indefinite"/>

          <!-- Soft halo -->
          <circle r="62" fill="url(#halo)"/>

          <!-- Pluto body -->
          <circle r="42" fill="url(#pluto)"/>

          <!-- Surface mottling (darker patches) -->
          <g fill="#5a2e18" opacity="0.45">
            <use href="#splotch" x="-20" y="-12"/>
            <use href="#splotch" x="-8"  y="14" transform="scale(1.2 0.9)"/>
            <use href="#splotch" x="14"  y="-18" transform="scale(0.8 1.1)"/>
            <use href="#splotch" x="22"  y="6"  transform="scale(1.1 0.8)"/>
            <use href="#splotch" x="-26" y="8"  transform="scale(0.7 1.0)"/>
          </g>

          <!-- Tombaugh Regio: the iconic heart, lower-right of Pluto's face -->
          <g transform="translate(6 8) scale(1.35)">
            <use href="#tombaugh" fill="url(#heart)"/>
          </g>

          <!-- Slow heart-pulse highlight -->
          <g transform="translate(6 8) scale(1.35)" opacity="0.7">
            <use href="#tombaugh" fill="#fff5d6">
              <animate attributeName="opacity" values="0.35;0.85;0.35" dur="11s" repeatCount="indefinite"/>
            </use>
          </g>

          <!-- Rim shadow on opposite side of light -->
          <circle r="42" fill="#000" opacity="0.35" clip-path="circle(42px at 14px 10px)"/>

          <!-- Pluto label -->
          <text y="62" text-anchor="middle"
                font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                font-size="9" font-weight="700" letter-spacing="3"
                fill="#e8c39a" opacity="0.85">PLUTO</text>
        </g>
      </g>

      <!-- Charon at orbital radius +106 (larger arc — barycenter lies inside this sweep) -->
      <g transform="translate(106 0)">
        <!-- Counter-rotate so Charon stays "upright" -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0" to="-360" dur="53s" repeatCount="indefinite"/>

          <!-- Soft halo -->
          <circle r="34" fill="url(#halo)"/>

          <!-- Charon body -->
          <circle r="22" fill="url(#charon)"/>

          <!-- Mordor Macula reddish north polar cap -->
          <ellipse cx="0" cy="-13" rx="14" ry="7" fill="url(#mordor)"/>

          <!-- Surface mottling -->
          <g fill="#3a3530" opacity="0.5">
            <circle cx="-8" cy="3"  r="2.6"/>
            <circle cx="6"  cy="6"  r="2.0"/>
            <circle cx="-2" cy="10" r="1.8"/>
            <circle cx="9"  cy="-3" r="1.5"/>
          </g>

          <!-- Rim shadow -->
          <circle r="22" fill="#000" opacity="0.35" clip-path="circle(22px at 8px 6px)"/>

          <!-- Charon label -->
          <text y="40" text-anchor="middle"
                font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
                font-size="8" font-weight="700" letter-spacing="3"
                fill="#cfc8be" opacity="0.85">CHARON</text>
        </g>
      </g>

      <!-- Barycenter crosshair (very subtle) at origin -->
      <g stroke="#6a7aa8" stroke-width="0.8" opacity="0.55">
        <line x1="-5" y1="0" x2="5" y2="0"/>
        <line x1="0" y1="-5" x2="0" y2="5"/>
      </g>
    </g>
  </g>

  <!-- ===== Text layer ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- Dark band behind headline for guaranteed legibility -->
    <rect x="0" y="2" width="800" height="46" fill="#040611" opacity="0.78"/>

    <!-- Primary headline: today's date -->
    <text x="400" y="34" text-anchor="middle"
          font-size="32" font-weight="800" letter-spacing="7"
          fill="#f5eed6" filter="url(#softglow)">
      JUNE 22, 2026
    </text>

    <!-- Subhead -->
    <text x="400" y="60" text-anchor="middle"
          font-size="12" font-weight="700" letter-spacing="6"
          fill="#9fb2d8">
      CHARON DISCOVERED
      <tspan fill="#c97a4a">  ·  </tspan>
      <tspan>48 YEARS</tspan>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- Dark band behind tertiary -->
    <rect x="0" y="178" width="800" height="20" fill="#040611" opacity="0.82"/>

    <!-- Tertiary italic -->
    <text x="400" y="192" text-anchor="middle"
          font-size="10" font-style="italic" font-weight="600" letter-spacing="4"
          fill="#bcc8e0">
      JAMES W. CHRISTY  ·  US NAVAL OBSERVATORY  ·  JUNE 22, 1978
    </text>
  </g>

  <!-- Subtle vignette to focus the eye -->
  <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.8">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="800" height="200" fill="url(#vignette)"/>
</svg>
