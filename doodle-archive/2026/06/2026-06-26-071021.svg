<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: George Orwell's 123rd birthday (June 25, 1903 — born Eric Arthur Blair in Motihari, British India; author of "Nineteen Eighty-Four" and "Animal Farm"). Visualized in the iconic Ministry-of-Truth propaganda-poster aesthetic: a giant geometric all-seeing eye centered against a stark crimson field, framed by Constructivist sunburst rays slowly rotating behind it, slow telescreen scan-lines drifting downward across the surface, the pupil contracting and dilating in a slow tell, the iris drifting side-to-side as if scanning the viewer. Large bone-white "JUNE 25, 2026" headline anchors the top; "GEORGE ORWELL · 123 YEARS" subhead in pale cream beneath; italic "BIG BROTHER IS WATCHING YOU" caption below the eye; bottom strip carries the three Party slogans "WAR IS PEACE · FREEDOM IS SLAVERY · IGNORANCE IS STRENGTH". Two flanking stenciled "1984" numerals frame the composition. Palette: Party crimson, telescreen oxblood, bone-white, pale cream, eye-iris steel-blue with a black pupil, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: George Orwell's 123rd birthday, June 25, 1903 — Ministry-of-Truth propaganda-poster aesthetic with a giant all-seeing eye, telescreen scan-lines, and the three Party slogans">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a0a0a"/>
      <stop offset="50%" stop-color="#7a1212"/>
      <stop offset="100%" stop-color="#2a0606"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#cfe0ee"/>
      <stop offset="40%" stop-color="#5b7a96"/>
      <stop offset="75%" stop-color="#243c54"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="sclera" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#fbf3da"/>
      <stop offset="80%" stop-color="#e6c98e"/>
      <stop offset="100%" stop-color="#8a5f32"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Eye-shaped clip so the iris tucks under the lid corners cleanly -->
    <clipPath id="eyeClip">
      <path d="M 400 100 m -72 0 q 72 -48 144 0 q -72 48 -144 0 Z"/>
    </clipPath>
    <!-- Telescreen scan-line pattern -->
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000" fill-opacity="0"/>
      <rect width="4" height="1" fill="#000000" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Background field -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#field)"/>

  <!-- Constructivist sunburst rays radiating from the center, slowly rotating -->
  <g opacity="0.16">
    <g transform="translate(400 100)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="113s" repeatCount="indefinite" additive="sum"/>
      <polygon points="0,0 -480,-22 -480,22" fill="#f4ecd6"/>
      <polygon points="0,0 -340,-200 -300,-220" fill="#f4ecd6"/>
      <polygon points="0,0 -120,-260 -80,-270" fill="#f4ecd6"/>
      <polygon points="0,0 120,-260 80,-270" fill="#f4ecd6"/>
      <polygon points="0,0 340,-200 300,-220" fill="#f4ecd6"/>
      <polygon points="0,0 480,-22 480,22" fill="#f4ecd6"/>
      <polygon points="0,0 340,200 300,220" fill="#f4ecd6"/>
      <polygon points="0,0 120,260 80,270" fill="#f4ecd6"/>
      <polygon points="0,0 -120,260 -80,270" fill="#f4ecd6"/>
      <polygon points="0,0 -340,200 -300,220" fill="#f4ecd6"/>
    </g>
  </g>

  <!-- Flanking stenciled 1984 numerals as poster frame -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f4ecd6" opacity="0.32" font-weight="900" font-style="italic">
    <text x="80" y="135" font-size="72" letter-spacing="-2" text-anchor="middle">1984</text>
    <text x="720" y="135" font-size="72" letter-spacing="-2" text-anchor="middle">1984</text>
  </g>

  <!-- ===== The Eye ===== -->
  <g>
    <!-- Sclera (almond) -->
    <path d="M 400 100 m -72 0 q 72 -48 144 0 q -72 48 -144 0 Z" fill="url(#sclera)" filter="url(#glow)"/>

    <!-- Iris + pupil + catchlight, clipped to the almond -->
    <g clip-path="url(#eyeClip)">
      <circle cx="400" cy="100" r="34" fill="url(#iris)">
        <animate attributeName="cx" values="400;408;400;392;400" dur="29s" repeatCount="indefinite"/>
      </circle>
      <!-- pupil dilating/contracting -->
      <circle cx="400" cy="100" r="12" fill="#0d1117">
        <animate attributeName="r" values="11;15;9;13;11" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="400;408;400;392;400" dur="29s" repeatCount="indefinite"/>
      </circle>
      <!-- catchlight -->
      <circle cx="392" cy="92" r="4.5" fill="#fbf3da" opacity="0.9">
        <animate attributeName="cx" values="392;400;392;384;392" dur="29s" repeatCount="indefinite"/>
      </circle>
      <circle cx="408" cy="106" r="1.5" fill="#fbf3da" opacity="0.55">
        <animate attributeName="cx" values="408;416;408;400;408" dur="29s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Telescreen scan lines over the eye -->
    <path d="M 400 100 m -72 0 q 72 -48 144 0 q -72 48 -144 0 Z" fill="url(#scan)"/>

    <!-- Outer almond outline (drawn after fill for crispness) -->
    <path d="M 400 100 m -72 0 q 72 -48 144 0 q -72 48 -144 0 Z" fill="none" stroke="#fbf3da" stroke-width="2.2"/>

    <!-- Crease line above the eye -->
    <path d="M 332 76 q 68 -22 136 0" fill="none" stroke="#fbf3da" stroke-width="1.2" opacity="0.55"/>

    <!-- Eyelash flicks at top -->
    <g stroke="#fbf3da" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
      <line x1="346" y1="78" x2="342" y2="70"/>
      <line x1="366" y1="72" x2="364" y2="62"/>
      <line x1="386" y1="68" x2="386" y2="56"/>
      <line x1="400" y1="66" x2="400" y2="54"/>
      <line x1="414" y1="68" x2="414" y2="56"/>
      <line x1="434" y1="72" x2="436" y2="62"/>
      <line x1="454" y1="78" x2="458" y2="70"/>
    </g>
  </g>

  <!-- Vignette to focus the eye -->
  <rect width="800" height="200" fill="url(#vignette)"/>

  <!-- Drifting horizontal scan-line that sweeps the whole canvas -->
  <rect x="0" y="0" width="800" height="2" fill="#fbf3da" opacity="0.13">
    <animate attributeName="y" values="-4;204" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== TYPOGRAPHY ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Headline date: dark backing for legibility, then bone-white front -->
    <text x="400" y="38" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="6" fill="#0d1117" opacity="0.92">JUNE 25, 2026</text>
    <text x="400" y="38" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="6" fill="#fbf3da" filter="url(#bigglow)">JUNE 25, 2026</text>

    <!-- Subhead -->
    <text x="400" y="58" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="5" fill="#f0d6a0">GEORGE ORWELL · 123 YEARS</text>

    <!-- Caption directly below the eye -->
    <text x="400" y="168" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" letter-spacing="4" fill="#fbf3da">
      BIG BROTHER IS WATCHING YOU
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- Party slogans strip -->
    <text x="400" y="186" text-anchor="middle" font-size="8.5" font-weight="700" letter-spacing="3" fill="#f0d6a0" opacity="0.95">WAR IS PEACE · FREEDOM IS SLAVERY · IGNORANCE IS STRENGTH</text>

    <!-- Born/place tertiary -->
    <text x="400" y="197" text-anchor="middle" font-size="7" font-style="italic" letter-spacing="2.5" fill="#f0d6a0" opacity="0.7">ERIC ARTHUR BLAIR · MOTIHARI · JUNE 25, 1903</text>
  </g>
</svg>
