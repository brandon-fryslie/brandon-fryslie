<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: First ATM ever installed (June 27, 1967, Barclays Bank, Enfield Town branch, London — built by John Shepherd-Barron of De La Rue; the first cash withdrawal was made by actor Reg Varney from "On the Buses"). 59th anniversary of self-service cash. Visualized as a late-1960s ATM tableau: a slate-grey ATM cabinet stands left of center with a green CRT screen reading "ENTER CODE" / "AMOUNT £10", a numeric keypad below it, a horizontal cash slot at the bottom, and three crisp £10 notes drifting out and to the right on a gentle conveyor of motion. A coin-style barclays-blue eagle roundel marks the cabinet face. A slow PIN-cursor blinks on the green screen, a scan-line drifts down the CRT, and the bottom slot pulses softly each time a note emerges. Large bone-white "JUNE 27, 2026" headline anchors the top; cyan "FIRST ATM · 59 YEARS" subhead beneath; italic "BARCLAYS BANK · ENFIELD TOWN · LONDON · JUNE 27, 1967" tertiary along the bottom. Palette: ATM slate and gunmetal, Barclays cobalt, CRT phosphor green, banknote sterling-cream and olive, bone-white text, cyan accents, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: 59th anniversary of the first ATM, installed June 27, 1967 at Barclays Bank, Enfield Town branch, London, by John Shepherd-Barron, with the first withdrawal made by actor Reg Varney">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161d"/>
      <stop offset="1" stop-color="#161c25"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4452"/>
      <stop offset="0.5" stop-color="#5a6677"/>
      <stop offset="1" stop-color="#2b323d"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22282f"/>
      <stop offset="1" stop-color="#13171c"/>
    </linearGradient>
    <radialGradient id="crt" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1a3a25"/>
      <stop offset="0.7" stop-color="#0a1c12"/>
      <stop offset="1" stop-color="#050c07"/>
    </radialGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8d6a8"/>
      <stop offset="0.5" stop-color="#e8efd2"/>
      <stop offset="1" stop-color="#a8b88a"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#0a0f13"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="3" fill="transparent"/>
      <rect width="2" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <symbol id="banknote" viewBox="0 0 84 36">
      <rect x="0.5" y="0.5" width="83" height="35" rx="2" fill="url(#note)" stroke="#7a8a5e" stroke-width="0.6"/>
      <rect x="3" y="3" width="78" height="30" rx="1.5" fill="none" stroke="#7a8a5e" stroke-width="0.4" stroke-dasharray="1.5 1"/>
      <circle cx="20" cy="18" r="9" fill="none" stroke="#7a8a5e" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="6" fill="none" stroke="#7a8a5e" stroke-width="0.4"/>
      <text x="20" y="21.5" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="700" fill="#3a4528" text-anchor="middle">£10</text>
      <text x="55" y="14" font-family="Georgia, serif" font-size="5.5" fill="#3a4528" font-style="italic">Bank of</text>
      <text x="55" y="20" font-family="Georgia, serif" font-size="5.5" fill="#3a4528" font-style="italic">England</text>
      <text x="55" y="28" font-family="Georgia, serif" font-size="4" fill="#5a6840">TEN POUNDS</text>
      <text x="75" y="33" font-family="monospace" font-size="3" fill="#3a4528">A 67</text>
    </symbol>
  </defs>

  <!-- background -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect y="160" width="800" height="40" fill="url(#floor)"/>
  <!-- floor tile grid -->
  <g stroke="#1d242e" stroke-width="0.6" opacity="0.6">
    <line x1="0" y1="172" x2="800" y2="172"/>
    <line x1="0" y1="186" x2="800" y2="186"/>
    <g>
      <line x1="80" y1="160" x2="60" y2="200"/>
      <line x1="200" y1="160" x2="180" y2="200"/>
      <line x1="320" y1="160" x2="300" y2="200"/>
      <line x1="440" y1="160" x2="420" y2="200"/>
      <line x1="560" y1="160" x2="540" y2="200"/>
      <line x1="680" y1="160" x2="660" y2="200"/>
    </g>
  </g>

  <!-- subtle wall accent -->
  <g opacity="0.35">
    <circle cx="700" cy="55" r="38" fill="#1b2434"/>
    <circle cx="700" cy="55" r="28" fill="#22304a"/>
    <text x="700" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#5a7aa8" text-anchor="middle" letter-spacing="1.5">BARCLAYS</text>
  </g>

  <!-- HEADLINE: date across top -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="36" font-size="26" font-weight="800" fill="#f0f3f7" text-anchor="middle" letter-spacing="2.5">JUNE 27, 2026</text>
    <text x="400" y="54" font-size="11" font-weight="700" fill="#5fc7e8" text-anchor="middle" letter-spacing="3.5">FIRST ATM · 59 YEARS</text>
  </g>

  <!-- ATM cabinet -->
  <g transform="translate(140, 70)">
    <!-- shadow on floor -->
    <ellipse cx="80" cy="115" rx="100" ry="6" fill="#000" opacity="0.55"/>
    <!-- main cabinet -->
    <rect x="0" y="0" width="160" height="115" rx="4" fill="url(#cabinet)" stroke="#1a1f26" stroke-width="1"/>
    <!-- top trim -->
    <rect x="0" y="0" width="160" height="6" fill="#1c222a"/>
    <rect x="6" y="9" width="148" height="2" fill="#7a8694" opacity="0.6"/>

    <!-- screen bezel -->
    <rect x="14" y="16" width="100" height="42" rx="3" fill="url(#bezel)" stroke="#0a0d12" stroke-width="1"/>
    <!-- CRT screen -->
    <rect x="18" y="20" width="92" height="34" rx="2" fill="url(#crt)"/>
    <!-- scanlines -->
    <rect x="18" y="20" width="92" height="34" rx="2" fill="url(#scanlines)" opacity="0.5"/>
    <!-- moving scanline -->
    <rect x="18" y="20" width="92" height="2" fill="#4cff8a" opacity="0.18">
      <animate attributeName="y" values="20;52;20" dur="7s" repeatCount="indefinite"/>
    </rect>
    <!-- screen text -->
    <g font-family="'Courier New', monospace" fill="#5cff8a" filter="url(#greenGlow)">
      <text x="22" y="29" font-size="6.5" font-weight="700" letter-spacing="0.6">BARCLAYS · ENFIELD</text>
      <text x="22" y="38" font-size="7" font-weight="700" letter-spacing="0.8">ENTER CODE: ****</text>
      <text x="22" y="47" font-size="7" font-weight="700" letter-spacing="0.8">AMOUNT  £10<tspan opacity="0">_</tspan></text>
      <!-- blinking cursor -->
      <rect x="76" y="42" width="5" height="6" fill="#5cff8a">
        <animate attributeName="opacity" values="0;0;1;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- cash slot label -->
    <rect x="14" y="64" width="100" height="10" rx="1.5" fill="#1a1f26"/>
    <text x="64" y="71.5" font-family="-apple-system, sans-serif" font-size="5.5" font-weight="700" fill="#9aa6b4" text-anchor="middle" letter-spacing="1.2">CASH DISPENSER</text>
    <!-- cash slot opening -->
    <rect x="20" y="78" width="88" height="5" rx="1" fill="url(#slot)" stroke="#000" stroke-width="0.5"/>
    <!-- slot pulse -->
    <rect x="20" y="78" width="88" height="5" rx="1" fill="#5cff8a" opacity="0">
      <animate attributeName="opacity" values="0;0;0.45;0" dur="13s" repeatCount="indefinite"/>
    </rect>

    <!-- keypad -->
    <g transform="translate(122, 18)">
      <rect x="0" y="0" width="32" height="42" rx="2" fill="#1c222a" stroke="#0a0d12" stroke-width="0.5"/>
      <g fill="#3a4452" stroke="#7a8694" stroke-width="0.3">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="12.5" y="3" width="7" height="7" rx="1"/>
        <rect x="22" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="12" width="7" height="7" rx="1"/>
        <rect x="12.5" y="12" width="7" height="7" rx="1"/>
        <rect x="22" y="12" width="7" height="7" rx="1"/>
        <rect x="3" y="21" width="7" height="7" rx="1"/>
        <rect x="12.5" y="21" width="7" height="7" rx="1"/>
        <rect x="22" y="21" width="7" height="7" rx="1"/>
        <rect x="3" y="30" width="7" height="7" rx="1"/>
        <rect x="12.5" y="30" width="7" height="7" rx="1"/>
        <rect x="22" y="30" width="7" height="7" rx="1"/>
      </g>
      <g font-family="'Courier New', monospace" font-size="4.5" fill="#cdd6e0" text-anchor="middle" font-weight="700">
        <text x="6.5" y="8.2">1</text><text x="16" y="8.2">2</text><text x="25.5" y="8.2">3</text>
        <text x="6.5" y="17.2">4</text><text x="16" y="17.2">5</text><text x="25.5" y="17.2">6</text>
        <text x="6.5" y="26.2">7</text><text x="16" y="26.2">8</text><text x="25.5" y="26.2">9</text>
        <text x="6.5" y="35.2">*</text><text x="16" y="35.2">0</text><text x="25.5" y="35.2">#</text>
      </g>
      <!-- key press blink -->
      <rect x="3" y="3" width="7" height="7" rx="1" fill="#5cff8a" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" dur="3.3s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="12.5" y="12" width="7" height="7" rx="1" fill="#5cff8a" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" dur="3.3s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="22" y="21" width="7" height="7" rx="1" fill="#5cff8a" opacity="0">
        <animate attributeName="opacity" values="0;0.6;0" dur="3.3s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="35.2" width="0" height="0"/>
    </g>

    <!-- maker's plate -->
    <rect x="14" y="89" width="140" height="18" rx="1" fill="#1c222a"/>
    <text x="84" y="100" font-family="-apple-system, sans-serif" font-size="6" font-weight="700" fill="#5fc7e8" text-anchor="middle" letter-spacing="2">DE LA RUE · 1967</text>

    <!-- barclays roundel -->
    <g transform="translate(20, 96)">
      <circle r="5" fill="#1c3d7a" stroke="#5a7aa8" stroke-width="0.5"/>
      <path d="M -3 1 L 0 -3 L 3 1 L 0 3 Z" fill="#cdd6e0"/>
    </g>
  </g>

  <!-- Banknotes drifting out of the slot to the right -->
  <g>
    <!-- note 1 -->
    <g>
      <use href="#banknote" x="0" y="0" width="84" height="36" transform="translate(310 144) rotate(-4)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 -8; 120 -2" dur="11s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;1;1;0.95" keyTimes="0;0.15;0.85;1" dur="11s" repeatCount="indefinite"/>
    </g>
    <!-- note 2 -->
    <g opacity="0">
      <use href="#banknote" x="0" y="0" width="84" height="36" transform="translate(305 148) rotate(3)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 -16; 160 -14" dur="13s" begin="2s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;1;1;0.9" keyTimes="0;0.2;0.85;1" dur="13s" begin="2s" repeatCount="indefinite"/>
    </g>
    <!-- note 3 -->
    <g opacity="0">
      <use href="#banknote" x="0" y="0" width="84" height="36" transform="translate(308 146) rotate(-1)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 110 -28; 220 -32" dur="17s" begin="4s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;1;1;0.85" keyTimes="0;0.18;0.85;1" dur="17s" begin="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- coin sparkles near slot -->
  <g fill="#cdd6e0" opacity="0.6">
    <circle cx="320" cy="155" r="0.8">
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="345" cy="150" r="0.6">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="158" r="0.5">
      <animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tertiary line -->
  <text x="400" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-style="italic" fill="#8a98ac" text-anchor="middle" letter-spacing="1.6">BARCLAYS BANK · ENFIELD TOWN · LONDON · JUNE 27, 1967</text>
</svg>
