<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: First Computer Bug — 79th Anniversary (September 9, 1947) -->
<!-- about:
On 9 September 1947, operators of Harvard's Mark II Aiken Relay Calculator traced a mysterious hardware fault to Relay #70, Panel F, and found a moth wedged between the contacts. Grace Hopper's team taped the moth into the logbook, noted "First actual case of bug being found," and quietly turned an old engineer's slang for glitches into the enduring vocabulary of computing. The logbook — moth still fixed to the page — now sits in the Smithsonian's collection.

The left half is that page of the operator's logbook: a moth taped over ruled cream paper, its wings quivering faintly, with the 0800/1000/1545 timestamps and the operator's inked note around it, and a dim DEBUGGED stamp at the corner. On the right, a large SEPTEMBER 9, 2026 headline anchors a copper FIRST COMPUTER BUG · 79 YEARS subhead, an italic amber GRACE HOPPER · HARVARD MARK II · RELAY 70, PANEL F tertiary, a dim green MOTH · TAPE · LOGBOOK · 1545 HOURS spec line, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 9, 2026 — the 79th anniversary of the first computer bug. On the left half, a page of Harvard Mark II's operator logbook: cream ruled paper with a red margin, timestamped 0800/1000/1525/1545 entries in typewriter font ending in '(moth) in relay,' a real moth taped across the page with two crossing yellowed tape strips, its wings faintly quivering, an italic cursive 'First actual case of bug being found.' beneath, and a faded red DEBUGGED oval stamp at the lower left. On the right, a huge cream SEPTEMBER 9, 2026 headline underlined by a copper-to-green sweep, a copper FIRST COMPUTER BUG · 79 YEARS subhead trailed by cream · SINCE 1947, an italic amber GRACE HOPPER · HARVARD MARK II · RELAY 70, PANEL F tertiary, a dim green MOTH · TAPE · LOGBOOK · 1545 HOURS roster, and a Georgia-italic 'the first actual case of bug being found.' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f4e8c8"/>
      <stop offset="55%"  stop-color="#e6d5a8"/>
      <stop offset="100%" stop-color="#c7ac74"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8d290" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#f5e6b0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c9ae72" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="mothWingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a09280"/>
      <stop offset="45%"  stop-color="#6b5b48"/>
      <stop offset="100%" stop-color="#33291d"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c98a3a"/>
      <stop offset="55%"  stop-color="#e6b56a"/>
      <stop offset="100%" stop-color="#3fa06b"/>
    </linearGradient>
    <filter id="paperGrain" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35   0 0 0 0 0.28   0 0 0 0 0.18   0 0 0 0.1 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- ============================== LEFT: LOGBOOK PAGE ============================== -->
  <g transform="translate(24,20)">
    <!-- subtle drop shadow behind page -->
    <rect x="4" y="4" width="340" height="160" rx="3" fill="#000" opacity="0.55"/>
    <!-- Paper -->
    <rect x="0" y="0" width="340" height="160" rx="3" fill="url(#paperGrad)"/>
    <!-- Aged grain overlay -->
    <rect x="0" y="0" width="340" height="160" rx="3" fill="url(#paperGrain)" opacity="0.55"/>
    <!-- Torn-corner shading (top-right) -->
    <path d="M 335 0 L 340 0 L 340 8 Z" fill="#8a7548" opacity="0.5"/>
    <!-- Red left margin line -->
    <line x1="30" y1="4" x2="30" y2="156" stroke="#a83232" stroke-width="0.9" opacity="0.6"/>
    <!-- Ruled lines -->
    <g stroke="#3a5480" stroke-width="0.45" opacity="0.4">
      <line x1="6" y1="30" x2="334" y2="30"/>
      <line x1="6" y1="48" x2="334" y2="48"/>
      <line x1="6" y1="66" x2="334" y2="66"/>
      <line x1="6" y1="84" x2="334" y2="84"/>
      <line x1="6" y1="102" x2="334" y2="102"/>
      <line x1="6" y1="120" x2="334" y2="120"/>
      <line x1="6" y1="138" x2="334" y2="138"/>
      <line x1="6" y1="156" x2="334" y2="156"/>
    </g>

    <!-- Header: date -->
    <text x="42" y="20" font-family="'Courier New', Courier, monospace" font-size="10" fill="#2c2416" font-weight="bold" letter-spacing="0.4">
      9 SEP 1947  ·  HARVARD MARK II
    </text>

    <!-- Timestamp entries (typewriter) -->
    <g font-family="'Courier New', Courier, monospace" font-size="9" fill="#2f2617">
      <text x="42" y="44">0800    started</text>
      <text x="42" y="62">1000    stopped</text>
      <text x="42" y="80">1525    Relay #70 Panel F</text>
      <text x="42" y="98">1545    (moth) in relay.</text>
    </g>

    <!-- Cursive log note beneath -->
    <text x="42" y="118" font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#2c2416">
      First actual case of bug being found.
    </text>

    <!-- The taped moth ================================================= -->
    <g transform="translate(238,86)">
      <!-- Two crossing tape strips (over the wings) -->
      <g opacity="0.9">
        <rect x="-42" y="-6" width="84" height="11" rx="0.5" fill="url(#tapeGrad)" transform="rotate(-18)" stroke="#b89a5a" stroke-width="0.2" stroke-opacity="0.4"/>
        <rect x="-42" y="-6" width="84" height="11" rx="0.5" fill="url(#tapeGrad)" transform="rotate(18)"  stroke="#b89a5a" stroke-width="0.2" stroke-opacity="0.4"/>
      </g>

      <!-- Moth: body & wings -->
      <g>
        <!-- Left wing group (with flutter) -->
        <g>
          <animateTransform attributeName="transform" type="scale"
            values="1 1; 0.92 1; 1 1" dur="7s" repeatCount="indefinite"/>
          <path d="M -2 -7 Q -22 -15 -27 -3 Q -25 6 -12 8 Q -6 5 -2 1 Z" fill="url(#mothWingGrad)"/>
          <path d="M -2 2 Q -18 6 -18 13 Q -13 17 -6 14 Q -4 9 -2 5 Z" fill="url(#mothWingGrad)" opacity="0.88"/>
          <ellipse cx="-15" cy="-2" rx="2.6" ry="1.6" fill="#ecd08a" opacity="0.65"/>
          <ellipse cx="-15" cy="-2" rx="1.1" ry="0.7" fill="#1a140c"/>
        </g>
        <!-- Right wing group (mirrored, with flutter) -->
        <g transform="scale(-1 1)">
          <g>
            <animateTransform attributeName="transform" type="scale"
              values="1 1; 0.92 1; 1 1" dur="7s" begin="0.15s" repeatCount="indefinite"/>
            <path d="M -2 -7 Q -22 -15 -27 -3 Q -25 6 -12 8 Q -6 5 -2 1 Z" fill="url(#mothWingGrad)"/>
            <path d="M -2 2 Q -18 6 -18 13 Q -13 17 -6 14 Q -4 9 -2 5 Z" fill="url(#mothWingGrad)" opacity="0.88"/>
            <ellipse cx="-15" cy="-2" rx="2.6" ry="1.6" fill="#ecd08a" opacity="0.65"/>
            <ellipse cx="-15" cy="-2" rx="1.1" ry="0.7" fill="#1a140c"/>
          </g>
        </g>
        <!-- Moth body -->
        <ellipse cx="0" cy="0" rx="2.4" ry="11" fill="#1a140c"/>
        <!-- Head -->
        <circle cx="0" cy="-11.5" r="2.6" fill="#0e0a06"/>
        <!-- Antennae -->
        <path d="M -1.6 -13 Q -6 -19 -10 -15" stroke="#0e0a06" stroke-width="0.7" fill="none" stroke-linecap="round"/>
        <path d="M  1.6 -13 Q  6 -19  10 -15" stroke="#0e0a06" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      </g>

    </g>

    <!-- DEBUGGED stamp -->
    <g transform="translate(72,144) rotate(-7)" opacity="0.72">
      <ellipse cx="0" cy="0" rx="34" ry="9" fill="none" stroke="#a83232" stroke-width="1.1"/>
      <ellipse cx="0" cy="0" rx="30" ry="6.5" fill="none" stroke="#a83232" stroke-width="0.5" opacity="0.7"/>
      <text x="0" y="3" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="8" fill="#a83232" font-weight="bold" letter-spacing="1.5">DEBUGGED</text>
    </g>
  </g>

  <!-- ============================== RIGHT: TEXT STACK ============================== -->
  <g transform="translate(388,0)">

    <!-- Faint circuit-relay motif behind text (very subtle) -->
    <g opacity="0.08" stroke="#6fbf8a" stroke-width="0.6" fill="none">
      <path d="M 20 22 h 60 v 12 h 40"/>
      <path d="M 20 22 v 8"/>
      <circle cx="120" cy="34" r="1.6" fill="#6fbf8a"/>
      <path d="M 320 30 h 60 v 10"/>
      <circle cx="380" cy="42" r="1.6" fill="#6fbf8a"/>
    </g>

    <!-- Date headline -->
    <text x="18" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#f0e6d2" letter-spacing="1.1">
      SEPTEMBER 9, 2026
    </text>

    <!-- Sweep underline -->
    <line x1="18" y1="70" x2="360" y2="70" stroke="url(#sweepGrad)" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 342; 200 142; 342 0; 200 142; 0 342" keyTimes="0;0.25;0.5;0.75;1" dur="11s" repeatCount="indefinite"/>
    </line>

    <!-- Subhead -->
    <text x="18" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      <tspan fill="#e6a95a">FIRST COMPUTER BUG · 79 YEARS</tspan><tspan fill="#c8bfa8"> · SINCE 1947</tspan>
    </text>

    <!-- Tertiary italic -->
    <text x="18" y="117" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#d8a668" letter-spacing="0.4">
      GRACE HOPPER · HARVARD MARK II · RELAY 70, PANEL F
    </text>

    <!-- Spec roster -->
    <text x="18" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#6fbf8a" letter-spacing="2.5" opacity="0.9">
      MOTH · TAPE · LOGBOOK · 1545 HOURS
    </text>

    <!-- Caption -->
    <text x="18" y="172" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#d8cfb5">
      &#8220;the first actual case of bug being found.&#8221;
    </text>

    <!-- Blinking relay indicator (green dot) -->
    <circle cx="380" cy="138" r="2.4" fill="#6fbf8a" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.42;0.5;0.92;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
