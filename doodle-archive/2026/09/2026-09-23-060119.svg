<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Michael Faraday — 235th Birth Anniversary (September 22, 1791) -->
<!-- about:
On 22 September 1791, in a poor quarter of south London, a blacksmith's son named Michael Faraday was born. He apprenticed to a bookbinder at fourteen, read the volumes that passed under his hands, and talked himself into a job as Humphry Davy's laboratory assistant at the Royal Institution. From that bench he discovered electromagnetic induction, laid out the laws of electrolysis, isolated benzene, and invented what became the electric motor, the generator, and the transformer. He worked without a university education and refused a knighthood. Two hundred and thirty-five years later, every dynamo, every hard drive, every phone charger, and every tap of a contactless card runs on the effect he first saw one October morning in 1831.

The left half is a copper solenoid in cross-section: nine loops in warm metal, a bar magnet with red-north and blue-south halves sliding through the core, blue flux arcs curving from pole to pole. A small ammeter beneath the coil throws its needle right as the magnet enters and left as it withdraws, and a faint equation ε = −dΦ/dt hangs in the field. On the right, a large SEPTEMBER 22, 2026 headline anchors a MICHAEL FARADAY · 235 YEARS subhead, an italic ROYAL INSTITUTION · LONDON · 1791 tertiary, a dim INDUCTION · FLUX · COIL · SPARK roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 22, 2026 — the 235th anniversary of the birth of Michael Faraday on September 22, 1791. On the left half, a copper solenoid drawn in cross-section as nine warm-metal loops with a red-north / blue-south bar magnet sliding through its core, blue electromagnetic flux arcs curving from pole to pole, and a small ammeter beneath the coil throwing its needle right as the magnet enters and left as it withdraws, with a faint ε = −dΦ/dt equation hanging in the field. On the right, a large cream SEPTEMBER 22, 2026 headline underlined by a copper-to-electric-blue sweep, a copper MICHAEL FARADAY · 235 YEARS subhead, an italic electric-blue ROYAL INSTITUTION · LONDON · 1791 tertiary, a dim INDUCTION · FLUX · COIL · SPARK roster, and a Georgia-italic 'nothing is too wonderful to be true.' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8b07a"/>
      <stop offset="50%"  stop-color="#c37a3a"/>
      <stop offset="100%" stop-color="#7a4520"/>
    </linearGradient>
    <linearGradient id="copperRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2c896"/>
      <stop offset="40%"  stop-color="#d68a48"/>
      <stop offset="70%"  stop-color="#a05a26"/>
      <stop offset="100%" stop-color="#6b3a18"/>
    </linearGradient>
    <linearGradient id="northGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c92a2a"/>
    </linearGradient>
    <linearGradient id="southGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4dabf7"/>
      <stop offset="100%" stop-color="#1864ab"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c37a3a"/>
      <stop offset="55%"  stop-color="#e8b07a"/>
      <stop offset="100%" stop-color="#4dabf7"/>
    </linearGradient>
    <radialGradient id="ammeterFace" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#f4ecd6"/>
      <stop offset="100%" stop-color="#c9b579"/>
    </radialGradient>
    <filter id="fluxGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="sparkGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Faint grid rules (like Faraday's notebook paper) -->
  <g opacity="0.05" stroke="#4dabf7" stroke-width="0.4" fill="none">
    <path d="M 30 30 h 340"/>
    <path d="M 30 170 h 340"/>
    <path d="M 460 24 h 30"/>
    <path d="M 750 26 v 10 h -20"/>
    <path d="M 470 184 h 40 v -18 h 90"/>
  </g>

  <!-- ============================== LEFT: FARADAY APPARATUS ============================== -->
  <g transform="translate(0,0)">

    <!-- Faint equation ε = -dΦ/dt hanging in the field -->
    <text x="45" y="34" font-family="'Georgia', 'Times New Roman', serif" font-style="italic"
          font-size="14" fill="#4dabf7" opacity="0.42" letter-spacing="0.6">
      &#949; = &#8722;d&#934;/dt
      <animate attributeName="opacity" values="0.28;0.58;0.28" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- Bar magnet -->
    <!-- Magnet slides right (enters coil), pauses, slides left (withdraws) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="30 0; 130 0; 130 0; 30 0; 30 0"
                        keyTimes="0;0.35;0.5;0.85;1"
                        dur="11s" repeatCount="indefinite"/>
      <!-- Magnet body: two halves + core -->
      <g transform="translate(60,95)">
        <!-- South (blue) half -->
        <rect x="0" y="0" width="34" height="26" fill="url(#southGrad)" stroke="#0a2540" stroke-width="0.8" rx="1"/>
        <text x="17" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
              font-size="14" font-weight="900" fill="#f2f4fa">S</text>
        <!-- North (red) half -->
        <rect x="34" y="0" width="34" height="26" fill="url(#northGrad)" stroke="#3a0a0a" stroke-width="0.8" rx="1"/>
        <text x="51" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
              font-size="14" font-weight="900" fill="#fff5f5">N</text>
        <!-- Divider -->
        <line x1="34" y1="0" x2="34" y2="26" stroke="#141008" stroke-width="0.9"/>
        <!-- Highlight -->
        <rect x="1.5" y="1.5" width="65" height="3" fill="#ffffff" opacity="0.18" rx="1"/>
      </g>
    </g>

    <!-- Flux arcs curving from N to S (glow when magnet is moving) -->
    <g stroke="#4dabf7" stroke-width="1.4" fill="none" filter="url(#fluxGlow)" opacity="0.7" stroke-linecap="round">
      <path d="M 235 108 Q 265 60 200 60 Q 135 60 165 108" stroke-dasharray="3 3">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.85;0.35" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M 240 108 Q 285 48 200 48 Q 115 48 160 108" stroke-dasharray="4 4" opacity="0.55">
        <animate attributeName="stroke-dashoffset" values="0;-32" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0.65;0.22" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M 235 108 Q 260 148 200 148 Q 140 148 165 108" stroke-dasharray="3 3" opacity="0.6">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.75;0.3" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M 240 108 Q 285 168 200 168 Q 115 168 160 108" stroke-dasharray="4 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="0;-32" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Copper solenoid: 9 rings shown as ellipses (side view) -->
    <!-- Positioned so magnet on left slides into it centered around y=108 -->
    <g>
      <!-- Back arcs of rings (behind magnet) -->
      <g stroke="#7a4520" stroke-width="1.6" fill="none" opacity="0.85">
        <path d="M 195 92 A 6 16 0 0 1 195 124"/>
        <path d="M 215 92 A 6 16 0 0 1 215 124"/>
        <path d="M 235 92 A 6 16 0 0 1 235 124"/>
        <path d="M 255 92 A 6 16 0 0 1 255 124"/>
        <path d="M 275 92 A 6 16 0 0 1 275 124"/>
        <path d="M 295 92 A 6 16 0 0 1 295 124"/>
        <path d="M 315 92 A 6 16 0 0 1 315 124"/>
        <path d="M 335 92 A 6 16 0 0 1 335 124"/>
        <path d="M 355 92 A 6 16 0 0 1 355 124"/>
      </g>
      <!-- Front arcs of rings (in front of magnet, in copper) -->
      <g stroke="url(#copperRing)" stroke-width="3.2" fill="none" stroke-linecap="round">
        <path d="M 195 92 A 6 16 0 0 0 195 124"/>
        <path d="M 215 92 A 6 16 0 0 0 215 124"/>
        <path d="M 235 92 A 6 16 0 0 0 235 124"/>
        <path d="M 255 92 A 6 16 0 0 0 255 124"/>
        <path d="M 275 92 A 6 16 0 0 0 275 124"/>
        <path d="M 295 92 A 6 16 0 0 0 295 124"/>
        <path d="M 315 92 A 6 16 0 0 0 315 124"/>
        <path d="M 335 92 A 6 16 0 0 0 335 124"/>
        <path d="M 355 92 A 6 16 0 0 0 355 124"/>
      </g>
      <!-- Connecting wires along top and bottom (helical hint) -->
      <path d="M 195 92 L 215 92 L 215 92 L 235 92 L 235 92 L 255 92 L 275 92 L 295 92 L 315 92 L 335 92 L 355 92"
            stroke="url(#copperGrad)" stroke-width="1.2" fill="none" opacity="0.7"/>
      <!-- Lead wires down to ammeter -->
      <path d="M 195 92 Q 190 88 185 90 L 130 90 L 130 148" stroke="#c37a3a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M 355 124 Q 360 128 365 128 L 175 128 L 175 148" stroke="#c37a3a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Small charge particles flowing through the wires (induced current) -->
    <g fill="#4dabf7" filter="url(#fluxGlow)">
      <circle r="1.6">
        <animateMotion path="M 130 148 L 130 90 L 195 90" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="1.6">
        <animateMotion path="M 130 148 L 130 90 L 195 90" dur="7s" begin="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="7s" begin="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="1.6">
        <animateMotion path="M 130 148 L 130 90 L 195 90" dur="7s" begin="4.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="7s" begin="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Ammeter -->
    <g transform="translate(152,148)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="20" fill="url(#ammeterFace)" stroke="#7a4520" stroke-width="1.6"/>
      <!-- Scale arc -->
      <path d="M -14 -4 A 14 14 0 0 1 14 -4" stroke="#241a0d" stroke-width="0.6" fill="none"/>
      <!-- Center pivot -->
      <circle cx="0" cy="0" r="1.6" fill="#241a0d"/>
      <!-- Ticks -->
      <g stroke="#241a0d" stroke-width="0.6">
        <line x1="-14" y1="-4" x2="-16" y2="-5"/>
        <line x1="-7" y1="-11" x2="-8" y2="-13"/>
        <line x1="0" y1="-14" x2="0" y2="-16"/>
        <line x1="7" y1="-11" x2="8" y2="-13"/>
        <line x1="14" y1="-4" x2="16" y2="-5"/>
      </g>
      <!-- Labels -->
      <text x="-16" y="0" text-anchor="end" font-family="'Georgia', serif" font-size="5" fill="#241a0d">&#8722;</text>
      <text x="0" y="-18" text-anchor="middle" font-family="'Georgia', serif" font-size="4.5" fill="#241a0d" letter-spacing="0.4">0</text>
      <text x="16" y="0" font-family="'Georgia', serif" font-size="5" fill="#241a0d">+</text>
      <!-- Needle: wiggles in sync with magnet motion (11s) -->
      <line x1="0" y1="0" x2="0" y2="-13" stroke="#c92a2a" stroke-width="1.2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;55;0;-55;0"
                          keyTimes="0;0.25;0.5;0.75;1"
                          dur="11s" repeatCount="indefinite"/>
      </line>
      <!-- "A" mark -->
      <text x="0" y="14" text-anchor="middle" font-family="'Georgia', serif" font-size="6" font-style="italic" fill="#241a0d">A</text>
    </g>

    <!-- Occasional spark on the magnet's leading pole when entering coil -->
    <g fill="#ffd43b" filter="url(#sparkGlow)" opacity="0">
      <circle cx="195" cy="108" r="3">
        <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.3;0.35;0.4;1" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="195" cy="108" r="1.6">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.85;0.9;1" dur="11s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ============================== RIGHT: TEXT STACK ============================== -->
  <g transform="translate(400,0)">

    <!-- Small horseshoe magnet icon in the top-right -->
    <g transform="translate(346,14)" opacity="0.9">
      <!-- U shape -->
      <path d="M 2 4 L 2 20 A 8 8 0 0 0 18 20 L 18 4" stroke="#c37a3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- Pole tips -->
      <rect x="0" y="2" width="4" height="4" fill="#c92a2a" stroke="#3a0a0a" stroke-width="0.4"/>
      <rect x="16" y="2" width="4" height="4" fill="#1864ab" stroke="#0a2540" stroke-width="0.4"/>
      <!-- Faint flux -->
      <path d="M 4 4 Q 10 -1 16 4" stroke="#4dabf7" stroke-width="0.6" fill="none" opacity="0.6" stroke-dasharray="1.5 1.5">
        <animate attributeName="opacity" values="0.35;0.8;0.35" dur="7s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate"
                        values="346 14; 346 13; 346 14" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- Faint bracket rules -->
    <g opacity="0.10" stroke="#e8b07a" stroke-width="0.6" fill="none">
      <path d="M 20 22 h 40"/>
      <path d="M 20 180 h 30"/>
    </g>

    <!-- Date headline (primary anchor) -->
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" fill="#f2f4fa" letter-spacing="1.1">
      SEPTEMBER 22, 2026
    </text>

    <!-- Sweep underline -->
    <line x1="20" y1="70" x2="362" y2="70" stroke="url(#sweepGrad)" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 342; 220 122; 342 0; 220 122; 0 342"
               keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
    </line>

    <!-- Subhead: FARADAY · 235 YEARS -->
    <text x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" font-weight="700" letter-spacing="1.5">
      <tspan fill="#e8b07a">MICHAEL FARADAY</tspan><tspan fill="#f2f4fa"> &#183; 235 YEARS</tspan>
    </text>

    <!-- Tertiary italic -->
    <text x="20" y="117" font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#4dabf7" letter-spacing="0.4">
      ROYAL INSTITUTION &#183; LONDON &#183; 1791
    </text>

    <!-- Spec roster -->
    <text x="20" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="600" fill="#8b95a5" letter-spacing="2.5" opacity="0.98">
      INDUCTION &#183; FLUX &#183; COIL &#183; SPARK
    </text>

    <!-- Caption (Faraday quote) -->
    <text x="20" y="172" font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#d8dfec">
      &#8220;nothing is too wonderful to be true.&#8221;
    </text>

    <!-- Pulse indicator — a small electric-blue node -->
    <circle cx="380" cy="138" r="2.2" fill="#4dabf7" filter="url(#fluxGlow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
