<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Google — 28th Anniversary (September 4, 1998) -->
<!-- about:
On 4 September 1998, Larry Page and Sergey Brin filed the incorporation papers for Google, Inc. from a rented garage in Menlo Park, California. The first check the company received had been made out to "Google Inc." before Google Inc. legally existed, so they needed a bank account, so they needed a company. Their search engine, briefly called BackRub, had been running on the Stanford campus network since 1996 and had already used enough bandwidth to earn the graduate-school administration's polite attention. The name was a misspelling of googol — ten to the hundredth power — meant to gesture at the size of the web the PageRank algorithm was ranking. Twenty-eight years later almost every daily art piece on a homepage is a distant nephew of the ones google.com started pinning to its logo in the late nineties; today's is a direct one.

The left half is a small Google Doodle in miniature: six primary-colored orbs bounce in staggered arcs above a rounded search bar with a blinking cursor and a cycling ghost query, a magnifying glass on the left, and two stubby buttons below. On the right, a large cream SEPTEMBER 4, 2026 headline anchors a Google-blue GOOGLE · 28 YEARS subhead, an italic amber MENLO PARK · GARAGE · STANFORD · 1998 tertiary, a dim slate PAGE · BRIN · PAGERANK · GOOGOL roster, and a Georgia-italic 'ten to the hundredth power.' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 4, 2026 — the 28th anniversary of Google's founding on September 4, 1998. On the left half, a cream Google-search-page-in-miniature: six primary-colored orbs (blue, red, yellow, blue, green, red) bounce in staggered arcs above a rounded search bar containing a blinking text cursor and cycling ghost query text, a small magnifying glass on the left of the bar, and two rounded 'Google Search' and 'I'm Feeling Lucky' buttons below. On the right, a huge cream SEPTEMBER 4, 2026 headline underlined by a blue-red-yellow-green sweep, a Google-blue GOOGLE · 28 YEARS subhead trailed by cream · SINCE 1998, an italic amber MENLO PARK · GARAGE · STANFORD · 1998 tertiary, a dim slate PAGE · BRIN · PAGERANK · GOOGOL roster, and a Georgia-italic 'ten to the hundredth power.' caption at the base.">
  <defs>
    <!-- Cream 'search page' background -->
    <linearGradient id="pageG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#ece4d4"/>
    </linearGradient>

    <!-- Search bar fill -->
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4eed8"/>
    </linearGradient>

    <!-- Button fill -->
    <linearGradient id="btnG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f8f4e4"/>
      <stop offset="100%" stop-color="#e0d8c0"/>
    </linearGradient>

    <!-- Underline sweep (Google palette) -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4285F4" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#4285F4" stop-opacity="1"/>
      <stop offset="42%"  stop-color="#EA4335" stop-opacity="1"/>
      <stop offset="68%"  stop-color="#FBBC05" stop-opacity="1"/>
      <stop offset="92%"  stop-color="#34A853" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#4285F4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow for orbs -->
    <radialGradient id="orbBlueG" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#a8c7ff"/>
      <stop offset="60%"  stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1a3a80"/>
    </radialGradient>
    <radialGradient id="orbRedG" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#ffb0a8"/>
      <stop offset="60%"  stop-color="#EA4335"/>
      <stop offset="100%" stop-color="#7a1810"/>
    </radialGradient>
    <radialGradient id="orbYelG" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#ffedad"/>
      <stop offset="60%"  stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#7a5a00"/>
    </radialGradient>
    <radialGradient id="orbGrnG" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#b0ecc0"/>
      <stop offset="60%"  stop-color="#34A853"/>
      <stop offset="100%" stop-color="#0f4a20"/>
    </radialGradient>

    <clipPath id="leftPanel">
      <rect x="0" y="0" width="360" height="200"/>
    </clipPath>
  </defs>

  <!-- ============ LEFT PANEL: MINI GOOGLE HOMEPAGE ============ -->
  <g clip-path="url(#leftPanel)">
    <!-- Cream page background -->
    <rect x="0" y="0" width="360" height="200" fill="url(#pageG)"/>

    <!-- Faint dot-grid texture -->
    <g fill="#c8bfa8" opacity="0.35">
      <circle cx="30"  cy="15" r="0.6"/>
      <circle cx="70"  cy="15" r="0.6"/>
      <circle cx="110" cy="15" r="0.6"/>
      <circle cx="150" cy="15" r="0.6"/>
      <circle cx="190" cy="15" r="0.6"/>
      <circle cx="230" cy="15" r="0.6"/>
      <circle cx="270" cy="15" r="0.6"/>
      <circle cx="310" cy="15" r="0.6"/>
      <circle cx="30"  cy="185" r="0.6"/>
      <circle cx="70"  cy="185" r="0.6"/>
      <circle cx="110" cy="185" r="0.6"/>
      <circle cx="150" cy="185" r="0.6"/>
      <circle cx="190" cy="185" r="0.6"/>
      <circle cx="230" cy="185" r="0.6"/>
      <circle cx="270" cy="185" r="0.6"/>
      <circle cx="310" cy="185" r="0.6"/>
    </g>

    <!-- ============ SIX BOUNCING ORBS (Google palette) ============ -->
    <!-- Baseline y=52, orbs bounce upward -->
    <g>
      <!-- Orb 1: blue (G) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; 0 -14; 0 0" dur="2.3s" begin="0s" repeatCount="indefinite"
                          keyTimes="0;0.5;1"/>
        <circle cx="95" cy="52" r="11" fill="url(#orbBlueG)"/>
        <circle cx="92" cy="49" r="3" fill="#e8f0ff" opacity="0.7"/>
      </g>
      <!-- Orb 2: red (o) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; 0 -14; 0 0" dur="2.3s" begin="0.2s" repeatCount="indefinite"
                          keyTimes="0;0.5;1"/>
        <circle cx="130" cy="52" r="11" fill="url(#orbRedG)"/>
        <circle cx="127" cy="49" r="3" fill="#ffe8e4" opacity="0.7"/>
      </g>
      <!-- Orb 3: yellow (o) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; 0 -14; 0 0" dur="2.3s" begin="0.4s" repeatCount="indefinite"
                          keyTimes="0;0.5;1"/>
        <circle cx="165" cy="52" r="11" fill="url(#orbYelG)"/>
        <circle cx="162" cy="49" r="3" fill="#fff7d8" opacity="0.7"/>
      </g>
      <!-- Orb 4: blue (g) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; 0 -14; 0 0" dur="2.3s" begin="0.6s" repeatCount="indefinite"
                          keyTimes="0;0.5;1"/>
        <circle cx="200" cy="52" r="11" fill="url(#orbBlueG)"/>
        <circle cx="197" cy="49" r="3" fill="#e8f0ff" opacity="0.7"/>
      </g>
      <!-- Orb 5: green (l) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; 0 -14; 0 0" dur="2.3s" begin="0.8s" repeatCount="indefinite"
                          keyTimes="0;0.5;1"/>
        <circle cx="235" cy="52" r="11" fill="url(#orbGrnG)"/>
        <circle cx="232" cy="49" r="3" fill="#e4fae0" opacity="0.7"/>
      </g>
      <!-- Orb 6: red (e) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; 0 -14; 0 0" dur="2.3s" begin="1.0s" repeatCount="indefinite"
                          keyTimes="0;0.5;1"/>
        <circle cx="270" cy="52" r="11" fill="url(#orbRedG)"/>
        <circle cx="267" cy="49" r="3" fill="#ffe8e4" opacity="0.7"/>
      </g>
    </g>

    <!-- ============ SEARCH BAR ============ -->
    <!-- Soft shadow -->
    <rect x="42" y="92" width="276" height="30" rx="15" fill="#000" opacity="0.08"/>
    <!-- Bar body -->
    <rect x="40" y="88" width="276" height="30" rx="15" fill="url(#barG)" stroke="#a89f88" stroke-width="0.9"/>

    <!-- Magnifying glass icon inside bar (left) -->
    <g transform="translate(58 103)" stroke="#5a5548" stroke-width="1.6" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="5.2"/>
      <line x1="3.8" y1="3.8" x2="7.5" y2="7.5"/>
    </g>

    <!-- Cycling ghost query text — each starts hidden, fades in during its own slot -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
       font-size="12" fill="#5a5548">
      <text x="76" y="107" opacity="1">how did we get here
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1"
                 keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.99;0.995;1"
                 dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="76" y="107" opacity="0">what year is it
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0"
                 keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.99;0.995;1"
                 dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="76" y="107" opacity="0">am i online
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0"
                 keyTimes="0;0.28;0.33;0.61;0.66;0.94;0.99;0.995;1"
                 dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Blinking cursor -->
    <rect x="248" y="97" width="1.6" height="14" fill="#4285F4">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Right-side clear (x) icon ghost -->
    <g transform="translate(300 103)" stroke="#8a8272" stroke-width="1.1" fill="none" stroke-linecap="round">
      <line x1="-3" y1="-3" x2="3" y2="3"/>
      <line x1="-3" y1="3"  x2="3" y2="-3"/>
    </g>

    <!-- ============ TWO BUTTONS ============ -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
       font-size="9" fill="#3a3628" letter-spacing="0.3">
      <rect x="88" y="134" width="82" height="20" rx="3" fill="url(#btnG)" stroke="#a89f88" stroke-width="0.7"/>
      <text x="129" y="147" text-anchor="middle" font-weight="600">Google Search</text>

      <rect x="186" y="134" width="82" height="20" rx="3" fill="url(#btnG)" stroke="#a89f88" stroke-width="0.7"/>
      <text x="227" y="147" text-anchor="middle" font-weight="600">I&#8217;m Feeling Lucky</text>
    </g>

    <!-- ============ FOOTER STRIP ============ -->
    <rect x="0" y="172" width="360" height="28" fill="#d8cfb8"/>
    <line x1="0" y1="172" x2="360" y2="172" stroke="#a89f88" stroke-width="0.6"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
       font-size="8.5" fill="#5a5548" letter-spacing="0.4">
      <text x="14" y="189" opacity="0.85">Menlo Park &#183; California</text>
      <text x="346" y="189" text-anchor="end" opacity="0.85">&#169; 1998&#8211;2026 &#183; 28 years</text>
    </g>

    <!-- Sparkle particles rising from the orbs occasionally -->
    <g fill="#FBBC05" opacity="0.85">
      <circle r="1">
        <animateMotion dur="7s" repeatCount="indefinite"
                       path="M 130 40 Q 140 22 160 18"/>
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="0.9" fill="#4285F4">
        <animateMotion dur="9s" begin="1.5s" repeatCount="indefinite"
                       path="M 200 42 Q 215 24 240 22"/>
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="0.8" fill="#EA4335">
        <animateMotion dur="8s" begin="3s" repeatCount="indefinite"
                       path="M 95 42 Q 80 24 60 22"/>
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="8s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="0.9" fill="#34A853">
        <animateMotion dur="11s" begin="2s" repeatCount="indefinite"
                       path="M 270 42 Q 290 22 320 20"/>
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.4;1" dur="11s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Seam -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ============ RIGHT TEXT PANEL ============ -->
  <rect x="360" y="0" width="440" height="200" fill="#0d1117"/>

  <!-- Right-edge accent bars (Google palette) -->
  <rect x="792" y="20" width="4" height="40" fill="#4285F4" opacity="0.9"/>
  <rect x="792" y="60" width="4" height="40" fill="#EA4335" opacity="0.9"/>
  <rect x="792" y="100" width="4" height="40" fill="#FBBC05" opacity="0.9"/>
  <rect x="792" y="140" width="4" height="40" fill="#34A853" opacity="0.9"/>

  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f4e6c8" letter-spacing="1">
    SEPTEMBER 4, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#4285F4">GOOGLE</tspan><tspan fill="#f4e6c8" opacity="0.8">&#160;·&#160;28 YEARS</tspan><tspan fill="#f4e6c8" opacity="0.55">&#160;·&#160;SINCE 1998</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffbf5a" letter-spacing="1" opacity="0.95">
    MENLO PARK &#183; GARAGE &#183; STANFORD &#183; 1998
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#a89686" letter-spacing="1" opacity="0.85">
    PAGE &#183; BRIN &#183; PAGERANK &#183; GOOGOL
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" font-style="italic" fill="#f4e6c8" opacity="0.9">
    &#8220;ten to the hundredth power.&#8221;
  </text>
</svg>
