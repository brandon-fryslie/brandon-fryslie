<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Ethernet — 46 Years (September 30, 1980) -->
<!-- about:
On 30 September 1980, DEC, Intel, and Xerox jointly published version 1.0 of "The Ethernet, A Local Area Network. Data Link Layer and Physical Layer Specifications" — the DIX Blue Book. Robert Metcalfe's 1973 memo at Xerox PARC had already shown that a shared coaxial cable could carry packets between machines if every talker listened before speaking and backed off politely when two voices collided; the DIX spec turned that idea into a document any vendor could build to. Forty-six years on, almost every wired network on Earth is a descendant — the yellow thicknet is gone, the coax became twisted pair became fibre, but the frame, the MAC address, the preamble, and the polite-conversation rules on the wire are still Metcalfe's.

The scene is a bus-topology LAN seen edge-on. A thick yellow-orange coaxial cable spans the full width of the frame, terminators clamped at both ends, four small workstations tapped in beneath it by their drop cables and blinking activity LEDs. Along the wire, tagged packets — DST, SRC, TYPE, DATA, FCS — slide steadily left to right at prime intervals, one of them the payload for today. Above the bus, a large cream SEPTEMBER 30, 2026 headline sits over an amber ETHERNET · 46 YEARS subhead, an italic DIX v1.0 · DEC · INTEL · XEROX tertiary, and a Georgia-italic 'listen before you talk' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 30, 2026 — the 46th anniversary of the DIX Ethernet v1.0 specification published by DEC, Intel, and Xerox on September 30, 1980. A thick yellow-orange coaxial cable spans the full width of the frame with terminator caps clamped at both ends. Four small silver workstations tap into the cable from beneath through drop cables, each with a glowing cyan screen and a small blinking activity LED. Along the cable, tagged packets in cyan, magenta, green, and amber — labelled DST, SRC, TYPE, DATA, FCS — slide left to right at different speeds. Above the bus, a large cream SEPTEMBER 30, 2026 headline underlined by an amber-to-cyan sweep, an amber ETHERNET · 46 YEARS subhead, an italic dim DIX v1.0 · DEC · INTEL · XEROX tertiary, a small COLLISION · BACKOFF · RETRANSMIT · ACK roster, and a Georgia-italic 'listen before you talk' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#080d18"/>
      <stop offset="1"   stop-color="#0d1220"/>
    </linearGradient>

    <linearGradient id="coaxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8a5a10"/>
      <stop offset="0.35" stop-color="#f0c040"/>
      <stop offset="0.7"  stop-color="#d09018"/>
      <stop offset="1"    stop-color="#5a3808"/>
    </linearGradient>

    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8090a4"/>
      <stop offset="1" stop-color="#40505c"/>
    </linearGradient>

    <linearGradient id="caseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ccd0"/>
      <stop offset="1" stop-color="#5a6068"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40a0d0"/>
      <stop offset="1" stop-color="#082848"/>
    </linearGradient>

    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#c07830"/>
      <stop offset="0.5" stop-color="#f0e0b8"/>
      <stop offset="1"   stop-color="#40a0c8"/>
    </linearGradient>

    <radialGradient id="ledGrad" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f0ffc0"/>
      <stop offset="0.4" stop-color="#60d040"/>
      <stop offset="1" stop-color="#082010"/>
    </radialGradient>

    <!-- Packet color palette (Wireshark-adjacent) -->
    <linearGradient id="pktCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60d0f0"/><stop offset="1" stop-color="#187098"/>
    </linearGradient>
    <linearGradient id="pktMag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e070c0"/><stop offset="1" stop-color="#802060"/>
    </linearGradient>
    <linearGradient id="pktGrn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80d868"/><stop offset="1" stop-color="#20602a"/>
    </linearGradient>
    <linearGradient id="pktAmb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c060"/><stop offset="1" stop-color="#805018"/>
    </linearGradient>
    <linearGradient id="pktPay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e0b8"/><stop offset="1" stop-color="#a08858"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Faint schematic grid (network topology backdrop) -->
  <g stroke="#152238" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="16" x2="800" y2="16"/>
    <line x1="0" y1="184" x2="800" y2="184"/>
  </g>
  <g stroke="#0f1a2c" stroke-width="0.3" opacity="0.6">
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
  </g>
  <g stroke="#132038" stroke-width="0.25" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- ============================== TOP TEXT STACK ============================== -->

  <!-- Date headline -->
  <text x="400" y="42" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f0e8d0" letter-spacing="1.8">
    SEPTEMBER 30, 2026
  </text>

  <!-- Underline sweep -->
  <line x1="240" y1="54" x2="560" y2="54" stroke="url(#underlineGrad)" stroke-width="2.4" stroke-linecap="round">
    <animate attributeName="stroke-dasharray"
             values="0 320;220 100;320 0;220 100;0 320"
             keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
  </line>

  <!-- Subhead -->
  <text x="400" y="74" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2.4" xml:space="preserve">
    <tspan fill="#f0c060">ETHERNET  </tspan><tspan fill="#f0e8d0">&#183;  46 YEARS</tspan>
  </text>

  <!-- Tertiary italic -->
  <text x="400" y="92" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#8098b8" letter-spacing="0.7">
    DIX v1.0 &#183; DEC &#183; INTEL &#183; XEROX &#183; 1980
  </text>

  <!-- ============================== COAX BUS ============================== -->

  <!-- Cable shadow -->
  <rect x="28" y="129" width="744" height="4" fill="#000" opacity="0.45"/>

  <!-- The yellow thicknet coax -->
  <rect x="28" y="118" width="744" height="10" rx="4" ry="4" fill="url(#coaxGrad)" stroke="#3a2408" stroke-width="0.6"/>

  <!-- Cable highlight streak -->
  <rect x="30" y="119.5" width="740" height="1.6" fill="#fff4c0" opacity="0.45"/>

  <!-- Left terminator (T-connector with resistor cap) -->
  <g>
    <rect x="14" y="114" width="18" height="18" rx="1.5" ry="1.5" fill="url(#termGrad)" stroke="#20303c" stroke-width="0.6"/>
    <rect x="8" y="121" width="6" height="4" fill="#a0a8b0"/>
    <rect x="14" y="122" width="4" height="2" fill="#c8ccd0"/>
    <text x="23" y="107" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="5.4" font-weight="700" fill="#7088a0" letter-spacing="0.6">50&#8486;</text>
  </g>

  <!-- Right terminator -->
  <g>
    <rect x="768" y="114" width="18" height="18" rx="1.5" ry="1.5" fill="url(#termGrad)" stroke="#20303c" stroke-width="0.6"/>
    <rect x="786" y="121" width="6" height="4" fill="#a0a8b0"/>
    <rect x="782" y="122" width="4" height="2" fill="#c8ccd0"/>
    <text x="777" y="107" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="5.4" font-weight="700" fill="#7088a0" letter-spacing="0.6">50&#8486;</text>
  </g>

  <!-- ============================== WORKSTATIONS (4 nodes tapped in) ============================== -->

  <!-- Reusable workstation renderer via <g> instances -->

  <!-- Workstation 1: x=140 -->
  <g transform="translate(140 0)">
    <!-- Vampire tap -->
    <rect x="-5" y="124" width="10" height="7" fill="#5a6a74" stroke="#20303c" stroke-width="0.4"/>
    <!-- Drop cable down to node -->
    <line x1="0" y1="131" x2="0" y2="150" stroke="#4a5560" stroke-width="1.6"/>
    <!-- CPU case -->
    <rect x="-16" y="150" width="32" height="22" rx="1" ry="1" fill="url(#caseGrad)" stroke="#20303c" stroke-width="0.5"/>
    <!-- Screen -->
    <rect x="-13" y="153" width="26" height="14" rx="0.6" ry="0.6" fill="url(#screenGrad)"/>
    <!-- Scan line pulse on screen -->
    <line x1="-12" y1="158" x2="12" y2="158" stroke="#a0e0ff" stroke-width="0.4" opacity="0.7">
      <animate attributeName="y1" values="154;166;154" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="154;166;154" dur="7s" repeatCount="indefinite"/>
    </line>
    <!-- Activity LED -->
    <circle cx="13" cy="170" r="1.6" fill="url(#ledGrad)">
      <animate attributeName="opacity" values="0.2;1;0.2;0.7;0.2" keyTimes="0;0.1;0.2;0.4;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- Base -->
    <rect x="-10" y="172" width="20" height="2.2" fill="#3a4048"/>
    <!-- Label -->
    <text x="0" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="700" fill="#7088a0" letter-spacing="1.4">ALTO</text>
  </g>

  <!-- Workstation 2: x=320 -->
  <g transform="translate(320 0)">
    <rect x="-5" y="124" width="10" height="7" fill="#5a6a74" stroke="#20303c" stroke-width="0.4"/>
    <line x1="0" y1="131" x2="0" y2="150" stroke="#4a5560" stroke-width="1.6"/>
    <rect x="-16" y="150" width="32" height="22" rx="1" ry="1" fill="url(#caseGrad)" stroke="#20303c" stroke-width="0.5"/>
    <rect x="-13" y="153" width="26" height="14" rx="0.6" ry="0.6" fill="url(#screenGrad)"/>
    <line x1="-12" y1="158" x2="12" y2="158" stroke="#a0e0ff" stroke-width="0.4" opacity="0.7">
      <animate attributeName="y1" values="154;166;154" dur="11s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="154;166;154" dur="11s" begin="1.3s" repeatCount="indefinite"/>
    </line>
    <circle cx="13" cy="170" r="1.6" fill="url(#ledGrad)">
      <animate attributeName="opacity" values="0.2;0.7;0.2;1;0.2" keyTimes="0;0.15;0.35;0.55;1" dur="11s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <rect x="-10" y="172" width="20" height="2.2" fill="#3a4048"/>
    <text x="0" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="700" fill="#7088a0" letter-spacing="1.4">VAX</text>
  </g>

  <!-- Workstation 3: x=480 -->
  <g transform="translate(480 0)">
    <rect x="-5" y="124" width="10" height="7" fill="#5a6a74" stroke="#20303c" stroke-width="0.4"/>
    <line x1="0" y1="131" x2="0" y2="150" stroke="#4a5560" stroke-width="1.6"/>
    <rect x="-16" y="150" width="32" height="22" rx="1" ry="1" fill="url(#caseGrad)" stroke="#20303c" stroke-width="0.5"/>
    <rect x="-13" y="153" width="26" height="14" rx="0.6" ry="0.6" fill="url(#screenGrad)"/>
    <line x1="-12" y1="158" x2="12" y2="158" stroke="#a0e0ff" stroke-width="0.4" opacity="0.7">
      <animate attributeName="y1" values="154;166;154" dur="7s" begin="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="154;166;154" dur="7s" begin="2.6s" repeatCount="indefinite"/>
    </line>
    <circle cx="13" cy="170" r="1.6" fill="url(#ledGrad)">
      <animate attributeName="opacity" values="0.2;1;0.5;1;0.2" keyTimes="0;0.1;0.25;0.4;1" dur="13s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <rect x="-10" y="172" width="20" height="2.2" fill="#3a4048"/>
    <text x="0" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="700" fill="#7088a0" letter-spacing="1.4">STAR</text>
  </g>

  <!-- Workstation 4: x=660 -->
  <g transform="translate(660 0)">
    <rect x="-5" y="124" width="10" height="7" fill="#5a6a74" stroke="#20303c" stroke-width="0.4"/>
    <line x1="0" y1="131" x2="0" y2="150" stroke="#4a5560" stroke-width="1.6"/>
    <rect x="-16" y="150" width="32" height="22" rx="1" ry="1" fill="url(#caseGrad)" stroke="#20303c" stroke-width="0.5"/>
    <rect x="-13" y="153" width="26" height="14" rx="0.6" ry="0.6" fill="url(#screenGrad)"/>
    <line x1="-12" y1="158" x2="12" y2="158" stroke="#a0e0ff" stroke-width="0.4" opacity="0.7">
      <animate attributeName="y1" values="154;166;154" dur="11s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="154;166;154" dur="11s" begin="3.4s" repeatCount="indefinite"/>
    </line>
    <circle cx="13" cy="170" r="1.6" fill="url(#ledGrad)">
      <animate attributeName="opacity" values="0.2;0.7;0.2;1;0.2" keyTimes="0;0.2;0.35;0.55;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="-10" y="172" width="20" height="2.2" fill="#3a4048"/>
    <text x="0" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="700" fill="#7088a0" letter-spacing="1.4">PDP-11</text>
  </g>

  <!-- ============================== PACKETS ON THE WIRE ============================== -->
  <!-- Packets ride ON TOP OF the coax at y=120..126, sliding left→right. Prime-number durations. -->

  <!-- Packet A: DST — cyan, fast -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="-70 0; 810 0" dur="7s" repeatCount="indefinite"/>
    <rect x="0" y="118" width="46" height="10" rx="1.5" ry="1.5" fill="url(#pktCyan)" stroke="#082838" stroke-width="0.5"/>
    <text x="23" y="125.5" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="800" fill="#04202c" letter-spacing="0.6">DST&#183;MAC</text>
  </g>

  <!-- Packet B: SRC — magenta, medium -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="-70 0; 810 0" dur="11s" begin="1.4s" repeatCount="indefinite"/>
    <rect x="0" y="118" width="44" height="10" rx="1.5" ry="1.5" fill="url(#pktMag)" stroke="#301028" stroke-width="0.5"/>
    <text x="22" y="125.5" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="800" fill="#28001c" letter-spacing="0.6">SRC&#183;MAC</text>
  </g>

  <!-- Packet C: TYPE — green, slow -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="-70 0; 810 0" dur="13s" begin="3.1s" repeatCount="indefinite"/>
    <rect x="0" y="118" width="36" height="10" rx="1.5" ry="1.5" fill="url(#pktGrn)" stroke="#0c2010" stroke-width="0.5"/>
    <text x="18" y="125.5" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="800" fill="#082008" letter-spacing="0.6">0x0800</text>
  </g>

  <!-- Packet D: PAYLOAD carrying today's date — cream, medium -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="-160 0; 810 0" dur="17s" begin="5.5s" repeatCount="indefinite"/>
    <rect x="0" y="117" width="136" height="12" rx="2" ry="2" fill="url(#pktPay)" stroke="#403020" stroke-width="0.6"/>
    <text x="68" y="125.5" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="7.2" font-weight="800" fill="#20180c" letter-spacing="1.2">2026&#8209;09&#8209;30  DATA</text>
  </g>

  <!-- Packet E: FCS — amber, quick tail -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="-70 0; 810 0" dur="7s" begin="4.9s" repeatCount="indefinite"/>
    <rect x="0" y="118" width="30" height="10" rx="1.5" ry="1.5" fill="url(#pktAmb)" stroke="#3a2408" stroke-width="0.5"/>
    <text x="15" y="125.5" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="800" fill="#201008" letter-spacing="0.6">FCS</text>
  </g>

  <!-- Packet F: PREAMBLE — thin cyan striped -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="-70 0; 810 0" dur="11s" begin="6.7s" repeatCount="indefinite"/>
    <rect x="0" y="119" width="34" height="8" rx="1" ry="1" fill="#204058" stroke="#082838" stroke-width="0.4"/>
    <g fill="#60d0f0">
      <rect x="2"  y="120" width="2" height="6"/>
      <rect x="6"  y="120" width="2" height="6"/>
      <rect x="10" y="120" width="2" height="6"/>
      <rect x="14" y="120" width="2" height="6"/>
      <rect x="18" y="120" width="2" height="6"/>
      <rect x="22" y="120" width="2" height="6"/>
      <rect x="26" y="120" width="2" height="6"/>
      <rect x="30" y="120" width="2" height="6"/>
    </g>
  </g>

  <!-- ============================== BASE CAPTION + ROSTER ============================== -->

  <!-- Roster: CSMA/CD lifecycle keywords -->
  <text x="400" y="107" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.4" font-weight="700" fill="#4a6080" letter-spacing="2.0" opacity="0.95">
    CSMA/CD &#183; COLLISION &#183; BACKOFF &#183; RETRANSMIT &#183; ACK
  </text>

  <!-- Georgia italic caption -->
  <text x="400" y="197" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10" font-style="italic" fill="#7088a0" opacity="0.9">
    &#8220;listen before you talk&#8221;
  </text>

</svg>
