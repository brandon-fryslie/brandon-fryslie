<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Mary Shelley — 229th Birthday (August 30, 1797) -->
<!-- about:
Mary Wollstonecraft Shelley was born in London on 30 August 1797, the daughter of philosopher William Godwin and pioneering feminist Mary Wollstonecraft, who died eleven days after her birth. In the summer of 1816 — the "Year Without a Summer," darkened by the eruption of Mount Tambora — the eighteen-year-old Mary and her lover Percy Bysshe Shelley sat around a fire at the Villa Diodati on the shore of Lake Geneva with Lord Byron and John Polidori, trading ghost stories. From that competition came a waking dream of "the pale student of unhallowed arts kneeling beside the thing he had put together." Two years later Frankenstein; or, The Modern Prometheus appeared anonymously. She was twenty. She had invented science fiction while nobody was watching.

The left half is her laboratory at midnight: a stone slab holds a shrouded form under a stormy vault, two brass electrodes crackle a Jacob's ladder of blue-white arcs rising between them, a hand emerges from beneath the sheet, a jagged bolt splits the sky, and a gothic turret glows with a single candle. On the right, a large cream AUGUST 30, 2026 headline anchors a violet MARY SHELLEY · 229 YEARS subhead, an italic FRANKENSTEIN · PROMETHEUS · GENEVA · DIODATI tertiary, a dim LIGHTNING · MANUSCRIPT · CASTLE · TRAVELER roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 30, 2026 — the 229th birthday of Mary Shelley. On the left half, a gothic laboratory at midnight: a stone slab holds a shrouded form under a stormy violet vault; two brass electrodes crackle rising blue-white Jacob's ladder arcs between them; a pale hand emerges from beneath the sheet reaching upward; a jagged violet lightning bolt flashes across the sky; a distant gothic castle turret with a single warm candle window silhouettes the storm; a small parchment with a quill sits at the corner. On the right, a huge cream AUGUST 30, 2026 headline underlined by a cyan-to-violet sweep, a violet MARY SHELLEY · 229 YEARS subhead trailed by cream · SINCE 1797, an italic pale-violet FRANKENSTEIN · PROMETHEUS · GENEVA · DIODATI tertiary, a dim slate LIGHTNING · MANUSCRIPT · CASTLE · TRAVELER roster, and a Georgia-italic 'the modern prometheus.' caption at the base.">
  <defs>
    <!-- Stormy night sky -->
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0518"/>
      <stop offset="55%"  stop-color="#160c26"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>

    <!-- Brass rod -->
    <linearGradient id="brassG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a1a08"/>
      <stop offset="45%"  stop-color="#ffd97a"/>
      <stop offset="55%"  stop-color="#e0b060"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </linearGradient>

    <!-- Arc glow -->
    <radialGradient id="arcGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#e6f4ff" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#6ec4ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6ec4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Shroud -->
    <linearGradient id="shroudG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6a5a78"/>
      <stop offset="55%"  stop-color="#3a2a48"/>
      <stop offset="100%" stop-color="#1a1024"/>
    </linearGradient>

    <!-- Slab -->
    <linearGradient id="slabG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#403040"/>
      <stop offset="100%" stop-color="#0f0a14"/>
    </linearGradient>

    <!-- Headline underline sweep -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6ec4ff" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#6ec4ff" stop-opacity="1"/>
      <stop offset="48%"  stop-color="#b088ff" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#e6d0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#b088ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="leftPanel">
      <rect x="0" y="0" width="360" height="200"/>
    </clipPath>
  </defs>

  <!-- ============ LEFT PANEL: GOTHIC LABORATORY ============ -->
  <g clip-path="url(#leftPanel)">
    <!-- Sky background -->
    <rect x="0" y="0" width="360" height="200" fill="url(#skyG)"/>

    <!-- Occasional distant lightning flash (whole-panel wash) -->
    <rect x="0" y="0" width="360" height="200" fill="#a4c8ff" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.10;0;0.05;0;0" keyTimes="0;0.3;0.35;0.36;0.4;0.42;0.46;1" dur="13s" repeatCount="indefinite"/>
    </rect>

    <!-- Distant hills silhouette -->
    <path d="M 0 178 Q 90 168 180 176 Q 270 183 360 178 L 360 200 L 0 200 Z" fill="#050208"/>

    <!-- Gothic castle turret on far left -->
    <g fill="#0a0614">
      <!-- Turret body -->
      <rect x="8" y="60" width="38" height="140"/>
      <!-- Battlements -->
      <rect x="8"  y="52" width="7" height="8"/>
      <rect x="19" y="52" width="7" height="8"/>
      <rect x="30" y="52" width="7" height="8"/>
      <rect x="41" y="52" width="5" height="8"/>
      <!-- Conical roof -->
      <path d="M 6 60 L 48 60 L 27 20 Z"/>
      <!-- Pennant pole -->
      <rect x="26.4" y="6" width="1.2" height="15"/>
      <!-- Pennant -->
      <path d="M 27.6 6 L 42 10 L 27.6 14 Z" fill="#3a1a2c" opacity="0.85"/>
    </g>

    <!-- Warm candle window in turret -->
    <rect x="21" y="94" width="12" height="16" rx="5" fill="#ffb85a" opacity="0.85">
      <animate attributeName="opacity" values="0.65;0.95;0.72;0.9;0.65" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="21" y="94" width="12" height="16" rx="5" fill="none" stroke="#0a0614" stroke-width="0.6"/>
    <line x1="27" y1="94" x2="27" y2="110" stroke="#0a0614" stroke-width="0.6"/>

    <!-- Lightning bolt in sky (upper mid-right of left panel) -->
    <g>
      <path d="M 268 6 L 256 52 L 274 52 L 258 108" fill="none" stroke="#b088ff" stroke-width="5" stroke-linejoin="miter" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.4;0;0.25;0;0" keyTimes="0;0.3;0.35;0.36;0.4;0.42;0.46;1" dur="13s" repeatCount="indefinite"/>
      </path>
      <path d="M 268 6 L 256 52 L 274 52 L 258 108" fill="none" stroke="#f0f4ff" stroke-width="1.6" stroke-linejoin="miter" opacity="0">
        <animate attributeName="opacity" values="0;0;0;1;0;0.6;0;0" keyTimes="0;0.3;0.35;0.36;0.4;0.42;0.46;1" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Stone laboratory floor line -->
    <rect x="0" y="184" width="360" height="16" fill="#0a0510"/>
    <line x1="0" y1="184" x2="360" y2="184" stroke="#2a1830" stroke-width="0.7" opacity="0.7"/>

    <!-- Slab -->
    <rect x="72" y="163" width="220" height="11" fill="url(#slabG)"/>
    <rect x="72" y="163" width="220" height="1.5" fill="#6a4870" opacity="0.5"/>
    <!-- Slab supports -->
    <rect x="78" y="174" width="10" height="10" fill="#1a1020"/>
    <rect x="276" y="174" width="10" height="10" fill="#1a1020"/>

    <!-- Shrouded body on slab -->
    <path d="M 90 163
             Q 92 154 108 150
             Q 130 146 165 148
             Q 205 146 240 149
             Q 265 148 273 153
             Q 278 158 280 163 Z"
          fill="url(#shroudG)"/>
    <!-- Fold lines -->
    <path d="M 108 156 Q 140 151 175 153 Q 220 151 255 155" fill="none" stroke="#2a1a34" stroke-width="0.5" opacity="0.7"/>
    <path d="M 118 160 Q 150 157 190 158 Q 230 157 260 160" fill="none" stroke="#2a1a34" stroke-width="0.4" opacity="0.6"/>
    <!-- Toe bumps -->
    <ellipse cx="278" cy="161" rx="4" ry="3" fill="#4a3858" opacity="0.7"/>
    <!-- Head/shoulder bumps -->
    <ellipse cx="102" cy="155" rx="12" ry="6" fill="#4a3858" opacity="0.65"/>

    <!-- Hand rising from shroud (center-right, palm-forward, fingers reaching up) -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0 0; 0 -3; 0 0" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(232, 148) rotate(-4)">
        <!-- Forearm emerging from shroud -->
        <path d="M -6 12 Q -5 4 -4 -2 L 6 -2 Q 7 4 6 12 Z" fill="#8a7a95"/>
        <!-- Palm -->
        <ellipse cx="1" cy="-5" rx="6" ry="5" fill="#8a7a95"/>
        <!-- Fingers (four) -->
        <path d="M -5 -7 Q -6 -14 -5 -18 Q -3 -20 -2 -18 Q -1 -14 -2 -7 Z" fill="#9a8aa5"/>
        <path d="M -1 -8 Q -1 -18 0 -22 Q 2 -24 3 -22 Q 4 -18 3 -8 Z" fill="#9a8aa5"/>
        <path d="M 3  -8 Q 4 -17 5 -21 Q 7 -23 8 -21 Q 8 -17 7 -8 Z" fill="#9a8aa5"/>
        <path d="M 7  -7 Q 8 -14 9 -17 Q 11 -19 12 -17 Q 12 -14 11 -7 Z" fill="#9a8aa5"/>
        <!-- Thumb -->
        <path d="M -6 -4 Q -10 -8 -11 -12 Q -10 -14 -8 -13 Q -5 -10 -4 -6 Z" fill="#9a8aa5"/>
        <!-- Highlight on fingertips (electric charge) -->
        <circle cx="-3" cy="-19" r="0.9" fill="#e6f4ff">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="2" cy="-23" r="1.0" fill="#e6f4ff">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="7" cy="-22" r="0.9" fill="#e6f4ff">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="11" cy="-18" r="0.8" fill="#e6f4ff">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Electrode rods -->
    <g>
      <!-- Left electrode base -->
      <rect x="140" y="158" width="16" height="6" fill="#3a2410"/>
      <rect x="139" y="164" width="18" height="2" fill="#1a0f04"/>
      <!-- Left rod -->
      <rect x="146" y="58" width="4" height="100" fill="url(#brassG)"/>
      <!-- Left bulb tip -->
      <circle cx="148" cy="56" r="4.5" fill="#8a6a30"/>
      <circle cx="148" cy="55" r="2.2" fill="#f0d888"/>
      <ellipse cx="147" cy="54" rx="0.9" ry="0.5" fill="#fff6d0"/>

      <!-- Right electrode base -->
      <rect x="204" y="158" width="16" height="6" fill="#3a2410"/>
      <rect x="203" y="164" width="18" height="2" fill="#1a0f04"/>
      <!-- Right rod -->
      <rect x="210" y="58" width="4" height="100" fill="url(#brassG)"/>
      <!-- Right bulb tip -->
      <circle cx="212" cy="56" r="4.5" fill="#8a6a30"/>
      <circle cx="212" cy="55" r="2.2" fill="#f0d888"/>
      <ellipse cx="211" cy="54" rx="0.9" ry="0.5" fill="#fff6d0"/>
    </g>

    <!-- Glow between electrodes at tips (arc corona) -->
    <ellipse cx="180" cy="60" rx="40" ry="26" fill="url(#arcGlow)">
      <animate attributeName="opacity" values="0.35;0.9;0.4;0.65;0.35" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Jacob's ladder arcs — several arcs rising between the rods, staggered -->
    <!-- Arc A -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0 155; 0 60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;1;0.7;0" keyTimes="0;0.15;0.5;0.85;1" dur="3s" repeatCount="indefinite"/>
      <path d="M 148 0 Q 160 -8 180 0 Q 200 8 212 0" fill="none" stroke="#6ec4ff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
      <path d="M 148 0 Q 160 -8 180 0 Q 200 8 212 0" fill="none" stroke="#e6f4ff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- Arc B (staggered 1s) -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0 155; 0 60" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;1;0.7;0" keyTimes="0;0.15;0.5;0.85;1" dur="3s" begin="1s" repeatCount="indefinite"/>
      <path d="M 148 0 Q 165 6 180 -1 Q 196 -8 212 0" fill="none" stroke="#a4d0ff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
      <path d="M 148 0 Q 165 6 180 -1 Q 196 -8 212 0" fill="none" stroke="#e6f4ff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- Arc C (staggered 2s) -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0 155; 0 60" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;1;0.7;0" keyTimes="0;0.15;0.5;0.85;1" dur="3s" begin="2s" repeatCount="indefinite"/>
      <path d="M 148 0 Q 158 4 180 -3 Q 202 4 212 0" fill="none" stroke="#6ec4ff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
      <path d="M 148 0 Q 158 4 180 -3 Q 202 4 212 0" fill="none" stroke="#e6f4ff" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Small spark particles between rods -->
    <g fill="#e6f4ff">
      <circle cx="170" cy="0" r="0.9">
        <animate attributeName="cy" values="150;58" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="168;185" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="0" r="0.7" fill="#a4d0ff">
        <animate attributeName="cy" values="150;58" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="192;172" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="0" r="0.8">
        <animate attributeName="cy" values="150;58" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="178;182" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Manuscript with quill at bottom-right corner of left panel -->
    <g transform="translate(320, 172) rotate(-8)">
      <rect x="-22" y="-11" width="42" height="24" fill="#e8d8b0"/>
      <rect x="-22" y="-11" width="42" height="24" fill="none" stroke="#8a6828" stroke-width="0.4" opacity="0.6"/>
      <line x1="-18" y1="-6" x2="15" y2="-6" stroke="#5a4028" stroke-width="0.35" opacity="0.85"/>
      <line x1="-18" y1="-2" x2="13" y2="-2" stroke="#5a4028" stroke-width="0.35" opacity="0.85"/>
      <line x1="-18" y1="2"  x2="16" y2="2"  stroke="#5a4028" stroke-width="0.35" opacity="0.85"/>
      <line x1="-18" y1="6"  x2="10" y2="6"  stroke="#5a4028" stroke-width="0.35" opacity="0.85"/>
      <!-- Quill -->
      <path d="M 18 -8 L 30 -22 L 24 -6 Z" fill="#c8b8d0"/>
      <path d="M 22 -14 L 26 -18 L 25 -13 Z" fill="#a89ab0"/>
      <line x1="24" y1="-6" x2="18" y2="0" stroke="#3a2a48" stroke-width="0.6"/>
    </g>
  </g>

  <!-- Seam -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ============ RIGHT TEXT PANEL ============ -->
  <rect x="360" y="0" width="440" height="200" fill="#0d1117"/>

  <!-- Right-edge accent bars -->
  <rect x="792" y="20" width="4" height="52" fill="#6ec4ff" opacity="0.85"/>
  <rect x="792" y="72" width="4" height="52" fill="#b088ff" opacity="0.85"/>
  <rect x="792" y="124" width="4" height="52" fill="#e6d0ff" opacity="0.85"/>

  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f0e6da" letter-spacing="1">
    AUGUST 30, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#b088ff">MARY SHELLEY</tspan><tspan fill="#f0e6da" opacity="0.78">&#160;·&#160;229 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;·&#160;SINCE 1797</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#e6d0ff" letter-spacing="1" opacity="0.95">
    FRANKENSTEIN · PROMETHEUS · GENEVA · DIODATI
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#8a94a8" letter-spacing="1" opacity="0.9">
    LIGHTNING · MANUSCRIPT · CASTLE · TRAVELER
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" font-style="italic" fill="#f0e6da" opacity="0.9">
    &#8220;the modern prometheus.&#8221;
  </text>
</svg>
