<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Day of Two Noons — 143rd Anniversary of Standard Railway Time (November 18, 1883) -->
<!-- about:
At exactly noon on Sunday, 18 November 1883, telegraph operators at the Naval Observatory in Washington sent a single signal down the wires of every major US and Canadian railroad, and across the continent every station clock was reset. Towns east of a new meridian nudged their hands forward, towns west dragged them back — in some places noon happened twice, in some it was skipped entirely. The day was remembered as "The Day of Two Noons." Until that morning there had been roughly three hundred local solar times in the United States, each pegged to its own courthouse sundial; a traveller between Chicago and Pittsburgh crossed six of them. The railroads could not run a schedule on it, so they simply agreed on four bands — Eastern, Central, Mountain, Pacific — and the rest of the country followed. One hundred and forty-three years later, every NTP packet, every UTC timestamp, every cron job inherits the same decision.

The scene is a frontier telegraph office at the moment of the signal. On the left, a brass-rimmed station clock holds twelve — the solid hands mark the new standard time while a pair of ghost hands drift behind them, the old local noon still fading out. Below the clock, a stylised US map carries four vertical dashed bands that pulse eastward to westward as the signal reaches each zone. Telegraph wires strung above spark dot-and-dash pips along their length. On the right, a cream NOVEMBER 18, 2026 headline sits over a double cream-and-brass bar, a cream DAY OF TWO NOONS · 143 YEARS subhead, an italic amber STANDARD RAILWAY TIME · 1883 tertiary, a dim EASTERN · CENTRAL · MOUNTAIN · PACIFIC roster, and a Georgia-italic caption at the base reading: When America first agreed what time it was.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for November 18, 2026 — 143rd anniversary of The Day of Two Noons, when US and Canadian railroads adopted Standard Railway Time on November 18, 1883. On the left, a brass-rimmed station clock holds twelve with solid hands for standard time and ghost hands drifting behind for the old local noon; below it a small US map carries four dashed time-zone bands that pulse eastward to westward. Telegraph wires strung above spark dot-and-dash pips. On the right, a cream NOVEMBER 18, 2026 headline sits over a double cream-and-brass bar, a cream DAY OF TWO NOONS · 143 YEARS subhead, an italic amber STANDARD RAILWAY TIME · 1883 tertiary, a dim EASTERN · CENTRAL · MOUNTAIN · PACIFIC roster, and a Georgia-italic caption at the base reading: When America first agreed what time it was.">
  <defs>
    <!-- Warm dark backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Brass rim of the station clock -->
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f0c868"/>
      <stop offset="0.5" stop-color="#d4a84a"/>
      <stop offset="1"   stop-color="#8a6a28"/>
    </linearGradient>

    <!-- Clock face (aged enamel) -->
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0"   stop-color="#f6ecd4"/>
      <stop offset="0.75" stop-color="#e6d5a8"/>
      <stop offset="1"   stop-color="#b89a60"/>
    </radialGradient>

    <!-- Reusable short-dash tick -->
    <g id="hour-tick"><rect x="-1.2" y="-58" width="2.4" height="8" fill="#2a1a0c"/></g>
    <g id="min-tick"><rect x="-0.5" y="-58" width="1" height="4" fill="#5a4418"/></g>

    <!-- Telegraph pip -->
    <circle id="pip" r="2.2" fill="#f6ecd4"/>

    <!-- Motion paths for telegraph pips along the wires -->
    <path id="wire1" d="M 20 22 L 420 22" fill="none"/>
    <path id="wire2" d="M 20 32 L 420 32" fill="none"/>
  </defs>

  <style>
    .headline  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 1.5px; }
    .sub       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 2.4px; }
    .tert      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 1.8px; font-style: italic; }
    .roster    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 2.6px; }
    .caption   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .roman     { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; }
    .stamp     { font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }

    /* Solid (standard-time) hands rotate about the clock centre */
    @keyframes handTick { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .hand-sec  { animation: handTick 13s steps(60, end) infinite; transform-origin: 140px 118px; transform-box: view-box; }
    .hand-min  { animation: handTick 61s linear infinite;         transform-origin: 140px 118px; transform-box: view-box; }
    .hand-hr   { animation: handTick 503s linear infinite;        transform-origin: 140px 118px; transform-box: view-box; }

    /* Ghost hands (old local noon) drift behind, pulsing out of phase */
    @keyframes ghostFade {
      0%, 100% { opacity: 0.0; }
      35%      { opacity: 0.55; }
      65%      { opacity: 0.0; }
    }
    .ghost-min { animation: ghostFade 7s ease-in-out infinite;        transform-origin: 140px 118px; transform-box: view-box; }
    .ghost-hr  { animation: ghostFade 7s ease-in-out 1.6s infinite;   transform-origin: 140px 118px; transform-box: view-box; }

    /* Zone bands pulse eastward->westward on an 11s cycle */
    @keyframes bandPulse {
      0%, 100% { opacity: 0.22; }
      50%      { opacity: 0.80; }
    }
    .zone-E { animation: bandPulse 11s ease-in-out  0.0s infinite; }
    .zone-C { animation: bandPulse 11s ease-in-out  1.4s infinite; }
    .zone-M { animation: bandPulse 11s ease-in-out  2.8s infinite; }
    .zone-P { animation: bandPulse 11s ease-in-out  4.2s infinite; }

    /* Soft pulse for text */
    @keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
    .fade-1 { animation: softPulse 13s ease-in-out infinite; }
    .fade-2 { animation: softPulse 13s ease-in-out 0.4s infinite; }
    .fade-3 { animation: softPulse 13s ease-in-out 0.8s infinite; }
    .fade-4 { animation: softPulse 13s ease-in-out 1.2s infinite; }
    .fade-5 { animation: softPulse 13s ease-in-out 1.6s infinite; }
    .fade-6 { animation: softPulse 13s ease-in-out 2.0s infinite; }

    /* Bar slide (reveal from left) */
    @keyframes barDraw { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
    .bar { transform-origin: left center; transform-box: fill-box; animation: barDraw 1.4s cubic-bezier(.3,.9,.2,1) 0.4s both; }

    /* Caption glimmer */
    @keyframes capGlim { 0%,100% { opacity: 0.80; } 50% { opacity: 1; } }
    .cap { animation: capGlim 13s ease-in-out infinite; }

    /* Dial tick fade */
    @keyframes dimFade { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    .dim { animation: dimFade 13s ease-in-out infinite; }
  </style>

  <!-- Backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- ============ TELEGRAPH WIRES (top) ============ -->
  <g opacity="0.55">
    <line x1="20" y1="22" x2="420" y2="22" stroke="#6a512a" stroke-width="0.6"/>
    <line x1="20" y1="32" x2="420" y2="32" stroke="#6a512a" stroke-width="0.6"/>
    <!-- poles -->
    <g fill="none" stroke="#6a512a" stroke-width="0.8">
      <line x1="40"  y1="12" x2="40"  y2="46"/>
      <line x1="32"  y1="22" x2="48"  y2="22"/>
      <line x1="170" y1="12" x2="170" y2="46"/>
      <line x1="162" y1="22" x2="178" y2="22"/>
      <line x1="300" y1="12" x2="300" y2="46"/>
      <line x1="292" y1="22" x2="308" y2="22"/>
    </g>
  </g>

  <!-- dot-and-dash pips travelling the wires -->
  <g>
    <use href="#pip">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#wire1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#pip">
      <animateMotion dur="7s" begin="1.2s" repeatCount="indefinite"><mpath href="#wire1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use href="#pip" opacity="0.7">
      <animateMotion dur="11s" begin="0.6s" repeatCount="indefinite"><mpath href="#wire2"/></animateMotion>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.05;0.95;1" dur="11s" begin="0.6s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ============ LEFT: STATION CLOCK ============ -->
  <!-- Outer brass rim -->
  <circle cx="140" cy="118" r="62" fill="url(#brass)" stroke="#2a1a0c" stroke-width="1.2"/>
  <!-- Inner shadow ring -->
  <circle cx="140" cy="118" r="55" fill="#2a1a0c" opacity="0.6"/>
  <!-- Enamel face -->
  <circle cx="140" cy="118" r="52" fill="url(#face)" stroke="#8a6a28" stroke-width="0.6"/>

  <!-- Tick marks -->
  <g transform="translate(140 118)" class="dim">
    <!-- 60 minute ticks -->
    <g>
      <use href="#min-tick" transform="rotate(0)"/>   <use href="#min-tick" transform="rotate(6)"/>
      <use href="#min-tick" transform="rotate(12)"/>  <use href="#min-tick" transform="rotate(18)"/>
      <use href="#min-tick" transform="rotate(24)"/>  <use href="#min-tick" transform="rotate(36)"/>
      <use href="#min-tick" transform="rotate(42)"/>  <use href="#min-tick" transform="rotate(48)"/>
      <use href="#min-tick" transform="rotate(54)"/>  <use href="#min-tick" transform="rotate(66)"/>
      <use href="#min-tick" transform="rotate(72)"/>  <use href="#min-tick" transform="rotate(78)"/>
      <use href="#min-tick" transform="rotate(84)"/>  <use href="#min-tick" transform="rotate(96)"/>
      <use href="#min-tick" transform="rotate(102)"/> <use href="#min-tick" transform="rotate(108)"/>
      <use href="#min-tick" transform="rotate(114)"/> <use href="#min-tick" transform="rotate(126)"/>
      <use href="#min-tick" transform="rotate(132)"/> <use href="#min-tick" transform="rotate(138)"/>
      <use href="#min-tick" transform="rotate(144)"/> <use href="#min-tick" transform="rotate(156)"/>
      <use href="#min-tick" transform="rotate(162)"/> <use href="#min-tick" transform="rotate(168)"/>
      <use href="#min-tick" transform="rotate(174)"/> <use href="#min-tick" transform="rotate(186)"/>
      <use href="#min-tick" transform="rotate(192)"/> <use href="#min-tick" transform="rotate(198)"/>
      <use href="#min-tick" transform="rotate(204)"/> <use href="#min-tick" transform="rotate(216)"/>
      <use href="#min-tick" transform="rotate(222)"/> <use href="#min-tick" transform="rotate(228)"/>
      <use href="#min-tick" transform="rotate(234)"/> <use href="#min-tick" transform="rotate(246)"/>
      <use href="#min-tick" transform="rotate(252)"/> <use href="#min-tick" transform="rotate(258)"/>
      <use href="#min-tick" transform="rotate(264)"/> <use href="#min-tick" transform="rotate(276)"/>
      <use href="#min-tick" transform="rotate(282)"/> <use href="#min-tick" transform="rotate(288)"/>
      <use href="#min-tick" transform="rotate(294)"/> <use href="#min-tick" transform="rotate(306)"/>
      <use href="#min-tick" transform="rotate(312)"/> <use href="#min-tick" transform="rotate(318)"/>
      <use href="#min-tick" transform="rotate(324)"/> <use href="#min-tick" transform="rotate(336)"/>
      <use href="#min-tick" transform="rotate(342)"/> <use href="#min-tick" transform="rotate(348)"/>
      <use href="#min-tick" transform="rotate(354)"/>
    </g>
    <!-- 12 hour ticks -->
    <g>
      <use href="#hour-tick" transform="rotate(0)"/>
      <use href="#hour-tick" transform="rotate(30)"/>
      <use href="#hour-tick" transform="rotate(60)"/>
      <use href="#hour-tick" transform="rotate(90)"/>
      <use href="#hour-tick" transform="rotate(120)"/>
      <use href="#hour-tick" transform="rotate(150)"/>
      <use href="#hour-tick" transform="rotate(180)"/>
      <use href="#hour-tick" transform="rotate(210)"/>
      <use href="#hour-tick" transform="rotate(240)"/>
      <use href="#hour-tick" transform="rotate(270)"/>
      <use href="#hour-tick" transform="rotate(300)"/>
      <use href="#hour-tick" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Roman numerals XII, III, VI, IX -->
  <g fill="#2a1a0c" text-anchor="middle">
    <text class="roman" x="140" y="76"  font-size="12">XII</text>
    <text class="roman" x="180" y="122" font-size="12">III</text>
    <text class="roman" x="140" y="166" font-size="12">VI</text>
    <text class="roman" x="100" y="122" font-size="12">IX</text>
  </g>

  <!-- Maker's mark -->
  <text x="140" y="138" text-anchor="middle" font-size="5.5" class="stamp" fill="#6a512a" opacity="0.85">NAVAL OBS · 1883</text>

  <!-- Ghost hands (old local noon) - behind the solid hands -->
  <g>
    <!-- ghost hour hand (pointing to ~11:42 position) -->
    <g class="ghost-hr">
      <rect x="138" y="80" width="4" height="40" fill="#8a6a28" transform="rotate(-9 140 118)"/>
    </g>
    <!-- ghost minute hand -->
    <g class="ghost-min">
      <rect x="139.3" y="62" width="1.4" height="58" fill="#8a6a28" transform="rotate(-18 140 118)"/>
    </g>
  </g>

  <!-- Solid standard-time hands pointing exactly at 12:00:00 at t=0, then ticking -->
  <g>
    <!-- hour hand -->
    <g class="hand-hr">
      <rect x="138" y="80" width="4" height="40" fill="#1a1008" rx="1"/>
    </g>
    <!-- minute hand -->
    <g class="hand-min">
      <rect x="139.3" y="62" width="1.4" height="58" fill="#1a1008"/>
    </g>
    <!-- second hand (red) -->
    <g class="hand-sec">
      <rect x="139.7" y="66" width="0.6" height="54" fill="#c23a2a"/>
      <circle cx="140" cy="132" r="4" fill="#c23a2a"/>
    </g>
  </g>

  <!-- Centre boss -->
  <circle cx="140" cy="118" r="3.2" fill="#1a1008" stroke="#f0c868" stroke-width="0.6"/>

  <!-- Clock caption below -->
  <text x="140" y="196" text-anchor="middle" font-size="7" class="stamp" fill="#9fd9ea" opacity="0.85">12:00 NOON · STANDARD</text>

  <!-- ============ TIME-ZONE BAND STRIP (right of clock, left of text) ============ -->
  <g transform="translate(220 72)">
    <!-- outline strip -->
    <rect x="0" y="0" width="190" height="88" rx="3" fill="#1a2230" stroke="#3a4a60" stroke-width="0.6"/>
    <!-- four vertical bands (E,C,M,P) -->
    <rect class="zone-E" x="6"   y="6" width="42" height="76" fill="#d4a84a"/>
    <rect class="zone-C" x="52"  y="6" width="42" height="76" fill="#e5b76a"/>
    <rect class="zone-M" x="98"  y="6" width="42" height="76" fill="#b89467"/>
    <rect class="zone-P" x="144" y="6" width="40" height="76" fill="#5fc3e0"/>

    <!-- zone initials -->
    <g text-anchor="middle" fill="#0d1117" font-size="18" class="roman" font-weight="800">
      <text x="27"  y="52">E</text>
      <text x="73"  y="52">C</text>
      <text x="119" y="52">M</text>
      <text x="164" y="52">P</text>
    </g>
    <!-- +offset labels under each -->
    <g text-anchor="middle" fill="#0d1117" font-size="6" class="stamp" opacity="0.8">
      <text x="27"  y="72">UTC−5</text>
      <text x="73"  y="72">UTC−6</text>
      <text x="119" y="72">UTC−7</text>
      <text x="164" y="72">UTC−8</text>
    </g>
    <!-- label header -->
    <text x="95" y="-4" text-anchor="middle" font-size="7" class="stamp" fill="#9fd9ea">FOUR BANDS · NOV 18, 1883</text>
  </g>

  <!-- ============ RIGHT TEXT COLUMN ============ -->
  <!-- vertical separator -->
  <line x1="420" y1="30" x2="420" y2="170" stroke="#2d3748" stroke-width="0.6" opacity="0.5"/>

  <!-- Headline: today's date -->
  <text x="440" y="60" font-size="26" class="headline fade-1" fill="#f6ecd4">NOVEMBER 18, 2026</text>

  <!-- Double bar beneath headline: cream + brass -->
  <g transform="translate(440,70)">
    <rect class="bar" x="0" y="0" width="300" height="3" fill="#f6ecd4"/>
    <rect class="bar" x="0" y="5" width="220" height="2" fill="#d4a84a"/>
  </g>

  <!-- Subhead -->
  <text x="440" y="97" font-size="14" class="sub fade-2" fill="#f6ecd4">DAY OF TWO NOONS · 143 YEARS</text>

  <!-- Tertiary italic -->
  <text x="440" y="117" font-size="10.5" class="tert fade-3" fill="#e5b76a">STANDARD RAILWAY TIME · 1883</text>

  <!-- Roster -->
  <text x="440" y="140" font-size="8" class="roster fade-4" fill="#7a8491">EASTERN · CENTRAL · MOUNTAIN · PACIFIC</text>

  <!-- Caption -->
  <text x="440" y="168" font-size="11" class="caption cap fade-5" fill="#c9d2dc">When America first agreed what time it was.</text>

  <!-- Faint station-master stamp, top right corner -->
  <g class="fade-6" transform="translate(690,30)">
    <rect x="0" y="0" width="86" height="30" fill="none" stroke="#d4a84a" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="43" y="12" font-size="6" class="stamp" fill="#e5b76a" text-anchor="middle" opacity="0.85">ADOPTED</text>
    <text x="43" y="22" font-size="7.5" class="stamp" fill="#e5b76a" text-anchor="middle" opacity="0.9">18 NOV 1883</text>
  </g>
</svg>
