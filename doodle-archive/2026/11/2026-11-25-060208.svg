<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: On the Origin of Species — 167th Anniversary (November 24, 1859) -->
<!-- about:
At nine in the morning on Thursday, 24 November 1859, John Murray of Albemarle Street in London released 1,250 copies of a 490-page green-cloth octavo titled On the Origin of Species by Means of Natural Selection. Every copy sold the same day. Charles Darwin, then fifty, was convalescing at a water-cure in Yorkshire and did not attend. The idea the book carried — that every living thing on earth descended from a single or a few common ancestors, and that the slow filter of differential survival did the sorting — had sat in his drawer for twenty-one years, since he first sketched a stubby branching tree in his B notebook above the words "I think." The 1859 edition contained one and only one diagram: a tree. One hundred and sixty-seven years later every phylogeny, every clade, every molecular dendrogram descends from that drawing.

The scene is Darwin's aged-paper notebook under warm lamplight. On the left, a sepia-ink tree branches outward from a common root, four finches with different beak silhouettes perch at its tips, and the words "I think" sit in a handwritten hand at the top with an arrow curling down to the root. On the right, a cream NOVEMBER 24, 2026 headline sits over a double cream-and-sepia bar, a cream ORIGIN OF SPECIES · 167 YEARS subhead, an italic amber CHARLES DARWIN · LONDON · 1859 tertiary, a dim BEAGLE · GALÁPAGOS · FINCHES · SELECTION · DESCENT roster, and a Georgia-italic caption at the base reading: By so simple a beginning.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for November 24, 2026 — 167th anniversary of the publication of Charles Darwin's On the Origin of Species on November 24, 1859. On the left, a sepia-ink phylogenetic tree branches outward from a common root on aged notebook paper, four finches with different beak silhouettes perched at the branch tips, and the words 'I think' written in a handwritten hand above the trunk with an arrow curling to the root. On the right, a cream NOVEMBER 24, 2026 headline sits over a double cream-and-sepia bar, a cream ORIGIN OF SPECIES · 167 YEARS subhead, an italic amber CHARLES DARWIN · LONDON · 1859 tertiary, a dim BEAGLE · GALÁPAGOS · FINCHES · SELECTION · DESCENT roster, and a Georgia-italic caption at the base reading: By so simple a beginning.">
  <defs>
    <!-- Warm dark backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Aged notebook paper -->
    <radialGradient id="paper" cx="0.4" cy="0.45" r="0.75">
      <stop offset="0"    stop-color="#f3e6c6"/>
      <stop offset="0.6"  stop-color="#e7d5a8"/>
      <stop offset="1"    stop-color="#9b7e46"/>
    </radialGradient>

    <!-- Paper edge shadow -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.1" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Lamp highlight -->
    <radialGradient id="lamp" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0"   stop-color="#fff2c4" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#fff2c4" stop-opacity="0"/>
    </radialGradient>

    <!-- Finch silhouette -->
    <g id="finch">
      <ellipse cx="0" cy="0" rx="4.6" ry="3" fill="#2a1a0c"/>
      <circle cx="3.6" cy="-1.8" r="2.4" fill="#2a1a0c"/>
      <path d="M -4.2 0 L -8 -1 L -7.6 0.8 Z" fill="#2a1a0c"/>
      <line x1="-0.6" y1="2.8" x2="-0.6" y2="4.6" stroke="#2a1a0c" stroke-width="0.7"/>
      <line x1="1.4"  y1="2.8" x2="1.4"  y2="4.6" stroke="#2a1a0c" stroke-width="0.7"/>
    </g>

    <!-- Four distinct beak shapes -->
    <g id="beakStout">  <path d="M 5.4 -1.8 L 9 -1.4 L 5.4 -0.2 Z" fill="#2a1a0c"/></g>
    <g id="beakSlender"><path d="M 5.4 -1.8 L 11 -2.0 L 5.4 -0.9 Z" fill="#2a1a0c"/></g>
    <g id="beakSharp">  <path d="M 5.4 -1.8 L 8.2 -2.8 L 5.4 -0.7 Z" fill="#2a1a0c"/></g>
    <g id="beakHook">   <path d="M 5.4 -1.8 L 8.6 -2.0 Q 9.0 -1.2 7.4 -0.4 L 5.4 -0.8 Z" fill="#2a1a0c"/></g>
  </defs>

  <style>
    .headline  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 1.5px; }
    .sub       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 2.4px; }
    .tert      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 1.8px; font-style: italic; }
    .roster    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 2.6px; }
    .caption   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .hand      { font-family: 'Bradley Hand', 'Snell Roundhand', 'Segoe Script', Georgia, cursive; font-style: italic; font-weight: 700; }
    .stamp     { font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }

    /* Ink deepening pulse on the tree — subtle life, no reveal trick */
    @keyframes inkPulse { 0%,100% { opacity: 0.92; } 50% { opacity: 1; } }
    .branch { stroke: #3a240e; stroke-linecap: round; fill: none; animation: inkPulse 13s ease-in-out infinite; }

    /* Finch perch-in (brief) then gentle sway */
    @keyframes perchIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    .finchIn1 { animation: perchIn 0.9s ease-out 0.4s both; }
    .finchIn2 { animation: perchIn 0.9s ease-out 0.8s both; }
    .finchIn3 { animation: perchIn 0.9s ease-out 1.2s both; }
    .finchIn4 { animation: perchIn 0.9s ease-out 1.6s both; }

    @keyframes sway { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-0.8px); } }
    .sway1 { animation: sway 7s  ease-in-out 2.0s infinite; transform-box: fill-box; }
    .sway2 { animation: sway 11s ease-in-out 2.4s infinite; transform-box: fill-box; }
    .sway3 { animation: sway 13s ease-in-out 2.8s infinite; transform-box: fill-box; }
    .sway4 { animation: sway 7s  ease-in-out 3.2s infinite; transform-box: fill-box; }

    /* "I think" subtle ink pulse */
    @keyframes handPulse { 0%,100% { opacity: 0.88; } 50% { opacity: 1; } }
    .ithink { animation: handPulse 11s ease-in-out infinite; }

    /* Text pulses */
    @keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
    .fade-1 { animation: softPulse 13s ease-in-out infinite; }
    .fade-2 { animation: softPulse 13s ease-in-out 0.4s infinite; }
    .fade-3 { animation: softPulse 13s ease-in-out 0.8s infinite; }
    .fade-4 { animation: softPulse 13s ease-in-out 1.2s infinite; }
    .fade-5 { animation: softPulse 13s ease-in-out 1.6s infinite; }
    .fade-6 { animation: softPulse 13s ease-in-out 2.0s infinite; }

    /* Bar slide */
    @keyframes barDraw { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
    .bar { transform-origin: left center; transform-box: fill-box; animation: barDraw 1.4s cubic-bezier(.3,.9,.2,1) 0.4s both; }

    /* Caption glimmer */
    @keyframes capGlim { 0%,100% { opacity: 0.80; } 50% { opacity: 1; } }
    .cap { animation: capGlim 13s ease-in-out infinite; }

    /* Floating ink motes drifting upward */
    @keyframes drift {
      0%   { transform: translate(0,0);   opacity: 0; }
      20%  { opacity: 0.6; }
      100% { transform: translate(10px,-24px); opacity: 0; }
    }
    .mote { fill: #7a5530; }
    .m1 { animation: drift 11s ease-in-out infinite; transform-box: fill-box; }
    .m2 { animation: drift 13s ease-in-out 2s infinite; transform-box: fill-box; }
    .m3 { animation: drift 7s  ease-in-out 4s infinite; transform-box: fill-box; }

    /* Lamp glow pulse */
    @keyframes lampPulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    .lamp { animation: lampPulse 11s ease-in-out infinite; }
  </style>

  <!-- Backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- ============ LEFT: NOTEBOOK PAGE ============ -->
  <g>
    <rect x="18" y="18" width="378" height="164" rx="3" fill="url(#paper)"/>
    <rect x="18" y="18" width="378" height="164" rx="3" fill="url(#edge)" opacity="0.55"/>
    <rect x="18" y="18" width="378" height="164" rx="3" fill="url(#lamp)" class="lamp"/>
    <g stroke="#9b7e46" stroke-width="0.25" opacity="0.35">
      <line x1="30" y1="50"  x2="384" y2="50"/>
      <line x1="30" y1="70"  x2="384" y2="70"/>
      <line x1="30" y1="90"  x2="384" y2="90"/>
      <line x1="30" y1="110" x2="384" y2="110"/>
      <line x1="30" y1="130" x2="384" y2="130"/>
      <line x1="30" y1="150" x2="384" y2="150"/>
      <line x1="30" y1="170" x2="384" y2="170"/>
    </g>
    <text x="376" y="30" text-anchor="end" font-size="5.5" class="stamp" fill="#6a4a1e" opacity="0.7">NOTEBOOK B · p. 36 · 1837</text>
  </g>

  <!-- "I think" — handwritten text + arrow -->
  <g class="ithink">
    <text x="42" y="54" font-size="19" class="hand" fill="#2a1a0c">I think</text>
    <!-- curling arrow down to the trunk -->
    <path d="M 70 62 Q 88 72 96 84" stroke="#2a1a0c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 96 84 L 91 82 M 96 84 L 93 79" stroke="#2a1a0c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ============ PHYLOGENETIC TREE (always visible) ============ -->
  <!-- Root trunk -->
  <path class="branch" stroke-width="2.4" d="M 100 160 L 100 100"/>

  <!-- First split -->
  <path class="branch" stroke-width="1.9" d="M 100 100 Q 112 88 134 78"/>
  <path class="branch" stroke-width="1.9" d="M 100 100 Q 114 100 144 102"/>

  <!-- Second splits (upper arm) -->
  <path class="branch" stroke-width="1.5" d="M 134 78 Q 158 64 186 54"/>
  <path class="branch" stroke-width="1.5" d="M 134 78 Q 158 80 188 82"/>

  <!-- Second splits (lower arm) -->
  <path class="branch" stroke-width="1.5" d="M 144 102 Q 170 110 196 118"/>
  <path class="branch" stroke-width="1.5" d="M 144 102 Q 170 128 196 144"/>

  <!-- Terminal twigs -->
  <path class="branch" stroke-width="1.2" d="M 186 54 Q 210 48 236 46"/>
  <path class="branch" stroke-width="1.2" d="M 188 82 Q 214 80 244 76"/>
  <path class="branch" stroke-width="1.2" d="M 196 118 Q 224 118 254 118"/>
  <path class="branch" stroke-width="1.2" d="M 196 144 Q 224 148 254 150"/>

  <!-- Tiny perpendicular tip marks -->
  <g stroke="#3a240e" stroke-width="1" opacity="0.8">
    <line x1="234" y1="42" x2="238" y2="50"/>
    <line x1="242" y1="72" x2="246" y2="80"/>
    <line x1="252" y1="114" x2="256" y2="122"/>
    <line x1="252" y1="146" x2="256" y2="154"/>
  </g>

  <!-- Finches perched at tips -->
  <g class="finchIn1">
    <g transform="translate(246,41)" class="sway1">
      <use href="#finch"/>
      <use href="#beakStout"/>
    </g>
  </g>
  <g class="finchIn2">
    <g transform="translate(254,71)" class="sway2">
      <use href="#finch"/>
      <use href="#beakSharp"/>
    </g>
  </g>
  <g class="finchIn3">
    <g transform="translate(264,113)" class="sway3">
      <use href="#finch"/>
      <use href="#beakSlender"/>
    </g>
  </g>
  <g class="finchIn4">
    <g transform="translate(264,145)" class="sway4">
      <use href="#finch"/>
      <use href="#beakHook"/>
    </g>
  </g>

  <!-- Micro species labels -->
  <g font-size="5" class="stamp" fill="#5a4418" opacity="0.8">
    <text x="278" y="43">A.</text>
    <text x="288" y="73">B.</text>
    <text x="298" y="115">C.</text>
    <text x="298" y="147">D.</text>
  </g>

  <!-- Notebook caption under the tree -->
  <text x="200" y="176" text-anchor="middle" font-size="6.5" class="caption" fill="#5a4418" opacity="0.85">Case must be that one generation then should have as many living as now.</text>

  <!-- Floating ink motes -->
  <g>
    <circle class="mote m1" cx="300" cy="150" r="0.9"/>
    <circle class="mote m2" cx="150" cy="40"  r="0.7"/>
    <circle class="mote m3" cx="220" cy="90"  r="0.8"/>
  </g>

  <!-- "C. Darwin" signature at corner -->
  <text x="376" y="178" text-anchor="end" font-size="9" class="hand" fill="#5a4418" opacity="0.9">C. Darwin</text>

  <!-- ============ VERTICAL SEPARATOR ============ -->
  <line x1="420" y1="30" x2="420" y2="170" stroke="#2d3748" stroke-width="0.6" opacity="0.5"/>

  <!-- ============ RIGHT TEXT COLUMN ============ -->
  <text x="440" y="60" font-size="26" class="headline fade-1" fill="#f3e6c6">NOVEMBER 24, 2026</text>

  <g transform="translate(440,70)">
    <rect class="bar" x="0" y="0" width="300" height="3" fill="#f3e6c6"/>
    <rect class="bar" x="0" y="5" width="220" height="2" fill="#b98a46"/>
  </g>

  <text x="440" y="97" font-size="14" class="sub fade-2" fill="#f3e6c6">ORIGIN OF SPECIES · 167 YEARS</text>

  <text x="440" y="117" font-size="10.5" class="tert fade-3" fill="#e5b76a">CHARLES DARWIN · LONDON · 1859</text>

  <text x="440" y="140" font-size="8" class="roster fade-4" fill="#7a8491">BEAGLE · GALÁPAGOS · FINCHES · SELECTION · DESCENT</text>

  <text x="440" y="168" font-size="11" class="caption cap fade-5" fill="#c9d2dc">By so simple a beginning.</text>

  <g class="fade-6" transform="translate(690,30)">
    <rect x="0" y="0" width="86" height="30" fill="none" stroke="#b98a46" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="43" y="12" font-size="6" class="stamp" fill="#e5b76a" text-anchor="middle" opacity="0.85">JOHN MURRAY</text>
    <text x="43" y="22" font-size="7.5" class="stamp" fill="#e5b76a" text-anchor="middle" opacity="0.9">24 NOV 1859</text>
  </g>
</svg>
