<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: World Octopus Day (October 8) -->
<!-- about:
World Octopus Day falls on 8 October — a holiday for celebrating what may be the strangest intelligence on the planet. An octopus has three hearts: two pump blood through its gills, one through the body. It has nine brains: one central and one small ganglion in each arm, each arm thinking partly on its own. Roughly five hundred million neurons are distributed across it, two-thirds of them out in the arms themselves. Its chromatophores can rewrite the colour and texture of its skin in under a second, despite the octopus being by every measurement we have colour-blind. We still do not know whether a creature so distributed experiences being one.

The scene is a slow-moving undersea tableau. In the dark water on the left, a coral-pink octopus hangs with its eight arms curling outward, rippling at prime cadences, its mantle pulsing through chromatophore colour shifts; small bubbles rise past it; pale light rays filter down from above. On the right, a cream OCTOBER 8, 2026 headline sits over a double wave bar, a coral WORLD OCTOPUS DAY subhead, an italic amber EIGHT ARMS · NINE BRAINS · THREE HEARTS tertiary, a dim CHROMATOPHORES · INK · JET · CAMOUFLAGE · PUZZLE roster, and a Georgia-italic 'Think like a cephalopod.' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for October 8, 2026 — World Octopus Day. A coral-pink octopus with eight slow-moving arms hangs in the dark water on the left, its mantle pulsing through chromatophore colour shifts, bubbles rising past it, pale light rays filtering down from above. On the right, a cream OCTOBER 8, 2026 headline sits over a double wave bar, a coral WORLD OCTOPUS DAY subhead, an italic amber EIGHT ARMS · NINE BRAINS · THREE HEARTS tertiary, a dim CHROMATOPHORES · INK · JET · CAMOUFLAGE · PUZZLE roster, and a Georgia-italic 'Think like a cephalopod.' caption at the base.">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a2e"/>
      <stop offset="0.5" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="mantleGrad" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb8d8"/>
      <stop offset="0.55" stop-color="#e6679a"/>
      <stop offset="1" stop-color="#7a2a58"/>
    </radialGradient>
    <linearGradient id="rayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ad0ff" stop-opacity="0.0"/>
      <stop offset="0.35" stop-color="#8ad0ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8ad0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Water background -->
  <rect width="800" height="200" fill="url(#water)"/>

  <!-- Caustic grid (very faint, undulating) -->
  <g opacity="0.07" stroke="#6aa0d0" stroke-width="0.4" fill="none">
    <path d="M 0 50 Q 200 55, 400 50 T 800 50"/>
    <path d="M 0 100 Q 200 95, 400 100 T 800 100"/>
    <path d="M 0 150 Q 200 155, 400 150 T 800 150"/>
  </g>

  <!-- Light rays from top -->
  <g>
    <polygon points="20,0 90,0 60,200 10,200" fill="url(#rayGrad)">
      <animate attributeName="opacity" values="0.35;0.75;0.35" dur="11s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="140,0 210,0 190,200 130,200" fill="url(#rayGrad)">
      <animate attributeName="opacity" values="0.25;0.6;0.25" dur="13s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="300,0 370,0 350,200 290,200" fill="url(#rayGrad)">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="17s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Bubbles rising -->
  <g>
    <circle cx="80" cy="200" r="3" fill="#8ad0ff" opacity="0" stroke="#c8e4ff" stroke-width="0.5">
      <animate attributeName="cy" values="200;-10" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.9;1" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="200" r="2" fill="#8ad0ff" opacity="0" stroke="#c8e4ff" stroke-width="0.5">
      <animate attributeName="cy" values="200;-10" dur="11s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.9;1" dur="11s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="200" r="4" fill="#8ad0ff" opacity="0" stroke="#c8e4ff" stroke-width="0.5">
      <animate attributeName="cy" values="200;-10" dur="17s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.1;0.9;1" dur="17s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="200" r="2.5" fill="#8ad0ff" opacity="0" stroke="#c8e4ff" stroke-width="0.5">
      <animate attributeName="cy" values="200;-10" dur="19s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.9;1" dur="19s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="200" r="2" fill="#8ad0ff" opacity="0" stroke="#c8e4ff" stroke-width="0.5">
      <animate attributeName="cy" values="200;-10" dur="23s" begin="-10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0" keyTimes="0;0.1;0.9;1" dur="23s" begin="-10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="200" r="3" fill="#8ad0ff" opacity="0" stroke="#c8e4ff" stroke-width="0.5">
      <animate attributeName="cy" values="200;-10" dur="29s" begin="-12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.1;0.9;1" dur="29s" begin="-12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =================== OCTOPUS =================== -->

  <!-- Rear tentacles (behind the mantle) -->
  <g stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 118 115;6 118 115;-6 118 115" dur="13s" repeatCount="indefinite"/>
      <path d="M 118 115 Q 92 92, 95 60 Q 97 48, 110 46" stroke="#7a2a58" stroke-width="9"/>
      <path d="M 118 115 Q 92 92, 95 60 Q 97 48, 110 46" stroke="#b84880" stroke-width="5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6 182 115;-6 182 115;6 182 115" dur="11s" repeatCount="indefinite"/>
      <path d="M 182 115 Q 208 92, 205 60 Q 203 48, 190 46" stroke="#7a2a58" stroke-width="9"/>
      <path d="M 182 115 Q 208 92, 205 60 Q 203 48, 190 46" stroke="#b84880" stroke-width="5"/>
    </g>
  </g>

  <!-- Mantle shadow -->
  <ellipse cx="150" cy="138" rx="58" ry="7" fill="#000" opacity="0.35" filter="url(#softBlur)"/>

  <!-- Mantle (teardrop) -->
  <path d="M 100 85
           C 100 28, 200 28, 200 85
           C 200 118, 178 130, 150 130
           C 122 130, 100 118, 100 85 Z"
        fill="url(#mantleGrad)" stroke="#5a1a40" stroke-width="1.0"/>

  <!-- Chromatophore highlight patch -->
  <ellipse cx="135" cy="60" rx="26" ry="18" fill="#ffd8ea" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Chromatophore specks -->
  <g>
    <circle cx="130" cy="100" r="2" fill="#ffe08a">
      <animate attributeName="fill" values="#ffe08a;#ff6b9d;#b86bff;#ffe08a" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="105" r="2" fill="#b86bff">
      <animate attributeName="fill" values="#b86bff;#ffe08a;#ff6b9d;#b86bff" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="155" cy="50" r="1.8" fill="#ff6b9d">
      <animate attributeName="fill" values="#ff6b9d;#b86bff;#ffe08a;#ff6b9d" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="70" r="1.5" fill="#ffe08a" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="75" r="1.5" fill="#b86bff" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="115" r="1.4" fill="#ffe08a" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="17s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Eyes -->
  <g>
    <ellipse cx="130" cy="90" rx="10" ry="9" fill="#f4ecd0"/>
    <ellipse cx="130" cy="90" rx="4" ry="2" fill="#0d1117">
      <animate attributeName="ry" values="2;0.3;2;2;2" keyTimes="0;0.03;0.06;0.5;1" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="127" cy="87" r="1.4" fill="#ffffff" opacity="0.9"/>

    <ellipse cx="170" cy="90" rx="10" ry="9" fill="#f4ecd0"/>
    <ellipse cx="170" cy="90" rx="4" ry="2" fill="#0d1117">
      <animate attributeName="ry" values="2;0.3;2;2;2" keyTimes="0;0.03;0.06;0.5;1" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="167" cy="87" r="1.4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Front tentacles (6 visible, framing the mantle) -->
  <g stroke-linecap="round" fill="none">
    <!-- T1 far left -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 107 118;7 107 118;-5 107 118" dur="11s" repeatCount="indefinite"/>
      <path d="M 107 118 Q 70 142, 55 170 Q 48 185, 40 190" stroke="#7a2a58" stroke-width="12"/>
      <path d="M 107 118 Q 70 142, 55 170 Q 48 185, 40 190" stroke="#e6679a" stroke-width="7"/>
      <circle cx="88" cy="132" r="1.6" fill="#ffd8ea"/>
      <circle cx="74" cy="148" r="1.6" fill="#ffd8ea"/>
      <circle cx="62" cy="164" r="1.4" fill="#ffd8ea"/>
      <circle cx="52" cy="180" r="1.2" fill="#ffd8ea"/>
    </g>
    <!-- T2 left down -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="5 122 127;-5 122 127;5 122 127" dur="13s" repeatCount="indefinite"/>
      <path d="M 122 127 Q 108 150, 100 170 Q 94 185, 85 192" stroke="#7a2a58" stroke-width="11"/>
      <path d="M 122 127 Q 108 150, 100 170 Q 94 185, 85 192" stroke="#e6679a" stroke-width="6"/>
      <circle cx="114" cy="142" r="1.5" fill="#ffd8ea"/>
      <circle cx="106" cy="158" r="1.5" fill="#ffd8ea"/>
      <circle cx="99" cy="174" r="1.3" fill="#ffd8ea"/>
      <circle cx="91" cy="188" r="1.2" fill="#ffd8ea"/>
    </g>
    <!-- T3 center-left -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 140 130;4 140 130;-3 140 130" dur="7s" repeatCount="indefinite"/>
      <path d="M 140 130 Q 134 150, 130 170 Q 127 185, 125 195" stroke="#7a2a58" stroke-width="10"/>
      <path d="M 140 130 Q 134 150, 130 170 Q 127 185, 125 195" stroke="#e6679a" stroke-width="5.5"/>
      <circle cx="137" cy="144" r="1.3" fill="#ffd8ea"/>
      <circle cx="133" cy="160" r="1.3" fill="#ffd8ea"/>
      <circle cx="130" cy="176" r="1.2" fill="#ffd8ea"/>
      <circle cx="126" cy="190" r="1.1" fill="#ffd8ea"/>
    </g>
    <!-- T4 center-right -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="3 160 130;-4 160 130;3 160 130" dur="7s" begin="-2s" repeatCount="indefinite"/>
      <path d="M 160 130 Q 166 150, 170 170 Q 173 185, 175 195" stroke="#7a2a58" stroke-width="10"/>
      <path d="M 160 130 Q 166 150, 170 170 Q 173 185, 175 195" stroke="#e6679a" stroke-width="5.5"/>
      <circle cx="163" cy="144" r="1.3" fill="#ffd8ea"/>
      <circle cx="167" cy="160" r="1.3" fill="#ffd8ea"/>
      <circle cx="170" cy="176" r="1.2" fill="#ffd8ea"/>
      <circle cx="174" cy="190" r="1.1" fill="#ffd8ea"/>
    </g>
    <!-- T5 right down -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 178 127;5 178 127;-5 178 127" dur="13s" begin="-4s" repeatCount="indefinite"/>
      <path d="M 178 127 Q 192 150, 200 170 Q 206 185, 215 192" stroke="#7a2a58" stroke-width="11"/>
      <path d="M 178 127 Q 192 150, 200 170 Q 206 185, 215 192" stroke="#e6679a" stroke-width="6"/>
      <circle cx="186" cy="142" r="1.5" fill="#ffd8ea"/>
      <circle cx="194" cy="158" r="1.5" fill="#ffd8ea"/>
      <circle cx="201" cy="174" r="1.3" fill="#ffd8ea"/>
      <circle cx="209" cy="188" r="1.2" fill="#ffd8ea"/>
    </g>
    <!-- T6 far right -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="5 193 118;-7 193 118;5 193 118" dur="11s" begin="-5s" repeatCount="indefinite"/>
      <path d="M 193 118 Q 230 142, 245 170 Q 252 185, 260 190" stroke="#7a2a58" stroke-width="12"/>
      <path d="M 193 118 Q 230 142, 245 170 Q 252 185, 260 190" stroke="#e6679a" stroke-width="7"/>
      <circle cx="212" cy="132" r="1.6" fill="#ffd8ea"/>
      <circle cx="226" cy="148" r="1.6" fill="#ffd8ea"/>
      <circle cx="238" cy="164" r="1.4" fill="#ffd8ea"/>
      <circle cx="248" cy="180" r="1.2" fill="#ffd8ea"/>
    </g>
  </g>

  <!-- Separator -->
  <line x1="340" y1="30" x2="340" y2="170" stroke="#1a2030" stroke-width="0.6" opacity="0.5"/>

  <!-- =================== TEXT STACK (right half) =================== -->

  <!-- Date headline -->
  <text x="580" y="58" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f4ecd0" letter-spacing="2.0">
    OCTOBER 8, 2026
  </text>

  <!-- Twin wave bar under headline -->
  <path d="M 410 74 Q 450 68, 490 74 T 570 74 T 650 74 T 730 74 T 770 74" fill="none" stroke="#e6679a" stroke-width="2.4" opacity="0.95"/>
  <path d="M 410 80 Q 450 74, 490 80 T 570 80 T 650 80 T 730 80 T 770 80" fill="none" stroke="#8ad0ff" stroke-width="1.3" opacity="0.65"/>

  <!-- Subhead -->
  <text x="580" y="104" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="800" letter-spacing="4.0" fill="#ff8ab8">
    WORLD OCTOPUS DAY
  </text>

  <!-- Tertiary italic -->
  <text x="580" y="124" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#c8a858" letter-spacing="0.6">
    EIGHT ARMS &#183; NINE BRAINS &#183; THREE HEARTS
  </text>

  <!-- Roster -->
  <text x="580" y="145" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.8" font-weight="700" fill="#8aa0c8" letter-spacing="2.4" opacity="0.95">
    CHROMATOPHORES &#183; INK &#183; JET &#183; CAMOUFLAGE &#183; PUZZLE
  </text>

  <!-- Caption -->
  <text x="580" y="188" text-anchor="middle"
        font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#c8d0e0" opacity="0.95">
    &#8220;Think like a cephalopod.&#8221;
  </text>

</svg>
