<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: International Day of the Girl Child (October 11) -->
<!-- about:
The United Nations adopted the International Day of the Girl Child on 19 December 2011 and first observed it on 11 October 2012, naming a single day each year to focus the world's attention on the particular barriers girls face — in education, in safety, in whether their voices are counted — and on the enormous shift that follows when those barriers come down. Girls make up roughly one in nine people alive, and about 122 million of school age are still out of school; the Day is partly a tally and partly a dare, an insistence that the next generation of leaders is already here and is being asked, year by year, what the world is prepared to do for them.

The scene is a dawn tableau. On the left, a girl stands in silhouette on a thin horizon with her arms lifted and a long braid trailing, framed by a warm magenta glow; above her, a loose constellation of stars connects into a quiet pattern — a bird in flight — as small sparks rise from her hands up into it. On the right, a cream OCTOBER 11, 2026 headline sits over a double magenta-and-rose bar, a pink INTERNATIONAL DAY OF THE GIRL subhead, an italic amber UN · SINCE 2012 tertiary, a dim VOICE · EDUCATION · RIGHTS · POWER · FUTURE roster, and a Georgia-italic 'Her story, her future.' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for October 11, 2026 — International Day of the Girl Child. On the left, a girl stands in silhouette with arms raised and a long braid, haloed by a warm magenta dawn glow; above her a constellation of stars connects into the shape of a bird in flight while small sparks rise from her hands into it. On the right, a cream OCTOBER 11, 2026 headline sits over a double magenta-and-rose bar, a pink INTERNATIONAL DAY OF THE GIRL subhead, an italic amber UN · SINCE 2012 tertiary, a dim VOICE · EDUCATION · RIGHTS · POWER · FUTURE roster, and a Georgia-italic 'Her story, her future.' caption at the base.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#09060e"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.22" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#f06a9a" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#a4408a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd0e2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd0e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figureFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a2a"/>
      <stop offset="1" stop-color="#0e0a14"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb0ce" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#ffb0ce" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6d0" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffe6d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c0" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff4c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Warm dawn glow -->
  <rect width="800" height="200" fill="url(#dawn)">
    <animate attributeName="opacity" values="0.75;1;0.82;1;0.75" dur="17s" repeatCount="indefinite"/>
  </rect>

  <!-- Faint horizon -->
  <line x1="0" y1="178" x2="800" y2="178" stroke="#2a1830" stroke-width="0.6" opacity="0.55"/>
  <line x1="0" y1="183" x2="800" y2="183" stroke="#3a1e3c" stroke-width="0.4" opacity="0.4"/>

  <!-- Soft halo behind the figure -->
  <ellipse cx="150" cy="118" rx="118" ry="88" fill="url(#halo)">
    <animate attributeName="opacity" values="0.55;0.95;0.65;0.95;0.55" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- =================== CONSTELLATION (bird in flight) =================== -->
  <g>
    <!-- Connecting lines (bird silhouette made of stars) -->
    <g stroke="#f8c0d8" stroke-width="0.5" fill="none" opacity="0.45">
      <!-- left wing: tip -> shoulder -->
      <line x1="54" y1="40" x2="100" y2="54"/>
      <line x1="100" y1="54" x2="140" y2="46"/>
      <!-- shoulder -> body -> tail -->
      <line x1="140" y1="46" x2="172" y2="52"/>
      <line x1="172" y1="52" x2="210" y2="60"/>
      <!-- body -> right wing -->
      <line x1="172" y1="52" x2="212" y2="40"/>
      <line x1="212" y1="40" x2="248" y2="30"/>
      <!-- head -->
      <line x1="210" y1="60" x2="236" y2="66"/>
    </g>

    <!-- Stars at vertices -->
    <g>
      <circle cx="54" cy="40" r="2.2" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.6;1;0.7;1;0.6" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="54" r="1.8" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.5;1;0.6;1;0.5" dur="11s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="46" r="2.4" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.6;1;0.7;1;0.6" dur="13s" begin="-4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="172" cy="52" r="2.8" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.65;1;0.75;1;0.65" dur="7s" begin="-1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="60" r="2.0" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.5;1;0.6;1;0.5" dur="11s" begin="-5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="236" cy="66" r="1.6" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.5;0.95;0.6;0.95;0.5" dur="13s" begin="-6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="212" cy="40" r="1.8" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.55;1;0.65;1;0.55" dur="11s" begin="-3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="248" cy="30" r="2.6" fill="url(#starGlow)">
        <animate attributeName="opacity" values="0.6;1;0.7;1;0.6" dur="7s" begin="-3s" repeatCount="indefinite"/>
      </circle>

      <!-- Scattered small stars (field) -->
      <circle cx="30" cy="26" r="0.9" fill="#ffe6d0" opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.9;0.4;0.9;0.3" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="78" cy="22" r="0.8" fill="#f8c0d8" opacity="0.65">
        <animate attributeName="opacity" values="0.3;0.85;0.4;0.85;0.3" dur="11s" begin="-4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="126" cy="28" r="0.7" fill="#ffe6d0" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.4;0.8;0.3" dur="17s" begin="-7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="22" r="0.8" fill="#f8c0d8" opacity="0.65">
        <animate attributeName="opacity" values="0.3;0.85;0.4;0.85;0.3" dur="13s" begin="-5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="270" cy="52" r="0.9" fill="#ffe6d0" opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.9;0.4;0.9;0.3" dur="11s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="296" cy="78" r="0.7" fill="#f8c0d8" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.4;0.8;0.3" dur="17s" begin="-9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="312" cy="30" r="0.8" fill="#ffe6d0" opacity="0.65">
        <animate attributeName="opacity" values="0.3;0.85;0.4;0.85;0.3" dur="13s" begin="-6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Slow gentle sway on the whole bird -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -1.5; 0 0; 0 1.5; 0 0" dur="23s" repeatCount="indefinite"/>
  </g>

  <!-- =================== FIGURE (girl silhouette) =================== -->
  <g>
    <!-- Subtle breath -->
    <animateTransform attributeName="transform" type="scale"
                      values="1 1;1 1.01;1 1" additive="sum" dur="11s" repeatCount="indefinite"/>

    <!-- Dress / skirt: flaring triangle from waist to horizon -->
    <path d="M 148 118 L 168 118 L 198 178 L 118 178 Z"
          fill="url(#figureFill)" stroke="#f8c0d8" stroke-width="0.7" opacity="0.98"/>
    <!-- Hem shadow -->
    <path d="M 118 178 Q 158 170, 198 178" fill="none" stroke="#2a1a2a" stroke-width="0.6" opacity="0.9"/>

    <!-- Torso: narrow waist, soft shoulders -->
    <path d="M 148 118
             L 148 92
             Q 146 86, 144 80
             L 172 80
             Q 170 86, 168 92
             L 168 118 Z"
          fill="url(#figureFill)" stroke="#f8c0d8" stroke-width="0.7" opacity="0.98"/>

    <!-- Arms raised in a graceful V -->
    <!-- Left arm: shoulder (144,80) curves up and out to fingertip (108,54) -->
    <path d="M 146 82
             Q 134 70, 122 60
             Q 114 54, 110 54
             Q 106 54, 106 58
             Q 110 62, 118 66
             Q 128 72, 140 84 Z"
          fill="url(#figureFill)" stroke="#f8c0d8" stroke-width="0.7" opacity="0.98"/>
    <!-- Right arm: shoulder (172,80) curves up and out to fingertip (208,54) -->
    <path d="M 170 82
             Q 182 70, 194 60
             Q 202 54, 206 54
             Q 210 54, 210 58
             Q 206 62, 198 66
             Q 188 72, 176 84 Z"
          fill="url(#figureFill)" stroke="#f8c0d8" stroke-width="0.7" opacity="0.98"/>

    <!-- Head: round, slight oval -->
    <ellipse cx="158" cy="66" rx="11" ry="12"
             fill="url(#figureFill)" stroke="#f8c0d8" stroke-width="0.7" opacity="0.98"/>

    <!-- Long braid: trailing behind the figure down the left side -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-1.5 148 72; 1.5 148 72; -1.5 148 72"
                        dur="13s" repeatCount="indefinite"/>
      <path d="M 148 72 Q 136 92, 134 118 Q 134 142, 140 164"
            fill="none" stroke="#3a1e2e" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
      <path d="M 148 72 Q 136 92, 134 118 Q 134 142, 140 164"
            fill="none" stroke="#6a3a4e" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
      <!-- Braid ties / segments -->
      <ellipse cx="138" cy="96" rx="3.6" ry="1.6" fill="#2a1420" opacity="0.95"/>
      <ellipse cx="134" cy="124" rx="3.6" ry="1.6" fill="#2a1420" opacity="0.95"/>
      <ellipse cx="138" cy="156" rx="3.4" ry="1.6" fill="#2a1420" opacity="0.95"/>
      <!-- Tiny ribbon at the end -->
      <path d="M 136 164 L 132 170 L 140 170 Z" fill="#f06a9a" opacity="0.9"/>
    </g>

    <!-- Rim light along the figure's right contour (dawn source) -->
    <path d="M 169 54 Q 172 60, 169 76 L 172 80 L 170 92 L 170 118 L 198 176"
          fill="none" stroke="url(#rimLight)" stroke-width="1.1" opacity="0.9"/>
    <path d="M 194 60 Q 204 56, 208 58" fill="none" stroke="#ffb0ce" stroke-width="0.9" opacity="0.7"/>

    <!-- Small glow at each raised fingertip -->
    <circle cx="108" cy="56" r="2.8" fill="url(#sparkGlow)">
      <animate attributeName="r" values="2.4;3.6;2.4" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="208" cy="56" r="2.8" fill="url(#sparkGlow)">
      <animate attributeName="r" values="2.4;3.6;2.4" dur="7s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="-3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =================== RISING SPARKS (from hands up to the stars) =================== -->
  <g fill="url(#sparkGlow)">
    <circle cx="108" cy="54" r="1.3">
      <animate attributeName="cy" values="54;28" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="108;104;108" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.8;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="54" r="1.0">
      <animate attributeName="cy" values="54;22" dur="13s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="110;116;110" dur="13s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.2;0.8;1" dur="13s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="208" cy="54" r="1.3">
      <animate attributeName="cy" values="54;26" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="208;212;208" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.2;0.8;1" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="206" cy="56" r="1.0">
      <animate attributeName="cy" values="56;20" dur="17s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="206;200;206" dur="17s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.2;0.8;1" dur="17s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="88" r="0.9">
      <animate attributeName="cy" values="88;24" dur="19s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.15;0.85;1" dur="19s" begin="-7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Separator -->
  <line x1="340" y1="30" x2="340" y2="170" stroke="#2a1830" stroke-width="0.6" opacity="0.5"/>

  <!-- =================== TEXT STACK (right half) =================== -->

  <!-- Date headline -->
  <text x="580" y="58" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f8e8d8" letter-spacing="2.0">
    OCTOBER 11, 2026
  </text>

  <!-- Twin bar under headline -->
  <path d="M 410 74 Q 450 68, 490 74 T 570 74 T 650 74 T 730 74 T 770 74" fill="none" stroke="#f06a9a" stroke-width="2.4" opacity="0.95"/>
  <path d="M 410 80 Q 450 74, 490 80 T 570 80 T 650 80 T 730 80 T 770 80" fill="none" stroke="#c870d8" stroke-width="1.3" opacity="0.7"/>

  <!-- Subhead -->
  <text x="580" y="104" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="800" letter-spacing="3.0" fill="#f6a0c4">
    INTERNATIONAL DAY OF THE GIRL
  </text>

  <!-- Tertiary italic -->
  <text x="580" y="124" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#d4a858" letter-spacing="0.6">
    UN &#183; SINCE 2012
  </text>

  <!-- Roster -->
  <text x="580" y="145" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.8" font-weight="700" fill="#a890b8" letter-spacing="2.4" opacity="0.95">
    VOICE &#183; EDUCATION &#183; RIGHTS &#183; POWER &#183; FUTURE
  </text>

  <!-- Caption -->
  <text x="580" y="188" text-anchor="middle"
        font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#f0d8e4" opacity="0.95">
    &#8220;Her story, her future.&#8221;
  </text>
</svg>
