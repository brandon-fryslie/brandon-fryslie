<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: NASA — 68 Years (October 1, 1958) -->
<!-- about:
On 1 October 1958, the National Aeronautics and Space Administration opened its doors in Washington, taking over from the forty-three-year-old National Advisory Committee for Aeronautics. The agency was less than a year old as an idea — Sputnik had crossed the sky in October 1957, Explorer 1 in January 1958, and in July President Eisenhower signed the Space Act — but on day one it absorbed NACA's 8,000 engineers, five laboratories, and a hundred-some-million dollar budget, and inherited the Vanguard, Pioneer, and Mercury programmes already in flight. Sixty-eight years later, every US human spaceflight, every Mars rover, every great space telescope from Hubble to Webb carries that same meatball on its flank.

The scene is a widescreen view out past low Earth orbit. On the left a cratered Moon hangs in a dark starfield with a small satellite tracing a slow orbit around it. On the right a slim white rocket climbs away from a small pad on the Earth's curved horizon, flame flickering, a thin dashed ascent trail curling up behind it. Above the horizon, a large cream OCTOBER 1, 2026 headline sits over a red NASA · 68 YEARS subhead, an italic amber WASHINGTON · OCTOBER 1, 1958 tertiary, a dim MERCURY · GEMINI · APOLLO · SHUTTLE · ARTEMIS roster, and a Georgia-italic 'for the benefit of all' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for October 1, 2026 — the 68th anniversary of NASA opening its doors in Washington on October 1, 1958. On the left, a cratered Moon hangs in a dark starfield with a small satellite tracing a slow orbit around it. On the right, a slim white rocket climbs from a launch pad on the Earth's curved horizon, with a flickering red-orange-yellow exhaust plume and a dashed ascent trail curling up behind it. Above the horizon, a large cream OCTOBER 1, 2026 headline underlined by a red-white-blue sweep, a red NASA · 68 YEARS subhead, an italic amber WASHINGTON · OCTOBER 1, 1958 tertiary, a dim MERCURY · GEMINI · APOLLO · SHUTTLE · ARTEMIS roster, and a Georgia-italic 'for the benefit of all' caption at the base.">
  <defs>
    <radialGradient id="skyGrad" cx="0.5" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="0.6" stop-color="#060a18"/>
      <stop offset="1" stop-color="#02040c"/>
    </radialGradient>

    <radialGradient id="moonGrad" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0"    stop-color="#f4ecd8"/>
      <stop offset="0.55" stop-color="#c8bca0"/>
      <stop offset="0.9"  stop-color="#403828"/>
      <stop offset="1"    stop-color="#1a1510"/>
    </radialGradient>

    <radialGradient id="earthGrad" cx="0.5" cy="0" r="1">
      <stop offset="0"    stop-color="#2860a8"/>
      <stop offset="0.4"  stop-color="#1a4078"/>
      <stop offset="1"    stop-color="#060a18"/>
    </radialGradient>

    <linearGradient id="rimGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a0e0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#60a0e0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#c82828"/>
      <stop offset="0.5"  stop-color="#f0e8d0"/>
      <stop offset="1"    stop-color="#4080c8"/>
    </linearGradient>

    <linearGradient id="rocketBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8088a0"/>
      <stop offset="0.4"  stop-color="#f4f8fc"/>
      <stop offset="0.7"  stop-color="#d0d4d8"/>
      <stop offset="1"    stop-color="#50585e"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#fcffd0"/>
      <stop offset="0.3"  stop-color="#ffc040"/>
      <stop offset="0.65" stop-color="#f06020"/>
      <stop offset="1"    stop-color="#601008" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="plumeGlow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0"   stop-color="#ffe098" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f06020" stop-opacity="0.45"/>
      <stop offset="1"   stop-color="#601008" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND SKY ================= -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>

  <!-- Faint static star field -->
  <g fill="#f0f0ff" opacity="0.42">
    <circle cx="30"  cy="18"  r="0.5"/>
    <circle cx="78"  cy="38"  r="0.6"/>
    <circle cx="150" cy="12"  r="0.5"/>
    <circle cx="215" cy="30"  r="0.7"/>
    <circle cx="268" cy="18"  r="0.5"/>
    <circle cx="330" cy="46"  r="0.6"/>
    <circle cx="390" cy="20"  r="0.5"/>
    <circle cx="460" cy="40"  r="0.6"/>
    <circle cx="520" cy="14"  r="0.5"/>
    <circle cx="582" cy="26"  r="0.7"/>
    <circle cx="640" cy="48"  r="0.5"/>
    <circle cx="705" cy="22"  r="0.6"/>
    <circle cx="760" cy="42"  r="0.5"/>
    <circle cx="52"  cy="76"  r="0.5"/>
    <circle cx="190" cy="118" r="0.5"/>
    <circle cx="300" cy="128" r="0.6"/>
    <circle cx="446" cy="134" r="0.5"/>
    <circle cx="560" cy="124" r="0.5"/>
    <circle cx="770" cy="106" r="0.6"/>
  </g>

  <!-- Twinkling stars -->
  <g fill="#ffffff">
    <circle cx="110" cy="24" r="1.1">
      <animate attributeName="opacity" values="0.3;1;0.5;1;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="245" cy="52" r="1.0">
      <animate attributeName="opacity" values="1;0.2;0.9;0.4;1" dur="11s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="368" cy="30" r="1.2">
      <animate attributeName="opacity" values="0.4;1;0.3;0.9;0.4" dur="13s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="498" cy="36" r="1.0">
      <animate attributeName="opacity" values="0.6;0.2;1;0.4;0.6" dur="7s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="612" cy="18" r="1.1">
      <animate attributeName="opacity" values="0.3;1;0.4;0.9;0.3" dur="11s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="722" cy="54" r="1.0">
      <animate attributeName="opacity" values="1;0.3;0.8;0.3;1" dur="13s" begin="4.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="110" r="0.9">
      <animate attributeName="opacity" values="0.4;1;0.3;0.8;0.4" dur="7s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="128" r="1.0">
      <animate attributeName="opacity" values="0.3;0.9;0.4;1;0.3" dur="11s" begin="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= MOON (left) ================= -->
  <g transform="translate(90 120)">
    <!-- Soft outer glow -->
    <circle r="40" fill="#f4ecd8" opacity="0.06"/>
    <circle r="34" fill="#f4ecd8" opacity="0.09"/>
    <!-- Moon disc -->
    <circle r="30" fill="url(#moonGrad)"/>
    <!-- Craters -->
    <g fill="#8c7f68" opacity="0.70">
      <circle cx="-12" cy="-8"  r="3.8"/>
      <circle cx="-15" cy="7"   r="2.8"/>
      <circle cx="5"   cy="-14" r="2.6"/>
      <circle cx="9"   cy="3"   r="4.2"/>
      <circle cx="-3"  cy="12"  r="3.0"/>
      <circle cx="17"  cy="-4"  r="2.2"/>
      <circle cx="-5"  cy="-1"  r="1.7"/>
      <circle cx="13"  cy="15"  r="2.0"/>
      <circle cx="-19" cy="-2"  r="1.8"/>
    </g>
    <g fill="#f4ecd8" opacity="0.35">
      <circle cx="-11" cy="-9"  r="1.6"/>
      <circle cx="8"   cy="2"   r="2.0"/>
      <circle cx="4"   cy="-15" r="1.1"/>
    </g>
    <!-- Terminator shadow (soft right side) -->
    <circle r="30" fill="#060a18" opacity="0.32" transform="translate(8 0)"/>
    <!-- Orbit ring (faint, static) -->
    <ellipse cx="0" cy="0" rx="48" ry="20" fill="none" stroke="#607088" stroke-width="0.4" stroke-dasharray="2 3" opacity="0.4"/>
    <!-- Satellite tracing the orbit -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="17s" repeatCount="indefinite"/>
      <g transform="translate(48 0)">
        <rect x="-1.2" y="-0.9" width="2.4" height="1.8" fill="#d8dce0" stroke="#30384a" stroke-width="0.25"/>
        <rect x="-4" y="-0.4" width="2.4" height="0.8" fill="#4080c0"/>
        <rect x="1.6" y="-0.4" width="2.4" height="0.8" fill="#4080c0"/>
      </g>
    </g>
    <!-- Label -->
    <text x="0" y="54" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.4" font-weight="700" fill="#8098b8" letter-spacing="2.2">THE MOON</text>
  </g>

  <!-- ================= EARTH CURVE (bottom) ================= -->
  <path d="M -40 230 Q 400 158 840 230 Z" fill="url(#earthGrad)"/>
  <!-- Rim glow -->
  <path d="M -40 230 Q 400 158 840 230" fill="none" stroke="url(#rimGlow)" stroke-width="2.4" opacity="0.9"/>
  <!-- Atmosphere highlight -->
  <path d="M 80 192 Q 400 168 720 192" fill="none" stroke="#80b8f0" stroke-width="0.6" opacity="0.35"/>

  <!-- ================= ROCKET + LAUNCH PAD (right) ================= -->

  <!-- Launch pad -->
  <g transform="translate(680 174)">
    <rect x="-16" y="0" width="32" height="3" fill="#20283a"/>
    <rect x="-12" y="-5" width="4" height="5" fill="#30384a"/>
    <rect x="8"   y="-5" width="4" height="5" fill="#30384a"/>
    <!-- Gantry tower lines -->
    <line x1="-14" y1="-5" x2="-14" y2="-28" stroke="#404a60" stroke-width="0.8"/>
    <line x1="-14" y1="-14" x2="-6" y2="-14" stroke="#404a60" stroke-width="0.6"/>
    <line x1="-14" y1="-22" x2="-6" y2="-22" stroke="#404a60" stroke-width="0.6"/>
  </g>

  <!-- Ascent trail: dashed curve rising from the pad up and leftward -->
  <path d="M 680 168 Q 672 130 650 80 T 580 20"
        fill="none" stroke="#d8e0f0" stroke-width="0.9"
        stroke-dasharray="3 4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-70" dur="11s" repeatCount="indefinite"/>
  </path>

  <!-- Rocket group — animated bob (hovering launch moment). Outer group holds the base position so the static render is correct; inner group does the bob. -->
  <g transform="translate(680 110)">
   <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -8; 0 0" dur="13s" repeatCount="indefinite"/>

    <!-- Exhaust plume (behind body) -->
    <!-- Outer plume glow -->
    <ellipse cx="0" cy="78" rx="16" ry="30" fill="url(#plumeGlow)" filter="url(#softGlow)">
      <animate attributeName="ry" values="30;40;26;36;30" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="16;19;14;17;16" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Core flame (teardrop) -->
    <path d="M -7 50 Q -8 72 0 92 Q 8 72 7 50 Z" fill="url(#flameGrad)">
      <animate attributeName="d"
               values="M -7 50 Q -8 72 0 92 Q 8 72 7 50 Z;
                       M -8 50 Q -10 78 0 102 Q 10 78 8 50 Z;
                       M -6 50 Q -7 68 0 86 Q 7 68 6 50 Z;
                       M -8.5 50 Q -10 74 0 96 Q 10 74 8.5 50 Z;
                       M -7 50 Q -8 72 0 92 Q 8 72 7 50 Z"
               dur="0.6s" repeatCount="indefinite"/>
    </path>
    <!-- Inner hot core -->
    <path d="M -3 50 Q -3.4 64 0 78 Q 3.4 64 3 50 Z" fill="#fffce0" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.6;1;0.75;0.95" dur="0.4s" repeatCount="indefinite"/>
    </path>
    <!-- Smoke puffs -->
    <circle cx="-9" cy="96" r="3" fill="#30384a" opacity="0.55">
      <animate attributeName="cy" values="80;130;80" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;8;2" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="100" r="3" fill="#30384a" opacity="0.5">
      <animate attributeName="cy" values="82;138;82" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;9;2" dur="2.9s" begin="0.7s" repeatCount="indefinite"/>
    </circle>

    <!-- Rocket body (upright). Body spans y=-10 (nose tip) to y=50 (engine bell). -->
    <!-- Fins -->
    <polygon points="-11,48 -6,32 -6,48" fill="#b8182c"/>
    <polygon points="11,48  6,32  6,48" fill="#b8182c"/>
    <!-- Engine bell -->
    <polygon points="-5,46 5,46 7,52 -7,52" fill="#60686e" stroke="#20283a" stroke-width="0.4"/>
    <!-- Main stage -->
    <rect x="-6" y="0" width="12" height="46" rx="0.8" fill="url(#rocketBody)" stroke="#30384a" stroke-width="0.5"/>
    <!-- Red stripe band -->
    <rect x="-6" y="12" width="12" height="3.0" fill="#b8182c"/>
    <!-- USA letters -->
    <text x="0" y="24" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="4.4" font-weight="800" fill="#1a2440" letter-spacing="0.6">USA</text>
    <!-- Window -->
    <circle cx="0" cy="34" r="1.6" fill="#60a0e0" stroke="#30384a" stroke-width="0.3"/>
    <!-- Nose cone -->
    <polygon points="-6,0 0,-14 6,0" fill="#f0f4f8" stroke="#30384a" stroke-width="0.4"/>
    <!-- Nose tip -->
    <circle cx="0" cy="-14" r="1.0" fill="#b8182c"/>
   </g>
  </g>

  <!-- Launch pad label -->
  <text x="680" y="192" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.0" font-weight="700" fill="#8098b8" letter-spacing="1.8">LC-39A</text>

  <!-- ================= TEXT STACK ================= -->

  <!-- Date headline -->
  <text x="400" y="42" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f0e8d0" letter-spacing="2.0">
    OCTOBER 1, 2026
  </text>

  <!-- Underline sweep (red-white-blue) -->
  <line x1="248" y1="54" x2="552" y2="54" stroke="url(#underlineGrad)" stroke-width="2.6" stroke-linecap="round">
    <animate attributeName="stroke-dasharray"
             values="0 320;220 100;320 0;220 100;0 320"
             keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
  </line>

  <!-- Subhead: NASA · 68 YEARS -->
  <text x="400" y="74" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="800" letter-spacing="3.0" xml:space="preserve">
    <tspan fill="#e03028">NASA  </tspan><tspan fill="#f0e8d0">&#183;  68 YEARS</tspan>
  </text>

  <!-- Tertiary italic -->
  <text x="400" y="92" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#c0a060" letter-spacing="0.8">
    WASHINGTON &#183; OCTOBER 1, 1958
  </text>

  <!-- Era roster -->
  <text x="400" y="108" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.4" font-weight="700" fill="#5880a8" letter-spacing="2.2" opacity="0.95">
    MERCURY &#183; GEMINI &#183; APOLLO &#183; SHUTTLE &#183; ARTEMIS
  </text>

  <!-- Georgia italic caption -->
  <text x="400" y="197" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10" font-style="italic" fill="#80a0c8" opacity="0.95">
    &#8220;for the benefit of all&#8221;
  </text>

</svg>
