<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Kon-Tiki 79th anniversary (April 28, 1947) — Thor Heyerdahl's balsa raft sets sail across the Pacific. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="April 28, 2026 — 79th anniversary of the Kon-Tiki expedition">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="40%" stop-color="#1a2238"/>
      <stop offset="70%" stop-color="#4a2a3a"/>
      <stop offset="100%" stop-color="#a84020"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0c0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffaa50" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#cc4020" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#aa2010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="60%" stop-color="#ffc070"/>
      <stop offset="100%" stop-color="#e07020"/>
    </radialGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3a52"/>
      <stop offset="100%" stop-color="#040a12"/>
    </linearGradient>
    <linearGradient id="dateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d8"/>
      <stop offset="100%" stop-color="#ffc070"/>
    </linearGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000" flood-opacity="0.7"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- single wave tile, repeats wider than canvas so translate animation can loop seamlessly -->
    <path id="waveTile" d="M0 0 Q 30 -8 60 0 T 120 0 T 180 0 T 240 0 T 300 0 T 360 0 T 420 0 T 480 0 T 540 0 T 600 0 T 660 0 T 720 0 T 780 0 T 840 0 T 900 0 T 960 0 L 960 40 L 0 40 Z"/>
  </defs>

  <!-- sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="48" cy="22" r="0.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="14" r="0.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="36" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="18" r="0.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="42" r="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="50" r="0.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="20" r="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="36" r="0.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="14" r="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="13s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="40" r="0.6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="12" r="0.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="48" r="0.6"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="13s" repeatCount="indefinite"/></circle>
  </g>

  <!-- setting sun (background glow) -->
  <circle cx="650" cy="135" r="100" fill="url(#sunGlow)">
    <animate attributeName="r" values="98;108;98" dur="13s" repeatCount="indefinite"/>
  </circle>
  <!-- sun disk -->
  <circle cx="650" cy="135" r="38" fill="url(#sunDisk)" opacity="0.95">
    <animate attributeName="r" values="37;40;37" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- horizon haze line -->
  <line x1="0" y1="135" x2="800" y2="135" stroke="#ff9050" stroke-width="0.4" opacity="0.4"/>

  <!-- ocean body -->
  <rect x="0" y="135" width="800" height="65" fill="url(#ocean)"/>

  <!-- sun reflection on water -->
  <g opacity="0.7">
    <ellipse cx="650" cy="148" rx="36" ry="2" fill="#ffd080">
      <animate attributeName="rx" values="30;42;30" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="650" cy="158" rx="28" ry="1.5" fill="#ff9050">
      <animate attributeName="rx" values="20;34;20" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="650" cy="170" rx="20" ry="1" fill="#ff7040">
      <animate attributeName="rx" values="14;26;14" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="650" cy="182" rx="14" ry="0.8" fill="#cc5030">
      <animate attributeName="rx" values="10;18;10" dur="7s" begin="1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- back wave layer (slow, lighter) -->
  <g fill="#2c4a64" opacity="0.55">
    <use href="#waveTile" x="-100" y="135">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="13s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- mid wave layer -->
  <g fill="#172f44" opacity="0.75">
    <use href="#waveTile" x="-60" y="148">
      <animateTransform attributeName="transform" type="translate" values="0 0; -50 0; 0 0" dur="11s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- raft (rides the swell) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 1; 0 -2; 0 0" dur="7s" repeatCount="indefinite"/>
    <g transform="translate(225 152)">
      <!-- balsa logs -->
      <rect x="-26" y="0" width="52" height="5" rx="1.5" fill="#6a3a20"/>
      <rect x="-26" y="0" width="52" height="5" rx="1.5" fill="none" stroke="#2a1408" stroke-width="0.4"/>
      <line x1="-22" y1="0" x2="-22" y2="5" stroke="#2a1408" stroke-width="0.3"/>
      <line x1="-14" y1="0" x2="-14" y2="5" stroke="#2a1408" stroke-width="0.3"/>
      <line x1="-6" y1="0" x2="-6" y2="5" stroke="#2a1408" stroke-width="0.3"/>
      <line x1="2" y1="0" x2="2" y2="5" stroke="#2a1408" stroke-width="0.3"/>
      <line x1="10" y1="0" x2="10" y2="5" stroke="#2a1408" stroke-width="0.3"/>
      <line x1="18" y1="0" x2="18" y2="5" stroke="#2a1408" stroke-width="0.3"/>
      <!-- shadow under raft -->
      <ellipse cx="0" cy="6" rx="28" ry="1" fill="#000" opacity="0.5"/>
      <!-- mast -->
      <line x1="0" y1="0" x2="-2" y2="-32" stroke="#2a1408" stroke-width="1.4"/>
      <!-- yard -->
      <line x1="-14" y1="-22" x2="14" y2="-22" stroke="#2a1408" stroke-width="0.8"/>
      <!-- sail (square rig) -->
      <path d="M-13 -22 L 13 -22 L 14 -2 L -14 -2 Z" fill="#e8d4a0" opacity="0.95">
        <animate attributeName="d" values="M-13 -22 L 13 -22 L 14 -2 L -14 -2 Z;M-13 -22 L 13 -22 L 17 -2 L -11 -2 Z;M-13 -22 L 13 -22 L 14 -2 L -14 -2 Z" dur="7s" repeatCount="indefinite"/>
      </path>
      <!-- sail shading -->
      <path d="M-13 -22 L 13 -22 L 14 -2 L -14 -2 Z" fill="none" stroke="#a07040" stroke-width="0.4"/>
      <!-- a stylized face/sun motif on the sail (Kon-Tiki's signature painted sail) -->
      <circle cx="0" cy="-12" r="3.5" fill="none" stroke="#a04020" stroke-width="0.6"/>
      <line x1="0" y1="-17" x2="0" y2="-15" stroke="#a04020" stroke-width="0.5"/>
      <line x1="0" y1="-9" x2="0" y2="-7" stroke="#a04020" stroke-width="0.5"/>
      <line x1="-5" y1="-12" x2="-3" y2="-12" stroke="#a04020" stroke-width="0.5"/>
      <line x1="3" y1="-12" x2="5" y2="-12" stroke="#a04020" stroke-width="0.5"/>
    </g>
  </g>

  <!-- front wave layer (fastest, darkest) -->
  <g fill="#06121e" opacity="0.92">
    <use href="#waveTile" x="-80" y="170">
      <animateTransform attributeName="transform" type="translate" values="0 0; 50 0; 0 0" dur="11s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- date — primary visual element -->
  <g filter="url(#textShadow)">
    <text x="400" y="78" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="42" font-weight="800" fill="url(#dateGrad)" letter-spacing="2.5">
      APRIL 28, 2026
    </text>
  </g>

  <!-- subtitle -->
  <text x="400" y="105" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-weight="600" fill="#f0d8b0" letter-spacing="5" opacity="0.92">
    KON-TIKI · 79 YEARS SINCE 28 APRIL 1947
    <animate attributeName="opacity" values="0.78;0.98;0.78" dur="11s" repeatCount="indefinite"/>
  </text>

  <!-- distant seabird silhouettes drifting across the sky -->
  <g fill="none" stroke="#1a1a1a" stroke-width="0.9" opacity="0.55">
    <path d="M0 0 q 3 -2 6 0 q 3 -2 6 0">
      <animateTransform attributeName="transform" type="translate" values="-30 30; 830 22; 830 22" dur="29s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="0.7" opacity="0.45">
    <path d="M0 0 q 2.5 -1.6 5 0 q 2.5 -1.6 5 0">
      <animateTransform attributeName="transform" type="translate" values="-30 45; 830 38; 830 38" dur="37s" begin="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
