<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: DNA Day (April 25) — anniversary of Watson & Crick's 1953 Nature double-helix paper. Genomic-sequencing-tape interpretation, distinct from prior helix-tile rendering. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="April 25, 2026, DNA Day">
  <title>DNA Day — April 25, 2026</title>
  <defs>
    <style>
      .A { fill: #ff7b72; }
      .T { fill: #79c0ff; }
      .G { fill: #7ee787; }
      .C { fill: #d2a8ff; }
      .tape {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 22px;
        font-weight: 700;
        text-anchor: middle;
      }
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        text-anchor: middle;
      }
      @keyframes haloPulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 0.95; }
      }
      .halo { animation: haloPulse 11s ease-in-out infinite; }
      @keyframes wavePulse {
        0%, 100% { opacity: 0.32; }
        50%      { opacity: 0.62; }
      }
      .wave { animation: wavePulse 13s ease-in-out infinite; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#161b22"/>
      <stop offset="1"   stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="centerHalo" cx="50%" cy="55%" r="46%">
      <stop offset="0"    stop-color="#7ee787" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#1f6feb" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.07" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="plaque" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="0.50" stop-color="#0d1117" stop-opacity="0.95"/>
      <stop offset="0.80" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <filter id="dateGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#centerHalo)" class="halo"/>

  <!-- subtle sinusoid backbone, drifts slowly -->
  <g class="wave">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0;-160,0" dur="29s" repeatCount="indefinite"/>
      <path d="M -160 100
               Q -120 70, -80 100 T 0 100 T 80 100 T 160 100
               T 240 100 T 320 100 T 400 100 T 480 100
               T 560 100 T 640 100 T 720 100 T 800 100
               T 880 100 T 960 100"
        fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.5"/>
      <path d="M -160 100
               Q -120 130, -80 100 T 0 100 T 80 100 T 160 100
               T 240 100 T 320 100 T 400 100 T 480 100
               T 560 100 T 640 100 T 720 100 T 800 100
               T 880 100 T 960 100"
        fill="none" stroke="#bc8cff" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- TOP tape: drifts right→left over 17s, sequence repeated twice for seamless loop -->
  <g class="tape">
    <animateTransform attributeName="transform" type="translate"
      values="0,0;-560,0" dur="17s" repeatCount="indefinite"/>
    <text y="38" opacity="0.85">
      <tspan x="14" class="G">G</tspan><tspan x="42" class="A">A</tspan><tspan x="70" class="T">T</tspan><tspan x="98" class="C">C</tspan><tspan x="126" class="A">A</tspan><tspan x="154" class="T">T</tspan><tspan x="182" class="G">G</tspan><tspan x="210" class="G">G</tspan><tspan x="238" class="C">C</tspan><tspan x="266" class="A">A</tspan><tspan x="294" class="T">T</tspan><tspan x="322" class="C">C</tspan><tspan x="350" class="G">G</tspan><tspan x="378" class="A">A</tspan><tspan x="406" class="T">T</tspan><tspan x="434" class="C">C</tspan><tspan x="462" class="A">A</tspan><tspan x="490" class="G">G</tspan><tspan x="518" class="C">C</tspan><tspan x="546" class="T">T</tspan><tspan x="574" class="G">G</tspan><tspan x="602" class="A">A</tspan><tspan x="630" class="T">T</tspan><tspan x="658" class="C">C</tspan><tspan x="686" class="A">A</tspan><tspan x="714" class="T">T</tspan><tspan x="742" class="G">G</tspan><tspan x="770" class="G">G</tspan><tspan x="798" class="C">C</tspan><tspan x="826" class="A">A</tspan><tspan x="854" class="T">T</tspan><tspan x="882" class="C">C</tspan><tspan x="910" class="G">G</tspan><tspan x="938" class="A">A</tspan><tspan x="966" class="T">T</tspan><tspan x="994" class="C">C</tspan><tspan x="1022" class="A">A</tspan><tspan x="1050" class="G">G</tspan><tspan x="1078" class="C">C</tspan><tspan x="1106" class="T">T</tspan>
    </text>
  </g>

  <!-- BOTTOM tape: drifts left→right over 19s, complementary sequence -->
  <g class="tape">
    <animateTransform attributeName="transform" type="translate"
      values="-560,0;0,0" dur="19s" repeatCount="indefinite"/>
    <text y="184" opacity="0.85">
      <tspan x="14" class="C">C</tspan><tspan x="42" class="T">T</tspan><tspan x="70" class="A">A</tspan><tspan x="98" class="G">G</tspan><tspan x="126" class="T">T</tspan><tspan x="154" class="A">A</tspan><tspan x="182" class="C">C</tspan><tspan x="210" class="C">C</tspan><tspan x="238" class="G">G</tspan><tspan x="266" class="T">T</tspan><tspan x="294" class="A">A</tspan><tspan x="322" class="G">G</tspan><tspan x="350" class="C">C</tspan><tspan x="378" class="T">T</tspan><tspan x="406" class="A">A</tspan><tspan x="434" class="G">G</tspan><tspan x="462" class="T">T</tspan><tspan x="490" class="C">C</tspan><tspan x="518" class="G">G</tspan><tspan x="546" class="A">A</tspan><tspan x="574" class="C">C</tspan><tspan x="602" class="T">T</tspan><tspan x="630" class="A">A</tspan><tspan x="658" class="G">G</tspan><tspan x="686" class="T">T</tspan><tspan x="714" class="A">A</tspan><tspan x="742" class="C">C</tspan><tspan x="770" class="C">C</tspan><tspan x="798" class="G">G</tspan><tspan x="826" class="T">T</tspan><tspan x="854" class="A">A</tspan><tspan x="882" class="G">G</tspan><tspan x="910" class="C">C</tspan><tspan x="938" class="T">T</tspan><tspan x="966" class="A">A</tspan><tspan x="994" class="G">G</tspan><tspan x="1022" class="T">T</tspan><tspan x="1050" class="C">C</tspan><tspan x="1078" class="G">G</tspan><tspan x="1106" class="A">A</tspan>
    </text>
  </g>

  <!-- side fades to soften tape edges -->
  <rect width="800" height="200" fill="url(#edgeFade)"/>

  <!-- center darkening plaque so the date dominates over the tapes -->
  <rect x="0" y="55" width="800" height="90" fill="url(#plaque)"/>

  <!-- soft halo behind the date, breathing -->
  <ellipse cx="400" cy="108" rx="220" ry="42" fill="#1f6feb" opacity="0.16" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.10;0.22;0.10" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- title block: DNA Day kicker, big date, small attribution -->
  <g class="label">
    <text x="400" y="78" font-size="13" font-weight="700" fill="#7ee787" letter-spacing="9">DNA DAY</text>
    <g filter="url(#dateGlow)">
      <text x="400" y="122" font-size="48" font-weight="900" fill="#f0f6fc" letter-spacing="3">April 25, 2026</text>
    </g>
    <text x="400" y="146" font-size="10.5" font-weight="500" fill="#8b949e" letter-spacing="4">WATSON · CRICK · NATURE · 1953</text>
  </g>
</svg>
