<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: First laser beam reflected from the Moon — 64th anniversary (May 9, 1962, MIT Lincoln Lab); ruby-laser red beam, lunar disc, observatory ground station -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 9, 2026 — first laser beam reflected off the Moon, 1962">
  <defs>
    <!-- night-sky backdrop -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#070a16"/>
      <stop offset="55%"  stop-color="#0a0e1c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- soft red glow from the laser path -->
    <radialGradient id="redHaze" cx="50%" cy="60%" r="55%">
      <stop offset="0%"   stop-color="#ff2a3d" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#3a0a14" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- moon body -->
    <radialGradient id="moonGrad" cx="38%" cy="38%" r="62%">
      <stop offset="0%"   stop-color="#fbf6e6"/>
      <stop offset="55%"  stop-color="#d8cda0"/>
      <stop offset="100%" stop-color="#7a6d3e"/>
    </radialGradient>

    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff3c8" stop-opacity="0.55"/>
      <stop offset="40%"  stop-color="#f0d56a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f0d56a" stop-opacity="0"/>
    </radialGradient>

    <!-- ruby laser gradient (bright core, soft glow) -->
    <linearGradient id="laserCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff5566" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#ff2238" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b80018" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="echoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff7788" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ff99aa" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffccd6" stop-opacity="0"/>
    </linearGradient>

    <!-- title gradient: ivory glow with ruby underbite -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#ffe8d8"/>
      <stop offset="100%" stop-color="#ff8a90"/>
    </linearGradient>

    <!-- glows -->
    <filter id="laserGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- twinkling star -->
    <symbol id="star" overflow="visible">
      <circle r="0.9" fill="#e8eef5"/>
    </symbol>

    <!-- crater symbol -->
    <symbol id="crater" overflow="visible">
      <circle r="3" fill="#7a6d3e" opacity="0.55"/>
      <circle r="2.4" cx="-0.4" cy="-0.4" fill="#3a3216" opacity="0.4"/>
    </symbol>

    <!-- observatory dome (ground station silhouette) -->
    <symbol id="dome" overflow="visible">
      <!-- base platform -->
      <rect x="-26" y="-2" width="52" height="6" fill="#1a1f2c"/>
      <!-- dome body -->
      <path d="M -22 -2 A 22 22 0 0 1 22 -2 Z" fill="#1a1f2c"/>
      <!-- dome shading -->
      <path d="M -22 -2 A 22 22 0 0 1 22 -2 Z" fill="#252b3a" opacity="0.85" transform="scale(0.92)"/>
      <!-- aperture slit (laser exit) -->
      <path d="M -3 -22 L 3 -22 L 4 -2 L -4 -2 Z" fill="#0d1117"/>
      <!-- inner red glint inside slit -->
      <rect x="-2" y="-20" width="4" height="18" fill="#ff2238" opacity="0.85">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <!-- legs -->
      <line x1="-22" y1="4" x2="-26" y2="14" stroke="#1a1f2c" stroke-width="2"/>
      <line x1="22"  y1="4" x2="26"  y2="14" stroke="#1a1f2c" stroke-width="2"/>
      <line x1="0"   y1="4" x2="0"   y2="14" stroke="#1a1f2c" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- ============= BACKDROP ============= -->
  <rect width="800" height="200" fill="url(#sky)"/>
  <rect width="800" height="200" fill="url(#redHaze)"/>

  <!-- subtle horizon hint -->
  <rect x="0" y="178" width="800" height="22" fill="#05070d"/>
  <line x1="0" y1="178" x2="800" y2="178" stroke="#1a2030" stroke-width="0.6" opacity="0.7"/>

  <!-- ============= STARFIELD ============= -->
  <g>
    <use href="#star" x="60"  y="30"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></use>
    <use href="#star" x="110" y="58"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s" begin="-1s" repeatCount="indefinite"/></use>
    <use href="#star" x="180" y="22"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" begin="-2s" repeatCount="indefinite"/></use>
    <use href="#star" x="250" y="48"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="-3s" repeatCount="indefinite"/></use>
    <use href="#star" x="320" y="18"><animate attributeName="opacity" values="0.3;1;0.3" dur="9s" begin="-4s" repeatCount="indefinite"/></use>
    <use href="#star" x="380" y="40"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s" begin="-2s" repeatCount="indefinite"/></use>
    <use href="#star" x="430" y="14"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="13s" begin="-5s" repeatCount="indefinite"/></use>
    <use href="#star" x="500" y="36"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="-1s" repeatCount="indefinite"/></use>
    <use href="#star" x="540" y="60"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="11s" begin="-3s" repeatCount="indefinite"/></use>
    <use href="#star" x="610" y="22"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s" begin="-4s" repeatCount="indefinite"/></use>
    <use href="#star" x="690" y="48"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="9s" begin="-2s" repeatCount="indefinite"/></use>
    <use href="#star" x="760" y="20"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="-1s" repeatCount="indefinite"/></use>
    <use href="#star" x="160" y="80" transform="scale(0.6)"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="13s" begin="-3s" repeatCount="indefinite"/></use>
    <use href="#star" x="270" y="72" transform="scale(0.7)"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="11s" begin="-2s" repeatCount="indefinite"/></use>
    <use href="#star" x="470" y="68" transform="scale(0.6)"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="9s" begin="-5s" repeatCount="indefinite"/></use>
  </g>

  <!-- ============= MOON (upper-right) ============= -->
  <g transform="translate(700,68)">
    <!-- halo -->
    <circle r="56" fill="url(#moonHalo)" filter="url(#moonGlow)">
      <animate attributeName="r" values="54;58;54" dur="11s" repeatCount="indefinite"/>
    </circle>
    <!-- body -->
    <circle r="34" fill="url(#moonGrad)"/>
    <!-- craters -->
    <use href="#crater" x="-12" y="-8" transform="scale(1)"/>
    <use href="#crater" x="6"   y="4"  transform="scale(0.8)"/>
    <use href="#crater" x="14"  y="-12" transform="scale(0.55)"/>
    <use href="#crater" x="-6"  y="14" transform="scale(0.7)"/>
    <use href="#crater" x="-18" y="6"  transform="scale(0.5)"/>
    <use href="#crater" x="18"  y="14" transform="scale(0.45)"/>
    <!-- terminator shading -->
    <path d="M 0 -34 A 34 34 0 0 1 0 34 A 22 34 0 0 0 0 -34 Z" fill="#000" opacity="0.18"/>

    <!-- target reticle on moon (where the laser hits) -->
    <g opacity="0">
      <circle r="5" fill="none" stroke="#ff5566" stroke-width="0.8"/>
      <circle r="9" fill="none" stroke="#ff5566" stroke-width="0.5" opacity="0.6"/>
      <animate attributeName="opacity" values="0;0;1;0.4;0" keyTimes="0;0.45;0.55;0.7;1" dur="3.5s" repeatCount="indefinite"/>
    </g>
    <!-- impact flash -->
    <circle r="2" fill="#ffffff" opacity="0">
      <animate attributeName="r" values="0;14;0" keyTimes="0;0.55;1" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.95;0" keyTimes="0;0.5;0.55;0.75" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============= LASER BEAM (Earth station to Moon) ============= -->
  <!-- The beam runs from telescope dome at (90,170) up to moon at (700,68) -->
  <g filter="url(#laserGlow)">
    <!-- outer soft glow line -->
    <line x1="90" y1="166" x2="700" y2="68"
          stroke="#ff2238" stroke-width="3.4" stroke-linecap="round" opacity="0.22"/>
    <!-- inner bright core (constant thin line) -->
    <line x1="90" y1="166" x2="700" y2="68"
          stroke="url(#laserCore)" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <!-- traveling pulse along the beam (uphill) -->
    <line x1="90" y1="166" x2="700" y2="68"
          stroke="#fff5f5" stroke-width="1.6" stroke-linecap="round"
          stroke-dasharray="14 600" opacity="0.95">
      <animate attributeName="stroke-dashoffset" values="0;-614" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <!-- echo pulse traveling back (downhill) -->
    <line x1="90" y1="166" x2="700" y2="68"
          stroke="url(#echoGrad)" stroke-width="1.0" stroke-linecap="round"
          stroke-dasharray="10 600" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="-614;0" dur="3.5s" begin="1.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- secondary diagonal shimmer cones at moon impact -->
  <g transform="translate(700,68)">
    <g opacity="0">
      <line x1="0" y1="0" x2="-22" y2="6"  stroke="#ff8090" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="-18" y2="-10" stroke="#ff8090" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="-26" y2="-2" stroke="#ff8090" stroke-width="0.4"/>
      <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.5;0.58;0.85" dur="3.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ============= GROUND STATION (lower-left) ============= -->
  <g transform="translate(90,178)">
    <!-- baseline -->
    <line x1="-40" y1="0" x2="46" y2="0" stroke="#1a2030" stroke-width="1"/>
    <use href="#dome"/>
    <!-- "1962" label under the dome -->
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="700" letter-spacing="3" text-anchor="middle"
          fill="#ff8a92" opacity="0.85">
      LINCOLN LAB · 1962
    </text>
  </g>

  <!-- ============= TITLE BLOCK ============= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- top eyebrow -->
    <text x="400" y="40" font-size="10.5" letter-spacing="7" font-weight="700"
          fill="#ff8a92" opacity="0.95" filter="url(#textGlow)">
      FIRST LASER ECHO FROM THE MOON
    </text>

    <!-- giant date -->
    <text x="400" y="100" font-size="52" font-weight="900" letter-spacing="2"
          fill="url(#titleGrad)" filter="url(#textGlow)">
      May 9, 2026
    </text>

    <!-- subtitle anniversary -->
    <text x="400" y="124" font-size="11" font-weight="700" letter-spacing="6"
          fill="#dfe4ec" opacity="0.85">
      64 YEARS SINCE THE BEAM RETURNED
    </text>
  </g>

  <!-- ============= EXTRA RUBY-DOT PARTICLES near beam axis ============= -->
  <g>
    <circle cx="240" cy="124" r="0.9" fill="#ff5566" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="100" r="0.9" fill="#ff5566" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="84"  r="0.9" fill="#ff5566" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="74"  r="0.9" fill="#ff5566" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.5s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
