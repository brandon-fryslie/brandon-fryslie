<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Mount St. Helens eruption 46th anniversary (May 18, 1980) — volcano silhouette, ash plume, pyroclastic cloud, lava glow, embers -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 18, 2026 — Mount St. Helens 46th anniversary">
  <defs>
    <!-- Dark stratovolcano sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#1a0e0a"/>
      <stop offset="100%" stop-color="#2a0f06"/>
    </linearGradient>

    <!-- Ash plume gradient: hot at bottom, gray at top -->
    <radialGradient id="plume" cx="50%" cy="100%" r="120%">
      <stop offset="0%" stop-color="#ff7a2a" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#c0481a" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#6b3a2a" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#4a4248" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9aa0a8" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Crater glow -->
    <radialGradient id="crater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="30%" stop-color="#ffae3a"/>
      <stop offset="70%" stop-color="#c0341a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5a1408" stop-opacity="0"/>
    </radialGradient>

    <!-- Volcano body -->
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1410"/>
      <stop offset="100%" stop-color="#08060a"/>
    </linearGradient>

    <!-- Distant ridge -->
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241612" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#120a0a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Turbulent ash filter -->
    <filter id="ash" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="7" result="turb">
        <animate attributeName="baseFrequency" dur="29s" values="0.012 0.018;0.018 0.014;0.012 0.018" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="22"/>
    </filter>

    <!-- Soft smoke for upper plume -->
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- Ember single -->
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="50%" stop-color="#ff9028"/>
      <stop offset="100%" stop-color="#ff3a0a" stop-opacity="0"/>
    </radialGradient>

    <!-- Lava glow on slopes -->
    <radialGradient id="lavaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5418" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff5418" stop-opacity="0"/>
    </radialGradient>

    <!-- Ember symbol -->
    <symbol id="emb" overflow="visible">
      <circle r="2.4" fill="url(#ember)"/>
    </symbol>
  </defs>

  <!-- Sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Faint atmospheric glow above volcano -->
  <ellipse cx="220" cy="80" rx="220" ry="55" fill="#ff5018" opacity="0.10"/>

  <!-- Distant ridges right (lit dimly red) -->
  <path d="M 420,200 L 470,150 L 510,170 L 560,140 L 620,165 L 690,135 L 760,160 L 800,150 L 800,200 Z" fill="url(#ridge)"/>
  <path d="M 350,200 L 410,160 L 470,180 L 800,180 L 800,200 Z" fill="#0a0606" opacity="0.95"/>

  <!-- Ash plume (turbulent) — rises from crater -->
  <g filter="url(#ash)">
    <path d="M 200,80 C 170,40 160,10 175,-10 L 305,-10 C 320,15 290,45 270,80 C 260,100 240,110 220,108 C 200,105 195,95 200,80 Z"
          fill="url(#plume)" opacity="0.92"/>
    <!-- Pyroclastic body widening -->
    <path d="M 175,95 C 110,80 80,55 95,20 L 360,20 C 380,55 330,80 270,95 C 240,105 205,105 175,95 Z"
          fill="url(#plume)" opacity="0.78"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; -6,-3; 4,-2; 0,0" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- Upper drifting smoke (cooler grays) -->
  <g filter="url(#smoke)" opacity="0.55">
    <ellipse cx="280" cy="35" rx="220" ry="28" fill="#7a747a"/>
    <ellipse cx="430" cy="55" rx="180" ry="22" fill="#5a565c"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 30,-4; 60,-2; 30,-4; 0,0" dur="23s" repeatCount="indefinite"/>
  </g>

  <!-- Volcano silhouette (Mount St. Helens — flattened summit from the lateral blast) -->
  <g>
    <!-- Main cone -->
    <path d="M 30,200 L 130,120 L 175,85 L 235,95 L 270,130 L 360,200 Z" fill="url(#mtn)"/>
    <!-- Crater rim/notch (blown out north flank) -->
    <path d="M 175,85 L 200,82 L 220,92 L 235,95 L 225,99 L 205,93 L 188,96 Z" fill="#080406"/>
    <!-- Crater glow -->
    <ellipse cx="205" cy="92" rx="28" ry="9" fill="url(#crater)">
      <animate attributeName="ry" values="9;12;9" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Lava streak down right flank -->
    <path d="M 224,98 Q 248,135 286,178" stroke="#ff5a1c" stroke-width="2.2" fill="none" opacity="0.85">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M 224,98 Q 248,135 286,178" stroke="#ffd16a" stroke-width="0.9" fill="none" opacity="0.9"/>
    <circle cx="286" cy="178" r="14" fill="url(#lavaGlow)">
      <animate attributeName="r" values="12;18;12" dur="11s" repeatCount="indefinite"/>
    </circle>
    <!-- Snow patches (Mt St Helens had a glacier) -->
    <path d="M 145,110 L 158,108 L 168,113 L 158,116 Z" fill="#d8d4cf" opacity="0.55"/>
    <path d="M 248,135 L 262,134 L 272,140 L 256,142 Z" fill="#d8d4cf" opacity="0.45"/>
  </g>

  <!-- Embers rising along plume -->
  <g>
    <use href="#emb" x="210" y="95">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-90; -22,-150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.9;0" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#emb" x="200" y="90">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-70; 30,-140" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
    </use>
    <use href="#emb" x="220" y="100">
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,-60; 12,-130" dur="13s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0" dur="13s" begin="-3s" repeatCount="indefinite"/>
    </use>
    <use href="#emb" x="215" y="98">
      <animateTransform attributeName="transform" type="translate" values="0,0; 14,-80; 28,-160" dur="7s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0" dur="7s" begin="-4s" repeatCount="indefinite"/>
    </use>
    <use href="#emb" x="205" y="95">
      <animateTransform attributeName="transform" type="translate" values="0,0; -18,-110; -8,-170" dur="11s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="-7s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Ash particles drifting right -->
  <g fill="#bdb6b0" opacity="0.55">
    <circle cx="0" cy="60" r="1.1">
      <animateTransform attributeName="transform" type="translate" values="380,0; 820,15" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="40" r="0.9">
      <animateTransform attributeName="transform" type="translate" values="400,0; 820,20" dur="23s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="75" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="370,0; 820,5" dur="19s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="25" r="0.8">
      <animateTransform attributeName="transform" type="translate" values="390,0; 820,25" dur="29s" begin="-11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="90" r="1.1">
      <animateTransform attributeName="transform" type="translate" values="360,0; 820,10" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- DATE — primary visual, integrated to the right of the plume -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Subtle dark backing for legibility -->
    <rect x="430" y="48" width="350" height="80" rx="2" fill="#0d1117" opacity="0.35"/>
    <text x="445" y="100" font-size="46" font-weight="800" fill="#fff2dc" letter-spacing="1">
      MAY 18 · 2026
    </text>
    <text x="446" y="123" font-size="13" font-weight="600" fill="#ff9a5a" letter-spacing="3">
      MOUNT ST. HELENS · 46 YEARS
    </text>
    <!-- Eruption timestamp marker -->
    <g transform="translate(446,148)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#5a3a2a" stroke-width="0.7"/>
      <text x="0" y="14" font-size="10" fill="#b9a99a" letter-spacing="1.5">08:32:11 PDT · MAY 18, 1980 · LATERAL BLAST</text>
    </g>
    <!-- Tiny seismograph trace for character -->
    <g transform="translate(446,176)" stroke="#ff7a3a" stroke-width="1" fill="none" opacity="0.85">
      <path d="M 0,0 L 18,0 L 22,-6 L 26,9 L 30,-11 L 34,12 L 38,-4 L 44,2 L 52,0 L 60,-7 L 64,8 L 68,-10 L 72,6 L 78,-2 L 90,0 L 110,0 L 114,-3 L 118,2 L 130,0 L 280,0">
        <animate attributeName="stroke-dashoffset" values="0;-40" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-dasharray" values="2 2;2 2" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Subtle vignette -->
  <rect width="800" height="200" fill="none" stroke="#000" stroke-width="1" opacity="0.4"/>
</svg>
