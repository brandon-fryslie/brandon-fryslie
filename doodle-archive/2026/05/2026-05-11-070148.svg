<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Mother's Day (US, 2nd Sunday of May = May 10, 2026) — bouquet, hearts, warm coral/rose palette -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 10, 2026 — Mother's Day, with a bouquet of roses and floating hearts">
  <defs>
    <!-- backdrop: dusk pink over the GitHub dark base -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="60%"  stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="warmGlow" cx="50%" cy="55%" r="60%">
      <stop offset="0%"   stop-color="#ffb1c1" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#ff7d9c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- rose petal gradient -->
    <radialGradient id="roseA" cx="40%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#ffd1dc"/>
      <stop offset="55%"  stop-color="#ff7d9c"/>
      <stop offset="100%" stop-color="#9c2949"/>
    </radialGradient>
    <radialGradient id="roseB" cx="40%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#ffe9c2"/>
      <stop offset="55%"  stop-color="#ffae6a"/>
      <stop offset="100%" stop-color="#a44a1c"/>
    </radialGradient>
    <radialGradient id="roseC" cx="40%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#fff0f6"/>
      <stop offset="55%"  stop-color="#ffc0d4"/>
      <stop offset="100%" stop-color="#7a3754"/>
    </radialGradient>

    <!-- leaf gradient -->
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7ed4a3"/>
      <stop offset="60%"  stop-color="#3a8d63"/>
      <stop offset="100%" stop-color="#1d4a35"/>
    </linearGradient>

    <!-- heart gradient -->
    <radialGradient id="heart" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#ffd6e0"/>
      <stop offset="55%"  stop-color="#ff5f7e"/>
      <stop offset="100%" stop-color="#a02340"/>
    </radialGradient>

    <!-- ribbon gradient -->
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7a3754"/>
      <stop offset="50%"  stop-color="#c9577a"/>
      <stop offset="100%" stop-color="#7a3754"/>
    </linearGradient>

    <!-- title gradient: warm rose -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff0f3"/>
      <stop offset="55%"  stop-color="#ffd1dc"/>
      <stop offset="100%" stop-color="#ff7d9c"/>
    </linearGradient>

    <!-- soft glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- single rose, viewed from above (concentric petal swirl) -->
    <symbol id="rose" overflow="visible">
      <!-- outer petals -->
      <circle r="14" fill="url(#roseA)" opacity="0.85"/>
      <circle r="11" cx="-2" cy="-2" fill="url(#roseA)" opacity="0.95"/>
      <circle r="8"  cx="2"  cy="2"  fill="url(#roseA)"/>
      <circle r="5"  cx="-1" cy="-1" fill="#ffd1dc" opacity="0.85"/>
      <circle r="2.4" cx="0" cy="0" fill="#ffe5ec"/>
      <!-- soft highlight -->
      <ellipse cx="-4" cy="-5" rx="3" ry="1.6" fill="#fff" opacity="0.35"/>
    </symbol>

    <symbol id="roseAlt" overflow="visible">
      <circle r="13" fill="url(#roseB)" opacity="0.85"/>
      <circle r="10" cx="-2" cy="-2" fill="url(#roseB)" opacity="0.95"/>
      <circle r="7"  cx="2"  cy="2"  fill="url(#roseB)"/>
      <circle r="4.5"  cx="-1" cy="-1" fill="#ffe1b8" opacity="0.85"/>
      <circle r="2.2" cx="0" cy="0" fill="#fff2dc"/>
      <ellipse cx="-3.5" cy="-4.5" rx="2.6" ry="1.4" fill="#fff" opacity="0.35"/>
    </symbol>

    <symbol id="rosePale" overflow="visible">
      <circle r="12" fill="url(#roseC)" opacity="0.85"/>
      <circle r="9"  cx="-2" cy="-2" fill="url(#roseC)" opacity="0.95"/>
      <circle r="6"  cx="2"  cy="2"  fill="url(#roseC)"/>
      <circle r="4"  cx="-1" cy="-1" fill="#fff0f6" opacity="0.9"/>
      <circle r="2"  cx="0" cy="0" fill="#fff7fa"/>
      <ellipse cx="-3" cy="-4" rx="2.4" ry="1.3" fill="#fff" opacity="0.4"/>
    </symbol>

    <!-- leaf shape -->
    <symbol id="leafShape" overflow="visible">
      <path d="M 0 0 Q 8 -10 18 -8 Q 12 2 0 0 Z" fill="url(#leaf)"/>
      <path d="M 1 -1 Q 9 -8 16 -7" stroke="#1d4a35" stroke-width="0.5" fill="none" opacity="0.6"/>
    </symbol>

    <!-- heart shape (uses two circles + triangle) -->
    <symbol id="heartShape" overflow="visible">
      <path d="M 0 12 C -14 -2 -14 -14 -6 -14 C -2 -14 0 -10 0 -6 C 0 -10 2 -14 6 -14 C 14 -14 14 -2 0 12 Z"
            fill="url(#heart)"/>
      <path d="M 0 10 C -10 0 -11 -10 -5 -11 C -2 -11 -1 -8 0 -6"
            stroke="#fff" stroke-width="0.5" fill="none" opacity="0.4"/>
    </symbol>

    <!-- tiny sparkle -->
    <symbol id="sparkle" overflow="visible">
      <path d="M 0 -3 L 0.7 -0.7 L 3 0 L 0.7 0.7 L 0 3 L -0.7 0.7 L -3 0 L -0.7 -0.7 Z" fill="#fff5f8"/>
    </symbol>
  </defs>

  <!-- ============= BACKDROP ============= -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#warmGlow)"/>

  <!-- subtle horizon hint -->
  <rect x="0" y="186" width="800" height="14" fill="#06080d"/>

  <!-- soft drifting blossom particles in the background -->
  <g opacity="0.55">
    <circle cx="120" cy="40" r="1.6" fill="#ffb1c1">
      <animate attributeName="cy" values="40;180;40" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="20" r="1.4" fill="#ffd1dc">
      <animate attributeName="cy" values="20;180;20" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="30" r="1.2" fill="#ffae6a">
      <animate attributeName="cy" values="30;180;30" dur="17s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="17s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="14" r="1.5" fill="#ffc0d4">
      <animate attributeName="cy" values="14;180;14" dur="13s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="-6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="36" r="1.3" fill="#ffd1dc">
      <animate attributeName="cy" values="36;180;36" dur="11s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="10" r="1.0" fill="#ffe9c2">
      <animate attributeName="cy" values="10;180;10" dur="19s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="19s" begin="-5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============= LEFT BOUQUET ============= -->
  <g transform="translate(110,128)">
    <!-- breathing wrapper for whole bouquet -->
    <g style="transform-box: fill-box; transform-origin: 50% 80%;">
      <animateTransform attributeName="transform" type="rotate"
                        values="-1.2;1.2;-1.2" dur="11s" repeatCount="indefinite" additive="sum"/>

      <!-- ribbon trail -->
      <path d="M -10 32 Q -28 50 -34 60 Q -22 54 -10 50 Z" fill="url(#ribbon)" opacity="0.85"/>
      <path d="M  6 32 Q  22 52 32 64 Q  16 56  4 50 Z" fill="url(#ribbon)" opacity="0.85"/>

      <!-- vase / wrap (paper cone) -->
      <path d="M -22 18 L 22 18 L 28 56 L -28 56 Z" fill="#1a1f2c"/>
      <path d="M -22 18 L 22 18 L 28 56 L -28 56 Z" fill="#252b3a" opacity="0.7" transform="scale(0.92)"/>
      <!-- wrap fold lines -->
      <line x1="-10" y1="18" x2="-16" y2="56" stroke="#0d1117" stroke-width="0.6" opacity="0.7"/>
      <line x1="0"   y1="18" x2="0"   y2="56" stroke="#0d1117" stroke-width="0.6" opacity="0.7"/>
      <line x1="10"  y1="18" x2="16"  y2="56" stroke="#0d1117" stroke-width="0.6" opacity="0.7"/>

      <!-- ribbon knot -->
      <ellipse cx="0" cy="22" rx="9" ry="3.5" fill="url(#ribbon)"/>
      <circle cx="0" cy="22" r="2.5" fill="#7a3754"/>

      <!-- leaves behind flowers -->
      <use href="#leafShape" transform="translate(-22,-2) rotate(-40) scale(0.95)"/>
      <use href="#leafShape" transform="translate(20,0) rotate(40) scale(-1,1)"/>
      <use href="#leafShape" transform="translate(-12,-12) rotate(-65) scale(0.85)"/>
      <use href="#leafShape" transform="translate(12,-14) rotate(65) scale(-0.85,0.85)"/>
      <use href="#leafShape" transform="translate(0,-22) rotate(-12) scale(0.7)"/>

      <!-- the roses (back row first, then front for depth) -->
      <use href="#rosePale" x="-18" y="-4">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;6;0" dur="13s" repeatCount="indefinite"/>
      </use>
      <use href="#roseAlt" x="20" y="-2">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;-7;0" dur="11s" repeatCount="indefinite"/>
      </use>
      <use href="#rose" x="-2" y="-14">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;5;0" dur="17s" repeatCount="indefinite"/>
      </use>
      <use href="#rose" x="-26" y="-18">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;-5;0" dur="13s" begin="-2s" repeatCount="indefinite"/>
      </use>
      <use href="#rosePale" x="22" y="-20">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;6;0" dur="11s" begin="-3s" repeatCount="indefinite"/>
      </use>
      <use href="#roseAlt" x="-12" y="-30">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;-4;0" dur="17s" begin="-1s" repeatCount="indefinite"/>
      </use>
      <use href="#rose" x="10" y="-32">
        <animateTransform attributeName="transform" type="rotate"
                          values="0;5;0" dur="13s" begin="-4s" repeatCount="indefinite"/>
      </use>

      <!-- baby's-breath dots -->
      <g fill="#fff5f8" opacity="0.85">
        <circle cx="-30" cy="-6" r="1"/>
        <circle cx="-34" cy="-14" r="0.8"/>
        <circle cx="34" cy="-10" r="1"/>
        <circle cx="38" cy="-18" r="0.8"/>
        <circle cx="0" cy="-44" r="1"/>
        <circle cx="-8" cy="-40" r="0.8"/>
        <circle cx="20" cy="-42" r="0.9"/>
      </g>
    </g>
  </g>

  <!-- ============= RIGHT: HEARTS RISING ============= -->
  <g>
    <use href="#heartShape" x="690" y="160" transform="scale(1.3)" transform-origin="690 160" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -6,-110; -2,-220" dur="13s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="13s" repeatCount="indefinite"/>
    </use>
    <use href="#heartShape" x="720" y="180" transform="scale(0.85)" transform-origin="720 180" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 8,-120; 4,-200" dur="11s" begin="-3s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.7;1" dur="11s" begin="-3s" repeatCount="indefinite"/>
    </use>
    <use href="#heartShape" x="660" y="170" transform="scale(0.65)" transform-origin="660 170" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -10,-130; -4,-210" dur="17s" begin="-5s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.7;1" dur="17s" begin="-5s" repeatCount="indefinite"/>
    </use>
    <use href="#heartShape" x="745" y="170" transform="scale(0.55)" transform-origin="745 170" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 4,-100; -2,-180" dur="11s" begin="-7s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.7;1" dur="11s" begin="-7s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ============= TITLE BLOCK (centered) ============= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- shaded plaque behind title for legibility -->
    <rect x="220" y="48" width="360" height="100" rx="10" ry="10" fill="#0d1117" opacity="0.55"/>

    <!-- top eyebrow -->
    <text x="400" y="74" font-size="11" letter-spacing="8" font-weight="700"
          fill="#ffb1c1" opacity="0.95" filter="url(#textGlow)">
      HAPPY MOTHER&apos;S DAY
    </text>

    <!-- giant date -->
    <text x="400" y="120" font-size="40" font-weight="900" letter-spacing="2"
          fill="url(#titleGrad)" filter="url(#textGlow)">
      May 10, 2026
    </text>

    <!-- subtitle -->
    <text x="400" y="140" font-size="9.5" font-weight="700" letter-spacing="5"
          fill="#dfe4ec" opacity="0.85">
      THE SECOND SUNDAY IN MAY
    </text>

    <!-- tiny hearts flanking the date -->
    <g transform="translate(255,108)" opacity="0.9">
      <use href="#heartShape" transform="scale(0.5)">
        <animateTransform attributeName="transform" type="scale"
                          values="0.5;0.62;0.5" dur="7s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(545,108)" opacity="0.9">
      <use href="#heartShape" transform="scale(0.5)">
        <animateTransform attributeName="transform" type="scale"
                          values="0.5;0.62;0.5" dur="7s" begin="-3s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- ============= SPARKLES ============= -->
  <g>
    <use href="#sparkle" x="240" y="60" opacity="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="560" y="50" opacity="0.9" transform="scale(0.8)" transform-origin="560 50">
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="-1s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="600" y="150" opacity="0.9" transform="scale(0.7)" transform-origin="600 150">
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="-2s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="220" y="155" opacity="0.9" transform="scale(0.7)" transform-origin="220 155">
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="-3s" repeatCount="indefinite"/>
    </use>
  </g>
</svg>
