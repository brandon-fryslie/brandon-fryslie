<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Skylab launch 53rd anniversary (May 14, 1973) — America's first space station, orbital workshop with Apollo Telescope Mount, Earth limb, stars, vacuum blue -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 14, 2026 — Skylab 53rd launch anniversary">
  <defs>
    <!-- deep-space backdrop, fading to Earth's atmospheric glow at bottom -->
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#02040a"/>
      <stop offset="55%" stop-color="#050a18"/>
      <stop offset="82%" stop-color="#0a2440"/>
      <stop offset="100%" stop-color="#1d6ec4"/>
    </linearGradient>

    <!-- Earth limb gradient: cyan -> deep blue -->
    <radialGradient id="earth" cx="50%" cy="180%" r="120%">
      <stop offset="40%" stop-color="#2787e2"/>
      <stop offset="70%" stop-color="#0e3a78"/>
      <stop offset="100%" stop-color="#02152e"/>
    </radialGradient>

    <!-- atmospheric halo above the limb -->
    <linearGradient id="atmo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7fd0ff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#7fd0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7fd0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- gold solar panel gradient (Skylab solar wing) -->
    <linearGradient id="solarGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f6d273"/>
      <stop offset="50%" stop-color="#c98f1e"/>
      <stop offset="100%" stop-color="#5e3f08"/>
    </linearGradient>

    <!-- station body: brushed metal -->
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#d8dde6"/>
      <stop offset="50%" stop-color="#9aa1ad"/>
      <stop offset="100%" stop-color="#4e545f"/>
    </linearGradient>

    <!-- title gradient: starlight white -> cyan -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#cfeaff"/>
      <stop offset="100%" stop-color="#5aa4e6"/>
    </linearGradient>

    <!-- soft glow for text -->
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- corona around Sun-side highlights -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <!-- Skylab symbol: orbital workshop (cylinder) + Apollo Telescope Mount (4-panel windmill) + one large surviving solar wing -->
    <symbol id="skylab" overflow="visible">
      <!-- Multiple Docking Adapter / Apollo CSM cone (front, left side) -->
      <path d="M -78 -6 L -64 -12 L -64 12 L -78 6 Z" fill="url(#hull)" stroke="#1a1e26" stroke-width="0.6"/>
      <rect x="-64" y="-12" width="6" height="24" fill="#8a909c" stroke="#1a1e26" stroke-width="0.5"/>
      <!-- Airlock module (smaller cylinder) -->
      <rect x="-58" y="-9" width="14" height="18" fill="url(#hull)" stroke="#1a1e26" stroke-width="0.5"/>
      <!-- Main Orbital Workshop (large cylinder) -->
      <rect x="-44" y="-18" width="88" height="36" rx="2" fill="url(#hull)" stroke="#1a1e26" stroke-width="0.7"/>
      <!-- hull ribs -->
      <g stroke="#3a4250" stroke-width="0.4" opacity="0.8">
        <line x1="-30" y1="-18" x2="-30" y2="18"/>
        <line x1="-14" y1="-18" x2="-14" y2="18"/>
        <line x1="2"   y1="-18" x2="2"   y2="18"/>
        <line x1="18"  y1="-18" x2="18"  y2="18"/>
        <line x1="34"  y1="-18" x2="34"  y2="18"/>
      </g>
      <!-- micrometeoroid shield band (gold thermal blanket where original shield tore off) -->
      <rect x="-44" y="-7" width="88" height="6" fill="#b8861a" opacity="0.9"/>
      <rect x="-44" y="-7" width="88" height="1.5" fill="#f0c75a"/>
      <!-- aft dome -->
      <ellipse cx="44" cy="0" rx="4" ry="18" fill="url(#hull)" stroke="#1a1e26" stroke-width="0.5"/>
      <!-- Surviving single solar wing (extending downward from workshop) -->
      <g>
        <rect x="-2" y="18" width="60" height="2" fill="#4e545f"/> <!-- boom -->
        <g transform="translate(8,20)">
          <rect x="0" y="0" width="48" height="20" fill="url(#solarGold)" stroke="#3a2606" stroke-width="0.5"/>
          <!-- cell grid -->
          <g stroke="#3a2606" stroke-width="0.3" opacity="0.7">
            <line x1="8"  y1="0" x2="8"  y2="20"/>
            <line x1="16" y1="0" x2="16" y2="20"/>
            <line x1="24" y1="0" x2="24" y2="20"/>
            <line x1="32" y1="0" x2="32" y2="20"/>
            <line x1="40" y1="0" x2="40" y2="20"/>
            <line x1="0" y1="5"  x2="48" y2="5"/>
            <line x1="0" y1="10" x2="48" y2="10"/>
            <line x1="0" y1="15" x2="48" y2="15"/>
          </g>
        </g>
      </g>
      <!-- Apollo Telescope Mount: octagonal hub on top, 4 windmill solar panels -->
      <g transform="translate(-10,-18)">
        <!-- truss tower -->
        <rect x="-1" y="0" width="2" height="-14" fill="#6a7280" transform="translate(0,-14) scale(1,-1)"/>
        <line x1="-1" y1="0"  x2="-1" y2="-14" stroke="#6a7280" stroke-width="0.4"/>
        <line x1="1"  y1="0"  x2="1"  y2="-14" stroke="#6a7280" stroke-width="0.4"/>
        <!-- ATM hub -->
        <polygon points="-7,-22 -4,-26 4,-26 7,-22 7,-16 4,-12 -4,-12 -7,-16"
                 fill="url(#hull)" stroke="#1a1e26" stroke-width="0.6"/>
        <!-- ATM windmill: 4 solar panels in cross pattern -->
        <g stroke="#3a2606" stroke-width="0.5">
          <!-- top panel -->
          <rect x="-12" y="-46" width="24" height="14" fill="url(#solarGold)"/>
          <line x1="0" y1="-32" x2="0" y2="-46" stroke="#6a7280" stroke-width="0.6"/>
          <!-- bottom panel -->
          <rect x="-12" y="-8"  width="24" height="14" fill="url(#solarGold)" opacity="0.85"/>
          <line x1="0" y1="-12" x2="0" y2="6"  stroke="#6a7280" stroke-width="0.6"/>
          <!-- left panel -->
          <rect x="-34" y="-26" width="14" height="14" fill="url(#solarGold)" opacity="0.9"/>
          <line x1="-20" y1="-19" x2="-7" y2="-19" stroke="#6a7280" stroke-width="0.6"/>
          <!-- right panel -->
          <rect x="20"  y="-26" width="14" height="14" fill="url(#solarGold)" opacity="0.9"/>
          <line x1="7"  y1="-19" x2="20" y2="-19" stroke="#6a7280" stroke-width="0.6"/>
          <!-- cell hints (top panel) -->
          <g stroke="#3a2606" stroke-width="0.25" opacity="0.6">
            <line x1="-6" y1="-46" x2="-6" y2="-32"/>
            <line x1="0"  y1="-46" x2="0"  y2="-32"/>
            <line x1="6"  y1="-46" x2="6"  y2="-32"/>
            <line x1="-12" y1="-39" x2="12" y2="-39"/>
          </g>
        </g>
      </g>
      <!-- Apollo CSM tip (capsule on far left) -->
      <path d="M -78 -6 L -86 0 L -78 6 Z" fill="#7a8090" stroke="#1a1e26" stroke-width="0.4"/>
      <!-- USA flag stripe -->
      <rect x="-30" y="-3" width="14" height="2" fill="#cc1414"/>
      <rect x="-30" y="-1" width="14" height="2" fill="#fff"/>
      <rect x="-30" y="1"  width="14" height="2" fill="#1a3a8a"/>
    </symbol>
  </defs>

  <!-- ============= SPACE BACKDROP ============= -->
  <rect width="800" height="200" fill="url(#space)"/>

  <!-- starfield (static + twinkling) -->
  <g fill="#ffffff">
    <circle cx="40"  cy="22" r="0.8"/>
    <circle cx="92"  cy="14" r="0.6"/>
    <circle cx="150" cy="40" r="0.7"/>
    <circle cx="210" cy="18" r="0.5"/>
    <circle cx="270" cy="32" r="0.8"/>
    <circle cx="330" cy="12" r="0.6"/>
    <circle cx="395" cy="28" r="0.5"/>
    <circle cx="460" cy="20" r="0.7"/>
    <circle cx="525" cy="40" r="0.6"/>
    <circle cx="595" cy="14" r="0.8"/>
    <circle cx="660" cy="32" r="0.6"/>
    <circle cx="725" cy="22" r="0.7"/>
    <circle cx="780" cy="40" r="0.5"/>
    <circle cx="20"  cy="60" r="0.6"/>
    <circle cx="118" cy="72" r="0.5"/>
    <circle cx="240" cy="64" r="0.7"/>
    <circle cx="375" cy="56" r="0.6"/>
    <circle cx="510" cy="72" r="0.5"/>
    <circle cx="640" cy="62" r="0.6"/>
    <circle cx="760" cy="70" r="0.7"/>
  </g>
  <!-- twinkling stars -->
  <g fill="#e8f4ff">
    <circle cx="70"  cy="34" r="1.1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="185" cy="50" r="1.2">
      <animate attributeName="opacity" values="1;0.2;1" dur="4.3s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="305" cy="46" r="1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="48" r="1.2">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.7s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="555" cy="50" r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5.3s" begin="-2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="44" r="1.1">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.9s" begin="-0.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============= EARTH LIMB at bottom ============= -->
  <g>
    <!-- atmospheric halo band -->
    <rect x="0" y="158" width="800" height="14" fill="url(#atmo)"/>
    <!-- curved limb (very wide ellipse) -->
    <ellipse cx="400" cy="360" rx="900" ry="200" fill="url(#earth)"/>
    <!-- cloud streaks moving slowly across limb -->
    <g opacity="0.45" fill="#e8f4ff">
      <ellipse cx="80"  cy="180" rx="60" ry="3">
        <animate attributeName="cx" values="-100;900" dur="47s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="320" cy="186" rx="80" ry="2.5">
        <animate attributeName="cx" values="-100;900" dur="59s" begin="-15s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="560" cy="178" rx="70" ry="3">
        <animate attributeName="cx" values="-100;900" dur="53s" begin="-30s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="700" cy="190" rx="50" ry="2">
        <animate attributeName="cx" values="-100;900" dur="41s" begin="-22s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- terminator highlight (top edge of limb catching sunlight) -->
    <path d="M 0 156 Q 400 144 800 156 L 800 162 Q 400 150 0 162 Z" fill="#9fd9ff" opacity="0.55" filter="url(#bloom)"/>
  </g>

  <!-- ============= SKYLAB STATION (left of center, gently orbiting) ============= -->
  <g>
    <use href="#skylab" transform="translate(150,92) rotate(-6)">
      <!-- slow orbital drift: subtle vertical bob + roll -->
      <animateTransform attributeName="transform" type="translate"
                        values="150,92; 150,89; 150,92; 150,95; 150,92"
                        dur="13s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate"
                        values="-6;-3;-6;-9;-6" dur="11s"
                        repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- sun glint on hull -->
  <circle cx="138" cy="86" r="2" fill="#ffffff" opacity="0.9" filter="url(#bloom)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- ============= ORBITAL TRAJECTORY arc (decorative dashed path) ============= -->
  <path d="M 0 150 Q 400 60 800 150" fill="none" stroke="#7fd0ff" stroke-width="0.6"
        stroke-dasharray="3 6" opacity="0.35"/>

  <!-- a tiny telemetry dot tracing the trajectory -->
  <circle r="2" fill="#ffd84a" filter="url(#bloom)">
    <animateMotion path="M 0 150 Q 400 60 800 150" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- ============= CENTER TITLE BLOCK ============= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- legibility plaque -->
    <rect x="320" y="22" width="400" height="86" rx="6" ry="6" fill="#040814" opacity="0.84"/>
    <rect x="320" y="22" width="400" height="86" rx="6" ry="6" fill="none" stroke="#5aa4e6" stroke-width="1"/>
    <!-- corner brackets like a HUD -->
    <g stroke="#7fd0ff" stroke-width="1.2" fill="none">
      <path d="M 326 30 L 326 22 L 334 22"/>
      <path d="M 706 22 L 714 22 L 714 30"/>
      <path d="M 326 100 L 326 108 L 334 108"/>
      <path d="M 706 108 L 714 108 L 714 100"/>
    </g>

    <!-- eyebrow -->
    <text x="520" y="44" font-size="10" letter-spacing="4.5" font-weight="800"
          fill="#7fd0ff" filter="url(#glow)">
      SKYLAB · LAUNCHED 14 MAY 1973
    </text>

    <!-- giant date -->
    <text x="520" y="84" font-size="40" font-weight="900" letter-spacing="3"
          fill="url(#titleGrad)" filter="url(#glow)">
      May 14, 2026
    </text>

    <!-- subtitle -->
    <text x="520" y="102" font-size="9.5" font-weight="700" letter-spacing="3"
          fill="#cfeaff" opacity="0.95">
      AMERICA'S FIRST SPACE STATION · 169 DAYS CREWED
    </text>
  </g>

  <!-- ============= TELEMETRY READOUT (top-left HUD pill) ============= -->
  <g transform="translate(20,22)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="96" height="22" rx="3" fill="#040814" stroke="#7fd0ff" stroke-width="0.8"/>
    <circle cx="9" cy="11" r="2.4" fill="#3ee07c">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="17" y="15" font-size="9" font-weight="800" fill="#7fd0ff" letter-spacing="1.6">ALT 435 KM</text>
  </g>

  <!-- ============= ORBIT COUNTER (top-right) ============= -->
  <g transform="translate(728,22)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="56" height="22" rx="3" fill="#040814" stroke="#ffd84a" stroke-width="0.8"/>
    <text x="28" y="15" font-size="9" font-weight="800" fill="#ffd84a" letter-spacing="1" text-anchor="middle">ORBIT 53Y</text>
  </g>
</svg>
