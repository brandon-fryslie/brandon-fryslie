<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Deep Blue defeats Kasparov, 29th anniversary (May 11, 1997) — chessboard, fallen king, machine-blue glow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 11, 2026 — 29 years since IBM Deep Blue defeated Garry Kasparov">
  <defs>
    <!-- machine-room gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0a1530"/>
      <stop offset="100%" stop-color="#03070f"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#1f4ed8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="boardLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#dbe7ff"/>
      <stop offset="100%" stop-color="#7a9bcc"/>
    </linearGradient>
    <linearGradient id="boardDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1f3057"/>
      <stop offset="100%" stop-color="#0a1734"/>
    </linearGradient>

    <linearGradient id="pieceWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#a9c0e5"/>
    </linearGradient>
    <linearGradient id="pieceBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7aa9ff"/>
      <stop offset="60%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#0a2a6b"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#eaf2ff"/>
      <stop offset="60%" stop-color="#9fc0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="textGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- King (fallen) -->
    <symbol id="king" overflow="visible">
      <!-- base -->
      <ellipse cx="0" cy="38" rx="22" ry="5" fill="#0a1734" opacity="0.7"/>
      <path d="M -18 38 L 18 38 L 14 30 L -14 30 Z" fill="url(#pieceWhite)"/>
      <rect x="-16" y="26" width="32" height="5" fill="url(#pieceWhite)"/>
      <!-- body -->
      <path d="M -12 26 Q -16 8 -8 0 L 8 0 Q 16 8 12 26 Z" fill="url(#pieceWhite)"/>
      <!-- collar -->
      <rect x="-13" y="-2" width="26" height="4" fill="#cfd9ea"/>
      <!-- head -->
      <ellipse cx="0" cy="-10" rx="9" ry="10" fill="url(#pieceWhite)"/>
      <!-- cross -->
      <rect x="-1.2" y="-30" width="2.4" height="14" fill="#eaf2ff"/>
      <rect x="-5"   y="-24" width="10"  height="2.4" fill="#eaf2ff"/>
      <!-- shadow detail -->
      <path d="M -8 0 Q -4 16 -8 26" stroke="#7a8fb0" stroke-width="0.8" fill="none" opacity="0.5"/>
      <path d="M  8 0 Q  4 16  8 26" stroke="#7a8fb0" stroke-width="0.8" fill="none" opacity="0.5"/>
    </symbol>

    <!-- Knight (Deep Blue's piece, stylized profile) -->
    <symbol id="knight" overflow="visible">
      <ellipse cx="0" cy="38" rx="22" ry="5" fill="#03070f" opacity="0.8"/>
      <path d="M -18 38 L 18 38 L 14 30 L -14 30 Z" fill="url(#pieceBlue)"/>
      <rect x="-16" y="26" width="32" height="5" fill="url(#pieceBlue)"/>
      <!-- horse head silhouette -->
      <path d="M -10 26
               L -10 6
               Q -10 -6 0 -14
               Q 8 -20 14 -16
               Q 18 -10 14 -4
               L 8 -4
               Q 6 -2 8 2
               L 14 6
               Q 12 16 6 18
               L 10 26 Z"
            fill="url(#pieceBlue)"/>
      <!-- mane -->
      <path d="M -10 6 Q -4 0 -2 -10 Q -6 -12 -10 -2 Z" fill="#0a2a6b"/>
      <!-- eye (LED) -->
      <circle cx="6" cy="-10" r="1.4" fill="#9fdcff">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </symbol>

    <!-- 4x4 board tile pattern (rotated for perspective) -->
    <symbol id="boardCell" overflow="visible">
      <rect width="20" height="20"/>
    </symbol>
  </defs>

  <!-- ============= BACKDROP ============= -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#coreGlow)"/>

  <!-- subtle horizontal scanlines -->
  <g stroke="#1f6feb" stroke-width="0.4" opacity="0.08">
    <line x1="0" y1="40"  x2="800" y2="40"/>
    <line x1="0" y1="80"  x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
  </g>

  <!-- ============= BACKGROUND NOTATION RIBBON ============= -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#3b82f6" opacity="0.35">
    <text x="0" y="20">
      1. Nf3 d5  2. g3 Bg4  3. b3 Nd7  4. Bb2 e6  5. Bg2 Ngf6  6. O-O c6  7. d3 Bd6  8. Nbd2 O-O  9. h3 Bh5
      <animate attributeName="x" values="0;-360;0" dur="29s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="194" opacity="0.7">
      10. e3 h6  11. Qe1 Qa5  12. a3 Bc7  13. Nh4 g5  14. Nhf3 e5  15. e4 Rfe8  16. Nh2 Qb6  17. Qc1 a5  18. Re1 Bd6  19. Ndf1 dxe4  20. dxe4 Bc5  21. Ne3 Rad8  22. Nhf1 g4  23. hxg4 Nxg4  24. f3 Nxe3
      <animate attributeName="x" values="-160;0;-160" dur="31s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ============= LEFT: CHESSBOARD IN PERSPECTIVE ============= -->
  <g transform="translate(120,108) skewX(-22) scale(1,0.55)">
    <!-- 8x8 board, alternating tiles -->
    <g>
      <!-- row 0 -->
      <rect x="0"   y="0" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="20"  y="0" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="40"  y="0" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="60"  y="0" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="80"  y="0" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="100" y="0" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="120" y="0" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="140" y="0" width="20" height="20" fill="url(#boardDark)"/>
      <!-- row 1 -->
      <rect x="0"   y="20" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="20"  y="20" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="40"  y="20" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="60"  y="20" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="80"  y="20" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="100" y="20" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="120" y="20" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="140" y="20" width="20" height="20" fill="url(#boardLight)"/>
      <!-- row 2 -->
      <rect x="0"   y="40" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="20"  y="40" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="40"  y="40" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="60"  y="40" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="80"  y="40" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="100" y="40" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="120" y="40" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="140" y="40" width="20" height="20" fill="url(#boardDark)"/>
      <!-- row 3 -->
      <rect x="0"   y="60" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="20"  y="60" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="40"  y="60" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="60"  y="60" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="80"  y="60" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="100" y="60" width="20" height="20" fill="url(#boardLight)"/>
      <rect x="120" y="60" width="20" height="20" fill="url(#boardDark)"/>
      <rect x="140" y="60" width="20" height="20" fill="url(#boardLight)"/>
    </g>

    <!-- pulse highlights walking across tiles (the move) -->
    <rect x="60" y="40" width="20" height="20" fill="#3b82f6" opacity="0.7">
      <animate attributeName="opacity" values="0;0.85;0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="20" width="20" height="20" fill="#3b82f6" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="7s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="40" width="20" height="20" fill="#3b82f6" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="7s" begin="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- board border (un-skewed, drawn separately for clean rectangle around the perspective board) -->
  <g opacity="0.5">
    <path d="M 84 108 L 244 108 L 209 188 L 49 188 Z" fill="none" stroke="#3b82f6" stroke-width="0.6"/>
  </g>

  <!-- ============= KNIGHT (BLUE) on the left of board ============= -->
  <g transform="translate(98,148)">
    <use href="#knight" transform="scale(0.7)"/>
  </g>

  <!-- ============= FALLEN KING on the right (resignation) ============= -->
  <g transform="translate(218,168) rotate(78)">
    <use href="#king" transform="scale(0.7)"/>
  </g>

  <!-- ============= RIGHT SIDE: DEEP BLUE TOWER ============= -->
  <g transform="translate(640,40)">
    <!-- subtle floor shadow -->
    <ellipse cx="40" cy="148" rx="60" ry="6" fill="#000" opacity="0.5"/>
    <!-- the cabinet -->
    <rect x="0" y="0" width="80" height="148" rx="3" fill="#0a1734" stroke="#1f4ed8" stroke-width="0.7"/>
    <rect x="0" y="0" width="80" height="148" rx="3" fill="url(#pieceBlue)" opacity="0.18"/>
    <!-- top label -->
    <rect x="6" y="6" width="68" height="14" rx="2" fill="#03070f"/>
    <text x="40" y="16" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="8"
          fill="#7aa9ff" text-anchor="middle" letter-spacing="2">DEEP BLUE</text>
    <!-- LED grid -->
    <g font-family="ui-monospace, monospace" font-size="6">
      <!-- row of glowing LEDs -->
      <g>
        <circle cx="14" cy="34" r="2.2" fill="#1f6feb">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="26" cy="34" r="2.2" fill="#1f6feb">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="38" cy="34" r="2.2" fill="#9fdcff">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="0.9s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="34" r="2.2" fill="#1f6feb">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="62" cy="34" r="2.2" fill="#9fdcff">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- "readout" panel -->
      <rect x="10" y="46" width="60" height="42" rx="1.5" fill="#03070f" stroke="#1f4ed8" stroke-width="0.5"/>
      <text x="14" y="56" fill="#7aa9ff">eval: +∞</text>
      <text x="14" y="66" fill="#9fdcff">depth: 12</text>
      <text x="14" y="76" fill="#7aa9ff">move: Nf3</text>
      <text x="14" y="86" fill="#3b82f6" opacity="0.7">
        nodes/s
        <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2s" repeatCount="indefinite"/>
      </text>
      <!-- ventilation slots -->
      <g stroke="#03070f" stroke-width="1.2">
        <line x1="10" y1="96"  x2="70" y2="96"/>
        <line x1="10" y1="102" x2="70" y2="102"/>
        <line x1="10" y1="108" x2="70" y2="108"/>
        <line x1="10" y1="114" x2="70" y2="114"/>
        <line x1="10" y1="120" x2="70" y2="120"/>
        <line x1="10" y1="126" x2="70" y2="126"/>
        <line x1="10" y1="132" x2="70" y2="132"/>
      </g>
      <!-- power LED -->
      <circle cx="68" cy="142" r="1.6" fill="#9fdcff">
        <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- subtle data sparks rising from cabinet -->
  <g fill="#9fdcff" opacity="0.85">
    <circle cx="680" cy="40" r="1.2">
      <animate attributeName="cy" values="40;-20" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="40" r="0.9">
      <animate attributeName="cy" values="40;-20" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="40" r="1.1">
      <animate attributeName="cy" values="40;-20" dur="13s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="715" cy="40" r="0.8">
      <animate attributeName="cy" values="40;-20" dur="9s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="-3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============= CENTER TITLE BLOCK ============= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- legibility plaque -->
    <rect x="280" y="42" width="320" height="116" rx="10" ry="10" fill="#03070f" opacity="0.62"/>
    <rect x="280" y="42" width="320" height="116" rx="10" ry="10" fill="none" stroke="#1f4ed8" stroke-width="0.6" opacity="0.65"/>

    <!-- eyebrow -->
    <text x="440" y="68" font-size="10" letter-spacing="6" font-weight="700"
          fill="#9fc0ff" filter="url(#textGlow)">
      DEEP BLUE DEFEATS KASPAROV · 29 YEARS
    </text>

    <!-- giant date -->
    <text x="440" y="114" font-size="40" font-weight="900" letter-spacing="2"
          fill="url(#titleGrad)" filter="url(#textGlow)">
      May 11, 2026
    </text>

    <!-- subtitle: the move that ended it -->
    <text x="440" y="138" font-size="9.5" font-weight="700" letter-spacing="4"
          fill="#cfd9ea" opacity="0.92">
      GAME 6 · NEW YORK · MAY 11, 1997
    </text>

    <!-- tiny pulse dots flanking the date -->
    <circle cx="312" cy="100" r="2.8" fill="#3b82f6" filter="url(#bloom)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="568" cy="100" r="2.8" fill="#3b82f6" filter="url(#bloom)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- thin progress bar under subtitle -->
    <rect x="334" y="146" width="212" height="2" rx="1" fill="#1f4ed8" opacity="0.4"/>
    <rect x="334" y="146" width="50" height="2" rx="1" fill="#9fdcff">
      <animate attributeName="x" values="334;496;334" dur="13s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
