<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: World Press Freedom Day (May 3) — UNESCO observance; typewriter, newsprint masthead, ink -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 3, 2026 — World Press Freedom Day">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10141c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6efd9"/>
      <stop offset="100%" stop-color="#e4d9bc"/>
    </linearGradient>

    <linearGradient id="paperEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c79a"/>
      <stop offset="100%" stop-color="#b8a577"/>
    </linearGradient>

    <linearGradient id="redInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6a6a"/>
      <stop offset="100%" stop-color="#c8323e"/>
    </linearGradient>

    <filter id="paperTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.05
                             0 0 0 0 0.05
                             0 0 0 0 0.04
                             0 0 0 0.10 0"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.55
                             0 0 0 0 0.50
                             0 0 0 0 0.40
                             0 0 0 0.06 0"/>
    </filter>

    <!-- typewriter key body -->
    <symbol id="key" overflow="visible">
      <g>
        <rect x="-9" y="-9" width="18" height="18" rx="3"
              fill="#1b1b1b" stroke="#3a3a3a" stroke-width="0.8"/>
        <rect x="-7" y="-7" width="14" height="14" rx="2"
              fill="#0f0f0f" opacity="0.6"/>
      </g>
    </symbol>

    <!-- a single small newsprint sheet -->
    <symbol id="sheet" overflow="visible">
      <g>
        <rect x="-22" y="-28" width="44" height="56" fill="url(#paper)"
              stroke="#a89060" stroke-width="0.4"/>
        <rect x="-22" y="-28" width="44" height="6" fill="#1a1a1a" opacity="0.85"/>
        <g stroke="#1a1a1a" stroke-width="0.5" opacity="0.55">
          <line x1="-18" y1="-18" x2="18" y2="-18"/>
          <line x1="-18" y1="-14" x2="14" y2="-14"/>
          <line x1="-18" y1="-10" x2="18" y2="-10"/>
          <line x1="-18" y1="-6" x2="10" y2="-6"/>
          <line x1="-18" y1="2" x2="18" y2="2"/>
          <line x1="-18" y1="6" x2="18" y2="6"/>
          <line x1="-18" y1="10" x2="14" y2="10"/>
          <line x1="-18" y1="14" x2="18" y2="14"/>
          <line x1="-18" y1="18" x2="12" y2="18"/>
          <line x1="-18" y1="22" x2="18" y2="22"/>
        </g>
      </g>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- subtle vertical column rules across whole thing (broadsheet feel) -->
  <g stroke="#1c2433" stroke-width="0.6" opacity="0.55">
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>

  <!-- ============================================ -->
  <!-- LEFT: TYPEWRITER                             -->
  <!-- ============================================ -->
  <g transform="translate(110,118)">

    <!-- platen / paper rolled in -->
    <g>
      <!-- the sheet rising as text is "typed" -->
      <g>
        <rect x="-46" y="-86" width="92" height="64" fill="url(#paper)"
              stroke="#a89060" stroke-width="0.6"/>
        <!-- typed lines that progressively appear -->
        <g fill="#1a1a1a" opacity="0.85" font-family="Courier, 'Courier New', monospace" font-size="6" font-weight="700">
          <text x="-40" y="-76" opacity="0">
            FREE PRESS
            <animate attributeName="opacity" values="0;0;1;1;1;1" keyTimes="0;0.10;0.18;0.95;0.98;1" dur="13s" repeatCount="indefinite"/>
          </text>
          <text x="-40" y="-68" opacity="0">
            REPORT WITHOUT
            <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.30;0.40;0.95;1" dur="13s" repeatCount="indefinite"/>
          </text>
          <text x="-40" y="-60" opacity="0">
            FEAR OR FAVOR
            <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.55;0.65;0.95;1" dur="13s" repeatCount="indefinite"/>
          </text>
          <text x="-40" y="-52" opacity="0">
            ____________
            <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.80;0.88;0.95;1" dur="13s" repeatCount="indefinite"/>
          </text>
        </g>
        <!-- blinking caret -->
        <rect x="-39" y="-50" width="5" height="1" fill="#1a1a1a">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- platen roller -->
      <ellipse cx="0" cy="-22" rx="56" ry="6" fill="#2b2b2b" stroke="#3e3e3e" stroke-width="0.6"/>
      <ellipse cx="-56" cy="-22" rx="4" ry="6" fill="#3a3a3a"/>
      <ellipse cx="56" cy="-22" rx="4" ry="6" fill="#3a3a3a"/>

      <!-- typewriter body -->
      <path d="M-62,-18 L62,-18 L70,8 L-70,8 Z" fill="#1f1f24" stroke="#3a3a42" stroke-width="0.9"/>
      <!-- ribbon spools -->
      <circle cx="-44" cy="-8" r="5" fill="#0f0f0f" stroke="#444" stroke-width="0.6"/>
      <circle cx="44" cy="-8" r="5" fill="#0f0f0f" stroke="#444" stroke-width="0.6"/>
      <!-- ribbon -->
      <path d="M-44,-8 Q0,-2 44,-8" stroke="#c8323e" stroke-width="1.2" fill="none" opacity="0.85"/>

      <!-- type bar striking (rotating into place) -->
      <g transform="translate(0,-12)" style="transform-box: fill-box; transform-origin: 0 14px;">
        <path d="M0,14 L0,-2" stroke="#d4d4d4" stroke-width="1" stroke-linecap="round"/>
        <rect x="-3" y="-6" width="6" height="4" fill="#e8e8e8"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-55;0;-55;-30;-55"
                          keyTimes="0;0.05;0.10;0.15;1"
                          dur="0.9s" repeatCount="indefinite"/>
      </g>

      <!-- keyboard rows -->
      <g transform="translate(0,16)">
        <g>
          <use href="#key" transform="translate(-44,0) scale(0.55)"/>
          <use href="#key" transform="translate(-30,0) scale(0.55)"/>
          <use href="#key" transform="translate(-16,0) scale(0.55)"/>
          <use href="#key" transform="translate(-2,0) scale(0.55)"/>
          <use href="#key" transform="translate(12,0) scale(0.55)"/>
          <use href="#key" transform="translate(26,0) scale(0.55)"/>
          <use href="#key" transform="translate(40,0) scale(0.55)"/>
          <use href="#key" transform="translate(54,0) scale(0.55)"/>
        </g>
        <g transform="translate(7,12)">
          <use href="#key" transform="translate(-44,0) scale(0.55)"/>
          <use href="#key" transform="translate(-30,0) scale(0.55)"/>
          <use href="#key" transform="translate(-16,0) scale(0.55)"/>
          <use href="#key" transform="translate(-2,0) scale(0.55)"/>
          <use href="#key" transform="translate(12,0) scale(0.55)"/>
          <use href="#key" transform="translate(26,0) scale(0.55)"/>
          <use href="#key" transform="translate(40,0) scale(0.55)"/>
        </g>
      </g>

      <!-- carriage return arm -->
      <path d="M-66,-22 L-78,-30" stroke="#c8323e" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-78" cy="-30" r="2.2" fill="#c8323e"/>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- TYPEWRITER LABEL caption (small)             -->
  <!-- ============================================ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     fill="#8a96ad" font-size="8" letter-spacing="2" text-anchor="middle">
    <text x="110" y="180">UNESCO · OBSERVED SINCE 1993</text>
  </g>

  <!-- ============================================ -->
  <!-- DRIFTING NEWSPRINT SHEETS                    -->
  <!-- ============================================ -->
  <g opacity="0.55">
    <g transform="translate(255,40)">
      <use href="#sheet" transform="rotate(-12)">
        <animateTransform attributeName="transform" type="rotate"
                          values="-14;-8;-14" dur="11s" repeatCount="indefinite"/>
      </use>
      <animateTransform attributeName="transform" type="translate"
                        values="255,40;260,46;255,40" dur="11s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(285,170)" opacity="0.8">
      <use href="#sheet" transform="rotate(8) scale(0.8)">
        <animateTransform attributeName="transform" type="rotate"
                          values="6;14;6" dur="13s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(720,160)" opacity="0.6">
      <use href="#sheet" transform="rotate(-6) scale(0.7)">
        <animateTransform attributeName="transform" type="rotate"
                          values="-10;-2;-10" dur="17s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- CENTER-RIGHT: NEWSPAPER MASTHEAD             -->
  <!-- ============================================ -->
  <g transform="translate(220,18)">
    <!-- the broadsheet rectangle -->
    <rect x="0" y="0" width="560" height="164" fill="url(#paper)"
          stroke="#8c7a4d" stroke-width="0.9"/>
    <!-- paper texture overlay -->
    <rect x="0" y="0" width="560" height="164" filter="url(#paperTex)" opacity="0.7"/>
    <rect x="0" y="0" width="560" height="164" filter="url(#grain)" opacity="0.55"/>

    <!-- top rule -->
    <line x1="14" y1="14" x2="546" y2="14" stroke="#2a2418" stroke-width="0.8"/>

    <!-- masthead micro-info row -->
    <g font-family="Georgia, 'Times New Roman', serif" fill="#3b3220" font-size="8" letter-spacing="2">
      <text x="22" y="26">VOL. CIII · NO. 123</text>
      <text x="280" y="26" text-anchor="middle" font-style="italic">— THE DAILY HIGHLIGHT —</text>
      <text x="538" y="26" text-anchor="end">SUNDAY EDITION</text>
    </g>

    <!-- second rule -->
    <line x1="14" y1="34" x2="546" y2="34" stroke="#2a2418" stroke-width="0.6"/>
    <line x1="14" y1="36.5" x2="546" y2="36.5" stroke="#2a2418" stroke-width="0.3"/>

    <!-- HEADLINE / DATE -->
    <text x="280" y="92" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="56" font-weight="900" fill="#1a1208"
          letter-spacing="-1">
      MAY 3, 2026
    </text>

    <!-- red overline kicker — animated stroke -->
    <g>
      <text x="280" y="56" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="11" font-weight="800" fill="url(#redInk)"
            letter-spacing="6">
        WORLD PRESS FREEDOM DAY
      </text>
      <!-- "stamped" underline that animates in -->
      <path d="M120,62 L440,62" stroke="#c8323e" stroke-width="1.4"
            stroke-dasharray="320" stroke-dashoffset="320">
        <animate attributeName="stroke-dashoffset" values="320;0;0;320"
                 keyTimes="0;0.30;0.92;1" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- subhead -->
    <text x="280" y="116" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="13" font-style="italic" fill="#3b3220" letter-spacing="0.5">
      The right to seek, to receive, and to impart information.
    </text>

    <!-- byline rule + bylines -->
    <line x1="60" y1="128" x2="500" y2="128" stroke="#2a2418" stroke-width="0.5" opacity="0.7"/>
    <g font-family="Georgia, 'Times New Roman', serif" fill="#4a3f25" font-size="8.5" letter-spacing="1">
      <text x="60" y="142">By the Free Press · Filed under: democracy, accountability, ink</text>
    </g>

    <!-- two faux columns at the bottom: tiny lines -->
    <g stroke="#3b3220" stroke-width="0.6" opacity="0.55">
      <g transform="translate(60,148)">
        <line x1="0" y1="0" x2="180" y2="0"/>
        <line x1="0" y1="3" x2="180" y2="3"/>
        <line x1="0" y1="6" x2="160" y2="6"/>
        <line x1="0" y1="9" x2="180" y2="9"/>
        <line x1="0" y1="12" x2="120" y2="12"/>
      </g>
      <g transform="translate(280,148)">
        <line x1="0" y1="0" x2="180" y2="0"/>
        <line x1="0" y1="3" x2="170" y2="3"/>
        <line x1="0" y1="6" x2="180" y2="6"/>
        <line x1="0" y1="9" x2="140" y2="9"/>
        <line x1="0" y1="12" x2="180" y2="12"/>
      </g>
    </g>

    <!-- center divider between the two columns -->
    <line x1="265" y1="146" x2="265" y2="160" stroke="#3b3220" stroke-width="0.4" opacity="0.6"/>

    <!-- "STOP THE PRESSES" red corner stamp -->
    <g transform="translate(498,148) rotate(-9)">
      <rect x="-44" y="-10" width="88" height="20" fill="none"
            stroke="#c8323e" stroke-width="1.4" rx="1"/>
      <text x="0" y="4" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="9" font-weight="800" fill="#c8323e" letter-spacing="2">
        EST. 1993
      </text>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- INK SPLATTER / DROPS animated near typewriter ribbon -->
  <!-- ============================================ -->
  <g fill="#c8323e" opacity="0.85">
    <circle cx="80" cy="118" r="0">
      <animate attributeName="r" values="0;1.6;0" dur="3.1s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="cy" values="118;128;118" dur="3.1s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="142" cy="120" r="0">
      <animate attributeName="r" values="0;1.4;0" dur="2.7s" repeatCount="indefinite" begin="-1.1s"/>
      <animate attributeName="cy" values="120;130;120" dur="2.7s" repeatCount="indefinite" begin="-1.1s"/>
    </circle>
    <circle cx="110" cy="124" r="0">
      <animate attributeName="r" values="0;1.0;0" dur="2.3s" repeatCount="indefinite" begin="-0.6s"/>
    </circle>
  </g>

  <!-- ============================================ -->
  <!-- SCATTERED PRINTING-PRESS LETTERS drifting up -->
  <!-- ============================================ -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="900" fill="#c9b894" opacity="0.45">
    <text x="40" y="40" font-size="14">A
      <animate attributeName="y" values="40;20;40" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.0;0.55;0.0" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="170" y="60" font-size="11">P
      <animate attributeName="y" values="60;30;60" dur="13s" repeatCount="indefinite" begin="-3s"/>
      <animate attributeName="opacity" values="0.0;0.5;0.0" dur="13s" repeatCount="indefinite" begin="-3s"/>
    </text>
    <text x="200" y="50" font-size="13">!
      <animate attributeName="y" values="50;14;50" dur="17s" repeatCount="indefinite" begin="-7s"/>
      <animate attributeName="opacity" values="0.0;0.55;0.0" dur="17s" repeatCount="indefinite" begin="-7s"/>
    </text>
    <text x="60" y="80" font-size="12">§
      <animate attributeName="y" values="80;40;80" dur="19s" repeatCount="indefinite" begin="-2s"/>
      <animate attributeName="opacity" values="0.0;0.5;0.0" dur="19s" repeatCount="indefinite" begin="-2s"/>
    </text>
  </g>
</svg>
