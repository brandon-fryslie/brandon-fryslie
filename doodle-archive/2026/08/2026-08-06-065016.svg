<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: The Beatles' Revolver — 60th Anniversary (UK release August 5, 1966). Their seventh studio album, released by Parlophone on 5 August 1966, that closed the "touring years" and opened Beatles psychedelia: tape loops, artificial double-tracking, reversed guitars, Indian classical instruments, and studio-as-instrument techniques. Signature tracks: "Eleanor Rigby," "Tomorrow Never Knows," "Taxman," "Yellow Submarine." Composition on the 800x200 canvas: on the left third, a large black vinyl LP with a magenta Parlophone-style center label spins continuously; behind and around the record, two concentric layers of kaleidoscopic elliptical petals in hot-pink/orange/teal/yellow/lavender rotate slowly in opposite directions; a stylized tone-arm angles in from the upper-right onto the record's edge; small psychedelic dots drift upward through the whole background. On the right, a huge cream AUGUST 5, 2026 headline underlined by a teal sweep, a hot-pink REVOLVER subhead trailed by teal · 60 YEARS, italic amber tertiary THE BEATLES · PARLOPHONE · 5 AUGUST 1966, dim-lavender tertiary TAPE LOOPS · SITAR · BACKMASKING · STUDIO AS INSTRUMENT, and a Georgia-italic quote "Turn off your mind, relax and float downstream" at the base. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 5, 2026 — 60th anniversary of the Beatles' Revolver album (released by Parlophone on 5 August 1966). On the left third, a large black vinyl LP with a magenta Parlophone-style center label continuously rotates; behind it two concentric layers of kaleidoscopic elliptical petals in hot pink, orange, teal, yellow, and lavender rotate slowly in opposite directions; a stylized tone-arm angles in from the upper right onto the record's edge; small psychedelic dots drift upward through the background. On the right, a huge cream AUGUST 5, 2026 headline underlined by a teal sweep, a hot-pink REVOLVER subhead trailed by teal 60 YEARS, italic amber THE BEATLES · PARLOPHONE · 5 AUGUST 1966 tertiary, dim-lavender TAPE LOOPS · SITAR · BACKMASKING · STUDIO AS INSTRUMENT tertiary, and a Georgia-italic quote 'Turn off your mind, relax and float downstream' at the base.">
  <defs>
    <!-- Background: near-black with a purple wash toward the record side -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150820"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Warm psychedelic glow anchored under the record -->
    <radialGradient id="glow" cx="0.17" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#e84a7a" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#7a2668" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Vinyl body: dark with a subtle off-center sheen -->
    <radialGradient id="vinyl" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#2a2632"/>
      <stop offset="0.5" stop-color="#141018"/>
      <stop offset="1" stop-color="#08060c"/>
    </radialGradient>

    <!-- Center label: magenta with a slightly darker rim -->
    <radialGradient id="label" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f34a86"/>
      <stop offset="0.85" stop-color="#c81f5c"/>
      <stop offset="1" stop-color="#9c134b"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <!-- Reusable petal ellipse (tall, pointing up from center) -->
    <ellipse id="petalA" cx="0" cy="-58" rx="11" ry="44"/>
    <ellipse id="petalB" cx="0" cy="-88" rx="6" ry="20"/>

    <style>
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800; letter-spacing: 1.4px; fill: #fbe6c8;
      }
      .subhead-pink {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800; letter-spacing: 3.2px; fill: #f24985;
      }
      .subhead-teal {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700; letter-spacing: 3.2px; fill: #4dd0c8;
      }
      .tertiary {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-style: italic; font-weight: 600; letter-spacing: 1.3px; fill: #f2b47a;
      }
      .tertiary-dim {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-style: italic; font-weight: 600; letter-spacing: 1.3px; fill: #a595c4;
      }
      .quote {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-style: italic; font-weight: 400; letter-spacing: 0.5px; fill: #b89fe0;
      }
    </style>
  </defs>

  <!-- ================ BACKGROUND ================ -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#glow)"/>

  <!-- ================ KALEIDOSCOPIC PETALS (behind record) ================ -->
  <!-- Outer petal ring: 12 petals rotating clockwise slowly (37s) -->
  <g transform="translate(130 100)">
    <g opacity="0.55">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="37s" repeatCount="indefinite"/>
      <use href="#petalA" fill="#f24985"/>
      <use href="#petalA" fill="#ff8c3a" transform="rotate(30)"/>
      <use href="#petalA" fill="#4dd0c8" transform="rotate(60)"/>
      <use href="#petalA" fill="#e6c73a" transform="rotate(90)"/>
      <use href="#petalA" fill="#b89fe0" transform="rotate(120)"/>
      <use href="#petalA" fill="#f24985" transform="rotate(150)"/>
      <use href="#petalA" fill="#ff8c3a" transform="rotate(180)"/>
      <use href="#petalA" fill="#4dd0c8" transform="rotate(210)"/>
      <use href="#petalA" fill="#e6c73a" transform="rotate(240)"/>
      <use href="#petalA" fill="#b89fe0" transform="rotate(270)"/>
      <use href="#petalA" fill="#f24985" transform="rotate(300)"/>
      <use href="#petalA" fill="#ff8c3a" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Second petal ring: fewer/thinner petals rotating counterclockwise (53s), offset -->
  <g transform="translate(130 100)">
    <g opacity="0.5">
      <animateTransform attributeName="transform" type="rotate"
        from="360" to="0" dur="53s" repeatCount="indefinite"/>
      <use href="#petalB" fill="#b89fe0" transform="rotate(15)"/>
      <use href="#petalB" fill="#f24985" transform="rotate(60)"/>
      <use href="#petalB" fill="#4dd0c8" transform="rotate(105)"/>
      <use href="#petalB" fill="#e6c73a" transform="rotate(150)"/>
      <use href="#petalB" fill="#ff8c3a" transform="rotate(195)"/>
      <use href="#petalB" fill="#b89fe0" transform="rotate(240)"/>
      <use href="#petalB" fill="#f24985" transform="rotate(285)"/>
      <use href="#petalB" fill="#4dd0c8" transform="rotate(330)"/>
    </g>
  </g>

  <!-- ================ DRIFTING PSYCHEDELIC DOTS ================ -->
  <g>
    <circle cx="60" cy="210" r="2" fill="#f24985" opacity="0.7">
      <animate attributeName="cy" values="210;-10;210" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="210" r="1.6" fill="#4dd0c8" opacity="0.6">
      <animate attributeName="cy" values="210;-10;210" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="210" r="2.4" fill="#e6c73a" opacity="0.6">
      <animate attributeName="cy" values="210;-10;210" dur="17s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="17s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="210" r="1.8" fill="#ff8c3a" opacity="0.7">
      <animate attributeName="cy" values="210;-10;210" dur="19s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="19s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="210" r="1.4" fill="#b89fe0" opacity="0.6">
      <animate attributeName="cy" values="210;-10;210" dur="23s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="23s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================ VINYL LP ================ -->
  <g transform="translate(130 100)">
    <!-- Disc body -->
    <circle r="78" fill="url(#vinyl)"/>
    <!-- Concentric groove rings -->
    <g fill="none" stroke="#28242f" stroke-width="0.35" opacity="0.9">
      <circle r="74"/><circle r="70"/><circle r="66"/><circle r="62"/><circle r="58"/>
      <circle r="54"/><circle r="50"/><circle r="46"/><circle r="42"/><circle r="38"/>
    </g>
    <!-- Sparse brighter reflective rings -->
    <g fill="none" stroke="#524759" stroke-width="0.35" opacity="0.55">
      <circle r="72"/><circle r="60"/><circle r="48"/>
    </g>
    <!-- Outer edge highlight -->
    <circle r="78" fill="none" stroke="#3a3548" stroke-width="0.6" opacity="0.8"/>

    <!-- Rotating group: label + reflection sheen -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="7s" repeatCount="indefinite"/>
      <!-- Reflection sheen on the vinyl surface (rotates with disc) -->
      <path d="M -66 -24 A 74 74 0 0 1 -22 -70 L -18 -54 A 56 56 0 0 0 -50 -18 Z"
            fill="#5a4f66" opacity="0.28"/>
      <!-- Center label -->
      <circle r="28" fill="url(#label)"/>
      <!-- Thin ring on the label -->
      <circle r="24.5" fill="none" stroke="#f8b3cd" stroke-width="0.4" opacity="0.7"/>
      <!-- Label title -->
      <text x="0" y="-4" text-anchor="middle"
            font-family="'Georgia','Times New Roman',serif"
            font-style="italic" font-weight="700" font-size="7"
            fill="#fbe6c8">Revolver</text>
      <!-- Label subtitle -->
      <text x="0" y="6" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-weight="700" font-size="3.6"
            fill="#fbe6c8" letter-spacing="0.6">THE BEATLES</text>
      <text x="0" y="13" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-weight="600" font-size="2.8"
            fill="#fbe6c8" opacity="0.85" letter-spacing="0.8">PARLOPHONE · 1966</text>
      <text x="0" y="19" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-weight="600" font-size="2.6"
            fill="#fbe6c8" opacity="0.7" letter-spacing="0.6">33⅓ RPM</text>
      <!-- Spindle hole -->
      <circle r="1.7" fill="#08060c"/>
      <circle r="1.7" fill="none" stroke="#463d54" stroke-width="0.3"/>
    </g>
  </g>

  <!-- ================ TONE ARM ================ -->
  <!-- Pivot at upper right of the record, arm angling down onto the disc edge -->
  <g>
    <!-- Pivot base -->
    <circle cx="238" cy="24" r="5" fill="#3f3a4a"/>
    <circle cx="238" cy="24" r="2.4" fill="#8a8595"/>
    <!-- Counterweight (short stub behind pivot) -->
    <rect x="240" y="20" width="9" height="8" rx="2" fill="#5a5563"/>
    <!-- Arm -->
    <line x1="238" y1="24" x2="176" y2="76" stroke="#8a8595" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="238" y1="24" x2="176" y2="76" stroke="#d0cbdb" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/>
    <!-- Headshell -->
    <g transform="translate(176 76) rotate(40)">
      <rect x="-6" y="-1" width="12" height="7" rx="1.4" fill="#403847"/>
      <rect x="-2" y="5" width="4" height="2.4" fill="#1a1420"/>
    </g>
  </g>

  <!-- ================ TEXT COLUMN (right) ================ -->

  <!-- Faint glow behind headline for warmth -->
  <g filter="url(#soft)" opacity="0.55">
    <text x="300" y="72" class="headline" font-size="40" fill="#f24985">AUGUST 5, 2026</text>
  </g>
  <!-- Huge date headline -->
  <text x="300" y="72" class="headline" font-size="40">AUGUST 5, 2026</text>

  <!-- Teal underline sweep -->
  <line x1="300" y1="86" x2="300" y2="86" stroke="#4dd0c8" stroke-width="1.6" opacity="0.9">
    <animate attributeName="x2" values="300;720;720;300"
             keyTimes="0;0.35;0.85;1" dur="13s" repeatCount="indefinite"/>
  </line>

  <!-- Subhead: pink title + teal duration -->
  <text x="300" y="110" font-size="14">
    <tspan class="subhead-pink">REVOLVER</tspan><tspan class="subhead-teal">  ·  60 YEARS</tspan>
  </text>

  <!-- Tertiary lines -->
  <text x="300" y="134" class="tertiary" font-size="11">THE BEATLES  ·  PARLOPHONE  ·  5 AUGUST 1966</text>
  <text x="300" y="152" class="tertiary-dim" font-size="10.5">TAPE LOOPS  ·  SITAR  ·  BACKMASKING  ·  STUDIO AS INSTRUMENT</text>

  <!-- Base quote -->
  <text x="300" y="180" class="quote" font-size="11">&quot;Turn off your mind, relax and float downstream.&quot;</text>

</svg>
