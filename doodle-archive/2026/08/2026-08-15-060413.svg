<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Pakistan Independence Day — 79th Anniversary (August 14, 1947) -->
<!-- about:
On 14 August 1947, the Dominion of Pakistan was born at the stroke of midnight as the British Raj was partitioned into two sovereign states — the culmination of the Pakistan Movement led by Muhammad Ali Jinnah. Yom-e-Azadi (Independence Day) is marked with the national flag flying over every home, ministerial addresses at Karachi's Mazar-e-Quaid, a 31-gun salute in the federal capital and 21 guns in each provincial capital, and green-and-white lights strung along public buildings. Seventy-nine years today.

The left half is the crescent-and-star flag of Pakistan hoisted on a wooden pole: the white hoist stripe, the deep green field, and the white crescent cradling its five-pointed star, all displaced by a slow ripple as if caught in a low evening wind. Green and white confetti drifts upward like fireworks paper. On the right, a large cream AUGUST 14, 2026 headline anchors a green PAKISTAN INDEPENDENCE DAY subhead, a gold 79 YEARS · YOM-E-AZADI tertiary, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 14, 2026 — the 79th Pakistan Independence Day. On the left half, the crescent-and-star flag of Pakistan waves against a dark backdrop from a wooden pole with a gold finial: a white hoist stripe on the left quarter, a deep green field on the right three quarters bearing a tilted white crescent moon cradling a five-pointed white star. Green and white paper confetti drifts upward like fireworks scraps against a scatter of distant stars. On the right, a huge cream AUGUST 14, 2026 headline underlined by a green-to-white sweep, a green PAKISTAN INDEPENDENCE DAY subhead trailed by cream · SINCE 1947, italic amber 79 YEARS · YOM-E-AZADI tertiary, dim-cyan JINNAH · IQBAL · LIAQUAT · FATIMA tertiary, and a Georgia-italic 'Ittehad, Yaqeen, Tanzeem — unity, faith, discipline.' caption at the base.">
  <defs>
    <!-- Dark sky gradient with a hint of green -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>

    <!-- Pakistan green: rich and readable -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a7c3e"/>
      <stop offset="100%" stop-color="#01411C"/>
    </linearGradient>

    <!-- White hoist stripe -->
    <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9e2c8"/>
    </linearGradient>

    <!-- Wooden flagpole -->
    <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3a2c18"/>
      <stop offset="45%"  stop-color="#8c7040"/>
      <stop offset="100%" stop-color="#2a1c0e"/>
    </linearGradient>

    <!-- Underline sweep (green to white) -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a7c3e" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#0a7c3e" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#f5efe0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5efe0" stop-opacity="0"/>
    </linearGradient>

    <!-- Right-edge fade of the flag region into the dark -->
    <linearGradient id="flagFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <!-- Slow ripple filter for the flag -->
    <filter id="wave" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="2" seed="7">
        <animate attributeName="baseFrequency"
                 values="0.012 0.026;0.016 0.030;0.010 0.022;0.014 0.028;0.012 0.026"
                 dur="11s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
    </filter>

    <!-- Star shape (5-pointed, outer r=18, inner r=6.88), reusable via <use> -->
    <symbol id="star" overflow="visible">
      <polygon points="0,-18 4.04,-5.56 17.12,-5.56 6.54,2.13 10.58,14.56 0,6.88 -10.58,14.56 -6.54,2.13 -17.12,-5.56 -4.04,-5.56"
               fill="#ffffff"/>
    </symbol>
  </defs>

  <!-- Dark base -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>

  <!-- ==================== ATMOSPHERE: distant stars ==================== -->
  <g fill="#f5efe0" opacity="0.35">
    <circle cx="60"  cy="18" r="1"/>
    <circle cx="140" cy="10" r="0.8"/>
    <circle cx="215" cy="20" r="0.6"/>
    <circle cx="285" cy="8"  r="1"/>
    <circle cx="345" cy="22" r="0.7"/>
    <circle cx="395" cy="6"  r="0.5"/>
    <circle cx="180" cy="26" r="0.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="14" r="0.6">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== RISING CONFETTI ==================== -->
  <g>
    <!-- Green and white paper flakes drifting up -->
    <rect x="30"  y="0" width="3"   height="3"   fill="#0a7c3e" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="13s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 200;10 -20" dur="13s" repeatCount="indefinite"/>
    </rect>
    <rect x="88"  y="0" width="2.5" height="2.5" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="17s" begin="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 200;-6 -20" dur="17s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="0" width="3"   height="3"   fill="#0a7c3e" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="19s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 200;12 -20" dur="19s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="222" y="0" width="2"   height="2"   fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="15s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 200;-8 -20" dur="15s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="288" y="0" width="3"   height="3"   fill="#0a7c3e" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="21s" begin="2.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 200;6 -20" dur="21s" begin="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="352" y="0" width="2.5" height="2.5" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="14s" begin="4.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 200;-10 -20" dur="14s" begin="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="0" width="2"   height="2"   fill="#f5b334" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.85;1" dur="18s" begin="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 200;8 -20" dur="18s" begin="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== FLAGPOLE ==================== -->
  <rect x="26" y="18" width="4" height="172" fill="url(#poleGrad)"/>
  <!-- Finial (gold ball) -->
  <circle cx="28" cy="16" r="4.5" fill="#d8ae3a" stroke="#8c6a20" stroke-width="0.6"/>
  <circle cx="26.7" cy="14.5" r="1.4" fill="#f5d878" opacity="0.9"/>

  <!-- ==================== FLAG ==================== -->
  <g filter="url(#wave)">
    <!-- Full flag: 320 wide x 140 tall, attached at the pole -->
    <!-- White hoist stripe (25% = 80 wide) -->
    <rect x="30" y="30" width="80" height="140" fill="url(#whiteGrad)" stroke="#c8bfa0" stroke-width="0.4"/>
    <!-- Deep green field (75% = 240 wide) -->
    <rect x="110" y="30" width="240" height="140" fill="url(#greenGrad)"/>

    <!-- Crescent + star group, tilted like the official Pakistani flag -->
    <g transform="rotate(-18 220 100)">
      <!-- White outer circle -->
      <circle cx="210" cy="100" r="42" fill="#ffffff"/>
      <!-- Green cutter circle offset to the right — leaves a crescent opening rightward -->
      <circle cx="228" cy="94"  r="40" fill="url(#greenGrad)"/>
      <!-- Star nestled in the bell (to the right of the crescent's inner edge) -->
      <use href="#star" x="252" y="102"/>
    </g>

    <!-- Subtle shading toward the fly (right) edge -->
    <rect x="290" y="30" width="60" height="140" fill="#000" opacity="0.18"/>
  </g>

  <!-- Right-edge fade so the flag dissolves into the dark rather than clipping hard -->
  <rect x="330" y="0" width="80" height="200" fill="url(#flagFade)"/>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="424" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 14, 2026
  </text>

  <rect x="424" y="76" width="340" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="424;434;424" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="424" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#7cd6a3">PAKISTAN INDEPENDENCE DAY</tspan>
  </text>

  <text x="424" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#f5b334" letter-spacing="1" opacity="0.95">
    79 YEARS · YOM-E-AZADI · SINCE 1947
  </text>

  <text x="424" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#6bd4c8" letter-spacing="1" opacity="0.9">
    JINNAH · IQBAL · LIAQUAT · FATIMA
  </text>

  <text x="424" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;Ittehad, Yaqeen, Tanzeem &#8212; unity, faith, discipline.&#8221;
  </text>
</svg>
