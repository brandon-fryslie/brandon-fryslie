<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Klondike Gold Rush — 130th Anniversary (August 16, 1896) -->
<!-- about:
On 16 August 1896, George Carmack, Skookum Jim Mason, and Dawson Charlie found coarse gold on Rabbit Creek — soon renamed Bonanza Creek — in the Yukon's Klondike region. Word travelled at the speed of steamships, and by the following summer roughly 100,000 stampeders had set out for Dawson City by way of the Chilkoot and White Pass trails, each required by the North-West Mounted Police to haul in a full year of provisions. Fewer than 40,000 arrived; only a few thousand ever struck pay dirt. The rush lasted three winters and rewrote the map of the Yukon before it collapsed almost as fast as it began. 130 years today.

The left half is a prospector's gold pan seen from above at a raked angle: dark stream water slowly rocks around its rim while heavier gold flakes and nuggets settle glinting at the bottom, with a distant mountain ridge and a shimmer of aurora borealis behind. On the right, a large AUGUST 16, 2026 headline anchors a gold KLONDIKE GOLD RUSH · 130 YEARS subhead, an italic BONANZA CREEK · YUKON · RABBIT CREEK, RENAMED tertiary, a dim CARMACK · SKOOKUM JIM · DAWSON CHARLIE roster, and a Georgia-italic caption from Robert Service at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 16, 2026 — the 130th anniversary of the Klondike Gold Rush discovery. On the left half, a prospector's gold pan holds dark stream water that slowly swirls; heavier gold flakes and nuggets settle glinting at the bottom, a wooden handle juts out to the right, and behind the pan a dim mountain ridge sits under a curling green aurora borealis and a scatter of stars. On the right, a huge cream AUGUST 16, 2026 headline underlined by a gold-to-aurora sweep, a gold KLONDIKE GOLD RUSH · 130 YEARS subhead trailed by cream · SINCE 1896, an italic amber BONANZA CREEK · YUKON · RABBIT CREEK, RENAMED tertiary, a dim CARMACK · SKOOKUM JIM · DAWSON CHARLIE roster, and a Georgia-italic 'strange things done in the midnight sun.' caption at the base.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f2c94c" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#f2c94c" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#4de89f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4de89f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="panWater" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0%"   stop-color="#33485a"/>
      <stop offset="60%"  stop-color="#152230"/>
      <stop offset="100%" stop-color="#08131c"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffe680" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#f2c94c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a4038"/>
      <stop offset="100%" stop-color="#221c18"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a4632"/>
      <stop offset="100%" stop-color="#2c2018"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4de89f" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#4de89f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7fd4b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7ec8ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7ec8ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7ec8ff" stop-opacity="0"/>
    </linearGradient>
    <symbol id="star" overflow="visible">
      <circle r="0.9" fill="#e6f2f7" opacity="0.75"/>
    </symbol>
  </defs>

  <!-- Sky -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>

  <!-- Aurora curtains -->
  <g>
    <path fill="url(#auroraGrad)">
      <animate attributeName="d"
        dur="13s" repeatCount="indefinite"
        values="
          M 0 62 Q 90 30 180 55 Q 270 82 370 42 L 370 108 L 0 108 Z;
          M 0 55 Q 90 82 180 48 Q 270 22 370 62 L 370 108 L 0 108 Z;
          M 0 62 Q 90 30 180 55 Q 270 82 370 42 L 370 108 L 0 108 Z"/>
    </path>
    <path fill="url(#auroraGrad2)">
      <animate attributeName="d"
        dur="17s" repeatCount="indefinite"
        values="
          M 0 44 Q 100 72 220 42 Q 300 22 370 50 L 370 100 L 0 100 Z;
          M 0 50 Q 100 22 220 55 Q 300 74 370 34 L 370 100 L 0 100 Z;
          M 0 44 Q 100 72 220 42 Q 300 22 370 50 L 370 100 L 0 100 Z"/>
    </path>
  </g>

  <!-- Stars -->
  <g>
    <use href="#star" x="20"  y="16"/>
    <use href="#star" x="72"  y="10"/>
    <use href="#star" x="118" y="24"/>
    <use href="#star" x="152" y="8"/>
    <use href="#star" x="196" y="18"/>
    <use href="#star" x="240" y="12"/>
    <use href="#star" x="284" y="22"/>
    <use href="#star" x="322" y="8"/>
    <use href="#star" x="352" y="28"/>
    <use href="#star" x="48"  y="40"/>
    <use href="#star" x="308" y="46"/>
  </g>

  <!-- Distant mountain ridge (far) -->
  <path d="M 0 118 L 32 96 L 62 108 L 102 82 L 142 100 L 182 78 L 222 96 L 262 88 L 302 104 L 342 90 L 370 100 L 370 132 L 0 132 Z" fill="#101c26"/>
  <!-- Mid mountain ridge -->
  <path d="M 0 128 L 42 112 L 92 122 L 152 106 L 214 120 L 272 108 L 332 122 L 370 116 L 370 142 L 0 142 Z" fill="#0a141c" opacity="0.95"/>

  <!-- Ground -->
  <rect x="0" y="138" width="370" height="62" fill="#0e161e"/>
  <path d="M 0 138 Q 90 146 180 140 Q 270 134 370 142 L 370 152 L 0 152 Z" fill="#1a2530" opacity="0.7"/>

  <!-- Panhandle (wooden, angled slightly down-right) -->
  <g transform="translate(280 152) rotate(-4)">
    <rect x="0" y="-4" width="82" height="8" rx="2" fill="url(#handleGrad)"/>
    <rect x="0" y="-4" width="82" height="1.5" fill="#7a5c3e" opacity="0.65"/>
    <rect x="0" y="1"  width="82" height="1" fill="#000" opacity="0.35"/>
    <!-- ferrule -->
    <rect x="-2" y="-5" width="6" height="10" rx="1" fill="#3a3028"/>
  </g>

  <!-- Gold pan (raked angle from above) -->
  <g transform="translate(172 152)">
    <!-- Rim (metal) -->
    <ellipse cx="0" cy="0" rx="118" ry="38" fill="url(#panMetal)"/>
    <ellipse cx="0" cy="-1" rx="118" ry="38" fill="none" stroke="#6a5a4a" stroke-width="1.4" opacity="0.85"/>
    <!-- Inner well (water) -->
    <ellipse cx="0" cy="2" rx="108" ry="30" fill="url(#panWater)"/>

    <!-- Water swirl (rotating dashed ellipses) -->
    <g fill="none" stroke="#4bb0d0" stroke-width="0.9" opacity="0.55">
      <ellipse cx="0" cy="2" rx="88" ry="24" stroke-dasharray="8 14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="23s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="2" rx="66" ry="18" stroke-dasharray="6 18" opacity="0.55">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="29s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="2" rx="42" ry="12" stroke-dasharray="4 20" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="19s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Gold nuggets and flakes settled at the bottom -->
    <g>
      <ellipse cx="-10" cy="7"  rx="9" ry="4.5" fill="#f2c94c"/>
      <ellipse cx="-10" cy="7"  rx="9" ry="4.5" fill="url(#goldGlow)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="16"  cy="11" rx="7" ry="3.5" fill="#ffd966"/>
      <ellipse cx="16"  cy="11" rx="7" ry="3.5" fill="url(#goldGlow)" opacity="0.85">
        <animate attributeName="opacity" values="1;0.5;1" dur="11s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="4"   cy="20" rx="5.5" ry="2.7" fill="#ffe680"/>
      <ellipse cx="4"   cy="20" rx="5.5" ry="2.7" fill="url(#goldGlow)" opacity="0.9">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="13s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-28" cy="14" rx="4"   ry="2"   fill="#f2c94c" opacity="0.95"/>
      <ellipse cx="32"  cy="18" rx="3.5" ry="1.7" fill="#ffd966" opacity="0.95"/>
      <ellipse cx="-42" cy="4"  rx="2.5" ry="1.3" fill="#ffe680" opacity="0.9"/>
      <ellipse cx="44"  cy="4"  rx="2.5" ry="1.3" fill="#f2c94c" opacity="0.9"/>
      <!-- Flakes -->
      <circle cx="-56" cy="12" r="1"   fill="#ffd966" opacity="0.75"/>
      <circle cx="-64" cy="4"  r="0.9" fill="#f2c94c" opacity="0.7"/>
      <circle cx="60"  cy="10" r="1.1" fill="#ffe680" opacity="0.8"/>
      <circle cx="70"  cy="2"  r="0.9" fill="#f2c94c" opacity="0.7"/>
      <circle cx="-18" cy="24" r="1"   fill="#ffd966" opacity="0.7"/>
      <circle cx="22"  cy="24" r="1.1" fill="#ffe680" opacity="0.8"/>
      <circle cx="-34" cy="-6" r="1"   fill="#f2c94c" opacity="0.55"/>
      <circle cx="36"  cy="-8" r="0.9" fill="#ffd966" opacity="0.55"/>
      <circle cx="-2"  cy="-14" r="0.9" fill="#ffe680" opacity="0.7"/>
    </g>

    <!-- Highlight sheen on the far rim -->
    <ellipse cx="-30" cy="-32" rx="52" ry="3.5" fill="#8a7868" opacity="0.35"/>
  </g>

  <!-- Drifting glints above the pan -->
  <g fill="#ffe680">
    <circle cx="150" cy="118" r="1.1">
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="0s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="128" r="1.2">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="112" r="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="1s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="248" cy="120" r="1">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="3s"   repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="132" r="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 16, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#f2c94c">KLONDIKE GOLD RUSH</tspan><tspan fill="#f5efe0" opacity="0.7"> · 130 YEARS</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    BONANZA CREEK · YUKON · RABBIT CREEK, RENAMED
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7fd4b8" letter-spacing="1" opacity="0.9">
    CARMACK · SKOOKUM JIM · DAWSON CHARLIE
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;strange things done in the midnight sun.&#8221;
  </text>
</svg>
