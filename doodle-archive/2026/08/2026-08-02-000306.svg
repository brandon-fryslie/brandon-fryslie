<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: World Wide Web Day (August 1). Observed annually to celebrate the World Wide Web, the hypertext system invented by Tim Berners-Lee at CERN in 1989–1991. The first web browser (WorldWideWeb) and the first web page (info.cern.ch) opened the door to a globally-linked hypertext. This doodle is a NeXT-era, wireframe-globe homage: on the left, a slowly-rotating cyan/magenta wireframe globe threaded with glowing hyperlink connection arcs and pulsing packet dots; behind it, a faint blueprint grid evoking the CERN proposal era; oversized cyan angle brackets frame the center; on the right, a HUGE cream AUGUST 1, 2026 headline, a cyan WORLD WIDE WEB DAY subhead, and italic HTTP · HTML · URL · CERN · 1991 tertiary. Palette: bg #0a0e1a, grid #12233a, cyan #00d4ff, magenta #ff5edb, mint #7fffd4, cream #f5efd8. Continuously animated: globe rotates, packet dots pulse and travel arcs, angle brackets breathe, blinking terminal cursor after the tertiary line, scanline overlay drifts. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 1, 2026 — World Wide Web Day. A slowly-rotating cyan and magenta wireframe globe on the left threaded with glowing hyperlink connection arcs and pulsing packet dots, sitting on a faint blueprint grid. Oversized cyan angle brackets frame the center. On the right, a huge cream AUGUST 1, 2026 headline, a cyan WORLD WIDE WEB DAY subhead, and italic HTTP · HTML · URL · CERN · 1991 tertiary with a blinking terminal cursor. Horizontal scanlines drift over the whole frame.">
  <defs>
    <!-- Blueprint grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#12233a" stroke-width="0.6"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1a3450" stroke-width="0.9"/>
    </pattern>

    <!-- Soft glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline overlay -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000" opacity="0"/>
      <rect y="1.6" width="4" height="0.9" fill="#00d4ff" opacity="0.045"/>
    </pattern>

    <!-- Circle clip for globe body (used for meridians) -->
    <clipPath id="globeClip">
      <circle cx="160" cy="100" r="72"/>
    </clipPath>

    <style>
      .cream { fill: #f5efd8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cyan { fill: #00d4ff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .magenta { fill: #ff5edb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mint { fill: #7fffd4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0a0e1a"/>
  <rect width="800" height="200" fill="url(#grid)"/>
  <rect width="800" height="200" fill="url(#gridMajor)"/>

  <!-- Subtle vignette from top-left -->
  <radialGradient id="vig" cx="20%" cy="30%" r="80%">
    <stop offset="0%" stop-color="#0e2140" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
  </radialGradient>
  <rect width="800" height="200" fill="url(#vig)"/>

  <!-- ============ GLOBE (left) ============ -->
  <g transform="translate(0,0)">
    <!-- Outer halo -->
    <circle cx="160" cy="100" r="82" fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.35"/>
    <circle cx="160" cy="100" r="76" fill="none" stroke="#00d4ff" stroke-width="0.4" opacity="0.25"/>

    <!-- Globe fill (very faint) -->
    <circle cx="160" cy="100" r="72" fill="#00d4ff" opacity="0.05"/>

    <!-- Globe outline -->
    <circle cx="160" cy="100" r="72" fill="none" stroke="#00d4ff" stroke-width="1.4" filter="url(#glow)"/>

    <!-- Latitude lines (static) -->
    <g stroke="#00d4ff" stroke-width="0.7" fill="none" opacity="0.55" clip-path="url(#globeClip)">
      <ellipse cx="160" cy="100" rx="72" ry="10"/>
      <ellipse cx="160" cy="100" rx="72" ry="26"/>
      <ellipse cx="160" cy="100" rx="72" ry="44"/>
      <ellipse cx="160" cy="100" rx="72" ry="60"/>
    </g>

    <!-- Meridians rotate together to simulate globe spin -->
    <g clip-path="url(#globeClip)" opacity="0.75">
      <g stroke="#ff5edb" stroke-width="0.9" fill="none" filter="url(#glow)">
        <!-- 6 meridians, spaced 30° in ry-space -->
        <g>
          <ellipse cx="160" cy="100" rx="72" ry="72">
            <animate attributeName="rx" values="72;0;-72;0;72" dur="13s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <g>
          <ellipse cx="160" cy="100" rx="60" ry="72">
            <animate attributeName="rx" values="60;-12;-72;-60;12;72;60" dur="13s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <g>
          <ellipse cx="160" cy="100" rx="36" ry="72">
            <animate attributeName="rx" values="36;-36;-72;-36;36;72;36" dur="13s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <g>
          <ellipse cx="160" cy="100" rx="12" ry="72">
            <animate attributeName="rx" values="12;-60;-72;-12;60;72;12" dur="13s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>

      <!-- Cyan meridians offset in phase to weave with magenta -->
      <g stroke="#00d4ff" stroke-width="0.7" fill="none" opacity="0.7">
        <g>
          <ellipse cx="160" cy="100" rx="50" ry="72">
            <animate attributeName="rx" values="50;-22;-72;-50;22;72;50" dur="13s" repeatCount="indefinite" begin="-3.25s"/>
          </ellipse>
        </g>
        <g>
          <ellipse cx="160" cy="100" rx="24" ry="72">
            <animate attributeName="rx" values="24;-48;-72;-24;48;72;24" dur="13s" repeatCount="indefinite" begin="-6.5s"/>
          </ellipse>
        </g>
      </g>
    </g>

    <!-- Poles -->
    <circle cx="160" cy="28" r="1.8" fill="#7fffd4" filter="url(#glow)"/>
    <circle cx="160" cy="172" r="1.8" fill="#7fffd4" filter="url(#glow)"/>

    <!-- Hyperlink nodes on globe surface with packet pulses -->
    <g filter="url(#glowStrong)">
      <circle cx="120" cy="70" r="2.6" fill="#7fffd4">
        <animate attributeName="r" values="2.2;3.6;2.2" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="196" cy="85" r="2.6" fill="#ff5edb">
        <animate attributeName="r" values="2.2;3.8;2.2" dur="2.9s" repeatCount="indefinite" begin="-0.7s"/>
      </circle>
      <circle cx="180" cy="140" r="2.6" fill="#00d4ff">
        <animate attributeName="r" values="2.2;3.4;2.2" dur="3.1s" repeatCount="indefinite" begin="-1.3s"/>
      </circle>
      <circle cx="130" cy="135" r="2.6" fill="#7fffd4">
        <animate attributeName="r" values="2.2;3.6;2.2" dur="2.7s" repeatCount="indefinite" begin="-1.9s"/>
      </circle>
      <circle cx="150" cy="55" r="2.4" fill="#ff5edb">
        <animate attributeName="r" values="2.0;3.4;2.0" dur="3.3s" repeatCount="indefinite" begin="-0.4s"/>
      </circle>
    </g>

    <!-- Hyperlink arcs between nodes -->
    <g fill="none" stroke-width="0.9" opacity="0.85" filter="url(#glow)">
      <path d="M 120 70 Q 170 30 196 85" stroke="#7fffd4">
        <animate attributeName="stroke-dasharray" values="0 200; 60 140; 200 0" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M 196 85 Q 220 110 180 140" stroke="#ff5edb">
        <animate attributeName="stroke-dasharray" values="0 200; 60 140; 200 0" dur="7s" repeatCount="indefinite" begin="-2.3s"/>
      </path>
      <path d="M 180 140 Q 130 170 130 135" stroke="#00d4ff">
        <animate attributeName="stroke-dasharray" values="0 200; 60 140; 200 0" dur="7s" repeatCount="indefinite" begin="-4.6s"/>
      </path>
      <path d="M 130 135 Q 100 100 120 70" stroke="#7fffd4">
        <animate attributeName="stroke-dasharray" values="0 200; 60 140; 200 0" dur="11s" repeatCount="indefinite" begin="-1.1s"/>
      </path>
      <path d="M 120 70 Q 150 40 150 55" stroke="#ff5edb">
        <animate attributeName="stroke-dasharray" values="0 200; 60 140; 200 0" dur="11s" repeatCount="indefinite" begin="-5.5s"/>
      </path>
    </g>

    <!-- Traveling packet dots along a couple of arcs -->
    <g filter="url(#glowStrong)">
      <circle r="2.4" fill="#f5efd8">
        <animateMotion dur="7s" repeatCount="indefinite" path="M 120 70 Q 170 30 196 85"/>
      </circle>
      <circle r="2.4" fill="#f5efd8">
        <animateMotion dur="7s" repeatCount="indefinite" begin="-2.3s" path="M 196 85 Q 220 110 180 140"/>
      </circle>
      <circle r="2.4" fill="#f5efd8">
        <animateMotion dur="7s" repeatCount="indefinite" begin="-4.6s" path="M 180 140 Q 130 170 130 135"/>
      </circle>
    </g>
  </g>

  <!-- ============ Oversized angle brackets around the middle ============ -->
  <g class="cyan" opacity="0.55" filter="url(#glow)">
    <text x="252" y="124" font-size="76" font-weight="800" class="mono" style="fill:#00d4ff">
      &lt;
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="792" y="124" font-size="76" font-weight="800" class="mono" text-anchor="end" style="fill:#00d4ff">
      /&gt;
      <animate attributeName="opacity" values="0.45;0.8;0.45" dur="7s" repeatCount="indefinite" begin="-3.5s"/>
    </text>
  </g>

  <!-- ============ Text block (right) ============ -->
  <g>
    <!-- Headline: date -->
    <text x="500" y="90" text-anchor="middle" class="cream" font-size="46" font-weight="800" letter-spacing="1.5">
      AUGUST 1, 2026
    </text>

    <!-- Subhead -->
    <text x="500" y="122" text-anchor="middle" class="cyan" font-size="18" font-weight="700" letter-spacing="4.5" filter="url(#glow)">
      WORLD WIDE WEB DAY
    </text>

    <!-- Tertiary italic tagline with blinking cursor -->
    <text x="500" y="150" text-anchor="middle" class="mint" font-size="11" font-style="italic" letter-spacing="2.2" opacity="0.9">
      HTTP · HTML · URL · CERN · 1991
    </text>
    <!-- Blinking terminal cursor -->
    <rect x="640" y="141" width="8" height="12" fill="#7fffd4">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Small URL bar hint above headline -->
    <g transform="translate(390,44)">
      <rect x="0" y="0" width="220" height="16" rx="2" fill="#0e2140" stroke="#12233a" stroke-width="0.8"/>
      <circle cx="9" cy="8" r="2.4" fill="#ff5edb"/>
      <text x="20" y="12" class="mono" font-size="10" fill="#7fffd4">http://info.cern.ch/</text>
      <rect x="150" y="3" width="1.6" height="10" fill="#7fffd4">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Corner marks / registration ticks (blueprint feel) -->
  <g stroke="#12233a" stroke-width="1" fill="none">
    <path d="M 6 6 h 14 M 6 6 v 14"/>
    <path d="M 794 6 h -14 M 794 6 v 14"/>
    <path d="M 6 194 h 14 M 6 194 v -14"/>
    <path d="M 794 194 h -14 M 794 194 v -14"/>
  </g>

  <!-- Faint drifting hex/tag confetti in background -->
  <g class="mono" font-size="10" opacity="0.16" fill="#00d4ff">
    <text x="330" y="30">&lt;a href&gt;</text>
    <text x="700" y="180">&lt;/html&gt;</text>
    <text x="290" y="180">&lt;body&gt;</text>
    <text x="680" y="30">&lt;head&gt;</text>
  </g>

  <!-- Scanline overlay drifts vertically -->
  <g>
    <rect x="0" y="-4" width="800" height="208" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 -4" to="0 0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
