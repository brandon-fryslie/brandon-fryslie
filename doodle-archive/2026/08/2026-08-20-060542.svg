<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Daguerreotype Unveiled — 187th Anniversary (August 19, 1839) -->
<!-- about:
On 19 August 1839, at a joint session of the French Academy of Sciences and Academy of Fine Arts held at the Institut de France in Paris, François Arago revealed the full working process of Louis Daguerre's photographic technique to a packed room. The French government had bought the invention outright from Daguerre and Isidore Niépce — son of Daguerre's late collaborator Nicéphore — in exchange for lifetime pensions, then placed it in the public domain as a gift to the world. Within a year, daguerreotype studios had opened on both sides of the Atlantic. Every silver print, glass plate, film emulsion, and phone-camera sensor since traces its lineage to that afternoon.

The left half is a polished silver daguerreotype plate seated in a red velvet-lined case: a Victorian portrait slowly develops into visibility on its mirrored surface as pale mercury vapour curls upward and a diagonal reflection sweep glides across the metal. On the right, a large AUGUST 19, 2026 headline anchors a silver DAGUERREOTYPE · 187 YEARS subhead, an italic amber DAGUERRE · NIÉPCE · ARAGO · ACADÉMIE tertiary, a dim SILVER · IODINE · MERCURY · GILT COPPER spec line, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 19, 2026 — the 187th anniversary of the daguerreotype being unveiled to the world. On the left half, a polished silver daguerreotype plate sits in a red velvet-lined case: a Victorian portrait bust in warm sepia slowly develops into visibility on the mirrored surface as pale mercury vapor curls upward and a diagonal reflection sweep glides across the metal. On the right, a huge cream AUGUST 19, 2026 headline underlined by a silver-to-amber sweep, a silver DAGUERREOTYPE · 187 YEARS subhead trailed by cream · SINCE 1839, an italic amber DAGUERRE · NIÉPCE · ARAGO · ACADÉMIE tertiary, a dim cyan SILVER · IODINE · MERCURY · GILT COPPER roster, and a Georgia-italic 'a gift, free to the world.' caption at the base.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="velvetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a1e2d"/>
      <stop offset="45%"  stop-color="#5c1420"/>
      <stop offset="100%" stop-color="#3a0c14"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#efe9d4"/>
      <stop offset="30%"  stop-color="#cfc9b3"/>
      <stop offset="55%"  stop-color="#a9a48d"/>
      <stop offset="80%"  stop-color="#c5bfa8"/>
      <stop offset="100%" stop-color="#8f8a75"/>
    </linearGradient>
    <linearGradient id="sepiaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a3a22"/>
      <stop offset="60%"  stop-color="#3d2614"/>
      <stop offset="100%" stop-color="#26170b"/>
    </linearGradient>
    <linearGradient id="glintGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d0cdb8" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#d0cdb8" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#efe9d4" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#d4a55a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b5a2b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="plateHighlight" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>
    <clipPath id="plateClip">
      <rect x="127" y="32" width="106" height="136" rx="2"/>
    </clipPath>
    <symbol id="dust" overflow="visible">
      <circle r="0.7" fill="#e6dfc8" opacity="0.55"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>

  <!-- Ambient dust motes / room particulate -->
  <g>
    <use href="#dust" x="30"  y="20"/>
    <use href="#dust" x="72"  y="46"/>
    <use href="#dust" x="98"  y="14"/>
    <use href="#dust" x="290" y="24"/>
    <use href="#dust" x="330" y="60"/>
    <use href="#dust" x="360" y="18"/>
    <use href="#dust" x="20"  y="150"/>
    <use href="#dust" x="330" y="170"/>
    <use href="#dust" x="60"  y="184"/>
    <circle cx="72" cy="46" r="1.1" fill="#f2ecd6">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="60" r="1.1" fill="#f2ecd6">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="24" r="1" fill="#f2ecd6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== DAGUERREOTYPE PLATE + CASE (LEFT) ==================== -->

  <!-- Case shadow -->
  <ellipse cx="180" cy="188" rx="86" ry="5" fill="#000000" opacity="0.55"/>

  <!-- Velvet-lined leather case (outer) -->
  <rect x="105" y="18" width="150" height="164" rx="7" fill="#2a0f16"/>
  <rect x="105" y="18" width="150" height="164" rx="7" fill="none" stroke="#8f5a2b" stroke-width="1.2" opacity="0.85"/>
  <!-- Velvet lining (mat) -->
  <rect x="115" y="26" width="130" height="148" rx="4" fill="url(#velvetGrad)"/>
  <!-- Inner gilt frame around plate -->
  <rect x="123" y="30" width="114" height="140" rx="3" fill="none" stroke="#d4a55a" stroke-width="1.4" opacity="0.95"/>
  <rect x="125" y="31" width="110" height="138" rx="2" fill="none" stroke="#8b5a2b" stroke-width="0.6" opacity="0.9"/>

  <!-- The silvered plate -->
  <rect x="127" y="32" width="106" height="136" rx="2" fill="url(#silverGrad)"/>

  <!-- Contents that live only on the plate -->
  <g clip-path="url(#plateClip)">
    <!-- Subtle vertical polish streaks on the silver -->
    <g opacity="0.18" stroke="#7a755f" stroke-width="0.5">
      <line x1="140" y1="34" x2="140" y2="166"/>
      <line x1="150" y1="34" x2="150" y2="166"/>
      <line x1="160" y1="34" x2="160" y2="166"/>
      <line x1="170" y1="34" x2="170" y2="166"/>
      <line x1="180" y1="34" x2="180" y2="166"/>
      <line x1="190" y1="34" x2="190" y2="166"/>
      <line x1="200" y1="34" x2="200" y2="166"/>
      <line x1="210" y1="34" x2="210" y2="166"/>
      <line x1="220" y1="34" x2="220" y2="166"/>
    </g>

    <!-- Radial vignette + highlight built into plate -->
    <rect x="127" y="32" width="106" height="136" fill="url(#plateHighlight)"/>

    <!-- Sepia Victorian portrait bust, slowly developing -->
    <g opacity="0.1">
      <animate attributeName="opacity" values="0.05;0.82;0.82;0.05" keyTimes="0;0.4;0.85;1" dur="13s" repeatCount="indefinite"/>
      <!-- Shoulders / cravat / coat -->
      <path d="M 138 168 L 148 128 Q 156 116 168 114 Q 172 118 178 118 L 182 118 Q 188 118 192 114 Q 204 116 212 128 L 222 168 Z" fill="url(#sepiaGrad)"/>
      <!-- Cravat highlight -->
      <path d="M 173 118 L 178 138 L 183 138 L 187 118 Q 183 122 180 122 Q 177 122 173 118 Z" fill="#c9a877" opacity="0.7"/>
      <!-- Neck -->
      <rect x="172" y="102" width="16" height="18" fill="#4a2f1a"/>
      <!-- Head -->
      <ellipse cx="180" cy="86" rx="18" ry="22" fill="#3d2614"/>
      <!-- Hair / crown shadow -->
      <path d="M 162 82 Q 163 66 180 62 Q 197 66 198 82 Q 196 74 180 72 Q 164 74 162 82 Z" fill="#26170b"/>
      <!-- Face highlight -->
      <ellipse cx="176" cy="88" rx="7" ry="9" fill="#8b5a2b" opacity="0.55"/>
      <!-- Cheekbone hint -->
      <ellipse cx="184" cy="92" rx="3" ry="4" fill="#c9a877" opacity="0.35"/>
    </g>

    <!-- Diagonal reflection sweep across the mirror -->
    <rect x="60" y="32" width="60" height="136" fill="url(#glintGrad)" transform="skewX(-18)">
      <animate attributeName="x" values="60;280;60" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Case corner ornaments (gilt) -->
  <g fill="#d4a55a" opacity="0.9">
    <circle cx="115" cy="28" r="1.4"/>
    <circle cx="245" cy="28" r="1.4"/>
    <circle cx="115" cy="172" r="1.4"/>
    <circle cx="245" cy="172" r="1.4"/>
  </g>

  <!-- Mercury vapor curls, drifting up from behind/beside the case -->
  <g fill="none" stroke="#cfd2d8" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <path d="M 78 170 Q 74 150 82 140 Q 90 128 82 112 Q 76 98 84 84">
      <animate attributeName="opacity" values="0;0.6;0" dur="13s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 6; 0 -18; 0 -30" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M 300 168 Q 306 148 296 138 Q 286 124 296 108 Q 302 96 294 82">
      <animate attributeName="opacity" values="0;0.55;0" dur="17s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4; 0 -14; 0 -26" dur="17s" repeatCount="indefinite"/>
    </path>
    <path d="M 92 172 Q 96 162 90 154 Q 84 146 92 138">
      <animate attributeName="opacity" values="0;0.45;0" dur="11s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4; 0 -12; 0 -22" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M 286 174 Q 282 164 288 156 Q 294 148 286 140">
      <animate attributeName="opacity" values="0;0.5;0" dur="19s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 4; 0 -14; 0 -24" dur="19s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Small caption strip beneath the plate -->
  <text x="180" y="196" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="6.5" fill="#8a94a8" letter-spacing="1.4" font-style="italic">PLANCHE DAGUERRIENNE · PARIS · MDCCCXXXIX</text>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 19, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#d0cdb8">DAGUERREOTYPE</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;187 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;&#160;·&#160;&#160;SINCE 1839</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    DAGUERRE · NI&#201;PCE · ARAGO · ACAD&#201;MIE
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7fd4b8" letter-spacing="1" opacity="0.9">
    SILVER · IODINE · MERCURY · GILT COPPER
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;a gift, free to the world.&#8221;
  </text>
</svg>
