<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: International Cat Day (August 8, 2026). Recognized annually on 8 August since 2002 (originally by the International Fund for Animal Welfare). Composition on the 800x200 canvas: on the left half, a night-sky tableau — a big warm-cream full moon glows behind a silhouetted black cat sitting in profile on a rooftop, gazing up-left toward the moon; the cat's tail slowly swishes, its eyes blink, its whiskers twitch; a soft cream halo rings the moon, faint craters shade its face, and a few small stars twinkle across the sky; fireflies drift upward through the scene. On the right, a huge cream AUGUST 8, 2026 headline underlined by a warm pink-to-amber sweep, a hot-pink INTERNATIONAL CAT DAY subhead with a small pink paw glyph, italic amber tertiary SATURDAY · 8 AUGUST · MEOW · SINCE 2002, dim-green tertiary WHISKERS · MOONGAZING · NINE LIVES · PURR, and a Georgia-italic caption "In ancient times cats were worshipped as gods; they have not forgotten this." — Terry Pratchett — at the base. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 8, 2026 — International Cat Day. On the left, a night-sky tableau: a warm-cream full moon glows behind a silhouetted black cat sitting in profile on a rooftop, gazing up-left at the moon, its tail slowly swishing, its yellow eyes blinking, and whiskers twitching. A cream halo rings the moon with faint craters shading its face; a few stars twinkle; small yellow fireflies drift upward through the scene. On the right, a huge cream AUGUST 8, 2026 headline underlined by a warm pink-to-amber sweep, a hot-pink INTERNATIONAL CAT DAY subhead with a pink paw glyph, italic amber SATURDAY · 8 AUGUST · MEOW · SINCE 2002 tertiary, dim-green WHISKERS · MOONGAZING · NINE LIVES · PURR tertiary, and a Georgia-italic 'In ancient times cats were worshipped as gods; they have not forgotten this.' — Terry Pratchett — caption at the base.">
  <defs>
    <!-- Night sky background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="55%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Warm moon body (radial) -->
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%"  stop-color="#fff6d5"/>
      <stop offset="55%" stop-color="#f2e0a4"/>
      <stop offset="100%" stop-color="#d9c07a"/>
    </radialGradient>

    <!-- Moon halo (soft cream glow around moon) -->
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#fff2b8" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#fff2b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff2b8" stop-opacity="0"/>
    </radialGradient>

    <!-- Rooftop silhouette base gradient -->
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#050810"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Headline underline sweep: pink-to-amber -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff9ec7" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#ff9ec7" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#f2cc60" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f2cc60" stop-opacity="0"/>
    </linearGradient>

    <!-- Reusable sitting cat silhouette (facing LEFT). Local origin at bottom center of feet. -->
    <g id="cat">
      <!-- Tail (drawn first so body overlays its root) -->
      <g style="transform-origin: 38px -18px; transform-box: fill-box;">
        <path d="M 38 -18 Q 62 -30 70 -60 Q 72 -78 60 -84"
              stroke="#000" stroke-width="7.5" fill="none" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="-9 38 -18" to="9 38 -18" dur="4.7s"
                          repeatCount="indefinite" additive="sum"
                          values="-9 38 -18; 9 38 -18; -9 38 -18" keyTimes="0;0.5;1"/>
      </g>

      <!-- Hind haunch (behind, sitting) -->
      <ellipse cx="30" cy="-18" rx="22" ry="26" fill="#000"/>

      <!-- Front torso / chest (sits upright) -->
      <path d="M -13 0
               L -13 -38
               Q -13 -56 4 -58
               L 22 -58
               Q 36 -56 36 -38
               L 36 0 Z" fill="#000"/>

      <!-- Front paws (small toe humps at feet) -->
      <ellipse cx="-6" cy="0" rx="9" ry="4" fill="#000"/>
      <ellipse cx="30" cy="0" rx="9" ry="4" fill="#000"/>

      <!-- Head (facing left) -->
      <ellipse cx="6" cy="-67" rx="15.5" ry="13.5" fill="#000"/>

      <!-- Ears -->
      <path d="M -7 -75 L -5 -88 L 5 -78 Z" fill="#000"/>
      <path d="M 19 -75 L 17 -88 L 8 -78 Z" fill="#000"/>
      <!-- Ear inner (faint warm hint) -->
      <path d="M -4 -78 L -3 -85 L 3 -80 Z" fill="#3a1830" opacity="0.55"/>
      <path d="M 16 -78 L 15 -85 L 10 -80 Z" fill="#3a1830" opacity="0.55"/>

      <!-- Eyes (glowing yellow, facing left) -->
      <ellipse cx="-3" cy="-68" rx="1.9" ry="2.9" fill="#fce77d">
        <animate attributeName="ry"
                 values="2.9;2.9;0.25;2.9;2.9;2.9;2.9;0.25;2.9"
                 keyTimes="0;0.30;0.33;0.36;0.60;0.75;0.78;0.81;1"
                 dur="6.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="4"  cy="-68" rx="1.9" ry="2.9" fill="#fce77d">
        <animate attributeName="ry"
                 values="2.9;2.9;0.25;2.9;2.9;2.9;2.9;0.25;2.9"
                 keyTimes="0;0.30;0.33;0.36;0.60;0.75;0.78;0.81;1"
                 dur="6.2s" repeatCount="indefinite"/>
      </ellipse>
      <!-- Tiny pupil highlights inside each eye -->
      <circle cx="-3.5" cy="-69" r="0.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="3.5"  cy="-69" r="0.5" fill="#ffffff" opacity="0.85"/>

      <!-- Nose (soft pink, facing-left side of muzzle) -->
      <ellipse cx="-7" cy="-63" rx="1.3" ry="0.9" fill="#ff9ec7" opacity="0.85"/>

      <!-- Whiskers -->
      <line x1="-9" y1="-61" x2="-20" y2="-59" stroke="#4a4a4a" stroke-width="0.6"/>
      <line x1="-9" y1="-63" x2="-21" y2="-64" stroke="#4a4a4a" stroke-width="0.6"/>
      <line x1="-9" y1="-65" x2="-20" y2="-68" stroke="#4a4a4a" stroke-width="0.6"/>
    </g>

    <!-- Small paw-print glyph (pink) for the subhead -->
    <g id="paw">
      <ellipse cx="0" cy="2" rx="4" ry="3.2" fill="#ff9ec7"/>
      <circle cx="-4.2" cy="-3.2" r="1.5" fill="#ff9ec7"/>
      <circle cx="-1.4" cy="-4.8" r="1.5" fill="#ff9ec7"/>
      <circle cx="1.6"  cy="-4.8" r="1.5" fill="#ff9ec7"/>
      <circle cx="4.4"  cy="-3.2" r="1.5" fill="#ff9ec7"/>
    </g>
  </defs>

  <!-- ============ background sky ============ -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- ============ stars ============ -->
  <g fill="#f0f6fc">
    <circle cx="38"  cy="20"  r="0.9" opacity="0.75"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="72"  cy="55"  r="0.6" opacity="0.55"><animate attributeName="opacity" values="0.2;0.7;0.2"    dur="11s" begin="1s"   repeatCount="indefinite"/></circle>
    <circle cx="192" cy="30"  r="0.75" opacity="0.7"><animate attributeName="opacity" values="0.25;0.9;0.25"  dur="13s" begin="2s"   repeatCount="indefinite"/></circle>
    <circle cx="228" cy="15"  r="0.5"  opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15"  dur="7s"  begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="266" cy="52"  r="0.7"  opacity="0.6"><animate attributeName="opacity" values="0.2;0.85;0.2"   dur="11s" begin="3s"   repeatCount="indefinite"/></circle>
    <circle cx="298" cy="22"  r="0.55" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15"  dur="13s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="12"  cy="76"  r="0.45" opacity="0.4"><animate attributeName="opacity" values="0.1;0.55;0.1"   dur="11s" begin="4s"   repeatCount="indefinite"/></circle>
    <circle cx="126" cy="16"  r="0.5"  opacity="0.5"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="7s"  begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="76"  r="0.4"  opacity="0.4"><animate attributeName="opacity" values="0.1;0.55;0.1"   dur="13s" begin="3.5s" repeatCount="indefinite"/></circle>
    <!-- a couple far right, subtle -->
    <circle cx="482" cy="12"  r="0.45" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1"    dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="746" cy="26"  r="0.55" opacity="0.35"><animate attributeName="opacity" values="0.1;0.55;0.1"  dur="7s"  begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ moon halo + moon ============ -->
  <circle cx="105" cy="90" r="90" fill="url(#moonHalo)">
    <animate attributeName="r" values="88;96;88" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="90" r="52" fill="url(#moon)"/>
  <!-- craters (subtle) -->
  <g fill="#c4a860" opacity="0.35">
    <circle cx="86"  cy="76"  r="5"/>
    <circle cx="120" cy="72"  r="3"/>
    <circle cx="98"  cy="108" r="4"/>
    <circle cx="122" cy="102" r="2.5"/>
    <circle cx="80"  cy="98"  r="2.5"/>
  </g>
  <!-- moon rim highlight (upper-left) -->
  <path d="M 63 82 A 52 52 0 0 1 100 42" fill="none" stroke="#fff8dc" stroke-width="1" opacity="0.55"/>

  <!-- ============ fireflies (tiny warm dots drifting up) ============ -->
  <g fill="#fce77d">
    <circle cx="60" cy="160" r="1.5" opacity="0.85">
      <animate attributeName="cy" values="180;40;180" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="150" r="1.3" opacity="0.85">
      <animate attributeName="cy" values="180;30;180" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="23s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="120" r="1.2" opacity="0.85">
      <animate attributeName="cy" values="180;60;180" dur="17s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="17s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="140" r="1" opacity="0.85">
      <animate attributeName="cy" values="180;70;180" dur="29s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="29s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="150" r="1.1" opacity="0.85">
      <animate attributeName="cy" values="180;80;180" dur="31s" begin="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="31s" begin="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ rooftop silhouette ============ -->
  <!-- gentle rooftop line under the cat (a thin dark ridge) -->
  <path d="M 0 178
           L 60 178
           L 90 172
           L 260 172
           L 300 178
           L 340 178
           L 340 200
           L 0 200 Z"
        fill="url(#roof)"/>
  <!-- little chimney to the right of cat -->
  <rect x="270" y="160" width="14" height="12" fill="#000"/>
  <rect x="266" y="158" width="22" height="3" fill="#000"/>

  <!-- ============ cat (sitting on rooftop, facing moon) ============ -->
  <g transform="translate(200 172)">
    <use href="#cat"/>
  </g>

  <!-- ============ RIGHT HALF: typography stack ============ -->

  <!-- Huge cream headline: primary date -->
  <text x="360" y="70"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="1"
        fill="#f0f6fc">AUGUST 8, 2026</text>

  <!-- Underline sweep bar -->
  <rect x="360" y="80" width="308" height="2.8" fill="url(#sweep)" opacity="0.95">
    <animate attributeName="x" values="360;408;360" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- Subhead: hot-pink INTERNATIONAL CAT DAY, with paw glyph -->
  <g>
    <text x="360" y="112"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" letter-spacing="1.4"
          fill="#ff9ec7">INTERNATIONAL CAT DAY</text>
    <g transform="translate(658 105)">
      <use href="#paw"/>
    </g>
  </g>

  <!-- Amber italic tertiary -->
  <text x="360" y="135"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" letter-spacing="0.8"
        fill="#f2cc60">SATURDAY  ·  8 AUGUST  ·  MEOW  ·  SINCE 2002</text>

  <!-- Green italic tertiary -->
  <text x="360" y="152"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" letter-spacing="1.3"
        fill="#7ee787" opacity="0.9">WHISKERS  ·  MOONGAZING  ·  NINE LIVES  ·  PURR</text>

  <!-- Georgia italic caption + attribution + blinking cursor -->
  <g>
    <text x="360" y="182"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="12" font-style="italic"
          fill="#c9d1d9">&#8220;they have not forgotten this.&#8221;</text>
    <text x="558" y="182"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="10" font-style="italic"
          fill="#8b949e">— Terry Pratchett</text>
    <rect x="770" y="171" width="7" height="13" fill="#ff9ec7">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
