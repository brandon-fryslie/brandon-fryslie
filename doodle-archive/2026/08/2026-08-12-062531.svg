<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Hip Hop's 53rd Birthday (August 11, 1973) -->
<!-- about:
On 11 August 1973, in the rec room of 1520 Sedgwick Avenue in the Bronx, an eighteen-year-old Clive Campbell — DJ Kool Herc — threw a back-to-school party for his sister Cindy and worked out a new trick on the two turntables: cutting back and forth between the same record's drum "break," extending the passage dancers loved into a whole song. The b-boys danced to it, the MC's rhymed over it, and hip hop had its founding moment. 53 years today.

A DJ tableau on a graffiti-tagged wall: a large vinyl LP spins on a turntable, its warm-gold label reading HIP HOP, the tonearm resting on the outer grooves. To the right an equalizer pulses to a beat while musical notes drift upward. A bold spray-painted "53" glows behind the deck. On the right, a large AUGUST 11, 2026 headline anchors a HIP HOP AT 53 subhead, the Sedgwick-Ave block-party attribution, and the caption "the day the beat began."
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 11, 2026 — Hip Hop's 53rd birthday, marking DJ Kool Herc's block party at 1520 Sedgwick Avenue in the Bronx on 11 August 1973. On the left half, a DJ turntable tableau against a purple graffiti-tagged brick wall: a large black vinyl LP spins continuously on a silver turntable platter, its warm-gold center label reading HIP HOP · AUG 11 '73, a chrome tonearm rests on the outer grooves, and a big spray-painted number 53 in cream and pink glows behind the deck. A row of hot-pink and gold equalizer bars pulses to the beat, and small cream musical notes drift upward. On the right, a huge cream AUGUST 11, 2026 headline underlined by a gold-to-red sweep, a warm-gold HIP HOP AT 53 subhead trailed by cream · BLOCK PARTY '73, italic amber DJ KOOL HERC · 1520 SEDGWICK AVE · BRONX tertiary, dim-cyan BREAKBEAT · TWO TURNTABLES · BACK TO SCHOOL JAM tertiary, and a Georgia-italic 'the day the beat began.' caption at the base.">
  <defs>
    <!-- Wine-purple wall gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a0e2a"/>
      <stop offset="55%"  stop-color="#3d1338"/>
      <stop offset="100%" stop-color="#1a0518"/>
    </linearGradient>

    <!-- Fade left panel into dark on right edge -->
    <linearGradient id="wallFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <!-- Vinyl reflection sheen -->
    <radialGradient id="vinylSheen" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#4a4a4a" stop-opacity="0.7"/>
      <stop offset="35%"  stop-color="#1a1a1a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Label gradient -->
    <radialGradient id="labelGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd76a"/>
      <stop offset="70%"  stop-color="#e59a2a"/>
      <stop offset="100%" stop-color="#b6660e"/>
    </radialGradient>

    <!-- Platter (silver ring) gradient -->
    <radialGradient id="platterGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#9a9a9a"/>
      <stop offset="60%"  stop-color="#5a5a5a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </radialGradient>

    <!-- Underline sweep -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e59a2a" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#e59a2a" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#d92834" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d92834" stop-opacity="0"/>
    </linearGradient>

    <!-- Spray-paint drip filter -->
    <filter id="spray" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>

    <!-- Glow behind 53 -->
    <filter id="glow53" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Dark base -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- ==================== LEFT: WALL + DJ SETUP ==================== -->
  <rect x="0" y="0" width="460" height="200" fill="url(#wallGrad)"/>

  <!-- Brick pattern (subtle) -->
  <g stroke="#1a0512" stroke-width="0.7" opacity="0.55">
    <line x1="0" y1="20"  x2="460" y2="20"/>
    <line x1="0" y1="42"  x2="460" y2="42"/>
    <line x1="0" y1="64"  x2="460" y2="64"/>
    <line x1="0" y1="86"  x2="460" y2="86"/>
    <line x1="0" y1="108" x2="460" y2="108"/>
    <line x1="0" y1="130" x2="460" y2="130"/>
    <line x1="0" y1="152" x2="460" y2="152"/>
    <line x1="0" y1="174" x2="460" y2="174"/>
    <line x1="0" y1="196" x2="460" y2="196"/>
    <!-- vertical brick offsets -->
    <line x1="30"  y1="0"   x2="30"  y2="20"/>
    <line x1="90"  y1="0"   x2="90"  y2="20"/>
    <line x1="150" y1="0"   x2="150" y2="20"/>
    <line x1="210" y1="0"   x2="210" y2="20"/>
    <line x1="270" y1="0"   x2="270" y2="20"/>
    <line x1="330" y1="0"   x2="330" y2="20"/>
    <line x1="390" y1="0"   x2="390" y2="20"/>
    <line x1="60"  y1="20"  x2="60"  y2="42"/>
    <line x1="120" y1="20"  x2="120" y2="42"/>
    <line x1="180" y1="20"  x2="180" y2="42"/>
    <line x1="240" y1="20"  x2="240" y2="42"/>
    <line x1="300" y1="20"  x2="300" y2="42"/>
    <line x1="360" y1="20"  x2="360" y2="42"/>
    <line x1="420" y1="20"  x2="420" y2="42"/>
    <line x1="30"  y1="42"  x2="30"  y2="64"/>
    <line x1="90"  y1="42"  x2="90"  y2="64"/>
    <line x1="150" y1="42"  x2="150" y2="64"/>
    <line x1="210" y1="42"  x2="210" y2="64"/>
    <line x1="270" y1="42"  x2="270" y2="64"/>
    <line x1="330" y1="42"  x2="330" y2="64"/>
    <line x1="390" y1="42"  x2="390" y2="64"/>
    <line x1="60"  y1="64"  x2="60"  y2="86"/>
    <line x1="120" y1="64"  x2="120" y2="86"/>
    <line x1="180" y1="64"  x2="180" y2="86"/>
    <line x1="240" y1="64"  x2="240" y2="86"/>
    <line x1="300" y1="64"  x2="300" y2="86"/>
    <line x1="360" y1="64"  x2="360" y2="86"/>
    <line x1="420" y1="64"  x2="420" y2="86"/>
    <line x1="30"  y1="86"  x2="30"  y2="108"/>
    <line x1="90"  y1="86"  x2="90"  y2="108"/>
    <line x1="150" y1="86"  x2="150" y2="108"/>
    <line x1="210" y1="86"  x2="210" y2="108"/>
    <line x1="270" y1="86"  x2="270" y2="108"/>
    <line x1="330" y1="86"  x2="330" y2="108"/>
    <line x1="390" y1="86"  x2="390" y2="108"/>
    <line x1="60"  y1="108" x2="60"  y2="130"/>
    <line x1="120" y1="108" x2="120" y2="130"/>
    <line x1="180" y1="108" x2="180" y2="130"/>
    <line x1="240" y1="108" x2="240" y2="130"/>
    <line x1="300" y1="108" x2="300" y2="130"/>
    <line x1="360" y1="108" x2="360" y2="130"/>
    <line x1="420" y1="108" x2="420" y2="130"/>
    <line x1="30"  y1="130" x2="30"  y2="152"/>
    <line x1="90"  y1="130" x2="90"  y2="152"/>
    <line x1="150" y1="130" x2="150" y2="152"/>
    <line x1="210" y1="130" x2="210" y2="152"/>
    <line x1="270" y1="130" x2="270" y2="152"/>
    <line x1="330" y1="130" x2="330" y2="152"/>
    <line x1="390" y1="130" x2="390" y2="152"/>
    <line x1="60"  y1="152" x2="60"  y2="174"/>
    <line x1="120" y1="152" x2="120" y2="174"/>
    <line x1="180" y1="152" x2="180" y2="174"/>
    <line x1="240" y1="152" x2="240" y2="174"/>
    <line x1="300" y1="152" x2="300" y2="174"/>
    <line x1="360" y1="152" x2="360" y2="174"/>
    <line x1="420" y1="152" x2="420" y2="174"/>
    <line x1="30"  y1="174" x2="30"  y2="196"/>
    <line x1="90"  y1="174" x2="90"  y2="196"/>
    <line x1="150" y1="174" x2="150" y2="196"/>
    <line x1="210" y1="174" x2="210" y2="196"/>
    <line x1="270" y1="174" x2="270" y2="196"/>
    <line x1="330" y1="174" x2="330" y2="196"/>
    <line x1="390" y1="174" x2="390" y2="196"/>
  </g>

  <!-- Fade right edge into dark base -->
  <rect x="380" y="0" width="80" height="200" fill="url(#wallFade)"/>

  <!-- Big spray-painted "53" behind the turntable -->
  <g filter="url(#spray)" opacity="0.9">
    <!-- Glow layer -->
    <text x="180" y="150" font-family="Impact, 'Arial Black', sans-serif" font-size="150"
          font-weight="900" fill="#ff5a95" opacity="0.35" filter="url(#glow53)"
          letter-spacing="-8">53</text>
    <!-- Main tag -->
    <text x="180" y="150" font-family="Impact, 'Arial Black', sans-serif" font-size="150"
          font-weight="900" fill="#f5efe0" stroke="#ff2a72" stroke-width="2"
          letter-spacing="-8" opacity="0.85">53</text>
  </g>

  <!-- Paint drips from the 53 -->
  <g fill="#ff2a72" opacity="0.75">
    <path d="M 210 148 Q 209 158 210 168 Q 211 174 210 178">
      <animate attributeName="d"
               values="M 210 148 Q 209 156 210 166 Q 211 172 210 176;M 210 148 Q 209 160 210 172 Q 211 180 210 186;M 210 148 Q 209 156 210 166 Q 211 172 210 176"
               dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M 285 152 Q 284 160 285 170 Q 286 176 285 180" stroke="none">
      <animate attributeName="d"
               values="M 285 152 Q 284 160 285 168 Q 286 174 285 178;M 285 152 Q 284 164 285 178 Q 286 184 285 190;M 285 152 Q 284 160 285 168 Q 286 174 285 178"
               dur="11s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ==================== TURNTABLE ==================== -->
  <g transform="translate(140 108)">
    <!-- Deck base (rounded square) -->
    <rect x="-92" y="-92" width="184" height="184" rx="10" fill="#151515" stroke="#3a3a3a" stroke-width="1.5" opacity="0.85"/>
    <!-- Speed indicators (dot rows) -->
    <g fill="#c0904a" opacity="0.7">
      <circle cx="-78" cy="-74" r="1.4"/>
      <circle cx="-72" cy="-74" r="1.4"/>
      <circle cx="-66" cy="-74" r="1.4"/>
      <circle cx="-60" cy="-74" r="1.4"/>
    </g>
    <text x="-78" y="-60" font-family="-apple-system, sans-serif" font-size="6" fill="#c0904a" opacity="0.85">33 RPM</text>

    <!-- Platter (silver disc under vinyl) -->
    <circle r="82" fill="url(#platterGrad)"/>

    <!-- SPINNING VINYL -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <!-- Vinyl body -->
      <circle r="78" fill="#0a0a0a"/>
      <!-- Grooves -->
      <g fill="none" stroke="#242424" stroke-width="0.5" opacity="0.9">
        <circle r="74"/>
        <circle r="70"/>
        <circle r="66"/>
        <circle r="62"/>
        <circle r="58"/>
        <circle r="54"/>
        <circle r="50"/>
        <circle r="46"/>
        <circle r="42"/>
        <circle r="38"/>
        <circle r="34"/>
      </g>
      <!-- Subtle sheen -->
      <ellipse cx="-20" cy="-25" rx="55" ry="30" fill="url(#vinylSheen)"/>
      <!-- Label -->
      <circle r="26" fill="url(#labelGrad)"/>
      <circle r="26" fill="none" stroke="#8a4a0e" stroke-width="0.8"/>
      <!-- Label text (curved feel via straight lines, rotates with record) -->
      <text y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="8" font-weight="800" text-anchor="middle" fill="#3a1408" letter-spacing="0.5">HIP HOP</text>
      <text y="2" font-family="-apple-system, sans-serif" font-size="5"
            text-anchor="middle" fill="#3a1408" letter-spacing="0.8">SEDGWICK</text>
      <text y="10" font-family="-apple-system, sans-serif" font-size="5"
            text-anchor="middle" fill="#3a1408" letter-spacing="0.8">AUG 11 '73</text>
      <!-- Registration marks -->
      <circle cx="0" cy="18" r="1" fill="#3a1408"/>
      <circle cx="0" cy="-18" r="1" fill="#3a1408"/>
      <!-- Spindle hole -->
      <circle r="1.8" fill="#0a0a0a"/>
    </g>

    <!-- Spindle -->
    <circle r="2.4" fill="#c0c0c0"/>
  </g>

  <!-- Tonearm (static — sits on the outer edge of the vinyl at ~140+62 ≈ 202) -->
  <g>
    <!-- Pivot base -->
    <circle cx="222" cy="52" r="8" fill="#2a2a2a" stroke="#c0c0c0" stroke-width="1"/>
    <circle cx="222" cy="52" r="3.5" fill="#c0c0c0"/>
    <!-- Arm -->
    <line x1="222" y1="52" x2="178" y2="86" stroke="#c8c8c8" stroke-width="2.5"/>
    <!-- Counterweight -->
    <rect x="222" y="42" width="16" height="8" rx="2" fill="#3a3a3a" stroke="#c0c0c0" stroke-width="0.8"/>
    <!-- Headshell -->
    <path d="M 178 86 L 172 96 L 178 100 L 184 92 Z" fill="#1a1a1a" stroke="#c0c0c0" stroke-width="0.8"/>
    <!-- Needle -->
    <circle cx="176" cy="97" r="1" fill="#ff5a5a"/>
  </g>

  <!-- ==================== EQUALIZER BARS ==================== -->
  <g>
    <rect x="286" y="80" width="7" height="40" fill="#ff5a95" rx="1">
      <animate attributeName="height" values="14;38;22;44;18;30;14" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="106;82;98;76;102;90;106" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="298" y="70" width="7" height="50" fill="#f5b334" rx="1">
      <animate attributeName="height" values="28;46;16;40;24;50;28" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="92;74;104;80;96;70;92" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="310" y="88" width="7" height="32" fill="#6bd4c8" rx="1">
      <animate attributeName="height" values="20;36;12;42;18;28;20" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="100;84;108;78;102;92;100" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="322" y="76" width="7" height="44" fill="#ff5a95" rx="1">
      <animate attributeName="height" values="32;44;18;38;24;46;32" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="88;76;102;82;96;74;88" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="334" y="86" width="7" height="34" fill="#f5b334" rx="1">
      <animate attributeName="height" values="16;40;24;44;14;34;16" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="104;80;96;76;106;86;104" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="346" y="94" width="7" height="26" fill="#6bd4c8" rx="1">
      <animate attributeName="height" values="12;32;20;40;16;24;12" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y"      values="108;88;100;80;104;96;108" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <!-- Baseline -->
    <line x1="282" y1="122" x2="358" y2="122" stroke="#c0904a" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Floating musical notes -->
  <g font-family="Georgia, serif" font-size="16" fill="#f5b334">
    <text x="270" y="60" opacity="0.9">&#9835;
      <animate attributeName="y" values="60;20" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="-10 270 40;10 270 20" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="360" y="70" opacity="0.9" fill="#6bd4c8">&#9834;
      <animate attributeName="y" values="70;15" dur="11s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="65" opacity="0.9" fill="#ff5a95">&#9835;
      <animate attributeName="y" values="65;10" dur="13s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Small spray-can hint bottom-left (paint origin) -->
  <g transform="translate(50 178)">
    <rect x="0" y="0" width="10" height="18" rx="1" fill="#c0c0c0" stroke="#5a5a5a" stroke-width="0.5"/>
    <rect x="2" y="-4" width="6" height="4" fill="#3a3a3a"/>
    <rect x="4" y="-6" width="2" height="2" fill="#ff2a72"/>
    <!-- Nozzle spray -->
    <g fill="#ff2a72" opacity="0.6">
      <circle cx="12" cy="-4" r="0.8">
        <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14" cy="-5" r="0.6">
        <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ==================== RIGHT: TEXT PANEL ==================== -->
  <text x="474" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 11, 2026
  </text>

  <rect x="474" y="76" width="300" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="474;484;474" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="474" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="1.5">
    <tspan fill="#f5b334">HIP HOP AT 53</tspan><tspan fill="#f5efe0" font-weight="500">  ·  EST. '73</tspan>
  </text>

  <text x="474" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#f5b334" letter-spacing="1" opacity="0.95">
    DJ KOOL HERC · BRONX · BLOCK PARTY
  </text>

  <text x="474" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#6bd4c8" letter-spacing="1" opacity="0.9">
    1520 SEDGWICK AVE · BREAKBEAT · TWO DECKS
  </text>

  <text x="474" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;the day the beat began.&#8221;
  </text>
</svg>
