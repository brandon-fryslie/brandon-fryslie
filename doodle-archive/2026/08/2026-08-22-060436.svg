<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Mona Lisa Stolen — 115th Anniversary (August 21, 1911) -->
<!-- about:
On the morning of 21 August 1911, an Italian handyman named Vincenzo Peruggia walked out of the Louvre with the Mona Lisa hidden under his workman's smock. He had spent the previous day inside as a visitor, then hidden in a storage cupboard overnight — the theft itself took roughly fifteen minutes on a Monday when the museum was closed to the public. The empty wall stayed on display for a full day before anyone noticed. Recovered in Florence two years later, when Peruggia tried to sell it to the Uffizi, the painting returned to Paris a global celebrity: before the theft it had been well-regarded; after, it was the most famous picture on Earth. Fame, it turns out, is a story about absence.

The left half is the Louvre gallery wall the morning of the theft: an ornate gilded frame hangs empty against warm plaster, its interior showing a paler rectangle where the panel had shaded the wall for a century and three small hooks catching the light. A caped silhouette drifts away toward the right edge with a bundle under one arm, and gold dust motes hang in the shaft of a museum lantern. On the right, a large AUGUST 21, 2026 headline anchors a gold MONA LISA · 115 YEARS subhead, an italic PERUGGIA · LOUVRE · PARIS · SALON CARRÉ tertiary, a dim MONDAY, CLOSED · RECOVERED IN FLORENCE 1913 roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 21, 2026 — the 115th anniversary of the Mona Lisa being stolen from the Louvre. On the left half, an ornate gilded picture frame hangs empty against a warm plaster museum wall, gently swaying; inside the frame is a paler rectangle in the plaster where the panel shaded the wall for a century, with three small iron hooks visible. A caped silhouette with a wide-brimmed hat drifts rightward off the panel, a wrapped bundle under one arm. Gold dust motes float in a warm lantern glow from the upper left. On the right, a huge cream AUGUST 21, 2026 headline underlined by a gold-to-burgundy sweep, a gold MONA LISA · 115 YEARS subhead trailed by cream · SINCE 1911, an italic amber PERUGGIA · LOUVRE · PARIS · SALON CARRÉ tertiary, a dim cyan MONDAY, CLOSED · RECOVERED IN FLORENCE 1913 roster, and a Georgia-italic 'fame is a story about absence.' caption at the base.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a4530"/>
      <stop offset="55%"  stop-color="#3e2e1c"/>
      <stop offset="100%" stop-color="#241a10"/>
    </linearGradient>
    <linearGradient id="fadedPatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8b7250"/>
      <stop offset="100%" stop-color="#6a5535"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffe9a8"/>
      <stop offset="35%"  stop-color="#e6b64a"/>
      <stop offset="70%"  stop-color="#a97a1e"/>
      <stop offset="100%" stop-color="#5a3f10"/>
    </linearGradient>
    <linearGradient id="frameShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#f0c85a" stop-opacity="0.75"/>
      <stop offset="55%"  stop-color="#e6b64a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a97a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0c85a" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#f0c85a" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#ffe9a8" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#b8342a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4a1010" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Left-half museum wall -->
  <rect x="0" y="0" width="360" height="200" fill="url(#wallGrad)"/>

  <!-- Subtle plaster horizontal seams -->
  <g opacity="0.18" stroke="#8a6540" stroke-width="0.4" fill="none">
    <line x1="0" y1="34"  x2="360" y2="33"/>
    <line x1="0" y1="96"  x2="360" y2="97"/>
    <line x1="0" y1="158" x2="360" y2="157"/>
  </g>

  <!-- Wall speckling -->
  <g fill="#8a6540" opacity="0.16">
    <circle cx="24"  cy="52"  r="0.6"/>
    <circle cx="66"  cy="118" r="0.5"/>
    <circle cx="220" cy="42"  r="0.6"/>
    <circle cx="248" cy="176" r="0.5"/>
    <circle cx="320" cy="88"  r="0.6"/>
    <circle cx="42"  cy="182" r="0.5"/>
    <circle cx="290" cy="130" r="0.6"/>
  </g>

  <!-- Warm lantern glow from upper-left -->
  <ellipse cx="30" cy="10" rx="240" ry="180" fill="url(#lampGlow)" opacity="0.75">
    <animate attributeName="opacity" values="0.6;0.88;0.6" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Faded rectangle on wall where Mona Lisa hung (unmoving — the wall remembers) -->
  <rect x="112" y="52" width="76" height="96" fill="url(#fadedPatch)"/>
  <!-- Faint darker outline of the panel shadow -->
  <rect x="112" y="52" width="76" height="96" fill="none" stroke="#241a10" stroke-width="0.6" opacity="0.6"/>

  <!-- Three iron hooks visible on the bare wall inside where the frame was -->
  <g fill="#1a1208" opacity="0.9">
    <path d="M 128 52 L 128 56 L 129.5 56 L 129.5 53 Z"/>
    <path d="M 150 52 L 150 56 L 151.5 56 L 151.5 53 Z"/>
    <path d="M 172 52 L 172 56 L 173.5 56 L 173.5 53 Z"/>
  </g>
  <!-- Small hanging wire above (fixed on wall) -->
  <path d="M 130 30 Q 150 22 170 30" stroke="#7a5518" stroke-width="0.7" fill="none" opacity="0.7"/>

  <!-- The ornate gilded frame — hollow, sways subtly -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-0.6 150 30; 0.6 150 30; -0.6 150 30"
      dur="13s" repeatCount="indefinite"/>

    <!-- Frame as 4 gilded rails so interior is see-through -->
    <rect x="90"  y="30"  width="120" height="22"  fill="url(#frameGrad)"/>
    <rect x="90"  y="148" width="120" height="22"  fill="url(#frameGrad)"/>
    <rect x="90"  y="52"  width="22"  height="96"  fill="url(#frameGrad)"/>
    <rect x="188" y="52"  width="22"  height="96"  fill="url(#frameGrad)"/>

    <!-- Frame shadow overlay (adds depth on right/bottom rails) -->
    <rect x="188" y="52"  width="22"  height="96"  fill="url(#frameShadow)" opacity="0.5"/>
    <rect x="90"  y="148" width="120" height="22"  fill="url(#frameShadow)" opacity="0.5"/>

    <!-- Inner lip -->
    <rect x="112" y="52"  width="76"  height="96"  fill="none" stroke="#3a2708" stroke-width="1.5"/>
    <!-- Outer border -->
    <rect x="90"  y="30"  width="120" height="140" fill="none" stroke="#5a3f10" stroke-width="1.2"/>

    <!-- Ornate scrollwork on the four rails -->
    <g fill="none" stroke="#5a3f10" stroke-width="0.55" opacity="0.85">
      <path d="M 108 41 Q 118 36 128 41 Q 138 46 148 41 Q 158 36 168 41 Q 178 46 188 41"/>
      <path d="M 108 159 Q 118 164 128 159 Q 138 154 148 159 Q 158 164 168 159 Q 178 154 188 159"/>
      <path d="M 101 60 Q 96 75 101 90 Q 106 105 101 120 Q 96 135 101 140"/>
      <path d="M 199 60 Q 204 75 199 90 Q 194 105 199 120 Q 204 135 199 140"/>
    </g>

    <!-- Corner rosettes -->
    <g>
      <circle cx="100" cy="40"  r="3.4" fill="#ffe9a8" opacity="0.9"/>
      <circle cx="200" cy="40"  r="3.4" fill="#ffe9a8" opacity="0.9"/>
      <circle cx="100" cy="160" r="3.4" fill="#ffe9a8" opacity="0.9"/>
      <circle cx="200" cy="160" r="3.4" fill="#ffe9a8" opacity="0.9"/>
      <circle cx="100" cy="40"  r="1.4" fill="#5a3f10"/>
      <circle cx="200" cy="40"  r="1.4" fill="#5a3f10"/>
      <circle cx="100" cy="160" r="1.4" fill="#5a3f10"/>
      <circle cx="200" cy="160" r="1.4" fill="#5a3f10"/>
    </g>
  </g>

  <!-- Silhouette thief walking rightward with bundle -->
  <g>
    <animate attributeName="opacity"
      values="0; 0; 0.94; 0.94; 0"
      keyTimes="0; 0.06; 0.22; 0.86; 1"
      dur="41s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 82 0"
      keyTimes="0; 1"
      dur="41s" repeatCount="indefinite"/>

    <g fill="#08080a">
      <!-- Cloak / body -->
      <path d="M 246 148 Q 244 178 250 195 L 282 195 Q 288 178 286 148 Q 280 142 266 142 Q 252 142 246 148 Z"/>
      <!-- Neck stub -->
      <rect x="262" y="136" width="8" height="6"/>
      <!-- Head -->
      <circle cx="266" cy="132" r="6.5"/>
      <!-- Wide-brim hat -->
      <ellipse cx="266" cy="127" rx="12" ry="2.4"/>
      <rect x="260" y="120" width="12" height="6" rx="1.5"/>
      <!-- Arm hugging bundle -->
      <path d="M 286 152 Q 296 156 302 168 Q 298 172 288 168 Z"/>
    </g>
    <!-- The bundle (wrapped canvas — a small warm rectangle) -->
    <g>
      <rect x="288" y="156" width="18" height="24" fill="#3a2708" stroke="#7a5518" stroke-width="0.6"/>
      <!-- Wrapping twine -->
      <line x1="288" y1="164" x2="306" y2="164" stroke="#c8a878" stroke-width="0.5" opacity="0.75"/>
      <line x1="288" y1="172" x2="306" y2="172" stroke="#c8a878" stroke-width="0.5" opacity="0.75"/>
      <line x1="294" y1="156" x2="294" y2="180" stroke="#c8a878" stroke-width="0.5" opacity="0.75"/>
      <line x1="300" y1="156" x2="300" y2="180" stroke="#c8a878" stroke-width="0.5" opacity="0.75"/>
    </g>
  </g>

  <!-- Dust motes drifting in the lantern shaft -->
  <g fill="#f0c85a">
    <circle cx="52"  cy="88"  r="0.9" opacity="0.55">
      <animate attributeName="cy" values="88;60;88" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="228" cy="118" r="0.8" opacity="0.5">
      <animate attributeName="cy" values="118;92;118" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80"  cy="168" r="0.7" opacity="0.55">
      <animate attributeName="cy" values="168;140;168" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="322" cy="64"  r="0.9" opacity="0.5">
      <animate attributeName="cy" values="64;40;64" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="20"  r="0.8" opacity="0.55">
      <animate attributeName="cy" values="20;44;20" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0.2;0.65" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="180" r="0.7" opacity="0.5">
      <animate attributeName="cy" values="180;156;180" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Seam between wall panel and text panel -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 21, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#f0c85a">MONA LISA</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;115 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;&#160;·&#160;&#160;SINCE 1911</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    PERUGGIA · LOUVRE · PARIS · SALON CARRÉ
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7fd4b8" letter-spacing="1" opacity="0.9">
    MONDAY, CLOSED · RECOVERED IN FLORENCE 1913
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;fame is a story about absence.&#8221;
  </text>
</svg>
