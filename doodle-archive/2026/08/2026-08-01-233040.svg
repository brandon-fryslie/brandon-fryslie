<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: MTV's 45th Anniversary (August 1, 1981 — August 1, 2026). MTV launched at 12:01 AM ET on August 1, 1981 with the words "Ladies and gentlemen, rock and roll" and the first music video ever aired: "Video Killed the Radio Star" by The Buggles. Its launch identity — a Neil-Armstrong-esque astronaut planting a flag on the Moon, the flag bearing the block-M / spray-painted TV MTV logo — became one of the most recognizable pieces of 1980s visual iconography. A moon-landing tableau on an 800x200 canvas: on the left, a dark grey pockmarked lunar horizon with a silhouetted astronaut in a bulky spacesuit and reflective gold visor planting a tall flagpole, the flag itself a rippling MTV banner in hot pink; a rocky Earth-orange planet crescent hangs low; scattered white stars twinkle over an inky navy sky; on the right, a huge MTV logo built from a chunky pop-art block "M" in cyclable neon (hot pink → cyan → yellow → lime) with a spray-painted / graffiti TV pasted across its lower right; below it, a large cream AUGUST 1, 2026 headline; a hot-pink MTV · 45 YEARS subhead; italic 1 AUGUST 1981 · "VIDEO KILLED THE RADIO STAR" · THE BUGGLES tertiary; horizontal retro scanline overlay across the whole frame. Palette: bg #0a0a1e, moon #3a3a44 / #1a1a22, astronaut #1a1a20 / gold visor #f5c04a, hot-pink #ff2d9c, cyan #00e5ff, yellow #ffd93d, lime #b6ff3d, cream #f5efd8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 1, 2026 — MTV's 45th Anniversary. MTV launched at 12:01 AM ET on August 1, 1981 with 'Video Killed the Radio Star' by The Buggles and an astronaut-on-the-moon launch identity. A moon-landing tableau: on the left, a silhouetted astronaut with a gold visor stands on a pockmarked lunar horizon planting a tall flagpole whose flag is a rippling hot-pink MTV banner; a rocky orange Earth crescent hangs low; white stars twinkle across an inky navy sky. On the right, a huge pop-art block MTV logo — chunky 'M' in cyclable neon (hot pink to cyan to yellow to lime) with a spray-painted 'TV' pasted across its lower right — sits above a large cream AUGUST 1, 2026 headline, a hot-pink MTV · 45 YEARS subhead, and italic 1 AUGUST 1981 · VIDEO KILLED THE RADIO STAR · THE BUGGLES tertiary. Horizontal retro scanlines run across the whole frame.">
  <defs>
    <!-- Deep space background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0a0a1e"/>
      <stop offset="0.6"  stop-color="#0d1030"/>
      <stop offset="1"    stop-color="#050510"/>
    </linearGradient>

    <!-- Lunar surface -->
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#161620"/>
    </linearGradient>

    <!-- Earth crescent -->
    <radialGradient id="earth" cx="35%" cy="40%" r="70%">
      <stop offset="0"   stop-color="#ffb26b"/>
      <stop offset="0.5" stop-color="#d16a3a"/>
      <stop offset="1"   stop-color="#5a2412"/>
    </radialGradient>

    <!-- Gold visor gradient -->
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffe38a"/>
      <stop offset="0.55" stop-color="#f5c04a"/>
      <stop offset="1"    stop-color="#8a5a10"/>
    </linearGradient>

    <!-- Scanlines -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000" opacity="0.28"/>
    </pattern>

    <!-- Subtle vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="80%">
      <stop offset="55%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Flag wave: two draped ellipse-ish paths morphed via SMIL -->
    <!-- (Static path baseline: rectangle with slight droop.) -->

    <!-- Glow filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- SKY                                                            -->
  <!-- ============================================================ -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Twinkling stars -->
  <g fill="#f5efd8">
    <circle cx="60"  cy="18"  r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="110" cy="42"  r="0.8"><animate attributeName="opacity" values="1;0.2;1"  dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="12"  r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="34"  r="0.9"><animate attributeName="opacity" values="1;0.3;1"  dur="7s"  begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="18"  r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="52"  r="0.7"><animate attributeName="opacity" values="1;0.4;1"  dur="13s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="90"  cy="72"  r="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s"  begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="20"  cy="46"  r="1.0"><animate attributeName="opacity" values="1;0.3;1"  dur="11s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="26"  r="0.9"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="10"  r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s"  begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="30"  r="0.8"><animate attributeName="opacity" values="1;0.3;1"  dur="11s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="8"   r="1.0"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="24"  r="0.9"><animate attributeName="opacity" values="1;0.4;1"  dur="7s"  begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="46"  r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="60"  r="0.7"><animate attributeName="opacity" values="1;0.5;1"  dur="13s" begin="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Distant Earth-orange crescent low in the sky -->
  <g opacity="0.85">
    <circle cx="180" cy="150" r="26" fill="url(#earth)"/>
    <!-- Occluder to make a crescent -->
    <circle cx="164" cy="140" r="24" fill="#0a0a1e"/>
    <!-- Rim glow -->
    <circle cx="180" cy="150" r="27" fill="none" stroke="#ffb26b" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- ============================================================ -->
  <!-- LUNAR SURFACE                                                  -->
  <!-- ============================================================ -->
  <g>
    <!-- Main horizon bump -->
    <path d="M 0,168 C 40,150 90,146 140,152 C 180,157 210,168 250,166 C 290,164 320,158 360,164 L 360,200 L 0,200 Z"
          fill="url(#moon)"/>
    <!-- Crater shading -->
    <g fill="#0a0a12" opacity="0.55">
      <ellipse cx="55"  cy="175" rx="10" ry="2.2"/>
      <ellipse cx="180" cy="182" rx="14" ry="2.8"/>
      <ellipse cx="260" cy="178" rx="8"  ry="1.8"/>
      <ellipse cx="320" cy="186" rx="11" ry="2.4"/>
    </g>
    <!-- Highlight ridge -->
    <path d="M 0,168 C 40,150 90,146 140,152 C 180,157 210,168 250,166 C 290,164 320,158 360,164"
          fill="none" stroke="#4a4a56" stroke-width="0.8" opacity="0.75"/>
  </g>

  <!-- ============================================================ -->
  <!-- ASTRONAUT                                                      -->
  <!-- ============================================================ -->
  <g transform="translate(72,108)">
    <!-- Backpack -->
    <rect x="-16" y="8" width="14" height="26" rx="2.5" fill="#1a1a20" stroke="#3a3a44" stroke-width="0.6"/>
    <rect x="-13" y="12" width="8" height="4" rx="0.5" fill="#2a2a34"/>

    <!-- Torso -->
    <path d="M -2,6 Q -2,4 0,4 L 22,4 Q 24,4 24,6 L 24,36 Q 24,38 22,38 L 0,38 Q -2,38 -2,36 Z"
          fill="#1a1a20" stroke="#3a3a44" stroke-width="0.6"/>
    <!-- Chest control pad -->
    <rect x="5" y="18" width="12" height="8" rx="1" fill="#2a2a34" stroke="#3a3a44" stroke-width="0.4"/>
    <circle cx="8"  cy="22" r="1.2" fill="#ff2d9c"><animate attributeName="opacity" values="1;0.4;1" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="12" cy="22" r="1.2" fill="#00e5ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="15.5" cy="22" r="1.2" fill="#ffd93d"><animate attributeName="opacity" values="1;0.3;1" dur="13s" repeatCount="indefinite"/></circle>

    <!-- Arm holding flagpole (right, extending upward) -->
    <path d="M 22,10 Q 34,4 42,-14 L 46,-12 Q 38,8 26,16 Z" fill="#1a1a20" stroke="#3a3a44" stroke-width="0.6"/>
    <!-- Gloved hand -->
    <circle cx="44" cy="-14" r="3.5" fill="#0e0e14" stroke="#3a3a44" stroke-width="0.5"/>

    <!-- Left arm at side -->
    <path d="M -2,10 Q -8,20 -6,32 L -1,32 Q -3,22 2,14 Z" fill="#1a1a20" stroke="#3a3a44" stroke-width="0.6"/>

    <!-- Legs -->
    <path d="M 2,38 L 8,38 L 8,60 L 2,60 Z"  fill="#1a1a20" stroke="#3a3a44" stroke-width="0.6"/>
    <path d="M 14,38 L 20,38 L 20,60 L 14,60 Z" fill="#1a1a20" stroke="#3a3a44" stroke-width="0.6"/>
    <!-- Boots -->
    <path d="M -1,60 L 10,60 L 10,64 L -1,64 Z" fill="#0e0e14"/>
    <path d="M 13,60 L 22,60 L 22,64 L 13,64 Z" fill="#0e0e14"/>

    <!-- Helmet -->
    <circle cx="11" cy="-2" r="12.5" fill="#1a1a20" stroke="#3a3a44" stroke-width="0.8"/>
    <!-- Gold reflective visor -->
    <path d="M 4,-4 Q 4,-11 11,-11 Q 18,-11 18,-4 Q 18,3 11,3 Q 4,3 4,-4 Z"
          fill="url(#visor)" stroke="#8a5a10" stroke-width="0.4"/>
    <!-- Visor highlight -->
    <path d="M 6,-8 Q 10,-11 14,-9" stroke="#fff2c8" stroke-width="0.7" fill="none" opacity="0.9"/>
    <!-- Antenna -->
    <line x1="18" y1="-11" x2="21" y2="-16" stroke="#3a3a44" stroke-width="0.7"/>
    <circle cx="21.5" cy="-16.5" r="1.2" fill="#ff2d9c">
      <animate attributeName="opacity" values="1;0.3;1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============================================================ -->
  <!-- FLAG on the moon                                               -->
  <!-- ============================================================ -->
  <g>
    <!-- Flagpole -->
    <line x1="118" y1="94" x2="118" y2="170" stroke="#c9c9d2" stroke-width="1.6"/>
    <circle cx="118" cy="93" r="2" fill="#f5efd8"/>

    <!-- Flag: hot-pink rippling banner with block MTV -->
    <g>
      <path fill="#ff2d9c" stroke="#8a1258" stroke-width="0.5"
            d="M 118,94 L 168,92 L 172,98 L 168,104 L 172,112 L 168,118 L 118,120 Z">
        <animate attributeName="d"
                 values="M 118,94 L 168,92 L 172,98 L 168,104 L 172,112 L 168,118 L 118,120 Z;
                         M 118,94 L 168,96 L 170,102 L 172,108 L 170,114 L 168,120 L 118,120 Z;
                         M 118,94 L 168,92 L 172,98 L 168,104 L 172,112 L 168,118 L 118,120 Z"
                 dur="7s" repeatCount="indefinite"/>
      </path>
      <!-- Flag "MTV" text on the banner (small, so keep it high contrast, not primary date) -->
      <text x="145" y="112" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
            font-size="14" font-weight="900" fill="#f5efd8" letter-spacing="0.5">MTV</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- SUBTLE DIVIDER glow between scene and typography               -->
  <!-- ============================================================ -->
  <line x1="378" y1="16" x2="378" y2="184" stroke="#ff2d9c" stroke-width="0.6" opacity="0.18"/>

  <!-- ============================================================ -->
  <!-- BIG POP-ART "MTV" LOGO — right side                             -->
  <!-- ============================================================ -->
  <g transform="translate(410,26)">
    <!-- Big chunky "M" — color-cycles through neon palette -->
    <text x="0" y="86" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
          font-size="130" font-weight="900" letter-spacing="-4"
          fill="#ff2d9c"
          style="paint-order: stroke; stroke: #f5efd8; stroke-width: 3px; stroke-linejoin: round;">
      <animate attributeName="fill"
               values="#ff2d9c;#00e5ff;#ffd93d;#b6ff3d;#ff2d9c"
               dur="11s" repeatCount="indefinite"/>
      M
    </text>

    <!-- Spray-painted "TV" — pasted across the M's lower right, rotated slightly -->
    <g transform="translate(78,80) rotate(-8)">
      <text x="0" y="20" font-family="'Brush Script MT','Marker Felt','Comic Sans MS',cursive"
            font-size="52" font-weight="900"
            fill="#f5efd8"
            style="paint-order: stroke; stroke: #0a0a1e; stroke-width: 3.5px; stroke-linejoin: round;">
        TV
      </text>
      <!-- Spray splatter accents -->
      <g fill="#f5efd8" opacity="0.85">
        <circle cx="-4" cy="4"  r="1.0"/>
        <circle cx="56" cy="8"  r="1.0"/>
        <circle cx="62" cy="16" r="0.6"/>
        <circle cx="-7" cy="14" r="0.6"/>
        <circle cx="30" cy="30" r="1.2"/>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- BIG DATE — primary readability element                         -->
  <!-- ============================================================ -->
  <text x="588" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" letter-spacing="2.6"
        fill="#f5efd8"
        style="paint-order: stroke; stroke: #0a0a1e; stroke-width: 4.5px; stroke-linejoin: round;">
    AUGUST 1, 2026
  </text>

  <!-- Subhead -->
  <text x="588" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="800" letter-spacing="4.6"
        fill="#ff2d9c"
        style="paint-order: stroke; stroke: #0a0a1e; stroke-width: 3px; stroke-linejoin: round;">
    MTV · 45 YEARS
  </text>

  <!-- Tertiary line -->
  <text x="588" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="8.5" font-weight="600" letter-spacing="1.8" font-style="italic"
        fill="#c9c9d8"
        style="paint-order: stroke; stroke: #0a0a1e; stroke-width: 2.4px; stroke-linejoin: round;">
    1 AUGUST 1981 · "VIDEO KILLED THE RADIO STAR" · THE BUGGLES
  </text>

  <!-- ============================================================ -->
  <!-- SCANLINE OVERLAY + VIGNETTE                                    -->
  <!-- ============================================================ -->
  <rect width="800" height="200" fill="url(#scanlines)" pointer-events="none"/>
  <rect width="800" height="200" fill="url(#vig)"       pointer-events="none"/>
</svg>
