<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: America's Cup — 175th Anniversary (August 22, 1851) -->
<!-- about:
On 22 August 1851, the schooner America — 101 feet of black-hulled New York-built speed — sailed a 53-mile course around the Isle of Wight against fifteen British yachts and won the Royal Yacht Squadron's £100 Cup by a margin so wide the story spread on its own. When Queen Victoria, watching from the royal yacht at Cowes, asked who was second, the reply came back: "Your Majesty, there is no second." The trophy went home to the New York Yacht Club, where in 1857 the syndicate that had built America deeded it as a perpetual challenge cup — soon known simply as the America's Cup. It is the oldest international sporting trophy still contested, 175 years on.

The left half is the schooner America on a moonlit run past the Isle of Wight: raked twin masts, a spread of cream sails swelling in the westerly, a long dark hull cutting through gentle swell, and a low chalk-cliff silhouette in the distance. A pale moon hangs above with its cool halo, stars twinkle in a deep navy sky, and a thin wake trails aft. On the right, a large AUGUST 22, 2026 headline anchors a silver AMERICA'S CUP · 175 YEARS subhead, an italic amber SCHOONER AMERICA · ISLE OF WIGHT · £100 CUP tertiary, a dim cyan ROYAL YACHT SQUADRON · FIFTEEN CHALLENGERS · ONE PRIZE roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 22, 2026 — the 175th anniversary of the first America's Cup race. On the left half, the schooner America runs past the Isle of Wight under a full moon: two raked masts carry cream-coloured mainsail, foresail, and jib swelling gently in the westerly wind; a long low black hull cuts a thin white wake through dark rolling swell; a pale silver moon with a soft halo hangs at upper left, chalk-cliff silhouettes of the Needles sit on the far horizon, and stars twinkle across the deep navy sky. On the right, a huge cream AUGUST 22, 2026 headline underlined by a silver-to-blue sweep, a silver AMERICA'S CUP · 175 YEARS subhead trailed by cream · SINCE 1851, an italic amber SCHOONER AMERICA · ISLE OF WIGHT · £100 CUP tertiary, a dim cyan ROYAL YACHT SQUADRON · FIFTEEN CHALLENGERS · ONE PRIZE roster, and a Georgia-italic 'your majesty, there is no second.' caption at the base.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#141d33"/>
      <stop offset="100%" stop-color="#1a2540"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a2540"/>
      <stop offset="60%"  stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#e6ecf7" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#a8b8d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4a5a7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonDisc" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0%"   stop-color="#fbf6e6"/>
      <stop offset="70%"  stop-color="#e8dfc4"/>
      <stop offset="100%" stop-color="#b8ac86"/>
    </radialGradient>
    <linearGradient id="sailGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#f7efd4"/>
      <stop offset="55%"  stop-color="#e2d5a8"/>
      <stop offset="100%" stop-color="#b4a678"/>
    </linearGradient>
    <linearGradient id="jibGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#f5edd0"/>
      <stop offset="100%" stop-color="#c8b988"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="cliffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a4562"/>
      <stop offset="100%" stop-color="#1c2338"/>
    </linearGradient>
    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c8d4e8" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#c8d4e8" stop-opacity="1"/>
      <stop offset="48%"  stop-color="#f5efe0" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#3a6ea8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1a3a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f5efe0" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#f5efe0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5efe0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="360" height="140" fill="url(#skyGrad)"/>
  <!-- Sea -->
  <rect x="0" y="140" width="360" height="60" fill="url(#seaGrad)"/>

  <!-- Stars in the sky -->
  <g fill="#e6ecf7">
    <circle cx="24"  cy="18"  r="0.7" opacity="0.85"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="62"  cy="34"  r="0.5" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="14"  r="0.6" opacity="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="196" cy="30"  r="0.5" opacity="0.7"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="246" cy="12"  r="0.7" opacity="0.85"><animate attributeName="opacity" values="0.5;1;0.5" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="292" cy="46"  r="0.5" opacity="0.65"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="332" cy="24"  r="0.6" opacity="0.8"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="46"  cy="72"  r="0.5" opacity="0.6"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="168" cy="58"  r="0.5" opacity="0.6"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="78"  r="0.5" opacity="0.65"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="106" cy="50"  r="0.4" opacity="0.55"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="228" cy="72"  r="0.4" opacity="0.55"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="11s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moon halo & disc -->
  <ellipse cx="82" cy="46" rx="52" ry="52" fill="url(#moonHalo)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="82" cy="46" r="17" fill="url(#moonDisc)"/>
  <!-- Moon craters -->
  <g fill="#a89e78" opacity="0.55">
    <circle cx="76" cy="42" r="1.6"/>
    <circle cx="86" cy="52" r="2.1"/>
    <circle cx="90" cy="41" r="1.2"/>
    <circle cx="78" cy="52" r="1.0"/>
  </g>

  <!-- Distant Isle of Wight silhouette (chalk cliffs of the Needles area) -->
  <path d="M 0 140 L 0 132 L 22 130 L 44 126 L 70 128 L 96 124 L 122 128 L 148 126 L 176 130 L 210 132 L 244 134 L 276 133 L 308 135 L 340 134 L 360 136 L 360 140 Z"
        fill="url(#cliffGrad)" opacity="0.75"/>
  <!-- The Needles stacks -->
  <g fill="#c8cfdb" opacity="0.5">
    <path d="M 92 128 L 94 118 L 96 128 Z"/>
    <path d="M 100 128 L 102 121 L 104 128 Z"/>
    <path d="M 108 128 L 110 124 L 112 128 Z"/>
  </g>

  <!-- Moon reflection on sea -->
  <g opacity="0.7">
    <ellipse cx="82" cy="152" rx="24" ry="1.6" fill="#e6ecf7" opacity="0.35">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="82" cy="160" rx="18" ry="1.2" fill="#e6ecf7" opacity="0.28">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="82" cy="168" rx="12" ry="1.0" fill="#e6ecf7" opacity="0.22">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Distant swell lines -->
  <g stroke="#3a4a6a" stroke-width="0.5" fill="none" opacity="0.55">
    <path d="M 0 146 Q 30 144 60 146 T 120 146 T 180 146 T 240 146 T 300 146 T 360 146">
      <animate attributeName="d"
        values="M 0 146 Q 30 144 60 146 T 120 146 T 180 146 T 240 146 T 300 146 T 360 146;
                M 0 146 Q 30 148 60 146 T 120 146 T 180 146 T 240 146 T 300 146 T 360 146;
                M 0 146 Q 30 144 60 146 T 120 146 T 180 146 T 240 146 T 300 146 T 360 146"
        dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 156 Q 40 154 80 156 T 160 156 T 240 156 T 320 156 T 360 156">
      <animate attributeName="d"
        values="M 0 156 Q 40 154 80 156 T 160 156 T 240 156 T 320 156 T 360 156;
                M 0 156 Q 40 158 80 156 T 160 156 T 240 156 T 320 156 T 360 156;
                M 0 156 Q 40 154 80 156 T 160 156 T 240 156 T 320 156 T 360 156"
        dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 168 Q 50 166 100 168 T 200 168 T 300 168 T 360 168">
      <animate attributeName="d"
        values="M 0 168 Q 50 166 100 168 T 200 168 T 300 168 T 360 168;
                M 0 168 Q 50 170 100 168 T 200 168 T 300 168 T 360 168;
                M 0 168 Q 50 166 100 168 T 200 168 T 300 168 T 360 168"
        dur="17s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 182 Q 60 180 120 182 T 240 182 T 360 182">
      <animate attributeName="d"
        values="M 0 182 Q 60 180 120 182 T 240 182 T 360 182;
                M 0 182 Q 60 184 120 182 T 240 182 T 360 182;
                M 0 182 Q 60 180 120 182 T 240 182 T 360 182"
        dur="19s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- The schooner America — gently rocking as one unit -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-0.9 250 150; 0.9 250 150; -0.9 250 150"
      dur="13s" repeatCount="indefinite"/>

    <!-- Wake trailing aft (behind the hull, to the right) -->
    <path d="M 306 148 Q 336 149 356 152 Q 336 150 306 150 Z" fill="url(#wakeGrad)" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- HULL — long, low, sleek, raked stem forward (left) -->
    <path d="M 178 148 Q 176 146 184 143 L 296 143 Q 308 143 314 146 Q 316 148 314 150 L 296 154 Q 232 156 190 154 Z"
          fill="url(#hullGrad)" stroke="#0a0a10" stroke-width="0.4"/>
    <!-- Copper waterline stripe (thin) -->
    <path d="M 184 149 L 314 149" stroke="#8a5a2a" stroke-width="0.4" opacity="0.55"/>
    <!-- Deck line (subtle) -->
    <path d="M 184 144 L 296 144" stroke="#3a3a45" stroke-width="0.3" opacity="0.5"/>

    <!-- Bowsprit reaching forward -->
    <line x1="178" y1="145" x2="158" y2="140" stroke="#1a1a20" stroke-width="1.0"/>
    <!-- Bowsprit stay to bow -->
    <line x1="158" y1="140" x2="178" y2="147" stroke="#3a3a45" stroke-width="0.35"/>

    <!-- FOREMAST (raked backward) — steps at x=210, y=143, tops at x=222, y=44 -->
    <line x1="210" y1="143" x2="222" y2="44" stroke="#1a1208" stroke-width="1.3"/>
    <!-- MAINMAST (raked backward) — steps at x=270, y=143, tops at x=284, y=30 -->
    <line x1="270" y1="143" x2="284" y2="30" stroke="#1a1208" stroke-width="1.4"/>

    <!-- Standing rigging (shrouds) -->
    <g stroke="#2a2a30" stroke-width="0.35" opacity="0.75">
      <line x1="204" y1="143" x2="220" y2="60"/>
      <line x1="216" y1="143" x2="222" y2="60"/>
      <line x1="264" y1="143" x2="282" y2="46"/>
      <line x1="276" y1="143" x2="284" y2="46"/>
      <!-- Forestay (mainmast head to foremast head) -->
      <line x1="222" y1="44" x2="284" y2="30"/>
      <!-- Backstay -->
      <line x1="284" y1="30" x2="300" y2="143"/>
    </g>

    <!-- JIB (triangular headsail, off the bowsprit) -->
    <path d="M 158 140 L 222 46 L 210 143 Z" fill="url(#jibGrad)" opacity="0.95">
      <animateTransform attributeName="transform" type="skewX"
        values="0;1.6;0" dur="11s" repeatCount="indefinite"/>
    </path>
    <!-- Jib subtle shadow crease -->
    <path d="M 190 100 Q 200 95 210 108" stroke="#8a7f5a" stroke-width="0.4" fill="none" opacity="0.55"/>

    <!-- FORESAIL (between the two masts — schooner rig; gaff sail) -->
    <!-- Gaff (upper spar from foremast) -->
    <line x1="222" y1="52" x2="266" y2="60" stroke="#1a1208" stroke-width="0.7"/>
    <!-- Boom (lower spar from foremast) -->
    <line x1="212" y1="140" x2="268" y2="140" stroke="#1a1208" stroke-width="0.7"/>
    <path d="M 222 52 L 266 60 L 268 140 L 212 140 Z" fill="url(#sailGrad)" opacity="0.95">
      <animateTransform attributeName="transform" type="skewX"
        values="0;1.4;0" dur="13s" repeatCount="indefinite"/>
    </path>
    <!-- Foresail crease -->
    <path d="M 232 90 Q 248 88 262 100" stroke="#8a7f5a" stroke-width="0.4" fill="none" opacity="0.5"/>

    <!-- MAINSAIL (aft, largest — schooner's signature big driver) -->
    <!-- Gaff (upper spar from mainmast) -->
    <line x1="284" y1="34" x2="326" y2="52" stroke="#1a1208" stroke-width="0.8"/>
    <!-- Boom (lower spar from mainmast, extending well aft) -->
    <line x1="272" y1="140" x2="336" y2="140" stroke="#1a1208" stroke-width="0.8"/>
    <path d="M 284 34 L 326 52 L 336 140 L 272 140 Z" fill="url(#sailGrad)" opacity="0.97">
      <animateTransform attributeName="transform" type="skewX"
        values="0;1.8;0" dur="17s" repeatCount="indefinite"/>
    </path>
    <!-- Mainsail creases -->
    <path d="M 292 78 Q 312 76 330 90" stroke="#8a7f5a" stroke-width="0.4" fill="none" opacity="0.5"/>
    <path d="M 288 108 Q 310 106 332 118" stroke="#8a7f5a" stroke-width="0.4" fill="none" opacity="0.45"/>

    <!-- Small burgee at masthead -->
    <path d="M 284 30 L 296 26 L 292 32 L 296 34 L 284 34 Z" fill="#c8324a" opacity="0.9">
      <animate attributeName="d"
        values="M 284 30 L 296 26 L 292 32 L 296 34 L 284 34 Z;
                M 284 30 L 296 28 L 292 32 L 296 32 L 284 34 Z;
                M 284 30 L 296 26 L 292 32 L 296 34 L 284 34 Z"
        dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foam highlights at the bow -->
  <g fill="#f5efe0" opacity="0.65">
    <ellipse cx="180" cy="150" rx="6" ry="1.1">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="174" cy="153" rx="4" ry="0.8">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Seam between sea panel and text panel -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 22, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#c8d4e8">AMERICA&#8217;S CUP</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;175 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;&#160;·&#160;&#160;SINCE 1851</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    SCHOONER AMERICA · ISLE OF WIGHT · £100 CUP
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7fd4b8" letter-spacing="1" opacity="0.9">
    ROYAL YACHT SQUADRON · FIFTEEN CHALLENGERS · ONE PRIZE
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;your majesty, there is no second.&#8221;
  </text>
</svg>
