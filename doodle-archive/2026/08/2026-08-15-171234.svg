<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Woodstock — 57th Anniversary (August 15, 1969) -->
<!-- about:
On 15 August 1969, half a million people converged on Max Yasgur's dairy farm in Bethel, New York, for what the poster billed as "3 Days of Peace & Music." Over the next four rain-soaked days they heard Richie Havens open, Jimi Hendrix close with a distorted Star-Spangled Banner, and Janis Joplin, Santana, The Who, Sly Stone, and CSNY pass through the stage in between. The traffic jammed the New York State Thruway, the fences came down, the promoters lost money, and the culture never quite reset. Fifty-seven years today.

The left half is a slowly-turning tie-dye sunburst — warm bands of magenta, orange, and gold — behind a big white peace symbol, with a trio of doves crossing the sky. On the right, a large AUGUST 15, 2026 headline anchors a magenta WOODSTOCK · 57 YEARS subhead, an italic 3 DAYS OF PEACE & MUSIC tagline naming Max Yasgur's farm, a dim-cyan HENDRIX · JOPLIN · SANTANA · THE WHO · CSNY roster, and a Georgia-italic caption from the stage.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 15, 2026 — the 57th anniversary of Woodstock. On the left, a slowly-turning tie-dye sunburst in magenta, orange, and gold behind a big white outlined peace symbol. Three white doves cross the sky. On the right, a huge cream AUGUST 15, 2026 headline underlined by a magenta-to-gold sweep, a magenta WOODSTOCK · 57 YEARS subhead trailed by cream · SINCE 1969, italic amber 3 DAYS OF PEACE &amp; MUSIC · MAX YASGUR'S FARM · BETHEL NY tertiary, dim-cyan HENDRIX · JOPLIN · SANTANA · THE WHO · CSNY tertiary, and a Georgia-italic caption 'half a million kids, and I think you have proven something to the world.'">
  <defs>
    <linearGradient id="nightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a0a24"/>
    </linearGradient>

    <!-- Tie-dye sun (yellow core → orange → magenta → deep purple → transparent) -->
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd447"/>
      <stop offset="30%"  stop-color="#ff8c1a"/>
      <stop offset="55%"  stop-color="#e91e63"/>
      <stop offset="80%"  stop-color="#4a1e6b"/>
      <stop offset="100%" stop-color="#1a0a24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e91e63" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#e91e63" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#ffd447" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffd447" stop-opacity="0"/>
    </linearGradient>

    <!-- One warm-gold ray -->
    <symbol id="ray" overflow="visible">
      <polygon points="0,-140 -5,0 5,0" fill="#ffd447" opacity="0.32"/>
    </symbol>

    <!-- Dove silhouette -->
    <symbol id="dove" overflow="visible">
      <ellipse cx="0" cy="0" rx="10" ry="3.4" fill="#f5efe0"/>
      <circle cx="10" cy="-2" r="2.8" fill="#f5efe0"/>
      <polygon points="12.5,-2 17,-1 12.5,0.4" fill="#ffb84d"/>
      <path d="M -3 -1 Q -8 -13 -20 -9 Q -11 -6 -6 0 Z" fill="#f5efe0"/>
      <polygon points="-8,-1 -15,-3 -15,3 -8,1" fill="#f5efe0"/>
    </symbol>
  </defs>

  <!-- Night sky -->
  <rect width="800" height="200" fill="url(#nightGrad)"/>

  <!-- ==================== TIE-DYE SUNBURST (LEFT) ==================== -->
  <g transform="translate(180 100)">
    <!-- Gold ray spokes, slow clockwise -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="47s" repeatCount="indefinite"/>
      <use href="#ray" transform="rotate(0)"/>
      <use href="#ray" transform="rotate(30)"/>
      <use href="#ray" transform="rotate(60)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)"/>
      <use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(300)"/>
      <use href="#ray" transform="rotate(330)"/>
    </g>
    <!-- Magenta counter-rotating rays -->
    <g opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="83s" repeatCount="indefinite"/>
      <polygon points="0,-125 -4,0 4,0" fill="#e91e63" transform="rotate(15)"/>
      <polygon points="0,-125 -4,0 4,0" fill="#e91e63" transform="rotate(75)"/>
      <polygon points="0,-125 -4,0 4,0" fill="#e91e63" transform="rotate(135)"/>
      <polygon points="0,-125 -4,0 4,0" fill="#e91e63" transform="rotate(195)"/>
      <polygon points="0,-125 -4,0 4,0" fill="#e91e63" transform="rotate(255)"/>
      <polygon points="0,-125 -4,0 4,0" fill="#e91e63" transform="rotate(315)"/>
    </g>
    <!-- Tie-dye sun disk, gently breathing -->
    <circle cx="0" cy="0" r="90" fill="url(#sunGrad)">
      <animate attributeName="r" values="86;93;86" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== PEACE SYMBOL (dark outline + white) ==================== -->
  <g transform="translate(180 100)" fill="none" stroke-linecap="round">
    <g stroke="#1a0a24" stroke-width="11">
      <circle cx="0" cy="0" r="52"/>
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="0" y1="0" x2="-45" y2="26"/>
      <line x1="0" y1="0" x2="45" y2="26"/>
    </g>
    <g stroke="#f5efe0" stroke-width="7">
      <circle cx="0" cy="0" r="52"/>
      <line x1="0" y1="-52" x2="0" y2="52"/>
      <line x1="0" y1="0" x2="-45" y2="26"/>
      <line x1="0" y1="0" x2="45" y2="26"/>
    </g>
  </g>

  <!-- ==================== FLYING DOVES ==================== -->
  <g>
    <use href="#dove">
      <animateTransform attributeName="transform" type="translate" values="-40 30;830 22" dur="41s" repeatCount="indefinite"/>
    </use>
    <use href="#dove" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="-40 175;830 170" dur="53s" begin="7s" repeatCount="indefinite"/>
    </use>
    <use href="#dove" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="830 55;-40 60" dur="61s" begin="3s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="366" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 15, 2026
  </text>

  <rect x="366" y="76" width="410" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="366;376;366" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="366" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#ff6f9e">WOODSTOCK · 57 YEARS</tspan><tspan fill="#f5efe0" opacity="0.7"> · SINCE 1969</tspan>
  </text>

  <text x="366" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    3 DAYS OF PEACE &amp; MUSIC · MAX YASGUR'S FARM · BETHEL NY
  </text>

  <text x="366" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#6bd4c8" letter-spacing="1" opacity="0.9">
    HENDRIX · JOPLIN · SANTANA · THE WHO · CSNY
  </text>

  <text x="366" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;half a million kids &#8212; you have proven something to the world.&#8221;
  </text>
</svg>
