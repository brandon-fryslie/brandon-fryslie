<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Perseid Meteor Shower — active mid-July through late August 2026, peaks Aug 11–13. On Aug 2 the shower is ramping up. Meteors appear to radiate from the constellation Perseus (northeastern sky before dawn). A night-sky tableau on an 800x200 canvas: an inky navy-to-cobalt gradient sky with a low silhouetted horizon of coniferous treetops along the bottom; a Milky Way band of soft cyan/violet nebulosity drifts through the upper half; the Perseus constellation is drawn as small linked star-points at the left with a labeled cluster; a bright golden RADIANT star sits at the top-left with faint concentric halo rings; five to seven meteors streak diagonally down-right across the sky at staggered intervals, each a bright white head trailing a tapered cyan/gold tail with a soft glow; softer star pinpricks twinkle throughout; on the right, a huge cream AUGUST 2, 2026 headline sits above a gold PERSEID METEOR SHOWER subhead and an italic PEAKS AUG 11–13 · SWIFT-TUTTLE · RADIANT: PERSEUS tertiary. Continuously animated: meteors loop with staggered begins, radiant halo pulses, stars twinkle, Milky Way slowly drifts. Background #050915. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 2, 2026 — Perseid Meteor Shower. A night-sky tableau: inky navy sky with a silhouetted horizon of dark coniferous treetops along the bottom; a soft cyan-violet Milky Way band drifts through the upper half; the Perseus constellation is drawn as linked star-points at the upper left with a bright golden radiant star haloed by faint concentric rings; several meteors streak diagonally down-right, each a white head trailing a tapered cyan-gold tail; smaller stars twinkle throughout. On the right, a huge cream AUGUST 2, 2026 headline, a gold PERSEID METEOR SHOWER subhead, and italic PEAKS AUG 11–13 · SWIFT-TUTTLE · RADIANT: PERSEUS tertiary.">
  <defs>
    <!-- Sky gradient: deep space top, softer navy near horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03060f"/>
      <stop offset="55%" stop-color="#0a1327"/>
      <stop offset="100%" stop-color="#111d3a"/>
    </linearGradient>

    <!-- Radiant halo -->
    <radialGradient id="radHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe28a" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffb347" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>

    <!-- Milky Way soft nebular gradient -->
    <linearGradient id="milky" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#7fffd4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a4c9ff" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#c9a4ff" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#7fbfff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor tail gradient: bright head fading to transparent tail -->
    <linearGradient id="tailWhite" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#8fd4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8fd4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailGold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#ffd57a" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ff8f4a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff8f4a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tailMint" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#c2ffea" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#7fffd4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- A meteor: bright head + tapered tail (as a rotated group).
         Origin is the head (0,0); tail extends into -x, +y direction.
         Head at (0,0), tail approximates a thin comet stroke. -->
    <symbol id="meteor" overflow="visible">
      <!-- Broad soft glow trail -->
      <path d="M 0 0 L -70 60 L -74 56 L 0 -2 Z" fill="url(#tailWhite)" opacity="0.6"/>
      <!-- Sharp bright core stroke -->
      <path d="M 0 0 L -60 52" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
      <!-- Bright head -->
      <circle r="2.6" fill="#ffffff" filter="url(#bigGlow)"/>
      <circle r="1.4" fill="#ffffff"/>
    </symbol>

    <style>
      .cream  { fill: #f5efd8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .gold   { fill: #ffcf6b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mint   { fill: #7fffd4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .dim    { fill: #7fa4d6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono   { font-family: 'SF Mono', Menlo, Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- ============ Sky background ============ -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- ============ Milky Way band (drifts) ============ -->
  <g opacity="0.85">
    <ellipse cx="420" cy="70" rx="360" ry="46" fill="url(#milky)" transform="rotate(-8 420 70)">
      <animateTransform attributeName="transform" type="rotate"
        values="-8 420 70; -9.5 420 70; -8 420 70" dur="29s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="60" rx="220" ry="24" fill="url(#milky)" transform="rotate(-8 500 60)" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ============ Twinkling background stars ============ -->
  <g fill="#e8f0ff">
    <!-- Distributed pinpricks with staggered twinkles -->
    <circle cx="60"  cy="30" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="90"  cy="75" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite" begin="-0.5s"/></circle>
    <circle cx="140" cy="20" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite" begin="-1.1s"/></circle>
    <circle cx="200" cy="40" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.7s" repeatCount="indefinite" begin="-0.8s"/></circle>
    <circle cx="240" cy="88" r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite" begin="-1.6s"/></circle>
    <circle cx="270" cy="18" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite" begin="-0.3s"/></circle>
    <circle cx="315" cy="55" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite" begin="-2.0s"/></circle>
    <circle cx="360" cy="30" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite" begin="-1.4s"/></circle>
    <circle cx="400" cy="95" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" repeatCount="indefinite" begin="-0.6s"/></circle>
    <circle cx="440" cy="15" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" begin="-1.9s"/></circle>
    <circle cx="470" cy="50" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite" begin="-2.4s"/></circle>
    <circle cx="510" cy="115" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" begin="-0.9s"/></circle>
    <circle cx="560" cy="20" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.3s" repeatCount="indefinite" begin="-1.7s"/></circle>
    <circle cx="600" cy="105" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" repeatCount="indefinite" begin="-0.2s"/></circle>
    <circle cx="635" cy="35" r="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" begin="-2.1s"/></circle>
    <circle cx="675" cy="80" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite" begin="-1.3s"/></circle>
    <circle cx="720" cy="18" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite" begin="-0.4s"/></circle>
    <circle cx="755" cy="55" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.1s" repeatCount="indefinite" begin="-1.8s"/></circle>
    <circle cx="780" cy="30" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite" begin="-0.7s"/></circle>
    <circle cx="30"  cy="60" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite" begin="-1.5s"/></circle>
    <circle cx="180" cy="115" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite" begin="-0.6s"/></circle>
    <circle cx="340" cy="115" r="0.6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite" begin="-1.2s"/></circle>
  </g>

  <!-- ============ Perseus constellation (upper-left) ============ -->
  <g stroke="#7fbfff" stroke-width="0.7" fill="none" opacity="0.55">
    <!-- Simplified Perseus stick figure -->
    <path d="M 55 42 L 85 55 L 115 48 L 138 72 L 118 95 L 92 82 L 85 55 M 138 72 L 165 88 M 115 48 L 130 28"/>
  </g>
  <g fill="#e8f0ff" filter="url(#softGlow)">
    <circle cx="55"  cy="42" r="1.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="85"  cy="55" r="2.1"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.1s" repeatCount="indefinite" begin="-1.0s"/></circle>
    <circle cx="115" cy="48" r="1.5"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.9s" repeatCount="indefinite" begin="-0.5s"/></circle>
    <circle cx="138" cy="72" r="1.8"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.1s" repeatCount="indefinite" begin="-1.7s"/></circle>
    <circle cx="118" cy="95" r="1.4"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.3s" repeatCount="indefinite" begin="-0.8s"/></circle>
    <circle cx="92"  cy="82" r="1.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite" begin="-2.0s"/></circle>
    <circle cx="165" cy="88" r="1.3"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite" begin="-1.4s"/></circle>
    <circle cx="130" cy="28" r="1.4"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.9s" repeatCount="indefinite" begin="-0.3s"/></circle>
  </g>

  <!-- Constellation label -->
  <text x="55" y="118" class="dim mono" font-size="8" letter-spacing="2.5" opacity="0.7">PERSEUS</text>

  <!-- ============ Radiant point with pulsing halo ============ -->
  <g transform="translate(105,58)">
    <circle r="34" fill="url(#radHalo)">
      <animate attributeName="r" values="30;42;30" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="none" stroke="#ffcf6b" stroke-width="0.6" opacity="0.35">
      <animate attributeName="r" values="18;28;18" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#fff2c2" filter="url(#bigGlow)"/>
    <circle r="2" fill="#ffffff"/>
    <!-- 4-point starburst -->
    <g stroke="#ffe28a" stroke-width="0.8" opacity="0.9">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>
  </g>

  <!-- ============ Meteors ============ -->
  <!-- All meteors emanate roughly from the radiant (~105,58) and streak toward
       lower-right at approximately the same angle (~140° from +x). Use
       animateMotion with a straight-line path plus staggered begins so the
       shower feels continuous. -->
  <g filter="url(#softGlow)">
    <!-- Meteor 1: long streak across upper sky -->
    <use href="#meteor" transform="rotate(-40)" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" path="M 105 58 L 470 158"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.55;0.75" dur="7s" repeatCount="indefinite"/>
    </use>

    <!-- Meteor 2 -->
    <use href="#meteor" transform="rotate(-40)" opacity="0">
      <animateMotion dur="11s" repeatCount="indefinite" begin="-2.3s" path="M 120 40 L 620 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.5;0.7" dur="11s" repeatCount="indefinite" begin="-2.3s"/>
    </use>

    <!-- Meteor 3 -->
    <use href="#meteor" transform="rotate(-40)" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" begin="-4.5s" path="M 140 70 L 500 190"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.6;0.8" dur="7s" repeatCount="indefinite" begin="-4.5s"/>
    </use>

    <!-- Meteor 4: shorter streak -->
    <use href="#meteor" transform="rotate(-40) scale(0.75)" opacity="0">
      <animateMotion dur="13s" repeatCount="indefinite" begin="-6.5s" path="M 90 90 L 330 170"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.35;0.5" dur="13s" repeatCount="indefinite" begin="-6.5s"/>
    </use>

    <!-- Meteor 5: bright fireball -->
    <use href="#meteor" transform="rotate(-40) scale(1.25)" opacity="0">
      <animateMotion dur="11s" repeatCount="indefinite" begin="-1.1s" path="M 130 30 L 720 210"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.5;0.7" dur="11s" repeatCount="indefinite" begin="-1.1s"/>
    </use>

    <!-- Meteor 6 -->
    <use href="#meteor" transform="rotate(-40) scale(0.9)" opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" begin="-3.4s" path="M 110 70 L 400 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.55;0.75" dur="7s" repeatCount="indefinite" begin="-3.4s"/>
    </use>
  </g>

  <!-- ============ Horizon: silhouetted coniferous treetops ============ -->
  <g fill="#050915">
    <path d="M 0 180
             L 0 175
             L 20 172 L 30 178 L 45 168 L 55 176 L 70 170 L 82 178 L 95 165 L 108 176 L 122 170
             L 138 178 L 152 168 L 168 176 L 182 172 L 198 178 L 215 165 L 230 176 L 248 170
             L 265 178 L 280 168 L 298 176 L 315 172 L 332 178 L 350 168 L 368 176 L 385 172
             L 402 178 L 420 168 L 438 176 L 456 172 L 475 178 L 494 168 L 512 176 L 530 172
             L 548 178 L 566 168 L 584 176 L 602 172 L 622 178 L 642 168 L 660 176 L 680 172
             L 700 178 L 720 168 L 738 176 L 758 172 L 778 178 L 800 172
             L 800 200 L 0 200 Z"/>
  </g>

  <!-- ============ Text block (right) ============ -->
  <g>
    <!-- Faint dark panel behind text for legibility over Milky Way -->
    <rect x="330" y="42" width="460" height="130" rx="4" fill="#050915" opacity="0.55"/>

    <!-- Headline: date -->
    <text x="560" y="94" text-anchor="middle" class="cream" font-size="42" font-weight="800" letter-spacing="1.6" filter="url(#softGlow)">
      AUGUST 2, 2026
    </text>

    <!-- Subhead -->
    <text x="560" y="126" text-anchor="middle" class="gold" font-size="17" font-weight="700" letter-spacing="4.5" filter="url(#softGlow)">
      PERSEID METEOR SHOWER
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- Tertiary tagline -->
    <text x="560" y="152" text-anchor="middle" class="mint" font-size="10" font-style="italic" letter-spacing="2.4" opacity="0.9">
      PEAKS AUG 11–13 · SWIFT-TUTTLE · RADIANT: PERSEUS
    </text>

    <!-- Small "tonight's forecast" chip -->
    <g transform="translate(468,52)">
      <rect x="0" y="0" width="184" height="14" rx="2" fill="#0a1327" stroke="#1e3a66" stroke-width="0.7"/>
      <circle cx="9" cy="7" r="2.2" fill="#ffcf6b">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="10" class="mono" font-size="9" fill="#7fbfff">tonight · pre-dawn NE sky</text>
    </g>
  </g>

  <!-- ============ Corner registration ticks ============ -->
  <g stroke="#1e3a66" stroke-width="1" fill="none" opacity="0.6">
    <path d="M 6 6 h 12 M 6 6 v 12"/>
    <path d="M 794 6 h -12 M 794 6 v 12"/>
    <path d="M 6 194 h 12 M 6 194 v -12"/>
    <path d="M 794 194 h -12 M 794 194 v -12"/>
  </g>
</svg>
