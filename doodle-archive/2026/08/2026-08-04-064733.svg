<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Louis Armstrong's 125th Birthday (August 4, 1901) — Born 4 August 1901 in New Orleans, Louis "Satchmo" Armstrong transformed jazz with his virtuoso trumpet playing, gravelly vocals, and popularization of scat singing. Signature recordings: "West End Blues" (1928), "What a Wonderful World" (1967), "Hello, Dolly!" (1964). Composition: a warm jazz-club tableau on the 800x200 canvas. Dark night background with a warm amber radial glow spilling from the left. A huge golden trumpet bell viewed head-on occupies the left third (a bright gold rim, a flared inner cone shading from gold through burnt-orange down to a dark tube throat, with a warm rim-light arc top-left). Three staggered gold sound-wave rings continually expand outward from the bell. Golden musical notes (eighth notes and a beamed pair, drawn as SVG paths so they render without font-dependent glyphs) drift up and rightward from the bell mouth, staying clear of the text column. On the right, a huge cream AUGUST 4, 2026 headline, a warm-gold LOUIS ARMSTRONG · 125 YEARS subhead with an underline sweeping right to left, italic tertiary lines SATCHMO · NEW ORLEANS · 4 AUGUST 1901 and TRUMPET · SCAT · "WHAT A WONDERFUL WORLD", and a Georgia-italic quote at the base. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 4, 2026 — Louis Armstrong's 125th birthday. A warm jazz-club tableau: dark background with a warm amber radial glow spilling from the left, a huge golden trumpet bell viewed head-on occupying the left third (a bright gold rim with a flared inner cone shading from gold through burnt-orange down to a dark tube throat, with a warm rim-light arc top-left), three staggered pulsing gold sound-wave rings expanding outward, and golden musical notes drifting up and rightward from the bell mouth. On the right, a huge cream AUGUST 4, 2026 headline, a warm-gold LOUIS ARMSTRONG · 125 YEARS subhead with an underline that sweeps right to left, italic tertiary lines SATCHMO · NEW ORLEANS · 4 AUGUST 1901 and TRUMPET · SCAT · WHAT A WONDERFUL WORLD, and a Georgia-italic quote at the base.">
  <defs>
    <!-- Warm background: amber pooling from the left, fading to profile dark on the right -->
    <radialGradient id="bg" cx="0.22" cy="0.55" r="0.85">
      <stop offset="0" stop-color="#4a2510"/>
      <stop offset="0.5" stop-color="#1a0e08"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>

    <!-- Trumpet bell flare: bright gold rim → burnt orange mid → dark tube throat -->
    <radialGradient id="bellFlare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a1608"/>
      <stop offset="0.35" stop-color="#6b3d10"/>
      <stop offset="0.65" stop-color="#c8871a"/>
      <stop offset="0.92" stop-color="#f5c14b"/>
      <stop offset="1" stop-color="#e0a52b"/>
    </radialGradient>
    <radialGradient id="tubeDark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#3a1e08"/>
    </radialGradient>
    <radialGradient id="bellGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c14b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5c14b" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft glow filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="bigGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <!-- Reusable eighth-note glyph (path, no font dependency) -->
    <g id="eighthNote">
      <ellipse cx="0" cy="0" rx="5.2" ry="3.6" transform="rotate(-24)"/>
      <path d="M 4.75 -1.4 L 4.75 -22 Q 13 -19 12 -12 Q 11.2 -7.8 7 -6" fill="none" stroke-width="1.7" stroke-linecap="round"/>
    </g>

    <!-- Reusable beamed pair (two notes joined by a top beam) -->
    <g id="beamedPair">
      <ellipse cx="0" cy="0" rx="4.6" ry="3.2" transform="rotate(-24)"/>
      <ellipse cx="13" cy="1.2" rx="4.6" ry="3.2" transform="rotate(-24 13 1.2)"/>
      <path d="M 4.35 -1.3 L 4.35 -22.5" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <path d="M 17.35 -0.1 L 17.35 -21.3" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <path d="M 3.6 -22.5 L 18.1 -21.3" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    </g>

    <style>
      .headline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 1.6px;
        fill: #f4e4c1;
      }
      .subhead {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 3.4px;
        fill: #f5c14b;
      }
      .tertiary {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-style: italic;
        font-weight: 600;
        letter-spacing: 1.3px;
        fill: #d4a04a;
      }
      .tertiary-dim {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-style: italic;
        font-weight: 600;
        letter-spacing: 1.3px;
        fill: #a67a3a;
      }
      .quote {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: 0.8px;
        fill: #b8873a;
      }
      .noteFill { fill: #f5c14b; stroke: #f5c14b; }
      .noteFillWarm { fill: #ffd577; stroke: #ffd577; }
    </style>
  </defs>

  <!-- ================ BACKGROUND ================ -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Ambient warm bell glow (breathing) -->
  <circle cx="160" cy="100" r="135" fill="url(#bellGlow)">
    <animate attributeName="r" values="125;145;125" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- ================ SOUND WAVE RINGS ================ -->
  <g fill="none" stroke="#f5c14b">
    <circle cx="160" cy="100" r="70" opacity="0" stroke-width="1.8">
      <animate attributeName="r" values="70;185" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.18;1" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2.2;0.4" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="100" r="70" opacity="0" stroke-width="1.8">
      <animate attributeName="r" values="70;185" dur="11s" begin="3.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.18;1" dur="11s" begin="3.7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2.2;0.4" dur="11s" begin="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="100" r="70" opacity="0" stroke-width="1.8">
      <animate attributeName="r" values="70;185" dur="11s" begin="7.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.18;1" dur="11s" begin="7.3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2.2;0.4" dur="11s" begin="7.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================ TRUMPET BELL (head-on view) ================ -->
  <g transform="translate(160, 100)">
    <!-- Outer bright rim -->
    <circle r="74" fill="#f5c14b"/>
    <circle r="72" fill="#e0a52b"/>
    <!-- Flared cone (dark throat → gold rim gradient) -->
    <circle r="66" fill="url(#bellFlare)"/>
    <!-- Inner tube going away -->
    <circle r="22" fill="url(#tubeDark)"/>
    <!-- Depth ring highlight just inside rim -->
    <circle r="63" fill="none" stroke="#ffcf6a" stroke-width="1" opacity="0.55"/>
    <circle r="45" fill="none" stroke="#8a5814" stroke-width="1" opacity="0.5"/>
    <!-- Rim highlight arc (top-left, warm) -->
    <path d="M -58 -46 A 74 74 0 0 1 42 -61" stroke="#fff2b8" stroke-width="3" fill="none" opacity="0.88" filter="url(#softGlow)"/>
    <!-- Rim bottom-right subtle shadow -->
    <path d="M 55 48 A 74 74 0 0 1 -38 62" stroke="#5a340a" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- A tiny glint on the rim -->
    <circle cx="-42" cy="-55" r="2.4" fill="#ffffff" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================ MUSICAL NOTES drifting up-right ================ -->
  <!-- All notes stay left of x≈310 to avoid overlapping the text column -->
  <g class="noteFill" filter="url(#softGlow)">
    <g>
      <use href="#eighthNote" transform="scale(1.3)"/>
      <animateTransform attributeName="transform" type="translate"
        values="222,110; 250,72; 278,32"
        keyTimes="0;0.55;1" dur="11s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.95;0" keyTimes="0;0.2;0.7;1" dur="11s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#beamedPair" transform="scale(1.1)"/>
      <animateTransform attributeName="transform" type="translate"
        values="215,105; 236,60; 260,18"
        keyTimes="0;0.55;1" dur="13s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.2;0.7;1" dur="13s" begin="2.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#eighthNote" transform="scale(1.05)"/>
      <animateTransform attributeName="transform" type="translate"
        values="230,115; 262,90; 305,68"
        keyTimes="0;0.55;1" dur="13s" begin="5.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.2;0.7;1" dur="13s" begin="5.1s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#eighthNote" transform="scale(0.85)"/>
      <animateTransform attributeName="transform" type="translate"
        values="220,102; 240,58; 268,22"
        keyTimes="0;0.55;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.2;0.7;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    <g class="noteFillWarm">
      <use href="#beamedPair" transform="scale(0.9)"/>
      <animateTransform attributeName="transform" type="translate"
        values="225,108; 258,80; 290,55"
        keyTimes="0;0.55;1" dur="11s" begin="6.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.2;0.7;1" dur="11s" begin="6.6s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#eighthNote" transform="scale(0.75)"/>
      <animateTransform attributeName="transform" type="translate"
        values="215,100; 228,72; 250,48"
        keyTimes="0;0.55;1" dur="7s" begin="8.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0.9;0" keyTimes="0;0.2;0.7;1" dur="7s" begin="8.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ================ TEXT COLUMN (right) ================ -->

  <!-- Faint glow-copy under headline for warmth -->
  <g filter="url(#bigGlow)" opacity="0.55">
    <text x="340" y="72" class="headline" font-size="40" fill="#8a5814">AUGUST 4, 2026</text>
  </g>
  <!-- Huge date headline -->
  <text x="340" y="72" class="headline" font-size="40">AUGUST 4, 2026</text>

  <!-- Underline sweep -->
  <line x1="340" y1="86" x2="340" y2="86" stroke="#f5c14b" stroke-width="1.4" opacity="0.9">
    <animate attributeName="x2" values="340;720;720;340" keyTimes="0;0.35;0.85;1" dur="13s" repeatCount="indefinite"/>
  </line>

  <!-- Subhead -->
  <text x="340" y="108" class="subhead" font-size="13">LOUIS ARMSTRONG  ·  125 YEARS</text>

  <!-- Tertiary lines -->
  <text x="340" y="132" class="tertiary" font-size="11">SATCHMO  ·  NEW ORLEANS  ·  4 AUGUST 1901</text>
  <text x="340" y="150" class="tertiary-dim" font-size="11">TRUMPET  ·  SCAT  ·  &quot;WHAT A WONDERFUL WORLD&quot;</text>

  <!-- Warm quote at the base, in Georgia italic -->
  <text x="340" y="178" class="quote" font-size="11">&quot;If you have to ask what jazz is, you'll never know.&quot;</text>

</svg>
