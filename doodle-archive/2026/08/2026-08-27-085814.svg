<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: 19th Amendment Certified — 106th Anniversary (August 26, 1920) -->
<!-- about:
On 26 August 1920, U.S. Secretary of State Bainbridge Colby signed the proclamation certifying that Tennessee had become the thirty-sixth state to ratify the Nineteenth Amendment — the last one needed — and that "the right of citizens of the United States to vote shall not be denied or abridged by the United States or by any State on account of sex." Seventy-two years of organizing had led to that pen stroke: Seneca Falls in 1848, the split between the National and American associations, the state-by-state grind, the picketing of the Wilson White House, the hunger strikes. Tennessee itself came down to a single vote in the state house, cast by 24-year-old Harry Burn after his mother wrote him a letter telling him to "be a good boy." Congress made the day Women's Equality Day in 1971.

The left half is the certified proclamation on parchment: a fountain pen lays down the signature line, a purple wax seal presses in beside it, and a tricolor VOTES FOR WOMEN sash — the suffragist purple, white, and gold — waves slowly above. On the right, a large cream AUGUST 26, 2026 headline anchors a purple 19TH AMENDMENT · 106 YEARS subhead, an italic amber STANTON · ANTHONY · CATT · PAUL · BURN tertiary, a dim SENECA FALLS · TENNESSEE · CERTIFIED roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 26, 2026 — the 106th anniversary of the Nineteenth Amendment being certified. On the left half, an aged parchment proclamation sits on a dark oak desk: the amendment's opening words in period type, a signature line where a fountain pen draws Bainbridge Colby's signature, and a deep purple wax seal stamped beside it with the year 1920. Above the parchment, a tricolor sash — suffragist purple, white, and gold — waves slowly with the words VOTES FOR WOMEN. On the right, a huge cream AUGUST 26, 2026 headline underlined by a purple-to-gold sweep, a purple 19TH AMENDMENT · 106 YEARS subhead trailed by cream · SINCE 1920, an italic amber STANTON · ANTHONY · CATT · PAUL · BURN tertiary, a dim cyan SENECA FALLS · TENNESSEE · CERTIFIED roster, and a Georgia-italic 'shall not be denied on account of sex.' caption at the base.">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0e2b6"/>
      <stop offset="50%"  stop-color="#e6d29a"/>
      <stop offset="100%" stop-color="#c9b078"/>
    </linearGradient>
    <radialGradient id="parchmentShade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a3818" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="deskWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1108"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="sashPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5a1e75"/>
      <stop offset="50%"  stop-color="#7d3c98"/>
      <stop offset="100%" stop-color="#5a1e75"/>
    </linearGradient>
    <linearGradient id="sashGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b8860b"/>
      <stop offset="50%"  stop-color="#f5c430"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="sashWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8ddc8"/>
      <stop offset="50%"  stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#e8ddc8"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9c3ab8"/>
      <stop offset="55%"  stop-color="#5a1e75"/>
      <stop offset="100%" stop-color="#2a0d38"/>
    </linearGradient>
    <linearGradient id="penBarrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1a0a10"/>
      <stop offset="50%"  stop-color="#3a1520"/>
      <stop offset="100%" stop-color="#1a0a10"/>
    </linearGradient>
    <linearGradient id="penNib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8a6810"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7d3c98" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#7d3c98" stop-opacity="1"/>
      <stop offset="48%"  stop-color="#f5efe0" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#d4a017" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7d3c98" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="parchmentGrain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.10  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="sigClip">
      <rect x="118" y="120" width="150" height="18"/>
    </clipPath>
  </defs>

  <!-- ============ LEFT PANEL: DESK WITH PROCLAMATION ============ -->
  <rect x="0" y="0" width="360" height="200" fill="url(#deskWood)"/>

  <!-- Warm lamp glow radiating from upper-left, subtle pulse -->
  <ellipse cx="120" cy="60" rx="220" ry="140" fill="#d4a017" opacity="0.08">
    <animate attributeName="opacity" values="0.06;0.11;0.06" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== Tricolor sash: VOTES FOR WOMEN, waving above the parchment ===== -->
  <g transform="translate(0, 14)">
    <!-- Whole sash gently sways as a group -->
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
                      values="0 14; 0 12; 0 15; 0 13; 0 14" dur="11s" repeatCount="indefinite"/>
    <!-- Purple band -->
    <path d="M 20 6 Q 90 -2 180 6 T 340 6 L 340 14 Q 260 22 180 14 T 20 14 Z" fill="url(#sashPurple)"/>
    <!-- White band -->
    <path d="M 20 14 Q 90 6 180 14 T 340 14 L 340 22 Q 260 30 180 22 T 20 22 Z" fill="url(#sashWhite)"/>
    <!-- Gold band -->
    <path d="M 20 22 Q 90 14 180 22 T 340 22 L 340 30 Q 260 38 180 30 T 20 30 Z" fill="url(#sashGold)"/>
    <!-- Text overlaid on the white band -->
    <text x="180" y="20" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="9" font-weight="700" fill="#4a1a5c" letter-spacing="3.5">
      VOTES FOR WOMEN
    </text>
    <!-- Frilled edge highlight -->
    <path d="M 20 6 Q 90 -2 180 6 T 340 6" fill="none" stroke="#f5f0e6" stroke-width="0.35" opacity="0.65"/>
  </g>

  <!-- ===== Parchment proclamation (with a slight tilt) ===== -->
  <g transform="translate(30, 62) rotate(-1.2)">
    <!-- Parchment sheet with torn/wavy edge -->
    <path d="M 4 4
             Q 100 -2 200 4 T 300 6
             L 302 108 Q 200 116 100 110 T 2 108
             Z"
          fill="url(#parchment)" stroke="#8a6a30" stroke-width="0.6"/>
    <!-- Grain overlay -->
    <path d="M 4 4
             Q 100 -2 200 4 T 300 6
             L 302 108 Q 200 116 100 110 T 2 108
             Z"
          fill="#000" filter="url(#parchmentGrain)" opacity="0.9"/>
    <!-- Vignette shading -->
    <path d="M 4 4
             Q 100 -2 200 4 T 300 6
             L 302 108 Q 200 116 100 110 T 2 108
             Z"
          fill="url(#parchmentShade)"/>

    <!-- Heading: AMENDMENT XIX -->
    <text x="152" y="24" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="13" font-weight="700" fill="#3a2410" letter-spacing="3">
      AMENDMENT · XIX
    </text>
    <line x1="70" y1="30" x2="234" y2="30" stroke="#5a3a18" stroke-width="0.5" opacity="0.7"/>

    <!-- Body text (period-styled short lines) -->
    <g font-family="Georgia, 'Times New Roman', serif" font-size="6.5" fill="#3a2410">
      <text x="24" y="44">The right of citizens of the United States</text>
      <text x="24" y="53">to vote shall not be denied or abridged</text>
      <text x="24" y="62">by the United States or by any State</text>
      <text x="24" y="71" font-style="italic">on account of sex.</text>
    </g>

    <!-- Signature baseline (very faint pre-printed line) -->
    <line x1="90" y1="80" x2="220" y2="80" stroke="#5a3a18" stroke-width="0.4" opacity="0.6"/>
    <text x="90" y="88" font-family="Georgia, 'Times New Roman', serif"
          font-size="4.5" fill="#5a3a18" opacity="0.75" letter-spacing="0.5">
      Bainbridge Colby, Secretary of State
    </text>
    <text x="90" y="94" font-family="Georgia, 'Times New Roman', serif"
          font-size="4.5" fill="#5a3a18" opacity="0.75" letter-spacing="0.5">
      Washington · 26 August 1920
    </text>
  </g>

  <!-- ===== Animated signature over the signature line (in unrotated coords) ===== -->
  <g clip-path="url(#sigClip)">
    <!-- Signature: 'Bainbridge Colby' as a stylized script, drawn on with stroke-dashoffset -->
    <path id="signature"
          d="M 122 137
             c 3 -6 5 -6 6 -1  c 1 5 -1 8 -3 6  c -2 -2 1 -5 4 -5
             m 3 -1  c -1 4 1 6 3 4  c 2 -2 1 -6 -1 -6  c -2 0 -3 3 -1 5
             m 6 3  c 0 -5 3 -8 4 -3  c 1 5 -2 6 -3 4
             m 6 -2  c 2 -6 5 -6 5 0  c 0 6 -3 6 -4 3
             m 7 -3  c 0 6 3 6 4 1  c 1 -5 -2 -6 -3 -3
             m 6 0  c -1 5 2 6 4 3  c 2 -3 0 -6 -2 -4
             m 6 -1  c 1 4 3 5 4 2  c 1 -3 -1 -5 -2 -3
             m 7 4  c 2 -8 6 -8 5 0  c -1 8 -6 3 -3 -2
             m 5 -1  c 3 -6 6 -5 5 1  c -1 6 -5 4 -3 -1
             m 6 -1  c 2 -5 6 -4 5 2  c -1 6 -5 3 -3 -1
             m 6 -2  c 1 6 4 6 5 1  c 1 -5 -2 -6 -3 -3
             m 6 1  c 2 -6 6 -6 5 1  c -1 7 -5 3 -3 -2"
          fill="none" stroke="#0a0410" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="260" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="260;260;0;0;0" keyTimes="0;0.15;0.55;0.92;1" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== Wax seal (impresses in with a pulse after signature) ===== -->
  <g transform="translate(258, 138)">
    <!-- Outer wax splat -->
    <path d="M 0 0
             m -14 -1
             q 2 -10 10 -10
             q 6 0 9 4
             q 8 -3 10 6
             q 2 8 -4 12
             q 3 8 -6 9
             q -8 1 -13 -3
             q -10 2 -10 -8
             q 0 -6 4 -10 Z"
          fill="url(#wax)" stroke="#2a0d38" stroke-width="0.5"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="7.5" fill="none" stroke="#f5c430" stroke-width="0.5" opacity="0.75"/>
    <!-- Star emblem -->
    <path d="M 0 -5 L 1.4 -1.5 L 5 -1.5 L 2.1 0.8 L 3.2 4.3 L 0 2.2 L -3.2 4.3 L -2.1 0.8 L -5 -1.5 L -1.4 -1.5 Z"
          fill="#f5c430" opacity="0.9"/>
    <!-- Year text below star -->
    <text x="0" y="9" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="4" font-weight="700" fill="#f5c430" letter-spacing="0.5">1920</text>
    <!-- Impress pulse -->
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
                      values="258 138; 258 138; 258 138; 258 137.2; 258 138; 258 138"
                      keyTimes="0;0.55;0.62;0.66;0.72;1" dur="13s" repeatCount="indefinite"/>
    <!-- Subtle sheen -->
    <ellipse cx="-3" cy="-4" rx="3.5" ry="1.6" fill="#f5f0e6" opacity="0.22"/>
  </g>

  <!-- ===== Fountain pen (glides across, hovers at signature line) ===== -->
  <g transform="translate(118 132)">
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
                      values="60 90; 118 132; 258 130; 258 130; 300 100; 60 90"
                      keyTimes="0;0.15;0.55;0.62;0.75;1" dur="13s" repeatCount="indefinite"/>
    <g transform="rotate(-38)">
      <!-- Pen barrel -->
      <rect x="0" y="-2.6" width="46" height="5.2" rx="2.4" fill="url(#penBarrel)" stroke="#0a0410" stroke-width="0.3"/>
      <!-- Cap ring -->
      <rect x="24" y="-3" width="3" height="6" fill="#d4a017"/>
      <!-- Clip -->
      <rect x="28" y="-4" width="10" height="1.4" fill="#d4a017"/>
      <!-- Nib holder -->
      <path d="M 0 -2.6 L -6 -1.3 L -6 1.3 L 0 2.6 Z" fill="#2a1620"/>
      <!-- Gold nib -->
      <path d="M -6 -1.3 L -14 0 L -6 1.3 Z" fill="url(#penNib)" stroke="#5a3a08" stroke-width="0.3"/>
      <!-- Nib slit -->
      <line x1="-6" y1="0" x2="-13" y2="0" stroke="#3a2408" stroke-width="0.35"/>
    </g>
  </g>

  <!-- ===== Small suffragette silhouette marchers on lower desk (subtle) ===== -->
  <g opacity="0.35" transform="translate(20, 188)">
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
                      values="20 188; 30 188; 20 188" dur="17s" repeatCount="indefinite"/>
    <g fill="#3a1a48">
      <!-- Silhouette figure 1 (holding a small banner pole) -->
      <path d="M 0 0 L 0 -8 L -1 -10 L 1 -10 L 0 -8 M -2 -2 L 2 -2 L 2 -6 L -2 -6 Z"/>
      <circle cx="0" cy="-11.5" r="1.4"/>
      <rect x="2" y="-14" width="0.5" height="14"/>
      <rect x="2.5" y="-14" width="6" height="3" fill="#7d3c98" opacity="0.7"/>
      <!-- figure 2 -->
      <g transform="translate(10 0)">
        <path d="M 0 0 L 0 -8 L -1 -10 L 1 -10 L 0 -8 M -2 -2 L 2 -2 L 2 -6 L -2 -6 Z"/>
        <circle cx="0" cy="-11.5" r="1.4"/>
      </g>
      <!-- figure 3 -->
      <g transform="translate(20 0)">
        <path d="M 0 0 L 0 -8 L -1 -10 L 1 -10 L 0 -8 M -2 -2 L 2 -2 L 2 -6 L -2 -6 Z"/>
        <circle cx="0" cy="-11.5" r="1.4"/>
        <rect x="2" y="-14" width="0.5" height="14"/>
        <rect x="2.5" y="-14" width="6" height="3" fill="#d4a017" opacity="0.7"/>
      </g>
      <!-- figure 4 -->
      <g transform="translate(30 0)">
        <path d="M 0 0 L 0 -8 L -1 -10 L 1 -10 L 0 -8 M -2 -2 L 2 -2 L 2 -6 L -2 -6 Z"/>
        <circle cx="0" cy="-11.5" r="1.4"/>
      </g>
    </g>
  </g>

  <!-- Desk edge highlight -->
  <line x1="0" y1="178" x2="360" y2="178" stroke="#d4a017" stroke-width="0.35" opacity="0.35"/>

  <!-- Seam -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ============ RIGHT TEXT PANEL ============ -->
  <rect x="360" y="0" width="440" height="200" fill="#0d1117"/>

  <!-- Faint tricolor accent on right edge (vertical) -->
  <rect x="792" y="20" width="4" height="52" fill="#7d3c98" opacity="0.85"/>
  <rect x="792" y="72" width="4" height="52" fill="#f5f0e6" opacity="0.85"/>
  <rect x="792" y="124" width="4" height="52" fill="#d4a017" opacity="0.85"/>

  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 26, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#c88ce0">19TH AMENDMENT</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;106 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;·&#160;SINCE 1920</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#f5c430" letter-spacing="1" opacity="0.95">
    STANTON · ANTHONY · CATT · PAUL · BURN
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#8ac8b8" letter-spacing="1" opacity="0.9">
    SENECA FALLS · TENNESSEE · CERTIFIED
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;shall not be denied on account of sex.&#8221;
  </text>
</svg>
