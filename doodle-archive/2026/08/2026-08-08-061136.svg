<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Explorer 6 — First Photograph of Earth from Orbit (August 7, 1959). NASA's Explorer 6 satellite launched from Cape Canaveral atop a Thor-Able III on 7 August 1959 and later that month transmitted the first crude photographic images of Earth from orbit, sent back as slow-scan facsimile — a "look back at ourselves" moment that predated Apollo 8's Earthrise by nearly a decade. 67 years today. The spacecraft's signature was its four-paddle "windmill" solar array. Composition on the 800x200 canvas: on the left half, a black-of-space tableau — a large curved Earth limb arcs across the bottom-left (deep-blue oceans, muted khaki continents, drifting white cloud wisps, a soft cyan atmospheric glow crowning the rim); above the horizon in orbit hangs the small silhouette of Explorer 6 with its four solar paddles slowly rotating, tethered to a dashed orbital arc; a translucent cyan facsimile scan-line sweeps slowly down the whole canvas, echoing the slow-scan transmission of the first photo; a faint star field twinkles behind. On the right, a huge cream AUGUST 7, 2026 headline underlined by a sweeping cyan-to-green orbital bar, a cyan EXPLORER 6 subhead followed by cream · 67 YEARS, italic amber tertiary FIRST PHOTO OF EARTH · NASA · 7 AUGUST 1959, dim-green tertiary CAPE CANAVERAL · SLOW-SCAN · SOLAR PADDLES, and a Georgia-italic caption "we looked back at ourselves" at the base. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 7, 2026 — 67th anniversary of the launch of NASA's Explorer 6, which produced the first photographs of Earth from orbit and transmitted them back as slow-scan facsimile. On the left half, a black-of-space tableau: a large curved Earth limb arcs across the bottom-left with deep-blue oceans, muted continents, drifting white cloud wisps, and a soft cyan atmospheric glow crowning the rim; above the horizon in orbit hangs the small silhouette of Explorer 6 with its four solar paddles slowly rotating, tethered to a dashed orbital arc; a translucent cyan facsimile scan-line sweeps slowly down the whole canvas; a faint star field twinkles behind. On the right, a huge cream AUGUST 7, 2026 headline underlined by a sweeping cyan-to-green orbital bar, a cyan EXPLORER 6 subhead followed by cream 67 YEARS, italic amber FIRST PHOTO OF EARTH · NASA · 7 AUGUST 1959, dim-green CAPE CANAVERAL · SLOW-SCAN · SOLAR PADDLES tertiaries, and a Georgia-italic 'we looked back at ourselves' caption at the base.">
  <defs>
    <!-- Deep space background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="55%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Earth ocean base: subtle radial for illumination from upper-left -->
    <radialGradient id="earthOcean" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0%" stop-color="#4d92d6"/>
      <stop offset="45%" stop-color="#255f9e"/>
      <stop offset="85%" stop-color="#0e2f5c"/>
      <stop offset="100%" stop-color="#061a36"/>
    </radialGradient>

    <!-- Terminator overlay: dark side of the Earth (lower-right of visible cap) -->
    <radialGradient id="terminator" cx="0.32" cy="0.22" r="0.9">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Atmospheric limb glow: a thin cyan crown just above the surface -->
    <radialGradient id="atmoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="88%" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="94%" stop-color="#79c0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Headline underline sweep: cyan-through-green orbital energy -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#79c0ff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#7ee787" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip so continents and clouds stay inside the Earth disk -->
    <clipPath id="earthClip">
      <circle cx="140" cy="380" r="260"/>
    </clipPath>

    <!-- Explorer 6 spacecraft (paddle-wheel design). Center at origin. -->
    <g id="explorer6">
      <!-- Main body: small spheroid -->
      <ellipse cx="0" cy="0" rx="5.4" ry="6.2" fill="#d7dde5" stroke="#3b4256" stroke-width="0.55"/>
      <ellipse cx="0" cy="-1.5" rx="3.6" ry="2" fill="#f0f6fc" opacity="0.55"/>
      <!-- Four solar paddles arranged 90 deg apart; parent group rotates slowly -->
      <g>
        <!-- paddle east -->
        <g>
          <line x1="5" y1="0" x2="10" y2="0" stroke="#8b949e" stroke-width="0.5"/>
          <rect x="10" y="-3.4" width="12" height="6.8" fill="#2a3f66" stroke="#6b7a99" stroke-width="0.4"/>
          <line x1="10" y1="0" x2="22" y2="0" stroke="#6b7a99" stroke-width="0.3"/>
        </g>
        <!-- paddle south -->
        <g transform="rotate(90)">
          <line x1="5" y1="0" x2="10" y2="0" stroke="#8b949e" stroke-width="0.5"/>
          <rect x="10" y="-3.4" width="12" height="6.8" fill="#2a3f66" stroke="#6b7a99" stroke-width="0.4"/>
          <line x1="10" y1="0" x2="22" y2="0" stroke="#6b7a99" stroke-width="0.3"/>
        </g>
        <!-- paddle west -->
        <g transform="rotate(180)">
          <line x1="5" y1="0" x2="10" y2="0" stroke="#8b949e" stroke-width="0.5"/>
          <rect x="10" y="-3.4" width="12" height="6.8" fill="#2a3f66" stroke="#6b7a99" stroke-width="0.4"/>
          <line x1="10" y1="0" x2="22" y2="0" stroke="#6b7a99" stroke-width="0.3"/>
        </g>
        <!-- paddle north -->
        <g transform="rotate(270)">
          <line x1="5" y1="0" x2="10" y2="0" stroke="#8b949e" stroke-width="0.5"/>
          <rect x="10" y="-3.4" width="12" height="6.8" fill="#2a3f66" stroke="#6b7a99" stroke-width="0.4"/>
          <line x1="10" y1="0" x2="22" y2="0" stroke="#6b7a99" stroke-width="0.3"/>
        </g>
        <!-- rotate the whole paddle assembly slowly around the body -->
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="23s" repeatCount="indefinite"/>
      </g>
      <!-- antenna mast pointing outward -->
      <line x1="0" y1="-6" x2="0" y2="-13" stroke="#c9d1d9" stroke-width="0.55"/>
      <circle cx="0" cy="-13" r="1" fill="#f2cc60"/>
    </g>
  </defs>

  <!-- ============ background ============ -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- ============ star field ============ -->
  <g fill="#e6edf3">
    <!-- brighter stars -->
    <circle cx="42"  cy="22"  r="0.9" opacity="0.75"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="118" cy="42"  r="0.7" opacity="0.6" ><animate attributeName="opacity" values="0.25;0.8;0.25"  dur="11s" begin="1s"   repeatCount="indefinite"/></circle>
    <circle cx="196" cy="18"  r="0.85" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3"    dur="13s" begin="2s"   repeatCount="indefinite"/></circle>
    <circle cx="252" cy="58"  r="0.55" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2"    dur="7s"  begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="26"  r="0.75" opacity="0.6"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="11s" begin="3s"   repeatCount="indefinite"/></circle>
    <circle cx="372" cy="72"  r="0.6"  opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2"    dur="13s" begin="1.5s" repeatCount="indefinite"/></circle>
    <!-- fainter stars -->
    <circle cx="72"  cy="76"  r="0.45" opacity="0.4"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="11s" begin="4s"   repeatCount="indefinite"/></circle>
    <circle cx="162" cy="86"  r="0.5"  opacity="0.4"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="7s"  begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="228" cy="30"  r="0.4"  opacity="0.4"><animate attributeName="opacity" values="0.1;0.5;0.1"    dur="13s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="94"  r="0.5"  opacity="0.45"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="11s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="18"  cy="52"  r="0.4"  opacity="0.35"><animate attributeName="opacity" values="0.1;0.45;0.1"   dur="7s"  begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="90"  cy="14"  r="0.4"  opacity="0.35"><animate attributeName="opacity" values="0.1;0.5;0.1"    dur="13s" begin="1s"   repeatCount="indefinite"/></circle>
    <!-- a few on right side (subtle, behind typography edges) -->
    <circle cx="486" cy="14"  r="0.45" opacity="0.3" ><animate attributeName="opacity" values="0.1;0.5;0.1"    dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="722" cy="22"  r="0.55" opacity="0.35"><animate attributeName="opacity" values="0.1;0.55;0.1"   dur="7s"  begin="2s"   repeatCount="indefinite"/></circle>
    <circle cx="780" cy="46"  r="0.4"  opacity="0.3" ><animate attributeName="opacity" values="0.1;0.45;0.1"   dur="13s" begin="4s"   repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ orbital arc (dashed) — passing through Explorer's position ============ -->
  <!-- ellipse arc: horizontally-wide, centered around Earth center at (140, 380) -->
  <ellipse cx="140" cy="380" rx="310" ry="325"
           fill="none" stroke="#58a6ff" stroke-width="0.55"
           stroke-dasharray="3 5" opacity="0.35"/>

  <!-- ============ atmospheric glow behind Earth ============ -->
  <circle cx="140" cy="380" r="285" fill="url(#atmoGlow)"/>

  <!-- ============ Earth body ============ -->
  <circle cx="140" cy="380" r="260" fill="url(#earthOcean)"/>

  <!-- continents (abstract, clipped to Earth disk) -->
  <g clip-path="url(#earthClip)">
    <!-- Africa-ish landmass upper-right of visible cap -->
    <path d="M 232 128 Q 258 130 274 148 Q 282 168 274 190 Q 262 208 244 210 Q 226 208 216 194 Q 210 176 214 158 Q 220 140 232 128 Z"
          fill="#4a5f3a" opacity="0.85"/>
    <!-- small subcontinent below -->
    <path d="M 260 200 Q 274 208 274 224 Q 262 232 250 226 Q 244 216 250 206 Z"
          fill="#4a5f3a" opacity="0.75"/>
    <!-- landmass left -->
    <path d="M 66 148 Q 90 142 108 156 Q 118 172 110 188 Q 92 196 74 188 Q 60 178 62 164 Q 62 154 66 148 Z"
          fill="#4a5f3a" opacity="0.8"/>
    <!-- small island cluster mid -->
    <path d="M 160 174 Q 174 172 182 182 Q 178 194 166 194 Q 156 188 160 174 Z"
          fill="#4a5f3a" opacity="0.75"/>
    <!-- coastal accent (warmer tone edge) -->
    <path d="M 232 128 Q 258 130 274 148 Q 268 152 258 148 Q 244 140 232 138 Z"
          fill="#7a8a56" opacity="0.6"/>
    <path d="M 66 148 Q 90 142 108 156 Q 104 160 92 156 Q 78 154 68 156 Z"
          fill="#7a8a56" opacity="0.55"/>
  </g>

  <!-- clouds: drifting soft white wisps -->
  <g clip-path="url(#earthClip)" fill="#f0f6fc">
    <ellipse cx="150" cy="132" rx="42" ry="5" opacity="0.55">
      <animate attributeName="cx" values="120;220;120" dur="53s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="80" cy="168" rx="30" ry="4" opacity="0.45">
      <animate attributeName="cx" values="60;150;60" dur="61s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="240" cy="164" rx="34" ry="4.5" opacity="0.5">
      <animate attributeName="cx" values="210;300;210" dur="47s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="190" cy="196" rx="24" ry="3" opacity="0.4">
      <animate attributeName="cx" values="170;240;170" dur="43s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="112" cy="112" rx="18" ry="2.5" opacity="0.35">
      <animate attributeName="cx" values="90;180;90" dur="67s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- day/night terminator overlay (subtle shading on far side) -->
  <circle cx="140" cy="380" r="260" fill="url(#terminator)"/>

  <!-- crisp cyan limb highlight along top-right arc of Earth (illuminated horizon) -->
  <path d="M 380 220 A 260 260 0 0 0 -80 220"
        fill="none" stroke="#79c0ff" stroke-width="0.9" opacity="0.35"/>

  <!-- ============ Explorer 6 satellite ============ -->
  <!-- Positioned in orbit above Earth. The satellite body drifts gently along the orbital arc. -->
  <g>
    <g transform="translate(300 60)">
      <use href="#explorer6"/>
    </g>
    <!-- The whole satellite drifts gently along a small arc to simulate orbital motion -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 6,-2; -4,3; 0,0" dur="41s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- faint transmission trail: dashes from Explorer 6 back down toward Earth -->
  <g stroke="#7ee787" stroke-width="0.5" stroke-dasharray="2 4" fill="none" opacity="0.35">
    <path d="M 300 68 Q 240 130 190 176">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============ facsimile scan line — cyan translucent bar sweeping down whole canvas ============ -->
  <g opacity="0.45">
    <rect x="0" y="-6" width="800" height="2" fill="#79c0ff">
      <animate attributeName="y" values="-6;206;-6" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.35;0.6" dur="13s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="800" height="6" fill="#79c0ff" opacity="0.18">
      <animate attributeName="y" values="-12;200;-12" dur="13s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tiny "REC" marker in upper-left corner, echoing a broadcast interface -->
  <g opacity="0.7">
    <circle cx="14" cy="12" r="2.4" fill="#ff6b6b">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="15"
          font-family="ui-monospace, Menlo, Consolas, monospace"
          font-size="7" fill="#8b949e" letter-spacing="1">REC · 1959</text>
  </g>

  <!-- ============ RIGHT HALF: typography stack ============ -->

  <!-- Huge cream headline: primary date -->
  <text x="398" y="72"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="1"
        fill="#f0f6fc">AUGUST 7, 2026</text>

  <!-- Underline sweep bar -->
  <rect x="398" y="82" width="308" height="2.6" fill="url(#sweep)" opacity="0.95">
    <animate attributeName="x" values="398;446;398" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- Subhead: cyan EXPLORER 6 + cream · 67 YEARS -->
  <g>
    <text x="398" y="112"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="700" letter-spacing="1.4"
          fill="#79c0ff">EXPLORER 6</text>
    <text x="548" y="112"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="20" font-weight="600" letter-spacing="1.2"
          fill="#f0f6fc">·  67 YEARS</text>
  </g>

  <!-- Amber italic tertiary -->
  <text x="398" y="135"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" letter-spacing="0.8"
        fill="#f2cc60">FIRST PHOTO OF EARTH · NASA · 7 AUGUST 1959</text>

  <!-- Green italic tertiary -->
  <text x="398" y="152"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" letter-spacing="1.4"
        fill="#7ee787" opacity="0.9">CAPE CANAVERAL  ·  SLOW-SCAN  ·  SOLAR PADDLES</text>

  <!-- Georgia italic caption with blinking cursor -->
  <g>
    <text x="398" y="182"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="14" font-style="italic"
          fill="#c9d1d9">&#8220;we looked back at ourselves&#8221;</text>
    <text x="614" y="182"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="10" font-style="italic"
          fill="#8b949e">— Explorer 6, August 1959</text>
    <rect x="770" y="171" width="7" height="13" fill="#79c0ff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
