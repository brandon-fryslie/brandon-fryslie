<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#0a0020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050012;stop-opacity:1" />
    </radialGradient>

    <!-- Energy flow gradients -->
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FB7185;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:0.8" />
    </linearGradient>

    <!-- Iris gradient -->
    <radialGradient id="irisGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#06B6D4;stop-opacity:0.8" />
      <stop offset="60%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>

  <!-- Flower of Life pattern (behind everything) -->
  <g opacity="0.03" stroke="#8B5CF6" stroke-width="1" fill="none">
    <circle cx="400" cy="150" r="40"/>
    <circle cx="434.64" cy="150" r="40"/>
    <circle cx="365.36" cy="150" r="40"/>
    <circle cx="417.32" cy="120" r="40"/>
    <circle cx="382.68" cy="120" r="40"/>
    <circle cx="417.32" cy="180" r="40"/>
    <circle cx="382.68" cy="180" r="40"/>
  </g>

  <!-- Metatron's Cube (rotating very slowly) -->
  <g opacity="0.08" stroke="#06B6D4" stroke-width="0.8" fill="none" transform-origin="400 150" style="transform-box: fill-box;">
    <!-- 13 circles -->
    <circle cx="400" cy="150" r="3"/>
    <circle cx="440" cy="150" r="3"/>
    <circle cx="360" cy="150" r="3"/>
    <circle cx="420" cy="115.36" r="3"/>
    <circle cx="380" cy="115.36" r="3"/>
    <circle cx="420" cy="184.64" r="3"/>
    <circle cx="380" cy="184.64" r="3"/>
    <circle cx="440" cy="115.36" r="3"/>
    <circle cx="360" cy="115.36" r="3"/>
    <circle cx="440" cy="184.64" r="3"/>
    <circle cx="360" cy="184.64" r="3"/>
    <circle cx="400" cy="115.36" r="3"/>
    <circle cx="400" cy="184.64" r="3"/>

    <!-- Connecting lines -->
    <line x1="400" y1="150" x2="440" y2="150"/>
    <line x1="400" y1="150" x2="360" y2="150"/>
    <line x1="400" y1="150" x2="420" y2="115.36"/>
    <line x1="400" y1="150" x2="380" y2="115.36"/>
    <line x1="400" y1="150" x2="420" y2="184.64"/>
    <line x1="400" y1="150" x2="380" y2="184.64"/>
    <line x1="420" y1="115.36" x2="440" y2="115.36"/>
    <line x1="380" y1="115.36" x2="360" y2="115.36"/>
    <line x1="420" y1="184.64" x2="440" y2="184.64"/>
    <line x1="380" y1="184.64" x2="360" y2="184.64"/>
    <line x1="440" y1="150" x2="440" y2="115.36"/>
    <line x1="440" y1="150" x2="440" y2="184.64"/>
    <line x1="360" y1="150" x2="360" y2="115.36"/>
    <line x1="360" y1="150" x2="360" y2="184.64"/>

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 400 150"
      to="360 400 150"
      dur="240s"
      repeatCount="indefinite"/>
  </g>

  <!-- Sri Yantra inspired triangles -->
  <g opacity="0.12" stroke="#FBBF24" stroke-width="1" fill="none">
    <!-- Outer triangles pointing down -->
    <polygon points="400,100 450,180 350,180">
      <animate attributeName="opacity" values="0.12;0.18;0.12" dur="11s" repeatCount="indefinite"/>
    </polygon>
    <!-- Inner triangles pointing up -->
    <polygon points="400,170 430,120 370,120">
      <animate attributeName="opacity" values="0.12;0.18;0.12" dur="13s" repeatCount="indefinite"/>
    </polygon>
    <!-- Nested smaller -->
    <polygon points="400,115 420,155 380,155">
      <animate attributeName="opacity" values="0.12;0.18;0.12" dur="17s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Aura layers (concentric ovals breathing) -->
  <ellipse cx="400" cy="150" rx="140" ry="80" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.15" filter="url(#softGlow)">
    <animate attributeName="rx" values="140;150;140" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="80;86;80" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.25;0.15" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="400" cy="150" rx="110" ry="65" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.2" filter="url(#softGlow)">
    <animate attributeName="rx" values="110;120;110" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="65;71;65" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.3;0.2" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="400" cy="150" rx="85" ry="50" fill="none" stroke="#FB7185" stroke-width="1" opacity="0.25" filter="url(#softGlow)">
    <animate attributeName="rx" values="85;93;85" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="50;55;50" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.35;0.25" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Energy channels (flowing paths with traveling dots) -->
  <!-- Top left flow -->
  <path d="M 400,150 Q 300,80 150,50" stroke="url(#violetCyan)" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#06B6D4" opacity="0.8" filter="url(#glow)">
    <animateMotion path="M 400,150 Q 300,80 150,50" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Top right flow -->
  <path d="M 400,150 Q 500,80 650,50" stroke="url(#roseGold)" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="7s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#FBBF24" opacity="0.8" filter="url(#glow)">
    <animateMotion path="M 400,150 Q 500,80 650,50" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom left flow -->
  <path d="M 400,150 Q 300,220 150,250" stroke="url(#roseGold)" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#FB7185" opacity="0.8" filter="url(#glow)">
    <animateMotion path="M 400,150 Q 300,220 150,250" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom right flow -->
  <path d="M 400,150 Q 500,220 650,250" stroke="url(#violetCyan)" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="9s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#8B5CF6" opacity="0.8" filter="url(#glow)">
    <animateMotion path="M 400,150 Q 500,220 650,250" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- Left horizontal flow -->
  <path d="M 400,150 Q 250,150 50,150" stroke="url(#violetCyan)" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="7s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#8B5CF6" opacity="0.8" filter="url(#glow)">
    <animateMotion path="M 400,150 Q 250,150 50,150" dur="19s" repeatCount="indefinite"/>
  </circle>

  <!-- Right horizontal flow -->
  <path d="M 400,150 Q 550,150 750,150" stroke="url(#roseGold)" stroke-width="1.5" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="8s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#FBBF24" opacity="0.8" filter="url(#glow)">
    <animateMotion path="M 400,150 Q 550,150 750,150" dur="23s" repeatCount="indefinite"/>
  </circle>

  <!-- THE EYE -->
  <!-- Outer eye shape (almond/vesica piscis) -->
  <path d="M 300,150 Q 300,120 400,120 Q 500,120 500,150 Q 500,180 400,180 Q 300,180 300,150 Z"
        fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Iris - concentric rings -->
  <circle cx="400" cy="150" r="35" fill="url(#irisGrad)" opacity="0.7">
    <animate attributeName="r" values="35;38;35" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Fractal patterns in iris -->
  <g opacity="0.3" stroke="#FBBF24" stroke-width="0.8" fill="none">
    <polygon points="400,130 415,155 385,155">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="11s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="400,140 410,155 390,155">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="13s" repeatCount="indefinite"/>
    </polygon>
    <!-- Nested triangles pointing down -->
    <polygon points="400,170 385,145 415,145">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="17s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Spiral-like arcs -->
  <path d="M 375,150 A 25,25 0 0,1 400,125" stroke="#06B6D4" stroke-width="1" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M 425,150 A 25,25 0 0,0 400,125" stroke="#06B6D4" stroke-width="1" fill="none" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- Central pupil (breathing) -->
  <circle cx="400" cy="150" r="12" fill="#050012" filter="url(#glow)">
    <animate attributeName="r" values="12;15;12" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Pupil highlight -->
  <circle cx="405" cy="145" r="4" fill="#FBBF24" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Eyelash/ray lines radiating from eye tips -->
  <g stroke="#8B5CF6" stroke-width="1.5" opacity="0.5">
    <!-- Left rays -->
    <line x1="300" y1="150" x2="280" y2="140"/>
    <line x1="300" y1="150" x2="275" y2="150"/>
    <line x1="300" y1="150" x2="280" y2="160"/>
    <line x1="300" y1="135" x2="285" y2="125"/>
    <line x1="300" y1="165" x2="285" y2="175"/>

    <!-- Right rays -->
    <line x1="500" y1="150" x2="520" y2="140"/>
    <line x1="500" y1="150" x2="525" y2="150"/>
    <line x1="500" y1="150" x2="520" y2="160"/>
    <line x1="500" y1="135" x2="515" y2="125"/>
    <line x1="500" y1="165" x2="515" y2="175"/>

    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Chakra points (7 dots vertically aligned through eye) -->
  <!-- Root - Red -->
  <circle cx="400" cy="210" r="4" fill="#DC2626" opacity="0.8" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Sacral - Orange -->
  <circle cx="400" cy="190" r="4" fill="#F97316" opacity="0.8" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Solar Plexus - Yellow -->
  <circle cx="400" cy="170" r="4" fill="#FBBF24" opacity="0.8" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Heart - Green -->
  <circle cx="400" cy="150" r="4" fill="#10B981" opacity="0.8" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Throat - Blue -->
  <circle cx="400" cy="130" r="4" fill="#3B82F6" opacity="0.8" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- Third Eye - Indigo -->
  <circle cx="400" cy="110" r="4" fill="#4F46E5" opacity="0.8" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- Crown - Violet -->
  <circle cx="400" cy="90" r="4" fill="#8B5CF6" opacity="0.8" filter="url(#glow)">
    <animate attributeName="r" values="4;5.5;4" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="19s" repeatCount="indefinite"/>
  </circle>

  <!-- Particle dust (floating dots in orbital paths) -->
  <circle r="2" fill="#06B6D4" opacity="0.5">
    <animateMotion path="M 400,150 m -60,0 a 60,30 0 1,0 120,0 a 60,30 0 1,0 -120,0" dur="29s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle r="2" fill="#FBBF24" opacity="0.5">
    <animateMotion path="M 400,150 m -50,0 a 50,40 0 1,1 100,0 a 50,40 0 1,1 -100,0" dur="31s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle r="2" fill="#FB7185" opacity="0.5">
    <animateMotion path="M 400,150 m -70,0 a 70,35 0 1,0 140,0 a 70,35 0 1,0 -140,0" dur="37s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="11s" repeatCount="indefinite"/>
  </circle>

  <circle r="2" fill="#8B5CF6" opacity="0.5">
    <animateMotion path="M 400,150 m -55,0 a 55,45 0 1,1 110,0 a 55,45 0 1,1 -110,0" dur="41s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="13s" repeatCount="indefinite"/>
  </circle>

  <circle r="2" fill="#10B981" opacity="0.5">
    <animateMotion path="M 400,150 m -65,0 a 65,38 0 1,0 130,0 a 65,38 0 1,0 -130,0" dur="43s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- Mandala frame decorations at corners -->
  <!-- Top left corner -->
  <g opacity="0.4" stroke="#8B5CF6" stroke-width="1.5" fill="none">
    <circle cx="50" cy="30" r="15"/>
    <circle cx="50" cy="30" r="10">
      <animate attributeName="r" values="10;12;10" dur="7s" repeatCount="indefinite"/>
    </circle>
    <line x1="35" y1="30" x2="30" y2="30"/>
    <line x1="65" y1="30" x2="70" y2="30"/>
    <line x1="50" y1="15" x2="50" y2="10"/>
    <line x1="50" y1="45" x2="50" y2="50"/>
  </g>

  <!-- Top right corner -->
  <g opacity="0.4" stroke="#06B6D4" stroke-width="1.5" fill="none">
    <circle cx="750" cy="30" r="15"/>
    <circle cx="750" cy="30" r="10">
      <animate attributeName="r" values="10;12;10" dur="11s" repeatCount="indefinite"/>
    </circle>
    <line x1="735" y1="30" x2="730" y2="30"/>
    <line x1="765" y1="30" x2="770" y2="30"/>
    <line x1="750" y1="15" x2="750" y2="10"/>
    <line x1="750" y1="45" x2="750" y2="50"/>
  </g>

  <!-- Bottom left corner -->
  <g opacity="0.4" stroke="#FBBF24" stroke-width="1.5" fill="none">
    <circle cx="50" cy="270" r="15"/>
    <circle cx="50" cy="270" r="10">
      <animate attributeName="r" values="10;12;10" dur="13s" repeatCount="indefinite"/>
    </circle>
    <line x1="35" y1="270" x2="30" y2="270"/>
    <line x1="65" y1="270" x2="70" y2="270"/>
    <line x1="50" y1="255" x2="50" y2="250"/>
    <line x1="50" y1="285" x2="50" y2="290"/>
  </g>

  <!-- Bottom right corner -->
  <g opacity="0.4" stroke="#FB7185" stroke-width="1.5" fill="none">
    <circle cx="750" cy="270" r="15"/>
    <circle cx="750" cy="270" r="10">
      <animate attributeName="r" values="10;12;10" dur="17s" repeatCount="indefinite"/>
    </circle>
    <line x1="735" y1="270" x2="730" y2="270"/>
    <line x1="765" y1="270" x2="770" y2="270"/>
    <line x1="750" y1="255" x2="750" y2="250"/>
    <line x1="750" y1="285" x2="750" y2="290"/>
  </g>
</svg>
