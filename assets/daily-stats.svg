<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live GitHub stats for Thursday, November 26, 2026" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="edgeTop" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#58a6ff"/><stop offset="0.35" stop-color="#a371f7"/>
<stop offset="0.7" stop-color="#f78166"/><stop offset="1" stop-color="#39d353"/>
<animate attributeName="x1" values="0;-1;0" dur="23s" repeatCount="indefinite"/>
<animate attributeName="x2" values="1;2;1" dur="23s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="greenRing" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#39d353"/><stop offset="1" stop-color="#2ea04d"/>
</linearGradient>
<linearGradient id="greenText" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#9ee89e"/><stop offset="1" stop-color="#39d353"/>
</linearGradient>
<linearGradient id="streakOrange" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f78166"/>
</linearGradient>
<linearGradient id="orangeText" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f78166"/>
</linearGradient>
<linearGradient id="blueCommit" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#9ee6ec"/><stop offset="1" stop-color="#58a6ff"/>
</linearGradient>
<linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#d2a8ff"/><stop offset="1" stop-color="#a371f7"/>
</linearGradient>
<linearGradient id="langTs" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3178c6"/><stop offset="1" stop-color="#58a6ff"/>
</linearGradient>
<linearGradient id="langPy" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3572a5"/><stop offset="1" stop-color="#9ee6ec"/>
</linearGradient>
<linearGradient id="langSw" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#f05138"/><stop offset="1" stop-color="#ffb37a"/>
</linearGradient>
<linearGradient id="langGo" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00add8"/><stop offset="1" stop-color="#75dfea"/>
</linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.32"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="pulseRadial" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#9ee6ec" stop-opacity="0.55"/>
<stop offset="0.6" stop-color="#58a6ff" stop-opacity="0.25"/>
<stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
</radialGradient>
<pattern id="commitDots" x="598.5" y="112" width="7" height="7" patternUnits="userSpaceOnUse">
<circle cx="3.5" cy="3.5" r="2.1" fill="url(#blueCommit)"/>
</pattern>
<pattern id="streakCells" x="303" y="114" width="16" height="16" patternUnits="userSpaceOnUse">
<rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="url(#streakOrange)" opacity="0.88"/>
</pattern>
<clipPath id="streakClip"><rect x="303" y="114" width="224" height="112"/></clipPath>
<clipPath id="commitClip"><rect x="598.5" y="112" width="133" height="126"/></clipPath>
<clipPath id="langClip"><rect x="145" y="301" width="170" height="68"/></clipPath>
<clipPath id="prClip"><rect x="420" y="352" width="341" height="24"/></clipPath>
</defs>

<!-- Frame -->
<rect x="0" y="0" width="800" height="400" rx="12" fill="#0d1117"/>
<rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#10151c" stroke="#21262d" stroke-width="1"/>
<rect x="0" y="0" width="800" height="2" fill="url(#edgeTop)" opacity="0.9"/>

<!-- Header -->
<circle cx="22" cy="30" r="4" fill="#58a6ff">
<animate attributeName="opacity" values="1;0.35;1" dur="2.3s" repeatCount="indefinite"/>
<animate attributeName="r" values="4;5.5;4" dur="2.3s" repeatCount="indefinite"/>
</circle>
<text x="36" y="34" font-size="12" font-weight="700" fill="#f0f6fc" letter-spacing="1">LIVE GITHUB STATS</text>
<text x="780" y="32" font-size="12" fill="#c9d1d9" text-anchor="end">Thursday &#183; November 26, 2026</text>
<text x="780" y="46" font-size="10" fill="#8b949e" text-anchor="end">brandon-fryslie &#183; past 12 months</text>
<line x1="20" y1="54" x2="780" y2="54" stroke="#21262d" stroke-width="1"/>

<!-- ===================== Panel A: Days Active ring (329/365) ===================== -->
<!-- Dim background ring (full 365-day circle) -->
<circle cx="150" cy="165" r="78" fill="none" stroke="#21262d" stroke-width="22"/>
<!-- 329/365 = 324.4 deg filled arc, clockwise from top -->
<path d="M 150 87 A 78 78 0 1 1 104.6 91.6" fill="none" stroke="url(#greenRing)" stroke-width="22" stroke-linecap="round" opacity="0.95">
<animate attributeName="stroke-width" values="22;24;22" dur="5.3s" repeatCount="indefinite"/>
</path>
<!-- Rotating bead orbiter -->
<g>
<circle cx="150" cy="87" r="5" fill="#f0f6fc">
<animate attributeName="r" values="5;7;5" dur="3.3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.95;0.55;0.95" dur="3.3s" repeatCount="indefinite"/>
</circle>
<animateTransform attributeName="transform" type="rotate" from="0 150 165" to="360 150 165" dur="19s" repeatCount="indefinite"/>
</g>
<!-- Center value -->
<text x="150" y="176" font-size="54" font-weight="800" fill="url(#greenText)" text-anchor="middle">329</text>
<text x="150" y="200" font-size="14" font-weight="500" fill="#8b949e" text-anchor="middle">/365 days</text>
<!-- Caption -->
<text x="150" y="265" font-size="11" font-weight="700" fill="#39d353" text-anchor="middle" letter-spacing="1.2">DAYS ACTIVE &#183; 1 YEAR</text>

<!-- ===================== Panel B: Longest Streak 14x7 grid ===================== -->
<!-- big value above grid -->
<text x="415" y="102" font-size="40" font-weight="800" fill="url(#orangeText)" text-anchor="middle">98</text>
<!-- 14 cols x 7 rows pattern-tiled = exactly 98 cells -->
<rect x="303" y="114" width="224" height="112" fill="url(#streakCells)"/>
<!-- Horizontal sweep clipped to grid, scanning across the streak -->
<g clip-path="url(#streakClip)">
<rect x="223" y="114" width="80" height="112" fill="url(#sweep)">
<animate attributeName="x" values="223;527;223" dur="9s" repeatCount="indefinite"/>
</rect>
</g>
<!-- Grid-wide breathing pulse -->
<rect x="303" y="114" width="224" height="112" rx="4" fill="url(#streakOrange)" opacity="0">
<animate attributeName="opacity" values="0;0.18;0" dur="7s" repeatCount="indefinite"/>
</rect>
<!-- axis annotations -->
<text x="303" y="241" font-size="9" fill="#6e7681" text-anchor="start">14 weeks</text>
<text x="527" y="241" font-size="9" fill="#6e7681" text-anchor="end">7 days each</text>
<!-- caption -->
<text x="415" y="265" font-size="11" font-weight="700" fill="#f78166" text-anchor="middle" letter-spacing="1.2">LONGEST STREAK &#183; 1 YEAR</text>

<!-- ===================== Panel C: Commits 19x18 dot grid (= 342) ===================== -->
<text x="665" y="102" font-size="40" font-weight="800" fill="url(#blueCommit)" text-anchor="middle">342</text>
<!-- Dot pattern: tile 7x7 with one dot; rect 133 wide x 126 tall tiles to 19x18=342 dots -->
<rect x="598.5" y="112" width="133" height="126" fill="url(#commitDots)"/>
<!-- Radial pulse through dots, two staggered waves for perpetual motion -->
<g clip-path="url(#commitClip)">
<circle cx="665" cy="175" r="0" fill="url(#pulseRadial)">
<animate attributeName="r" values="0;120;0" dur="5.7s" repeatCount="indefinite"/>
</circle>
<circle cx="665" cy="175" r="0" fill="url(#pulseRadial)">
<animate attributeName="r" values="0;120;0" dur="5.7s" begin="-2.85s" repeatCount="indefinite"/>
</circle>
</g>
<!-- axis annotations -->
<text x="598.5" y="253" font-size="9" fill="#6e7681" text-anchor="start">19 &#215; 18</text>
<text x="731.5" y="253" font-size="9" fill="#6e7681" text-anchor="end">one dot &#183; one commit</text>
<text x="665" y="265" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="middle" letter-spacing="1.2">COMMITS &#183; 7 DAYS</text>

<!-- row divider -->
<line x1="20" y1="283" x2="780" y2="283" stroke="#21262d" stroke-width="0.6"/>

<!-- ===================== Panel D (bottom-left): Languages (4) ===================== -->
<text x="55" y="298" font-size="10" font-weight="700" fill="#58a6ff" text-anchor="middle" letter-spacing="1.1">LANGUAGES</text>
<text x="55" y="353" font-size="54" font-weight="800" fill="url(#blueCommit)" text-anchor="middle">4</text>
<text x="55" y="372" font-size="10" fill="#8b949e" text-anchor="middle">30 DAYS</text>
<line x1="100" y1="294" x2="100" y2="378" stroke="#21262d" stroke-width="0.6"/>
<!-- 4 bars with widths proportional to tokens-committed -->
<g font-size="10">
<text x="140" y="310" fill="#c9d1d9" text-anchor="end">TypeScript</text>
<rect x="145" y="303" width="170.0" height="10" rx="2" fill="url(#langTs)"/>
<text x="319" y="311" fill="#8b949e" text-anchor="start">853</text>

<text x="140" y="326" fill="#c9d1d9" text-anchor="end">Python</text>
<rect x="145" y="319" width="103.8" height="10" rx="2" fill="url(#langPy)"/>
<text x="252.8" y="327" fill="#8b949e" text-anchor="start">521</text>

<text x="140" y="342" fill="#c9d1d9" text-anchor="end">Swift</text>
<rect x="145" y="335" width="80.1" height="10" rx="2" fill="url(#langSw)"/>
<text x="229.1" y="343" fill="#8b949e" text-anchor="start">402</text>

<text x="140" y="358" fill="#c9d1d9" text-anchor="end">Go</text>
<rect x="145" y="351" width="56.0" height="10" rx="2" fill="url(#langGo)"/>
<text x="205.0" y="359" fill="#8b949e" text-anchor="start">281</text>
</g>
<text x="145" y="374" font-size="9" fill="#6e7681">bar width &#183; commits by language (relative)</text>
<!-- shimmer across bars -->
<g clip-path="url(#langClip)">
<rect x="65" y="301" width="80" height="68" fill="url(#sweep)">
<animate attributeName="x" values="65;315;65" dur="11s" repeatCount="indefinite"/>
</rect>
</g>

<!-- ===================== Panel E (bottom-right): PRs Merged (6137) ===================== -->
<text x="420" y="298" font-size="10" font-weight="700" fill="#a371f7" text-anchor="start" letter-spacing="1.1">PRS MERGED</text>
<text x="770" y="298" font-size="10" fill="#8b949e" text-anchor="end" letter-spacing="0.8">ALL TIME</text>
<text x="420" y="342" font-size="36" font-weight="800" fill="url(#purpleGrad)" text-anchor="start">6137</text>
<!-- 62 unit blocks (61 full + 1 at 37% for the trailing 37 PRs); each block = 100 PRs merged -->
<g fill="url(#purpleGrad)">
