<rect x="420" y="354" width="9" height="10" rx="1.5"/><rect x="431" y="354" width="9" height="10" rx="1.5"/><rect x="442" y="354" width="9" height="10" rx="1.5"/><rect x="453" y="354" width="9" height="10" rx="1.5"/><rect x="464" y="354" width="9" height="10" rx="1.5"/><rect x="475" y="354" width="9" height="10" rx="1.5"/><rect x="486" y="354" width="9" height="10" rx="1.5"/><rect x="497" y="354" width="9" height="10" rx="1.5"/><rect x="508" y="354" width="9" height="10" rx="1.5"/><rect x="519" y="354" width="9" height="10" rx="1.5"/><rect x="530" y="354" width="9" height="10" rx="1.5"/><rect x="541" y="354" width="9" height="10" rx="1.5"/><rect x="552" y="354" width="9" height="10" rx="1.5"/><rect x="563" y="354" width="9" height="10" rx="1.5"/><rect x="574" y="354" width="9" height="10" rx="1.5"/><rect x="585" y="354" width="9" height="10" rx="1.5"/><rect x="596" y="354" width="9" height="10" rx="1.5"/><rect x="607" y="354" width="9" height="10" rx="1.5"/><rect x="618" y="354" width="9" height="10" rx="1.5"/><rect x="629" y="354" width="9" height="10" rx="1.5"/><rect x="640" y="354" width="9" height="10" rx="1.5"/><rect x="651" y="354" width="9" height="10" rx="1.5"/><rect x="662" y="354" width="9" height="10" rx="1.5"/><rect x="673" y="354" width="9" height="10" rx="1.5"/><rect x="684" y="354" width="9" height="10" rx="1.5"/><rect x="695" y="354" width="9" height="10" rx="1.5"/><rect x="706" y="354" width="9" height="10" rx="1.5"/><rect x="717" y="354" width="9" height="10" rx="1.5"/><rect x="728" y="354" width="9" height="10" rx="1.5"/><rect x="739" y="354" width="9" height="10" rx="1.5"/><rect x="750" y="354" width="9" height="10" rx="1.5"/>
<!-- Row 1: columns 0..29 (blocks 32..61, 30 more full) at y=366 -->
<rect x="420" y="366" width="9" height="10" rx="1.5"/><rect x="431" y="366" width="9" height="10" rx="1.5"/><rect x="442" y="366" width="9" height="10" rx="1.5"/><rect x="453" y="366" width="9" height="10" rx="1.5"/><rect x="464" y="366" width="9" height="10" rx="1.5"/><rect x="475" y="366" width="9" height="10" rx="1.5"/><rect x="486" y="366" width="9" height="10" rx="1.5"/><rect x="497" y="366" width="9" height="10" rx="1.5"/><rect x="508" y="366" width="9" height="10" rx="1.5"/><rect x="519" y="366" width="9" height="10" rx="1.5"/><rect x="530" y="366" width="9" height="10" rx="1.5"/><rect x="541" y="366" width="9" height="10" rx="1.5"/><rect x="552" y="366" width="9" height="10" rx="1.5"/><rect x="563" y="366" width="9" height="10" rx="1.5"/><rect x="574" y="366" width="9" height="10" rx="1.5"/><rect x="585" y="366" width="9" height="10" rx="1.5"/><rect x="596" y="366" width="9" height="10" rx="1.5"/><rect x="607" y="366" width="9" height="10" rx="1.5"/><rect x="618" y="366" width="9" height="10" rx="1.5"/><rect x="629" y="366" width="9" height="10" rx="1.5"/><rect x="640" y="366" width="9" height="10" rx="1.5"/><rect x="651" y="366" width="9" height="10" rx="1.5"/><rect x="662" y="366" width="9" height="10" rx="1.5"/><rect x="673" y="366" width="9" height="10" rx="1.5"/><rect x="684" y="366" width="9" height="10" rx="1.5"/><rect x="695" y="366" width="9" height="10" rx="1.5"/><rect x="706" y="366" width="9" height="10" rx="1.5"/><rect x="717" y="366" width="9" height="10" rx="1.5"/><rect x="728" y="366" width="9" height="10" rx="1.5"/><rect x="739" y="366" width="9" height="10" rx="1.5"/>
</g>
<!-- Partial trailing block (62nd), opacity = 0.37 to show the remaining 37 of 100 PRs -->
<rect x="750" y="366" width="9" height="10" rx="1.5" fill="url(#purpleGrad)" opacity="0.37">
<animate attributeName="opacity" values="0.37;0.75;0.37" dur="2.9s" repeatCount="indefinite"/>
</rect>
<!-- block-legend -->
<text x="420" y="389" font-size="9" fill="#6e7681" text-anchor="start">each block &#183; 100 PRs merged</text>
<text x="770" y="389" font-size="9" fill="#6e7681" text-anchor="end">62 blocks &#183; last at 37%</text>
<!-- shimmer sweep across block grid -->
<g clip-path="url(#prClip)">
<rect x="340" y="352" width="80" height="24" fill="url(#sweep)">
<animate attributeName="x" values="340;761;340" dur="13s" repeatCount="indefinite"/>
</rect>
