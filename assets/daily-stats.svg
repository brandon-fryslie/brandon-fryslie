<!-- concept: pulse-network — a reactor core feeding four metric nodes via animated energy conduits -->
<svg width="800" height="210" viewBox="0 0 800 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live GitHub stats">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7cffcb"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6fffb"/><stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7cffcb"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="209" rx="12"/></clipPath>
  </defs>

  <rect width="800" height="210" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="209" rx="12" fill="#0f1720" stroke="#1f2b36" stroke-width="1"/>
  <g clip-path="url(#card)"><rect x="0" y="0" width="800" height="3" fill="url(#edge)" opacity="0.9"/></g>

  <!-- header -->
  <circle cx="26" cy="26" r="3.5" fill="#7cffcb"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="40" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3" font-weight="600">Live GitHub Stats</text>
  <text x="780" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681" text-anchor="end">Updated August 01, 2026</text>

  <!-- energy conduits: center core -> four nodes, with pulses travelling outward -->
  <g stroke="url(#edge)" stroke-width="1.5" fill="none" opacity="0.35">
    <line x1="400" y1="120" x2="168" y2="86"/>
    <line x1="400" y1="120" x2="168" y2="168"/>
    <line x1="400" y1="120" x2="632" y2="86"/>
    <line x1="400" y1="120" x2="632" y2="168"/>
  </g>
  <g fill="#7cffcb">
    <circle r="2.6"><animateMotion path="M400,120 L168,86" dur="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion path="M400,120 L168,168" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion path="M400,120 L632,86" dur="3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion path="M400,120 L632,168" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- reactor core -->
  <circle cx="400" cy="120" r="34" fill="url(#core)" opacity="0.9">
    <animate attributeName="r" values="30;36;30" dur="3.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="120" r="20" fill="none" stroke="#7cffcb" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="18;26;18" dur="3.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.7s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#08151a" font-weight="700" text-anchor="middle" letter-spacing="1">LIVE</text>

  <!-- four metric nodes: numbers stationary, large, high-contrast -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- top-left: Active Repos -->
    <circle cx="168" cy="86" r="3" fill="#7cffcb" filter="url(#glow)"/>
    <text x="168" y="72" font-size="30" font-weight="700" fill="url(#num)">7</text>
    <text x="168" y="100" font-size="12" fill="#9fb1c1">Active Repos</text>
    <text x="168" y="114" font-size="10" fill="#5f6f7e">(7 Days)</text>

    <!-- bottom-left: PRs Merged -->
    <circle cx="168" cy="168" r="3" fill="#7cffcb" filter="url(#glow)"/>
    <text x="168" y="160" font-size="30" font-weight="700" fill="url(#num)">1956</text>
    <text x="168" y="184" font-size="12" fill="#9fb1c1">PRs Merged</text>
    <text x="168" y="198" font-size="10" fill="#5f6f7e">(All Time)</text>

    <!-- top-right: Languages -->
    <circle cx="632" cy="86" r="3" fill="#7cffcb" filter="url(#glow)"/>
    <text x="632" y="72" font-size="30" font-weight="700" fill="url(#num)">9</text>
    <text x="632" y="100" font-size="12" fill="#9fb1c1">Languages</text>
    <text x="632" y="114" font-size="10" fill="#5f6f7e">(1 Year)</text>

    <!-- bottom-right: Days Active -->
    <circle cx="632" cy="168" r="3" fill="#7cffcb" filter="url(#glow)"/>
    <text x="632" y="160" font-size="30" font-weight="700" fill="url(#num)">252</text>
    <text x="632" y="184" font-size="12" fill="#9fb1c1">Days Active</text>
    <text x="632" y="198" font-size="10" fill="#5f6f7e">(1 Year)</text>
  </g>
</svg>
