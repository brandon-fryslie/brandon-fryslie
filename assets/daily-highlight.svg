<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Krakatoa — 143rd Anniversary (August 27, 1883) -->
<!-- about:
On the morning of 27 August 1883, four paroxysmal explosions tore the volcanic island of Krakatoa apart in the Sunda Strait between Java and Sumatra. The largest — at 10:02 local time — is among the loudest sounds ever recorded in human history: a sharp report heard 3,000 miles away on Rodrigues in the Indian Ocean, an atmospheric pressure wave that circled the Earth four times, and tsunamis over 30 metres tall that killed more than 36,000 people along the strait. Ash injected into the stratosphere cooled global temperatures for years and painted sunsets a strange fire-red as far away as Norway — the sky Edvard Munch would later remember in "The Scream." When it was over, two-thirds of the island had vanished beneath the sea; a new cone, Anak Krakatoa — the child of Krakatoa — began growing from the caldera forty-four years later.

The left half is the eruption itself: a dark ash column boils skyward from a glowing vent between the shattered island silhouettes, embers stream upward, and pressure waves ring outward across a blood-red sky. On the right, a large cream AUGUST 27, 2026 headline anchors an ember KRAKATOA · 143 YEARS subhead, an italic amber SUNDA STRAIT · JAVA · SUMATRA · RODRIGUES tertiary, a dim ash-grey CALDERA · PYROCLASTIC · 36,000 LOST roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 27, 2026 — the 143rd anniversary of the paroxysmal eruption of Krakatoa. On the left half, a massive dark ash column rises from a glowing red-orange vent between the shattered silhouettes of Krakatoa's three cones in the Sunda Strait; embers rise upward, concentric pressure-wave rings expand across a blood-red sky, and a dark ocean rolls at the base. On the right, a huge cream AUGUST 27, 2026 headline underlined by an ember-to-ash sweep, an ember KRAKATOA · 143 YEARS subhead trailed by cream · SINCE 1883, an italic amber SUNDA STRAIT · JAVA · SUMATRA · RODRIGUES tertiary, a dim ash-grey CALDERA · PYROCLASTIC · 36,000 LOST roster, and a Georgia-italic 'the sound heard around the world.' caption at the base.">
  <defs>
    <!-- Blood-red sky, night at top -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a0508"/>
      <stop offset="35%"  stop-color="#5a1208"/>
      <stop offset="70%"  stop-color="#a8280e"/>
      <stop offset="100%" stop-color="#d94a1a"/>
    </linearGradient>
    <!-- Ash column: dark base, warm inner glow -->
    <radialGradient id="ashColumn" cx="0.5" cy="0.95" r="0.9">
      <stop offset="0%"   stop-color="#ffe08a" stop-opacity="0.95"/>
      <stop offset="18%"  stop-color="#ff8a1a" stop-opacity="0.85"/>
      <stop offset="42%"  stop-color="#8a2a10" stop-opacity="0.85"/>
      <stop offset="75%"  stop-color="#2a1810" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <!-- Vent glow -->
    <radialGradient id="ventGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffefb0"/>
      <stop offset="35%"  stop-color="#ff8a1a"/>
      <stop offset="75%"  stop-color="#8a1a08" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8a1a08" stop-opacity="0"/>
    </radialGradient>
    <!-- Ocean -->
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a0a10"/>
      <stop offset="100%" stop-color="#080204"/>
    </linearGradient>
    <!-- Underline sweep -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff5a1a" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#ff5a1a" stop-opacity="1"/>
      <stop offset="48%"  stop-color="#ffd97a" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#a8988a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ff5a1a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <!-- Turbulent ash texture -->
    <filter id="ashTurb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.032" numOctaves="3" seed="7">
        <animate attributeName="baseFrequency" values="0.018 0.032;0.024 0.028;0.018 0.032" dur="13s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="18"/>
    </filter>
    <!-- Ocean ripple -->
    <filter id="oceanRipple" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.02" numOctaves="1" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.15  0 0 0 0 0.10  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="leftPanel">
      <rect x="0" y="0" width="360" height="200"/>
    </clipPath>
  </defs>

  <!-- ============ LEFT PANEL: KRAKATOA ============ -->
  <g clip-path="url(#leftPanel)">
    <!-- Sky -->
    <rect x="0" y="0" width="360" height="200" fill="url(#sky)"/>

    <!-- Slow sky pulse (atmospheric heat) -->
    <rect x="0" y="0" width="360" height="200" fill="#ff5a1a" opacity="0.06">
      <animate attributeName="opacity" values="0.04;0.12;0.04" dur="13s" repeatCount="indefinite"/>
    </rect>

    <!-- Concentric pressure-wave rings emanating from vent (163, 148) -->
    <g fill="none" stroke="#ffd97a" stroke-width="0.8">
      <circle cx="163" cy="148" r="10" opacity="0">
        <animate attributeName="r" values="10;340" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="163" cy="148" r="10" opacity="0">
        <animate attributeName="r" values="10;340" dur="11s" begin="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="11s" begin="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="163" cy="148" r="10" opacity="0">
        <animate attributeName="r" values="10;340" dur="11s" begin="7.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="11s" begin="7.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Distant faint ashfall -->
    <g fill="#c8b8a8" opacity="0.35">
      <circle cx="60" cy="30" r="0.6"><animate attributeName="cy" values="30;190" dur="17s" repeatCount="indefinite"/></circle>
      <circle cx="98" cy="10" r="0.5"><animate attributeName="cy" values="10;190" dur="19s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="20" r="0.7"><animate attributeName="cy" values="20;190" dur="23s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="50" r="0.5"><animate attributeName="cy" values="50;190" dur="17s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="80" r="0.6"><animate attributeName="cy" values="80;190" dur="19s" begin="5s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="60" r="0.5"><animate attributeName="cy" values="60;190" dur="23s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="15" r="0.6"><animate attributeName="cy" values="15;190" dur="21s" begin="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Ash column: massive plume rising from vent -->
    <g filter="url(#ashTurb)">
      <path d="M 130 155
               Q 100 110 108 70
               Q 115 30 145 8
               Q 175 -6 210 8
               Q 240 30 232 70
               Q 220 110 200 155 Z"
            fill="url(#ashColumn)" opacity="0.95">
        <animate attributeName="opacity" values="0.85;0.98;0.85" dur="7s" repeatCount="indefinite"/>
      </path>
      <!-- Second column layer for depth -->
      <path d="M 145 155
               Q 130 115 138 85
               Q 148 50 170 35
               Q 195 25 218 40
               Q 235 65 225 100
               Q 215 130 200 155 Z"
            fill="url(#ashColumn)" opacity="0.75">
        <animate attributeName="opacity" values="0.65;0.85;0.65" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Rising embers -->
    <g fill="#ffb04a">
      <circle cx="155" cy="140" r="1.2">
        <animate attributeName="cy" values="140;20" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="170" cy="135" r="0.9" fill="#ffe08a">
        <animate attributeName="cy" values="135;10" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="145" r="1.1">
        <animate attributeName="cy" values="145;20" dur="8s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="8s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="145" cy="150" r="0.8">
        <animate attributeName="cy" values="150;30" dur="11s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="11s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="190" cy="140" r="1.0" fill="#ff7a2a">
        <animate attributeName="cy" values="140;15" dur="9s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="9s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="165" cy="148" r="1.3">
        <animate attributeName="cy" values="148;25" dur="8s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="8s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="175" cy="150" r="0.9" fill="#ffe08a">
        <animate attributeName="cy" values="150;20" dur="10s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="10s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Ocean -->
    <rect x="0" y="155" width="360" height="45" fill="url(#ocean)"/>
    <!-- Ocean texture ripples -->
    <rect x="0" y="155" width="360" height="45" fill="#8a3a2a" filter="url(#oceanRipple)" opacity="0.35"/>

    <!-- Ocean reflection of eruption glow -->
    <ellipse cx="163" cy="158" rx="70" ry="4" fill="#ff5a1a" opacity="0.55">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="163" cy="163" rx="55" ry="3" fill="#ffb04a" opacity="0.35">
      <animate attributeName="opacity" values="0.25;0.55;0.25" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Island silhouettes (three cones: Perbuwatan, Danan, Rakata, in the Sunda Strait) -->
    <!-- Left small cone -->
    <path d="M 90 158 L 120 148 L 138 158 Z" fill="#0d1117"/>
    <!-- Center main cone (partially collapsed / erupting) -->
    <path d="M 130 158 L 145 138 L 158 128 L 175 132 L 190 145 L 205 158 Z" fill="#0d1117"/>
    <!-- Right cone (Rakata remnant) -->
    <path d="M 200 158 L 220 145 L 245 158 Z" fill="#0d1117"/>

    <!-- Vent glow at center of main cone -->
    <ellipse cx="163" cy="148" rx="18" ry="9" fill="url(#ventGlow)">
      <animate attributeName="rx" values="16;22;16" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="163" cy="148" rx="8" ry="4" fill="#ffefb0">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Lava streaks down center cone -->
    <path d="M 158 135 Q 155 145 152 158" fill="none" stroke="#ff7a2a" stroke-width="1.2" opacity="0.85"/>
    <path d="M 170 135 Q 173 145 176 158" fill="none" stroke="#ff5a1a" stroke-width="1.0" opacity="0.75"/>

    <!-- Distant horizon light (Rodrigues direction — the sound traveled here) -->
    <line x1="0" y1="156" x2="360" y2="156" stroke="#d94a1a" stroke-width="0.3" opacity="0.55"/>

    <!-- Tiny fleeing ship silhouette on distant water -->
    <g transform="translate(300, 160)" opacity="0.7">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="300 160; 328 160" dur="23s" repeatCount="indefinite"/>
      <path d="M -6 0 L 6 0 L 4 3 L -4 3 Z" fill="#0d1117"/>
      <line x1="0" y1="0" x2="0" y2="-6" stroke="#0d1117" stroke-width="0.5"/>
      <path d="M 0 -6 L 4 -1 L 0 -1 Z" fill="#0d1117"/>
    </g>
  </g>

  <!-- Seam -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ============ RIGHT TEXT PANEL ============ -->
  <rect x="360" y="0" width="440" height="200" fill="#0d1117"/>

  <!-- Faint ember accent on right edge (vertical) -->
  <rect x="792" y="20" width="4" height="52" fill="#ff5a1a" opacity="0.85"/>
  <rect x="792" y="72" width="4" height="52" fill="#ffd97a" opacity="0.85"/>
  <rect x="792" y="124" width="4" height="52" fill="#a8988a" opacity="0.85"/>

  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 27, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#ff7a2a">KRAKATOA</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;143 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;·&#160;SINCE 1883</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffd97a" letter-spacing="1" opacity="0.95">
    SUNDA STRAIT · JAVA · SUMATRA · RODRIGUES
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#a8988a" letter-spacing="1" opacity="0.9">
    CALDERA · PYROCLASTIC · 36,000 LOST
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;the sound heard around the world.&#8221;
  </text>
</svg>
