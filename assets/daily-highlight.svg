<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Voyager 2 Launch — 49th Anniversary (August 20, 1977) -->
<!-- about:
On 20 August 1977, a Titan III-E rocket lifted Voyager 2 off Pad 41 at Cape Canaveral, bound on a trajectory JPL had timed to a once-in-176-years alignment of the outer planets. Sixteen days later its twin, Voyager 1, followed on a faster arc. Voyager 2 is still the only spacecraft ever to have flown past all four gas giants — Jupiter (1979), Saturn (1981), Uranus (1986), and Neptune (1989) — and both probes carry the Golden Record, a gilded copper phonograph disc etched with a pulsar map, 116 images, and greetings in 55 languages, aimed at whoever might one day find it drifting between the stars.

The left half is the Golden Record itself, seated on a dark starfield: the gilded disc turns slowly on its center hole while its etched grooves catch a rotating highlight, ringed by the pulsar-map rays that fix the sun's position for any finder. A small Voyager 2 spacecraft silhouette — high-gain dish, magnetometer boom, RTG cluster — drifts leftward across the field, a thin blue crescent of Neptune tucked at the lower edge. On the right, a large AUGUST 20, 2026 headline anchors a gold VOYAGER 2 · 49 YEARS subhead, an italic JPL · TITAN III-E · CAPE CANAVERAL tertiary, a dim JUPITER · SATURN · URANUS · NEPTUNE roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 20, 2026 — the 49th anniversary of the launch of Voyager 2. On the left half, the Voyager Golden Record — a gilded copper disc — turns slowly on a dark starfield, its etched grooves catching a rotating highlight and its pulsar-map rays radiating from the center. A small Voyager 2 spacecraft silhouette with its high-gain dish drifts leftward across the field, a thin blue crescent of Neptune tucked at the lower edge. On the right, a huge cream AUGUST 20, 2026 headline underlined by a gold-to-blue sweep, a gold VOYAGER 2 · 49 YEARS subhead trailed by cream · SINCE 1977, an italic amber JPL · TITAN III-E · CAPE CANAVERAL tertiary, a dim cyan JUPITER · SATURN · URANUS · NEPTUNE roster, and a Georgia-italic 'the grand tour continues.' caption at the base.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="goldGrad" cx="0.35" cy="0.32" r="0.78">
      <stop offset="0%"   stop-color="#ffe9a8"/>
      <stop offset="35%"  stop-color="#e6b64a"/>
      <stop offset="70%"  stop-color="#a97a1e"/>
      <stop offset="100%" stop-color="#5a3f10"/>
    </radialGradient>
    <radialGradient id="goldRim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="88%"  stop-color="#a97a1e" stop-opacity="0"/>
      <stop offset="94%"  stop-color="#f0c85a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5a3f10" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="neptuneGrad" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%"   stop-color="#7fb7ff"/>
      <stop offset="55%"  stop-color="#3866c9"/>
      <stop offset="100%" stop-color="#0f1f45"/>
    </radialGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0c85a" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#f0c85a" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#ffe9a8" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#5aa0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2444a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glintGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#fff5cc" stop-opacity="0.75"/>
      <stop offset="52%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="discClip">
      <circle cx="145" cy="95" r="68"/>
    </clipPath>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>

  <!-- Starfield -->
  <g fill="#cfd6e6">
    <circle cx="34"  cy="24"  r="0.7" opacity="0.7"/>
    <circle cx="78"  cy="42"  r="0.5" opacity="0.5"/>
    <circle cx="12"  cy="88"  r="0.6" opacity="0.6"/>
    <circle cx="52"  cy="152" r="0.7" opacity="0.7"/>
    <circle cx="98"  cy="176" r="0.5" opacity="0.5"/>
    <circle cx="238" cy="18"  r="0.6" opacity="0.6"/>
    <circle cx="264" cy="46"  r="0.5" opacity="0.5"/>
    <circle cx="292" cy="172" r="0.7" opacity="0.7"/>
    <circle cx="320" cy="112" r="0.5" opacity="0.5"/>
    <circle cx="212" cy="184" r="0.6" opacity="0.6"/>
    <circle cx="180" cy="14"  r="0.5" opacity="0.5"/>
    <circle cx="24"  cy="118" r="0.5" opacity="0.5"/>

    <!-- Twinkling stars -->
    <circle cx="60" cy="66" r="1.1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="248" cy="78" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.15;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="286" cy="34" r="1.2" fill="#ffe9a8">
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="46" r="0.9" fill="#ffffff">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="152" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Distant Neptune crescent, lower-left of panel -->
  <g opacity="0.9">
    <circle cx="42" cy="192" r="46" fill="url(#neptuneGrad)"/>
    <!-- Shadow half -->
    <path d="M 42 146 A 46 46 0 0 0 42 238 Z" fill="#05070d" opacity="0.85"/>
    <!-- Faint atmospheric bands -->
    <path d="M -5 176 Q 42 172 88 176" stroke="#5aa0ff" stroke-width="0.6" fill="none" opacity="0.35"/>
    <path d="M -5 188 Q 42 184 88 188" stroke="#7fb7ff" stroke-width="0.5" fill="none" opacity="0.25"/>
  </g>

  <!-- ==================== VOYAGER GOLDEN RECORD ==================== -->

  <!-- Soft glow behind the disc -->
  <circle cx="145" cy="95" r="82" fill="#e6b64a" opacity="0.08"/>

  <!-- The gold disc (rotates slowly) -->
  <g transform-origin="145 95">
    <animateTransform attributeName="transform" type="rotate" from="0 145 95" to="360 145 95" dur="59s" repeatCount="indefinite"/>

    <!-- Base gold platter -->
    <circle cx="145" cy="95" r="68" fill="url(#goldGrad)"/>

    <!-- Grooves (spiral rings) -->
    <g fill="none" stroke="#7a5518" stroke-width="0.35" opacity="0.55" clip-path="url(#discClip)">
      <circle cx="145" cy="95" r="60"/>
      <circle cx="145" cy="95" r="56"/>
      <circle cx="145" cy="95" r="52"/>
      <circle cx="145" cy="95" r="48"/>
      <circle cx="145" cy="95" r="44"/>
      <circle cx="145" cy="95" r="40"/>
      <circle cx="145" cy="95" r="36"/>
      <circle cx="145" cy="95" r="32"/>
      <circle cx="145" cy="95" r="28"/>
      <circle cx="145" cy="95" r="24"/>
    </g>

    <!-- Pulsar-map rays radiating from center (14 lines of varying length) -->
    <g stroke="#3a2708" stroke-width="0.55" opacity="0.75" clip-path="url(#discClip)">
      <line x1="145" y1="95" x2="145" y2="35"/>
      <line x1="145" y1="95" x2="188" y2="52"/>
      <line x1="145" y1="95" x2="205" y2="95"/>
      <line x1="145" y1="95" x2="192" y2="140"/>
      <line x1="145" y1="95" x2="160" y2="155"/>
      <line x1="145" y1="95" x2="115" y2="150"/>
      <line x1="145" y1="95" x2="88"  y2="128"/>
      <line x1="145" y1="95" x2="82"  y2="95"/>
      <line x1="145" y1="95" x2="95"  y2="55"/>
      <line x1="145" y1="95" x2="130" y2="40"/>
      <line x1="145" y1="95" x2="172" y2="42"/>
      <line x1="145" y1="95" x2="200" y2="70"/>
      <line x1="145" y1="95" x2="180" y2="150"/>
      <line x1="145" y1="95" x2="102" y2="140"/>
    </g>

    <!-- Small tick-mark clusters partway along each ray (binary distances) -->
    <g fill="#2a1c05" opacity="0.85">
      <circle cx="145" cy="60"  r="0.9"/>
      <circle cx="145" cy="55"  r="0.9"/>
      <circle cx="176" cy="66"  r="0.9"/>
      <circle cx="172" cy="70"  r="0.9"/>
      <circle cx="185" cy="95"  r="0.9"/>
      <circle cx="180" cy="95"  r="0.9"/>
      <circle cx="175" cy="95"  r="0.9"/>
      <circle cx="112" cy="72"  r="0.9"/>
      <circle cx="108" cy="76"  r="0.9"/>
      <circle cx="118" cy="130" r="0.9"/>
      <circle cx="114" cy="134" r="0.9"/>
      <circle cx="170" cy="125" r="0.9"/>
      <circle cx="166" cy="130" r="0.9"/>
    </g>

    <!-- Hydrogen hyperfine diagram (top-left quadrant of disc): two circles + arrow -->
    <g fill="none" stroke="#2a1c05" stroke-width="0.55" opacity="0.85">
      <circle cx="108" cy="66" r="3.6"/>
      <circle cx="120" cy="66" r="3.6"/>
      <line x1="102" y1="66" x2="126" y2="66"/>
    </g>

    <!-- Rim highlight ring -->
    <circle cx="145" cy="95" r="68" fill="url(#goldRim)"/>

    <!-- Center hole with clamp -->
    <circle cx="145" cy="95" r="6" fill="#0d1117"/>
    <circle cx="145" cy="95" r="6" fill="none" stroke="#8a5f15" stroke-width="0.8"/>
  </g>

  <!-- Rotating highlight sweep across the disc (independent of disc rotation, gives the mirror shimmer) -->
  <g clip-path="url(#discClip)">
    <rect x="60" y="27" width="28" height="136" fill="url(#glintGrad)" transform="skewX(-20)">
      <animate attributeName="x" values="60;220;60" dur="13s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ==================== VOYAGER 2 SPACECRAFT (drifts across) ==================== -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="340 0; -60 8; 340 0" dur="47s" repeatCount="indefinite"/>
    <!-- High-gain dish (large parabolic circle) -->
    <circle cx="0" cy="30" r="11" fill="#e4e6ec" stroke="#9099a8" stroke-width="0.6"/>
    <circle cx="0" cy="30" r="6" fill="none" stroke="#9099a8" stroke-width="0.4"/>
    <circle cx="0" cy="30" r="2" fill="#9099a8"/>
    <!-- Bus / body under the dish -->
    <rect x="-4" y="41" width="8" height="4" fill="#c0c5cf"/>
    <!-- Magnetometer boom trailing right -->
    <line x1="4" y1="43" x2="34" y2="47" stroke="#7a8290" stroke-width="0.5"/>
    <circle cx="34" cy="47" r="1" fill="#c0c5cf"/>
    <!-- RTG cluster trailing left -->
    <line x1="-4" y1="43" x2="-16" y2="47" stroke="#7a8290" stroke-width="0.5"/>
    <rect x="-19" y="45" width="4" height="5" fill="#8a5f15" opacity="0.9"/>
    <!-- Small science boom down -->
    <line x1="0" y1="45" x2="0" y2="56" stroke="#7a8290" stroke-width="0.5"/>
    <rect x="-2" y="56" width="4" height="3" fill="#c0c5cf"/>
  </g>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 20, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#f0c85a">VOYAGER 2</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;49 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;&#160;·&#160;&#160;SINCE 1977</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    JPL · TITAN III-E · CAPE CANAVERAL
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7fd4b8" letter-spacing="1" opacity="0.9">
    JUPITER · SATURN · URANUS · NEPTUNE
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;the grand tour continues.&#8221;
  </text>
</svg>
