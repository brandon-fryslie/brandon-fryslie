<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Thanksgiving Day — Candle & Gratitude (November 26, 2026) -->
<!-- about:
Thanksgiving in the United States is set by federal statute on the fourth Thursday of November — a line Franklin Roosevelt signed in December 1941 after two years of calendar politics with retailers who wanted a longer shopping season. The harvest feast at Plymouth in the autumn of 1621, between about fifty English settlers and ninety Wampanoag under Massasoit, is the scene usually invoked; Abraham Lincoln is the one who made the day a national observance in 1863, in the thick of the Civil War, after a letter-writing campaign by Sarah Josepha Hale. Underneath four centuries of pageant the smaller gesture has not moved: a lit candle, a short pause, and the small ceremony of saying out loud what the year gave you.

The scene is a single candle burning at nightfall. A brass holder sits on a dark wooden surface; a tall cream candle rises from it, and a teardrop flame flickers on a slow cycle, throwing a warm amber halo across the left half of the canvas. Four gratitude words — FAMILY, HOME, WARMTH, HARVEST — drift upward around the flame on staggered paths, fading as they rise like offerings carried on smoke. A thin wisp of smoke curls above the flame; a few autumn leaves drift horizontally along the lower edge. On the right, a cream NOVEMBER 26, 2026 headline sits over a double cream-and-cranberry bar, a cream THANKSGIVING DAY · FOURTH THURSDAY subhead, an italic amber PLYMOUTH · 1621 · LINCOLN · 1863 tertiary, a dim FAMILY · HOME · WARMTH · GATHERING · GRATITUDE roster, and a Georgia-italic caption at the base reading: Grateful, and saying so out loud.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for November 26, 2026 — Thanksgiving Day. On the left, a single tall cream candle in a brass holder burns against the dark, its teardrop flame flickering while a warm amber halo throbs outward; four gratitude words — FAMILY, HOME, WARMTH, HARVEST — drift upward around the flame on staggered paths and fade as they rise. A thin wisp of smoke curls above the flame; a few autumn leaves drift horizontally along the lower edge. On the right, a cream NOVEMBER 26, 2026 headline sits over a double cream-and-cranberry bar, a cream THANKSGIVING DAY · FOURTH THURSDAY subhead, an italic amber PLYMOUTH · 1621 · LINCOLN · 1863 tertiary, a dim FAMILY · HOME · WARMTH · GATHERING · GRATITUDE roster, and a Georgia-italic caption at the base reading: Grateful, and saying so out loud.">
  <defs>
    <radialGradient id="bg" cx="0.28" cy="0.55" r="0.95">
      <stop offset="0"   stop-color="#1a1108"/>
      <stop offset="0.5" stop-color="#110a05"/>
      <stop offset="1"   stop-color="#070502"/>
    </radialGradient>

    <!-- Soft warm halo around the flame -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#ffb860" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#e07a1a" stop-opacity="0.35"/>
      <stop offset="0.75" stop-color="#8a3a08" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Flame gradient: hot white core to amber to deep ember -->
    <radialGradient id="flame" cx="0.5" cy="0.72" r="0.65">
      <stop offset="0"    stop-color="#fff6c8"/>
      <stop offset="0.25" stop-color="#ffd872"/>
      <stop offset="0.6"  stop-color="#f08a24"/>
      <stop offset="1"    stop-color="#6a1a04"/>
    </radialGradient>

    <!-- Candle wax column -->
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#6a5a3a"/>
      <stop offset="0.5"  stop-color="#f1e4bf"/>
      <stop offset="1"    stop-color="#5a4a2a"/>
    </linearGradient>

    <!-- Brass candle holder -->
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#5a3a10"/>
      <stop offset="0.5"  stop-color="#d9a35a"/>
      <stop offset="1"    stop-color="#4a2a08"/>
    </linearGradient>

    <!-- Wooden-surface subtle gradient -->
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0e06" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0a0502" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Reusable flame path: teardrop shape pointing up -->
    <path id="flameShape" d="M 0 -22 Q 7 -14 7 -4 Q 7 6 0 8 Q -7 6 -7 -4 Q -7 -14 0 -22 Z"/>

    <!-- Inner (hotter) flame core -->
    <path id="flameCore" d="M 0 -14 Q 3 -8 3 -2 Q 3 4 0 5 Q -3 4 -3 -2 Q -3 -8 0 -14 Z"/>

    <!-- Maple-leaf silhouette (small, for drifting leaves) -->
    <path id="maple" d="M 0 -6 L 2 -2 L 6 -3 L 3 1 L 7 4 L 2 4 L 3 7 L 0 4 L -3 7 L -2 4 L -7 4 L -3 1 L -6 -3 L -2 -2 Z"/>
  </defs>

  <style>
    .headline  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 1.5px; }
    .sub       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 2.4px; }
    .tert      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 1.8px; font-style: italic; }
    .roster    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 2.4px; }
    .caption   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .stamp     { font-family: 'Courier New', Courier, monospace; letter-spacing: 1.2px; font-weight: 600; }
    .grat      { font-family: Georgia, 'Times New Roman', serif; font-style: italic; letter-spacing: 1px; }

    /* Soft text pulse */
    @keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.86; } }
    .fade-1 { animation: softPulse 13s ease-in-out infinite; }
    .fade-2 { animation: softPulse 13s ease-in-out 0.4s infinite; }
    .fade-3 { animation: softPulse 13s ease-in-out 0.8s infinite; }
    .fade-4 { animation: softPulse 13s ease-in-out 1.2s infinite; }
    .fade-5 { animation: softPulse 13s ease-in-out 1.6s infinite; }
    .fade-6 { animation: softPulse 13s ease-in-out 2.0s infinite; }

    /* Caption glimmer */
    @keyframes capGlim { 0%,100% { opacity: 0.82; } 50% { opacity: 1; } }
    .cap { animation: capGlim 13s ease-in-out infinite; }

    /* Bar draw-in */
    @keyframes barDraw { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
    .bar { transform-origin: left center; transform-box: fill-box; animation: barDraw 1.4s cubic-bezier(.3,.9,.2,1) 0.4s both; }

    /* Halo breathe */
    @keyframes haloPulse { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.06); } }
    .halo { animation: haloPulse 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  </style>

  <!-- Backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Dark wooden table surface (lower band) -->
  <rect x="0" y="168" width="800" height="32" fill="url(#wood)"/>
  <!-- Faint horizontal wood grain -->
  <g stroke="#2a1708" stroke-width="0.4" opacity="0.5" fill="none">
    <path d="M 0 173 Q 200 171 400 174 T 800 173"/>
    <path d="M 0 180 Q 200 182 400 179 T 800 181"/>
    <path d="M 0 188 Q 200 186 400 189 T 800 187"/>
  </g>

  <!-- =============== CANDLE HALO (behind everything else on left) =============== -->
  <ellipse cx="150" cy="95" rx="190" ry="105" fill="url(#halo)" class="halo"/>

  <!-- =============== DRIFTING AUTUMN LEAVES (lower edge, horizontal drift) =============== -->
  <g opacity="0.72">
    <use href="#maple" fill="#c04a1a">
      <animateMotion dur="23s" repeatCount="indefinite" path="M -20 190 Q 200 185 420 192 Q 600 190 820 188"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#maple" fill="#e5a53a">
      <animateMotion dur="29s" begin="-7s" repeatCount="indefinite" path="M -20 183 Q 260 188 520 184 Q 700 185 820 186"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="17s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#maple" fill="#a52a1d" opacity="0.8">
      <animateMotion dur="31s" begin="-13s" repeatCount="indefinite" path="M -20 196 Q 180 194 480 198 Q 640 197 820 195"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="19s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- =============== GRATITUDE WORDS (drifting up around candle) =============== -->
  <g opacity="0.9">
    <!-- FAMILY: drifts up right of candle, fades out -->
    <text class="grat" font-size="11" fill="#e8c47a" text-anchor="middle">
      <animateMotion dur="11s" repeatCount="indefinite" path="M 200 140 Q 210 110 205 70 Q 200 40 195 15"/>
      <animate attributeName="opacity" values="0;0.95;0.85;0" keyTimes="0;0.2;0.7;1" dur="11s" repeatCount="indefinite"/>
      FAMILY
    </text>

    <!-- HOME: drifts up left of candle -->
    <text class="grat" font-size="11" fill="#f1cf7a" text-anchor="middle">
      <animateMotion dur="13s" begin="-4s" repeatCount="indefinite" path="M 100 140 Q 92 110 96 70 Q 100 40 105 15"/>
      <animate attributeName="opacity" values="0;0.95;0.85;0" keyTimes="0;0.2;0.7;1" dur="13s" begin="-4s" repeatCount="indefinite"/>
      HOME
    </text>

    <!-- WARMTH: drifts up further right -->
    <text class="grat" font-size="11" fill="#ffd872" text-anchor="middle">
      <animateMotion dur="17s" begin="-9s" repeatCount="indefinite" path="M 240 150 Q 250 115 245 75 Q 240 40 235 12"/>
      <animate attributeName="opacity" values="0;0.95;0.85;0" keyTimes="0;0.2;0.7;1" dur="17s" begin="-9s" repeatCount="indefinite"/>
      WARMTH
    </text>

    <!-- HARVEST: drifts up further left -->
    <text class="grat" font-size="11" fill="#e07a1a" text-anchor="middle">
      <animateMotion dur="19s" begin="-14s" repeatCount="indefinite" path="M 60 150 Q 55 115 60 75 Q 65 40 70 12"/>
      <animate attributeName="opacity" values="0;0.95;0.85;0" keyTimes="0;0.2;0.7;1" dur="19s" begin="-14s" repeatCount="indefinite"/>
      HARVEST
    </text>
  </g>

  <!-- =============== CANDLE =============== -->
  <g>
    <!-- Brass holder base (foot) -->
    <ellipse cx="150" cy="167" rx="38" ry="4" fill="#1a0e06" opacity="0.8"/>
    <path d="M 118 167 Q 150 154 182 167 Q 180 171 150 172 Q 120 171 118 167 Z" fill="url(#brass)"/>
    <!-- Holder stem -->
    <rect x="144" y="150" width="12" height="15" fill="url(#brass)"/>
    <!-- Holder cup -->
    <path d="M 132 150 Q 150 142 168 150 Q 165 155 150 156 Q 135 155 132 150 Z" fill="url(#brass)" stroke="#2a1608" stroke-width="0.4"/>
    <ellipse cx="150" cy="150" rx="18" ry="3.5" fill="#2a1608" opacity="0.7"/>

    <!-- Candle wax column -->
    <rect x="141" y="92" width="18" height="58" fill="url(#wax)" stroke="#3a2a10" stroke-width="0.3"/>
    <!-- Soft drip highlight -->
    <path d="M 148 94 Q 150 120 149 148" stroke="#fff6d8" stroke-width="0.8" fill="none" opacity="0.35"/>
    <!-- Candle top (slight dish where wick meets wax) -->
    <ellipse cx="150" cy="92" rx="9" ry="2" fill="#c9b580"/>
    <ellipse cx="150" cy="92" rx="5" ry="1.2" fill="#6a5020"/>

    <!-- Wick -->
    <rect x="149.3" y="88" width="1.4" height="5" fill="#3a1a08"/>

    <!-- Flame — outer teardrop + inner core, animated flicker -->
    <g transform="translate(150,86)">
      <!-- Outer flame -->
      <use href="#flameShape" fill="url(#flame)" opacity="0.95">
        <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 0.96; 0.95 1.04; 1.02 0.98; 1 1" keyTimes="0;0.25;0.5;0.75;1" dur="2.3s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0.95;0.85;1;0.9;0.95" keyTimes="0;0.25;0.5;0.75;1" dur="2.3s" repeatCount="indefinite"/>
      </use>
      <!-- Inner core -->
      <use href="#flameCore" fill="#fff6c8" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="1 1; 0.9 1.08; 1.08 0.92; 0.96 1.04; 1 1" keyTimes="0;0.25;0.5;0.75;1" dur="1.7s" repeatCount="indefinite" additive="sum"/>
        <animate attributeName="opacity" values="0.85;1;0.75;0.95;0.85" keyTimes="0;0.25;0.5;0.75;1" dur="1.7s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- Smoke wisp above flame -->
    <path d="M 150 60 Q 148 50 152 42 Q 146 32 150 22" stroke="#9a8260" stroke-width="0.8" fill="none" opacity="0.35">
      <animate attributeName="opacity" values="0.0;0.45;0.0" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- =============== VERTICAL SEPARATOR =============== -->
  <line x1="395" y1="30" x2="395" y2="170" stroke="#3a2614" stroke-width="0.6" opacity="0.7"/>

  <!-- =============== RIGHT TEXT COLUMN =============== -->
  <text x="420" y="60" font-size="26" class="headline fade-1" fill="#f5e6c8">NOVEMBER 26, 2026</text>

  <g transform="translate(420,70)">
    <rect class="bar" x="0" y="0" width="330" height="3" fill="#f5e6c8"/>
    <rect class="bar" x="0" y="5" width="250" height="2" fill="#a52a2a"/>
  </g>

  <text x="420" y="97" font-size="14" class="sub fade-2" fill="#f5e6c8">THANKSGIVING DAY · FOURTH THURSDAY</text>

  <text x="420" y="117" font-size="10.5" class="tert fade-3" fill="#e5a53a">PLYMOUTH · 1621 · LINCOLN · 1863</text>

  <text x="420" y="140" font-size="8" class="roster fade-4" fill="#9a8260">FAMILY · HOME · WARMTH · GATHERING · GRATITUDE</text>

  <text x="420" y="168" font-size="12" class="caption cap fade-5" fill="#d9c9a0">Grateful, and saying so out loud.</text>

  <!-- Stamp card: candle & date -->
  <g class="fade-6" transform="translate(685,30)">
    <rect x="0" y="0" width="90" height="30" fill="none" stroke="#a52a2a" stroke-opacity="0.55" stroke-width="0.6"/>
    <text x="45" y="12" font-size="6" class="stamp" fill="#e5a53a" text-anchor="middle" opacity="0.9">ONE CANDLE LIT</text>
    <text x="45" y="22" font-size="7.5" class="stamp" fill="#e5a53a" text-anchor="middle" opacity="0.95">26 NOV 2026</text>
  </g>
</svg>
