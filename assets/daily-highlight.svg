<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Discovery of Helium — 158th Anniversary (August 18, 1868) -->
<!-- about:
On 18 August 1868, during a total solar eclipse tracked across India, the French astronomer Pierre Janssen turned a spectroscope on the sun's chromosphere from Guntur and saw an unfamiliar bright yellow line at 587.49 nanometres. Two months later, back in England, Norman Lockyer picked the same line out of the daytime spectrum with a modified instrument and, convinced it belonged to no element then known on Earth, named it helium after Helios, the sun. It was the first — and still the only — element discovered off-Earth before it was found here, twenty-seven years before William Ramsay isolated it from uranium ore. Every party balloon, MRI scanner, and rocket-fuel purge line since owes its name to that morning over Guntur.

The left half is the eclipse itself: a black lunar disc silhouetted against a pale silver corona whose streamers gently pulse, ringed by a coral-pink chromosphere with two prominence arcs bowing off the limb. Below it, a long horizontal solar spectrum runs violet-to-red with one bright vertical marker snapped to the yellow band — the D3 line labelled "587.49 nm." On the right, a large AUGUST 18, 2026 headline anchors a HELIUM · 158 YEARS subhead, an italic JANSSEN · LOCKYER · GUNTUR, INDIA tertiary, a dim He · Z = 2 · SUN'S GIFT spec line, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 18, 2026 — the 158th anniversary of the discovery of helium. On the left half, a total solar eclipse: a black lunar disc silhouetted against a pale silver corona whose streamers pulse gently, ringed by a coral-pink chromosphere with two prominence arcs bowing off the limb. Below the eclipse a long horizontal solar spectrum runs violet-to-red with one bright vertical marker snapped to the yellow band, labelled D3 · 587.49 nm — the helium line. On the right, a huge cream AUGUST 18, 2026 headline underlined by a sunrise sweep, a gold HELIUM · 158 YEARS subhead trailed by cream · SINCE 1868, an italic amber JANSSEN · LOCKYER · GUNTUR, INDIA tertiary, a dim cyan He · Z = 2 · SUN'S GIFT roster, and a Georgia-italic 'the first element discovered off-Earth.' caption at the base.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#080b18"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffb84d" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#ffb84d" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#ffd166" stop-opacity="1"/>
      <stop offset="72%"  stop-color="#ff7a7a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coronaGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fff7d6" stop-opacity="0"/>
      <stop offset="34%"  stop-color="#fff7d6" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#fff2c4" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#ffe7a3" stop-opacity="0.55"/>
      <stop offset="72%"  stop-color="#f6cf8a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f6cf8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chromoGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ff6b8a" stop-opacity="0"/>
      <stop offset="88%"  stop-color="#ff6b8a" stop-opacity="0"/>
      <stop offset="94%"  stop-color="#ff7a7a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff7a7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="90%"  stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"    stop-color="#3b1c66"/>
      <stop offset="14%"   stop-color="#4c2fb0"/>
      <stop offset="26%"   stop-color="#3a6ee0"/>
      <stop offset="40%"   stop-color="#3ec7d0"/>
      <stop offset="52%"   stop-color="#4bd97a"/>
      <stop offset="63%"   stop-color="#ffe14a"/>
      <stop offset="76%"   stop-color="#ff9a3c"/>
      <stop offset="90%"   stop-color="#ff4a4a"/>
      <stop offset="100%"  stop-color="#8f1414"/>
    </linearGradient>
    <symbol id="star" overflow="visible">
      <circle r="0.85" fill="#e6f2f7" opacity="0.7"/>
    </symbol>
  </defs>

  <!-- Night sky -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>

  <!-- Stars scattered around the eclipse and top of canvas -->
  <g>
    <use href="#star" x="20"  y="22"/>
    <use href="#star" x="52"  y="10"/>
    <use href="#star" x="94"  y="30"/>
    <use href="#star" x="138" y="14"/>
    <use href="#star" x="220" y="8"/>
    <use href="#star" x="266" y="24"/>
    <use href="#star" x="308" y="12"/>
    <use href="#star" x="352" y="28"/>
    <use href="#star" x="26"  y="70"/>
    <use href="#star" x="336" y="72"/>
    <use href="#star" x="12"  y="112"/>
    <use href="#star" x="352" y="106"/>
    <use href="#star" x="46"  y="188"/>
    <use href="#star" x="322" y="184"/>
    <!-- gentle blink on a few -->
    <circle cx="94" cy="30" r="1.2" fill="#fff4d0">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="308" cy="12" r="1.2" fill="#fff4d0">
      <animate attributeName="opacity" values="1;0.2;1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="26" cy="70" r="1.2" fill="#fff4d0">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ==================== ECLIPSE (LEFT) ==================== -->
  <g transform="translate(175 82)">
    <!-- Outer soft corona halo -->
    <circle r="90" fill="url(#coronaGrad)">
      <animate attributeName="r" values="88;94;88" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Corona streamers (radial rays), slowly rotating -->
    <g opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="97s" repeatCount="indefinite"/>
      <g fill="#fff2c4">
        <path d="M 0 -46 L 5 -92 L 0 -105 L -5 -92 Z" opacity="0.55"/>
        <path d="M 46 0 L 92 5 L 105 0 L 92 -5 Z" opacity="0.4"/>
        <path d="M 0 46 L 5 92 L 0 105 L -5 92 Z" opacity="0.5"/>
        <path d="M -46 0 L -92 -5 L -105 0 L -92 5 Z" opacity="0.42"/>
        <path d="M 32 -32 L 64 -70 L 78 -78 L 70 -64 Z" opacity="0.35"/>
        <path d="M -32 -32 L -64 -70 L -78 -78 L -70 -64 Z" opacity="0.35"/>
        <path d="M 32 32 L 64 70 L 78 78 L 70 64 Z" opacity="0.3"/>
        <path d="M -32 32 L -64 70 L -78 78 L -70 64 Z" opacity="0.3"/>
      </g>
    </g>

    <!-- Inner corona brightening -->
    <circle r="60" fill="url(#innerGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Chromosphere pink ring (just outside the moon's limb) -->
    <circle r="48" fill="url(#chromoGrad)"/>

    <!-- Prominence arcs bowing off the limb -->
    <g fill="none" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round" opacity="0.9">
      <path d="M -33 -30 Q -46 -46 -22 -52 Q -8 -55 -6 -46">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="13s" repeatCount="indefinite"/>
      </path>
      <path d="M 40 -12 Q 58 -20 60 4 Q 60 18 46 18">
        <animate attributeName="opacity" values="0.9;0.55;0.9" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M 12 44 Q 24 60 4 58 Q -6 56 -6 46">
        <animate attributeName="opacity" values="0.55;0.95;0.55" dur="17s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- The moon disc (silhouette) -->
    <circle r="44" fill="#0a0d15"/>
    <circle r="44" fill="none" stroke="#1a1e2a" stroke-width="0.5"/>

    <!-- Bright "diamond ring" flare on the limb (subtle, drifts) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="53s" repeatCount="indefinite"/>
      <g transform="translate(44 0)">
        <circle r="3" fill="#fff7d6" opacity="0.95">
          <animate attributeName="opacity" values="0.7;1;0.7" dur="3.7s" repeatCount="indefinite"/>
        </circle>
        <circle r="7" fill="#fff2c4" opacity="0.35">
          <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3.7s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- ==================== SPECTRUM STRIP (below eclipse) ==================== -->
  <g transform="translate(50 170)">
    <!-- Frame -->
    <rect x="0" y="0" width="250" height="14" fill="url(#spectrum)" rx="1.5"/>
    <rect x="0" y="0" width="250" height="14" fill="none" stroke="#2a2f3d" stroke-width="0.6" rx="1.5"/>

    <!-- Fraunhofer marker lines (thin darker verticals) -->
    <g stroke="#0d1117" stroke-width="0.4" opacity="0.55">
      <line x1="42"  y1="0" x2="42"  y2="14"/>
      <line x1="88"  y1="0" x2="88"  y2="14"/>
      <line x1="120" y1="0" x2="120" y2="14"/>
      <line x1="175" y1="0" x2="175" y2="14"/>
      <line x1="210" y1="0" x2="210" y2="14"/>
    </g>

    <!-- The D3 helium line — bright yellow marker with glow -->
    <line x1="158" y1="-4" x2="158" y2="18" stroke="#fff2a8" stroke-width="2.2">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.9s" repeatCount="indefinite"/>
    </line>
    <line x1="158" y1="-4" x2="158" y2="18" stroke="#fff7d6" stroke-width="4.5" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="2.9s" repeatCount="indefinite"/>
    </line>

    <!-- Pointer up to the D3 label -->
    <line x1="158" y1="-4" x2="158" y2="-11" stroke="#fff2a8" stroke-width="0.8" opacity="0.9"/>
    <text x="158" y="-14" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="7.5" font-weight="700" fill="#ffe14a" letter-spacing="0.6">D3 · 587.49 nm</text>

    <!-- Spectrum caption -->
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.5" fill="#8a94a8" letter-spacing="0.8">SOLAR SPECTRUM · CHROMOSPHERE</text>
    <text x="250" y="26" text-anchor="end"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.5" fill="#8a94a8" letter-spacing="0.8">He</text>
  </g>

  <!-- ==================== TEXT PANEL (RIGHT) ==================== -->
  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 18, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#ffd166">HELIUM</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;158 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;&#160;·&#160;&#160;SINCE 1868</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffb84d" letter-spacing="1" opacity="0.95">
    JANSSEN · LOCKYER · GUNTUR, INDIA
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7fd4b8" letter-spacing="1" opacity="0.9">
    He · Z = 2 · SUN&#8217;S GIFT
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;the first element discovered off-Earth.&#8221;
  </text>
</svg>
