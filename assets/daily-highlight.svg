<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Freddie Mercury — 80th Birthday (September 5, 1946) -->
<!-- about:
Farrokh Bulsara was born on 5 September 1946 in Stori Town, Zanzibar, then a British protectorate off the coast of Tanganyika, and would have turned eighty today. He learned piano at a boarding school outside Bombay, took the name Freddie in his teens, and in 1970 in London persuaded a college-band guitarist named Brian May and a drummer named Roger Taylor that they should keep going and call themselves Queen. Everything after — the four-octave range, the yellow military jacket, the piano intro that walks into an operatic middle-eight and out into hard rock in six minutes flat, the Live Aid twenty minutes that people still argue was the greatest live performance ever given — sits downstream of a shy boy who called himself Farrokh and could not stop practising scales. He died in 1991 at forty-five. The catalogue and the stagecraft outlived him by a lot; today's doodle marks the birthday of the person, not the mourning of the loss.

The left half is a stage at showtime: a warm circular spotlight falls from above onto a slim silver microphone on its stand at centre, a five-pointed gold crown floats and gently breathes above the mic, an audio-level meter pulses at the base, small gold sparkles drift through the beam, and a strip of piano keys — the Bohemian Rhapsody instrument — runs along the footlights with a single key struck now and then. On the right, a large cream SEPTEMBER 5, 2026 headline anchors a gold FREDDIE MERCURY · 80 YEARS subhead, an italic amber ZANZIBAR · QUEEN · BOHEMIAN RHAPSODY · 1946 tertiary, a dim slate MERCURY · MAY · DEACON · TAYLOR roster, and a Georgia-italic 'is this the real life?' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 5, 2026 — the 80th birthday of Freddie Mercury, born September 5, 1946 in Zanzibar. On the left half, a dark stage at showtime: a warm circular spotlight from above falls onto a slim silver microphone on a stand at centre, a five-pointed gold crown floats and gently breathes above the mic, an audio-level meter of vertical bars pulses at the base, small gold sparkles drift through the light beam, and a strip of piano keys runs along the footlights with keys occasionally lighting up. On the right, a huge cream SEPTEMBER 5, 2026 headline underlined by a gold-to-cream sweep, a gold FREDDIE MERCURY · 80 YEARS subhead trailed by cream · SINCE 1946, an italic amber ZANZIBAR · QUEEN · BOHEMIAN RHAPSODY · 1946 tertiary, a dim slate MERCURY · MAY · DEACON · TAYLOR roster, and a Georgia-italic 'is this the real life?' caption at the base.">
  <defs>
    <!-- Stage backdrop: deep velvet, warm dark -->
    <radialGradient id="stageBg" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0%"   stop-color="#3a1418"/>
      <stop offset="55%"  stop-color="#1c0a0c"/>
      <stop offset="100%" stop-color="#0d0506"/>
    </radialGradient>

    <!-- Spotlight cone: warm cream, fades to nothing -->
    <radialGradient id="spotG" cx="0.5" cy="0.15" r="0.7">
      <stop offset="0%"   stop-color="#fff2c0" stop-opacity="0.85"/>
      <stop offset="35%"  stop-color="#f4d878" stop-opacity="0.35"/>
      <stop offset="75%"  stop-color="#c48a20" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3a1418" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold crown gradient -->
    <linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff2a8"/>
      <stop offset="45%"  stop-color="#f4c430"/>
      <stop offset="100%" stop-color="#a07010"/>
    </linearGradient>

    <!-- Ruby jewel -->
    <radialGradient id="rubyG" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#ff9098"/>
      <stop offset="55%"  stop-color="#d94550"/>
      <stop offset="100%" stop-color="#5a0a12"/>
    </radialGradient>

    <!-- Mic head grille -->
    <radialGradient id="micHeadG" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%"   stop-color="#f0f0f4"/>
      <stop offset="55%"  stop-color="#a8a8b0"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </radialGradient>

    <!-- Underline sweep (gold to cream) -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f4c430" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#f4c430" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#d94550" stop-opacity="0.9"/>
      <stop offset="85%"  stop-color="#f4e6c8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#f4c430" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="leftPanel">
      <rect x="0" y="0" width="360" height="200"/>
    </clipPath>
  </defs>

  <!-- ============ LEFT PANEL: STAGE ============ -->
  <g clip-path="url(#leftPanel)">
    <!-- Velvet stage backdrop -->
    <rect x="0" y="0" width="360" height="200" fill="url(#stageBg)"/>

    <!-- Curtain hint: soft vertical velvet stripes on far edges -->
    <g opacity="0.35" fill="#4a1820">
      <rect x="0"   y="0" width="6" height="200"/>
      <rect x="10"  y="0" width="3" height="200"/>
      <rect x="18"  y="0" width="4" height="200"/>
      <rect x="26"  y="0" width="2" height="200"/>
      <rect x="342" y="0" width="6" height="200"/>
      <rect x="336" y="0" width="3" height="200"/>
      <rect x="330" y="0" width="4" height="200"/>
      <rect x="326" y="0" width="2" height="200"/>
    </g>

    <!-- Spotlight cone (elliptical wash) -->
    <ellipse cx="180" cy="30" rx="160" ry="180" fill="url(#spotG)">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="-8 0; 8 0; -8 0" dur="13s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Soft floor pool below mic -->
    <ellipse cx="180" cy="168" rx="90" ry="10" fill="#f4c430" opacity="0.14"/>

    <!-- ============ FLOATING GOLD CROWN ============ -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0 0; 0 -3; 0 0" dur="7s" repeatCount="indefinite"
                        keyTimes="0;0.5;1"/>
      <!-- Crown band -->
      <rect x="155" y="48" width="50" height="7" rx="1.5" fill="url(#goldG)" stroke="#8a5a08" stroke-width="0.5"/>
      <!-- Five points -->
      <polygon points="155,48 162,30 169,48" fill="url(#goldG)" stroke="#8a5a08" stroke-width="0.5"/>
      <polygon points="169,48 176.5,22 184,48" fill="url(#goldG)" stroke="#8a5a08" stroke-width="0.5"/>
      <polygon points="184,48 191,18 198,48" fill="url(#goldG)" stroke="#8a5a08" stroke-width="0.5"/>
      <!-- outer points -->
      <polygon points="141,48 148,32 155,48" fill="url(#goldG)" stroke="#8a5a08" stroke-width="0.5"/>
      <polygon points="205,48 212,32 219,48" fill="url(#goldG)" stroke="#8a5a08" stroke-width="0.5"/>
      <!-- Ruby jewels at point tips -->
      <circle cx="162" cy="30" r="2.4" fill="url(#rubyG)"/>
      <circle cx="176.5" cy="22" r="2.6" fill="url(#rubyG)"/>
      <circle cx="191" cy="18" r="2.8" fill="url(#rubyG)"/>
      <circle cx="148" cy="32" r="2.2" fill="url(#rubyG)"/>
      <circle cx="212" cy="32" r="2.2" fill="url(#rubyG)"/>
      <!-- Center inset diamond -->
      <polygon points="180,50 184,53 180,56 176,53" fill="#fff2a8"/>
      <!-- Highlight sheen on band -->
      <rect x="156" y="49" width="48" height="1.4" fill="#fff6c8" opacity="0.7">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ============ MICROPHONE ============ -->
    <!-- Stand base -->
    <polygon points="160,168 200,168 195,172 165,172" fill="#3a3a42" stroke="#8a8a95" stroke-width="0.5"/>
    <rect x="167" y="172" width="26" height="2" fill="#22222a"/>
    <!-- Stand rod -->
    <rect x="178.5" y="100" width="3" height="68" fill="#7a7a85"/>
    <rect x="179" y="100" width="1" height="68" fill="#c8c8d0" opacity="0.85"/>
    <!-- Boom clamp -->
    <rect x="176" y="98" width="8" height="4" rx="1.5" fill="#5a5a65"/>
    <!-- Mic head (oval) -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                        values="-3 180 96; 3 180 96; -3 180 96" dur="11s" repeatCount="indefinite"/>
      <ellipse cx="180" cy="86" rx="14" ry="18" fill="url(#micHeadG)" stroke="#22222a" stroke-width="0.8"/>
      <!-- Grille cross-hatch -->
      <g stroke="#22222a" stroke-width="0.4" opacity="0.55" fill="none">
        <line x1="168" y1="76" x2="192" y2="76"/>
        <line x1="167" y1="82" x2="193" y2="82"/>
        <line x1="167" y1="88" x2="193" y2="88"/>
        <line x1="167" y1="94" x2="193" y2="94"/>
        <line x1="168" y1="100" x2="192" y2="100"/>
        <line x1="173" y1="70" x2="173" y2="103"/>
        <line x1="180" y1="68" x2="180" y2="105"/>
        <line x1="187" y1="70" x2="187" y2="103"/>
      </g>
      <!-- Mic collar -->
      <rect x="176" y="103" width="8" height="4" rx="1" fill="#5a5a65"/>
      <!-- Small red LED "live" light -->
      <circle cx="180" cy="105" r="1.1" fill="#ff4030">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ AUDIO METER BARS AT BASE ============ -->
    <g>
      <!-- Bars grouped: 7 vertical bars, pulsing on different durations -->
      <rect x="112" y="150" width="4" height="14" fill="#34c860" opacity="0.9">
        <animate attributeName="height" values="4;16;8;20;6;14;4" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="160;148;156;144;158;150;160" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="120" y="146" width="4" height="18" fill="#34c860" opacity="0.9">
        <animate attributeName="height" values="8;22;10;18;6;16;8" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="156;142;154;146;158;148;156" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="128" y="140" width="4" height="24" fill="#f4c430" opacity="0.95">
        <animate attributeName="height" values="14;28;16;24;10;22;14" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="150;136;148;140;154;142;150" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="136" y="134" width="4" height="30" fill="#f4c430" opacity="0.95">
        <animate attributeName="height" values="18;32;22;28;12;30;18" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="146;132;142;136;152;134;146" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <!-- right side -->
      <rect x="224" y="134" width="4" height="30" fill="#f4c430" opacity="0.95">
        <animate attributeName="height" values="20;30;16;28;10;24;20" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="144;134;148;136;154;140;144" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="232" y="140" width="4" height="24" fill="#f4c430" opacity="0.95">
        <animate attributeName="height" values="14;26;16;22;10;20;14" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="150;138;148;142;154;144;150" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="240" y="146" width="4" height="18" fill="#34c860" opacity="0.9">
        <animate attributeName="height" values="8;20;10;16;6;14;8" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="156;144;154;148;158;150;156" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="248" y="150" width="4" height="14" fill="#34c860" opacity="0.9">
        <animate attributeName="height" values="4;14;8;18;6;12;4" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="160;150;156;146;158;152;160" dur="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ============ PIANO KEYS STRIP (footlights) ============ -->
    <g>
      <!-- White keys row -->
      <g fill="#f4e6c8" stroke="#5a3010" stroke-width="0.4">
        <rect x="18"  y="176" width="20" height="22"/>
        <rect x="38"  y="176" width="20" height="22"/>
        <rect x="58"  y="176" width="20" height="22"/>
        <rect x="78"  y="176" width="20" height="22"/>
        <rect x="98"  y="176" width="20" height="22"/>
        <rect x="118" y="176" width="20" height="22"/>
        <rect x="138" y="176" width="20" height="22"/>
        <rect x="158" y="176" width="20" height="22"/>
        <rect x="178" y="176" width="20" height="22"/>
        <rect x="198" y="176" width="20" height="22"/>
        <rect x="218" y="176" width="20" height="22"/>
        <rect x="238" y="176" width="20" height="22"/>
        <rect x="258" y="176" width="20" height="22"/>
        <rect x="278" y="176" width="20" height="22"/>
        <rect x="298" y="176" width="20" height="22"/>
        <rect x="318" y="176" width="20" height="22"/>
      </g>
      <!-- Black keys (irregular Bb Db Eb pattern) -->
      <g fill="#1a1210">
        <rect x="32"  y="176" width="12" height="14"/>
        <rect x="52"  y="176" width="12" height="14"/>
        <rect x="92"  y="176" width="12" height="14"/>
        <rect x="112" y="176" width="12" height="14"/>
        <rect x="132" y="176" width="12" height="14"/>
        <rect x="172" y="176" width="12" height="14"/>
        <rect x="192" y="176" width="12" height="14"/>
        <rect x="232" y="176" width="12" height="14"/>
        <rect x="252" y="176" width="12" height="14"/>
        <rect x="272" y="176" width="12" height="14"/>
        <rect x="312" y="176" width="12" height="14"/>
        <rect x="332" y="176" width="12" height="14"/>
      </g>
      <!-- Key strike highlights: certain keys light up in sequence -->
      <rect x="78" y="176" width="20" height="22" fill="#f4c430" opacity="0">
        <animate attributeName="opacity" values="0;0.75;0;0;0;0;0;0" keyTimes="0;0.05;0.15;0.3;0.5;0.7;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="158" y="176" width="20" height="22" fill="#f4c430" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.75;0;0;0;0" keyTimes="0;0.2;0.3;0.35;0.45;0.6;0.8;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="218" y="176" width="20" height="22" fill="#f4c430" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0;0.75;0;0" keyTimes="0;0.2;0.4;0.5;0.55;0.6;0.7;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="278" y="176" width="20" height="22" fill="#f4c430" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0;0;0.75;0" keyTimes="0;0.2;0.4;0.55;0.65;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ============ FLOATING SPARKLES & MUSIC NOTES ============ -->
    <g fill="#f4c430" opacity="0.9">
      <circle r="1.2">
        <animateMotion dur="9s" repeatCount="indefinite"
                       path="M 210 90 Q 240 60 260 30"/>
        <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.4;1" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="1" fill="#fff2a8">
        <animateMotion dur="11s" begin="1.5s" repeatCount="indefinite"
                       path="M 150 90 Q 120 60 100 30"/>
        <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.4;1" dur="11s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="0.9" fill="#d94550">
        <animateMotion dur="7s" begin="3s" repeatCount="indefinite"
                       path="M 180 80 Q 200 55 230 45"/>
        <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.4;1" dur="7s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="0.9" fill="#fff2a8">
        <animateMotion dur="13s" begin="2s" repeatCount="indefinite"
                       path="M 180 80 Q 155 50 130 40"/>
        <animate attributeName="opacity" values="0;0.95;0" keyTimes="0;0.4;1" dur="13s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <!-- Music note (eighth) rising from mic -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; 20 -50; 40 -80" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.3;1" dur="8s" repeatCount="indefinite"/>
        <ellipse cx="205" cy="70" rx="3" ry="2.2" fill="#f4c430" transform="rotate(-20 205 70)"/>
        <rect x="207.3" y="60" width="0.9" height="10" fill="#f4c430"/>
      </g>
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
                          values="0 0; -18 -45; -35 -75" dur="10s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.3;1" dur="10s" begin="2.5s" repeatCount="indefinite"/>
        <ellipse cx="155" cy="70" rx="3" ry="2.2" fill="#fff2a8" transform="rotate(20 155 70)"/>
        <rect x="157" y="60" width="0.9" height="10" fill="#fff2a8"/>
      </g>
    </g>

    <!-- Stage floor line (subtle) -->
    <line x1="0" y1="175" x2="360" y2="175" stroke="#8a4020" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Seam -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ============ RIGHT TEXT PANEL ============ -->
  <rect x="360" y="0" width="440" height="200" fill="#0d1117"/>

  <!-- Right-edge accent bars (Queen palette: gold, red, cream) -->
  <rect x="792" y="20" width="4" height="50" fill="#f4c430" opacity="0.9"/>
  <rect x="792" y="72" width="4" height="50" fill="#d94550" opacity="0.9"/>
  <rect x="792" y="124" width="4" height="56" fill="#f4e6c8" opacity="0.75"/>

  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f4e6c8" letter-spacing="1">
    SEPTEMBER 5, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#f4c430">FREDDIE MERCURY</tspan><tspan fill="#f4e6c8" opacity="0.8">&#160;·&#160;80 YEARS</tspan><tspan fill="#f4e6c8" opacity="0.55">&#160;·&#160;SINCE 1946</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffbf5a" letter-spacing="1" opacity="0.95">
    ZANZIBAR &#183; QUEEN &#183; BOHEMIAN RHAPSODY &#183; 1946
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#a89686" letter-spacing="1" opacity="0.85">
    MERCURY &#183; MAY &#183; DEACON &#183; TAYLOR
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" font-style="italic" fill="#f4e6c8" opacity="0.9">
    &#8220;is this the real life?&#8221;
  </text>
</svg>
