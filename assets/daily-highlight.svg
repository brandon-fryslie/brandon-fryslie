<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Rolling Stones first concert (July 12, 1962) — 64th anniversary of the band's debut gig at the Marquee Club, 165 Oxford Street, London. A smoky basement club tableau: warm amber-and-magenta stage lights sweeping across a low wooden stage, three silhouetted band members (guitar, bass, singer at mic), a drum kit riser at rear, a MARQUEE neon sign flickering above the stage, floating cigarette smoke curls, a checkered dance floor foreground, musical notes drifting upward, colored par-can beams pulsing, a large cream JULY 12, 2026 headline dominating the upper center, a crimson-cream THE ROLLING STONES · 64 YEARS · FIRST SHOW subhead beneath, and italic MARQUEE CLUB · 165 OXFORD STREET · LONDON · JULY 12, 1962 tertiary along the bottom edge. Palette: club-night black #0d1117, deep club red #4a0e14 and #7a0a1c, amber stage light #ff9633 and #ffb85c, magenta wash #d94a8a and #ff2f8f, cream text #f5eede, neon marquee #ff2f5a and #ffd0dc, smoke #b8b8c8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 12, 2026 — 64th anniversary of the Rolling Stones' first concert at the Marquee Club in London on July 12, 1962. A smoky basement club tableau with sweeping amber and magenta stage lights, silhouetted band members with guitars at a low wooden stage, a flickering MARQUEE neon sign, cigarette smoke curls, a checkered dance floor, floating musical notes, a large cream JULY 12, 2026 headline, a crimson THE ROLLING STONES · 64 YEARS · FIRST SHOW subhead, and italic MARQUEE CLUB · 165 OXFORD STREET · LONDON · JULY 12, 1962 tertiary along the bottom.">
  <defs>
    <!-- Club backdrop: deep red velvet fading to black -->
    <radialGradient id="club-bg" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#4a0e14"/>
      <stop offset="55%" stop-color="#1a0508"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <!-- Amber spotlight cone -->
    <radialGradient id="spot-amber" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ffb85c" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ff9633" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9633" stop-opacity="0"/>
    </radialGradient>

    <!-- Magenta wash spotlight -->
    <radialGradient id="spot-magenta" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ff2f8f" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#d94a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>

    <!-- Smoke haze -->
    <linearGradient id="smoke-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b8b8c8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b8b8c8" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon marquee red glow -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft text glow for the headline -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Smoke turbulence for drifting curl -->
    <filter id="smoke-turb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="8"/>
    </filter>

    <!-- Checker floor pattern -->
    <pattern id="checker" x="0" y="0" width="24" height="12" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)">
      <rect width="12" height="12" fill="#1a0508"/>
      <rect x="12" width="12" height="12" fill="#2a0a12"/>
    </pattern>

    <!-- Musical note path -->
    <symbol id="note" viewBox="0 0 12 16" overflow="visible">
      <ellipse cx="4" cy="13" rx="3.4" ry="2.4" fill="currentColor"/>
      <rect x="7" y="1" width="1.5" height="12" fill="currentColor"/>
      <path d="M8.5 1 Q13 3 12 8 Q11 5 8.5 5 Z" fill="currentColor"/>
    </symbol>

    <!-- Eighth-note pair -->
    <symbol id="note8" viewBox="0 0 20 16" overflow="visible">
      <ellipse cx="3" cy="13" rx="3" ry="2.2" fill="currentColor"/>
      <ellipse cx="15" cy="13" rx="3" ry="2.2" fill="currentColor"/>
      <rect x="5.5" y="1" width="1.4" height="12" fill="currentColor"/>
      <rect x="17.5" y="1" width="1.4" height="12" fill="currentColor"/>
      <path d="M6 1 L18 2 L18 5 L6 4 Z" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- 1. Deep club backdrop -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#club-bg)"/>

  <!-- 2. Sweeping spotlight cones from the ceiling -->
  <g opacity="0.75">
    <!-- Amber cone left -->
    <g transform-origin="220 0">
      <polygon points="220,0 90,200 350,200" fill="url(#spot-amber)">
        <animateTransform attributeName="transform" type="rotate" from="-8 220 0" to="6 220 0" dur="11s" repeatCount="indefinite" additive="sum"/>
      </polygon>
    </g>
    <!-- Magenta cone right -->
    <g transform-origin="580 0">
      <polygon points="580,0 450,200 720,200" fill="url(#spot-magenta)">
        <animateTransform attributeName="transform" type="rotate" from="8 580 0" to="-6 580 0" dur="13s" repeatCount="indefinite" additive="sum"/>
      </polygon>
    </g>
    <!-- Center pale wash pulsing -->
    <polygon points="400,10 320,200 480,200" fill="url(#spot-amber)" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="7s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- 3. Back wall drapery hint -->
  <g opacity="0.45">
    <path d="M0 60 Q80 75 160 60 Q240 75 320 60 Q400 75 480 60 Q560 75 640 60 Q720 75 800 60 L800 100 L0 100 Z" fill="#2a0508"/>
  </g>

  <!-- 4. MARQUEE neon sign (upper area) -->
  <g transform="translate(400 34)" filter="url(#neon-glow)">
    <rect x="-88" y="-14" width="176" height="28" fill="none" stroke="#ff2f5a" stroke-width="1.6" rx="3">
      <animate attributeName="stroke-opacity" values="1;0.55;1;0.85;1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="6" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="18" font-weight="900" letter-spacing="6" fill="#ffd0dc">
      MARQUEE
      <animate attributeName="fill" values="#ffd0dc;#ff5a7a;#ffd0dc;#ff2f5a;#ffd0dc" dur="7s" repeatCount="indefinite"/>
    </text>
    <!-- little bulbs on the corners -->
    <circle cx="-92" cy="-14" r="2.2" fill="#ffd0dc"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="-14" r="2.2" fill="#ffd0dc"><animate attributeName="opacity" values="1;0.4;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="-92" cy="14" r="2.2" fill="#ffd0dc"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="92" cy="14" r="2.2" fill="#ffd0dc"><animate attributeName="opacity" values="1;0.5;1" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 5. Stage platform -->
  <g>
    <rect x="120" y="150" width="560" height="14" fill="#1a0508"/>
    <rect x="120" y="150" width="560" height="3" fill="#3a1418"/>
    <line x1="120" y1="164" x2="680" y2="164" stroke="#ff2f5a" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 6. Checkered dance floor foreground -->
  <polygon points="0,200 800,200 700,164 100,164" fill="url(#checker)" opacity="0.85"/>
  <polygon points="0,200 800,200 700,164 100,164" fill="url(#spot-amber)" opacity="0.15"/>

  <!-- 7. Drum riser at rear center -->
  <g transform="translate(400 132)">
    <ellipse cx="0" cy="18" rx="30" ry="6" fill="#0a0306"/>
    <circle cx="0" cy="5" r="18" fill="#1a0508" stroke="#ff9633" stroke-width="1.2"/>
    <circle cx="0" cy="5" r="14" fill="#2a0a10"/>
    <text x="0" y="9" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="7" font-weight="900" letter-spacing="1.5" fill="#ffb85c">STONES</text>
    <!-- cymbals -->
    <ellipse cx="-24" cy="-2" rx="8" ry="2" fill="#ffb85c" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="2.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="24" cy="-2" rx="8" ry="2" fill="#ffb85c" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" values="4;-4;4" dur="2.1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 8. Band silhouettes on the stage -->
  <!-- Left: guitarist, leaning -->
  <g transform="translate(285 150)">
    <!-- head -->
    <circle cx="0" cy="-42" r="7" fill="#050205"/>
    <!-- torso -->
    <path d="M-6 -35 L-10 -12 L-4 0 L4 0 L10 -12 L6 -35 Z" fill="#050205"/>
    <!-- guitar body -->
    <ellipse cx="12" cy="-14" rx="10" ry="7" fill="#2a0508" stroke="#ff9633" stroke-width="0.8" transform="rotate(-18 12 -14)"/>
    <!-- neck -->
    <rect x="-22" y="-30" width="34" height="2.5" fill="#3a1a08" transform="rotate(-18 -22 -30)"/>
    <!-- arm strumming -->
    <line x1="4" y1="-24" x2="14" y2="-10" stroke="#050205" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y2" values="-10;-6;-12;-10" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <!-- subtle sway -->
    <animateTransform attributeName="transform" type="translate" values="285,150; 286,150; 285,150; 284,150; 285,150" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Center: singer at mic -->
  <g transform="translate(400 150)">
    <!-- mic stand -->
    <line x1="-14" y1="-2" x2="-14" y2="-46" stroke="#3a3a45" stroke-width="1.6"/>
    <circle cx="-14" cy="-48" r="3.5" fill="#8a8a95"/>
    <!-- head with tousled hair -->
    <path d="M-4 -50 Q0 -60 8 -55 Q10 -48 5 -44 Z" fill="#050205"/>
    <circle cx="2" cy="-46" r="6.5" fill="#050205"/>
    <!-- torso -->
    <path d="M-3 -40 L-8 -12 L-2 0 L8 0 L12 -12 L7 -40 Z" fill="#050205"/>
    <!-- arm reaching mic -->
    <line x1="-1" y1="-38" x2="-12" y2="-46" stroke="#050205" stroke-width="3" stroke-linecap="round"/>
    <!-- other arm out -->
    <line x1="4" y1="-38" x2="18" y2="-30" stroke="#050205" stroke-width="3" stroke-linecap="round">
      <animate attributeName="x2" values="18;22;16;18" dur="1.3s" repeatCount="indefinite"/>
    </line>
    <animateTransform attributeName="transform" type="translate" values="400,150; 400,148; 400,150; 400,152; 400,150" dur="1.1s" repeatCount="indefinite"/>
  </g>

  <!-- Right: bass player -->
  <g transform="translate(515 150)">
    <circle cx="0" cy="-42" r="7" fill="#050205"/>
    <path d="M-6 -35 L-10 -12 L-4 0 L4 0 L10 -12 L6 -35 Z" fill="#050205"/>
    <!-- bass -->
    <ellipse cx="-12" cy="-14" rx="10" ry="6" fill="#2a0508" stroke="#d94a8a" stroke-width="0.8" transform="rotate(18 -12 -14)"/>
    <rect x="-8" y="-30" width="34" height="2.2" fill="#3a1a08" transform="rotate(18 -8 -30)"/>
    <line x1="-4" y1="-24" x2="-14" y2="-10" stroke="#050205" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y2" values="-10;-14;-8;-10" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <animateTransform attributeName="transform" type="translate" values="515,150; 514,150; 515,150; 516,150; 515,150" dur="3.7s" repeatCount="indefinite"/>
  </g>

  <!-- 9. Cigarette smoke curls -->
  <g opacity="0.55" filter="url(#smoke-turb)">
    <path d="M170 165 Q160 130 170 100 Q180 75 168 55" fill="none" stroke="url(#smoke-grad)" stroke-width="10" stroke-linecap="round">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M640 165 Q650 130 638 100 Q628 75 642 55" fill="none" stroke="url(#smoke-grad)" stroke-width="10" stroke-linecap="round">
      <animate attributeName="opacity" values="0.55;0.15;0.55" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 10. Floating musical notes rising -->
  <g color="#ffb85c" opacity="0.9">
    <use href="#note" x="0" y="0" width="14" height="18">
      <animateTransform attributeName="transform" type="translate" from="230 160" to="230 20" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/>
    </use>
    <use href="#note8" x="0" y="0" width="22" height="18">
      <animateTransform attributeName="transform" type="translate" from="470 160" to="470 10" dur="13s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="-4s" repeatCount="indefinite"/>
    </use>
    <use href="#note" x="0" y="0" width="12" height="16">
      <animateTransform attributeName="transform" type="translate" from="600 160" to="600 15" dur="7s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" begin="-2s" repeatCount="indefinite"/>
    </use>
    <use href="#note8" x="0" y="0" width="20" height="16" color="#ff2f8f">
      <animateTransform attributeName="transform" type="translate" from="130 160" to="130 15" dur="13s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="-7s" repeatCount="indefinite"/>
    </use>
    <use href="#note" x="0" y="0" width="12" height="16" color="#ffd0dc">
      <animateTransform attributeName="transform" type="translate" from="705 160" to="705 20" dur="11s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="-5s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 11. Strobing rim of stage lights -->
  <g>
    <circle cx="180" cy="70" r="4" fill="#ff9633"><animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="60" r="4" fill="#ff2f8f"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="60" r="4" fill="#ff2f8f"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="70" r="4" fill="#ff9633"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 12. Main date headline — dominant, high contrast -->
  <g filter="url(#soft-glow)">
    <text x="400" y="105" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="46" font-weight="900" letter-spacing="3" fill="#f5eede">
      JULY 12, 2026
    </text>
  </g>

  <!-- 13. Subhead in crimson-cream -->
  <text x="400" y="128" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="800" letter-spacing="4.5" fill="#ff5a7a">
    THE ROLLING STONES · 64 YEARS · FIRST SHOW
  </text>

  <!-- 14. Tertiary italic caption along the bottom -->
  <text x="400" y="192" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="9" font-style="italic" font-weight="600" letter-spacing="2.2" fill="#ffd0dc" opacity="0.92">
    MARQUEE CLUB · 165 OXFORD STREET · LONDON · JULY 12, 1962
  </text>
</svg>
