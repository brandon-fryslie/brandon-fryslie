<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: General Relativity — 111th Anniversary (November 25, 1915) -->
<!-- about:
On Thursday, 25 November 1915, Albert Einstein stood before the Prussian Academy of Sciences in Berlin and read out the final form of the field equations of general relativity. For eight years he had been chasing a theory in which gravity was not a force but a geometry — spacetime itself, curved by mass and energy. A month of furious competition with the mathematician David Hilbert had culminated in four lectures over four Thursdays in November. The equation he wrote on the board that morning — Rμν − ½gμνR + Λgμν = 8πG⁄c⁴ · Tμν — tied every particle in the universe to the shape of the space it was moving through. Four years later, Eddington's eclipse expedition measured starlight bending around the sun and the geometry was confirmed. One hundred and eleven years later, every GPS fix, every gravitational-wave chirp, every black-hole photograph is still working in the arithmetic Einstein handed in that day.

The scene is a warped grid of spacetime. On the left, a cream mesh sags toward a glowing mass at its centre, geodesic lines bending inward; a photon traces a curved path around the well while small stars drift in the background. On the right, a cream NOVEMBER 25, 2026 headline sits over a double cream-and-amber bar, a cream GENERAL RELATIVITY · 111 YEARS subhead, an italic amber ALBERT EINSTEIN · BERLIN · 1915 tertiary, a dim CURVATURE · GEODESIC · LIGHT · TIME · MASS roster, and the field equation itself in italics at the base: Rμν − ½gμνR + Λgμν = 8πG⁄c⁴ · Tμν.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for November 25, 2026 — 111th anniversary of Einstein's presentation of the field equations of general relativity to the Prussian Academy on November 25, 1915. On the left, a warped grid of spacetime sags toward a glowing mass at its centre, with a photon's curved path and small stars in the background. On the right, a cream NOVEMBER 25, 2026 headline sits over a double cream-and-amber bar, a cream GENERAL RELATIVITY · 111 YEARS subhead, an italic amber ALBERT EINSTEIN · BERLIN · 1915 tertiary, a dim CURVATURE · GEODESIC · LIGHT · TIME · MASS roster, and the field equation Rμν − ½gμνR + Λgμν = 8πG⁄c⁴ Tμν at the base.">
  <defs>
    <!-- Deep space backdrop -->
    <radialGradient id="bg" cx="0.32" cy="0.55" r="0.9">
      <stop offset="0"   stop-color="#141c2c"/>
      <stop offset="0.6" stop-color="#0d1320"/>
      <stop offset="1"   stop-color="#060912"/>
    </radialGradient>

    <!-- The central mass — a glowing warm orb -->
    <radialGradient id="mass" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#fff2c4"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="0.75" stop-color="#8a3a10"/>
      <stop offset="1"    stop-color="#2a0f04" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo around the mass -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.20"/>
      <stop offset="1"   stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>

    <!-- The photon particle -->
    <radialGradient id="photon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffeaa0"/>
      <stop offset="1"   stop-color="#ffeaa0" stop-opacity="0"/>
    </radialGradient>

    <!-- The photon's curving geodesic path (open curve) -->
    <path id="photonPath"
          d="M 22 150 Q 90 135 140 110 Q 185 90 180 60 Q 175 40 210 30 Q 260 24 340 22"
          fill="none"/>
  </defs>

  <style>
    .headline  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: 1.5px; }
    .sub       { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 2.4px; }
    .tert      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 1.8px; font-style: italic; }
    .roster    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 2.6px; }
    .caption   { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
    .mono      { font-family: 'Cambria Math', 'STIX Two Math', Georgia, 'Times New Roman', serif; font-style: italic; }
    .stamp     { font-family: 'Courier New', Courier, monospace; letter-spacing: 1px; }

    /* Grid lines pulse subtly so the fabric feels alive */
    @keyframes gridPulse { 0%,100% { opacity: 0.42; } 50% { opacity: 0.58; } }
    .grid { stroke: #7d93b4; fill: none; stroke-width: 0.5; animation: gridPulse 13s ease-in-out infinite; }

    /* Mass gently breathes */
    @keyframes massPulse { 0%,100% { opacity: 0.92; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .massCore { animation: massPulse 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    @keyframes haloPulse { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.12); } }
    .massHalo { animation: haloPulse 11s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    /* Twinkling stars */
    @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.95; } }
    .star-a { animation: twinkle 7s  ease-in-out infinite; }
    .star-b { animation: twinkle 11s ease-in-out 1.3s infinite; }
    .star-c { animation: twinkle 13s ease-in-out 2.7s infinite; }
    .star-d { animation: twinkle 7s  ease-in-out 3.1s infinite; }
    .star-e { animation: twinkle 11s ease-in-out 4.5s infinite; }
    .star-f { animation: twinkle 13s ease-in-out 0.6s infinite; }

    /* Text pulses */
    @keyframes softPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.85; } }
    .fade-1 { animation: softPulse 13s ease-in-out infinite; }
    .fade-2 { animation: softPulse 13s ease-in-out 0.4s infinite; }
    .fade-3 { animation: softPulse 13s ease-in-out 0.8s infinite; }
    .fade-4 { animation: softPulse 13s ease-in-out 1.2s infinite; }
    .fade-5 { animation: softPulse 13s ease-in-out 1.6s infinite; }
    .fade-6 { animation: softPulse 13s ease-in-out 2.0s infinite; }

    /* Bar slide */
    @keyframes barDraw { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
    .bar { transform-origin: left center; transform-box: fill-box; animation: barDraw 1.4s cubic-bezier(.3,.9,.2,1) 0.4s both; }

    /* Caption glimmer */
    @keyframes capGlim { 0%,100% { opacity: 0.82; } 50% { opacity: 1; } }
    .cap { animation: capGlim 13s ease-in-out infinite; }

    /* The photon's faint trail pulse */
    @keyframes trailPulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.65; } }
    .trail { animation: trailPulse 7s ease-in-out infinite; }
  </style>

  <!-- Backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Background star field -->
  <g fill="#e8eef9">
    <circle class="star-a" cx="60"  cy="30"  r="0.9"/>
    <circle class="star-b" cx="110" cy="18"  r="0.6"/>
    <circle class="star-c" cx="200" cy="40"  r="0.7"/>
    <circle class="star-d" cx="300" cy="22"  r="0.8"/>
    <circle class="star-e" cx="40"  cy="90"  r="0.6"/>
    <circle class="star-f" cx="320" cy="92"  r="0.7"/>
    <circle class="star-a" cx="260" cy="170" r="0.6"/>
    <circle class="star-b" cx="130" cy="180" r="0.8"/>
    <circle class="star-c" cx="20"  cy="170" r="0.7"/>
    <circle class="star-d" cx="380" cy="170" r="0.6"/>
    <circle class="star-e" cx="380" cy="50"  r="0.7"/>
    <circle class="star-f" cx="90"  cy="140" r="0.5"/>
  </g>

  <!-- ============ LEFT: SPACETIME FABRIC ============ -->
  <!-- A grid warped toward a point-mass at (195,100). Each line passes through the well
       and dips toward it. Horizontal lines use a cubic/quad to sag; vertical lines likewise.
       We clip-and-draw rather than compute on the fly. -->
  <g class="grid">
    <!-- Horizontal grid lines: sag toward (195,100) -->
    <path d="M 10 25  Q 120 25  195 36  Q 270 25  380 25"/>
    <path d="M 10 50  Q 120 50  195 65  Q 270 50  380 50"/>
    <path d="M 10 75  Q 120 75  195 93  Q 270 75  380 75"/>
    <path d="M 10 100 Q 120 100 195 100 Q 270 100 380 100"/>
    <path d="M 10 125 Q 120 125 195 107 Q 270 125 380 125"/>
    <path d="M 10 150 Q 120 150 195 135 Q 270 150 380 150"/>
    <path d="M 10 175 Q 120 175 195 164 Q 270 175 380 175"/>

    <!-- Vertical grid lines: sag toward (195,100) -->
    <path d="M 30  10  Q 30  95  45  100 Q 30  105 30  190"/>
    <path d="M 70  10  Q 70  90  90  100 Q 70  110 70  190"/>
    <path d="M 110 10  Q 110 85  135 100 Q 110 115 110 190"/>
    <path d="M 150 10  Q 150 80  180 100 Q 150 120 150 190"/>
    <path d="M 195 10  Q 195 75  195 100 Q 195 125 195 190"/>
    <path d="M 240 10  Q 240 80  210 100 Q 240 120 240 190"/>
    <path d="M 280 10  Q 280 85  255 100 Q 280 115 280 190"/>
    <path d="M 320 10  Q 320 90  300 100 Q 320 110 320 190"/>
    <path d="M 360 10  Q 360 95  345 100 Q 360 105 360 190"/>
  </g>

  <!-- The central mass + halo -->
  <g>
    <circle class="massHalo" cx="195" cy="100" r="28" fill="url(#halo)"/>
    <circle class="massCore" cx="195" cy="100" r="11" fill="url(#mass)"/>
  </g>

  <!-- Photon's curving geodesic trail (faint) -->
  <use href="#photonPath" class="trail" stroke="#ffeaa0" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.5"/>

  <!-- The travelling photon -->
  <g>
    <circle r="3.2" fill="url(#photon)">
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath href="#photonPath"/>
      </animateMotion>
    </circle>
    <!-- Small companion so the photon reads as a bright point -->
    <circle r="1.2" fill="#ffffff">
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath href="#photonPath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Micro label beside the photon path start -->
  <text x="18" y="162" font-size="6" class="stamp" fill="#8ea7c7" opacity="0.8">PHOTON</text>
  <text x="186" y="152" font-size="6" class="stamp" fill="#8ea7c7" opacity="0.8">MASS</text>

  <!-- Caption under fabric -->
  <text x="195" y="190" text-anchor="middle" font-size="6.5" class="caption" fill="#8ea7c7" opacity="0.8">Spacetime tells matter how to move; matter tells spacetime how to curve.</text>

  <!-- ============ VERTICAL SEPARATOR ============ -->
  <line x1="405" y1="30" x2="405" y2="170" stroke="#2d3748" stroke-width="0.6" opacity="0.6"/>

  <!-- ============ RIGHT TEXT COLUMN ============ -->
  <text x="425" y="60" font-size="26" class="headline fade-1" fill="#f3e6c6">NOVEMBER 25, 2026</text>

  <g transform="translate(425,70)">
    <rect class="bar" x="0" y="0" width="320" height="3" fill="#f3e6c6"/>
    <rect class="bar" x="0" y="5" width="240" height="2" fill="#e5b76a"/>
  </g>

  <text x="425" y="97" font-size="14" class="sub fade-2" fill="#f3e6c6">GENERAL RELATIVITY · 111 YEARS</text>

  <text x="425" y="117" font-size="10.5" class="tert fade-3" fill="#ffb347">ALBERT EINSTEIN · BERLIN · 1915</text>

  <text x="425" y="140" font-size="8" class="roster fade-4" fill="#7a8491">CURVATURE · GEODESIC · LIGHT · TIME · MASS</text>

  <!-- The field equation itself -->
  <text x="425" y="168" font-size="12" class="mono cap fade-5" fill="#c9d2dc">R<tspan font-size="8" dy="3">μν</tspan><tspan dy="-3"> − ½ g</tspan><tspan font-size="8" dy="3">μν</tspan><tspan dy="-3">R + Λg</tspan><tspan font-size="8" dy="3">μν</tspan><tspan dy="-3"> = (8πG⁄c⁴) T</tspan><tspan font-size="8" dy="3">μν</tspan></text>

  <!-- Stamp card: date of the lecture -->
  <g class="fade-6" transform="translate(685,30)">
    <rect x="0" y="0" width="90" height="30" fill="none" stroke="#e5b76a" stroke-opacity="0.45" stroke-width="0.6"/>
    <text x="45" y="12" font-size="6" class="stamp" fill="#ffb347" text-anchor="middle" opacity="0.85">PRUSSIAN ACADEMY</text>
    <text x="45" y="22" font-size="7.5" class="stamp" fill="#ffb347" text-anchor="middle" opacity="0.9">25 NOV 1915</text>
  </g>
</svg>
