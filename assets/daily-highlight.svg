<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: First Academy Awards 97th anniversary (May 16, 1929) — Oscar statuette, art deco sunburst, spotlights, red carpet, golden age cinema -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 16, 2026 — First Academy Awards 97th anniversary">
  <defs>
    <radialGradient id="stage" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#2a1a18"/>
      <stop offset="55%" stop-color="#160d10"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2b8"/>
      <stop offset="35%" stop-color="#ffd955"/>
      <stop offset="70%" stop-color="#c89220"/>
      <stop offset="100%" stop-color="#6b4a0d"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4a0d"/>
      <stop offset="50%" stop-color="#ffe488"/>
      <stop offset="100%" stop-color="#6b4a0d"/>
    </linearGradient>

    <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a31b25"/>
      <stop offset="60%" stop-color="#6e0a13"/>
      <stop offset="100%" stop-color="#3a0509"/>
    </linearGradient>

    <linearGradient id="spotlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8d4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff8d4" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="60%" stop-color="#ffd955" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd955" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Oscar statuette silhouette: knight figure holding crusader sword, atop a 5-spoke film reel base.
         Designed in a local coordinate space; instances scale to taste. -->
    <g id="oscar">
      <!-- base: round film-reel dais -->
      <ellipse cx="0" cy="0" rx="16" ry="3.6" fill="#3a2608"/>
      <ellipse cx="0" cy="-1.6" rx="16" ry="3.6" fill="url(#gold)"/>
      <ellipse cx="0" cy="-1.6" rx="11" ry="2.4" fill="#8a5e15" opacity="0.55"/>
      <!-- short cylindrical plinth -->
      <rect x="-9" y="-9" width="18" height="7.4" fill="url(#gold)"/>
      <rect x="-9" y="-9" width="18" height="1.6" fill="#fff2b8" opacity="0.9"/>
      <!-- legs (closed stance) -->
      <path d="M -4,-9 L -3.4,-26 L -1,-26 L -1.3,-9 Z" fill="url(#gold)"/>
      <path d="M 1.3,-9 L 1,-26 L 3.4,-26 L 4,-9 Z" fill="url(#gold)"/>
      <!-- hip / waist -->
      <path d="M -6,-26 Q -6,-30 0,-30 Q 6,-30 6,-26 L 5.2,-22 L -5.2,-22 Z" fill="url(#gold)"/>
      <!-- torso (broad shoulders tapering) -->
      <path d="M -7.4,-30 Q -8.6,-44 -6.4,-50 L 6.4,-50 Q 8.6,-44 7.4,-30 Z" fill="url(#gold)"/>
      <!-- chest highlight -->
      <path d="M -5.6,-32 Q -6.4,-42 -4.6,-48 L -2.8,-48 L -3.6,-32 Z" fill="#fff2b8" opacity="0.5"/>
      <!-- arms holding sword in front, hands clasped at sword hilt -->
      <path d="M -8.4,-44 Q -10,-40 -7,-32 L -4,-32 Q -5.4,-40 -6.4,-44 Z" fill="url(#gold)"/>
      <path d="M 8.4,-44 Q 10,-40 7,-32 L 4,-32 Q 5.4,-40 6.4,-44 Z" fill="url(#gold)"/>
      <!-- crusader sword: pommel above hands, blade pointing down through hands to feet -->
      <rect x="-1" y="-31" width="2" height="22" fill="#fff2b8"/>
      <rect x="-1" y="-31" width="2" height="22" fill="url(#goldEdge)" opacity="0.6"/>
      <!-- crossguard -->
      <rect x="-5" y="-33" width="10" height="2" fill="url(#gold)"/>
      <!-- pommel -->
      <circle cx="0" cy="-36" r="2" fill="url(#gold)"/>
      <!-- head (bald, slightly oval) -->
      <ellipse cx="0" cy="-56" rx="5.6" ry="6.4" fill="url(#gold)"/>
      <ellipse cx="-1.6" cy="-58" rx="2" ry="2.6" fill="#fff2b8" opacity="0.55"/>
      <!-- neck shadow -->
      <rect x="-2.4" y="-51" width="4.8" height="2" fill="#8a5e15" opacity="0.6"/>
    </g>
  </defs>

  <!-- stage backdrop -->
  <rect width="800" height="200" fill="url(#stage)"/>

  <!-- art deco sunburst rays radiating from the center -->
  <g transform="translate(400,118)" opacity="0.5">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="113s" repeatCount="indefinite"/>
      <g fill="url(#gold)" opacity="0.35">
        <polygon points="0,-260 6,0 -6,0"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(15)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(30)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(45)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(60)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(75)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(90)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(105)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(120)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(135)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(150)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(165)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(180)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(195)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(210)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(225)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(240)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(255)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(270)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(285)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(300)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(315)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(330)"/>
        <polygon points="0,-260 6,0 -6,0" transform="rotate(345)"/>
      </g>
    </g>
  </g>

  <!-- secondary art deco arcs (deco "fan" lines) -->
  <g transform="translate(400,200)" fill="none" stroke="url(#goldEdge)" stroke-width="0.7" opacity="0.55">
    <path d="M -360,0 A 360,180 0 0 1 360,0"/>
    <path d="M -300,0 A 300,150 0 0 1 300,0"/>
    <path d="M -240,0 A 240,120 0 0 1 240,0"/>
    <path d="M -180,0 A 180,90 0 0 1 180,0"/>
    <path d="M -120,0 A 120,60 0 0 1 120,0"/>
  </g>

  <!-- sweeping spotlights (left + right) -->
  <g opacity="0.85">
    <!-- left spotlight cone: anchored at top-left fixture, sweeps -->
    <g transform="translate(60,-8)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-22;18;-22" dur="11s" repeatCount="indefinite"/>
        <polygon points="0,0 -38,260 38,260" fill="url(#spotlight)"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="url(#bulb)"/>
    </g>
    <!-- right spotlight cone -->
    <g transform="translate(740,-8)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="22;-18;22" dur="13s" repeatCount="indefinite"/>
        <polygon points="0,0 -38,260 38,260" fill="url(#spotlight)"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="url(#bulb)"/>
    </g>
  </g>

  <!-- twinkling stars (camera flashes / hollywood sky) -->
  <g fill="#fff8d4">
    <circle cx="120" cy="32" r="1.0"><animate attributeName="opacity" values="0.1;1;0.1" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="18" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="335" cy="34" r="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="13s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="465" cy="22" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="36" r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="20" r="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- film strip border, top -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="800" height="10" fill="#1a1208"/>
    <g fill="#0d1117">
      <rect x="6" y="2.5" width="12" height="5" rx="1"/>
      <rect x="30" y="2.5" width="12" height="5" rx="1"/>
      <rect x="54" y="2.5" width="12" height="5" rx="1"/>
      <rect x="78" y="2.5" width="12" height="5" rx="1"/>
      <rect x="102" y="2.5" width="12" height="5" rx="1"/>
      <rect x="126" y="2.5" width="12" height="5" rx="1"/>
      <rect x="150" y="2.5" width="12" height="5" rx="1"/>
      <rect x="174" y="2.5" width="12" height="5" rx="1"/>
      <rect x="198" y="2.5" width="12" height="5" rx="1"/>
      <rect x="222" y="2.5" width="12" height="5" rx="1"/>
      <rect x="246" y="2.5" width="12" height="5" rx="1"/>
      <rect x="270" y="2.5" width="12" height="5" rx="1"/>
      <rect x="294" y="2.5" width="12" height="5" rx="1"/>
      <rect x="318" y="2.5" width="12" height="5" rx="1"/>
      <rect x="342" y="2.5" width="12" height="5" rx="1"/>
      <rect x="366" y="2.5" width="12" height="5" rx="1"/>
      <rect x="390" y="2.5" width="12" height="5" rx="1"/>
      <rect x="414" y="2.5" width="12" height="5" rx="1"/>
      <rect x="438" y="2.5" width="12" height="5" rx="1"/>
      <rect x="462" y="2.5" width="12" height="5" rx="1"/>
      <rect x="486" y="2.5" width="12" height="5" rx="1"/>
      <rect x="510" y="2.5" width="12" height="5" rx="1"/>
      <rect x="534" y="2.5" width="12" height="5" rx="1"/>
      <rect x="558" y="2.5" width="12" height="5" rx="1"/>
      <rect x="582" y="2.5" width="12" height="5" rx="1"/>
      <rect x="606" y="2.5" width="12" height="5" rx="1"/>
      <rect x="630" y="2.5" width="12" height="5" rx="1"/>
      <rect x="654" y="2.5" width="12" height="5" rx="1"/>
      <rect x="678" y="2.5" width="12" height="5" rx="1"/>
      <rect x="702" y="2.5" width="12" height="5" rx="1"/>
      <rect x="726" y="2.5" width="12" height="5" rx="1"/>
      <rect x="750" y="2.5" width="12" height="5" rx="1"/>
      <rect x="774" y="2.5" width="12" height="5" rx="1"/>
    </g>
  </g>

  <!-- red carpet floor -->
  <g>
    <!-- carpet trapezoid receding into stage -->
    <path d="M 0,200 L 800,200 L 640,158 L 160,158 Z" fill="url(#carpet)"/>
    <!-- carpet edge highlight -->
    <path d="M 160,158 L 640,158" stroke="#ffd955" stroke-width="0.8" opacity="0.6"/>
    <path d="M 0,200 L 160,158 M 800,200 L 640,158" stroke="#ffd955" stroke-width="0.6" opacity="0.45"/>
    <!-- gold floor edge -->
    <rect x="0" y="156" width="800" height="2" fill="url(#goldEdge)" opacity="0.7"/>
    <!-- velvet rope stanchions on either side of carpet -->
    <g fill="url(#gold)">
      <circle cx="155" cy="158" r="2.4"/>
      <rect x="153.6" y="158" width="2.8" height="14"/>
      <circle cx="645" cy="158" r="2.4"/>
      <rect x="643.6" y="158" width="2.8" height="14"/>
    </g>
    <path d="M 156,162 Q 400,175 644,162" fill="none" stroke="#a31b25" stroke-width="1.5" opacity="0.85"/>
  </g>

  <!-- Oscar statuettes flanking the date -->
  <g transform="translate(125,160) scale(1.05)" filter="url(#goldGlow)">
    <use href="#oscar"/>
    <animateTransform attributeName="transform" type="translate" values="125,160; 125,158.5; 125,160" dur="7s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(675,160) scale(1.05)" filter="url(#goldGlow)">
    <use href="#oscar"/>
    <animateTransform attributeName="transform" type="translate" values="675,160; 675,158.5; 675,160" dur="11s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- camera flash bursts behind the date -->
  <g>
    <circle cx="260" cy="78" r="3" fill="#fffbe6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;6;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="86" r="3" fill="#fffbe6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.1s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;6;1" dur="3.1s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="120" r="3" fill="#fffbe6" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.9s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;5;1" dur="2.9s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="124" r="3" fill="#fffbe6" opacity="0">
      <animate attributeName="opacity" values="0;0.85;0" dur="2.6s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;5;1" dur="2.6s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="60" r="3" fill="#fffbe6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3.7s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;7;1" dur="3.7s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- DATE — primary headline, art deco styled -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- dark backing plate for legibility -->
    <rect x="195" y="60" width="410" height="62" rx="3" fill="#0d1117" opacity="0.62"/>
    <!-- thin deco frame -->
    <rect x="197" y="62" width="406" height="58" rx="2" fill="none" stroke="url(#goldEdge)" stroke-width="0.8" opacity="0.85"/>
    <rect x="202" y="67" width="396" height="48" rx="1" fill="none" stroke="url(#goldEdge)" stroke-width="0.4" opacity="0.55"/>

    <text x="400" y="107" font-size="46" font-weight="800" fill="url(#gold)" filter="url(#goldGlow)" letter-spacing="6">
      MAY 16, 2026
    </text>
    <text x="400" y="138" font-size="11.5" font-weight="700" fill="#ffd955" letter-spacing="5">
      THE ACADEMY AWARDS &#183; 97 YEARS
    </text>
    <text x="400" y="153" font-size="9" font-weight="500" fill="#e8c98a" letter-spacing="4" opacity="0.9">
      HOLLYWOOD ROOSEVELT &#183; MAY 16, 1929
    </text>
  </g>

  <!-- bottom film-strip border -->
  <g transform="translate(0,190)">
    <rect x="0" y="0" width="800" height="10" fill="#1a1208"/>
    <g fill="#0d1117">
      <rect x="6" y="2.5" width="12" height="5" rx="1"/>
      <rect x="30" y="2.5" width="12" height="5" rx="1"/>
      <rect x="54" y="2.5" width="12" height="5" rx="1"/>
      <rect x="78" y="2.5" width="12" height="5" rx="1"/>
      <rect x="102" y="2.5" width="12" height="5" rx="1"/>
      <rect x="126" y="2.5" width="12" height="5" rx="1"/>
      <rect x="150" y="2.5" width="12" height="5" rx="1"/>
      <rect x="174" y="2.5" width="12" height="5" rx="1"/>
      <rect x="198" y="2.5" width="12" height="5" rx="1"/>
      <rect x="222" y="2.5" width="12" height="5" rx="1"/>
      <rect x="246" y="2.5" width="12" height="5" rx="1"/>
      <rect x="270" y="2.5" width="12" height="5" rx="1"/>
      <rect x="294" y="2.5" width="12" height="5" rx="1"/>
      <rect x="318" y="2.5" width="12" height="5" rx="1"/>
      <rect x="342" y="2.5" width="12" height="5" rx="1"/>
      <rect x="366" y="2.5" width="12" height="5" rx="1"/>
      <rect x="390" y="2.5" width="12" height="5" rx="1"/>
      <rect x="414" y="2.5" width="12" height="5" rx="1"/>
      <rect x="438" y="2.5" width="12" height="5" rx="1"/>
      <rect x="462" y="2.5" width="12" height="5" rx="1"/>
      <rect x="486" y="2.5" width="12" height="5" rx="1"/>
      <rect x="510" y="2.5" width="12" height="5" rx="1"/>
      <rect x="534" y="2.5" width="12" height="5" rx="1"/>
      <rect x="558" y="2.5" width="12" height="5" rx="1"/>
      <rect x="582" y="2.5" width="12" height="5" rx="1"/>
      <rect x="606" y="2.5" width="12" height="5" rx="1"/>
      <rect x="630" y="2.5" width="12" height="5" rx="1"/>
      <rect x="654" y="2.5" width="12" height="5" rx="1"/>
      <rect x="678" y="2.5" width="12" height="5" rx="1"/>
      <rect x="702" y="2.5" width="12" height="5" rx="1"/>
      <rect x="726" y="2.5" width="12" height="5" rx="1"/>
      <rect x="750" y="2.5" width="12" height="5" rx="1"/>
      <rect x="774" y="2.5" width="12" height="5" rx="1"/>
    </g>
  </g>
</svg>
