<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Ada Lovelace Day (October 13, 2026) -->
<!-- about:
Ada Lovelace Day falls on the second Tuesday of October, honouring Augusta Ada King, Countess of Lovelace (1815–1852) and the women in science, technology, engineering, and mathematics who followed her. In 1843 Ada translated an Italian paper describing Charles Babbage's unbuilt Analytical Engine and appended seven notes of her own, more than twice the length of the original. Note G contained a step-by-step method for computing Bernoulli numbers — the first algorithm ever written for a machine, and the reason she is remembered as the first computer programmer. The modern Day was founded by Suw Charman-Anderson in 2009 to raise the profile of women in STEM; it is now observed worldwide.

The scene is a Victorian clockwork tableau. On the left, three interlocking brass gears turn at prime cadences, with a column of punched cards drifting slowly upward through them and a soft violet glow haloing the mechanism. Floating fragments of Note G — "FOR N := 1" and a Bernoulli symbol — orbit the composition at a slow drift. On the right, a cream OCTOBER 13, 2026 headline sits over a double brass-and-violet bar, a lavender ADA LOVELACE DAY subhead, an italic amber 1815 – 1852 · FIRST PROGRAMMER tertiary, a dim MATHEMATICS · POETRY · ENGINE · ALGORITHM · LEGACY roster, and a Georgia-italic 'The science of operations.' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for October 13, 2026 — Ada Lovelace Day. On the left, three interlocking brass gears turn at prime cadences around a soft violet halo, a column of punched cards drifts upward through them, and floating fragments of Note G orbit slowly. On the right, a cream OCTOBER 13, 2026 headline sits over a double brass-and-violet bar, a lavender ADA LOVELACE DAY subhead, an italic amber 1815 – 1852 · FIRST PROGRAMMER tertiary, a dim MATHEMATICS · POETRY · ENGINE · ALGORITHM · LEGACY roster, and a Georgia-italic 'The science of operations.' caption at the base.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#140a1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#b89cd4" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#6a4a94" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c470"/>
      <stop offset="0.5" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#7a5618"/>
    </linearGradient>
    <linearGradient id="brassDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a24a"/>
      <stop offset="1" stop-color="#5a3e14"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c898" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#d8c898" stop-opacity="0.75"/>
      <stop offset="0.8" stop-color="#b89c6a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b89c6a" stop-opacity="0"/>
    </linearGradient>

    <!-- Gear symbol: 12 teeth, inner hub, four spokes -->
    <g id="gear">
      <!-- Outer teeth ring -->
      <g fill="url(#brass)">
        <rect x="-3" y="-46" width="6" height="10" rx="1"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(30)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(60)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(90)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(120)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(150)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(180)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(210)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(240)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(270)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(300)"/>
        <rect x="-3" y="-46" width="6" height="10" rx="1" transform="rotate(330)"/>
      </g>
      <!-- Main disk -->
      <circle r="37" fill="url(#brassDeep)"/>
      <circle r="37" fill="none" stroke="#f0e4c8" stroke-width="0.6" opacity="0.5"/>
      <circle r="32" fill="none" stroke="#f0e4c8" stroke-width="0.4" opacity="0.35"/>
      <!-- Spokes -->
      <g stroke="#2a1a08" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <line x1="-30" y1="0" x2="-10" y2="0"/>
        <line x1="10" y1="0" x2="30" y2="0"/>
        <line x1="0" y1="-30" x2="0" y2="-10"/>
        <line x1="0" y1="10" x2="0" y2="30"/>
      </g>
      <!-- Diagonal spokes -->
      <g stroke="#4a3818" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
        <line x1="-21" y1="-21" x2="-7" y2="-7"/>
        <line x1="21" y1="-21" x2="7" y2="-7"/>
        <line x1="-21" y1="21" x2="-7" y2="7"/>
        <line x1="21" y1="21" x2="7" y2="7"/>
      </g>
      <!-- Hub -->
      <circle r="8" fill="#2a1a08"/>
      <circle r="8" fill="none" stroke="#f0e4c8" stroke-width="0.5" opacity="0.6"/>
      <circle r="2.5" fill="#f0e4c8" opacity="0.9"/>
    </g>

    <!-- Small gear: 8 teeth -->
    <g id="gearSmall">
      <g fill="url(#brass)">
        <rect x="-2" y="-26" width="4" height="7" rx="0.8"/>
        <rect x="-2" y="-26" width="4" height="7" rx="0.8" transform="rotate(45)"/>
        <rect x="-2" y="-26" width="4" height="7" rx="0.8" transform="rotate(90)"/>
        <rect x="-2" y="-26" width="4" height="7" rx="0.8" transform="rotate(135)"/>
        <rect x="-2" y="-26" width="4" height="7" rx="0.8" transform="rotate(180)"/>
        <rect x="-2" y="-26" width="4" height="7" rx="0.8" transform="rotate(225)"/>
        <rect x="-2" y="-26" width="4" height="7" rx="0.8" transform="rotate(270)"/>
        <rect x="-2" y="-26" width="4" height="7" rx="0.8" transform="rotate(315)"/>
      </g>
      <circle r="20" fill="url(#brassDeep)"/>
      <circle r="20" fill="none" stroke="#f0e4c8" stroke-width="0.4" opacity="0.45"/>
      <g stroke="#2a1a08" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <line x1="-16" y1="0" x2="-5" y2="0"/>
        <line x1="5" y1="0" x2="16" y2="0"/>
        <line x1="0" y1="-16" x2="0" y2="-5"/>
        <line x1="0" y1="5" x2="0" y2="16"/>
      </g>
      <circle r="4.5" fill="#2a1a08"/>
      <circle r="1.6" fill="#f0e4c8" opacity="0.9"/>
    </g>

    <!-- Punched card: strip with holes -->
    <g id="punchCard">
      <rect x="-26" y="-9" width="52" height="18" rx="1" fill="url(#card)" stroke="#8a6c3a" stroke-width="0.5" opacity="0.9"/>
      <g fill="#0d1117">
        <circle cx="-20" cy="-4" r="1.2"/>
        <circle cx="-14" cy="-4" r="1.2"/>
        <circle cx="-8" cy="-4" r="1.2"/>
        <circle cx="-2" cy="4" r="1.2"/>
        <circle cx="4" cy="-4" r="1.2"/>
        <circle cx="10" cy="4" r="1.2"/>
        <circle cx="16" cy="-4" r="1.2"/>
        <circle cx="22" cy="4" r="1.2"/>
      </g>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Soft violet halo around the mechanism -->
  <ellipse cx="155" cy="100" rx="190" ry="110" fill="url(#halo)">
    <animate attributeName="opacity" values="0.82;1;0.9;1;0.82" dur="17s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Scattered stars / dust -->
  <g fill="#f0e4c8">
    <circle cx="52" cy="24" r="0.9" opacity="0.65">
      <animate attributeName="opacity" values="0.3;0.9;0.4;0.9;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88" cy="18" r="0.7" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.8;0.35;0.8;0.25" dur="11s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="268" cy="30" r="0.8" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.85;0.4;0.85;0.3" dur="17s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="306" cy="20" r="0.6" opacity="0.5">
      <animate attributeName="opacity" values="0.25;0.75;0.35;0.75;0.25" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="222" cy="178" r="0.7" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.8;0.35;0.8;0.25" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =================== PUNCHED CARD COLUMN (drifting upward) =================== -->
  <g opacity="0.85">
    <!-- Each card moves from y=210 to y=-20 along the same column x=255, loops with staggered begins -->
    <g transform="translate(255 100)">
      <use href="#punchCard" transform="rotate(-6)">
        <animateTransform attributeName="transform" type="translate" values="0 110;0 -110" dur="23s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g transform="translate(255 100)">
      <use href="#punchCard" transform="rotate(-4)">
        <animateTransform attributeName="transform" type="translate" values="0 70;0 -150" dur="23s" begin="-7s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g transform="translate(255 100)">
      <use href="#punchCard" transform="rotate(-8)">
        <animateTransform attributeName="transform" type="translate" values="0 30;0 -190" dur="23s" begin="-14s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
  </g>

  <!-- =================== GEAR TRAIN =================== -->

  <!-- Large central gear -->
  <g transform="translate(130 100)">
    <use href="#gear">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="31s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Upper-right small gear (meshes with large, so rotates opposite) -->
  <g transform="translate(195 56)">
    <use href="#gearSmall">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="17s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Lower-left small gear (meshes with large, so rotates opposite) -->
  <g transform="translate(60 150)">
    <use href="#gearSmall">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="19s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Tiny gear in upper left for density -->
  <g transform="translate(50 48)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      <circle r="12" fill="url(#brassDeep)"/>
      <g fill="url(#brass)">
        <rect x="-1.5" y="-16" width="3" height="5" rx="0.5"/>
        <rect x="-1.5" y="-16" width="3" height="5" rx="0.5" transform="rotate(60)"/>
        <rect x="-1.5" y="-16" width="3" height="5" rx="0.5" transform="rotate(120)"/>
        <rect x="-1.5" y="-16" width="3" height="5" rx="0.5" transform="rotate(180)"/>
        <rect x="-1.5" y="-16" width="3" height="5" rx="0.5" transform="rotate(240)"/>
        <rect x="-1.5" y="-16" width="3" height="5" rx="0.5" transform="rotate(300)"/>
      </g>
      <circle r="3" fill="#2a1a08"/>
      <circle r="1" fill="#f0e4c8"/>
    </g>
  </g>

  <!-- Note G floating fragments (Ada's famous algorithm) -->
  <g font-family="'Georgia', serif" fill="#b89cd4" opacity="0.78">
    <text x="200" y="178" font-size="10" font-style="italic" letter-spacing="0.6">
      FOR N := 1 ...
      <animate attributeName="opacity" values="0.35;0.85;0.45;0.85;0.35" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="18" y="100" font-size="12" font-style="italic" fill="#d4a858">
      B&#8345;
      <animate attributeName="opacity" values="0.4;0.9;0.5;0.9;0.4" dur="11s" begin="-3s" repeatCount="indefinite"/>
    </text>
    <text x="265" y="80" font-size="9" font-style="italic" letter-spacing="0.4" opacity="0.65">
      Note G
      <animate attributeName="opacity" values="0.3;0.75;0.4;0.75;0.3" dur="17s" begin="-5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Separator -->
  <line x1="340" y1="30" x2="340" y2="170" stroke="#4a3660" stroke-width="0.6" opacity="0.5"/>

  <!-- =================== TEXT STACK (right half) =================== -->

  <!-- Date headline -->
  <text x="580" y="58" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f0e4c8" letter-spacing="2.0">
    OCTOBER 13, 2026
  </text>

  <!-- Twin bar under headline -->
  <path d="M 410 74 Q 450 68, 490 74 T 570 74 T 650 74 T 730 74 T 770 74" fill="none" stroke="#c9a24a" stroke-width="2.4" opacity="0.95"/>
  <path d="M 410 80 Q 450 74, 490 80 T 570 80 T 650 80 T 730 80 T 770 80" fill="none" stroke="#b89cd4" stroke-width="1.3" opacity="0.8"/>

  <!-- Subhead -->
  <text x="580" y="104" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="800" letter-spacing="3.0" fill="#c8b0dc">
    ADA LOVELACE DAY
  </text>

  <!-- Tertiary italic -->
  <text x="580" y="124" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#d4a858" letter-spacing="0.6">
    1815 &#8211; 1852 &#183; FIRST PROGRAMMER
  </text>

  <!-- Roster -->
  <text x="580" y="145" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.8" font-weight="700" fill="#9888a8" letter-spacing="2.4" opacity="0.95">
    MATHEMATICS &#183; POETRY &#183; ENGINE &#183; ALGORITHM &#183; LEGACY
  </text>

  <!-- Caption -->
  <text x="580" y="188" text-anchor="middle"
        font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#f0e4c8" opacity="0.95">
    &#8220;The science of operations.&#8221;
  </text>
</svg>
