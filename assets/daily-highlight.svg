<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Indigenous Peoples' Day (October 12) -->
<!-- about:
Indigenous Peoples' Day falls on the second Monday of October in the United States — a reframing of the older Columbus Day as an occasion to honour the first peoples of the Americas, their histories, their cultures, and the communities still living here. Berkeley, California held the first municipal observance in 1992, five hundred years after Columbus's landing; a federal proclamation followed in 2021. More than five hundred Native nations live within U.S. borders today, each with its own language, land relationship, and story that long predates and continues past the arrival of ships.

The scene faces east at sunrise. On the left, three layered ridges of warm desert rock step back toward a geometric medallion sun — concentric rings with triangle rays, pulsing softly — while a dark eagle banks slowly overhead. A thin zig-zag weaving pattern runs along the horizon. On the right, a cream OCTOBER 12, 2026 headline sits over a double terracotta-and-ochre bar, a terracotta INDIGENOUS PEOPLES' DAY subhead, an italic amber FIRST NATIONS · SINCE TIME IMMEMORIAL tertiary, a dim LAND · LANGUAGE · STORY · CEREMONY · FUTURE roster, and a Georgia-italic 'Still here.' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for October 12, 2026 — Indigenous Peoples' Day. On the left, three layered desert mountain ridges in warm red and terracotta step back toward a geometric medallion sun of concentric rings and triangle rays; a dark eagle banks slowly overhead against a dawn sky; a thin zig-zag weaving pattern runs along the horizon. On the right, a cream OCTOBER 12, 2026 headline sits over a double terracotta-and-ochre bar, a terracotta INDIGENOUS PEOPLES' DAY subhead, an italic amber FIRST NATIONS · SINCE TIME IMMEMORIAL tertiary, a dim LAND · LANGUAGE · STORY · CEREMONY · FUTURE roster, and a Georgia-italic 'Still here.' caption at the base.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a0a0a"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.22" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#d4663a" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#8c3a28" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c8"/>
      <stop offset="0.55" stop-color="#f5c870"/>
      <stop offset="1" stop-color="#d4663a"/>
    </radialGradient>
    <radialGradient id="sunHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c870" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f5c870" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a2024"/>
      <stop offset="1" stop-color="#3a0f14"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c3a28"/>
      <stop offset="1" stop-color="#4a1a14"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1612"/>
      <stop offset="1" stop-color="#0a0608"/>
    </linearGradient>
  </defs>

  <!-- Base sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Warm dawn wash -->
  <rect width="800" height="200" fill="url(#dawn)">
    <animate attributeName="opacity" values="0.78;1;0.84;1;0.78" dur="17s" repeatCount="indefinite"/>
  </rect>

  <!-- Scattered dawn stars still visible -->
  <g fill="#f5e6c8">
    <circle cx="36" cy="22" r="0.9" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.4;0.9;0.3" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="74" cy="18" r="0.7" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.4;0.8;0.3" dur="11s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="268" cy="28" r="0.8" opacity="0.65">
      <animate attributeName="opacity" values="0.3;0.85;0.4;0.85;0.3" dur="17s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="46" r="0.6" opacity="0.55">
      <animate attributeName="opacity" values="0.25;0.75;0.35;0.75;0.25" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="314" cy="22" r="0.7" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.4;0.8;0.3" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =================== SUN MEDALLION =================== -->
  <g>
    <!-- Soft outer halo -->
    <circle cx="140" cy="112" r="78" fill="url(#sunHalo)">
      <animate attributeName="opacity" values="0.55;0.95;0.65;0.95;0.55" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- Triangle rays, pointing outward, 12 around -->
    <g opacity="0.95">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 140 112" to="360 140 112" dur="83s" repeatCount="indefinite"/>
      <!-- 12 rays, generated manually; each a thin isoceles triangle from r=40 out to r=60 -->
      <g fill="#d4663a">
        <polygon points="140,52 136,72 144,72"/>
        <polygon points="194,66 178,80 184,86" transform="rotate(30 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(60 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(90 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(120 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(150 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(180 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(210 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(240 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(270 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(300 140 112)"/>
        <polygon points="140,52 136,72 144,72" transform="rotate(330 140 112)"/>
      </g>
      <!-- Shorter inner rays, offset by 15deg, in ochre -->
      <g fill="#f5c870" opacity="0.85">
        <polygon points="140,76 137,88 143,88" transform="rotate(15 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(45 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(75 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(105 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(135 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(165 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(195 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(225 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(255 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(285 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(315 140 112)"/>
        <polygon points="140,76 137,88 143,88" transform="rotate(345 140 112)"/>
      </g>
    </g>

    <!-- Outer ring -->
    <circle cx="140" cy="112" r="34" fill="none" stroke="#f5c870" stroke-width="1.4" opacity="0.9">
      <animate attributeName="r" values="33.5;34.8;33.5" dur="11s" repeatCount="indefinite"/>
    </circle>
    <!-- Mid ring (dashed, like beading) -->
    <circle cx="140" cy="112" r="29" fill="none" stroke="#f5e6c8" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.8"/>
    <!-- Inner ring -->
    <circle cx="140" cy="112" r="24" fill="none" stroke="#d4663a" stroke-width="1.1" opacity="0.95"/>

    <!-- Core sun -->
    <circle cx="140" cy="112" r="20" fill="url(#sunCore)">
      <animate attributeName="r" values="19;20.8;19" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner geometric motif: four-pointed star inside core -->
    <g opacity="0.75">
      <polygon points="140,98 143,112 140,126 137,112" fill="#8c3a28"/>
      <polygon points="126,112 140,109 154,112 140,115" fill="#8c3a28"/>
    </g>
  </g>

  <!-- =================== EAGLE (silhouette, soaring) =================== -->
  <g>
    <!-- Slow horizontal drift + gentle vertical bob -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 6 -2; 0 0; -6 2; 0 0" dur="23s" repeatCount="indefinite"/>
    <!-- A simple stylized eagle silhouette with slightly curved outstretched wings -->
    <!-- Body around (210, 56); wings extending left/right -->
    <g>
      <!-- Wing flap: subtle y-scale oscillation around body center -->
      <animateTransform attributeName="transform" type="scale"
                        values="1 1; 1 0.92; 1 1; 1 1.04; 1 1" additive="sum"
                        dur="7s" repeatCount="indefinite"/>
      <path d="M 210 56
               C 198 52, 184 50, 170 54
               C 158 58, 148 62, 138 60
               C 148 60, 160 62, 170 60
               C 184 58, 198 60, 210 60
               C 222 60, 236 58, 250 60
               C 260 62, 272 60, 282 60
               C 272 62, 260 62, 250 60
               C 236 50, 222 52, 210 56 Z"
            fill="#0a0608" opacity="0.95"/>
      <!-- Rim glow along upper wing -->
      <path d="M 170 54 C 184 50, 198 52, 210 56 C 222 52, 236 50, 250 60"
            fill="none" stroke="#f5c870" stroke-width="0.6" opacity="0.65"/>
      <!-- Head notch -->
      <path d="M 210 56 L 213 50 L 207 50 Z" fill="#0a0608"/>
      <!-- Tail -->
      <path d="M 210 60 L 212 68 L 208 68 Z" fill="#0a0608"/>
    </g>
  </g>

  <!-- =================== MOUNTAINS (three layers) =================== -->

  <!-- Far ridge -->
  <path d="M 0 160
           L 20 142 L 42 150 L 68 128 L 92 142 L 118 132 L 148 148 L 180 134 L 212 148 L 240 136 L 268 150 L 300 140 L 332 158
           L 332 200 L 0 200 Z"
        fill="url(#mtnFar)" opacity="0.95"/>

  <!-- Mid ridge -->
  <path d="M 0 172
           L 24 160 L 48 168 L 78 150 L 106 164 L 134 156 L 162 170 L 192 158 L 222 172 L 250 162 L 280 174 L 310 164 L 332 172
           L 332 200 L 0 200 Z"
        fill="url(#mtnMid)" opacity="0.98"/>

  <!-- Near ridge -->
  <path d="M 0 184
           L 30 178 L 60 186 L 92 174 L 124 184 L 156 178 L 188 188 L 220 180 L 252 190 L 286 182 L 316 190 L 332 186
           L 332 200 L 0 200 Z"
        fill="url(#mtnNear)"/>

  <!-- Weaving zig-zag pattern across horizon of near ridge -->
  <g stroke="#c89450" stroke-width="0.6" fill="none" opacity="0.6">
    <path d="M 0 194 L 10 190 L 20 194 L 30 190 L 40 194 L 50 190 L 60 194 L 70 190 L 80 194 L 90 190 L 100 194 L 110 190 L 120 194 L 130 190 L 140 194 L 150 190 L 160 194 L 170 190 L 180 194 L 190 190 L 200 194 L 210 190 L 220 194 L 230 190 L 240 194 L 250 190 L 260 194 L 270 190 L 280 194 L 290 190 L 300 194 L 310 190 L 320 194 L 332 190"/>
    <path d="M 0 198 L 10 194 L 20 198 L 30 194 L 40 198 L 50 194 L 60 198 L 70 194 L 80 198 L 90 194 L 100 198 L 110 194 L 120 198 L 130 194 L 140 198 L 150 194 L 160 198 L 170 194 L 180 198 L 190 194 L 200 198 L 210 194 L 220 198 L 230 194 L 240 198 L 250 194 L 260 198 L 270 194 L 280 198 L 290 194 L 300 198 L 310 194 L 320 198 L 332 194"
          opacity="0.5"/>
  </g>

  <!-- Diamond markers along mid-horizon -->
  <g fill="#c89450" opacity="0.5">
    <polygon points="40,186 44,190 40,194 36,190"/>
    <polygon points="100,186 104,190 100,194 96,190"/>
    <polygon points="160,186 164,190 160,194 156,190"/>
    <polygon points="220,186 224,190 220,194 216,190"/>
    <polygon points="280,186 284,190 280,194 276,190"/>
  </g>

  <!-- Separator -->
  <line x1="340" y1="30" x2="340" y2="170" stroke="#4a1a20" stroke-width="0.6" opacity="0.5"/>

  <!-- =================== TEXT STACK (right half) =================== -->

  <!-- Date headline -->
  <text x="580" y="58" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f5e6c8" letter-spacing="2.0">
    OCTOBER 12, 2026
  </text>

  <!-- Twin bar under headline -->
  <path d="M 410 74 Q 450 68, 490 74 T 570 74 T 650 74 T 730 74 T 770 74" fill="none" stroke="#d4663a" stroke-width="2.4" opacity="0.95"/>
  <path d="M 410 80 Q 450 74, 490 80 T 570 80 T 650 80 T 730 80 T 770 80" fill="none" stroke="#c89450" stroke-width="1.3" opacity="0.75"/>

  <!-- Subhead -->
  <text x="580" y="104" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="800" letter-spacing="3.0" fill="#e08858">
    INDIGENOUS PEOPLES' DAY
  </text>

  <!-- Tertiary italic -->
  <text x="580" y="124" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#d4a858" letter-spacing="0.6">
    FIRST NATIONS &#183; SINCE TIME IMMEMORIAL
  </text>

  <!-- Roster -->
  <text x="580" y="145" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.8" font-weight="700" fill="#b89878" letter-spacing="2.4" opacity="0.95">
    LAND &#183; LANGUAGE &#183; STORY &#183; CEREMONY &#183; FUTURE
  </text>

  <!-- Caption -->
  <text x="580" y="188" text-anchor="middle"
        font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#f5d8b8" opacity="0.95">
    &#8220;Still here.&#8221;
  </text>
</svg>
