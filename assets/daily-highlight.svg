<!-- theme: Library of Congress 226th anniversary (founded April 24, 1800) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Library of Congress at 226 — April 24, 2026">
  <title>Library of Congress at 226 — April 24, 2026</title>

  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fbd38a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#a06628" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3d57a"/>
      <stop offset="50%" stop-color="#caa14a"/>
      <stop offset="100%" stop-color="#7a5418"/>
    </linearGradient>

    <linearGradient id="cardPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7eccd"/>
      <stop offset="60%" stop-color="#ecdcaf"/>
      <stop offset="100%" stop-color="#cfb988"/>
    </linearGradient>

    <linearGradient id="cardTopStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e2014"/>
      <stop offset="50%" stop-color="#a13822"/>
      <stop offset="100%" stop-color="#6e2014"/>
    </linearGradient>

    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- arch column silhouette -->
    <symbol id="arch" viewBox="0 0 100 200">
      <path d="M0,200 L0,80 Q50,10 100,80 L100,200 Z" fill="#1a1f2a" opacity="0.55"/>
      <path d="M0,200 L0,80 Q50,10 100,80 L100,200 Z" fill="none" stroke="#3a3024" stroke-width="0.6" opacity="0.5"/>
    </symbol>

    <!-- single book spine template approximated inline (kept simple — see <use> usage below) -->
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- Faint dome arches behind everything -->
  <g opacity="0.7">
    <use href="#arch" x="-20" y="20" width="140" height="180"/>
    <use href="#arch" x="120" y="10" width="140" height="190"/>
    <use href="#arch" x="540" y="10" width="140" height="190"/>
    <use href="#arch" x="680" y="20" width="140" height="180"/>
  </g>

  <!-- Warm lamp glow halo, breathing -->
  <ellipse cx="400" cy="70" rx="360" ry="120" fill="url(#lampGlow)">
    <animate attributeName="rx" values="340;380;340" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="115;135;115" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;1;0.75" dur="17s" repeatCount="indefinite"/>
  </ellipse>

  <!-- LEFT bookshelf -->
  <g id="leftShelf">
    <!-- shelf board -->
    <rect x="10" y="178" width="220" height="6" fill="#3a2614"/>
    <rect x="10" y="184" width="220" height="2" fill="#1c130a"/>
    <!-- books -->
    <g>
      <rect x="18" y="40" width="22" height="138" fill="#5a1f1f"/>
      <rect x="18" y="40" width="22" height="4" fill="url(#goldTrim)"/>
      <rect x="18" y="56" width="22" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <rect x="18" y="170" width="22" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.2; 0,0" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="42" y="48" width="20" height="130" fill="#1f3a5a"/>
      <rect x="42" y="48" width="20" height="4" fill="url(#goldTrim)"/>
      <rect x="42" y="100" width="20" height="2" fill="url(#goldTrim)" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.8; 0,0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="64" y="34" width="24" height="144" fill="#2d5a3a"/>
      <rect x="64" y="34" width="24" height="5" fill="url(#goldTrim)"/>
      <rect x="64" y="60" width="24" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <rect x="64" y="160" width="24" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="90" y="52" width="18" height="126" fill="#7a5a2d"/>
      <rect x="90" y="52" width="18" height="3" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1; 0,0" dur="17s" begin="-1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="110" y="42" width="22" height="136" fill="#4a1f3a"/>
      <rect x="110" y="42" width="22" height="4" fill="url(#goldTrim)"/>
      <rect x="110" y="62" width="22" height="2" fill="url(#goldTrim)" opacity="0.6"/>
      <rect x="110" y="166" width="22" height="2" fill="url(#goldTrim)" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.3; 0,0" dur="7s" begin="-3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="134" y="58" width="20" height="120" fill="#3a2d1f"/>
      <rect x="134" y="58" width="20" height="4" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.7; 0,0" dur="11s" begin="-4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="156" y="38" width="24" height="140" fill="#1f1f3a"/>
      <rect x="156" y="38" width="24" height="4" fill="url(#goldTrim)"/>
      <rect x="156" y="64" width="24" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.4; 0,0" dur="13s" begin="-6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="182" y="50" width="22" height="128" fill="#6a3a2a"/>
      <rect x="182" y="50" width="22" height="4" fill="url(#goldTrim)"/>
      <rect x="182" y="160" width="22" height="2" fill="url(#goldTrim)" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1; 0,0" dur="17s" begin="-2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="206" y="44" width="18" height="134" fill="#2d3a5a"/>
      <rect x="206" y="44" width="18" height="3" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.9; 0,0" dur="7s" begin="-5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- RIGHT bookshelf (mirrors left, distinct rhythms) -->
  <g id="rightShelf">
    <rect x="570" y="178" width="220" height="6" fill="#3a2614"/>
    <rect x="570" y="184" width="220" height="2" fill="#1c130a"/>
    <g>
      <rect x="576" y="46" width="20" height="132" fill="#3a1f3a"/>
      <rect x="576" y="46" width="20" height="4" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1; 0,0" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="598" y="38" width="22" height="140" fill="#5a3a1a"/>
      <rect x="598" y="38" width="22" height="4" fill="url(#goldTrim)"/>
      <rect x="598" y="60" width="22" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <rect x="598" y="164" width="22" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.4; 0,0" dur="13s" begin="-1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="622" y="52" width="18" height="126" fill="#1f4a3a"/>
      <rect x="622" y="52" width="18" height="3" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.8; 0,0" dur="17s" begin="-3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="642" y="34" width="24" height="144" fill="#5a1f2d"/>
      <rect x="642" y="34" width="24" height="5" fill="url(#goldTrim)"/>
      <rect x="642" y="62" width="24" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <rect x="642" y="160" width="24" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="7s" begin="-4s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="668" y="48" width="20" height="130" fill="#1f2d5a"/>
      <rect x="668" y="48" width="20" height="4" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.1; 0,0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="690" y="40" width="22" height="138" fill="#3a2d4a"/>
      <rect x="690" y="40" width="22" height="4" fill="url(#goldTrim)"/>
      <rect x="690" y="64" width="22" height="2" fill="url(#goldTrim)" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.2; 0,0" dur="13s" begin="-5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="714" y="56" width="18" height="122" fill="#4a3a1a"/>
      <rect x="714" y="56" width="18" height="3" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.9; 0,0" dur="17s" begin="-6s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="734" y="36" width="24" height="142" fill="#2d1f3a"/>
      <rect x="734" y="36" width="24" height="4" fill="url(#goldTrim)"/>
      <rect x="734" y="60" width="24" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <rect x="734" y="160" width="24" height="2" fill="url(#goldTrim)" opacity="0.7"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.3; 0,0" dur="7s" begin="-1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="760" y="50" width="20" height="128" fill="#3a4a1a"/>
      <rect x="760" y="50" width="20" height="4" fill="url(#goldTrim)"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1; 0,0" dur="11s" begin="-3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Floating dust motes drifting upward -->
  <g id="motes" fill="#fbd38a" opacity="0.7">
    <circle cx="80" cy="150" r="0.9">
      <animate attributeName="cy" values="180;-10" dur="13s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="13s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="120" r="1.1">
      <animate attributeName="cy" values="180;-10" dur="17s" begin="-7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="17s" begin="-7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="90" r="0.8">
      <animate attributeName="cy" values="180;-10" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="40" r="1.0">
      <animate attributeName="cy" values="180;-10" dur="19s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="19s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="160" r="1.2">
      <animate attributeName="cy" values="180;-10" dur="13s" begin="-9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="-9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="70" r="0.9">
      <animate attributeName="cy" values="180;-10" dur="17s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="17s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="30" r="1.0">
      <animate attributeName="cy" values="180;-10" dur="11s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="-6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="140" r="0.8">
      <animate attributeName="cy" values="180;-10" dur="19s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="19s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="100" r="1.1">
      <animate attributeName="cy" values="180;-10" dur="13s" begin="-8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="13s" begin="-8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="60" r="0.9">
      <animate attributeName="cy" values="180;-10" dur="17s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="17s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center index card with the date -->
  <g id="card" filter="url(#paperShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="7s" repeatCount="indefinite"/>

    <!-- card body -->
    <rect x="240" y="46" width="320" height="108" rx="6" fill="url(#cardPaper)" stroke="url(#goldTrim)" stroke-width="1.5"/>

    <!-- top stripe -->
    <rect x="240" y="46" width="320" height="14" fill="url(#cardTopStripe)"/>
    <rect x="240" y="46" width="320" height="14" fill="none" stroke="url(#goldTrim)" stroke-width="0.6"/>

    <!-- punch hole at bottom (catalog card hallmark) -->
    <circle cx="400" cy="148" r="2.4" fill="#6b4a1c" opacity="0.55"/>

    <!-- "call number" header -->
    <text x="400" y="56.5" text-anchor="middle" fill="#fbe8b6"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="7.5" letter-spacing="3.4" font-weight="700">CATALOG · CALL № 026·2026·BMF</text>

    <!-- main date -->
    <text x="400" y="98" text-anchor="middle" fill="#5a3210"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="34" font-weight="700" letter-spacing="1.5">April 24, 2026</text>

    <!-- decorative rule -->
    <line x1="290" y1="112" x2="510" y2="112" stroke="#a07028" stroke-width="0.8"/>
    <circle cx="280" cy="112" r="2" fill="#a07028"/>
    <circle cx="520" cy="112" r="2" fill="#a07028"/>

    <!-- subtitle -->
    <text x="400" y="128" text-anchor="middle" fill="#5a3a14"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9.5" letter-spacing="2.6" font-weight="600">LIBRARY OF CONGRESS · EST. APR 24, 1800 · 226 YEARS</text>

    <!-- shimmer pass on the date (subtle highlight sweep) -->
    <rect x="240" y="46" width="320" height="108" rx="6" fill="url(#cardPaper)" opacity="0">
      <animate attributeName="opacity" values="0;0.18;0" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Quill drifting at the top -->
  <g id="quill">
    <animateTransform attributeName="transform" type="translate" values="0,0; 6,2; 0,0" dur="13s" repeatCount="indefinite"/>
    <path d="M70,28 Q98,8 138,18 Q120,30 100,32 Q86,34 70,28 Z"
          fill="#f3e6c7" opacity="0.85"/>
    <path d="M76,28 Q100,18 132,20" stroke="#a07028" stroke-width="0.6" fill="none" opacity="0.6"/>
    <line x1="138" y1="18" x2="156" y2="6" stroke="#a07028" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- A second quill drifting on the right -->
  <g id="quill2" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0,0; -5,3; 0,0" dur="17s" repeatCount="indefinite"/>
    <path d="M730,24 Q700,8 660,18 Q680,28 700,30 Q716,30 730,24 Z"
          fill="#f3e6c7" opacity="0.8"/>
    <path d="M724,24 Q700,16 668,20" stroke="#a07028" stroke-width="0.6" fill="none" opacity="0.55"/>
    <line x1="660" y1="18" x2="644" y2="6" stroke="#a07028" stroke-width="1.2" opacity="0.65"/>
  </g>
</svg>
