<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Audubon's 241st Birthday (April 26, 1785) — ornithological illustration in motion. Anniversary pick over day-of-week fallback; replaces today's earlier Spring Bloom doodle on a re-run. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="April 26, 2026 — Audubon's 241st Birthday">
  <title>Audubon · 241 — April 26, 2026</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#2a1d10"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c87a" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#c98b3b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c98b3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3d9a4"/>
      <stop offset="1" stop-color="#d4a85f"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.18  0 0 0 0 0.13  0 0 0 0 0.08  0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="softGlow" x="-0.4" y="-0.4" width="1.8" height="1.8">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- Bird silhouettes: stylized "M"-form gulls at various sizes -->
    <symbol id="bird" viewBox="-20 -10 40 20" overflow="visible">
      <path d="M -18 0 Q -10 -8 0 -2 Q 10 -8 18 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d"
          values="M -18 0 Q -10 -8 0 -2 Q 10 -8 18 0;
                  M -18 2 Q -10 -2 0 -1 Q 10 -2 18 2;
                  M -18 0 Q -10 -8 0 -2 Q 10 -8 18 0"
          dur="0.7s" repeatCount="indefinite"/>
      </path>
    </symbol>

    <!-- Big detailed bird (Audubon-style heron-ish silhouette) -->
    <symbol id="heron" viewBox="-60 -30 120 60" overflow="visible">
      <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
        <!-- body -->
        <path d="M -22 4 Q -8 -6 14 -2 Q 26 0 30 6 Q 14 8 -4 8 Q -18 8 -22 4 Z" fill="currentColor" fill-opacity="0.18"/>
        <!-- neck + head -->
        <path d="M 14 -2 Q 22 -10 28 -16 Q 34 -20 40 -18 L 46 -16 L 41 -14 L 44 -12"/>
        <!-- legs -->
        <path d="M -2 8 L -4 22 M 6 8 L 8 22"/>
        <!-- wing (animated) -->
        <path d="M -4 0 Q -10 -18 -28 -22 Q -36 -22 -40 -16 Q -28 -8 -10 -2 Z" fill="currentColor" fill-opacity="0.28">
          <animate attributeName="d"
            values="M -4 0 Q -10 -18 -28 -22 Q -36 -22 -40 -16 Q -28 -8 -10 -2 Z;
                    M -4 0 Q -14 -10 -32 -8 Q -38 -4 -36 2 Q -22 0 -10 -2 Z;
                    M -4 0 Q -10 -18 -28 -22 Q -36 -22 -40 -16 Q -28 -8 -10 -2 Z"
            dur="2.3s" repeatCount="indefinite"/>
        </path>
      </g>
    </symbol>

    <!-- Branch silhouette -->
    <symbol id="branch" viewBox="0 0 220 60" overflow="visible">
      <g fill="none" stroke="#4a3520" stroke-width="1.6" stroke-linecap="round">
        <path d="M 0 40 Q 60 30 110 22 T 220 8"/>
        <path d="M 60 32 Q 70 18 90 12"/>
        <path d="M 130 18 Q 150 8 180 4"/>
        <path d="M 90 12 Q 96 6 104 4"/>
      </g>
      <!-- leaves -->
      <g fill="#6b8a3a" fill-opacity="0.7">
        <ellipse cx="92" cy="11" rx="4" ry="2" transform="rotate(-25 92 11)"/>
        <ellipse cx="100" cy="6" rx="4" ry="2" transform="rotate(-20 100 6)"/>
        <ellipse cx="178" cy="5" rx="4" ry="2" transform="rotate(-15 178 5)"/>
        <ellipse cx="186" cy="3" rx="3" ry="1.6" transform="rotate(-10 186 3)"/>
      </g>
    </symbol>
  </defs>

  <!-- Sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Sun disc, low and warm -->
  <g>
    <circle cx="640" cy="135" r="80" fill="url(#sun)"/>
    <circle cx="640" cy="135" r="34" fill="#f6c87a" opacity="0.85" filter="url(#softGlow)"/>
    <circle cx="640" cy="135" r="26" fill="#fde2a8"/>
  </g>

  <!-- Distant horizon hills -->
  <path d="M 0 165 Q 120 150 220 158 Q 360 168 480 152 Q 600 138 720 150 Q 780 156 800 152 L 800 200 L 0 200 Z"
        fill="#1c1208" opacity="0.85"/>
  <path d="M 0 175 Q 160 168 320 172 Q 500 178 680 170 Q 760 167 800 170 L 800 200 L 0 200 Z"
        fill="#0f0905"/>

  <!-- Parchment plate behind the date -->
  <g transform="translate(40 36)">
    <rect x="0" y="0" width="360" height="118" rx="3" ry="3" fill="url(#parchment)" opacity="0.96"/>
    <rect x="0" y="0" width="360" height="118" rx="3" ry="3" fill="url(#parchment)" filter="url(#grain)"/>
    <!-- inner border -->
    <rect x="6" y="6" width="348" height="106" fill="none" stroke="#3a2410" stroke-width="0.8" opacity="0.55"/>
    <rect x="9" y="9" width="342" height="100" fill="none" stroke="#3a2410" stroke-width="0.4" opacity="0.4"/>

    <!-- Plate header -->
    <text x="180" y="26" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="11" letter-spacing="3"
          fill="#3a2410" opacity="0.78">PLATE CCXLI</text>

    <!-- The date — primary visual element -->
    <text x="180" y="62" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="34" font-weight="700" letter-spacing="1"
          fill="#2a1808">April 26, 2026</text>

    <!-- Subtitle -->
    <text x="180" y="84" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="13" font-style="italic"
          fill="#3a2410">Audubon · 241 years aloft</text>

    <!-- Hairline rule + flourish -->
    <line x1="60" y1="94" x2="300" y2="94" stroke="#3a2410" stroke-width="0.6" opacity="0.5"/>
    <text x="180" y="106" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" letter-spacing="4"
          fill="#3a2410" opacity="0.7">SUNDAY · BIRDS OF AMERICA</text>
  </g>

  <!-- Branch with leaves, low along the horizon (clear of the parchment plate) -->
  <g transform="translate(420 162)">
    <use href="#branch" width="260" height="50"/>
  </g>

  <!-- Heron perched at end of branch, silhouetted against the sun — gentle sway -->
  <g transform="translate(620 158)" color="#1a0f06">
    <g>
      <use href="#heron" width="140" height="70" x="-70" y="-35"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-1 0 0; 1.5 0 0; -1 0 0" dur="11s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <!-- Drifting flock — left to right, varied speeds and altitudes.
       Negative begins ensure several birds are mid-flight in static frame 0. -->
  <g color="#e6c98a" opacity="0.95">
    <g>
      <use href="#bird" x="-40" y="40" width="22" height="11"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 880 -8" dur="13s" begin="-4s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#bird" x="-40" y="56" width="16" height="8"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 880 -4" dur="17s" begin="-9s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#bird" x="-40" y="28" width="14" height="7"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 880 -10" dur="19s" begin="-12s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#bird" x="-40" y="68" width="20" height="10"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 880 0" dur="23s" begin="-6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- A few darker birds gliding right-to-left in front of the sun -->
  <g color="#1a0f06" opacity="0.9">
    <g>
      <use href="#bird" x="0" y="60" width="18" height="9"/>
      <animateTransform attributeName="transform" type="translate"
        values="820 0; -60 -6" dur="29s" begin="-14s" repeatCount="indefinite"/>
    </g>
    <g>
      <use href="#bird" x="0" y="44" width="14" height="7"/>
      <animateTransform attributeName="transform" type="translate"
        values="820 0; -60 4" dur="31s" begin="-22s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Faint paper-grain over the entire frame -->
  <rect width="800" height="200" fill="#000" opacity="0.0"/>

  <!-- Outer hairline frame, like an engraved plate -->
  <rect x="2" y="2" width="796" height="196" fill="none" stroke="#3a2410" stroke-width="0.6" opacity="0.55"/>
</svg>
