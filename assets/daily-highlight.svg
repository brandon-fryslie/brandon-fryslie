<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Java programming language 31st anniversary (May 23, 1995 — Sun Microsystems announced Java at SunWorld); steaming coffee cup, Duke-orange palette, JVM code drift, Write once run anywhere -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 23, 2026 — Java programming language 31st anniversary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#16182a"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F89820"/>
      <stop offset="1" stop-color="#8a3f10"/>
    </linearGradient>
    <linearGradient id="cupRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb74d"/>
      <stop offset="0.5" stop-color="#fff3e0"/>
      <stop offset="1" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="java" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd680"/>
      <stop offset="0.5" stop-color="#F89820"/>
      <stop offset="1" stop-color="#b8421a"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- subtle code drift, background layer -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#5382A1" opacity="0.16">
    <text y="18">public static void main(String[] args) { System.out.println("Hello, World!"); }
      <animate attributeName="x" values="-420;820" dur="29s" repeatCount="indefinite"/>
    </text>
    <text y="194">interface Anniversary&lt;T extends Year&gt; { T celebrate(); }
      <animate attributeName="x" values="-360;820" dur="31s" begin="-12s" repeatCount="indefinite"/>
    </text>
    <text y="42">// 1995 — write once, run anywhere — JVM bytecode for everyone
      <animate attributeName="x" values="-420;820" dur="41s" begin="-3s" repeatCount="indefinite"/>
    </text>
    <text y="172">try { future = new CompletableFuture&lt;&gt;(); } catch (RuntimeException e) { throw e; }
      <animate attributeName="x" values="-480;820" dur="43s" begin="-18s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- coffee cup -->
  <g transform="translate(110, 118)">
    <!-- saucer -->
    <ellipse cx="0" cy="50" rx="78" ry="9" fill="#5a2a0a" opacity="0.7"/>
    <ellipse cx="0" cy="46" rx="70" ry="7" fill="#a8541a"/>
    <!-- handle -->
    <path d="M 50,-18 C 86,-18 86,28 50,28" fill="none" stroke="url(#cup)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 50,-12 C 78,-12 78,22 50,22" fill="none" stroke="#1a0d05" stroke-width="3" stroke-linecap="round"/>
    <!-- cup body -->
    <path d="M -54,-30 L 54,-30 L 46,40 Q 0,56 -46,40 Z" fill="url(#cup)" stroke="#3a1810" stroke-width="1.5"/>
    <!-- highlight on cup -->
    <path d="M -44,-22 L -38,32" fill="none" stroke="#ffd680" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <!-- rim -->
    <ellipse cx="0" cy="-30" rx="54" ry="9" fill="url(#cupRim)"/>
    <ellipse cx="0" cy="-30" rx="44" ry="6.5" fill="#2a1408"/>
    <!-- coffee surface, slight ripple -->
    <ellipse cx="0" cy="-30" rx="40" ry="5.5" fill="#6b3410">
      <animate attributeName="ry" values="5.5;5;5.5" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-12" cy="-31" rx="6" ry="1.2" fill="#a86434" opacity="0.6">
      <animate attributeName="cx" values="-12;14;-12" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- steam wisps -->
  <g transform="translate(110, 78)" stroke-linecap="round" fill="none" stroke="url(#steam)" stroke-width="4">
    <path d="M -20,0 Q -28,-14 -16,-26 Q -4,-38 -16,-52 Q -28,-66 -10,-80" opacity="0.7">
      <animate attributeName="opacity" values="0;0.75;0" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,-12;0,8" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 2,0 Q 8,-14 -4,-26 Q -16,-38 -4,-52 Q 8,-66 -8,-80" opacity="0.7">
      <animate attributeName="opacity" values="0;0.85;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,-18;0,8" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </path>
    <path d="M 22,0 Q 16,-14 28,-26 Q 40,-38 28,-52 Q 16,-66 32,-80" opacity="0.7">
      <animate attributeName="opacity" values="0;0.7;0" dur="13s" begin="-4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,8;0,-15;0,8" dur="13s" begin="-4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Java wordmark -->
  <g transform="translate(228, 122)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="92" font-weight="900" fill="url(#java)" font-style="italic" filter="url(#glow)" letter-spacing="-3">
      Java
    </text>
    <!-- subtle accent underline -->
    <line x1="6" y1="12" x2="200" y2="12" stroke="#F89820" stroke-width="2.5" opacity="0.55"/>
    <line x1="6" y1="12" x2="40" y2="12" stroke="#ffd680" stroke-width="2.5"/>
  </g>

  <!-- 31 years badge -->
  <g transform="translate(490, 60)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="56" font-weight="900" fill="#ffd680" filter="url(#glow)" letter-spacing="-2">
      31
    </text>
    <text x="78" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14" font-weight="800" fill="#F89820" letter-spacing="2">
      YEARS
    </text>
    <text x="78" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="12" fill="#b0b0b0" letter-spacing="1.5" font-weight="600">
      1995 → 2026
    </text>
  </g>

  <!-- Date — primary readable element -->
  <text x="490" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" fill="#ffffff" font-weight="800" letter-spacing="0.3">
    May 23, 2026
  </text>

  <!-- Tagline -->
  <text x="490" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" fill="#5382A1" font-weight="700" letter-spacing="0.6">
    Write once, run anywhere
  </text>

  <!-- Footer note -->
  <text x="490" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#7a7a8a" font-style="italic" letter-spacing="0.4">
    announced at SunWorld '95 · Sun Microsystems
  </text>

  <!-- floating coffee beans -->
  <g fill="#3a1c08" opacity="0.55">
    <g transform="translate(40, 30)">
      <ellipse rx="7" ry="4.5" fill="#5a2a0a"/>
      <path d="M -6,0 Q 0,-2 6,0" stroke="#1a0d05" stroke-width="0.8" fill="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="23s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="translate" values="40,30;48,38;40,30" dur="13s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(760, 32)">
      <ellipse rx="6" ry="4" fill="#5a2a0a"/>
      <path d="M -5,0 Q 0,-1.6 5,0" stroke="#1a0d05" stroke-width="0.8" fill="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="19s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="translate" values="760,32;752,42;760,32" dur="17s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(745, 168)">
      <ellipse rx="7" ry="4.5" fill="#5a2a0a"/>
      <path d="M -6,0 Q 0,-2 6,0" stroke="#1a0d05" stroke-width="0.8" fill="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="29s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>
</svg>
