<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Netscape Communications IPO (August 9, 1995). 31st anniversary. On 9 August 1995 Netscape went public on NASDAQ (ticker NSCP): priced at $28, opened at $71, closed the day at $58.25, valuing a 16-month-old company that had never turned a profit at $2.2 billion — the moment web tech became public capital markets and the dot-com era started. Founders: Jim Clark and Marc Andreessen (who had co-authored NCSA Mosaic at UIUC). Composition on the 800x200 canvas: on the left half, a retro Netscape Navigator 90s browser window (light-grey chrome, red/yellow/green Mac-style traffic lights, Back/Fwd/Reload/Home button row, URL bar reading "http://home.netscape.com/", and in the upper-right the signature big-N badge with a small white meteor continually shooting across it — the throbber that meant "loading"). Inside the window: a green stock-chart line rockets from $28 up to a $58.25 peak, with dotted price gridlines, an axis labelled OPEN 28 / HIGH 74 / CLOSE 58.25, and an ascending trail of tiny green triangles. A dashed orbital-style progress dot travels along the chart line. On the right, a huge cream AUGUST 9, 2026 headline underlined by a green-to-cream sweep, a Netscape-green NETSCAPE IPO subhead followed by cream · 31 YEARS, italic amber tertiary NSCP · NASDAQ · 9 AUGUST 1995 · $2.2B, dim-cyan tertiary CLARK · ANDREESSEN · MOSAIC · MOZILLA, and a Georgia-italic caption "the day the web went public" with a blinking Navigator-N cursor at the base. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 9, 2026 — 31st anniversary of the Netscape Communications IPO (9 August 1995). On the left half, a retro 90s Netscape Navigator browser window with light-grey chrome, red/yellow/green traffic-light buttons, a Back/Forward/Reload/Home button row, a URL bar reading http://home.netscape.com/, and in the upper right the signature big N badge with a small white meteor continually shooting across it. Inside the window a green stock chart line rockets from $28 up to a $58.25 peak, with dotted price gridlines and an OPEN/HIGH/CLOSE axis label, and a dashed orbital dot travels along the chart line. On the right, a huge cream AUGUST 9, 2026 headline underlined by a green-to-cream sweep, a Netscape-green NETSCAPE IPO subhead trailed by cream 31 YEARS, italic amber NSCP · NASDAQ · 9 AUGUST 1995 · $2.2B tertiary, dim-cyan CLARK · ANDREESSEN · MOSAIC · MOZILLA tertiary, and a Georgia-italic 'the day the web went public' caption with a blinking Navigator-N cursor at the base.">
  <defs>
    <!-- Dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <!-- Retro browser chrome (light beige-grey) -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8e4d8"/>
      <stop offset="100%" stop-color="#cfc9b8"/>
    </linearGradient>
    <!-- Title bar (Netscape teal-ish grey) -->
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <!-- Inner content area (browser page, off-white) -->
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <!-- Netscape-N badge background (dark blue with stars, like the original throbber panel) -->
    <radialGradient id="nBadge" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%"   stop-color="#1a2a5a"/>
      <stop offset="70%"  stop-color="#0a1240"/>
      <stop offset="100%" stop-color="#050820"/>
    </radialGradient>

    <!-- Headline underline sweep: Netscape green → cream -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00c853" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#00c853" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#f0f6fc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f0f6fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Meteor trail gradient for the throbber -->
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Stock-line gradient (green surge, brighter toward the top) -->
    <linearGradient id="stockGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#00c853" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00c853" stop-opacity="0"/>
    </linearGradient>

    <!-- Reusable Netscape N letterform (stylized). Local origin at glyph top-left. -->
    <symbol id="netN" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <!-- Bold slanted N shape in cream, echoing the original Netscape mark -->
      <path d="M 18 18
               L 34 18
               L 66 68
               L 66 18
               L 82 18
               L 82 82
               L 66 82
               L 34 32
               L 34 82
               L 18 82 Z"
            fill="#f0f6fc"/>
    </symbol>
  </defs>

  <!-- ============ background ============ -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- Subtle background dots (faint star / packet field behind browser) -->
  <g fill="#7ee787" opacity="0.35">
    <circle cx="365" cy="30"  r="0.9"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="415" cy="18"  r="0.7"><animate attributeName="opacity" values="0.1;0.55;0.1"  dur="11s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="345" cy="180" r="0.7"><animate attributeName="opacity" values="0.1;0.6;0.1"   dur="13s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="12"  cy="26"  r="0.6"><animate attributeName="opacity" values="0.1;0.5;0.1"   dur="11s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="18"  cy="180" r="0.5"><animate attributeName="opacity" values="0.1;0.5;0.1"   dur="7s"  begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ RETRO BROWSER WINDOW (left ~340px) ============ -->
  <g>
    <!-- Drop shadow -->
    <rect x="20" y="24" width="322" height="158" rx="4" ry="4" fill="#000" opacity="0.55"/>

    <!-- Window body chrome -->
    <rect x="16" y="20" width="322" height="158" rx="4" ry="4" fill="url(#chrome)"/>

    <!-- Title bar -->
    <rect x="16" y="20" width="322" height="18" rx="4" ry="4" fill="url(#titlebar)"/>
    <rect x="16" y="30" width="322" height="8"  fill="url(#titlebar)"/>

    <!-- Traffic-light buttons (Mac 90s aesthetic) -->
    <circle cx="27" cy="29" r="3.2" fill="#ff6058" stroke="#8a3630" stroke-width="0.5"/>
    <circle cx="37" cy="29" r="3.2" fill="#ffbd2e" stroke="#8a6a1a" stroke-width="0.5"/>
    <circle cx="47" cy="29" r="3.2" fill="#28ca42" stroke="#1a7028" stroke-width="0.5"/>

    <!-- Title text -->
    <text x="177" y="33" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9.5" font-weight="700" fill="#f0f6fc" letter-spacing="0.4">
      Netscape — [The Netscape Home Page]
    </text>

    <!-- Toolbar row (buttons) -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
       font-size="8" font-weight="700" fill="#2d3748">
      <rect x="22" y="43" width="34" height="14" rx="2" fill="#dcd6c4" stroke="#a89e88" stroke-width="0.5"/>
      <text x="39" y="53" text-anchor="middle">Back</text>
      <rect x="60" y="43" width="34" height="14" rx="2" fill="#dcd6c4" stroke="#a89e88" stroke-width="0.5"/>
      <text x="77" y="53" text-anchor="middle">Fwd</text>
      <rect x="98" y="43" width="42" height="14" rx="2" fill="#dcd6c4" stroke="#a89e88" stroke-width="0.5"/>
      <text x="119" y="53" text-anchor="middle">Reload</text>
      <rect x="144" y="43" width="38" height="14" rx="2" fill="#dcd6c4" stroke="#a89e88" stroke-width="0.5"/>
      <text x="163" y="53" text-anchor="middle">Home</text>
    </g>

    <!-- Netscape N throbber badge (upper right of chrome) -->
    <g transform="translate(292 41)">
      <rect x="0" y="0" width="40" height="20" rx="2" fill="url(#nBadge)"/>
      <!-- tiny stars inside the badge -->
      <g fill="#ffffff" opacity="0.6">
        <circle cx="6"  cy="4"  r="0.5"/>
        <circle cx="34" cy="6"  r="0.5"/>
        <circle cx="30" cy="15" r="0.4"/>
        <circle cx="10" cy="15" r="0.4"/>
      </g>
      <!-- N glyph (centered, ~14px tall) -->
      <use href="#netN" x="13" y="3" width="14" height="14"/>
      <!-- Meteor: a small bright dot with a trailing streak, arcs across the badge -->
      <g>
        <line x1="-6" y1="4" x2="4" y2="4" stroke="url(#meteor)" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="4" cy="4" r="1.4" fill="#ffffff"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 0; 36 12; 0 0"
                          keyTimes="0;0.5;1"
                          dur="2.3s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- URL/Location bar -->
    <g>
      <text x="22" y="72"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="8" font-weight="700" fill="#2d3748">Location:</text>
      <rect x="60" y="63" width="272" height="12" rx="1" fill="#ffffff" stroke="#8a8270" stroke-width="0.6"/>
      <text x="64" y="72"
            font-family="Menlo, Monaco, 'Courier New', monospace"
            font-size="8" fill="#1e40af">http://home.netscape.com/</text>
    </g>

    <!-- Page content area (dark, so the green chart pops) -->
    <rect x="22" y="82" width="310" height="90" fill="url(#page)" stroke="#8a8270" stroke-width="0.6"/>

    <!-- Dotted gridlines inside the chart -->
    <g stroke="#2a3040" stroke-width="0.5" stroke-dasharray="2 3">
      <line x1="30" y1="98"  x2="326" y2="98"/>
      <line x1="30" y1="118" x2="326" y2="118"/>
      <line x1="30" y1="138" x2="326" y2="138"/>
      <line x1="30" y1="158" x2="326" y2="158"/>
    </g>

    <!-- Y-axis price labels -->
    <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="6.5" fill="#6a7480">
      <text x="316" y="100">$74</text>
      <text x="316" y="120">$58</text>
      <text x="316" y="140">$45</text>
      <text x="316" y="160">$28</text>
    </g>

    <!-- Chart title inside the page -->
    <text x="30" y="93"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="7.5" font-weight="700" fill="#c9d1d9" letter-spacing="0.5">NSCP · NASDAQ · 9 AUG 1995</text>

    <!-- Stock line fill (area under the curve) -->
    <path d="M 30 160
             L 55 158
             L 80 154
             L 105 150
             L 130 138
             L 155 124
             L 180 108
             L 205 95
             L 230 100
             L 255 115
             L 280 120
             L 300 120
             L 300 168
             L 30 168 Z"
          fill="url(#stockGlow)"/>

    <!-- Stock line itself (bright green surge) -->
    <path d="M 30 160
             L 55 158
             L 80 154
             L 105 150
             L 130 138
             L 155 124
             L 180 108
             L 205 95
             L 230 100
             L 255 115
             L 280 120
             L 300 120"
          fill="none" stroke="#00e676" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Small ascending triangles along the trail -->
    <g fill="#00e676">
      <polygon points="55,155 52,159 58,159"/>
      <polygon points="105,147 102,151 108,151"/>
      <polygon points="155,121 152,125 158,125"/>
      <polygon points="205,92  202,96  208,96"/>
    </g>

    <!-- Traveling dot on the line (progress marker) -->
    <circle r="2.2" fill="#ffffff" stroke="#00e676" stroke-width="1">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#stockPath"/>
      </animateMotion>
    </circle>
    <!-- Hidden path for the traveling dot -->
    <path id="stockPath" d="M 30 160 L 55 158 L 80 154 L 105 150 L 130 138 L 155 124 L 180 108 L 205 95 L 230 100 L 255 115 L 280 120 L 300 120"
          fill="none" stroke="none"/>

    <!-- Peak label -->
    <g>
      <line x1="205" y1="95" x2="205" y2="85" stroke="#00e676" stroke-width="0.6"/>
      <rect x="180" y="76" width="52" height="11" rx="1.5" fill="#00c853"/>
      <text x="206" y="84" text-anchor="middle"
            font-family="Menlo, Monaco, 'Courier New', monospace"
            font-size="7" font-weight="700" fill="#0d1117">HIGH  $74.00</text>
    </g>

    <!-- Bottom axis: OPEN / CLOSE small ticks -->
    <g font-family="Menlo, Monaco, 'Courier New', monospace" font-size="6" fill="#8b949e">
      <text x="30"  y="170">OPEN 28</text>
      <text x="290" y="170" text-anchor="end">CLOSE 58.25</text>
    </g>
  </g>

  <!-- ============ RIGHT HALF: typography stack ============ -->

  <!-- Huge cream headline: primary date -->
  <text x="360" y="60"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="1"
        fill="#f0f6fc">AUGUST 9, 2026</text>

  <!-- Underline sweep bar -->
  <rect x="360" y="70" width="308" height="2.8" fill="url(#sweep)" opacity="0.95">
    <animate attributeName="x" values="360;408;360" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- Subhead: Netscape-green NETSCAPE IPO with cream · 31 YEARS trailing -->
  <g>
    <text x="360" y="102"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="22" font-weight="800" letter-spacing="1.6"
          fill="#00e676">NETSCAPE IPO</text>
    <text x="552" y="102"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="15" font-weight="700" letter-spacing="1.4"
          fill="#f0f6fc">·  31 YEARS</text>
  </g>

  <!-- Amber italic tertiary -->
  <text x="360" y="126"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" letter-spacing="0.8"
        fill="#f2cc60">NSCP  ·  NASDAQ  ·  9 AUGUST 1995  ·  $2.2B</text>

  <!-- Dim-cyan italic tertiary -->
  <text x="360" y="144"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" letter-spacing="1.3"
        fill="#79c0ff" opacity="0.9">CLARK  ·  ANDREESSEN  ·  MOSAIC  ·  MOZILLA</text>

  <!-- Georgia italic caption + blinking N cursor -->
  <g>
    <text x="360" y="175"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="13" font-style="italic"
          fill="#c9d1d9">&#8220;the day the web went public.&#8221;</text>
    <!-- Blinking Navigator-N cursor -->
    <g transform="translate(600 163)">
      <rect x="0" y="0" width="14" height="14" rx="1.5" fill="url(#nBadge)">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <use href="#netN" x="1" y="1" width="12" height="12">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>
</svg>
