<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Leif Erikson Day (October 9) -->
<!-- about:
On 9 September 1964, President Lyndon Johnson proclaimed October 9 Leif Erikson Day, honouring the Norse explorer whose crews reached North America around the year 1000 — some five centuries before Columbus. The date is not Leif's birthday or landing; it marks the 1825 arrival of the sloop Restauration at New York harbour with the first organised party of Norwegian immigrants to the United States. The sagas place Leif in a camp he called Vinland somewhere along the Atlantic coast, and in 1960 the Norwegian pair Helge and Anne Stine Ingstad found exactly that camp at L'Anse aux Meadows, Newfoundland — the only confirmed Norse site in the Americas, radiocarbon-dated to around 1000 CE.

The scene is a widescreen view of a longship under aurora. On the left, the ship — carved dragon prow, striped red-and-cream sail, round shields along the gunwale — glides across a dark sea, rocking gently with the swell. Above it, aurora bands drift in slow green and violet across a starry sky, stars twinkling at prime intervals. On the right, a cream OCTOBER 9, 2026 headline sits over a double aurora bar, a green LEIF ERIKSON DAY subhead, an italic amber VINLAND · c. 1000 CE tertiary, a dim NORSE · LONGSHIP · ATLANTIC · SAGA · NEWFOUNDLAND roster, and a Georgia-italic 'Westward across the sea.' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for October 9, 2026 — Leif Erikson Day. A Norse longship with a carved dragon prow and a striped red-and-cream sail glides across a dark sea under aurora bands drifting in slow green and violet, stars twinkling above. On the right, a cream OCTOBER 9, 2026 headline sits over a double aurora bar, a green LEIF ERIKSON DAY subhead, an italic amber VINLAND · c. 1000 CE tertiary, a dim NORSE · LONGSHIP · ATLANTIC · SAGA · NEWFOUNDLAND roster, and a Georgia-italic 'Westward across the sea.' caption at the base.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.55" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#060e1c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1e36"/>
      <stop offset="1" stop-color="#02070f"/>
    </linearGradient>
    <linearGradient id="auroraA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4de89b" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#4de89b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4de89b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a876ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a876ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a876ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ad8e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ad8e8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#5ad8e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecd0"/>
      <stop offset="1" stop-color="#c8b78a"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2e"/>
      <stop offset="1" stop-color="#2a1808"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Aurora bands (drift and pulse) -->
  <g>
    <path d="M -20 10 Q 100 50, 220 25 T 400 40 L 400 95 Q 220 65, 100 100 T -20 80 Z" fill="url(#auroraA)">
      <animate attributeName="opacity" values="0.45;0.95;0.55;0.8;0.45" dur="17s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 22 -4; -8 2; 0 0" dur="23s" repeatCount="indefinite"/>
    </path>
    <path d="M -20 5 Q 120 35, 260 15 T 440 25 L 440 70 Q 260 50, 120 80 T -20 60 Z" fill="url(#auroraB)">
      <animate attributeName="opacity" values="0.3;0.75;0.4;0.6;0.3" dur="19s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -16 3; 10 -2; 0 0" dur="29s" repeatCount="indefinite"/>
    </path>
    <path d="M -20 32 Q 100 58, 220 42 T 400 52 L 400 68 Q 220 58, 100 78 T -20 68 Z" fill="url(#auroraC)">
      <animate attributeName="opacity" values="0.2;0.6;0.3;0.5;0.2" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Stars -->
  <g fill="#f4ecd0">
    <circle cx="40" cy="18" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="88" cy="10" r="0.7"><animate attributeName="opacity" values="0.5;1;0.5" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="22" r="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="13s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="8" r="0.8"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="20" r="0.9"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="12" r="0.6"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="358" cy="22" r="0.7"><animate attributeName="opacity" values="0.4;0.95;0.4" dur="17s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="42" r="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="19s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="48" r="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="11s" begin="-8s" repeatCount="indefinite"/></circle>
    <circle cx="296" cy="42" r="0.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="13s" begin="-9s" repeatCount="indefinite"/></circle>
    <circle cx="68" cy="30" r="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="23s" begin="-11s" repeatCount="indefinite"/></circle>
    <circle cx="246" cy="34" r="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="23s" begin="-13s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Sea -->
  <rect y="135" width="800" height="65" fill="url(#sea)"/>

  <!-- Horizon aurora glow -->
  <rect y="132" width="800" height="5" fill="#4de89b" opacity="0.1"/>

  <!-- Sea ripples -->
  <g fill="none" stroke="#5ad8e8">
    <path d="M 0 150 Q 60 147, 120 150 T 240 150 T 360 150 T 480 150 T 600 150 T 720 150 T 800 150" stroke-width="0.6" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 164 Q 60 161, 120 164 T 240 164 T 360 164 T 480 164 T 600 164 T 720 164 T 800 164" stroke-width="0.5" opacity="0.22">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 180 Q 60 177, 120 180 T 240 180 T 360 180 T 480 180 T 600 180 T 720 180 T 800 180" stroke-width="0.5" opacity="0.22">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="17s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- =================== LONGSHIP (rocks on the swell) =================== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.6 180 148;1.6 180 148;-1.6 180 148" dur="11s" repeatCount="indefinite"/>

    <!-- Reflection -->
    <ellipse cx="180" cy="162" rx="112" ry="2.6" fill="#8a5a2e" opacity="0.14"/>

    <!-- Hull (banana shape) -->
    <path d="M 82 142
             Q 92 158, 180 160
             Q 268 158, 278 142
             Q 262 150, 180 150
             Q 98 150, 82 142 Z"
          fill="url(#hullGrad)" stroke="#120a04" stroke-width="0.7"/>

    <!-- Hull strake line -->
    <path d="M 92 141 Q 100 143, 180 143 Q 260 143, 268 141" stroke="#5a3818" stroke-width="1.6" fill="none"/>

    <!-- Shields along gunwale -->
    <g stroke="#120a04" stroke-width="0.5">
      <circle cx="104" cy="140" r="4.6" fill="#c84848"/>
      <circle cx="104" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="122" cy="140" r="4.6" fill="#e8c868"/>
      <circle cx="122" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="140" cy="140" r="4.6" fill="#c84848"/>
      <circle cx="140" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="158" cy="140" r="4.6" fill="#e8c868"/>
      <circle cx="158" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="176" cy="140" r="4.6" fill="#c84848"/>
      <circle cx="176" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="194" cy="140" r="4.6" fill="#e8c868"/>
      <circle cx="194" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="212" cy="140" r="4.6" fill="#c84848"/>
      <circle cx="212" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="230" cy="140" r="4.6" fill="#e8c868"/>
      <circle cx="230" cy="140" r="1.1" fill="#f4ecd0"/>
      <circle cx="248" cy="140" r="4.6" fill="#c84848"/>
      <circle cx="248" cy="140" r="1.1" fill="#f4ecd0"/>
    </g>

    <!-- Prow (dragon head on the right) -->
    <path d="M 278 142
             Q 294 136, 298 122
             Q 302 110, 294 104
             Q 304 108, 304 98
             Q 296 96, 290 106
             Q 294 118, 286 128
             Q 282 136, 278 142 Z"
          fill="#8a5a2e" stroke="#120a04" stroke-width="0.6"/>
    <!-- Dragon eye -->
    <circle cx="295" cy="116" r="1.3" fill="#c84848"/>
    <!-- Dragon teeth (tiny notches) -->
    <path d="M 290 123 l 1 2 l 1 -2 l 1 2 l 1 -2" stroke="#f4ecd0" stroke-width="0.5" fill="none"/>

    <!-- Stern (back curl on the left) -->
    <path d="M 82 142
             Q 68 136, 64 122
             Q 60 110, 68 104
             Q 58 108, 58 98
             Q 66 96, 72 106
             Q 68 118, 76 128
             Q 80 136, 82 142 Z"
          fill="#8a5a2e" stroke="#120a04" stroke-width="0.6"/>

    <!-- Mast -->
    <line x1="180" y1="140" x2="180" y2="55" stroke="#4a2e14" stroke-width="2.4"/>
    <!-- Yardarm -->
    <line x1="124" y1="60" x2="236" y2="60" stroke="#4a2e14" stroke-width="1.8"/>
    <!-- Yardarm caps -->
    <circle cx="124" cy="60" r="1.4" fill="#4a2e14"/>
    <circle cx="236" cy="60" r="1.4" fill="#4a2e14"/>

    <!-- Sail with gentle billow -->
    <path d="M 124 60 Q 180 68, 236 60 L 236 130 Q 180 138, 124 130 Z" fill="url(#sailGrad)" stroke="#4a2e14" stroke-width="0.6">
      <animate attributeName="d"
               values="M 124 60 Q 180 68, 236 60 L 236 130 Q 180 138, 124 130 Z;
                       M 124 60 Q 180 74, 236 60 L 236 130 Q 180 134, 124 130 Z;
                       M 124 60 Q 180 68, 236 60 L 236 130 Q 180 138, 124 130 Z"
               dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- Red horizontal stripes -->
    <path d="M 124 80 Q 180 86, 236 80 L 236 90 Q 180 94, 124 90 Z" fill="#c84848" opacity="0.92">
      <animate attributeName="d"
               values="M 124 80 Q 180 86, 236 80 L 236 90 Q 180 94, 124 90 Z;
                       M 124 80 Q 180 90, 236 80 L 236 90 Q 180 92, 124 90 Z;
                       M 124 80 Q 180 86, 236 80 L 236 90 Q 180 94, 124 90 Z"
               dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 124 104 Q 180 110, 236 104 L 236 114 Q 180 118, 124 114 Z" fill="#c84848" opacity="0.92">
      <animate attributeName="d"
               values="M 124 104 Q 180 110, 236 104 L 236 114 Q 180 118, 124 114 Z;
                       M 124 104 Q 180 114, 236 104 L 236 114 Q 180 116, 124 114 Z;
                       M 124 104 Q 180 110, 236 104 L 236 114 Q 180 118, 124 114 Z"
               dur="7s" repeatCount="indefinite"/>
    </path>
    <!-- Rigging -->
    <line x1="180" y1="55" x2="124" y2="60" stroke="#2a1808" stroke-width="0.5" opacity="0.75"/>
    <line x1="180" y1="55" x2="236" y2="60" stroke="#2a1808" stroke-width="0.5" opacity="0.75"/>
  </g>

  <!-- Separator -->
  <line x1="340" y1="30" x2="340" y2="170" stroke="#1a2030" stroke-width="0.6" opacity="0.5"/>

  <!-- =================== TEXT STACK (right half) =================== -->

  <!-- Date headline -->
  <text x="580" y="58" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f4ecd0" letter-spacing="2.0">
    OCTOBER 9, 2026
  </text>

  <!-- Twin aurora bar under headline -->
  <path d="M 410 74 Q 450 68, 490 74 T 570 74 T 650 74 T 730 74 T 770 74" fill="none" stroke="#4de89b" stroke-width="2.4" opacity="0.95"/>
  <path d="M 410 80 Q 450 74, 490 80 T 570 80 T 650 80 T 730 80 T 770 80" fill="none" stroke="#a876ff" stroke-width="1.3" opacity="0.7"/>

  <!-- Subhead -->
  <text x="580" y="104" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="800" letter-spacing="4.0" fill="#6aeab0">
    LEIF ERIKSON DAY
  </text>

  <!-- Tertiary italic -->
  <text x="580" y="124" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#c8a858" letter-spacing="0.6">
    VINLAND &#183; c. 1000 CE
  </text>

  <!-- Roster -->
  <text x="580" y="145" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.8" font-weight="700" fill="#8aa0c8" letter-spacing="2.4" opacity="0.95">
    NORSE &#183; LONGSHIP &#183; ATLANTIC &#183; SAGA &#183; NEWFOUNDLAND
  </text>

  <!-- Caption -->
  <text x="580" y="188" text-anchor="middle"
        font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#c8d0e0" opacity="0.95">
    &#8220;Westward across the sea.&#8221;
  </text>
</svg>
