<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: CNN launches as the first 24-hour news network — 46th anniversary (June 1, 1980, Cable News Network, Atlanta; founded by Ted Turner); retro CRT studio aesthetic with broadcast satellite, scan lines, "ON AIR" badge, scrolling red ticker tape, 1980s broadcast palette of red/white/black with cool monitor glow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 1, 2026 — CNN 46th anniversary; the first 24-hour news network launches June 1, 1980">
  <defs>
    <!-- Studio background gradient -->
    <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0a0e16"/>
      <stop offset="0.5"  stop-color="#10151f"/>
      <stop offset="1"    stop-color="#080b12"/>
    </linearGradient>

    <!-- CRT bezel -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3a3a3e"/>
      <stop offset="0.5" stop-color="#1a1a1c"/>
      <stop offset="1"   stop-color="#28282c"/>
    </linearGradient>

    <!-- CRT screen with phosphor glow -->
    <radialGradient id="screen" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0"   stop-color="#143055"/>
      <stop offset="0.5" stop-color="#0b1830"/>
      <stop offset="1"   stop-color="#04081a"/>
    </radialGradient>

    <!-- Broadcast red -->
    <linearGradient id="newsRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#dc1a3a"/>
      <stop offset="1"   stop-color="#8a0a1c"/>
    </linearGradient>

    <!-- Satellite dish metal -->
    <radialGradient id="dish" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0"   stop-color="#e6e6ea"/>
      <stop offset="0.5" stop-color="#8a8a92"/>
      <stop offset="1"   stop-color="#2a2a2e"/>
    </radialGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="3" fill="#0b1830"/>
      <rect width="2" height="1" fill="#000" opacity="0.35"/>
    </pattern>

    <!-- TV static (subtle) -->
    <filter id="static" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.4" numOctaves="2" seed="3" result="n">
        <animate attributeName="seed" values="1;9;3;7;2" dur="0.6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.4
                                                  0 0 0 0 0.6
                                                  0 0 0 0 0.9
                                                  0 0 0 0.18 0"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
      <feComponentTransfer><feA type="linear" slope="1.4"/></feComponentTransfer>
    </filter>

    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- Clip for TV screen so static doesn't bleed -->
    <clipPath id="screenClip">
      <rect x="46" y="46" width="178" height="108" rx="8"/>
    </clipPath>

    <!-- Clip for the ticker -->
    <clipPath id="tickerClip">
      <rect x="0" y="174" width="800" height="26"/>
    </clipPath>
  </defs>

  <!-- ===== Studio background ===== -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#studio)"/>

  <!-- subtle global scanlines -->
  <rect width="800" height="174" fill="url(#scanlines)" opacity="0.08"/>

  <!-- ===== Satellite dish (upper right) emitting broadcast waves ===== -->
  <g transform="translate(680 70)">
    <!-- Broadcast wave rings (expand and fade) -->
    <g fill="none" stroke="#dc1a3a" stroke-width="1.4" opacity="0.85">
      <circle r="14">
        <animate attributeName="r"       values="14;72;14" dur="7s"  repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0;0.9" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="14" stroke="#ffffff">
        <animate attributeName="r"       values="14;72;14" dur="7s"  begin="-2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0;0.7" dur="7s" begin="-2.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="14" stroke="#4488dd">
        <animate attributeName="r"       values="14;72;14" dur="7s"  begin="-4.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="7s" begin="-4.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Dish (parabolic) -->
    <g>
      <!-- Mounting pole + base -->
      <rect x="-2" y="14" width="4" height="36" fill="#3a3a3e"/>
      <rect x="-12" y="50" width="24" height="6" fill="#2a2a2e"/>
      <!-- Parabolic dish (ellipse for foreshortened look) -->
      <ellipse cx="0" cy="0" rx="34" ry="22" fill="url(#dish)" stroke="#1a1a1e" stroke-width="0.8"/>
      <ellipse cx="0" cy="-1" rx="28" ry="17" fill="none" stroke="#5a5a62" stroke-width="0.5" opacity="0.7"/>
      <ellipse cx="0" cy="-2" rx="20" ry="12" fill="none" stroke="#5a5a62" stroke-width="0.4" opacity="0.5"/>
      <!-- LNB/feed horn on tripod arm -->
      <path d="M 0 0 L 14 -14" stroke="#3a3a3e" stroke-width="1.4"/>
      <path d="M 0 0 L -14 -14" stroke="#3a3a3e" stroke-width="1.4"/>
      <circle cx="0" cy="-14" r="3.4" fill="#dc1a3a" filter="url(#redGlow)"/>
      <circle cx="0" cy="-14" r="2" fill="#ff5070"/>
    </g>

    <!-- Subtle label "UPLINK" -->
    <text x="0" y="68" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6" letter-spacing="2.6" fill="#7a8aa0" opacity="0.85">UPLINK · LIVE</text>
  </g>

  <!-- ===== CRT Television (left) ===== -->
  <g>
    <!-- Outer cabinet -->
    <rect x="30" y="30" width="210" height="140" rx="14" fill="url(#bezel)" stroke="#000" stroke-width="1"/>
    <!-- Inner bezel inset -->
    <rect x="40" y="40" width="190" height="120" rx="10" fill="#0a0a0c" stroke="#48484c" stroke-width="0.8"/>
    <!-- Screen (clipped) -->
    <g clip-path="url(#screenClip)">
      <rect x="46" y="46" width="178" height="108" rx="8" fill="url(#screen)"/>
      <!-- Static noise overlay (animated) -->
      <rect x="46" y="46" width="178" height="108" filter="url(#static)" opacity="0.55"/>
      <!-- Screen scanlines -->
      <rect x="46" y="46" width="178" height="108" fill="url(#scanlines)" opacity="0.45"/>

      <!-- Drifting horizontal "tracking" line -->
      <rect x="46" y="60" width="178" height="1.4" fill="#ffffff" opacity="0.18">
        <animate attributeName="y" values="46;154;46" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.05;0.28;0.05" dur="11s" repeatCount="indefinite"/>
      </rect>

      <!-- "News studio" abstract content INSIDE the screen -->
      <!-- silhouetted anchor desk in front of a blue horizon -->
      <rect x="46" y="118" width="178" height="36" fill="#040810" opacity="0.95"/>
      <!-- anchor head silhouette -->
      <g fill="#04081a" opacity="0.95">
        <ellipse cx="135" cy="116" rx="14" ry="16"/>
        <path d="M 110 132 Q 135 122 160 132 L 160 144 L 110 144 Z"/>
      </g>
      <!-- desk -->
      <rect x="58" y="132" width="154" height="14" fill="#1a2a48" opacity="0.9"/>
      <!-- glowing horizon line behind anchor -->
      <rect x="46" y="116" width="178" height="1" fill="#4488dd" opacity="0.75" filter="url(#softGlow)"/>

      <!-- Lower-third graphic bar (red) -->
      <rect x="46" y="140" width="178" height="10" fill="url(#newsRed)"/>
      <text x="56" y="147.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="6.4" font-weight="800" fill="#ffffff" letter-spacing="1.4">BREAKING NEWS</text>
      <rect x="156" y="142.4" width="60" height="5.6" fill="#ffffff" opacity="0.92"/>
      <text x="186" y="147"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="5" font-weight="700" text-anchor="middle" fill="#8a0a1c" letter-spacing="0.6">CABLE NEWS NETWORK</text>

      <!-- "Channel" digits in upper-left corner of screen -->
      <text x="54" y="62" font-family="Courier New, monospace" font-size="7"
            font-weight="700" fill="#4488dd" opacity="0.85" letter-spacing="0.8">CH · 06</text>

      <!-- Time digit in upper-right -->
      <text x="216" y="62" text-anchor="end" font-family="Courier New, monospace"
            font-size="7" font-weight="700" fill="#dc1a3a" opacity="0.95" letter-spacing="0.8">
        LIVE
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </text>

      <!-- Stylized CNN-esque big monogram in screen-center, muted -->
      <text x="135" y="100" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="34" font-weight="900" fill="#ffffff" opacity="0.92" letter-spacing="2"
            filter="url(#softGlow)">CNN</text>
      <text x="135" y="106" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="6.5" font-weight="700" fill="#8aa0c8" opacity="0.75" letter-spacing="2.4">CABLE NEWS NETWORK</text>

      <!-- vertical color bars (flash briefly to suggest signal test) -->
      <g opacity="0">
        <rect x="46"  y="46" width="29" height="108" fill="#ffffff"/>
        <rect x="76"  y="46" width="29" height="108" fill="#e8c060"/>
        <rect x="106" y="46" width="29" height="108" fill="#4dc8c8"/>
        <rect x="136" y="46" width="29" height="108" fill="#48c060"/>
        <rect x="166" y="46" width="29" height="108" fill="#c848c8"/>
        <rect x="196" y="46" width="28" height="108" fill="#dc1a3a"/>
        <animate attributeName="opacity" values="0;0;0;0.55;0;0;0;0;0;0;0" dur="13s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- TV bezel chrome trim under the screen -->
    <rect x="40" y="160" width="190" height="6" rx="2" fill="#1a1a1c"/>
    <!-- Speakers / vents -->
    <g fill="#0a0a0c" stroke="#3a3a3e" stroke-width="0.4">
      <circle cx="56"  cy="166" r="1.6"/>
      <circle cx="64"  cy="166" r="1.6"/>
      <circle cx="72"  cy="166" r="1.6"/>
    </g>
    <!-- Channel knobs -->
    <g>
      <circle cx="208" cy="166" r="3.4" fill="#2a2a2e" stroke="#48484c" stroke-width="0.6"/>
      <line x1="208" y1="163.5" x2="208" y2="166" stroke="#e8c060" stroke-width="0.9"/>
      <circle cx="220" cy="166" r="3.4" fill="#2a2a2e" stroke="#48484c" stroke-width="0.6"/>
      <line x1="220" y1="163.5" x2="220" y2="166" stroke="#e8c060" stroke-width="0.9"/>
    </g>

    <!-- ON AIR badge on top of cabinet -->
    <g transform="translate(135 24)">
      <rect x="-26" y="-9" width="52" height="14" rx="2" fill="url(#newsRed)" stroke="#3a0010" stroke-width="0.6"/>
      <rect x="-26" y="-9" width="52" height="14" rx="2" fill="url(#newsRed)" opacity="0.5" filter="url(#redGlow)">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="-1" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="8" font-weight="900" fill="#ffffff" letter-spacing="2.2">ON AIR</text>
      <circle cx="-19" cy="-2" r="1.6" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ===== Central typography zone ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Top thin red banner with all-caps subhead -->
    <rect x="270" y="34" width="376" height="14" fill="url(#newsRed)"/>
    <text x="458" y="44" text-anchor="middle"
          font-size="8.5" font-weight="800" fill="#ffffff" letter-spacing="3.6">
      LIVE FROM ATLANTA · CABLE NEWS NETWORK · 24 HOURS
    </text>

    <!-- Big date -->
    <text x="458" y="98" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="40" font-weight="900" fill="#ffffff" letter-spacing="3.5"
          filter="url(#softGlow)">
      JUNE 1 · 2026
    </text>

    <!-- Italic kicker -->
    <text x="458" y="118" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="11" font-style="italic" fill="#e8c060" letter-spacing="1.4">
      The Cable News Network — 46 years on the air
    </text>

    <!-- Bottom commemorative line -->
    <text x="458" y="138" text-anchor="middle"
          font-size="9" fill="#a8b8d0" letter-spacing="3"
          font-weight="600">
      JUNE 1, 1980 — TED TURNER FLIPS THE SWITCH
    </text>

    <!-- Tiny attribution under that -->
    <text x="458" y="152" text-anchor="middle"
          font-size="7" fill="#6a7890" letter-spacing="2.2" font-style="italic">
      Atlanta · 1 CNN Center · channel 24/7
    </text>
  </g>

  <!-- Decorative corner brackets on the typography block -->
  <g stroke="#dc1a3a" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M 274 56 L 274 64 M 274 56 L 282 56"/>
    <path d="M 642 56 L 642 64 M 642 56 L 634 56"/>
    <path d="M 274 156 L 274 148 M 274 156 L 282 156"/>
    <path d="M 642 156 L 642 148 M 642 156 L 634 156"/>
  </g>

  <!-- ===== Scrolling ticker tape at bottom ===== -->
  <g clip-path="url(#tickerClip)">
    <rect x="0" y="174" width="800" height="26" fill="url(#newsRed)"/>
    <!-- 'BREAKING' tab on the left -->
    <rect x="0" y="174" width="92" height="26" fill="#0a0a0c"/>
    <text x="46" y="191" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1.6">BREAKING</text>
    <!-- skewed separator -->
    <polygon points="92,174 102,174 92,200 82,200" fill="#0a0a0c"/>

    <!-- ticker text content (duplicated, animated horizontally) -->
    <g>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.4" y="191">
        <tspan x="105">★ JUNE 1, 1980 · CNN BECOMES THE FIRST 24-HOUR NEWS NETWORK · ATLANTA · FOUNDED BY TED TURNER · ★ ON THE AIR FOR 46 YEARS · LIVE · LIVE · LIVE · ★ </tspan>
        <tspan x="1380">★ JUNE 1, 1980 · CNN BECOMES THE FIRST 24-HOUR NEWS NETWORK · ATLANTA · FOUNDED BY TED TURNER · ★ ON THE AIR FOR 46 YEARS · LIVE · LIVE · LIVE · ★ </tspan>
        <animate attributeName="x" from="0" to="-1275" dur="29s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- subtle top edge highlight on ticker -->
    <rect x="0" y="174" width="800" height="1.4" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- ===== Vignette ===== -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1"   stop-color="#000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="800" height="200" fill="url(#vignette)" pointer-events="none"/>
</svg>
