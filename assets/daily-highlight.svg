<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: World Penguin Day (April 25). Picked to avoid repeating today's earlier Hubble run and yesterday's DNA Day. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="April 25, 2026 — World Penguin Day">
  <title>World Penguin Day — April 25, 2026</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#142036"/>
      <stop offset="100%" stop-color="#1f3a5e"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="55%" stop-color="#7ee787" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f1ff"/>
      <stop offset="100%" stop-color="#6f88af"/>
    </linearGradient>

    <radialGradient id="penguinBody" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Aurora ribbon -->
  <path d="M0,25 Q200,5 400,35 T800,25 L800,95 Q600,115 400,85 T0,95 Z" fill="url(#aurora)" opacity="0.6">
    <animate attributeName="d"
      values="M0,25 Q200,5 400,35 T800,25 L800,95 Q600,115 400,85 T0,95 Z;
              M0,35 Q200,15 400,25 T800,35 L800,85 Q600,105 400,95 T0,85 Z;
              M0,25 Q200,5 400,35 T800,25 L800,95 Q600,115 400,85 T0,95 Z"
      dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="11s" repeatCount="indefinite"/>
  </path>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="22" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="155" cy="14" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="28" r="0.8"><animate attributeName="opacity" values="0.5;1;0.5" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="20" r="1"/>
    <circle cx="585" cy="38" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="18" r="0.9"/>
    <circle cx="745" cy="48" r="1"><animate attributeName="opacity" values="1;0.4;1" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="50" r="0.7"/>
    <circle cx="105" cy="58" r="0.8"/>
  </g>

  <!-- Snowflakes drifting -->
  <g fill="#ffffff">
    <circle cx="40" cy="0" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0,-10; 25,210" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="0" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0,-10; -18,220" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="0" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0,-10; 12,215" dur="7s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="7s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="490" cy="0" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0,-10; -22,210" dur="11s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="11s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="630" cy="0" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0,-10; 18,220" dur="13s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="13s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="760" cy="0" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0,-10; -10,210" dur="11s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="11s" repeatCount="indefinite" begin="4s"/>
    </circle>
    <circle cx="240" cy="0" r="1.4">
      <animateTransform attributeName="transform" type="translate" values="0,-10; 14,215" dur="13s" repeatCount="indefinite" begin="5s"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="13s" repeatCount="indefinite" begin="5s"/>
    </circle>
    <circle cx="555" cy="0" r="1.6">
      <animateTransform attributeName="transform" type="translate" values="0,-10; -16,220" dur="7s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="7s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Ice shelf -->
  <path d="M0,168 Q200,160 400,164 T800,166 L800,200 L0,200 Z" fill="url(#ice)"/>
  <path d="M0,176 Q200,170 400,173 T800,175 L800,200 L0,200 Z" fill="#ffffff" opacity="0.55"/>

  <!-- Subtle moon glow behind date -->
  <circle cx="400" cy="98" r="70" fill="#ffffff" opacity="0.06" filter="url(#glow)"/>

  <!-- Prominent date -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="100" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="2">April 25, 2026</text>
    <text x="400" y="128" font-size="13" font-weight="600" fill="#7ee787" letter-spacing="6">W O R L D &#183; P E N G U I N &#183; D A Y</text>
  </g>

  <!-- Penguin: large, walking left side -->
  <g transform="translate(150,128)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 0 38; 5 0 38; -5 0 38" dur="2.2s" repeatCount="indefinite"/>
      <!-- body -->
      <ellipse cx="0" cy="22" rx="16" ry="22" fill="url(#penguinBody)"/>
      <!-- belly -->
      <ellipse cx="0" cy="25" rx="10" ry="17" fill="#f5f7fb"/>
      <!-- left wing -->
      <ellipse cx="-15" cy="18" rx="5" ry="14" fill="#0a0a0d">
        <animateTransform attributeName="transform" type="rotate" values="-15 -15 8; 10 -15 8; -15 -15 8" dur="1.7s" repeatCount="indefinite"/>
      </ellipse>
      <!-- right wing -->
      <ellipse cx="15" cy="18" rx="5" ry="14" fill="#0a0a0d">
        <animateTransform attributeName="transform" type="rotate" values="15 15 8; -10 15 8; 15 15 8" dur="1.7s" repeatCount="indefinite"/>
      </ellipse>
      <!-- head -->
      <circle cx="0" cy="-2" r="12" fill="url(#penguinBody)"/>
      <!-- white face patch -->
      <ellipse cx="0" cy="2" rx="7" ry="6" fill="#f5f7fb"/>
      <!-- eyes -->
      <circle cx="-4" cy="-3" r="2" fill="#ffffff"/>
      <circle cx="4" cy="-3" r="2" fill="#ffffff"/>
      <circle cx="-4" cy="-3" r="1.1" fill="#0d1117"/>
      <circle cx="4" cy="-3" r="1.1" fill="#0d1117"/>
      <!-- beak -->
      <polygon points="-2.5,2 2.5,2 0,7" fill="#f0a500"/>
      <!-- feet -->
      <ellipse cx="-6" cy="46" rx="5" ry="2.4" fill="#f0a500"/>
      <ellipse cx="6" cy="46" rx="5" ry="2.4" fill="#f0a500"/>
    </g>
  </g>

  <!-- Penguin: medium, right side -->
  <g transform="translate(625,134)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="5 0 32; -5 0 32; 5 0 32" dur="2.6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="20" rx="13" ry="18" fill="url(#penguinBody)"/>
      <ellipse cx="0" cy="22" rx="8" ry="14" fill="#f5f7fb"/>
      <ellipse cx="-12" cy="16" rx="4" ry="11" fill="#0a0a0d"/>
      <ellipse cx="12" cy="16" rx="4" ry="11" fill="#0a0a0d"/>
      <circle cx="0" cy="-1" r="10" fill="url(#penguinBody)"/>
      <ellipse cx="0" cy="2" rx="6" ry="5" fill="#f5f7fb"/>
      <circle cx="-3.5" cy="-2" r="1.7" fill="#ffffff"/>
      <circle cx="3.5" cy="-2" r="1.7" fill="#ffffff"/>
      <circle cx="-3.5" cy="-2" r="0.9" fill="#0d1117"/>
      <circle cx="3.5" cy="-2" r="0.9" fill="#0d1117"/>
      <polygon points="-2,2 2,2 0,5.5" fill="#f0a500"/>
      <ellipse cx="-5" cy="40" rx="4" ry="2" fill="#f0a500"/>
      <ellipse cx="5" cy="40" rx="4" ry="2" fill="#f0a500"/>
    </g>
  </g>

  <!-- Penguin: chick, smallest, far right -->
  <g transform="translate(710,148)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 22; 4 0 22; -4 0 22" dur="1.6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="14" rx="9" ry="13" fill="#5a4a3a"/>
      <ellipse cx="0" cy="16" rx="5.5" ry="9" fill="#d6d6cf"/>
      <circle cx="0" cy="-1" r="7" fill="#5a4a3a"/>
      <circle cx="-2.3" cy="-2" r="1.2" fill="#ffffff"/>
      <circle cx="2.3" cy="-2" r="1.2" fill="#ffffff"/>
      <circle cx="-2.3" cy="-2" r="0.6" fill="#0d1117"/>
      <circle cx="2.3" cy="-2" r="0.6" fill="#0d1117"/>
      <polygon points="-1.4,1 1.4,1 0,3.5" fill="#f0a500"/>
      <ellipse cx="-3.5" cy="28" rx="3" ry="1.6" fill="#f0a500"/>
      <ellipse cx="3.5" cy="28" rx="3" ry="1.6" fill="#f0a500"/>
    </g>
  </g>
</svg>
