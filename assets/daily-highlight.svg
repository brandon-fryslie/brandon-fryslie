<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Smithsonian Institution — 180th Anniversary (August 10, 1846) -->
<!-- about:
On 10 August 1846, President James K. Polk signed the Act of Congress establishing the Smithsonian Institution, funded by the surprise bequest of English scientist James Smithson — a man who never set foot in the United States — with the charge "for the increase and diffusion of knowledge." The red-sandstone "Castle" on the National Mall, in Norman Revival style, opened its doors in 1855; today the Institution stewards 21 museums, the National Zoo, and roughly 157 million objects. 180 years today.

A twilight tableau: a silhouette of the Castle rises against a warm-purple-to-amber sky, its arched windows glowing, its towers crenellated. Specimens — a T. rex, a rocket, an atom, a butterfly — drift steadily upward from the roofline into the dark sky, the visible act of knowledge diffusing outward. On the right, a large AUGUST 10, 2026 headline anchors a SMITHSONIAN subhead, chartering data, and the Smithson bequest as caption.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 10, 2026 — the 180th anniversary of the Smithsonian Institution's founding on August 10, 1846. On the left half, a twilight tableau: a silhouette of the Smithsonian Castle in warm red sandstone rises against a purple-to-amber sky, its arched windows glowing yellow, its towers crenellated. Specimens — a T. rex, a rocket, an atom, a butterfly — drift steadily upward from the rooflines into the night sky, illustrating the diffusion of knowledge. On the right, a huge cream AUGUST 10, 2026 headline underlined by a red-to-gold sweep, a Smithsonian-red SMITHSONIAN subhead trailed by cream 180 YEARS, italic amber CHARTERED 10 AUGUST 1846 · JAMES SMITHSON tertiary, dim-cyan CASTLE · NORMAN REVIVAL · 21 MUSEUMS · 157M OBJECTS tertiary, and a Georgia-italic 'for the increase and diffusion of knowledge among men.' caption at the base.">
  <defs>
    <!-- Twilight sky: deep navy at top fading to warm amber at horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="45%"  stop-color="#1a1230"/>
      <stop offset="78%"  stop-color="#4a2340"/>
      <stop offset="100%" stop-color="#b8621c"/>
    </linearGradient>

    <!-- Warm sun halo behind the castle -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.85" r="0.55">
      <stop offset="0%"   stop-color="#ffcc66" stop-opacity="0.65"/>
      <stop offset="40%"  stop-color="#e07b3a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a2340" stop-opacity="0"/>
    </radialGradient>

    <!-- Red sandstone gradient for the castle silhouette -->
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a2818"/>
      <stop offset="60%"  stop-color="#5a1c12"/>
      <stop offset="100%" stop-color="#2e0e08"/>
    </linearGradient>

    <!-- Underline sweep: red to gold -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a72521" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#a72521" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#ffcc66" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffcc66" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm window glow -->
    <radialGradient id="winGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffe28a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffcc66" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Reusable arched window shape (pointed arch), width 8, height 14 -->
    <symbol id="win" overflow="visible">
      <path d="M -4 0 L -4 -7 Q 0 -14 4 -7 L 4 0 Z" fill="url(#winGlow)"/>
    </symbol>

    <!-- Reusable small round window -->
    <symbol id="winRound" overflow="visible">
      <circle r="2.2" fill="#ffe28a"/>
    </symbol>

    <!-- Specimen: T. rex silhouette (small, ~24x20) -->
    <symbol id="trex" overflow="visible">
      <path d="M -10 6 L -8 -2 L -6 -6 L -2 -8 L 2 -9 L 6 -8 L 8 -5 L 10 -2 L 12 0
               L 10 1 L 7 0 L 6 3 L 4 6 L 6 8 L 4 8 L 2 5 L 0 8 L -2 5 L -4 8
               L -6 5 L -8 8 L -10 6 Z" fill="#c9d1d9" opacity="0.85"/>
    </symbol>

    <!-- Specimen: rocket (small, ~10x20) -->
    <symbol id="rocket" overflow="visible">
      <path d="M 0 -10 Q 3 -6 3 0 L 3 6 L -3 6 L -3 0 Q -3 -6 0 -10 Z" fill="#f0f6fc"/>
      <path d="M -3 4 L -6 8 L -3 6 Z M 3 4 L 6 8 L 3 6 Z" fill="#a72521"/>
      <circle cx="0" cy="-2" r="1.2" fill="#79c0ff"/>
      <path d="M -1.5 6 Q 0 10 1.5 6 Z" fill="#ffcc66" opacity="0.85"/>
    </symbol>

    <!-- Specimen: atom (~20x20) -->
    <symbol id="atom" overflow="visible">
      <ellipse rx="9" ry="3.5" fill="none" stroke="#79c0ff" stroke-width="0.8" opacity="0.85"/>
      <ellipse rx="9" ry="3.5" fill="none" stroke="#79c0ff" stroke-width="0.8" opacity="0.85" transform="rotate(60)"/>
      <ellipse rx="9" ry="3.5" fill="none" stroke="#79c0ff" stroke-width="0.8" opacity="0.85" transform="rotate(-60)"/>
      <circle r="1.6" fill="#ffcc66"/>
    </symbol>

    <!-- Specimen: butterfly (~20x14) -->
    <symbol id="butterfly" overflow="visible">
      <path d="M 0 0 Q -8 -6 -9 -2 Q -10 3 -6 4 Q -3 4 0 0 Z" fill="#e07b3a" opacity="0.9"/>
      <path d="M 0 0 Q 8 -6 9 -2 Q 10 3 6 4 Q 3 4 0 0 Z" fill="#e07b3a" opacity="0.9"/>
      <path d="M 0 0 Q -6 3 -7 6 Q -3 7 0 4 Z" fill="#8a4a70" opacity="0.9"/>
      <path d="M 0 0 Q 6 3 7 6 Q 3 7 0 4 Z" fill="#8a4a70" opacity="0.9"/>
      <line x1="0" y1="-4" x2="0" y2="5" stroke="#2e0e08" stroke-width="0.8"/>
    </symbol>

    <!-- Reusable star for the twinkling upper sky -->
    <symbol id="star" overflow="visible">
      <circle r="0.55" fill="#f0f6fc"/>
    </symbol>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="800" height="200" fill="url(#sky)"/>
  <!-- Sun halo behind castle -->
  <ellipse cx="200" cy="175" rx="230" ry="80" fill="url(#sunGlow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================= STARFIELD (upper left sky) ================= -->
  <g>
    <use href="#star" x="26"  y="12" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s"  repeatCount="indefinite"/></use>
    <use href="#star" x="64"  y="24" opacity="0.6"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="11s" begin="1s" repeatCount="indefinite"/></use>
    <use href="#star" x="98"  y="8"  opacity="0.75"><animate attributeName="opacity" values="0.35;1;0.35" dur="13s" begin="0.4s" repeatCount="indefinite"/></use>
    <use href="#star" x="132" y="20" opacity="0.65"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="7s"  begin="2s" repeatCount="indefinite"/></use>
    <use href="#star" x="170" y="10" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="11s" begin="3s" repeatCount="indefinite"/></use>
    <use href="#star" x="210" y="30" opacity="0.55"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="13s" begin="1.5s" repeatCount="indefinite"/></use>
    <use href="#star" x="248" y="14" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s"  begin="0.9s" repeatCount="indefinite"/></use>
    <use href="#star" x="290" y="26" opacity="0.6"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="11s" begin="2.5s" repeatCount="indefinite"/></use>
    <use href="#star" x="322" y="10" opacity="0.75"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="13s" begin="1.7s" repeatCount="indefinite"/></use>
    <use href="#star" x="352" y="34" opacity="0.55"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="7s"  begin="3.4s" repeatCount="indefinite"/></use>
  </g>

  <!-- ================= SPECIMENS DRIFTING UPWARD ================= -->
  <!-- T. rex rising from the castle center -->
  <g>
    <use href="#trex" x="0" y="0">
      <animateTransform attributeName="transform" type="translate"
                        values="180 130; 200 -20" dur="17s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.05;0.2;0.75;1" dur="17s" repeatCount="indefinite" begin="0s"/>
    </use>
  </g>

  <!-- Rocket rising from the tall tower -->
  <g>
    <use href="#rocket" x="0" y="0">
      <animateTransform attributeName="transform" type="translate"
                        values="240 90; 250 -25" dur="13s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="opacity" values="0;0;0.95;0.95;0" keyTimes="0;0.05;0.18;0.78;1" dur="13s" repeatCount="indefinite" begin="4s"/>
    </use>
  </g>

  <!-- Atom rising from the left tower -->
  <g>
    <use href="#atom" x="0" y="0">
      <animateTransform attributeName="transform" type="translate"
                        values="95 100; 110 -20" dur="19s" repeatCount="indefinite" begin="7s"/>
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.05;0.2;0.78;1" dur="19s" repeatCount="indefinite" begin="7s"/>
    </use>
    <use href="#atom" x="0" y="0">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- Butterfly rising from the mid section -->
  <g>
    <use href="#butterfly" x="0" y="0">
      <animateTransform attributeName="transform" type="translate"
                        values="140 115; 160 -20" dur="15s" repeatCount="indefinite" begin="10s"/>
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.05;0.18;0.78;1" dur="15s" repeatCount="indefinite" begin="10s"/>
    </use>
  </g>

  <!-- Second rocket, staggered -->
  <g>
    <use href="#rocket" x="0" y="0">
      <animateTransform attributeName="transform" type="translate"
                        values="70 105; 80 -25" dur="14s" repeatCount="indefinite" begin="12s"/>
      <animate attributeName="opacity" values="0;0;0.95;0.95;0" keyTimes="0;0.05;0.2;0.78;1" dur="14s" repeatCount="indefinite" begin="12s"/>
    </use>
  </g>

  <!-- ================= SMITHSONIAN CASTLE SILHOUETTE ================= -->
  <!-- Main body: crenellated central mass with three towers.
       Ground line ~ y=190. Body from y=190 up to varying rooflines. -->
  <g fill="url(#stone)">
    <!-- Left short tower (base 40x60) -->
    <rect x="50" y="120" width="42" height="70"/>
    <!-- Crenellations on left tower -->
    <rect x="50" y="116" width="6" height="6"/>
    <rect x="62" y="116" width="6" height="6"/>
    <rect x="74" y="116" width="6" height="6"/>
    <rect x="86" y="116" width="6" height="6"/>

    <!-- Main central hall block -->
    <rect x="92" y="130" width="120" height="60"/>
    <!-- Crenellations across the top of main hall -->
    <rect x="92"  y="126" width="8" height="6"/>
    <rect x="108" y="126" width="8" height="6"/>
    <rect x="124" y="126" width="8" height="6"/>
    <rect x="140" y="126" width="8" height="6"/>
    <rect x="156" y="126" width="8" height="6"/>
    <rect x="172" y="126" width="8" height="6"/>
    <rect x="188" y="126" width="8" height="6"/>
    <rect x="204" y="126" width="8" height="6"/>

    <!-- Central smaller tower with rounded gable -->
    <rect x="128" y="98" width="48" height="30"/>
    <path d="M 128 100 Q 152 78 176 100 Z"/>
    <!-- Finial on central gable -->
    <rect x="150" y="70" width="4" height="10"/>
    <circle cx="152" cy="70" r="2.5"/>

    <!-- Tall main tower (right of center) — the campanile -->
    <rect x="212" y="70" width="46" height="120"/>
    <!-- Crenellations on tall tower -->
    <rect x="212" y="66" width="7" height="5"/>
    <rect x="225" y="66" width="7" height="5"/>
    <rect x="238" y="66" width="7" height="5"/>
    <rect x="251" y="66" width="7" height="5"/>
    <!-- Tall spire on top -->
    <path d="M 218 66 L 235 20 L 252 66 Z"/>
    <!-- Spire finial -->
    <rect x="234" y="12" width="2" height="8"/>
    <circle cx="235" cy="12" r="1.8"/>

    <!-- Right shorter tower with pointed roof -->
    <rect x="258" y="115" width="34" height="75"/>
    <path d="M 258 115 L 275 88 L 292 115 Z"/>
    <rect x="274" y="82" width="2" height="8"/>

    <!-- Farthest right small tower -->
    <rect x="292" y="140" width="26" height="50"/>
    <rect x="292" y="136" width="5" height="5"/>
    <rect x="301" y="136" width="5" height="5"/>
    <rect x="310" y="136" width="5" height="5"/>

    <!-- Ground foundation line -->
    <rect x="42" y="188" width="288" height="4"/>
  </g>

  <!-- ================= CASTLE WINDOWS (glowing arched windows) ================= -->
  <g>
    <!-- Left tower windows -->
    <use href="#win" x="65" y="150">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="80" y="150">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="11s" begin="1s" repeatCount="indefinite"/>
    </use>

    <!-- Main hall arched windows (a row of five) -->
    <use href="#win" x="105" y="170">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="13s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="123" y="170">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="0.6s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="141" y="170">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" begin="1.2s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="159" y="170">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="13s" begin="2s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="177" y="170">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" begin="2.6s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="195" y="170">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" begin="0.3s" repeatCount="indefinite"/>
    </use>

    <!-- Central gable window (larger round) -->
    <circle cx="152" cy="108" r="4" fill="url(#winGlow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- Tall tower windows: three levels of small round windows -->
    <use href="#winRound" x="222" y="90">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#winRound" x="235" y="90">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="11s" begin="1s" repeatCount="indefinite"/>
    </use>
    <use href="#winRound" x="248" y="90">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="13s" begin="0.5s" repeatCount="indefinite"/>
    </use>
    <use href="#winRound" x="229" y="110">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" begin="2s" repeatCount="indefinite"/>
    </use>
    <use href="#winRound" x="242" y="110">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="11s" begin="0.8s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="228" y="140">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="13s" begin="1.4s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="243" y="140">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" begin="2.4s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="228" y="170">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="11s" begin="0.9s" repeatCount="indefinite"/>
    </use>
    <use href="#win" x="243" y="170">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="13s" begin="3s" repeatCount="indefinite"/>
    </use>

    <!-- Right shorter tower window -->
    <use href="#win" x="275" y="160">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" begin="1.7s" repeatCount="indefinite"/>
    </use>
    <use href="#winRound" x="275" y="130">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="11s" begin="2.2s" repeatCount="indefinite"/>
    </use>

    <!-- Farthest right small tower window -->
    <use href="#win" x="305" y="170">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="13s" begin="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ================= RIGHT HALF: TYPOGRAPHY ================= -->
  <!-- Huge cream headline: primary date -->
  <text x="378" y="62"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="1"
        fill="#f0f6fc">AUGUST 10, 2026</text>

  <!-- Underline sweep bar -->
  <rect x="378" y="72" width="316" height="2.8" fill="url(#sweep)" opacity="0.95">
    <animate attributeName="x" values="378;424;378" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- Subhead: red SMITHSONIAN · cream 180 YEARS -->
  <g>
    <text x="378" y="104"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="26" font-weight="800" letter-spacing="2.2"
          fill="#e5482b">SMITHSONIAN</text>
    <text x="600" y="104"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" letter-spacing="1.4"
          fill="#f0f6fc">·  180 YEARS</text>
  </g>

  <!-- Amber italic tertiary: charter data -->
  <text x="378" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="11" font-style="italic" font-weight="600" letter-spacing="1"
        fill="#f2a86b">CHARTERED 10 AUGUST 1846  ·  JAMES SMITHSON BEQUEST</text>

  <!-- Dim tertiary: description data -->
  <text x="378" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" letter-spacing="1.2"
        fill="#79c0ff" opacity="0.9">CASTLE  ·  NORMAN REVIVAL  ·  21 MUSEUMS  ·  157M OBJECTS</text>

  <!-- Georgia italic caption -->
  <g>
    <text x="378" y="176"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="12" font-style="italic"
          fill="#c9d1d9">&#8220;for the increase and diffusion of knowledge.&#8221;</text>
    <!-- Small glowing lantern at the end of the caption -->
    <g transform="translate(738 172)">
      <circle r="1.8" fill="#ffcc66">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="#ffcc66" opacity="0.3">
        <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
