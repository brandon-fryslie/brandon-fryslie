<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: International Left-Handers Day — 50th Year (August 13, 1976) -->
<!-- about:
International Left-Handers Day, observed every 13 August since 1976, was founded by Dean R. Campbell of Lefthanders International as a light-hearted campaign for the roughly one-in-ten humans who write, throw, and cut against the grain of a right-handed world. Its patron saints — Leonardo, Curie, McCartney, Hendrix, Obama — are the shorthand; the daily reality is smudged pinkies, backwards spiral notebooks, and can-openers you have to flip. Fifty years today.

The left half is a page of ruled notebook paper with a fountain pen coming in from the left at the classic hooked-hand angle, writing a big italic "50" across the page in wet royal-blue ink; a drop falls beside it, and a soft pinky-smudge — the lifelong tell — trails behind the nib. On the right, a large AUGUST 13, 2026 headline anchors a LEFT-HANDERS DAY · SINCE 1976 subhead, a roster of famous southpaws, and the caption "the world is upside down for us."
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 13, 2026 — the 50th International Left-Handers Day. On the left half, a piece of cream ruled notebook paper with a red margin line: a silver-and-royal-blue fountain pen enters from the lower left at a classic hooked left-hander's angle and writes a large italic 50 across the page in wet royal-blue ink, the strokes revealing left-to-right as the pen moves; a small ink drop falls beside the numeral and a soft pinky-smudge trails behind the nib. Below the paper, a small 1976 – 2026 timestamp. On the right, a huge cream AUGUST 13, 2026 headline underlined by a purple-to-pink sweep, a purple LEFT-HANDERS DAY subhead trailed by cream · SINCE 1976, italic amber 50 YEARS OF SOUTHPAWS · DEAN R. CAMPBELL tertiary, dim-cyan DA VINCI · CURIE · MCCARTNEY · OBAMA · HENDRIX tertiary, and a Georgia-italic 'the world is upside down for us.' caption at the base.">
  <defs>
    <!-- Cream paper gradient -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7f1e0"/>
      <stop offset="100%" stop-color="#ebe3cc"/>
    </linearGradient>

    <!-- Ink gradient (royal blue, wet look) -->
    <linearGradient id="inkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a5cc4"/>
      <stop offset="100%" stop-color="#1a3a99"/>
    </linearGradient>

    <!-- Pen barrel gradient (deep burgundy with metallic sheen) -->
    <linearGradient id="barrelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6a2030"/>
      <stop offset="50%"  stop-color="#8c2a3c"/>
      <stop offset="100%" stop-color="#4a1420"/>
    </linearGradient>

    <!-- Silver nib gradient -->
    <linearGradient id="nibGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#8a8a98"/>
    </linearGradient>

    <!-- Underline sweep (purple to pink) -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b48bff" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#b48bff" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#ff8bc8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff8bc8" stop-opacity="0"/>
    </linearGradient>

    <!-- Fade right edge of paper into dark -->
    <linearGradient id="paperFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>

    <!-- Ink smudge radial -->
    <radialGradient id="smudgeGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#1a3a99" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#1a3a99" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a3a99" stop-opacity="0"/>
    </radialGradient>

    <!-- Reveal clip for the "50" — visible at rest, erases and redraws each cycle -->
    <clipPath id="fiftyReveal">
      <rect x="60" y="30" width="340" height="160">
        <animate attributeName="width"
                 values="340;340;0;340;340"
                 keyTimes="0;0.15;0.35;0.85;1"
                 dur="13s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Dark base -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- ==================== LEFT: NOTEBOOK PAPER ==================== -->
  <!-- Paper slightly rotated for a natural lefty tilt (paper turned clockwise for left-handers) -->
  <g transform="translate(20 12) rotate(-3 210 90)">
    <!-- Paper body -->
    <rect x="0" y="0" width="420" height="180" rx="2" fill="url(#paperGrad)" stroke="#c8bfa0" stroke-width="0.8"/>

    <!-- Torn/frayed left edge hint (small notches) -->
    <g fill="#c8bfa0" opacity="0.6">
      <rect x="0" y="8"   width="2" height="4"/>
      <rect x="0" y="34"  width="2" height="3"/>
      <rect x="0" y="72"  width="2" height="4"/>
      <rect x="0" y="118" width="2" height="3"/>
      <rect x="0" y="152" width="2" height="4"/>
    </g>

    <!-- Red margin line -->
    <line x1="42" y1="6" x2="42" y2="174" stroke="#d04a5a" stroke-width="1" opacity="0.75"/>

    <!-- Horizontal ruled lines (blue) -->
    <g stroke="#8fb0dc" stroke-width="0.6" opacity="0.7">
      <line x1="8" y1="28"  x2="412" y2="28"/>
      <line x1="8" y1="52"  x2="412" y2="52"/>
      <line x1="8" y1="76"  x2="412" y2="76"/>
      <line x1="8" y1="100" x2="412" y2="100"/>
      <line x1="8" y1="124" x2="412" y2="124"/>
      <line x1="8" y1="148" x2="412" y2="148"/>
      <line x1="8" y1="172" x2="412" y2="172"/>
    </g>

    <!-- 3-hole punch marks (top-bound notebook page) -->
    <g fill="#0d1117" opacity="0.35">
      <circle cx="22" cy="16" r="2.4"/>
      <circle cx="22" cy="90" r="2.4"/>
      <circle cx="22" cy="164" r="2.4"/>
    </g>

    <!-- Pinky smudge trailing behind the pen (soft blob under the writing) -->
    <ellipse cx="150" cy="126" rx="70" ry="14" fill="url(#smudgeGrad)"/>
    <ellipse cx="220" cy="130" rx="42" ry="9"  fill="url(#smudgeGrad)" opacity="0.7"/>

    <!-- The "50" — big italic, revealed left-to-right by the clip -->
    <g clip-path="url(#fiftyReveal)">
      <text x="80" y="128"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="126" font-weight="700" font-style="italic"
            fill="url(#inkGrad)" letter-spacing="-2">50</text>
    </g>

    <!-- Wet ink dot on the tail of the 0 -->
    <circle cx="290" cy="118" r="3" fill="#1a3a99" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.9;1" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- Falling ink drop -->
    <g>
      <ellipse cx="0" cy="0" rx="2.6" ry="4" fill="#1a3a99">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.7;1" dur="7s" begin="2s" repeatCount="indefinite"/>
      </ellipse>
      <animateTransform attributeName="transform" type="translate"
                        values="308 122; 308 170; 308 172"
                        keyTimes="0;0.7;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    </g>
    <!-- Ink splash on landing -->
    <g transform="translate(308 172)">
      <circle cx="0" cy="0" r="0" fill="#1a3a99" opacity="0">
        <animate attributeName="r" values="0;0;5;5;0" keyTimes="0;0.7;0.78;0.9;1" dur="7s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.7;0.3;0" keyTimes="0;0.7;0.78;0.9;1" dur="7s" begin="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Bottom timestamp on the paper -->
    <text x="332" y="168"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="10" font-style="italic" fill="#6a5e40" opacity="0.85">
      1976 – 2026
    </text>

    <!-- ============ FOUNTAIN PEN ============ -->
    <!-- Pen enters from lower-left at the classic hooked-lefty angle -->
    <!-- Position/rotation animates in sync with the "50" reveal -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="300 100; 300 100; 70 175; 240 90; 300 100; 300 100"
                        keyTimes="0;0.15;0.35;0.6;0.85;1"
                        dur="13s" repeatCount="indefinite"/>
      <g transform="rotate(-38)">
        <!-- Barrel (main body) -->
        <rect x="0" y="-6" width="88" height="12" rx="2" fill="url(#barrelGrad)" stroke="#2a0a12" stroke-width="0.6"/>
        <!-- Gold band -->
        <rect x="-2" y="-6" width="6" height="12" fill="#d8ae3a" stroke="#8c6a20" stroke-width="0.4"/>
        <!-- Cap (back) -->
        <rect x="82" y="-7" width="24" height="14" rx="3" fill="#2a0a12" stroke="#000" stroke-width="0.4"/>
        <!-- Clip on cap -->
        <rect x="86" y="-11" width="16" height="2.4" rx="1" fill="#d8ae3a"/>
        <!-- Grip section (dark, in front of barrel) -->
        <rect x="-14" y="-4.5" width="16" height="9" rx="1" fill="#1a1a24" stroke="#000" stroke-width="0.4"/>
        <!-- Nib (silver, pointed) -->
        <path d="M -14 -3 L -30 -0.8 L -30 0.8 L -14 3 Z" fill="url(#nibGrad)" stroke="#4a4a58" stroke-width="0.4"/>
        <!-- Nib center slit -->
        <line x1="-14" y1="0" x2="-29" y2="0" stroke="#3a3a48" stroke-width="0.5"/>
        <!-- Breather hole -->
        <circle cx="-18" cy="0" r="1" fill="#3a3a48"/>
        <!-- Tiny ink bead at tip -->
        <circle cx="-30" cy="0" r="1.4" fill="#1a3a99">
          <animate attributeName="r" values="1;1.6;1" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Fade right edge of paper region into dark -->
  <rect x="380" y="0" width="80" height="200" fill="url(#paperFade)"/>

  <!-- Tiny floating "L" glyphs (subtle atmosphere) -->
  <g font-family="Georgia, serif" font-style="italic" fill="#b48bff" opacity="0.35">
    <text x="410" y="30" font-size="12">
      L
      <animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 -14" keyTimes="0;0.8;1" dur="11s" begin="1s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="60" font-size="9">
      L
      <animate attributeName="opacity" values="0;0.4;0" dur="13s" begin="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -20;0 -20" keyTimes="0;0.8;1" dur="13s" begin="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ==================== RIGHT: TEXT PANEL ==================== -->
  <text x="474" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 13, 2026
  </text>

  <rect x="474" y="76" width="300" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="474;484;474" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="474" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#b48bff">LEFT-HANDERS DAY</tspan><tspan fill="#f5efe0" font-weight="500"> · SINCE 1976</tspan>
  </text>

  <text x="474" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#f5b334" letter-spacing="1" opacity="0.95">
    50 YEARS OF SOUTHPAWS · DEAN R. CAMPBELL
  </text>

  <text x="474" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#6bd4c8" letter-spacing="1" opacity="0.9">
    DA VINCI · CURIE · MCCARTNEY · OBAMA · HENDRIX
  </text>

  <text x="474" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;the world is upside down for us.&#8221;
  </text>
</svg>
