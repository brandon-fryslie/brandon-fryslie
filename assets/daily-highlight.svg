<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Mad Hatter Day — 40 Years (October 6, 1986) -->
<!-- about:
On 6 October 1986, a group of computer technicians in Boulder, Colorado declared the day a holiday of unreason and have observed it, mostly on the internet, every year since. The date comes from John Tenniel's 1865 illustrations for Alice's Adventures in Wonderland, where the Hatter's enormous top hat carries a small white price card tucked into its band reading "In this style 10/6" — ten shillings sixpence, the shopkeeper's price. Mad Hatter Day is traditionally observed by doing silly things in a serious manner, holding meetings in which no decisions are reached, and taking tea at odd hours. Forty years in, it remains an engineer's joke that outlived its original mailing list: a day set aside, as the Hatter himself might have insisted, for the kind of logic that reaches its conclusions by the shortest possible path through the longest possible route.

The scene is a Wonderland tea-party on a checkered floor. On the left, the Mad Hatter's great tilted top hat sits in the frame with the famous "In this style 10/6" price card poking from its band. A steaming teacup rocks gently beside it; a pocket watch above spins its hands backwards past six o'clock, perpetually stuck at tea-time. Playing cards tumble slowly through the background; small golden sparkles flicker across the scene. On the right, a large cream OCTOBER 6, 2026 headline sits over a red-and-white checkered sweep, a magenta MAD HATTER DAY · 40 YEARS subhead, an italic amber WONDERLAND · OCTOBER 6, 1986 tertiary, a dim TEA · WATCH · CARDS · CHESHIRE · RIDDLES roster, and a Georgia-italic 'We're all mad here.' caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for October 6, 2026 — the 40th year of Mad Hatter Day (observed since October 6, 1986). On a Wonderland checkered floor, the Mad Hatter's great tilted top hat sits on the left with the famous 'In this style 10/6' price card poking from its band. A steaming teacup rocks gently beside it; a pocket watch above spins its hands backwards past six o'clock. Playing cards tumble through the background; sparkles flicker across the scene. On the right, a large cream OCTOBER 6, 2026 headline sits over a red-and-white checkered sweep, a magenta MAD HATTER DAY · 40 YEARS subhead, an italic amber WONDERLAND · OCTOBER 6, 1986 tertiary, a dim TEA · WATCH · CARDS · CHESHIRE · RIDDLES roster, and a Georgia-italic 'We're all mad here.' caption at the base.">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120820"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#080510"/>
    </linearGradient>

    <linearGradient id="hatCrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1420"/>
      <stop offset="0.5" stop-color="#2a1f32"/>
      <stop offset="1" stop-color="#0f0a14"/>
    </linearGradient>

    <radialGradient id="teaGrad" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c58a3e"/>
      <stop offset="0.7" stop-color="#8a4e18"/>
      <stop offset="1" stop-color="#3a1e08"/>
    </radialGradient>

    <radialGradient id="cupBody" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#f4ecd0"/>
      <stop offset="0.7" stop-color="#d8c89a"/>
      <stop offset="1" stop-color="#786840"/>
    </radialGradient>

    <radialGradient id="watchBody" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#c89830"/>
      <stop offset="1" stop-color="#5a3a0a"/>
    </radialGradient>

    <radialGradient id="watchFace" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8ecc8"/>
      <stop offset="1" stop-color="#c8b088"/>
    </radialGradient>

    <radialGradient id="sparkleGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2a0" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff2a0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- =================== SKY =================== -->
  <rect width="800" height="200" fill="url(#skyGrad)"/>

  <!-- =================== CHECKERED FLOOR (Wonderland) =================== -->
  <g opacity="0.28">
    <!-- Perspective-ish checkered band along bottom. Diamond tiles. -->
    <g>
      <polygon points="0,195 40,185 0,175" fill="#f4ecd0"/>
      <polygon points="40,185 80,195 80,175 40,175" fill="#2a1f32"/>
      <polygon points="80,185 120,175 80,175" fill="#f4ecd0"/>
      <polygon points="120,195 160,185 160,175 120,175" fill="#2a1f32"/>
      <polygon points="160,185 200,195 200,175 160,175" fill="#f4ecd0"/>
      <polygon points="200,185 240,175 240,185 200,185" fill="#2a1f32"/>
      <polygon points="240,195 280,185 280,175 240,175" fill="#f4ecd0"/>
      <polygon points="280,185 320,195 320,175 280,175" fill="#2a1f32"/>
      <polygon points="320,185 360,175 360,185 320,185" fill="#f4ecd0"/>
      <polygon points="360,195 400,185 400,175 360,175" fill="#2a1f32"/>
      <polygon points="400,185 440,195 440,175 400,175" fill="#f4ecd0"/>
      <polygon points="440,185 480,175 480,185 440,185" fill="#2a1f32"/>
      <polygon points="480,195 520,185 520,175 480,175" fill="#f4ecd0"/>
      <polygon points="520,185 560,195 560,175 520,175" fill="#2a1f32"/>
      <polygon points="560,185 600,175 600,185 560,185" fill="#f4ecd0"/>
      <polygon points="600,195 640,185 640,175 600,175" fill="#2a1f32"/>
      <polygon points="640,185 680,195 680,175 640,175" fill="#f4ecd0"/>
      <polygon points="680,185 720,175 720,185 680,185" fill="#2a1f32"/>
      <polygon points="720,195 760,185 760,175 720,175" fill="#f4ecd0"/>
      <polygon points="760,185 800,195 800,175 760,175" fill="#2a1f32"/>
    </g>
    <rect x="0" y="175" width="800" height="25" fill="url(#floorFade)"/>
  </g>

  <!-- =================== TUMBLING PLAYING CARDS (background) =================== -->
  <g opacity="0.55">
    <!-- Card 1 (Queen of Hearts) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="820,30; -40,170" dur="23s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0;360" dur="11s" repeatCount="indefinite"/>
        <rect x="-10" y="-14" width="20" height="28" rx="2" fill="#f4ecd0" stroke="#5a2020" stroke-width="0.6"/>
        <path d="M -3 -5 C -5 -8 -1 -9 0 -6 C 1 -9 5 -8 3 -5 C 2 -2 0 0 0 2 C 0 0 -2 -2 -3 -5 Z" fill="#cc1a1a"/>
      </g>
    </g>
    <!-- Card 2 (Ace of Spades) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="-40,10; 820,160" dur="29s" repeatCount="indefinite" begin="-6s"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="360;0" dur="13s" repeatCount="indefinite"/>
        <rect x="-9" y="-13" width="18" height="26" rx="2" fill="#f4ecd0" stroke="#333" stroke-width="0.6"/>
        <path d="M 0 -7 C -4 -2 -4 2 0 3 C 4 2 4 -2 0 -7 Z M -2 3 L 2 3 L 0 6 Z" fill="#1a1a1a"/>
      </g>
    </g>
    <!-- Card 3 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="820,80; -40,20" dur="31s" repeatCount="indefinite" begin="-12s"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0;-360" dur="17s" repeatCount="indefinite"/>
        <rect x="-8" y="-11" width="16" height="22" rx="1.5" fill="#f4ecd0" stroke="#5a2020" stroke-width="0.5"/>
        <path d="M -2 -3 C -3 -6 -1 -7 0 -4 C 1 -7 3 -6 2 -3 C 1 -1 0 1 0 2 C 0 1 -1 -1 -2 -3 Z" fill="#cc1a1a"/>
      </g>
    </g>
  </g>

  <!-- =================== SPARKLES =================== -->
  <g>
    <circle cx="55" cy="40" r="2" fill="url(#sparkleGrad)">
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="55" r="1.5" fill="url(#sparkleGrad)">
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="30" r="1.8" fill="url(#sparkleGrad)">
      <animate attributeName="opacity" values="0;1;0" dur="13s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="140" r="1.4" fill="url(#sparkleGrad)">
      <animate attributeName="opacity" values="0;1;0" dur="7s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="155" r="1.6" fill="url(#sparkleGrad)">
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =================== POCKET WATCH (upper area, above hat) =================== -->
  <g transform="translate(290, 56)">
    <!-- Chain loop at top -->
    <circle cx="0" cy="-26" r="3" fill="none" stroke="#c89830" stroke-width="1.4"/>
    <line x1="0" y1="-23" x2="0" y2="-19" stroke="#c89830" stroke-width="1.2"/>
    <!-- Watch outer ring (brass) -->
    <circle cx="0" cy="0" r="19" fill="url(#watchBody)" stroke="#8a6410" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="15.5" fill="url(#watchFace)" stroke="#8a6410" stroke-width="0.4"/>
    <!-- Hour marks -->
    <g stroke="#3a2a08" stroke-width="0.9" stroke-linecap="round">
      <line x1="0" y1="-13" x2="0" y2="-11"/>
      <line x1="11" y1="-6.5" x2="9.5" y2="-5.5"/>
      <line x1="11" y1="6.5" x2="9.5" y2="5.5"/>
      <line x1="0" y1="13" x2="0" y2="11"/>
      <line x1="-11" y1="6.5" x2="-9.5" y2="5.5"/>
      <line x1="-11" y1="-6.5" x2="-9.5" y2="-5.5"/>
    </g>
    <!-- 6 at the bottom, highlighted -->
    <text x="0" y="10" text-anchor="middle"
          font-family="'Georgia', serif" font-size="7" font-weight="700" fill="#8a1010">6</text>
    <!-- Hour hand (short, running backwards slowly) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;-360" dur="29s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-7" stroke="#1a1410" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- Minute hand (long, racing) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;-360" dur="7s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="-11" stroke="#1a1410" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    <!-- Second hand (red, lightning quick) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0;360" dur="2s" repeatCount="indefinite"/>
      <line x1="0" y1="2" x2="0" y2="-12" stroke="#cc1a1a" stroke-width="0.6" stroke-linecap="round"/>
    </g>
    <circle cx="0" cy="0" r="1.3" fill="#1a1410"/>
    <circle cx="0" cy="0" r="0.5" fill="#ffe08a"/>
  </g>

  <!-- =================== THE MAD HATTER'S HAT =================== -->
  <!-- Hat sits in the left half, tilted slightly. Pivot ~ (160, 160). -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-4 160 160; 2 160 160; -4 160 160"
                      dur="11s" repeatCount="indefinite"/>
    <!-- Shadow pooled under the brim -->
    <ellipse cx="160" cy="172" rx="90" ry="5" fill="#000" opacity="0.5"/>
    <!-- Brim -->
    <ellipse cx="160" cy="162" rx="86" ry="9" fill="#0e0a14" stroke="#2a1f32" stroke-width="0.8"/>
    <ellipse cx="160" cy="160" rx="86" ry="8" fill="#1a1420"/>
    <!-- Crown: slightly wider at top (classic Hatter silhouette) -->
    <path d="M 108 160 L 100 46 Q 100 36 112 34 L 212 34 Q 224 36 224 46 L 216 160 Z"
          fill="url(#hatCrown)" stroke="#0a0810" stroke-width="0.8"/>
    <!-- Highlight sheen on the left side of the crown -->
    <path d="M 115 155 L 108 50 Q 108 42 118 42 L 128 42 L 128 155 Z"
          fill="#4a3858" opacity="0.35"/>
    <!-- Specular stripe -->
    <path d="M 120 150 L 116 50 Q 116 44 122 44 L 126 44 L 128 150 Z"
          fill="#8a6ea8" opacity="0.22"/>
    <!-- Hatband -->
    <path d="M 106 150 L 218 150 L 215 162 L 109 162 Z" fill="#6a1a1a"/>
    <path d="M 106 150 L 218 150 L 217 153 L 107 153 Z" fill="#8a2020"/>
    <path d="M 106 159 L 218 159 L 215 162 L 109 162 Z" fill="#3a0a0a"/>

    <!-- The famous "In this style / 10/6" price card tucked in the band -->
    <g transform="translate(195, 145) rotate(14)">
      <!-- card body -->
      <rect x="-2" y="-2" width="52" height="30" fill="#f4ecd0" stroke="#8a6410" stroke-width="0.7"/>
      <!-- notch (torn edge hint on left) -->
      <path d="M -2 2 L 2 4 L -2 6 Z M -2 10 L 2 12 L -2 14 Z M -2 18 L 2 20 L -2 22 Z" fill="#8a6410" opacity="0.3"/>
      <text x="24" y="10" text-anchor="middle"
            font-family="'Georgia', serif" font-size="7" font-weight="700" fill="#2a1a08"
            font-style="italic">In this style</text>
      <text x="24" y="22" text-anchor="middle"
            font-family="'Georgia', serif" font-size="12" font-weight="800" fill="#8a1010">10/6</text>
    </g>
  </g>

  <!-- =================== TEACUP (right of hat) =================== -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-3 265 170; 4 265 170; -3 265 170"
                      dur="7s" repeatCount="indefinite"/>
    <!-- Shadow -->
    <ellipse cx="265" cy="175" rx="22" ry="2.5" fill="#000" opacity="0.5"/>
    <!-- Saucer -->
    <ellipse cx="265" cy="172" rx="22" ry="3" fill="#d8c89a" stroke="#786840" stroke-width="0.5"/>
    <ellipse cx="265" cy="171" rx="22" ry="2.6" fill="#f4ecd0"/>
    <!-- Cup body -->
    <path d="M 248 155 Q 248 170 252 170 L 278 170 Q 282 170 282 155 Z"
          fill="url(#cupBody)" stroke="#786840" stroke-width="0.6"/>
    <!-- Handle -->
    <path d="M 282 157 Q 290 157 290 162 Q 290 167 282 167" fill="none" stroke="#d8c89a" stroke-width="1.5"/>
    <!-- Tea surface (ellipse at top) -->
    <ellipse cx="265" cy="155" rx="17" ry="2.5" fill="url(#teaGrad)" stroke="#5a3010" stroke-width="0.3"/>
    <!-- Little tea highlight ripple -->
    <ellipse cx="261" cy="154.5" rx="3" ry="0.8" fill="#ffe8a0" opacity="0.4"/>
  </g>

  <!-- Steam rising from teacup -->
  <g opacity="0.75">
    <path d="M 258 150 Q 254 140 260 130 Q 266 120 260 108 Q 254 96 262 86"
          fill="none" stroke="#e8e8ec" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.65;0.1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M 268 150 Q 272 142 266 132 Q 262 122 270 110"
          fill="none" stroke="#e8e8ec" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="11s" begin="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 272 150 Q 278 138 274 126 Q 270 114 278 100"
          fill="none" stroke="#e8e8ec" stroke-width="1.2" stroke-linecap="round" opacity="0.45">
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="13s" begin="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- =================== TEXT STACK (right half) =================== -->

  <!-- Date headline -->
  <text x="580" y="56" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f4ecd0" letter-spacing="2.0">
    OCTOBER 6, 2026
  </text>

  <!-- Red-and-white checkered sweep beneath (Queen of Hearts-ish) -->
  <g>
    <rect x="440" y="66" width="280" height="6" fill="#f4ecd0"/>
    <g fill="#cc1a1a">
      <rect x="440" y="66" width="14" height="6"/>
      <rect x="468" y="66" width="14" height="6"/>
      <rect x="496" y="66" width="14" height="6"/>
      <rect x="524" y="66" width="14" height="6"/>
      <rect x="552" y="66" width="14" height="6"/>
      <rect x="580" y="66" width="14" height="6"/>
      <rect x="608" y="66" width="14" height="6"/>
      <rect x="636" y="66" width="14" height="6"/>
      <rect x="664" y="66" width="14" height="6"/>
      <rect x="692" y="66" width="14" height="6"/>
    </g>
    <!-- Travelling bright pulse along the bar -->
    <rect x="440" y="66" width="42" height="6" fill="#ffe08a" opacity="0.0">
      <animate attributeName="x" values="440;720;440" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="13s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Subhead -->
  <text x="580" y="98" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="800" letter-spacing="3.2" xml:space="preserve">
    <tspan fill="#e55fb0">MAD HATTER DAY  </tspan><tspan fill="#f4ecd0">&#183;  40 YEARS</tspan>
  </text>

  <!-- Tertiary italic -->
  <text x="580" y="118" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#c8a858" letter-spacing="0.7">
    WONDERLAND &#183; OCTOBER 6, 1986
  </text>

  <!-- Cast roster -->
  <text x="580" y="138" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.8" font-weight="700" fill="#8a7ab8" letter-spacing="2.4" opacity="0.95">
    TEA &#183; WATCH &#183; CARDS &#183; CHESHIRE &#183; RIDDLES
  </text>

  <!-- Caption -->
  <text x="580" y="190" text-anchor="middle"
        font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#c8a8d8" opacity="0.95">
    &#8220;We&#8217;re all mad here.&#8221;
  </text>

</svg>
