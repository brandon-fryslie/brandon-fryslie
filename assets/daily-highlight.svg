<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Voyager 1 at Saturn — 46th Anniversary (November 12, 1980) -->
<!-- about:
At 23:46 UTC on 12 November 1980, three years and three months out from the Cape, Voyager 1 passed within 124,000 km of Saturn's cloud tops. In a single flyby it returned the first high-resolution close-ups of the rings, discovered three new moons, resolved Titan as a world sheathed in thick orange nitrogen haze, and bent its trajectory out of the plane of the solar system. The Titan diversion came at a price — Voyager 1 would never reach Uranus or Neptune — but it put the spacecraft on a hyperbolic escape path. Forty-six years later it is the farthest human-made object from Earth, 25 light-hours out, still faintly answering the Deep Space Network from beyond the heliopause with 160 bits per second.

The scene is deep space on the night side of Saturn. On the left, the ringed planet hangs in warm honey and amber, its tilted ring system glinting as fine dashes slowly rotate; Titan sits off its shoulder as a small orange disc, Enceladus as a bright pin. Voyager 1 drifts past on a curved trajectory, high-gain dish aimed back at a distant Sun, trailing a thin dashed arc of radio pings home. On the right, a cream NOVEMBER 12, 2026 headline sits over a double amber-and-cream bar, a cream VOYAGER 1 · SATURN FLYBY subhead, an italic amber NOV 12, 1980 · 46 YEARS tertiary, a dim TITAN · RINGS · GRAND TOUR · HELIOPAUSE · GOLDEN RECORD roster, and a Georgia-italic caption at the base reading: Still travelling.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for November 12, 2026 — 46th anniversary of Voyager 1's closest approach to Saturn. On the left, Saturn hangs in warm honey and amber with slowly rotating ring dashes; Titan as a small orange disc and Enceladus as a bright pin accompany it. Voyager 1 drifts past on a curved trajectory, its high-gain dish aimed back toward a distant Sun, trailing a dashed arc of radio pings. On the right, a cream NOVEMBER 12, 2026 headline sits over a double amber-and-cream bar, a cream VOYAGER 1 · SATURN FLYBY subhead, an italic amber NOV 12, 1980 · 46 YEARS tertiary, a dim TITAN · RINGS · GRAND TOUR · HELIOPAUSE · GOLDEN RECORD roster, and a Georgia-italic caption at the base reading: Still travelling.">
  <defs>
    <!-- Deep space: profile dark fading to a warm plum at the horizon of the solar plane -->
    <radialGradient id="space" cx="0.30" cy="0.55" r="0.85">
      <stop offset="0" stop-color="#1a1424"/>
      <stop offset="0.55" stop-color="#120d1a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </radialGradient>

    <!-- Saturn body: pale cream at limb, warm honey through middle, dusky amber on terminator -->
    <radialGradient id="saturn" cx="0.42" cy="0.40" r="0.72">
      <stop offset="0" stop-color="#f6d79a"/>
      <stop offset="0.45" stop-color="#d9a24a"/>
      <stop offset="0.80" stop-color="#8a5a24"/>
      <stop offset="1" stop-color="#2a1a0c"/>
    </radialGradient>

    <!-- Ring gradient: lane pattern, bright A/B ring, dim Cassini division suggested by opacity breaks -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e2b0" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#f6e2b0" stop-opacity="0.75"/>
      <stop offset="0.22" stop-color="#e5c070" stop-opacity="0.9"/>
      <stop offset="0.36" stop-color="#2a1a0c" stop-opacity="0.2"/>
      <stop offset="0.42" stop-color="#f6e2b0" stop-opacity="0.95"/>
      <stop offset="0.58" stop-color="#f6e2b0" stop-opacity="0.95"/>
      <stop offset="0.64" stop-color="#2a1a0c" stop-opacity="0.2"/>
      <stop offset="0.78" stop-color="#e5c070" stop-opacity="0.9"/>
      <stop offset="0.92" stop-color="#f6e2b0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f6e2b0" stop-opacity="0"/>
    </linearGradient>

    <!-- Titan haze -->
    <radialGradient id="titan" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f3b26a"/>
      <stop offset="0.7" stop-color="#b56a28"/>
      <stop offset="1" stop-color="#2a140a"/>
    </radialGradient>

    <!-- Clip the back half of the ring where it passes behind Saturn -->
    <clipPath id="planet-clip">
      <circle cx="210" cy="104" r="38"/>
    </clipPath>

    <!-- Ellipse of ring system (centre 210,104) rotated -18deg for tilt -->
  </defs>

  <!-- ========== Space background ========== -->
  <rect width="800" height="200" fill="url(#space)"/>

  <!-- Starfield: twinkling pinpoints distributed through the left two thirds -->
  <g fill="#e8e3d6">
    <circle cx="30"  cy="18"  r="0.6" opacity="0.6"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="72"  cy="38"  r="0.4" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2"  dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="20"  r="0.5" opacity="0.6"><animate attributeName="opacity" values="0.25;0.9;0.3" dur="13s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="165" cy="50"  r="0.5" opacity="0.5"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="7s"  begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="48"  cy="78"  r="0.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.2" dur="11s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="92"  cy="134" r="0.5" opacity="0.5"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="13s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="25"  cy="150" r="0.4" opacity="0.5"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="7s"  begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="168" r="0.5" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.2" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="26"  r="0.5" opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.25" dur="13s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="345" cy="56"  r="0.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s"  begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="372" cy="22"  r="0.5" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.25" dur="11s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="358" cy="146" r="0.5" opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="13s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="282" cy="166" r="0.4" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s"  begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="395" cy="90"  r="0.6" opacity="0.7"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="11s" begin="-2s" repeatCount="indefinite"/></circle>
    <!-- a distant Sun — tiny but bright dot off far right of the planet pane -->
    <circle cx="405" cy="112" r="1.2" fill="#fff6d4" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Enceladus — bright icy pin near Saturn -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0.6 -0.4; 0 0" dur="11s" repeatCount="indefinite"/>
    <circle cx="268" cy="62" r="1.8" fill="#eaf2ff" opacity="0.95"/>
    <circle cx="268" cy="62" r="4.2" fill="#eaf2ff" opacity="0.12"/>
  </g>

  <!-- ========== Saturn system ========== -->
  <!-- Ring tilt group (rotate -18deg around Saturn centre 210,104) -->
  <g transform="rotate(-18 210 104)">
    <!-- Back half of ring (behind Saturn) — drawn first, dimmed -->
    <ellipse cx="210" cy="104" rx="68" ry="12" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.55"/>
    <!-- Mask: only the top half (behind the planet from viewer POV; we'll overlay planet, then ring front half) -->
    <!-- To create the "ring passes behind" illusion: we draw the full ring once, then draw planet, then draw the front half. -->
  </g>

  <!-- Saturn body with soft rim shadow -->
  <g>
    <!-- subtle planet glow -->
    <circle cx="210" cy="104" r="48" fill="#f3b26a" opacity="0.06"/>
    <circle cx="210" cy="104" r="38" fill="url(#saturn)"/>
    <!-- banding: faint horizontal bands via subtle ellipses -->
    <g clip-path="url(#planet-clip)" opacity="0.35">
      <ellipse cx="210" cy="89"  rx="40" ry="2.4" fill="#f6d79a"/>
      <ellipse cx="210" cy="96"  rx="40" ry="1.6" fill="#8a5a24"/>
      <ellipse cx="210" cy="104" rx="40" ry="3.0" fill="#e5a858"/>
      <ellipse cx="210" cy="110" rx="40" ry="1.4" fill="#6a3a14"/>
      <ellipse cx="210" cy="116" rx="40" ry="2.2" fill="#c98a3a"/>
    </g>
    <!-- limb shadow on right side (terminator) -->
    <circle cx="210" cy="104" r="38" fill="url(#space)" opacity="0.28"/>
    <!-- subtle rim highlight on illuminated side -->
    <path d="M 175 94 A 38 38 0 0 1 207 72" stroke="#fff3d4" stroke-width="0.9" fill="none" opacity="0.35"/>
  </g>

  <!-- Front half of ring (in front of Saturn) — draw ring arc that's below the planet's horizontal axis -->
  <g transform="rotate(-18 210 104)">
    <!-- Use a clip path to draw only the front (lower) half of the ring ellipse -->
    <clipPath id="ring-front">
      <rect x="130" y="104" width="160" height="20"/>
    </clipPath>
    <g clip-path="url(#ring-front)">
      <ellipse cx="210" cy="104" rx="68" ry="12" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.95"/>
    </g>
    <!-- fine ring striations rotating slowly (adds motion) -->
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 210 104" to="360 210 104" dur="41s" repeatCount="indefinite"/>
      <ellipse cx="210" cy="104" rx="64" ry="11" fill="none" stroke="#f6e2b0" stroke-width="0.3" stroke-dasharray="2 3" opacity="0.5"/>
      <ellipse cx="210" cy="104" rx="60" ry="10.3" fill="none" stroke="#d9a24a" stroke-width="0.3" stroke-dasharray="1 4" opacity="0.5"/>
      <ellipse cx="210" cy="104" rx="56" ry="9.6" fill="none" stroke="#f6e2b0" stroke-width="0.3" stroke-dasharray="3 2" opacity="0.4"/>
    </g>
  </g>

  <!-- Titan off Saturn's shoulder (lower right) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0.4 0.6; 0 0" dur="13s" repeatCount="indefinite"/>
    <circle cx="300" cy="138" r="9" fill="url(#titan)"/>
    <!-- haze halo -->
    <circle cx="300" cy="138" r="12" fill="#f3b26a" opacity="0.14"/>
    <circle cx="300" cy="138" r="14" fill="#f3b26a" opacity="0.07"/>
  </g>

  <!-- ========== Voyager 1 — small silhouette on curved trajectory ========== -->
  <!-- Trajectory arc: a long faint dashed curve from upper-left past Saturn, out lower-right, suggesting the swing-by -->
  <path d="M 10 50 Q 150 20 220 80 Q 290 140 410 180"
        fill="none" stroke="#9aa0a6" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Voyager icon — tiny, drifts along a short section of the trajectory -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="130 36; 150 42; 170 52; 190 66; 220 86; 250 112; 280 138; 310 160; 340 174"
                      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                      dur="37s" repeatCount="indefinite"/>
    <g transform="scale(1)">
      <!-- rotate slightly along path -->
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="-18; -10; 0; 12; 22; 30; 38; 44; 50"
                        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                        dur="37s" repeatCount="indefinite"/>
      <!-- bus (body) -->
      <rect x="-2.5" y="-1.8" width="5" height="3.6" fill="#c8ccd1" stroke="#1a1a20" stroke-width="0.3"/>
      <!-- high-gain dish -->
      <ellipse cx="0" cy="-5.5" rx="5" ry="1.2" fill="#e8e3d6" stroke="#1a1a20" stroke-width="0.3"/>
      <line x1="0" y1="-4.4" x2="0" y2="-1.8" stroke="#1a1a20" stroke-width="0.4"/>
      <!-- magnetometer boom -->
      <line x1="2.5" y1="0" x2="10" y2="1.2" stroke="#c8ccd1" stroke-width="0.4"/>
      <circle cx="10.2" cy="1.3" r="0.5" fill="#f3b26a"/>
      <!-- RTG arm -->
      <line x1="-2.5" y1="0.5" x2="-7" y2="1.8" stroke="#c8ccd1" stroke-width="0.4"/>
      <rect x="-9" y="1.1" width="2.2" height="1.4" fill="#8a5a24"/>
      <!-- science scan platform -->
      <line x1="2.4" y1="1.6" x2="4.6" y2="3.4" stroke="#c8ccd1" stroke-width="0.4"/>
      <rect x="4.4" y="3" width="1.6" height="1.2" fill="#c8ccd1"/>
    </g>
  </g>

  <!-- Radio pings home — a few expanding circles emanating back toward the Sun (far-right small dot) -->
  <g fill="none" stroke="#9aa0a6" stroke-width="0.4" opacity="0.5">
    <circle cx="260" cy="122" r="3">
      <animate attributeName="r" values="2;14;2" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="122" r="3">
      <animate attributeName="r" values="2;14;2" dur="11s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="11s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="122" r="3">
      <animate attributeName="r" values="2;14;2" dur="11s" begin="-8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="11s" begin="-8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ========== Separator ========== -->
  <line x1="420" y1="30" x2="420" y2="170" stroke="#d9a24a" stroke-width="0.6" opacity="0.3"/>

  <!-- ========== Right text stack ========== -->
  <!-- Date headline -->
  <text x="610" y="58" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f1e8d6" letter-spacing="2.0">
    NOVEMBER 12, 2026
  </text>

  <!-- Twin bar: amber over cream -->
  <line x1="438" y1="74" x2="782" y2="74" stroke="#d9a24a" stroke-width="2.6" opacity="0.95"/>
  <line x1="438" y1="80" x2="782" y2="80" stroke="#f1e8d6" stroke-width="1.6" opacity="0.85"/>

  <!-- Subhead -->
  <text x="610" y="104" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="800" letter-spacing="2.4" fill="#f1e8d6">
    VOYAGER 1 &#183; SATURN FLYBY
  </text>

  <!-- Tertiary italic -->
  <text x="610" y="124" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10.5" font-style="italic" fill="#f3b26a" letter-spacing="0.6">
    NOV 12, 1980 &#183; 46 YEARS
  </text>

  <!-- Roster -->
  <text x="610" y="145" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.6" font-weight="700" fill="#9aa0a6" letter-spacing="2.0" opacity="0.95">
    TITAN &#183; RINGS &#183; GRAND TOUR &#183; HELIOPAUSE &#183; GOLDEN RECORD
  </text>

  <!-- Caption -->
  <text x="610" y="188" text-anchor="middle"
        font-family="'Georgia', serif" font-size="12" font-style="italic" fill="#f1e8d6" opacity="0.95">
    &#8220;Still travelling.&#8221;
  </text>
</svg>
