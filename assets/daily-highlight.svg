<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Formula One World Championship 76th anniversary (May 13, 1950, Silverstone British GP, won by Giuseppe Farina in Alfa Romeo 158) — race car, checkered flag, speed lines, asphalt and racing red -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 13, 2026 — Formula One World Championship 76th anniversary">
  <defs>
    <!-- night-asphalt backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f1620"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>

    <!-- racing red gradient for car body and title -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff5b5b"/>
      <stop offset="60%" stop-color="#d8202a"/>
      <stop offset="100%" stop-color="#7a0d12"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffd84a"/>
      <stop offset="100%" stop-color="#d8202a"/>
    </linearGradient>

    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2a2f36"/>
      <stop offset="50%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#2a2f36"/>
    </linearGradient>

    <!-- speed line repeating gradient for asphalt rush -->
    <linearGradient id="speedLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffd84a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd84a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd84a" stop-opacity="0"/>
    </linearGradient>

    <!-- glow for the date/text -->
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>

    <!-- checkered flag pattern -->
    <pattern id="checker" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#0a0a0a"/>
      <rect x="0" y="0" width="7" height="7" fill="#f5f5f5"/>
      <rect x="7" y="7" width="7" height="7" fill="#f5f5f5"/>
    </pattern>

    <!-- subtle dashed pit lane line -->
    <pattern id="laneDash" width="22" height="6" patternUnits="userSpaceOnUse">
      <rect width="14" height="2" y="2" fill="#ffd84a" opacity="0.55"/>
    </pattern>

    <!-- F1 car symbol: low-slung open-wheel silhouette, vintage-leaning -->
    <symbol id="f1car" overflow="visible">
      <!-- rear wing -->
      <rect x="34" y="-22" width="16" height="3" fill="#222" />
      <rect x="36" y="-19" width="12" height="9" fill="#222"/>
      <!-- engine cover -->
      <path d="M -10 -10 Q 18 -16 38 -14 L 42 -8 L 42 -2 L -10 -2 Z" fill="url(#redGrad)" stroke="#3a0507" stroke-width="0.6"/>
      <!-- nose cone -->
      <path d="M -10 -8 L -42 -3 L -42 1 L -10 -2 Z" fill="url(#redGrad)" stroke="#3a0507" stroke-width="0.6"/>
      <!-- cockpit halo -->
      <path d="M 4 -14 Q 8 -22 22 -22 Q 26 -16 26 -14" fill="none" stroke="#1a1a1a" stroke-width="2"/>
      <!-- driver helmet -->
      <path d="M 10 -16 Q 14 -22 22 -20 Q 24 -16 22 -12 L 12 -12 Z" fill="#ffd84a"/>
      <rect x="11" y="-16" width="11" height="2" fill="#0a0a0a"/>
      <!-- side pod airbox -->
      <path d="M -2 -10 Q 4 -16 18 -14 L 18 -10 Z" fill="#3a0507"/>
      <!-- front wing -->
      <rect x="-46" y="-1" width="14" height="3" fill="#1a1a1a"/>
      <rect x="-44" y="2" width="10" height="2" fill="#222"/>
      <!-- racing number 76 on side pod -->
      <circle cx="6" cy="-7" r="4.5" fill="#fff"/>
      <text x="6" y="-5" font-size="6" font-weight="900" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
            fill="#d8202a">76</text>
      <!-- rear tire -->
      <circle cx="32" cy="4" r="9" fill="#0a0a0a"/>
      <circle cx="32" cy="4" r="4" fill="#2a2a2a"/>
      <circle cx="32" cy="4" r="1.5" fill="#888"/>
      <!-- front tire -->
      <circle cx="-30" cy="4" r="8" fill="#0a0a0a"/>
      <circle cx="-30" cy="4" r="3.5" fill="#2a2a2a"/>
      <circle cx="-30" cy="4" r="1.2" fill="#888"/>
    </symbol>
  </defs>

  <!-- ============= BACKDROP ============= -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- distant grandstand silhouette + heat haze -->
  <g opacity="0.5">
    <rect x="0" y="60" width="800" height="20" fill="#15191f"/>
    <g fill="#1c2129">
      <polygon points="0,60 60,52 120,60"/>
      <polygon points="120,60 200,48 280,60"/>
      <polygon points="280,60 360,54 440,60"/>
      <polygon points="440,60 520,46 600,60"/>
      <polygon points="600,60 680,52 760,60"/>
      <polygon points="760,60 800,56 800,60"/>
    </g>
    <!-- crowd dots -->
    <g fill="#3a4250">
      <circle cx="40" cy="66" r="0.9"/><circle cx="80" cy="64" r="0.8"/><circle cx="160" cy="62" r="1"/>
      <circle cx="220" cy="66" r="0.8"/><circle cx="300" cy="64" r="0.9"/><circle cx="380" cy="66" r="0.8"/>
      <circle cx="460" cy="62" r="1"/><circle cx="540" cy="66" r="0.8"/><circle cx="620" cy="64" r="0.9"/>
      <circle cx="700" cy="66" r="0.8"/><circle cx="760" cy="64" r="0.9"/>
    </g>
  </g>

  <!-- ============= TRACK ASPHALT BAND ============= -->
  <rect x="0" y="120" width="800" height="64" fill="url(#trackGrad)"/>
  <!-- kerb stripes (red/white) above and below track -->
  <g>
    <rect x="0" y="116" width="800" height="4" fill="#d8202a"/>
    <g fill="#fff">
      <rect x="0"   y="116" width="20" height="4"/>
      <rect x="40"  y="116" width="20" height="4"/>
      <rect x="80"  y="116" width="20" height="4"/>
      <rect x="120" y="116" width="20" height="4"/>
      <rect x="160" y="116" width="20" height="4"/>
      <rect x="200" y="116" width="20" height="4"/>
      <rect x="240" y="116" width="20" height="4"/>
      <rect x="280" y="116" width="20" height="4"/>
      <rect x="320" y="116" width="20" height="4"/>
      <rect x="360" y="116" width="20" height="4"/>
      <rect x="400" y="116" width="20" height="4"/>
      <rect x="440" y="116" width="20" height="4"/>
      <rect x="480" y="116" width="20" height="4"/>
      <rect x="520" y="116" width="20" height="4"/>
      <rect x="560" y="116" width="20" height="4"/>
      <rect x="600" y="116" width="20" height="4"/>
      <rect x="640" y="116" width="20" height="4"/>
      <rect x="680" y="116" width="20" height="4"/>
      <rect x="720" y="116" width="20" height="4"/>
      <rect x="760" y="116" width="20" height="4"/>
    </g>
    <rect x="0" y="184" width="800" height="4" fill="#d8202a"/>
    <g fill="#fff">
      <rect x="20"  y="184" width="20" height="4"/>
      <rect x="60"  y="184" width="20" height="4"/>
      <rect x="100" y="184" width="20" height="4"/>
      <rect x="140" y="184" width="20" height="4"/>
      <rect x="180" y="184" width="20" height="4"/>
      <rect x="220" y="184" width="20" height="4"/>
      <rect x="260" y="184" width="20" height="4"/>
      <rect x="300" y="184" width="20" height="4"/>
      <rect x="340" y="184" width="20" height="4"/>
      <rect x="380" y="184" width="20" height="4"/>
      <rect x="420" y="184" width="20" height="4"/>
      <rect x="460" y="184" width="20" height="4"/>
      <rect x="500" y="184" width="20" height="4"/>
      <rect x="540" y="184" width="20" height="4"/>
      <rect x="580" y="184" width="20" height="4"/>
      <rect x="620" y="184" width="20" height="4"/>
      <rect x="660" y="184" width="20" height="4"/>
      <rect x="700" y="184" width="20" height="4"/>
      <rect x="740" y="184" width="20" height="4"/>
      <rect x="780" y="184" width="20" height="4"/>
    </g>
  </g>

  <!-- center line dashes traveling left (illusion of speed) -->
  <g>
    <g fill="#ffd84a" opacity="0.85">
      <rect x="0"   y="151" width="36" height="3"/>
      <rect x="80"  y="151" width="36" height="3"/>
      <rect x="160" y="151" width="36" height="3"/>
      <rect x="240" y="151" width="36" height="3"/>
      <rect x="320" y="151" width="36" height="3"/>
      <rect x="400" y="151" width="36" height="3"/>
      <rect x="480" y="151" width="36" height="3"/>
      <rect x="560" y="151" width="36" height="3"/>
      <rect x="640" y="151" width="36" height="3"/>
      <rect x="720" y="151" width="36" height="3"/>
      <rect x="800" y="151" width="36" height="3"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -80 0" dur="0.7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ============= SPEED STREAKS over track ============= -->
  <g opacity="0.7">
    <rect x="-200" y="134" width="180" height="1.5" fill="url(#speedLine)">
      <animate attributeName="x" values="-200;820" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-200" y="142" width="220" height="1" fill="url(#speedLine)">
      <animate attributeName="x" values="-200;820" dur="1.7s" begin="-0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-200" y="160" width="200" height="1.2" fill="url(#speedLine)">
      <animate attributeName="x" values="-200;820" dur="1.1s" begin="-0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="-200" y="168" width="180" height="1" fill="url(#speedLine)">
      <animate attributeName="x" values="-200;820" dur="1.9s" begin="-0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-200" y="176" width="240" height="1.5" fill="url(#speedLine)">
      <animate attributeName="x" values="-200;820" dur="1.5s" begin="-1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ============= F1 CAR (left, racing rightward) ============= -->
  <g>
    <!-- subtle car shadow on track -->
    <ellipse cx="120" cy="170" rx="56" ry="3" fill="#000" opacity="0.5">
      <animate attributeName="rx" values="54;58;54" dur="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <use href="#f1car" transform="translate(120,156)">
      <!-- gentle vertical bounce to simulate vibration -->
      <animateTransform attributeName="transform" type="translate"
                        values="120,156; 120,155.4; 120,156.4; 120,156" dur="0.3s" repeatCount="indefinite"/>
    </use>
    <!-- tire smoke puffs trailing behind -->
    <g fill="#aab1bb" opacity="0.6">
      <circle cx="60" cy="164" r="3">
        <animate attributeName="cx" values="80;-20" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="r"  values="2;7" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="170" r="2.4">
        <animate attributeName="cx" values="80;-20" dur="2.1s" begin="-0.5s" repeatCount="indefinite"/>
        <animate attributeName="r"  values="2;7" dur="2.1s" begin="-0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="2.1s" begin="-0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="65" cy="160" r="2.6">
        <animate attributeName="cx" values="80;-20" dur="1.9s" begin="-1.1s" repeatCount="indefinite"/>
        <animate attributeName="r"  values="2;6" dur="1.9s" begin="-1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="1.9s" begin="-1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ============= CHECKERED FLAG (right, waving) ============= -->
  <g transform="translate(700,38)">
    <!-- pole -->
    <rect x="0" y="0" width="2.5" height="100" fill="#aab1bb"/>
    <circle cx="1.25" cy="-3" r="3" fill="#ffd84a"/>
    <!-- flag with skew wave -->
    <g>
      <path d="M 2 4
               Q 24 0 44 6
               Q 64 12 84 4
               L 84 50
               Q 64 58 44 52
               Q 24 46 2 50 Z"
            fill="url(#checker)" stroke="#0a0a0a" stroke-width="0.5">
        <animate attributeName="d"
                 values="M 2 4 Q 24 0 44 6 Q 64 12 84 4 L 84 50 Q 64 58 44 52 Q 24 46 2 50 Z;
                         M 2 4 Q 24 10 44 2 Q 64 -4 84 8 L 84 54 Q 64 42 44 56 Q 24 60 2 50 Z;
                         M 2 4 Q 24 0 44 6 Q 64 12 84 4 L 84 50 Q 64 58 44 52 Q 24 46 2 50 Z"
                 dur="1.7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- ============= CENTER TITLE BLOCK ============= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- legibility plaque -->
    <rect x="200" y="22" width="440" height="86" rx="8" ry="8" fill="#0a0d12" opacity="0.82"/>
    <rect x="200" y="22" width="440" height="86" rx="8" ry="8" fill="none" stroke="#d8202a" stroke-width="1"/>
    <!-- racing stripe accent -->
    <rect x="200" y="22" width="6" height="86" fill="#d8202a"/>
    <rect x="634" y="22" width="6" height="86" fill="#d8202a"/>

    <!-- eyebrow -->
    <text x="420" y="44" font-size="10" letter-spacing="5" font-weight="800"
          fill="#ffd84a" filter="url(#glow)">
      FORMULA ONE WORLD CHAMPIONSHIP · 76 YEARS
    </text>

    <!-- giant date -->
    <text x="420" y="84" font-size="40" font-weight="900" letter-spacing="3"
          fill="url(#titleGrad)" filter="url(#glow)">
      May 13, 2026
    </text>

    <!-- subtitle -->
    <text x="420" y="102" font-size="9.5" font-weight="700" letter-spacing="3.5"
          fill="#f4f4f4" opacity="0.95">
      SILVERSTONE · 13 MAY 1950 · FARINA · ALFA ROMEO 158
    </text>
  </g>

  <!-- lap counter pill (top-left) -->
  <g transform="translate(20,22)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="74" height="22" rx="4" fill="#0a0d12" stroke="#ffd84a" stroke-width="0.8"/>
    <text x="8" y="15" font-size="10" font-weight="800" fill="#ffd84a" letter-spacing="2">LAP 76/76</text>
  </g>

  <!-- starting lights row (top-right) -->
  <g transform="translate(706,24)">
    <circle cx="0"  cy="0" r="3" fill="#d8202a">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="0" r="3" fill="#d8202a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" begin="-0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="0" r="3" fill="#d8202a">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" begin="-0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="0" r="3" fill="#d8202a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="0" r="3" fill="#d8202a">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
