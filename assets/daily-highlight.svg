<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Mick Jagger's 83rd Birthday — Born July 26, 1943, in Dartford, Kent, England. Lead singer and co-founder of The Rolling Stones (1962), one of the longest-running acts in rock and roll. Knighted 2003. A stage-lit rock tableau: an oversized Rolling Stones tongue-and-lips logo on the left (glossy crimson lips, hot-pink tongue lolling out, white teeth), sweeping stage-light beams criss-crossing behind, a silhouetted electric guitar neck angling in from the lower-left, a scatter of gold stage sparks and floating musical notes, warm crimson-to-black backdrop. Large ivory JULY 26, 2026 headline dominates upper-right; crimson MICK JAGGER · 83 YEARS subhead; italic DARTFORD · 26 JULY 1943 · THE ROLLING STONES tertiary. Palette: near-black #0d1117, deep crimson #1a0510, stage plum #2a0a1e, lips crimson #e91429, lips highlight #ff2a3a, tongue pink #ff5a75, tongue shadow #b81a3a, teeth cream #f4efdc, gold spark #f4d066, warm beam #fff2a8, ivory #f4efdc, sub crimson #ff4a5f. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle for July 26, 2026 — Mick Jagger's 83rd birthday. An oversized Rolling Stones tongue-and-lips logo on the left with glossy crimson lips, a hot-pink tongue lolling out, and white teeth; sweeping stage-light beams criss-crossing behind; a silhouetted electric guitar neck angling in from the lower-left; a scatter of gold stage sparks and floating musical notes; a warm crimson-to-black backdrop. A large ivory JULY 26, 2026 headline dominates the upper-right, with a crimson MICK JAGGER · 83 YEARS subhead and italic DARTFORD · 26 JULY 1943 · THE ROLLING STONES tertiary along the bottom.">
  <defs>
    <!-- Warm stage backdrop, black bleeding into crimson -->
    <radialGradient id="bg" cx="35%" cy="55%" r="80%">
      <stop offset="0%"   stop-color="#2a0a1e"/>
      <stop offset="55%"  stop-color="#1a0510"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <!-- Upper-lip gradient — glossy crimson with a high specular ridge -->
    <linearGradient id="upperLip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ff5060"/>
      <stop offset="30%"  stop-color="#ff2a3a"/>
      <stop offset="70%"  stop-color="#c8121e"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </linearGradient>

    <!-- Lower-lip gradient — pillowy, brighter mid-highlight -->
    <linearGradient id="lowerLip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a80818"/>
      <stop offset="35%"  stop-color="#e91429"/>
      <stop offset="60%"  stop-color="#ff3a4a"/>
      <stop offset="100%" stop-color="#7a0410"/>
    </linearGradient>

    <!-- Tongue gradient — hot pink to deeper wine -->
    <linearGradient id="tongue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ff8fa8"/>
      <stop offset="45%"  stop-color="#ff5a75"/>
      <stop offset="100%" stop-color="#b81a3a"/>
    </linearGradient>

    <!-- Stage light cone -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fff2a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff2a8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft rim behind the lips (halo of red glow) -->
    <radialGradient id="lipsGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#ff2a3a" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#c8121e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8121e" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="60%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Spark radial -->
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff5dc" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#f4d066" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f4d066" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="800" height="200" fill="url(#bg)"/>

  <!-- =============================================================== -->
  <!-- Stage-light beams criss-crossing behind the lips                  -->
  <!-- =============================================================== -->
  <g opacity="0.5">
    <!-- Beam 1: from upper-left, sweeping -->
    <g transform="translate(120,-20)">
      <polygon points="0,0 -60,220 60,220" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate"
                          values="-18;12;-18" dur="13s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <!-- Beam 2: from upper-middle, opposing sweep -->
    <g transform="translate(300,-20)">
      <polygon points="0,0 -70,220 70,220" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate"
                          values="15;-10;15" dur="11s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <!-- Beam 3: crimson beam from right side -->
    <g transform="translate(220,-20)" opacity="0.55">
      <polygon points="0,0 -40,220 40,220" fill="#ff2a3a" fill-opacity="0.14">
        <animateTransform attributeName="transform" type="rotate"
                          values="-5;25;-5" dur="17s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- =============================================================== -->
  <!-- Lower-left: silhouetted electric guitar neck angling in         -->
  <!-- =============================================================== -->
  <g transform="translate(-10,200) rotate(-24)" opacity="0.85">
    <!-- neck -->
    <rect x="0" y="-14" width="180" height="14" fill="#1a0510" stroke="#3a1020" stroke-width="0.6"/>
    <!-- fret markers -->
    <g fill="#f4efdc" opacity="0.55">
      <circle cx="30" cy="-7" r="1.4"/>
      <circle cx="55" cy="-7" r="1.4"/>
      <circle cx="80" cy="-7" r="1.4"/>
      <circle cx="105" cy="-7" r="1.4"/>
      <circle cx="130" cy="-7" r="1.4"/>
    </g>
    <!-- frets (thin vertical bars) -->
    <g stroke="#8a6a3a" stroke-width="0.6" opacity="0.7">
      <line x1="20"  y1="-14" x2="20"  y2="0"/>
      <line x1="42"  y1="-14" x2="42"  y2="0"/>
      <line x1="66"  y1="-14" x2="66"  y2="0"/>
      <line x1="92"  y1="-14" x2="92"  y2="0"/>
      <line x1="120" y1="-14" x2="120" y2="0"/>
      <line x1="150" y1="-14" x2="150" y2="0"/>
    </g>
    <!-- strings -->
    <g stroke="#dfe8ff" stroke-width="0.35" opacity="0.55">
      <line x1="0" y1="-11" x2="180" y2="-11"/>
      <line x1="0" y1="-8"  x2="180" y2="-8"/>
      <line x1="0" y1="-5"  x2="180" y2="-5"/>
      <line x1="0" y1="-2"  x2="180" y2="-2"/>
    </g>
    <!-- headstock -->
    <path d="M 180,-16 L 220,-20 L 224,-10 L 220,4 L 180,2 Z" fill="#1a0510" stroke="#3a1020" stroke-width="0.6"/>
    <!-- tuning pegs -->
    <g fill="#f4d066" opacity="0.85">
      <circle cx="192" cy="-16" r="1.6"/>
      <circle cx="204" cy="-18" r="1.6"/>
      <circle cx="216" cy="-15" r="1.6"/>
      <circle cx="192" cy="0"   r="1.6"/>
      <circle cx="204" cy="2"   r="1.6"/>
      <circle cx="216" cy="-1"  r="1.6"/>
    </g>
  </g>

  <!-- =============================================================== -->
  <!-- CENTER-LEFT: the iconic tongue-and-lips logo                     -->
  <!-- Group centered at (240, 108). Overall footprint ~ 200 x 120.     -->
  <!-- =============================================================== -->
  <g transform="translate(240,108)">
    <!-- Warm halo behind lips -->
    <ellipse cx="0" cy="0" rx="130" ry="80" fill="url(#lipsGlow)">
      <animate attributeName="rx" values="126;136;126" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="78;84;78"    dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Lips + tongue as one pulsing unit -->
    <g>
      <animateTransform attributeName="transform" type="scale"
                        values="1 1; 1.04 1.06; 1 1" dur="1.4s" repeatCount="indefinite"/>

      <!-- UPPER LIP — cupid's bow, slight dip in the middle -->
      <path d="M -95,-6
               C -80,-38 -55,-42 -40,-22
               C -30,-6  -12,-4  0,-14
               C 12,-4   30,-6   40,-22
               C 55,-42  80,-38  95,-6
               C 60,-2   30,-2   0,-2
               C -30,-2  -60,-2  -95,-6 Z"
            fill="url(#upperLip)" stroke="#4a0208" stroke-width="0.8"/>

      <!-- Upper-lip specular highlight ridge -->
      <path d="M -60,-24 C -40,-32 -20,-30 0,-22 C 20,-30 40,-32 60,-24"
            fill="none" stroke="#ff8090" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>

      <!-- TEETH — small strip peeking behind the tongue -->
      <g>
        <rect x="-38" y="-3" width="76" height="12" fill="#f4efdc" rx="1"/>
        <!-- tooth gaps -->
        <g stroke="#c8b898" stroke-width="0.4" opacity="0.6">
          <line x1="-26" y1="-3" x2="-26" y2="9"/>
          <line x1="-14" y1="-3" x2="-14" y2="9"/>
          <line x1="-2"  y1="-3" x2="-2"  y2="9"/>
          <line x1="10"  y1="-3" x2="10"  y2="9"/>
          <line x1="22"  y1="-3" x2="22"  y2="9"/>
        </g>
      </g>

      <!-- TONGUE — the iconic lolling shape, curling out to lower-right -->
      <path d="M -30,-2
               C -40,20  -30,44  -6,52
               C 20,60   50,60   72,50
               C 92,42   96,26   82,18
               C 66,10   40,14   22,20
               C 10,24   0,22   -6,14
               C -14,4   -22,-2  -30,-2 Z"
            fill="url(#tongue)" stroke="#4a0208" stroke-width="0.8"/>

      <!-- Tongue centerline groove -->
      <path d="M -10,10 C 10,26 40,38 70,42"
            fill="none" stroke="#8a1030" stroke-width="1.2" opacity="0.55"/>

      <!-- Tongue highlight glint -->
      <ellipse cx="40" cy="26" rx="20" ry="4" fill="#ffb0c0" opacity="0.7"/>

      <!-- LOWER LIP — big, pillowy -->
      <path d="M -95,-6
               C -85,26  -55,44  -20,44
               C 0,44    12,42   28,38
               C 55,32   82,20   95,-6
               C 60,4    30,6    0,6
               C -30,6   -60,4   -95,-6 Z"
            fill="url(#lowerLip)" stroke="#4a0208" stroke-width="0.8"/>

      <!-- Lower-lip highlight -->
      <path d="M -60,22 C -40,32 -20,34 0,32 C 20,30 40,26 60,18"
            fill="none" stroke="#ff8090" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- little bright glint dot on upper lip -->
    <circle cx="-38" cy="-26" r="2.4" fill="#fff5dc" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =============================================================== -->
  <!-- Floating musical notes drifting up                                -->
  <!-- =============================================================== -->
  <g fill="#f4efdc" opacity="0.85"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="410" y="170" font-size="22" fill="#ff5a75">
      ♪
      <animate attributeName="y" from="200" to="-20" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="13s" repeatCount="indefinite"/>
    </text>
    <text x="440" y="170" font-size="18" fill="#f4d066">
      ♫
      <animate attributeName="y" from="200" to="-20" dur="17s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="17s" begin="-4s" repeatCount="indefinite"/>
    </text>
    <text x="380" y="170" font-size="16" fill="#fff5dc">
      ♪
      <animate attributeName="y" from="200" to="-20" dur="19s" begin="-8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="19s" begin="-8s" repeatCount="indefinite"/>
    </text>
    <text x="470" y="170" font-size="20" fill="#ff2a3a">
      ♩
      <animate attributeName="y" from="200" to="-20" dur="11s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="-2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- =============================================================== -->
  <!-- Gold stage sparks scattered around                                -->
  <!-- =============================================================== -->
  <g>
    <circle cx="150" cy="40" r="2.5" fill="url(#spark)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="60" r="2" fill="url(#spark)">
      <animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="180" r="2" fill="url(#spark)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="150" r="1.6" fill="url(#spark)">
      <animate attributeName="opacity" values="1;0.4;1" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="30" r="1.8" fill="url(#spark)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="410" cy="35" r="1.8" fill="url(#spark)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =============================================================== -->
  <!-- RIGHT: text block                                                 -->
  <!-- =============================================================== -->
  <!-- Dark cushion behind the headline for legibility -->
  <ellipse cx="620" cy="72" rx="200" ry="42" fill="#0d1117" opacity="0.55"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Headline — the date, dominant -->
    <text x="785" y="74" text-anchor="end" fill="#f4efdc" font-size="34" font-weight="700" letter-spacing="1">
      JULY 26, 2026
    </text>

    <!-- Subhead — crimson, honoree + years -->
    <text x="785" y="104" text-anchor="end" fill="#ff4a5f" font-size="15" font-weight="700" letter-spacing="3">
      MICK JAGGER · 83 YEARS
    </text>

    <!-- Tertiary — italic, small letter-spaced -->
    <text x="785" y="124" text-anchor="end" fill="#f4d066" font-size="10" font-style="italic" letter-spacing="2" opacity="0.9">
      DARTFORD · 26 JULY 1943 · THE ROLLING STONES
    </text>

    <!-- Stage stamp -->
    <text x="785" y="154" text-anchor="end" fill="#ff8090" font-size="8" opacity="0.6" letter-spacing="3">
      SATISFACTION · GIMME SHELTER · PAINT IT BLACK
    </text>
  </g>

  <!-- Vignette on top -->
  <rect width="800" height="200" fill="url(#vig)"/>
</svg>
