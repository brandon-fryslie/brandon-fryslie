<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: UNIVAC I 75th anniversary (June 14, 1951 — Remington Rand delivers the first UNIVAC I to the US Census Bureau; the first commercial computer in the United States). Mid-century mainframe console with a row of glowing vacuum tubes, a phosphor-green CRT showing the date, blinking patch-panel indicator lights, two flanking UNISERVO reel-to-reel tape drives spinning in opposite directions, and a punched paper tape drifting across the top. Palette: vacuum-tube amber, brushed-steel blue-grey, phosphor green, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="June 14, 2026 — UNIVAC I 75th anniversary: first commercial computer delivered to the US Census Bureau on June 14, 1951">
  <defs>
    <radialGradient id="tubeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff1ad"/>
      <stop offset="35%" stop-color="#ffb155" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#a64a18" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a1408" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="console" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a4153"/>
      <stop offset="55%" stop-color="#262d3c"/>
      <stop offset="100%" stop-color="#161b28"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0e2418"/>
      <stop offset="100%" stop-color="#06140c"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="55%" r="62%">
      <stop offset="0%"  stop-color="#7dffb6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1e6b3b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reelHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#dde3ec"/>
      <stop offset="60%" stop-color="#7a8190"/>
      <stop offset="100%" stop-color="#2c3140"/>
    </radialGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e3cda3"/>
      <stop offset="100%" stop-color="#b89968"/>
    </linearGradient>

    <g id="reel">
      <circle r="22" fill="#1a1f2c" stroke="#aab2c1" stroke-width="1.1"/>
      <circle r="17" fill="#3a2b18"/>
      <circle r="17" fill="none" stroke="#c79c5e" stroke-width="0.35" opacity="0.65"/>
      <g stroke="#cdd4dd" stroke-width="1.3" stroke-linecap="round" opacity="0.92">
        <line x1="0" y1="-5" x2="0" y2="-15"/>
        <line x1="0" y1="5"  x2="0" y2="15"/>
        <line x1="-5" y1="0" x2="-15" y2="0"/>
        <line x1="5"  y1="0" x2="15"  y2="0"/>
        <line x1="-3.5" y1="-3.5" x2="-10.5" y2="-10.5"/>
        <line x1="3.5"  y1="3.5"  x2="10.5"  y2="10.5"/>
        <line x1="-3.5" y1="3.5"  x2="-10.5" y2="10.5"/>
        <line x1="3.5"  y1="-3.5" x2="10.5"  y2="-10.5"/>
      </g>
      <circle r="6" fill="url(#reelHub)"/>
      <circle r="1.8" fill="#10141c"/>
    </g>

    <g id="tube">
      <circle r="13" fill="url(#tubeGlow)"/>
      <ellipse cx="0" cy="-1" rx="5.5" ry="8.5" fill="#150c06" stroke="#9aa1ae" stroke-width="0.45" opacity="0.95"/>
      <path d="M-2.4,-4.5 Q0,-0.6 2.4,-4.5 M-2.4,2 Q0,-1 2.4,2" stroke="#ffd07a" stroke-width="0.55" fill="none" opacity="0.95"/>
      <circle cx="0" cy="-8.5" r="1.2" fill="#5a4020"/>
      <rect x="-5" y="6.5" width="10" height="2.5" fill="#2a3140" stroke="#7a8392" stroke-width="0.3"/>
    </g>

    <!-- 200px-wide punched paper tape segment, tiled by translate -->
    <g id="tape-segment">
      <rect x="0" y="0" width="200" height="14" fill="url(#tape)"/>
      <rect x="0" y="0" width="200" height="14" fill="none" stroke="#7a6b4a" stroke-width="0.35"/>
      <g fill="#0d1117">
        <circle cx="8"   cy="7" r="0.7"/><circle cx="18"  cy="7" r="0.7"/>
        <circle cx="28"  cy="7" r="0.7"/><circle cx="38"  cy="7" r="0.7"/>
        <circle cx="48"  cy="7" r="0.7"/><circle cx="58"  cy="7" r="0.7"/>
        <circle cx="68"  cy="7" r="0.7"/><circle cx="78"  cy="7" r="0.7"/>
        <circle cx="88"  cy="7" r="0.7"/><circle cx="98"  cy="7" r="0.7"/>
        <circle cx="108" cy="7" r="0.7"/><circle cx="118" cy="7" r="0.7"/>
        <circle cx="128" cy="7" r="0.7"/><circle cx="138" cy="7" r="0.7"/>
        <circle cx="148" cy="7" r="0.7"/><circle cx="158" cy="7" r="0.7"/>
        <circle cx="168" cy="7" r="0.7"/><circle cx="178" cy="7" r="0.7"/>
        <circle cx="188" cy="7" r="0.7"/><circle cx="198" cy="7" r="0.7"/>
      </g>
      <g fill="#0d1117">
        <circle cx="13" cy="3" r="1.1"/><circle cx="33" cy="3" r="1.1"/>
        <circle cx="43" cy="3" r="1.1"/><circle cx="73" cy="3" r="1.1"/>
        <circle cx="93" cy="3" r="1.1"/><circle cx="103" cy="3" r="1.1"/>
        <circle cx="123" cy="3" r="1.1"/><circle cx="153" cy="3" r="1.1"/>
        <circle cx="163" cy="3" r="1.1"/><circle cx="183" cy="3" r="1.1"/>
      </g>
      <g fill="#0d1117">
        <circle cx="23" cy="11" r="1.1"/><circle cx="53" cy="11" r="1.1"/>
        <circle cx="63" cy="11" r="1.1"/><circle cx="83" cy="11" r="1.1"/>
        <circle cx="113" cy="11" r="1.1"/><circle cx="143" cy="11" r="1.1"/>
        <circle cx="173" cy="11" r="1.1"/><circle cx="193" cy="11" r="1.1"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="200" fill="#0d1117"/>

  <!-- ambient warm wash from below -->
  <ellipse cx="400" cy="230" rx="540" ry="100" fill="url(#tubeGlow)" opacity="0.10"/>

  <!-- floor grid -->
  <g stroke="#1a2435" stroke-width="0.4" opacity="0.5">
    <line x1="0" y1="182" x2="800" y2="182"/>
    <line x1="0" y1="194" x2="800" y2="194"/>
    <line x1="60"  y1="182" x2="20"  y2="200"/>
    <line x1="200" y1="182" x2="180" y2="200"/>
    <line x1="340" y1="182" x2="340" y2="200"/>
    <line x1="460" y1="182" x2="480" y2="200"/>
    <line x1="600" y1="182" x2="620" y2="200"/>
    <line x1="740" y1="182" x2="780" y2="200"/>
  </g>

  <!-- drifting paper tape across the top -->
  <g>
    <g>
      <use href="#tape-segment" x="0"   y="4"/>
      <use href="#tape-segment" x="200" y="4"/>
      <use href="#tape-segment" x="400" y="4"/>
      <use href="#tape-segment" x="600" y="4"/>
      <use href="#tape-segment" x="800" y="4"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; -200,0" dur="23s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- LEFT TAPE DRIVE -->
  <g transform="translate(95 112)">
    <rect x="-58" y="-72" width="116" height="144" rx="6" fill="url(#console)" stroke="#5a6275" stroke-width="1"/>
    <rect x="-50" y="-64" width="100" height="128" rx="4" fill="none" stroke="#7a8392" stroke-width="0.5" opacity="0.7"/>
    <g transform="translate(0 -34)">
      <circle r="28" fill="#0a0e18" stroke="#5a6275" stroke-width="0.9"/>
      <g><use href="#reel"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(0 34)">
      <circle r="28" fill="#0a0e18" stroke="#5a6275" stroke-width="0.9"/>
      <g><use href="#reel"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      </g>
    </g>
    <path d="M-20,-34 Q-30,0 -20,34 M20,-34 Q30,0 20,34" stroke="#c79c5e" stroke-width="0.8" fill="none" opacity="0.75"/>
    <rect x="-32" y="56" width="64" height="9" fill="#0a0e18" stroke="#7a8392" stroke-width="0.4"/>
    <text x="0" y="63" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#c6cdd8" letter-spacing="2.5">UNISERVO</text>
  </g>

  <!-- RIGHT TAPE DRIVE -->
  <g transform="translate(705 112)">
    <rect x="-58" y="-72" width="116" height="144" rx="6" fill="url(#console)" stroke="#5a6275" stroke-width="1"/>
    <rect x="-50" y="-64" width="100" height="128" rx="4" fill="none" stroke="#7a8392" stroke-width="0.5" opacity="0.7"/>
    <g transform="translate(0 -34)">
      <circle r="28" fill="#0a0e18" stroke="#5a6275" stroke-width="0.9"/>
      <g><use href="#reel"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(0 34)">
      <circle r="28" fill="#0a0e18" stroke="#5a6275" stroke-width="0.9"/>
      <g><use href="#reel"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
      </g>
    </g>
    <path d="M-20,-34 Q-30,0 -20,34 M20,-34 Q30,0 20,34" stroke="#c79c5e" stroke-width="0.8" fill="none" opacity="0.75"/>
    <rect x="-32" y="56" width="64" height="9" fill="#0a0e18" stroke="#7a8392" stroke-width="0.4"/>
    <text x="0" y="63" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#c6cdd8" letter-spacing="2.5">UNISERVO</text>
  </g>

  <!-- CENTER MAINFRAME CONSOLE -->
  <g transform="translate(400 110)">
    <!-- cabinet -->
    <rect x="-204" y="-82" width="408" height="166" rx="9" fill="url(#console)" stroke="#7a8392" stroke-width="1"/>
    <!-- top dark bay where tubes mount -->
    <rect x="-196" y="-76" width="392" height="32" rx="3" fill="#0a0e18" stroke="#7a8392" stroke-width="0.5"/>

    <!-- row of vacuum tubes -->
    <g transform="translate(0 -60)">
      <g transform="translate(-175 0)"><use href="#tube"/></g>
      <g transform="translate(-140 0)"><use href="#tube"/></g>
      <g transform="translate(-105 0)"><use href="#tube"/></g>
      <g transform="translate(-70 0)"><use href="#tube"/></g>
      <g transform="translate(-35 0)"><use href="#tube"/></g>
      <g transform="translate(0 0)"><use href="#tube"/></g>
      <g transform="translate(35 0)"><use href="#tube"/></g>
      <g transform="translate(70 0)"><use href="#tube"/></g>
      <g transform="translate(105 0)"><use href="#tube"/></g>
      <g transform="translate(140 0)"><use href="#tube"/></g>
      <g transform="translate(175 0)"><use href="#tube"/></g>
      <!-- staggered flicker pulses to make the row feel alive -->
      <circle cx="-140" cy="0" r="13" fill="url(#tubeGlow)"><animate attributeName="opacity" values="0;0.55;0" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="-35"  cy="0" r="13" fill="url(#tubeGlow)"><animate attributeName="opacity" values="0;0.5;0"  dur="4.3s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="70"   cy="0" r="13" fill="url(#tubeGlow)"><animate attributeName="opacity" values="0;0.55;0" dur="5.1s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <circle cx="175"  cy="0" r="13" fill="url(#tubeGlow)"><animate attributeName="opacity" values="0;0.5;0"  dur="6.7s" begin="-3.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- CRT screen -->
    <g>
      <rect x="-172" y="-40" width="344" height="64" rx="16" fill="#0a0e18" stroke="#7a8392" stroke-width="1.2"/>
      <rect x="-164" y="-34" width="328" height="52" rx="12" fill="url(#screen)" stroke="#1f6b3b" stroke-width="0.9"/>
      <rect x="-164" y="-34" width="328" height="52" rx="12" fill="url(#screenGlow)"/>

      <!-- scan lines -->
      <g stroke="#7dffb6" stroke-width="0.3" opacity="0.16">
        <line x1="-164" y1="-26" x2="164" y2="-26"/>
        <line x1="-164" y1="-20" x2="164" y2="-20"/>
        <line x1="-164" y1="-14" x2="164" y2="-14"/>
        <line x1="-164" y1="-8"  x2="164" y2="-8"/>
        <line x1="-164" y1="-2"  x2="164" y2="-2"/>
        <line x1="-164" y1="4"   x2="164" y2="4"/>
        <line x1="-164" y1="10"  x2="164" y2="10"/>
      </g>

      <!-- header on screen -->
      <text x="0" y="-19" text-anchor="middle"
            font-family="'Courier New', monospace" font-size="8.5"
            fill="#7dffb6" opacity="0.9" letter-spacing="3.5">REMINGTON RAND · UNIVAC I</text>

      <!-- THE DATE — primary visual -->
      <text x="0" y="9" text-anchor="middle"
            font-family="'Courier New', monospace" font-size="24" font-weight="700"
            fill="#bdffd6" letter-spacing="2.5"
            style="paint-order:stroke; stroke:#0e2418; stroke-width:0.6">JUNE 14, 2026</text>
    </g>

    <!-- panel below screen: indicator lamps row, then attribution -->
    <g transform="translate(0 50)">
      <rect x="-172" y="-14" width="344" height="34" rx="4" fill="#1a2030" stroke="#7a8392" stroke-width="0.5"/>
      <!-- indicator lamps span the full width on a single row -->
      <g>
        <circle cx="-160" cy="-7" r="2.4" fill="#ff5454"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite"/></circle>
        <circle cx="-140" cy="-7" r="2.4" fill="#ffb74d"><animate attributeName="opacity" values="1;0.4;1"   dur="2.3s" repeatCount="indefinite"/></circle>
        <circle cx="-120" cy="-7" r="2.4" fill="#7dffb6"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/></circle>
        <circle cx="-100" cy="-7" r="2.4" fill="#7dffb6"><animate attributeName="opacity" values="1;0.5;1"   dur="2.9s" repeatCount="indefinite"/></circle>
        <circle cx="-80"  cy="-7" r="2.4" fill="#ffb74d"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.9s" repeatCount="indefinite"/></circle>
        <circle cx="-60"  cy="-7" r="2.4" fill="#ff5454"><animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
        <circle cx="-40"  cy="-7" r="2.4" fill="#7dffb6"><animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/></circle>
        <circle cx="-20"  cy="-7" r="2.4" fill="#ffb74d"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.1s" repeatCount="indefinite"/></circle>
        <circle cx="0"    cy="-7" r="2.4" fill="#7dffb6"><animate attributeName="opacity" values="1;0.5;1"   dur="1.1s" repeatCount="indefinite"/></circle>
        <circle cx="20"   cy="-7" r="2.4" fill="#ffb74d"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/></circle>
        <circle cx="40"   cy="-7" r="2.4" fill="#ff5454"><animate attributeName="opacity" values="0.5;0.95;0.5" dur="1.9s" repeatCount="indefinite"/></circle>
        <circle cx="60"   cy="-7" r="2.4" fill="#7dffb6"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.1s" repeatCount="indefinite"/></circle>
        <circle cx="80"   cy="-7" r="2.4" fill="#ffb74d"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.7s" repeatCount="indefinite"/></circle>
        <circle cx="100"  cy="-7" r="2.4" fill="#7dffb6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite"/></circle>
        <circle cx="120"  cy="-7" r="2.4" fill="#7dffb6"><animate attributeName="opacity" values="1;0.5;1"   dur="1.3s" repeatCount="indefinite"/></circle>
        <circle cx="140"  cy="-7" r="2.4" fill="#ffb74d"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.3s" repeatCount="indefinite"/></circle>
        <circle cx="160"  cy="-7" r="2.4" fill="#ff5454"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></circle>
      </g>
      <!-- attribution labels -->
      <text x="0" y="5" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif" font-size="9.5"
            fill="#dfe5ee" letter-spacing="6" font-weight="600">UNIVAC I · 75 YEARS</text>
      <text x="0" y="16" text-anchor="middle"
            font-family="Helvetica, Arial, sans-serif" font-size="6.5"
            fill="#8a93a3" letter-spacing="2.5">DELIVERED JUNE 14, 1951 · US CENSUS BUREAU</text>
    </g>
  </g>
</svg>
