<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Mount Everest first summit 73rd anniversary (May 29, 1953 — Edmund Hillary & Tenzing Norgay reach 8,848 m on the British Mount Everest Expedition); dawn over the Himalayas, layered ridgelines, two climber silhouettes on the summit, prayer flags fluttering, drifting snow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="May 29, 2026 — Mount Everest first summit 73rd anniversary, Hillary and Tenzing">
  <defs>
    <!-- Sky: pre-dawn blue at top into rose / amber at the ridge horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0d1117"/>
      <stop offset="0.35" stop-color="#152042"/>
      <stop offset="0.65" stop-color="#3a3a6a"/>
      <stop offset="0.82" stop-color="#c66a55"/>
      <stop offset="0.92" stop-color="#f0a868"/>
      <stop offset="1"    stop-color="#ffd49a"/>
    </linearGradient>

    <!-- Sun glow halo behind the summit -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff4d0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffc070" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#ffc070" stop-opacity="0"/>
    </radialGradient>

    <!-- Far range: hazy purple-blue -->
    <linearGradient id="rangeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6e96"/>
      <stop offset="1" stop-color="#2a2e54"/>
    </linearGradient>

    <!-- Mid range: cooler, slightly bluer -->
    <linearGradient id="rangeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e4773"/>
      <stop offset="1" stop-color="#1a1e3a"/>
    </linearGradient>

    <!-- Foreground Everest -->
    <linearGradient id="everest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1a1e34"/>
      <stop offset="0.45" stop-color="#272c4a"/>
      <stop offset="0.55" stop-color="#3a4068"/>
      <stop offset="1"   stop-color="#10142a"/>
    </linearGradient>

    <!-- Snow / lit western face -->
    <linearGradient id="snowFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffd6a8"/>
      <stop offset="0.5" stop-color="#f4b078"/>
      <stop offset="1"   stop-color="#a87060"/>
    </linearGradient>

    <!-- Snow plume off the summit (Everest's signature banner cloud) -->
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- A single drifting snowflake -->
    <symbol id="flake" overflow="visible">
      <circle r="0.9" fill="#ffffff" opacity="0.85"/>
    </symbol>

    <!-- Prayer-flag bunting symbol: 5 small rectangles in the Tibetan order
         (blue, white, red, green, yellow) — used along strings between peaks -->
    <symbol id="flag5" overflow="visible">
      <rect x="0"  y="0" width="10" height="13" fill="#3a7bd4"/>
      <rect x="12" y="0" width="10" height="13" fill="#f0f0f0"/>
      <rect x="24" y="0" width="10" height="13" fill="#d04030"/>
      <rect x="36" y="0" width="10" height="13" fill="#3aa05a"/>
      <rect x="48" y="0" width="10" height="13" fill="#f0c040"/>
    </symbol>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="snowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- Sun halo behind Everest's summit -->
  <ellipse cx="400" cy="138" rx="220" ry="90" fill="url(#sunGlow)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="13s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Faint distant stars (only top quarter where the sky is still dark) -->
  <g fill="#ffffff">
    <circle cx="60"  cy="18" r="0.8" opacity="0.7"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="130" cy="30" r="0.6" opacity="0.6"/>
    <circle cx="210" cy="14" r="0.7" opacity="0.8"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="36" r="0.5" opacity="0.55"/>
    <circle cx="520" cy="22" r="0.8" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4"   dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="12" r="0.6" opacity="0.6"/>
    <circle cx="720" cy="34" r="0.7" opacity="0.65"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="770" cy="20" r="0.5" opacity="0.55"/>
  </g>

  <!-- ===== Far range (most distant, hazy) ===== -->
  <path d="M 0 150
           L 40 120  L 75 134  L 105 110 L 135 128 L 170 105
           L 200 122 L 235 100 L 268 118 L 300 96  L 332 116
           L 365 100 L 398 84  L 432 102 L 468 92  L 502 110
           L 538 96  L 572 112 L 608 100 L 644 118 L 678 104
           L 712 120 L 748 108 L 800 124 L 800 200 L 0 200 Z"
        fill="url(#rangeFar)" opacity="0.85"/>

  <!-- ===== Mid range ===== -->
  <path d="M 0 168
           L 30 150  L 70 158  L 110 138 L 150 152 L 195 130
           L 240 148 L 282 128 L 320 142 L 360 118 L 398 132
           L 438 116 L 478 138 L 518 122 L 560 144 L 600 128
           L 642 150 L 686 132 L 728 148 L 768 138 L 800 152
           L 800 200 L 0 200 Z"
        fill="url(#rangeMid)"/>

  <!-- ===== Everest — center, foreground ===== -->
  <!-- shadow side (east face) -->
  <path d="M 240 200
           L 290 178 L 340 152 L 380 122 L 400 100
           L 400 200 Z"
        fill="url(#everest)"/>
  <!-- lit side (west / dawn-lit) -->
  <path d="M 400 100 L 422 118 L 450 138 L 490 158 L 530 174 L 580 188 L 800 200 L 400 200 Z"
        fill="url(#snowFace)"/>
  <!-- subtle snow ridge highlight running down the lit face -->
  <path d="M 400 100 L 408 116 L 432 132 L 470 152 L 510 168 L 560 182"
        stroke="#fff0d8" stroke-width="0.8" fill="none" opacity="0.65"/>
  <!-- shadow rocks / striations on dark face -->
  <g stroke="#0a0d1c" stroke-width="0.6" opacity="0.5" fill="none">
    <path d="M 290 178 L 330 162"/>
    <path d="M 310 188 L 360 168"/>
    <path d="M 345 184 L 380 162"/>
    <path d="M 365 178 L 395 142"/>
  </g>
  <!-- snow cap accents on the dark side near summit -->
  <path d="M 380 122 L 388 116 L 395 122 L 400 100 L 405 118 L 412 112 L 420 122 L 412 128 L 400 122 L 388 128 Z"
        fill="#f0e6d4" opacity="0.9"/>

  <!-- ===== Iconic Everest summit plume (banner cloud) ===== -->
  <g transform="translate(400 100)">
    <path d="M 0 0 Q 30 -8 60 -4 Q 100 0 140 6 Q 175 12 200 18 Q 175 22 150 22 Q 110 22 70 16 Q 30 10 0 8 Z"
          fill="url(#plume)" filter="url(#snowBlur)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;6 -2;0 0;-3 1;0 0" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.8;0.95;0.85" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 -2 Q 40 -10 90 -8 Q 130 -4 170 4 Q 140 8 100 6 Q 50 2 0 4 Z"
          fill="url(#plume)" opacity="0.55" filter="url(#snowBlur)">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;10 -3;4 -1;0 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== Two climber silhouettes on the summit ===== -->
  <!-- climber 1 (Hillary) -->
  <g transform="translate(394 100)">
    <!-- pack + body -->
    <path d="M -2 0 L -1 -8 L 1 -10 L 3 -8 L 3 0 Z" fill="#0a0d1c"/>
    <!-- head -->
    <circle cx="1" cy="-11" r="1.6" fill="#0a0d1c"/>
    <!-- ice axe -->
    <line x1="3" y1="-4" x2="8" y2="-13" stroke="#0a0d1c" stroke-width="0.7"/>
    <path d="M 7 -13 L 10 -14 L 9 -12 Z" fill="#0a0d1c"/>
  </g>

  <!-- climber 2 (Tenzing) — slightly behind & to the right, raising the rope/flag staff -->
  <g transform="translate(404 102)">
    <!-- legs / body -->
    <path d="M -2 0 L -1 -9 L 1 -11 L 3 -9 L 3 0 Z" fill="#0a0d1c"/>
    <!-- head -->
    <circle cx="1" cy="-12" r="1.6" fill="#0a0d1c"/>
    <!-- raised arm holding flagstaff -->
    <line x1="2" y1="-10" x2="6" y2="-22" stroke="#0a0d1c" stroke-width="0.7"/>
    <!-- flagstaff -->
    <line x1="6" y1="-22" x2="6" y2="-2" stroke="#0a0d1c" stroke-width="0.6"/>
    <!-- small UN-era expedition pennant fluttering -->
    <path d="M 6 -22 L 14 -20 L 6 -18 Z" fill="#d04030">
      <animate attributeName="d"
               values="M 6 -22 L 14 -20 L 6 -18 Z;
                       M 6 -22 L 15 -21 L 6 -18 Z;
                       M 6 -22 L 13 -19 L 6 -18 Z;
                       M 6 -22 L 14 -20 L 6 -18 Z"
               dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 6 -18 L 14 -16 L 6 -14 Z" fill="#3a7bd4">
      <animate attributeName="d"
               values="M 6 -18 L 14 -16 L 6 -14 Z;
                       M 6 -18 L 15 -17 L 6 -14 Z;
                       M 6 -18 L 13 -15 L 6 -14 Z;
                       M 6 -18 L 14 -16 L 6 -14 Z"
               dur="2s" begin="-1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ===== Prayer-flag bunting between mid-range peaks (left side) ===== -->
  <g>
    <!-- catenary string -->
    <path d="M 60 90 Q 130 120 200 95" stroke="#5a6080" stroke-width="0.5" fill="none" opacity="0.7"/>
    <!-- bunting hung along approx midpoint, with gentle sway -->
    <g transform="translate(96 108)">
      <animateTransform attributeName="transform" type="rotate"
                        values="-2 30 6;3 30 6;-2 30 6" dur="7s" repeatCount="indefinite" additive="sum"/>
      <use href="#flag5"/>
    </g>
    <g transform="translate(152 110)">
      <animateTransform attributeName="transform" type="rotate"
                        values="3 30 6;-3 30 6;3 30 6" dur="7s" begin="-2s" repeatCount="indefinite" additive="sum"/>
      <use href="#flag5"/>
    </g>
  </g>

  <!-- ===== Prayer-flag bunting (right side) ===== -->
  <g>
    <path d="M 600 100 Q 670 130 750 108" stroke="#5a6080" stroke-width="0.5" fill="none" opacity="0.7"/>
    <g transform="translate(636 118)">
      <animateTransform attributeName="transform" type="rotate"
                        values="-3 30 6;2 30 6;-3 30 6" dur="11s" repeatCount="indefinite" additive="sum"/>
      <use href="#flag5"/>
    </g>
    <g transform="translate(696 120)">
      <animateTransform attributeName="transform" type="rotate"
                        values="2 30 6;-3 30 6;2 30 6" dur="11s" begin="-4s" repeatCount="indefinite" additive="sum"/>
      <use href="#flag5"/>
    </g>
  </g>

  <!-- ===== Drifting snow / spindrift ===== -->
  <g>
    <use href="#flake" x="100" y="60">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 40 30; 90 70" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="250" y="40">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 30 50; 70 110" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="13s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="430" y="30">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 50 60; 110 130" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="580" y="50">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 35 45; 80 100" dur="13s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="-4s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="680" y="40">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 30 60; 70 130" dur="11s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="11s" begin="-6s" repeatCount="indefinite"/>
    </use>
    <use href="#flake" x="370" y="80">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 25 40; 60 100" dur="7s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="-3s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ===== Typography ===== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- date backdrop tint for legibility against gradient sky -->
    <rect x="38" y="36" width="320" height="48" rx="4" fill="#0a0d1c" opacity="0.55"/>
    <!-- date -->
    <text x="198" y="68" text-anchor="middle"
          font-size="30" font-weight="800" fill="#ffffff" letter-spacing="3">
      MAY 29 · 2026
    </text>
    <!-- subtitle -->
    <rect x="38" y="92" width="320" height="22" rx="3" fill="#0a0d1c" opacity="0.45"/>
    <text x="198" y="108" text-anchor="middle"
          font-size="10.5" font-weight="700" fill="#ffd49a" letter-spacing="2.6">
      EVEREST · 73 YEARS · HILLARY &amp; TENZING
    </text>

    <!-- right-side mission line -->
    <text x="784" y="174" text-anchor="end"
          font-size="8.5" font-weight="700" fill="#ffd49a" letter-spacing="2" opacity="0.95">
      29 MAY 1953 · 11:30 AM NPT
    </text>
    <text x="784" y="188" text-anchor="end"
          font-size="7.5" fill="#e8d6b8" letter-spacing="1.6" opacity="0.85">
      SAGARMATHA · CHOMOLUNGMA · 8,848 M
    </text>
  </g>
</svg>
