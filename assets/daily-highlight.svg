<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Hubble at 36 — April 24, 2026">
  <title>Hubble at 36 — April 24, 2026</title>

  <defs>
    <radialGradient id="nebula" cx="50%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#1b2247" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#2a1740" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#a06bff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="25%" stop-color="#ffe49a"/>
      <stop offset="60%" stop-color="#d97aff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a3bff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cde2ff"/>
      <stop offset="70%" stop-color="#5aa9ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1b3a8a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffd1b3"/>
      <stop offset="70%" stop-color="#ff6f91" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5a1235" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#cbb8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a4bff" stop-opacity="0"/>
    </linearGradient>

    <filter id="cloud" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.022" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.55  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <filter id="cloud2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.030" numOctaves="2" seed="13"/>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.45  0 0 0 0 0.70  0 0 0 0.30 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="diffStar">
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.85"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.85"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#cbe7ff" stroke-width="0.35" stroke-linecap="round" opacity="0.55"/>
      <line x1="-6" y1="6" x2="6" y2="-6" stroke="#cbe7ff" stroke-width="0.35" stroke-linecap="round" opacity="0.55"/>
      <circle r="1.4" fill="#ffffff"/>
    </g>

    <g id="spiralGalaxy">
      <ellipse cx="0" cy="0" rx="40" ry="11" fill="url(#coreA)" opacity="0.35"/>
      <ellipse cx="0" cy="0" rx="34" ry="9" fill="none" stroke="url(#armGrad)" stroke-width="2.4" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="26" ry="6.5" fill="none" stroke="url(#armGrad)" stroke-width="1.8" opacity="0.7" transform="rotate(20)"/>
      <ellipse cx="0" cy="0" rx="20" ry="4.5" fill="none" stroke="#e7d3ff" stroke-width="1.1" opacity="0.55" transform="rotate(-15)"/>
      <circle r="6" fill="url(#coreA)" filter="url(#softGlow)"/>
      <circle r="2" fill="#fff7d0"/>
    </g>

    <g id="spiralGalaxyB">
      <ellipse cx="0" cy="0" rx="28" ry="8" fill="url(#coreB)" opacity="0.35"/>
      <ellipse cx="0" cy="0" rx="24" ry="6" fill="none" stroke="#a9d2ff" stroke-width="1.2" opacity="0.55"/>
      <ellipse cx="0" cy="0" rx="16" ry="4" fill="none" stroke="#cbe7ff" stroke-width="0.8" opacity="0.7" transform="rotate(25)"/>
      <circle r="4" fill="url(#coreB)" filter="url(#softGlow)"/>
      <circle r="1.4" fill="#ffffff"/>
    </g>

    <g id="spiralGalaxyC">
      <ellipse cx="0" cy="0" rx="22" ry="7" fill="url(#coreC)" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="18" ry="5" fill="none" stroke="#ffc5d6" stroke-width="1" opacity="0.6"/>
      <circle r="3" fill="url(#coreC)" filter="url(#softGlow)"/>
      <circle r="1" fill="#fff0d8"/>
    </g>

    <g id="hubble">
      <rect x="-26" y="-6" width="52" height="12" rx="2" fill="#c9d1d9" stroke="#3a4360" stroke-width="0.6"/>
      <rect x="-32" y="-7" width="8" height="14" rx="1.5" fill="#8b95a3"/>
      <rect x="22" y="-7" width="6" height="14" rx="1" fill="#8b95a3"/>
      <rect x="-6" y="-7.2" width="12" height="1.4" fill="#5a6478"/>
      <rect x="-22" y="-22" width="44" height="6" rx="0.6" fill="#1f3a8a" stroke="#3b6cf2" stroke-width="0.4"/>
      <rect x="-22" y="16" width="44" height="6" rx="0.6" fill="#1f3a8a" stroke="#3b6cf2" stroke-width="0.4"/>
      <line x1="-11" y1="-22" x2="-11" y2="-16" stroke="#3b6cf2" stroke-width="0.3"/>
      <line x1="0"   y1="-22" x2="0"   y2="-16" stroke="#3b6cf2" stroke-width="0.3"/>
      <line x1="11"  y1="-22" x2="11"  y2="-16" stroke="#3b6cf2" stroke-width="0.3"/>
      <line x1="-11" y1="16"  x2="-11" y2="22"  stroke="#3b6cf2" stroke-width="0.3"/>
      <line x1="0"   y1="16"  x2="0"   y2="22"  stroke="#3b6cf2" stroke-width="0.3"/>
      <line x1="11"  y1="16"  x2="11"  y2="22"  stroke="#3b6cf2" stroke-width="0.3"/>
      <line x1="0" y1="-6" x2="0" y2="-16" stroke="#5a6478" stroke-width="0.7"/>
      <line x1="0" y1="6"  x2="0" y2="16"  stroke="#5a6478" stroke-width="0.7"/>
      <line x1="14" y1="-6" x2="20" y2="-12" stroke="#c9d1d9" stroke-width="0.5"/>
      <circle cx="20" cy="-12" r="1.1" fill="#c9d1d9"/>
      <circle cx="-30" cy="0" r="2.2" fill="none" stroke="#fff8e6" stroke-width="0.4" opacity="0.7"/>
    </g>
  </defs>

  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#nebula)"/>

  <g opacity="0.55">
    <rect x="0" y="0" width="800" height="200" filter="url(#cloud)">
      <animate attributeName="opacity" values="0.45;0.75;0.45" dur="29s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g opacity="0.40">
    <rect x="0" y="0" width="800" height="200" filter="url(#cloud2)">
      <animate attributeName="opacity" values="0.30;0.55;0.30" dur="37s" repeatCount="indefinite"/>
    </rect>
  </g>

  <ellipse cx="240" cy="100" rx="220" ry="90" fill="url(#hotspot)" opacity="0.6">
    <animate attributeName="opacity" values="0.45;0.7;0.45" dur="23s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#ffffff">
    <circle cx="22"  cy="34"  r="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="7s"  begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="58"  cy="22"  r="0.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="11s" begin="2s"  repeatCount="indefinite"/></circle>
    <circle cx="92"  cy="48"  r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="13s" begin="1s"  repeatCount="indefinite"/></circle>
    <circle cx="118" cy="14"  r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s"  begin="3s"  repeatCount="indefinite"/></circle>
    <circle cx="148" cy="64"  r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="28"  r="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="13s" begin="4s"  repeatCount="indefinite"/></circle>
    <circle cx="196" cy="84"  r="0.7"><animate attributeName="opacity" values="0.1;1;0.1" dur="7s"  begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="224" cy="40"  r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="11s" begin="6s"  repeatCount="indefinite"/></circle>
    <circle cx="262" cy="158" r="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="13s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="282" cy="14"  r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s"  begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="304" cy="74"  r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="11s" begin="3s"  repeatCount="indefinite"/></circle>
    <circle cx="332" cy="172" r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="13s" begin="5s"  repeatCount="indefinite"/></circle>
    <circle cx="358" cy="36"  r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s"  begin="2s"  repeatCount="indefinite"/></circle>
    <circle cx="386" cy="120" r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="11s" begin="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="414" cy="68"  r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="13s" begin="1s"  repeatCount="indefinite"/></circle>
    <circle cx="442" cy="20"  r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s"  begin="6s"  repeatCount="indefinite"/></circle>
    <circle cx="468" cy="160" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="11s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="498" cy="98"  r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="13s" begin="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="524" cy="30"  r="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="7s"  begin="2s"  repeatCount="indefinite"/></circle>
    <circle cx="556" cy="174" r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="11s" begin="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="588" cy="56"  r="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="13s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="616" cy="128" r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s"  begin="4s"  repeatCount="indefinite"/></circle>
    <circle cx="644" cy="78"  r="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="11s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="676" cy="24"  r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="13s" begin="3s"  repeatCount="indefinite"/></circle>
    <circle cx="702" cy="166" r="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="7s"  begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="728" cy="44"  r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="11s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="754" cy="108" r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="13s" begin="5s"  repeatCount="indefinite"/></circle>
    <circle cx="780" cy="62"  r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s"  begin="1s"  repeatCount="indefinite"/></circle>
    <circle cx="40"  cy="148" r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="11s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="76"  cy="178" r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="13s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="134" cy="138" r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s"  begin="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="206" cy="150" r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="11s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="378" cy="184" r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="13s" begin="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="146" r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s"  begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="120" r="0.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="11s" begin="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="184" r="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="13s" begin="6s"   repeatCount="indefinite"/></circle>
    <circle cx="660" cy="146" r="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s"  begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <g filter="url(#softGlow)">
    <use href="#diffStar" x="106" y="118">
      <animateTransform attributeName="transform" type="scale" values="0.7;1.1;0.7" dur="11s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#diffStar" x="350" y="44">
      <animateTransform attributeName="transform" type="scale" values="0.85;1.2;0.85" dur="13s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#diffStar" x="560" y="142">
      <animateTransform attributeName="transform" type="scale" values="0.7;1.0;0.7" dur="7s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#diffStar" x="730" y="86">
      <animateTransform attributeName="transform" type="scale" values="0.8;1.15;0.8" dur="11s" begin="3s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <g transform="translate(160 130)">
    <g>
      <use href="#spiralGalaxy"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="113s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(620 60)">
    <g>
      <use href="#spiralGalaxyB"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="97s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(470 168)">
    <g>
      <use href="#spiralGalaxyC"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="83s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(60 76)">
    <g>
      <use href="#spiralGalaxyC" transform="scale(0.6)"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="71s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <line x1="-30" y1="0" x2="0" y2="0" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <circle r="1.4" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" values="-40 30; 860 110" dur="19s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.85;1" dur="19s" begin="0s" repeatCount="indefinite"/>
  </g>

  <g>
    <line x1="-22" y1="0" x2="0" y2="0" stroke="#cbe7ff" stroke-width="0.7" stroke-linecap="round"/>
    <circle r="1.1" fill="#cbe7ff"/>
    <animateTransform attributeName="transform" type="translate" values="-30 160; 850 40" dur="29s" begin="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.85;1" dur="29s" begin="6s" repeatCount="indefinite"/>
  </g>

  <g filter="url(#bigGlow)">
    <g>
      <g>
        <use href="#hubble"/>
        <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="31s" repeatCount="indefinite"/>
      </g>
      <animateTransform attributeName="transform" type="translate" values="-60 100; 860 100" dur="89s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="42" font-size="11" letter-spacing="6" fill="#9aa6c4" opacity="0.9">
      36 YEARS OF LIGHT
      <animate attributeName="opacity" values="0.65;1;0.65" dur="11s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="92" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="3" filter="url(#softGlow)">
      APRIL 24, 2026
    </text>
    <text x="400" y="118" font-size="11" letter-spacing="4" fill="#cbe7ff" opacity="0.85">
      HUBBLE  ·  LAUNCHED 1990
    </text>
    <text x="400" y="178" font-size="9" letter-spacing="2" fill="#7280a8" opacity="0.7">
      a deep field, still expanding
    </text>
  </g>

  <g stroke="#3b4878" stroke-width="0.6" opacity="0.55">
    <line x1="100" y1="92" x2="200" y2="92"/>
    <line x1="600" y1="92" x2="700" y2="92"/>
    <circle cx="200" cy="92" r="1.6" fill="#7280a8" stroke="none"/>
    <circle cx="600" cy="92" r="1.6" fill="#7280a8" stroke="none"/>
  </g>
</svg>
