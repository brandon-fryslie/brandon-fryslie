<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: U.S. Semiquincentennial · July 4, 1776 Declaration of Independence — 250th anniversary of the Second Continental Congress adopting the engrossed Declaration of Independence in Philadelphia's Pennsylvania State House (later Independence Hall). John Hancock's outsized signature; Thomas Jefferson's drafting; Benjamin Franklin's editing. Federal holiday — Independence Day. Visualized as a night-sky Fourth-of-July fireworks tableau over a low silhouette of Independence Hall: a deep midnight-indigo sky fills the upper composition, three staggered fireworks bursts blossom overhead in Old-Glory red, bone-white, and starburst gold with sparks trailing downward, the compact silhouette of Independence Hall's brick facade and iconic bell-tower steeple grounds the lower quarter with a warm Liberty-Bell glow in the arched aperture, thirteen bone-white stars twinkle in a Betsy-Ross arc across the sky, festive bunting swags hang at the upper corners with alternating red-white-blue vertical panels. Large bone-white "JULY 4, 2026" headline dominates the upper center in a serif engrossed style with a soft golden glow and clear sky behind it, red "INDEPENDENCE DAY · SEMIQUINCENTENNIAL · 250 YEARS" subhead sits directly beneath in clean sky with no silhouette overlap, and italic silver "DECLARATION OF INDEPENDENCE · PHILADELPHIA · JULY 4, 1776" tertiary rides along the very bottom. Palette: Old Glory red #b22234, Old Glory blue #3c3b6e, bone-white #f5efe6, patriot gold #f4c542, midnight indigo #0e1330 and #141a3a, brick umber #4a2a1e, bell brass #b48a3a, spark cream #fff2c2, over #0d1117. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Daily doodle: 250th anniversary of the Declaration of Independence — Independence Day 2026 Semiquincentennial. A night-sky fireworks tableau over a low silhouette of Independence Hall in Philadelphia, with three staggered red, gold, and blue fireworks bursts blossoming above, sparks trailing downward, a compact brick facade with a bell-tower steeple sitting on the horizon, thirteen bone-white stars twinkling in a Betsy-Ross arc, festive red-white-blue bunting hanging at the upper corners, and a soft Liberty-Bell glow in the steeple's arched aperture. Large bone-white JULY 4, 2026 headline with a golden glow, red INDEPENDENCE DAY · SEMIQUINCENTENNIAL · 250 YEARS subhead beneath, and italic silver DECLARATION OF INDEPENDENCE · PHILADELPHIA · JULY 4, 1776 tertiary along the very bottom edge.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.35" stop-color="#141a3a"/>
      <stop offset="0.75" stop-color="#0e1330"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2c2" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f4c542" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f4c542" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd4c2" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b22234" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b22234" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6ecff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#3c3b6e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3c3b6e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="belllight" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#fff2c2" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#f4c542" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b48a3a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3423"/>
      <stop offset="1" stop-color="#2a1a12"/>
    </linearGradient>

    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c98a"/>
      <stop offset="0.5" stop-color="#b48a3a"/>
      <stop offset="1" stop-color="#6a4e1e"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8dd"/>
      <stop offset="0.55" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8d9a8"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Reusable firework burst as a symbol: 24 radial sparks -->
    <symbol id="burst" overflow="visible">
      <g stroke-linecap="round" fill="none" stroke-width="1.6">
        <line x1="0" y1="0" x2="0" y2="-40"/>
        <line x1="0" y1="0" x2="10.35" y2="-38.64"/>
        <line x1="0" y1="0" x2="20" y2="-34.64"/>
        <line x1="0" y1="0" x2="28.28" y2="-28.28"/>
        <line x1="0" y1="0" x2="34.64" y2="-20"/>
        <line x1="0" y1="0" x2="38.64" y2="-10.35"/>
        <line x1="0" y1="0" x2="40" y2="0"/>
        <line x1="0" y1="0" x2="38.64" y2="10.35"/>
        <line x1="0" y1="0" x2="34.64" y2="20"/>
        <line x1="0" y1="0" x2="28.28" y2="28.28"/>
        <line x1="0" y1="0" x2="20" y2="34.64"/>
        <line x1="0" y1="0" x2="10.35" y2="38.64"/>
        <line x1="0" y1="0" x2="0" y2="40"/>
        <line x1="0" y1="0" x2="-10.35" y2="38.64"/>
        <line x1="0" y1="0" x2="-20" y2="34.64"/>
        <line x1="0" y1="0" x2="-28.28" y2="28.28"/>
        <line x1="0" y1="0" x2="-34.64" y2="20"/>
        <line x1="0" y1="0" x2="-38.64" y2="10.35"/>
        <line x1="0" y1="0" x2="-40" y2="0"/>
        <line x1="0" y1="0" x2="-38.64" y2="-10.35"/>
        <line x1="0" y1="0" x2="-34.64" y2="-20"/>
        <line x1="0" y1="0" x2="-28.28" y2="-28.28"/>
        <line x1="0" y1="0" x2="-20" y2="-34.64"/>
        <line x1="0" y1="0" x2="-10.35" y2="-38.64"/>
      </g>
    </symbol>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="800" height="200" fill="url(#sky)"/>

  <!-- 13 bone-white stars in a Betsy-Ross arc across upper sky -->
  <g fill="#f5efe6">
    <circle cx="70" cy="26" r="1.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="16" r="1.7"><animate attributeName="opacity" values="1;0.4;1" dur="7s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="10" r="1.4"><animate attributeName="opacity" values="0.5;1;0.5" dur="11s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="248" cy="8" r="1.8"><animate attributeName="opacity" values="1;0.45;1" dur="7s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="316" cy="6" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="11s" begin="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="386" cy="8" r="1.6"><animate attributeName="opacity" values="0.55;1;0.55" dur="7s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="454" cy="8" r="1.4"><animate attributeName="opacity" values="1;0.5;1" dur="13s" begin="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="522" cy="10" r="1.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="7s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="588" cy="14" r="1.5"><animate attributeName="opacity" values="0.55;1;0.55" dur="11s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="648" cy="20" r="1.8"><animate attributeName="opacity" values="1;0.45;1" dur="7s" begin="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="702" cy="28" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="13s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.5;1" dur="11s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="40" r="1.6"><animate attributeName="opacity" values="0.5;1;0.5" dur="7s" begin="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== FIREWORKS (moved higher, away from text zone) ===== -->

  <!-- Burst A: red, upper-left -->
  <g transform="translate(160,55)" filter="url(#softGlow)" opacity="0.85">
    <circle r="46" fill="url(#glowRed)">
      <animate attributeName="r" values="4;52;42" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(160,55)" stroke="#ffd4c2" opacity="0.95">
    <use href="#burst">
      <animateTransform attributeName="transform" type="scale" values="0.1;1.0;1.15" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Red drip sparks -->
  <g stroke="#b22234" stroke-width="1" stroke-linecap="round" opacity="0.9">
    <line x1="160" y1="55" x2="160" y2="55">
      <animate attributeName="y2" values="55;108" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="148" y1="62" x2="148" y2="62">
      <animate attributeName="y2" values="62;110" dur="7s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="174" y1="64" x2="174" y2="64">
      <animate attributeName="y2" values="64;112" dur="7s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Burst B: gold, upper-right -->
  <g transform="translate(636,50)" filter="url(#softGlow)" opacity="0.85">
    <circle r="48" fill="url(#glowGold)">
      <animate attributeName="r" values="4;56;44" dur="11s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0" dur="11s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(636,50)" stroke="#fff2c2" opacity="0.95">
    <use href="#burst">
      <animateTransform attributeName="transform" type="scale" values="0.1;1.05;1.2" dur="11s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" begin="2.4s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Gold drip sparks -->
  <g stroke="#f4c542" stroke-width="1" stroke-linecap="round" opacity="0.9">
    <line x1="636" y1="50" x2="636" y2="50">
      <animate attributeName="y2" values="50;108" dur="11s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="622" y1="58" x2="622" y2="58">
      <animate attributeName="y2" values="58;110" dur="11s" begin="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="2.7s" repeatCount="indefinite"/>
    </line>
    <line x1="650" y1="58" x2="650" y2="58">
      <animate attributeName="y2" values="58;112" dur="11s" begin="3.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="3.0s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Burst C: blue, mid distance, smaller, delayed -->
  <g transform="translate(400,32)" filter="url(#softGlow)" opacity="0.75">
    <circle r="30" fill="url(#glowBlue)">
      <animate attributeName="r" values="3;36;28" dur="13s" begin="4.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="13s" begin="4.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(400,32) scale(0.65)" stroke="#e6ecff" opacity="0.9">
    <use href="#burst">
      <animateTransform attributeName="transform" type="scale" values="0.1;1.0;1.15" dur="13s" begin="4.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="13s" begin="4.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ===== BUNTING SWAGS at top corners ===== -->
  <!-- Left bunting -->
  <g>
    <path d="M 0 0 Q 60 30 130 0 L 130 -4 L 0 -4 Z" fill="#3c3b6e" opacity="0.9"/>
    <g>
      <path d="M 8 10 L 22 10 L 26 34 L 15 44 L 4 34 Z" fill="#b22234" stroke="#f5efe6" stroke-width="0.6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="-1.5;1.5;-1.5" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M 32 12 L 46 12 L 50 36 L 39 46 L 28 36 Z" fill="#f5efe6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="1.2;-1.2;1.2" dur="11s" begin="0.6s" repeatCount="indefinite"/>
      </path>
      <path d="M 56 12 L 70 12 L 74 36 L 63 46 L 52 36 Z" fill="#3c3b6e" stroke="#f5efe6" stroke-width="0.6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="-1.5;1.5;-1.5" dur="11s" begin="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M 80 10 L 94 10 L 98 34 L 87 44 L 76 34 Z" fill="#b22234" stroke="#f5efe6" stroke-width="0.6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="1.2;-1.2;1.2" dur="11s" begin="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M 0 0 Q 60 30 130 0" stroke="#f4c542" stroke-width="1" fill="none" opacity="0.75"/>
  </g>

  <!-- Right bunting -->
  <g transform="translate(670,0)">
    <path d="M 0 0 Q 60 30 130 0 L 130 -4 L 0 -4 Z" fill="#3c3b6e" opacity="0.9"/>
    <g>
      <path d="M 8 10 L 22 10 L 26 34 L 15 44 L 4 34 Z" fill="#3c3b6e" stroke="#f5efe6" stroke-width="0.6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="-1.2;1.2;-1.2" dur="11s" begin="0.3s" repeatCount="indefinite"/>
      </path>
      <path d="M 32 12 L 46 12 L 50 36 L 39 46 L 28 36 Z" fill="#b22234" stroke="#f5efe6" stroke-width="0.6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="1.5;-1.5;1.5" dur="11s" begin="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M 56 12 L 70 12 L 74 36 L 63 46 L 52 36 Z" fill="#f5efe6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="-1.2;1.2;-1.2" dur="11s" begin="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M 80 10 L 94 10 L 98 34 L 87 44 L 76 34 Z" fill="#3c3b6e" stroke="#f5efe6" stroke-width="0.6" opacity="0.95">
        <animateTransform attributeName="transform" type="rotate" values="1.5;-1.5;1.5" dur="11s" begin="2.1s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M 0 0 Q 60 30 130 0" stroke="#f4c542" stroke-width="1" fill="none" opacity="0.75"/>
  </g>

  <!-- ===== HEADLINE with gold glow — sits in clear sky above the low silhouette ===== -->
  <ellipse cx="400" cy="98" rx="260" ry="28" fill="url(#glowGold)" opacity="0.32"/>

  <text x="400" y="104" font-family="'Georgia', 'Times New Roman', serif" font-size="42" font-weight="900" letter-spacing="6" text-anchor="middle" fill="url(#goldText)" filter="url(#textGlow)">JULY 4, 2026</text>

  <!-- Deco flourishes flanking the headline -->
  <g stroke="#f4c542" stroke-width="1.2" fill="none" opacity="0.85">
    <line x1="110" y1="112" x2="220" y2="112"/>
    <line x1="140" y1="116" x2="200" y2="116"/>
    <path d="M 220 112 l 8 -4 l -4 4 l 4 4 z" fill="#f4c542"/>
    <line x1="580" y1="112" x2="690" y2="112"/>
    <line x1="600" y1="116" x2="660" y2="116"/>
    <path d="M 580 112 l -8 -4 l 4 4 l -4 4 z" fill="#f4c542"/>
  </g>

  <!-- Subhead -->
  <text x="400" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="4" text-anchor="middle" fill="#e83b52">INDEPENDENCE DAY  ·  SEMIQUINCENTENNIAL  ·  250 YEARS</text>

  <!-- ===== INDEPENDENCE HALL SILHOUETTE (low, wide, distant horizon) ===== -->
  <!-- Faint horizon glow behind hall -->
  <ellipse cx="400" cy="185" rx="320" ry="14" fill="url(#glowGold)" opacity="0.18"/>

  <g filter="url(#drop)">
    <!-- Ground line -->
    <rect x="0" y="188" width="800" height="4" fill="#1a1108" opacity="0.9"/>

    <!-- Main brick facade (wide, low) -->
    <rect x="220" y="158" width="360" height="32" fill="url(#brick)"/>

    <!-- Side wings — end pavilions -->
    <rect x="200" y="164" width="24" height="26" fill="#3a2214"/>
    <rect x="576" y="164" width="24" height="26" fill="#3a2214"/>
    <path d="M 200 164 L 212 158 L 224 164 Z" fill="#2a1a0e"/>
    <path d="M 576 164 L 588 158 L 600 164 Z" fill="#2a1a0e"/>

    <!-- Compact central bell house (rises modestly above roofline, sits below subhead) -->
    <rect x="374" y="146" width="52" height="14" fill="url(#brick)"/>
    <!-- Pediment cap of bell house -->
    <path d="M 372 146 L 400 138 L 428 146 Z" fill="#3a2214"/>
    <!-- Tiny finial ball on top -->
    <circle cx="400" cy="138" r="1.6" fill="url(#brass)"/>
    <line x1="400" y1="136" x2="400" y2="132" stroke="#b48a3a" stroke-width="0.7" stroke-linecap="round"/>
    <circle cx="400" cy="130" r="1.2" fill="url(#brass)"/>

    <!-- Arched Liberty Bell aperture with warm glow (front-and-center) -->
    <path d="M 384 152 Q 400 143 416 152 L 416 160 L 384 160 Z" fill="url(#belllight)"/>
    <!-- Bell silhouette inside the arch -->
    <path d="M 392 153 L 408 153 L 406 159 L 394 159 Z" fill="#8a6a2a" opacity="0.95"/>
    <rect x="399" y="151" width="2" height="2.5" fill="#b48a3a"/>
    <!-- Bell glow pulse -->
    <ellipse cx="400" cy="154" rx="18" ry="9" fill="url(#belllight)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="13s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Warm-lit windows across facade -->
    <g fill="#f4c542" opacity="0.85">
      <rect x="236" y="166" width="6" height="14" rx="0.6"/>
      <rect x="256" y="166" width="6" height="14" rx="0.6"/>
      <rect x="276" y="166" width="6" height="14" rx="0.6"/>
      <rect x="296" y="166" width="6" height="14" rx="0.6"/>
      <rect x="316" y="166" width="6" height="14" rx="0.6"/>
      <rect x="336" y="166" width="6" height="14" rx="0.6"/>
      <rect x="356" y="166" width="6" height="14" rx="0.6"/>
      <!-- gap for central doorway -->
      <rect x="438" y="166" width="6" height="14" rx="0.6"/>
      <rect x="458" y="166" width="6" height="14" rx="0.6"/>
      <rect x="478" y="166" width="6" height="14" rx="0.6"/>
      <rect x="498" y="166" width="6" height="14" rx="0.6"/>
      <rect x="518" y="166" width="6" height="14" rx="0.6"/>
      <rect x="538" y="166" width="6" height="14" rx="0.6"/>
      <rect x="558" y="166" width="6" height="14" rx="0.6"/>
    </g>

    <!-- Central doorway with pediment -->
    <rect x="392" y="172" width="16" height="18" rx="1" fill="#1a1108" stroke="#b48a3a" stroke-width="0.6"/>
    <path d="M 388 172 L 400 164 L 412 172 Z" fill="#3a281c"/>
  </g>

  <!-- ===== TERTIARY ITALIC LINE ===== -->
  <text x="400" y="199" font-family="'Georgia', 'Times New Roman', serif" font-size="8.5" font-style="italic" letter-spacing="2.2" text-anchor="middle" fill="#c8d4e0">DECLARATION OF INDEPENDENCE  ·  PHILADELPHIA  ·  JULY 4, 1776</text>

</svg>
