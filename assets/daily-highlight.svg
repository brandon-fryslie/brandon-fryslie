<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Stanislav Petrov — 43rd Anniversary (September 26, 1983) -->
<!-- about:
On the night of 26 September 1983, Lieutenant Colonel Stanislav Petrov was the duty officer at Serpukhov-15, a Soviet early-warning command bunker south of Moscow, when the Oko satellite system reported that the United States had launched five intercontinental ballistic missiles at the Soviet Union. Protocol required him to pass the alert up the chain within minutes — and a retaliatory launch would almost certainly have followed. Petrov judged it a system fault instead: five missiles, he reasoned, was not the shape a real first strike would take. He logged it as a false alarm and waited. Twenty-three minutes later, no warheads arrived. Sunlight glinting off high-altitude clouds had fooled the satellite. He kept the world from ending on a bureaucratic technicality, and was quietly reprimanded for the paperwork.

The scene is a dim Cold-War operations screen. On the left a phosphor-green radar sweeps its arm around a dish while five red missile blips flare and fade in a loop — the false alarm coming and going. On the right, a glass-domed launch button sits unpressed under an open safety cover, while a small amber lamp reads HELD and the FIRE lamp stays dark. Between them, the date anchors a green PETROV · 43 YEARS subhead and a quiet caption.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for September 26, 2026 — the 43rd anniversary of the Stanislav Petrov incident of September 26, 1983, when a Soviet early-warning duty officer judged a report of five inbound American ICBMs to be a system fault and did not forward the alert. On the left, a phosphor-green radar screen with a rotating sweep arm and five red missile blips flaring and fading. On the right, a red glass-domed launch button under an open safety cover, unpressed, with a lit amber HELD indicator and a dark FIRE indicator. In the centre, a large cream SEPTEMBER 26, 2026 headline underlined by a green-to-amber-to-red sweep, a phosphor-green PETROV · 43 YEARS subhead, an italic amber THE MAN WHO CHOSE NOT TO tertiary, and a Georgia-italic 'a system fault, not a war.' caption.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0a0e14"/>
      <stop offset="1"   stop-color="#0d1117"/>
    </linearGradient>

    <radialGradient id="radarFace" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#0d2a1a"/>
      <stop offset="0.7"  stop-color="#041610"/>
      <stop offset="1"    stop-color="#020a06"/>
    </radialGradient>

    <linearGradient id="sweepFan" x1="1" y1="0" x2="0.35" y2="-0.7">
      <stop offset="0" stop-color="#7dff9e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dff9e" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="buttonDome" cx="0.35" cy="0.28" r="0.75">
      <stop offset="0"    stop-color="#ffc0b0"/>
      <stop offset="0.35" stop-color="#e64a3a"/>
      <stop offset="0.75" stop-color="#7a1810"/>
      <stop offset="1"    stop-color="#280603"/>
    </radialGradient>

    <radialGradient id="amberBulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff2c8"/>
      <stop offset="0.45" stop-color="#f0b850"/>
      <stop offset="1"   stop-color="#3a2408"/>
    </radialGradient>

    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7dff9e"/>
      <stop offset="0.5" stop-color="#e8b048"/>
      <stop offset="1"   stop-color="#ff5a4a"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20222a"/>
      <stop offset="1" stop-color="#0d0e14"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#8ec4f0" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8ec4f0" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#8ec4f0" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <filter id="alarmGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.0"/>
    </filter>

    <filter id="phosphorBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>

  <!-- Faint horizontal panel rules -->
  <g stroke="#1a2028" stroke-width="0.5" opacity="0.4" fill="none">
    <line x1="0" y1="30" x2="800" y2="30"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
  </g>

  <!-- ============================== LEFT: RADAR SCREEN ============================== -->
  <g transform="translate(100 130)">
    <!-- Outer bezel ring -->
    <circle r="62" fill="#181820"/>
    <circle r="60" fill="#08080c"/>
    <!-- Screen face -->
    <circle r="55" fill="url(#radarFace)"/>

    <!-- Concentric rings -->
    <g fill="none" stroke="#2c7a44" opacity="0.55">
      <circle r="52" stroke-width="0.5"/>
      <circle r="40" stroke-width="0.45"/>
      <circle r="27" stroke-width="0.4"/>
      <circle r="14" stroke-width="0.35"/>
    </g>
    <!-- Crosshairs -->
    <g stroke="#2c7a44" stroke-width="0.35" opacity="0.45">
      <line x1="-55" y1="0" x2="55" y2="0"/>
      <line x1="0" y1="-55" x2="0" y2="55"/>
    </g>

    <!-- Compass ticks -->
    <g stroke="#3a8a55" stroke-width="0.5" opacity="0.7">
      <line x1="0" y1="-55" x2="0" y2="-50"/>
      <line x1="55" y1="0" x2="50" y2="0"/>
      <line x1="0" y1="55" x2="0" y2="50"/>
      <line x1="-55" y1="0" x2="-50" y2="0"/>
    </g>

    <!-- Rotating sweep -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="11s" repeatCount="indefinite"/>
      <path d="M 0 0 L 55 0 A 55 55 0 0 0 32 -44.85 Z" fill="url(#sweepFan)"/>
      <line x1="0" y1="0" x2="55" y2="0" stroke="#8affb0" stroke-width="1.3" filter="url(#phosphorBlur)"/>
    </g>

    <!-- Five red missile blips (false alarm — flare then fade, on a 7s loop) -->
    <g fill="#ff5a4a" filter="url(#alarmGlow)">
      <circle cx="22" cy="-28" r="2.4">
        <animate attributeName="opacity" values="0.1;1;1;0.15;0.1"
                 keyTimes="0;0.18;0.6;0.9;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-14" cy="-40" r="2.1">
        <animate attributeName="opacity" values="0.1;1;1;0.15;0.1"
                 keyTimes="0;0.2;0.62;0.9;1" dur="7s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-40" cy="6" r="2.3">
        <animate attributeName="opacity" values="0.1;1;1;0.15;0.1"
                 keyTimes="0;0.2;0.6;0.9;1" dur="7s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-20" cy="38" r="1.9">
        <animate attributeName="opacity" values="0.1;1;1;0.15;0.1"
                 keyTimes="0;0.22;0.62;0.9;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="24" r="2.1">
        <animate attributeName="opacity" values="0.1;1;1;0.15;0.1"
                 keyTimes="0;0.2;0.6;0.9;1" dur="7s" begin="2.0s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Blip count readout: "5" faintly in the corner -->
    <text x="-46" y="-40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.5" font-weight="700" fill="#5aa47a" letter-spacing="1.2" opacity="0.85">TRK 5</text>

    <!-- Centre pip -->
    <circle r="1.6" fill="#c4ffdb" filter="url(#phosphorBlur)"/>

    <!-- Bezel screws -->
    <g fill="#2a2a30">
      <circle cx="-56" cy="-30" r="1.3"/>
      <circle cx="56" cy="-30" r="1.3"/>
      <circle cx="-56" cy="30" r="1.3"/>
      <circle cx="56" cy="30" r="1.3"/>
    </g>
  </g>

  <!-- OKO label under radar -->
  <text x="100" y="197" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="7" font-weight="700" fill="#4a8560" letter-spacing="1.8" opacity="0.9">
    OKO · SERPUKHOV-15
  </text>

  <!-- ============================== RIGHT: LAUNCH CONSOLE ============================== -->
  <g transform="translate(700 130)">
    <!-- Console back panel -->
    <rect x="-62" y="-48" width="124" height="96" rx="4" fill="url(#panelGrad)" stroke="#2c2c34" stroke-width="0.7"/>

    <!-- Corner screws -->
    <g fill="#2a2a30">
      <circle cx="-57" cy="-43" r="1.2"/>
      <circle cx="57" cy="-43" r="1.2"/>
      <circle cx="-57" cy="43" r="1.2"/>
      <circle cx="57" cy="43" r="1.2"/>
    </g>

    <!-- LAUNCH label -->
    <text x="0" y="-30" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="6.8" font-weight="800" letter-spacing="2.4" fill="#8a8480">LAUNCH</text>

    <!-- Open safety-glass cover, hinged back over the button -->
    <g opacity="0.9">
      <!-- hinge -->
      <rect x="-18" y="-22.5" width="36" height="1.6" fill="#3a3a44"/>
      <!-- glass pane, tilted back -->
      <g transform="translate(0 -22)">
        <path d="M -18 0 L -18 -14 L 18 -18 L 18 -4 Z" fill="url(#glassGrad)" stroke="#5a7a9a" stroke-width="0.7"/>
        <!-- glass hairline highlight -->
        <line x1="-14" y1="-11" x2="14" y2="-15" stroke="#c8e0f4" stroke-width="0.4" opacity="0.7"/>
      </g>
    </g>

    <!-- Button base ring -->
    <circle cx="0" cy="-4" r="16" fill="#1a0e08"/>
    <circle cx="0" cy="-4" r="14.5" fill="#3a1c10"/>
    <!-- Button dome (unpressed — held) -->
    <circle cx="0" cy="-4" r="12" fill="url(#buttonDome)"/>
    <!-- Highlight sheen -->
    <ellipse cx="-3.4" cy="-8.5" rx="4" ry="2.4" fill="#ffd8cc" opacity="0.55"/>
    <!-- The button never moves — this is the whole point -->

    <!-- Indicator lamps row -->
    <!-- HELD (lit amber) -->
    <g transform="translate(-30 22)">
      <rect x="-5" y="-5" width="10" height="10" rx="1.8" fill="#0a0a0e" stroke="#2c2c34" stroke-width="0.5"/>
      <circle r="3.4" fill="url(#amberBulb)" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3.7s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="-20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="7.5" font-weight="800" letter-spacing="1.8" fill="#f0b850">HELD</text>

    <!-- FIRE (dark) -->
    <g transform="translate(24 22)">
      <rect x="-5" y="-5" width="10" height="10" rx="1.8" fill="#0a0a0e" stroke="#2c2c34" stroke-width="0.5"/>
      <circle r="2.4" fill="#3a1408" opacity="0.9"/>
    </g>
    <text x="34" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="7.5" font-weight="800" letter-spacing="1.8" fill="#4a2820">FIRE</text>
  </g>

  <!-- ============================== CENTRE TEXT STACK ============================== -->

  <!-- Date headline -->
  <text x="400" y="52" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="800" fill="#f5f2e6" letter-spacing="1.6">
    SEPTEMBER 26, 2026
  </text>

  <!-- Underline sweep — green→amber→red mirrors the operator's decision journey -->
  <line x1="242" y1="64" x2="558" y2="64" stroke="url(#underlineGrad)" stroke-width="2.6" stroke-linecap="round">
    <animate attributeName="stroke-dasharray"
             values="0 316; 200 116; 316 0; 200 116; 0 316"
             keyTimes="0;0.25;0.5;0.75;1" dur="13s" repeatCount="indefinite"/>
  </line>

  <!-- Subhead: PETROV · 43 YEARS -->
  <text x="400" y="84" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2.2" xml:space="preserve">
    <tspan fill="#7dff9e">PETROV  </tspan><tspan fill="#f5f2e6">&#183;  43 YEARS</tspan>
  </text>

  <!-- Tertiary italic -->
  <text x="400" y="103" text-anchor="middle"
        font-family="'Georgia', serif" font-size="11" font-style="italic" fill="#e8b048" letter-spacing="0.7">
    THE MAN WHO CHOSE NOT TO
  </text>

  <!-- Caption -->
  <text x="400" y="120" text-anchor="middle"
        font-family="'Georgia', serif" font-size="10" font-style="italic" fill="#9a9484" opacity="0.95">
    &#8220;a system fault, not a war.&#8221;
  </text>

  <!-- Small "T+23:00" callout — the wait until no warheads arrived -->
  <text x="400" y="180" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="6.5" font-weight="600" fill="#5a7080" letter-spacing="1.8" opacity="0.9">
    T + 23 MIN &#183; NO IMPACT &#183; ALERT WITHDRAWN
  </text>

</svg>
