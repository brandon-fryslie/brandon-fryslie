<?xml version="1.0" encoding="UTF-8"?>
<!-- theme: Michael Jackson — 68th Birthday (August 29, 1958) -->
<!-- about:
Michael Joseph Jackson was born on 29 August 1958 in Gary, Indiana — the seventh of nine children in a small clapboard house on Jackson Street that has since become a pilgrimage site. By the age of eleven he was the falsetto lead of the Jackson 5; by twenty-four, Thriller had sold more copies than any album in history and quietly stayed that way for the rest of the century. He wore a single white rhinestone glove on the right hand, at first because he had vitiligo and it hid the depigmentation on that side, later because the accessory had outlived its explanation and become a symbol you could see from the back of the arena. He would have been 68 today.

The left half is a dark stage under a warm circular spotlight: a single white sequined glove hovers above a tilted black fedora, both catching the beam. Small sparks travel across the beading, gold-star confetti drifts slowly downward through the light, and a faint amber pool ghosts across the polished stage floor. On the right, a large cream AUGUST 29, 2026 headline anchors a gold KING OF POP · 68 YEARS subhead, an italic amber GARY · MOTOWN · THRILLER · NEVERLAND tertiary, a dim MOONWALK · SEQUIN · FEDORA · JACKSON 5 roster, and a Georgia-italic caption at the base.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img"
     aria-label="Daily doodle for August 29, 2026 — the 68th birthday of Michael Jackson. On the left half, a dark stage under a warm circular spotlight; a single white sequined glove hovers above a tilted black fedora, small sparkles travelling across the glove's beading, and gold-star confetti drifts slowly down through the beam. On the right, a huge cream AUGUST 29, 2026 headline underlined by a gold-to-cream sweep, a gold KING OF POP · 68 YEARS subhead trailed by cream · SINCE 1958, an italic amber GARY · MOTOWN · THRILLER · NEVERLAND tertiary, a dim MOONWALK · SEQUIN · FEDORA · JACKSON 5 roster, and a Georgia-italic 'just beat it.' caption at the base.">
  <defs>
    <!-- Deep stage background -->
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0810"/>
      <stop offset="55%"  stop-color="#14080e"/>
      <stop offset="100%" stop-color="#050203"/>
    </linearGradient>

    <!-- Spotlight cone: warm amber softening downward -->
    <radialGradient id="spotBeam" cx="0.5" cy="0.15" r="0.85">
      <stop offset="0%"   stop-color="#fff2c8" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#ffd97a" stop-opacity="0.28"/>
      <stop offset="70%"  stop-color="#d4a840" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8a6020" stop-opacity="0"/>
    </radialGradient>

    <!-- Glove: pearl white with cool undertone -->
    <linearGradient id="gloveG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#e8e2f0"/>
      <stop offset="100%" stop-color="#9a8ea8"/>
    </linearGradient>

    <!-- Fedora -->
    <linearGradient id="fedoraG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#252028"/>
      <stop offset="100%" stop-color="#050203"/>
    </linearGradient>

    <!-- Underline sweep -->
    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d4a840" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#d4a840" stop-opacity="1"/>
      <stop offset="48%"  stop-color="#ffefb0" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#a89ab0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#d4a840" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="leftPanel">
      <rect x="0" y="0" width="360" height="200"/>
    </clipPath>
  </defs>

  <!-- ============ LEFT PANEL: STAGE ============ -->
  <g clip-path="url(#leftPanel)">
    <!-- Stage background -->
    <rect x="0" y="0" width="360" height="200" fill="url(#stage)"/>

    <!-- Spotlight cone from above (tapered downward) -->
    <path d="M 140 -10 L 220 -10 L 285 200 L 75 200 Z" fill="url(#spotBeam)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- Subtle warm rim glow behind glove -->
    <ellipse cx="180" cy="90" rx="80" ry="42" fill="#ffe08a" opacity="0.09">
      <animate attributeName="opacity" values="0.05;0.14;0.05" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Falling gold-star confetti (drifting downward) -->
    <g fill="#ffe08a">
      <circle cx="118" cy="20" r="1.2">
        <animate attributeName="cy" values="20;185" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="222" cy="10" r="0.9">
        <animate attributeName="cy" values="10;185" dur="13s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="13s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="12" r="1.4" fill="#ffd97a">
        <animate attributeName="cy" values="12;185" dur="9s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="95" cy="40" r="0.8">
        <animate attributeName="cy" values="40;185" dur="13s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="13s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="248" cy="30" r="1.0" fill="#ffefb0">
        <animate attributeName="cy" values="30;185" dur="11s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="11s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="198" cy="24" r="1.1">
        <animate attributeName="cy" values="24;185" dur="10s" begin="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="10s" begin="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="278" cy="16" r="0.9" fill="#ffd97a">
        <animate attributeName="cy" values="16;185" dur="12s" begin="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="12s" begin="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="14" r="1.0">
        <animate attributeName="cy" values="14;185" dur="14s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="14s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="138" cy="6" r="0.8" fill="#ffefb0">
        <animate attributeName="cy" values="6;185" dur="12s" begin="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="12s" begin="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="18" r="0.8">
        <animate attributeName="cy" values="18;185" dur="15s" begin="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="15s" begin="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Stage floor line -->
    <line x1="0" y1="176" x2="360" y2="176" stroke="#3a2028" stroke-width="0.6" opacity="0.7"/>

    <!-- Amber spotlight pool on floor -->
    <ellipse cx="180" cy="184" rx="100" ry="7" fill="#d4a840" opacity="0.20">
      <animate attributeName="opacity" values="0.14;0.26;0.14" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="184" rx="60" ry="4" fill="#ffefb0" opacity="0.30">
      <animate attributeName="opacity" values="0.20;0.40;0.20" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Fedora (tilted, sitting on stage floor) -->
    <g transform="translate(180, 168)">
      <g transform="rotate(-9)">
        <!-- brim -->
        <ellipse cx="0" cy="6" rx="50" ry="5.5" fill="url(#fedoraG)"/>
        <!-- crown -->
        <path d="M -24 3 Q -26 -22 -8 -26 Q 0 -27 8 -26 Q 26 -22 24 3 Z" fill="url(#fedoraG)"/>
        <!-- pinch on top of crown -->
        <path d="M -6 -24 Q 0 -20 6 -24" fill="none" stroke="#050203" stroke-width="0.6" opacity="0.8"/>
        <!-- hatband -->
        <path d="M -22 2 Q 0 6 22 2" fill="none" stroke="#050203" stroke-width="2.4"/>
        <!-- highlight on left side of crown -->
        <path d="M -16 -14 Q -10 -22 -2 -25" fill="none" stroke="#4a3a48" stroke-width="0.7" opacity="0.7"/>
        <!-- brim shadow line under crown -->
        <path d="M -22 3 Q 0 7 22 3" fill="none" stroke="#000" stroke-width="0.4" opacity="0.6"/>
      </g>
    </g>

    <!-- The sequined glove: hovering with subtle vertical bob -->
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
                        values="0 0; 0 -5; 0 0" dur="7s" repeatCount="indefinite"/>
      <g transform="translate(180, 108) rotate(-14)">
        <!-- Glove: palm-forward right hand, four fingers up plus thumb on left -->
        <!-- Palm/wrist base -->
        <path d="M -24 34
                 L -24 4
                 Q -24 -8 -14 -10
                 L -12 -32
                 Q -8 -37 -3 -32
                 L -1 -8
                 L 3 -34
                 Q 7 -39 12 -34
                 L 14 -8
                 L 18 -32
                 Q 22 -37 27 -32
                 L 27 -8
                 Q 29 -10 32 -8
                 L 34 -22
                 Q 38 -26 42 -22
                 L 40 -4
                 Q 38 6 30 8
                 L 30 34 Z"
              fill="url(#gloveG)" stroke="#8a7a95" stroke-width="0.5"/>

        <!-- Cuff (rhinestone band) -->
        <rect x="-26" y="32" width="58" height="7" fill="#d8ccdc" stroke="#8a7a95" stroke-width="0.4"/>
        <line x1="-24" y1="35.5" x2="30" y2="35.5" stroke="#8a7a95" stroke-width="0.3" opacity="0.6"/>

        <!-- Sequins scattered across the glove -->
        <g fill="#ffffff">
          <circle cx="-18" cy="14" r="1.0"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/></circle>
          <circle cx="-12" cy="22" r="0.9"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="0.5s" repeatCount="indefinite"/></circle>
          <circle cx="-4" cy="16" r="1.0"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
          <circle cx="4" cy="24" r="0.9"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
          <circle cx="10" cy="18" r="1.0"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
          <circle cx="16" cy="24" r="0.9"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
          <circle cx="22" cy="16" r="1.0"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
          <circle cx="28" cy="22" r="0.9"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="1.2s" repeatCount="indefinite"/></circle>
          <circle cx="-16" cy="26" r="0.8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
          <circle cx="-8" cy="4" r="0.9"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
          <circle cx="6" cy="6" r="0.9"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="2.2s" repeatCount="indefinite"/></circle>
          <circle cx="20" cy="4" r="0.8"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="1.8s" repeatCount="indefinite"/></circle>
          <circle cx="34" cy="0" r="0.9" fill="#ffefb0"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
          <circle cx="0" cy="10" r="0.7"><animate attributeName="opacity" values="0.35;1;0.35" dur="4s" begin="2.7s" repeatCount="indefinite"/></circle>
          <circle cx="14" cy="10" r="0.7"><animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="0.9s" repeatCount="indefinite"/></circle>
          <circle cx="26" cy="10" r="0.7"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
          <!-- Bright sparkles on cuff -->
          <circle cx="-14" cy="35.5" r="1.0" fill="#ffefb0"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle>
          <circle cx="-2" cy="35.5" r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
          <circle cx="10" cy="35.5" r="1.0" fill="#ffefb0"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle>
          <circle cx="22" cy="35.5" r="1.0"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="0.9s" repeatCount="indefinite"/></circle>
        </g>

        <!-- Cross-glove sparkle sweep -->
        <circle cx="-18" cy="10" r="1.5" fill="#ffffff" opacity="0">
          <animate attributeName="cx" values="-18;38" dur="11s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="10;18" dur="11s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- Seam -->
  <rect x="358" y="10" width="2" height="180" fill="url(#panelSeam)"/>

  <!-- ============ RIGHT TEXT PANEL ============ -->
  <rect x="360" y="0" width="440" height="200" fill="#0d1117"/>

  <!-- Right-edge accent bars -->
  <rect x="792" y="20" width="4" height="52" fill="#d4a840" opacity="0.85"/>
  <rect x="792" y="72" width="4" height="52" fill="#ffefb0" opacity="0.85"/>
  <rect x="792" y="124" width="4" height="52" fill="#a89ab0" opacity="0.85"/>

  <text x="386" y="66"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#f5efe0" letter-spacing="1">
    AUGUST 29, 2026
  </text>

  <rect x="386" y="76" width="390" height="3" fill="url(#underlineGrad)">
    <animate attributeName="x" values="386;396;386" dur="11s" repeatCount="indefinite"/>
  </rect>

  <text x="386" y="106"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="1.2">
    <tspan fill="#d4a840">KING OF POP</tspan><tspan fill="#f5efe0" opacity="0.75">&#160;·&#160;68 YEARS</tspan><tspan fill="#8a94a8" opacity="0.85">&#160;·&#160;SINCE 1958</tspan>
  </text>

  <text x="386" y="128"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" font-style="italic" fill="#ffd97a" letter-spacing="1" opacity="0.95">
    GARY · MOTOWN · THRILLER · NEVERLAND
  </text>

  <text x="386" y="146"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#a89ab0" letter-spacing="1" opacity="0.9">
    MOONWALK · SEQUIN · FEDORA · JACKSON 5
  </text>

  <text x="386" y="178"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" font-style="italic" fill="#f5efe0" opacity="0.9">
    &#8220;just beat it.&#8221;
  </text>
</svg>
