<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Galactic Core Gradients -->
    <radialGradient id="coreInner" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="coreOuter" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#FB7185;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FB7185;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#FBBF24;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0" />
    </radialGradient>

    <!-- Nebula Filter -->
    <filter id="nebula" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="42">
        <animate attributeName="baseFrequency" values="0.02;0.025;0.02" dur="17s" repeatCount="indefinite" />
      </feTurbulence>
      <feColorMatrix type="hueRotate" values="0">
        <animate attributeName="values" from="0" to="360" dur="37s" repeatCount="indefinite" />
      </feColorMatrix>
      <feGaussianBlur stdDeviation="2" />
    </filter>

    <!-- Satellite Galaxy Gradient -->
    <radialGradient id="satellite" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0" />
    </radialGradient>

    <!-- Dust Lane Gradient -->
    <linearGradient id="dust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Absolute Black Background -->
  <rect width="800" height="300" fill="#010108" />

  <!-- Background Stars (static, don't rotate) -->
  <g id="bgStars">
    <!-- Static stars -->
    <circle cx="50" cy="40" r="0.8" fill="#FFFFFF" opacity="0.6" />
    <circle cx="120" cy="80" r="0.6" fill="#E0E7FF" opacity="0.5" />
    <circle cx="680" cy="50" r="0.7" fill="#FEF3C7" opacity="0.6" />
    <circle cx="730" cy="120" r="0.6" fill="#DBEAFE" opacity="0.5" />
    <circle cx="60" cy="260" r="0.7" fill="#FFFFFF" opacity="0.5" />
    <circle cx="700" cy="240" r="0.8" fill="#E0E7FF" opacity="0.6" />
    <circle cx="150" cy="30" r="0.5" fill="#FEF3C7" opacity="0.4" />
    <circle cx="650" cy="270" r="0.6" fill="#DBEAFE" opacity="0.5" />
    <circle cx="90" cy="180" r="0.7" fill="#FFFFFF" opacity="0.5" />
    <circle cx="720" cy="180" r="0.6" fill="#E0E7FF" opacity="0.6" />
    <circle cx="40" cy="140" r="0.8" fill="#FEF3C7" opacity="0.5" />
    <circle cx="760" cy="90" r="0.7" fill="#DBEAFE" opacity="0.6" />
    <circle cx="180" cy="250" r="0.6" fill="#FFFFFF" opacity="0.5" />
    <circle cx="620" cy="35" r="0.7" fill="#E0E7FF" opacity="0.5" />
    <circle cx="30" cy="200" r="0.6" fill="#FEF3C7" opacity="0.4" />
    <circle cx="770" cy="220" r="0.8" fill="#DBEAFE" opacity="0.6" />
    <circle cx="110" cy="120" r="0.5" fill="#FFFFFF" opacity="0.4" />
    <circle cx="690" cy="160" r="0.6" fill="#E0E7FF" opacity="0.5" />
    <circle cx="140" cy="200" r="0.7" fill="#FEF3C7" opacity="0.5" />
    <circle cx="660" cy="100" r="0.6" fill="#DBEAFE" opacity="0.5" />

    <!-- Twinkling stars -->
    <circle cx="75" cy="60" r="0.9" fill="#FFFFFF" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="100" r="0.8" fill="#E0E7FF" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="70" r="0.9" fill="#FEF3C7" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="150" r="0.8" fill="#DBEAFE" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="45" cy="100" r="0.9" fill="#FFFFFF" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="710" cy="200" r="0.8" fill="#E0E7FF" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="240" r="0.9" fill="#FEF3C7" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="230" r="0.8" fill="#DBEAFE" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="170" cy="150" r="0.9" fill="#FFFFFF" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="630" cy="140" r="0.8" fill="#E0E7FF" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="210" r="0.9" fill="#FEF3C7" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="740" cy="60" r="0.8" fill="#DBEAFE" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.5s" repeatCount="indefinite" />
    </circle>

    <!-- Additional scattered stars -->
    <circle cx="220" cy="45" r="0.6" fill="#FFFFFF" opacity="0.5" />
    <circle cx="580" cy="280" r="0.7" fill="#E0E7FF" opacity="0.5" />
    <circle cx="260" cy="220" r="0.6" fill="#FEF3C7" opacity="0.4" />
    <circle cx="540" cy="60" r="0.7" fill="#DBEAFE" opacity="0.5" />
    <circle cx="300" cy="130" r="0.6" fill="#FFFFFF" opacity="0.5" />
    <circle cx="500" cy="170" r="0.7" fill="#E0E7FF" opacity="0.5" />
    <circle cx="340" cy="260" r="0.6" fill="#FEF3C7" opacity="0.4" />
    <circle cx="460" cy="40" r="0.7" fill="#DBEAFE" opacity="0.5" />
    <circle cx="380" cy="90" r="0.6" fill="#FFFFFF" opacity="0.5" />
    <circle cx="420" cy="210" r="0.7" fill="#E0E7FF" opacity="0.5" />
  </g>

  <!-- Satellite Galaxies (static) -->
  <ellipse cx="120" cy="60" rx="8" ry="6" fill="url(#satellite)" opacity="0.7" />
  <ellipse cx="680" cy="240" rx="6" ry="8" fill="url(#satellite)" opacity="0.6" />

  <!-- Rotating Galaxy Group -->
  <g id="galaxy" transform-origin="400 150" transform-box="fill-box">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 400 150"
      to="360 400 150"
      dur="300s"
      repeatCount="indefinite"
    />

    <!-- Galactic Core -->
    <ellipse cx="400" cy="150" rx="40" ry="35" fill="url(#coreOuter)" opacity="0.8" />
    <ellipse cx="400" cy="150" rx="25" ry="22" fill="url(#coreGlow)" opacity="0.9" />
    <ellipse cx="400" cy="150" rx="12" ry="10" fill="url(#coreInner)" />
    <circle cx="400" cy="150" r="4" fill="#FFFFFF" opacity="0.95" />

    <!-- Spiral Arm 1 (starts at angle ~30deg) -->
    <!-- Core region - warm gold/white -->
    <circle cx="415" cy="135" r="3.5" fill="#FEF3C7" opacity="0.9" />
    <circle cx="425" cy="128" r="3.2" fill="#FBBF24" opacity="0.85" />
    <circle cx="435" cy="122" r="3.0" fill="#F59E0B" opacity="0.8" />
    <circle cx="445" cy="117" r="2.8" fill="#F59E0B" opacity="0.75" />
    <circle cx="455" cy="113" r="2.6" fill="#FBBF24" opacity="0.7" />
    <circle cx="465" cy="110" r="2.5" fill="#FEF3C7" opacity="0.68" />
    <circle cx="475" cy="108" r="2.4" fill="#F59E0B" opacity="0.65" />
    <circle cx="485" cy="107" r="2.3" fill="#FBBF24" opacity="0.62" />

    <!-- Mid-arm region - transitioning to cyan/violet -->
    <circle cx="495" cy="107" r="2.2" fill="#22D3EE" opacity="0.6" />
    <circle cx="505" cy="108" r="2.1" fill="#06B6D4" opacity="0.58" />
    <circle cx="515" cy="110" r="2.0" fill="#A78BFA" opacity="0.56" />
    <circle cx="525" cy="113" r="1.9" fill="#8B5CF6" opacity="0.54" />
    <circle cx="535" cy="117" r="1.8" fill="#22D3EE" opacity="0.52" />
    <circle cx="545" cy="122" r="1.75" fill="#06B6D4" opacity="0.5" />
    <circle cx="555" cy="128" r="1.7" fill="#A78BFA" opacity="0.48" />
    <circle cx="565" cy="135" r="1.65" fill="#8B5CF6" opacity="0.46" />
    <circle cx="575" cy="143" r="1.6" fill="#22D3EE" opacity="0.44" />
    <circle cx="585" cy="152" r="1.55" fill="#06B6D4" opacity="0.42" />

    <!-- Outer arm - fading blues -->
    <circle cx="595" cy="162" r="1.5" fill="#3B82F6" opacity="0.4" />
    <circle cx="605" cy="173" r="1.45" fill="#2563EB" opacity="0.38" />
    <circle cx="614" cy="185" r="1.4" fill="#3B82F6" opacity="0.36" />
    <circle cx="622" cy="198" r="1.35" fill="#60A5FA" opacity="0.34" />
    <circle cx="629" cy="212" r="1.3" fill="#3B82F6" opacity="0.32" />
    <circle cx="635" cy="227" r="1.25" fill="#2563EB" opacity="0.3" />
    <circle cx="640" cy="243" r="1.2" fill="#60A5FA" opacity="0.28" />
    <circle cx="644" cy="260" r="1.15" fill="#3B82F6" opacity="0.26" />
    <circle cx="647" cy="278" r="1.1" fill="#2563EB" opacity="0.24" />
    <circle cx="649" cy="296" r="1.05" fill="#60A5FA" opacity="0.22" />

    <!-- Additional outer dots -->
    <circle cx="650" cy="315" r="1.0" fill="#3B82F6" opacity="0.2" />
    <circle cx="650" cy="335" r="0.95" fill="#2563EB" opacity="0.18" />
    <circle cx="649" cy="355" r="0.9" fill="#60A5FA" opacity="0.16" />
    <circle cx="647" cy="375" r="0.85" fill="#3B82F6" opacity="0.14" />

    <!-- Spiral Arm 2 (starts at angle ~210deg, opposite side) -->
    <!-- Core region - warm gold/white -->
    <circle cx="385" cy="165" r="3.5" fill="#FEF3C7" opacity="0.9" />
    <circle cx="375" cy="172" r="3.2" fill="#FBBF24" opacity="0.85" />
    <circle cx="365" cy="178" r="3.0" fill="#F59E0B" opacity="0.8" />
    <circle cx="355" cy="183" r="2.8" fill="#F59E0B" opacity="0.75" />
    <circle cx="345" cy="187" r="2.6" fill="#FBBF24" opacity="0.7" />
    <circle cx="335" cy="190" r="2.5" fill="#FEF3C7" opacity="0.68" />
    <circle cx="325" cy="192" r="2.4" fill="#F59E0B" opacity="0.65" />
    <circle cx="315" cy="193" r="2.3" fill="#FBBF24" opacity="0.62" />

    <!-- Mid-arm region - transitioning to cyan/violet -->
    <circle cx="305" cy="193" r="2.2" fill="#22D3EE" opacity="0.6" />
    <circle cx="295" cy="192" r="2.1" fill="#06B6D4" opacity="0.58" />
    <circle cx="285" cy="190" r="2.0" fill="#A78BFA" opacity="0.56" />
    <circle cx="275" cy="187" r="1.9" fill="#8B5CF6" opacity="0.54" />
    <circle cx="265" cy="183" r="1.8" fill="#22D3EE" opacity="0.52" />
    <circle cx="255" cy="178" r="1.75" fill="#06B6D4" opacity="0.5" />
    <circle cx="245" cy="172" r="1.7" fill="#A78BFA" opacity="0.48" />
    <circle cx="235" cy="165" r="1.65" fill="#8B5CF6" opacity="0.46" />
    <circle cx="225" cy="157" r="1.6" fill="#22D3EE" opacity="0.44" />
    <circle cx="215" cy="148" r="1.55" fill="#06B6D4" opacity="0.42" />

    <!-- Outer arm - fading blues -->
    <circle cx="205" cy="138" r="1.5" fill="#3B82F6" opacity="0.4" />
    <circle cx="195" cy="127" r="1.45" fill="#2563EB" opacity="0.38" />
    <circle cx="186" cy="115" r="1.4" fill="#3B82F6" opacity="0.36" />
    <circle cx="178" cy="102" r="1.35" fill="#60A5FA" opacity="0.34" />
    <circle cx="171" cy="88" r="1.3" fill="#3B82F6" opacity="0.32" />
    <circle cx="165" cy="73" r="1.25" fill="#2563EB" opacity="0.3" />
    <circle cx="160" cy="57" r="1.2" fill="#60A5FA" opacity="0.28" />
    <circle cx="156" cy="40" r="1.15" fill="#3B82F6" opacity="0.26" />
    <circle cx="153" cy="22" r="1.1" fill="#2563EB" opacity="0.24" />
    <circle cx="151" cy="4" r="1.05" fill="#60A5FA" opacity="0.22" />

    <!-- Additional outer dots -->
    <circle cx="150" cy="-15" r="1.0" fill="#3B82F6" opacity="0.2" />
    <circle cx="150" cy="-35" r="0.95" fill="#2563EB" opacity="0.18" />
    <circle cx="151" cy="-55" r="0.9" fill="#60A5FA" opacity="0.16" />
    <circle cx="153" cy="-75" r="0.85" fill="#3B82F6" opacity="0.14" />

    <!-- Nebula Regions -->
    <!-- Cyan nebula in arm 1 -->
    <ellipse cx="520" cy="115" rx="18" ry="12" fill="#06B6D4" opacity="0.3" filter="url(#nebula)" />

    <!-- Violet nebula in arm 1 -->
    <ellipse cx="580" cy="150" rx="15" ry="20" fill="#8B5CF6" opacity="0.25" filter="url(#nebula)" />

    <!-- Rose nebula near core -->
    <ellipse cx="420" cy="165" rx="20" ry="15" fill="#FB7185" opacity="0.28" filter="url(#nebula)" />

    <!-- Cyan nebula in arm 2 -->
    <ellipse cx="280" cy="185" rx="18" ry="12" fill="#06B6D4" opacity="0.3" filter="url(#nebula)" />

    <!-- Violet nebula in arm 2 -->
    <ellipse cx="220" cy="150" rx="15" ry="20" fill="#8B5CF6" opacity="0.25" filter="url(#nebula)" />

    <!-- Dust Lanes (dark streaks along inner arm edges) -->
    <ellipse cx="430" cy="140" rx="35" ry="8" fill="url(#dust)" opacity="0.6" transform="rotate(25 430 140)" />
    <ellipse cx="370" cy="160" rx="35" ry="8" fill="url(#dust)" opacity="0.6" transform="rotate(-25 370 160)" />
    <ellipse cx="480" cy="120" rx="40" ry="7" fill="url(#dust)" opacity="0.5" transform="rotate(30 480 120)" />
    <ellipse cx="320" cy="180" rx="40" ry="7" fill="url(#dust)" opacity="0.5" transform="rotate(-30 320 180)" />
  </g>
</svg>
