<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Desert Oasis Under Stars">
  <title>Desert Oasis Under Stars</title>

  <defs>
    <!-- Sky gradient: deep desert night -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#050510;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0508;stop-opacity:1" />
    </linearGradient>

    <!-- Moon glow filter -->
    <filter id="moonGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star glow -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="0.5" />
    </filter>

    <!-- Milky Way nebulosity blur -->
    <filter id="nebulosity">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- Heat shimmer displacement -->
    <filter id="heatShimmer">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.005" numOctaves="2" result="turbulence">
        <animate attributeName="baseFrequency" values="0.05 0.005; 0.06 0.006; 0.05 0.005" dur="17s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Water ripple effect -->
    <filter id="waterRipple">
      <feTurbulence type="turbulence" baseFrequency="0.02 0.04" numOctaves="2" result="turbulence">
        <animate attributeName="baseFrequency" values="0.02 0.04; 0.025 0.05; 0.02 0.04" dur="11s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="300" fill="url(#skyGradient)" />

  <!-- Milky Way band - nebulous cloud -->
  <g opacity="0.15">
    <ellipse cx="200" cy="80" rx="180" ry="35" fill="#d0d0ff" filter="url(#nebulosity)" transform="rotate(-25 200 80)" />
    <ellipse cx="400" cy="100" rx="200" ry="40" fill="#e0e0ff" filter="url(#nebulosity)" transform="rotate(-25 400 100)" />
    <ellipse cx="600" cy="120" rx="180" ry="35" fill="#c5c5ff" filter="url(#nebulosity)" transform="rotate(-25 600 120)" />
  </g>

  <!-- Star field - static stars -->
  <g fill="#ffffff" opacity="0.7">
    <!-- Milky Way dense region -->
    <circle cx="150" cy="75" r="0.5" />
    <circle cx="180" cy="65" r="0.7" />
    <circle cx="210" cy="85" r="0.6" />
    <circle cx="165" cy="95" r="0.5" />
    <circle cx="195" cy="70" r="0.8" />
    <circle cx="230" cy="78" r="0.6" />
    <circle cx="175" cy="82" r="0.5" />
    <circle cx="220" cy="92" r="0.7" />
    <circle cx="250" cy="88" r="0.6" />
    <circle cx="270" cy="95" r="0.5" />

    <circle cx="320" cy="105" r="0.7" />
    <circle cx="350" cy="95" r="0.6" />
    <circle cx="380" cy="110" r="0.8" />
    <circle cx="340" cy="115" r="0.5" />
    <circle cx="370" cy="100" r="0.7" />
    <circle cx="410" cy="108" r="0.6" />
    <circle cx="390" cy="92" r="0.5" />
    <circle cx="430" cy="112" r="0.7" />
    <circle cx="360" cy="88" r="0.6" />
    <circle cx="400" cy="85" r="0.5" />

    <circle cx="480" cy="115" r="0.6" />
    <circle cx="510" cy="105" r="0.7" />
    <circle cx="540" cy="125" r="0.8" />
    <circle cx="490" cy="130" r="0.5" />
    <circle cx="520" cy="118" r="0.6" />
    <circle cx="560" cy="122" r="0.7" />
    <circle cx="530" cy="110" r="0.5" />
    <circle cx="580" cy="128" r="0.6" />
    <circle cx="600" cy="120" r="0.7" />
    <circle cx="620" cy="132" r="0.5" />

    <!-- Scattered stars outside Milky Way -->
    <circle cx="80" cy="40" r="0.8" />
    <circle cx="120" cy="30" r="0.6" />
    <circle cx="300" cy="50" r="0.7" />
    <circle cx="450" cy="45" r="0.8" />
    <circle cx="550" cy="35" r="0.6" />
    <circle cx="650" cy="60" r="0.7" />
    <circle cx="700" cy="40" r="0.8" />
    <circle cx="730" cy="75" r="0.6" />
    <circle cx="680" cy="90" r="0.7" />
    <circle cx="750" cy="55" r="0.5" />

    <circle cx="50" cy="100" r="0.6" />
    <circle cx="90" cy="120" r="0.7" />
    <circle cx="140" cy="135" r="0.5" />
    <circle cx="260" cy="140" r="0.6" />
    <circle cx="720" cy="145" r="0.7" />
    <circle cx="770" cy="110" r="0.6" />

    <!-- Faint stars -->
    <circle cx="35" cy="65" r="0.4" opacity="0.5" />
    <circle cx="110" cy="50" r="0.4" opacity="0.5" />
    <circle cx="280" cy="70" r="0.4" opacity="0.5" />
    <circle cx="330" cy="60" r="0.4" opacity="0.5" />
    <circle cx="470" cy="75" r="0.4" opacity="0.5" />
    <circle cx="590" cy="55" r="0.4" opacity="0.5" />
    <circle cx="640" cy="85" r="0.4" opacity="0.5" />
    <circle cx="710" cy="100" r="0.4" opacity="0.5" />
  </g>

  <!-- Twinkling stars with staggered animations -->
  <g fill="#ffffff">
    <circle cx="200" cy="45" r="1.2" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="420" cy="55" r="1.4" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="11s" begin="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="580" cy="70" r="1.3" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="13s" begin="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="110" r="1.1" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="17s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="38" r="1.2" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="82" r="1.3" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="23s" begin="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="48" r="1.1" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="29s" begin="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="240" cy="92" r="1.2" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="31s" begin="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="460" cy="125" r="1.4" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="37s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="95" r="1.3" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="41s" begin="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="75" r="1.2" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="43s" begin="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="148" r="1.1" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="47s" begin="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="540" cy="62" r="1.3" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="53s" begin="4.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="128" r="1.2" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="59s" begin="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="25" r="1.4" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="61s" begin="5.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Shooting stars -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0">
    <line x1="650" y1="50" x2="680" y2="70">
      <animate attributeName="opacity" values="0;0;1;0.6;0;0;0" dur="47s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,30" dur="47s" repeatCount="indefinite" />
    </line>
    <line x1="200" y1="80" x2="240" y2="105">
      <animate attributeName="opacity" values="0;0;0;1;0.5;0;0;0;0" dur="31s" begin="10s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0,0; 60,40" dur="31s" begin="10s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Crescent moon with glow -->
  <g filter="url(#moonGlow)">
    <path d="M 720 50 A 20 20 0 1 0 720 90 A 15 15 0 1 1 720 50 Z" fill="#fffacd" opacity="0.95" />
  </g>

  <!-- Heat shimmer line along horizon -->
  <path d="M 0 180 Q 100 178, 200 180 T 400 180 T 600 180 T 800 180"
        stroke="#1a0a10" stroke-width="1" fill="none" opacity="0.3" filter="url(#heatShimmer)" />

  <!-- Distant dunes (lightest) -->
  <path d="M 0 200 Q 150 185, 300 195 T 600 190 T 800 195 L 800 300 L 0 300 Z" fill="#2a1a15" opacity="0.6" />

  <!-- Ancient ruin on distant dune -->
  <g fill="#150a08" opacity="0.7">
    <rect x="520" y="185" width="8" height="15" />
    <rect x="532" y="183" width="6" height="17" />
    <rect x="542" y="187" width="7" height="13" />
    <polygon points="524,185 534,178 538,185" />
  </g>

  <!-- Camel caravan silhouettes on distant ridge -->
  <g fill="#1a0a08" opacity="0.5">
    <!-- Camel 1 -->
    <ellipse cx="240" cy="192" rx="8" ry="5" />
    <rect x="238" y="188" width="2" height="6" />
    <rect x="242" y="188" width="2" height="6" />
    <ellipse cx="240" cy="185" rx="3" ry="4" />

    <!-- Camel 2 -->
    <ellipse cx="260" cy="194" rx="7" ry="4.5" />
    <rect x="258" y="190" width="2" height="5" />
    <rect x="262" y="190" width="2" height="5" />
    <ellipse cx="260" cy="188" rx="2.5" ry="3.5" />

    <!-- Camel 3 -->
    <ellipse cx="276" cy="195" rx="6.5" ry="4" />
    <rect x="274" y="191" width="1.5" height="5" />
    <rect x="277.5" y="191" width="1.5" height="5" />
    <ellipse cx="276" cy="189" rx="2.5" ry="3" />
  </g>

  <!-- Mid-distance dunes -->
  <path d="M 0 220 Q 200 205, 400 218 T 700 212 T 800 220 L 800 300 L 0 300 Z" fill="#1f1410" opacity="0.8" />

  <!-- Sand particles drifting near dune crests -->
  <g fill="#3a2a20" opacity="0.4">
    <circle cx="380" cy="215" r="1">
      <animate attributeName="cx" values="380;420;380" dur="23s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="23s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="217" r="0.8">
      <animate attributeName="cx" values="450;490;450" dur="29s" begin="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="29s" begin="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="520" cy="213" r="1.2">
      <animate attributeName="cx" values="520;560;520" dur="31s" begin="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="31s" begin="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="210" cy="208" r="0.9">
      <animate attributeName="cx" values="210;250;210" dur="37s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="37s" begin="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="214" r="1.1">
      <animate attributeName="cx" values="640;680;640" dur="41s" begin="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="41s" begin="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Near dunes (darkest) with oasis -->
  <path d="M 0 245 Q 180 235, 350 242 Q 450 246, 550 240 T 800 248 L 800 300 L 0 300 Z" fill="#1a100a" />

  <!-- Oasis water pool -->
  <ellipse cx="580" cy="255" rx="45" ry="18" fill="#0a1a30" opacity="0.8" filter="url(#waterRipple)" />

  <!-- Water reflections - starlight on water -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="560" cy="252" r="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="13s" repeatCount="indefinite" />
    </circle>
    <circle cx="575" cy="255" r="0.6">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="17s" begin="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="590" cy="257" r="0.7">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="19s" begin="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="570" cy="258" r="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="23s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="595" cy="253" r="0.6">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="29s" begin="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Reeds and grass at water's edge -->
  <g stroke="#0a0a05" stroke-width="1" fill="none" opacity="0.7">
    <line x1="540" y1="265" x2="540" y2="252">
      <animateTransform attributeName="transform" type="rotate" values="0 540 265; 2 540 265; 0 540 265; -2 540 265; 0 540 265" dur="13s" repeatCount="indefinite" />
    </line>
    <line x1="545" y1="267" x2="545" y2="256">
      <animateTransform attributeName="transform" type="rotate" values="0 545 267; -1.5 545 267; 0 545 267; 1.5 545 267; 0 545 267" dur="17s" begin="2s" repeatCount="indefinite" />
    </line>
    <line x1="550" y1="266" x2="550" y2="254">
      <animateTransform attributeName="transform" type="rotate" values="0 550 266; 1.8 550 266; 0 550 266; -1.8 550 266; 0 550 266" dur="19s" begin="1s" repeatCount="indefinite" />
    </line>
    <line x1="625" y1="264" x2="625" y2="253">
      <animateTransform attributeName="transform" type="rotate" values="0 625 264; -2 625 264; 0 625 264; 2 625 264; 0 625 264" dur="23s" begin="3s" repeatCount="indefinite" />
    </line>
    <line x1="630" y1="266" x2="630" y2="255">
      <animateTransform attributeName="transform" type="rotate" values="0 630 266; 1.5 630 266; 0 630 266; -1.5 630 266; 0 630 266" dur="29s" begin="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Palm trees -->
  <g fill="#0a0a05">
    <!-- Palm 1 - trunk -->
    <path d="M 600 270 Q 602 250, 605 235 Q 606 220, 608 210" stroke="#0a0a05" stroke-width="3" fill="none" />

    <!-- Palm 1 - fronds -->
    <g transform-origin="608 210" style="transform-box: fill-box">
      <path d="M 608 210 Q 598 200, 590 195" stroke="#0a0a05" stroke-width="2" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 608 210; -3 608 210; 0 608 210; 2 608 210; 0 608 210" dur="13s" repeatCount="indefinite" />
      </path>
      <path d="M 608 210 Q 608 195, 608 185" stroke="#0a0a05" stroke-width="2" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 608 210; 2 608 210; 0 608 210; -2 608 210; 0 608 210" dur="17s" begin="1s" repeatCount="indefinite" />
      </path>
      <path d="M 608 210 Q 618 200, 626 195" stroke="#0a0a05" stroke-width="2" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 608 210; 3 608 210; 0 608 210; -2 608 210; 0 608 210" dur="19s" begin="2s" repeatCount="indefinite" />
      </path>
      <path d="M 608 210 Q 600 205, 595 198" stroke="#0a0a05" stroke-width="1.5" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 608 210; -2 608 210; 0 608 210; 3 608 210; 0 608 210" dur="23s" begin="3s" repeatCount="indefinite" />
      </path>
      <path d="M 608 210 Q 616 205, 621 198" stroke="#0a0a05" stroke-width="1.5" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 608 210; 2.5 608 210; 0 608 210; -2.5 608 210; 0 608 210" dur="29s" begin="4s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Palm 2 - trunk -->
    <path d="M 555 272 Q 556 255, 558 240 Q 559 228, 560 220" stroke="#0a0a05" stroke-width="2.5" fill="none" />

    <!-- Palm 2 - fronds -->
    <g transform-origin="560 220" style="transform-box: fill-box">
      <path d="M 560 220 Q 552 212, 546 208" stroke="#0a0a05" stroke-width="1.8" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 560 220; -2.5 560 220; 0 560 220; 2 560 220; 0 560 220" dur="17s" begin="1s" repeatCount="indefinite" />
      </path>
      <path d="M 560 220 Q 560 208, 560 200" stroke="#0a0a05" stroke-width="1.8" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 560 220; 2 560 220; 0 560 220; -2 560 220; 0 560 220" dur="19s" begin="2s" repeatCount="indefinite" />
      </path>
      <path d="M 560 220 Q 568 212, 574 208" stroke="#0a0a05" stroke-width="1.8" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 560 220; 2.8 560 220; 0 560 220; -2.2 560 220; 0 560 220" dur="23s" begin="3s" repeatCount="indefinite" />
      </path>
      <path d="M 560 220 Q 554 214, 550 210" stroke="#0a0a05" stroke-width="1.5" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 560 220; -2 560 220; 0 560 220; 2.5 560 220; 0 560 220" dur="29s" begin="4s" repeatCount="indefinite" />
      </path>
      <path d="M 560 220 Q 566 214, 570 210" stroke="#0a0a05" stroke-width="1.5" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 560 220; 2.3 560 220; 0 560 220; -2.3 560 220; 0 560 220" dur="31s" begin="5s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Palm 3 - smaller, background tree -->
    <path d="M 620 268 Q 621 253, 622 242" stroke="#0a0a05" stroke-width="2" fill="none" opacity="0.7" />

    <!-- Palm 3 - fronds -->
    <g transform-origin="622 242" style="transform-box: fill-box" opacity="0.7">
      <path d="M 622 242 Q 616 236, 612 233" stroke="#0a0a05" stroke-width="1.5" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 622 242; -2 622 242; 0 622 242; 2 622 242; 0 622 242" dur="19s" begin="2s" repeatCount="indefinite" />
      </path>
      <path d="M 622 242 Q 622 234, 622 228" stroke="#0a0a05" stroke-width="1.5" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 622 242; 1.8 622 242; 0 622 242; -1.8 622 242; 0 622 242" dur="23s" begin="3s" repeatCount="indefinite" />
      </path>
      <path d="M 622 242 Q 628 236, 632 233" stroke="#0a0a05" stroke-width="1.5" fill="none">
        <animateTransform attributeName="transform" type="rotate" values="0 622 242; 2.2 622 242; 0 622 242; -2 622 242; 0 622 242" dur="29s" begin="4s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>
