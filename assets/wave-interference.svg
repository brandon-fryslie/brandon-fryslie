<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Wave interference patterns visualization">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#0a0a1e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#020210;stop-opacity:1"/>
    </radialGradient>

    <!-- Source glows -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="roseGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#EC4899;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Shimmer sweep -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
      <animate attributeName="x1" values="-50%;150%;-50%" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%;0%" dur="23s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>
  <rect width="800" height="300" fill="url(#grid)"/>
  <rect width="800" height="300" fill="url(#shimmer)"/>

  <!-- Source glows -->
  <circle cx="150" cy="150" r="120" fill="url(#cyanGlow)" opacity="0.4"/>
  <circle cx="400" cy="150" r="120" fill="url(#violetGlow)" opacity="0.4"/>
  <circle cx="650" cy="150" r="120" fill="url(#roseGlow)" opacity="0.4"/>

  <!-- Wave rings - Source 1 (Cyan, left) -->
  <g id="source1-waves">
    <!-- Ring 1 -->
    <circle cx="150" cy="150" r="0" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 2 -->
    <circle cx="150" cy="150" r="0" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="7s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 3 -->
    <circle cx="150" cy="150" r="0" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="7s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 4 -->
    <circle cx="150" cy="150" r="0" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="7s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="7s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 5 -->
    <circle cx="150" cy="150" r="0" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="7s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="7s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 6 -->
    <circle cx="150" cy="150" r="0" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="7s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="7s" begin="5s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 7 -->
    <circle cx="150" cy="150" r="0" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="7s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="7s" begin="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wave rings - Source 2 (Violet, center) -->
  <g id="source2-waves">
    <!-- Ring 1 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 2 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 3 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 4 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" begin="4.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 5 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" begin="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" begin="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 6 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" begin="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" begin="7.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 7 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" begin="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" begin="9s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 8 -->
    <circle cx="400" cy="150" r="0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="11s" begin="10.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="11s" begin="10.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wave rings - Source 3 (Rose, right) -->
  <g id="source3-waves">
    <!-- Ring 1 -->
    <circle cx="650" cy="150" r="0" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 2 -->
    <circle cx="650" cy="150" r="0" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="13s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="13s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 3 -->
    <circle cx="650" cy="150" r="0" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="13s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="13s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 4 -->
    <circle cx="650" cy="150" r="0" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="13s" begin="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="13s" begin="5.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 5 -->
    <circle cx="650" cy="150" r="0" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="13s" begin="7.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="13s" begin="7.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 6 -->
    <circle cx="650" cy="150" r="0" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="13s" begin="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="13s" begin="9s" repeatCount="indefinite"/>
    </circle>
    <!-- Ring 7 -->
    <circle cx="650" cy="150" r="0" fill="none" stroke="#EC4899" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="0;250" dur="13s" begin="10.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="13s" begin="10.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Interference nodes - bright dots at calculated overlap positions -->
  <g id="interference-nodes">
    <!-- Between source 1 and 2 -->
    <circle cx="260" cy="120" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="170" r="2" fill="#06B6D4">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="150" r="2.5" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Between source 2 and 3 -->
    <circle cx="520" cy="130" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="180" r="2" fill="#EC4899">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="150" r="2.5" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="6.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Between source 1 and 3 (farther apart) -->
    <circle cx="400" cy="100" r="2" fill="#06B6D4">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="6.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="190" r="2" fill="#EC4899">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Three-way interference (center area) -->
    <circle cx="400" cy="150" r="3" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2.5;3.5;2.5" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="140" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="160" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Additional scattered nodes -->
    <circle cx="320" cy="190" r="1.5" fill="#06B6D4">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="110" r="1.5" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="200" r="1.5" fill="#EC4899">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="120" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Detector array at bottom - horizontal line of dots -->
  <g id="detector-array">
    <circle cx="100" cy="270" r="2.5" fill="#06B6D4" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="270" r="2.5" fill="#06B6D4" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="270" r="2.5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="270" r="2.5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="270" r="2.5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="270" r="2.5" fill="#ffffff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="270" r="2.5" fill="#ffffff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="270" r="2.5" fill="#ffffff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="270" r="2.5" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="270" r="2.5" fill="#EC4899" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="270" r="2.5" fill="#EC4899" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="270" r="2.5" fill="#EC4899" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="270" r="2.5" fill="#EC4899" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="19s" begin="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Source emission points (rendered on top) -->
  <g id="sources">
    <!-- Source 1 (Cyan) -->
    <circle cx="150" cy="150" r="5" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="150" r="8" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="5;12;5" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Source 2 (Violet) -->
    <circle cx="400" cy="150" r="5" fill="#8B5CF6">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="150" r="8" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="5;12;5" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.7s" repeatCount="indefinite"/>
    </circle>

    <!-- Source 3 (Rose) -->
    <circle cx="650" cy="150" r="5" fill="#EC4899">
      <animate attributeName="opacity" values="1;0.6;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="150" r="8" fill="none" stroke="#EC4899" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="5;12;5" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>