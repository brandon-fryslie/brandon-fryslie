<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="pcbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020D08;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051510;stop-opacity:1" />
    </linearGradient>

    <!-- Grid pattern for PCB substrate -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0a2010" stroke-width="0.3" opacity="0.3"/>
    </pattern>

    <!-- Chip glow filters -->
    <radialGradient id="chipGlow1">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:0.4">
        <animate attributeName="stop-opacity" values="0.4;0.7;0.4" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="chipGlow2">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.4">
        <animate attributeName="stop-opacity" values="0.4;0.6;0.4" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="chipGlow3">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.3">
        <animate attributeName="stop-opacity" values="0.3;0.5;0.3" dur="13s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#pcbGradient)"/>
  <rect width="800" height="300" fill="url(#grid)"/>

  <!-- CIRCUIT TRACES - Complex routing pattern -->
  <!-- Main power traces (thicker) -->
  <path d="M 50 50 L 150 50 L 150 100 L 250 100" stroke="#B45309" stroke-width="2" fill="none" opacity="0.9"/>
  <path d="M 250 100 L 250 150 L 350 150 L 350 200" stroke="#B45309" stroke-width="2" fill="none" opacity="0.9"/>
  <path d="M 550 80 L 650 80 L 650 140 L 750 140" stroke="#B45309" stroke-width="2" fill="none" opacity="0.9"/>

  <!-- Signal traces (thin copper) -->
  <path d="M 100 120 L 180 120 L 180 180 L 260 180" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 260 180 L 260 220 L 340 220" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 400 60 L 480 60 L 480 110 L 560 110" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 560 110 L 560 170 L 640 170" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 120 240 L 200 240 L 200 190 L 280 190" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 450 200 L 530 200 L 530 250 L 610 250" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 70 160 L 130 160 L 130 210 L 190 210" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 320 70 L 380 70 L 380 120 L 440 120" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 580 50 L 620 50 L 620 100 L 680 100" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 150 270 L 230 270 L 230 230 L 310 230" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Data bus - parallel traces -->
  <g opacity="0.8">
    <path d="M 380 160 L 460 160 L 460 190 L 540 190" stroke="#64748B" stroke-width="1.2" fill="none"/>
    <path d="M 380 165 L 460 165 L 460 195 L 540 195" stroke="#64748B" stroke-width="1.2" fill="none"/>
    <path d="M 380 170 L 460 170 L 460 200 L 540 200" stroke="#64748B" stroke-width="1.2" fill="none"/>
    <path d="M 380 175 L 460 175 L 460 205 L 540 205" stroke="#64748B" stroke-width="1.2" fill="none"/>
    <path d="M 380 180 L 460 180 L 460 210 L 540 210" stroke="#64748B" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Additional routing traces -->
  <path d="M 220 130 L 280 130 L 280 90 L 340 90" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 500 130 L 560 130 L 560 90 L 620 90" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 90 90 L 140 90 L 140 140 L 190 140" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 600 220 L 660 220 L 660 180 L 720 180" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 300 260 L 360 260 L 360 210 L 420 210" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 160 200 L 220 200 L 220 160 L 270 160" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- CHIPS/ICs -->
  <!-- Main processor IC -->
  <g>
    <ellipse cx="280" cy="130" rx="55" ry="55" fill="url(#chipGlow1)" opacity="0.6"/>
    <rect x="240" y="90" width="80" height="80" fill="#0a1a12" stroke="#B45309" stroke-width="2" rx="2"/>
    <!-- Pins -->
    <g stroke="#B45309" stroke-width="1.5">
      <line x1="235" y1="100" x2="240" y2="100"/><line x1="235" y1="110" x2="240" y2="110"/>
      <line x1="235" y1="120" x2="240" y2="120"/><line x1="235" y1="130" x2="240" y2="130"/>
      <line x1="235" y1="140" x2="240" y2="140"/><line x1="235" y1="150" x2="240" y2="150"/>
      <line x1="235" y1="160" x2="240" y2="160"/>
      <line x1="320" y1="100" x2="325" y2="100"/><line x1="320" y1="110" x2="325" y2="110"/>
      <line x1="320" y1="120" x2="325" y2="120"/><line x1="320" y1="130" x2="325" y2="130"/>
      <line x1="320" y1="140" x2="325" y2="140"/><line x1="320" y1="150" x2="325" y2="150"/>
      <line x1="320" y1="160" x2="325" y2="160"/>
    </g>
    <text x="280" y="135" font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">IC1</text>
  </g>

  <!-- Memory chip -->
  <g>
    <ellipse cx="560" cy="110" rx="50" ry="45" fill="url(#chipGlow2)" opacity="0.5"/>
    <rect x="525" y="80" width="70" height="60" fill="#0a1420" stroke="#64748B" stroke-width="2" rx="2"/>
    <!-- Pins -->
    <g stroke="#64748B" stroke-width="1.5">
      <line x1="520" y1="90" x2="525" y2="90"/><line x1="520" y1="100" x2="525" y2="100"/>
      <line x1="520" y1="110" x2="525" y2="110"/><line x1="520" y1="120" x2="525" y2="120"/>
      <line x1="520" y1="130" x2="525" y2="130"/>
      <line x1="595" y1="90" x2="600" y2="90"/><line x1="595" y1="100" x2="600" y2="100"/>
      <line x1="595" y1="110" x2="600" y2="110"/><line x1="595" y1="120" x2="600" y2="120"/>
      <line x1="595" y1="130" x2="600" y2="130"/>
    </g>
    <text x="560" y="115" font-family="monospace" font-size="9" fill="#64748B" text-anchor="middle">RAM</text>
  </g>

  <!-- Controller chip -->
  <g>
    <ellipse cx="460" cy="175" rx="45" ry="40" fill="url(#chipGlow3)" opacity="0.5"/>
    <rect x="430" y="150" width="60" height="50" fill="#0a0820" stroke="#64748B" stroke-width="2" rx="2"/>
    <!-- Pins -->
    <g stroke="#64748B" stroke-width="1.5">
      <line x1="425" y1="160" x2="430" y2="160"/><line x1="425" y1="170" x2="430" y2="170"/>
      <line x1="425" y1="180" x2="430" y2="180"/><line x1="425" y1="190" x2="430" y2="190"/>
      <line x1="490" y1="160" x2="495" y2="160"/><line x1="490" y1="170" x2="495" y2="170"/>
      <line x1="490" y1="180" x2="495" y2="180"/><line x1="490" y1="190" x2="495" y2="190"/>
    </g>
    <text x="460" y="180" font-family="monospace" font-size="8" fill="#64748B" text-anchor="middle">CTRL</text>
  </g>

  <!-- PADS & VIAS -->
  <!-- Solder pads (filled circles) -->
  <circle cx="50" cy="50" r="3" fill="#B45309"/>
  <circle cx="150" cy="50" r="3" fill="#B45309"/>
  <circle cx="150" cy="100" r="3" fill="#B45309"/>
  <circle cx="250" cy="100" r="3" fill="#B45309"/>
  <circle cx="250" cy="150" r="3" fill="#B45309"/>
  <circle cx="350" cy="150" r="3" fill="#B45309"/>
  <circle cx="350" cy="200" r="3" fill="#B45309"/>
  <circle cx="550" cy="80" r="3" fill="#B45309"/>
  <circle cx="650" cy="80" r="3" fill="#B45309"/>
  <circle cx="650" cy="140" r="3" fill="#B45309"/>
  <circle cx="750" cy="140" r="3" fill="#B45309"/>

  <!-- Vias (ring circles) -->
  <circle cx="180" cy="120" r="2.5" fill="none" stroke="#64748B" stroke-width="1"/>
  <circle cx="260" cy="180" r="2.5" fill="none" stroke="#64748B" stroke-width="1"/>
  <circle cx="480" cy="60" r="2.5" fill="none" stroke="#B45309" stroke-width="1"/>
  <circle cx="560" cy="110" r="2.5" fill="none" stroke="#64748B" stroke-width="1"/>
  <circle cx="200" cy="240" r="2.5" fill="none" stroke="#B45309" stroke-width="1"/>
  <circle cx="530" cy="200" r="2.5" fill="none" stroke="#64748B" stroke-width="1"/>
  <circle cx="380" cy="70" r="2.5" fill="none" stroke="#64748B" stroke-width="1"/>
  <circle cx="620" cy="50" r="2.5" fill="none" stroke="#B45309" stroke-width="1"/>
  <circle cx="140" cy="90" r="2.5" fill="none" stroke="#B45309" stroke-width="1"/>
  <circle cx="660" cy="220" r="2.5" fill="none" stroke="#64748B" stroke-width="1"/>

  <!-- CAPACITORS -->
  <g>
    <rect x="195" y="95" width="10" height="16" fill="#1a1a2e" stroke="#64748B" stroke-width="1" rx="1"/>
    <line x1="200" y1="95" x2="200" y2="91" stroke="#64748B" stroke-width="1"/>
    <line x1="200" y1="111" x2="200" y2="115" stroke="#64748B" stroke-width="1"/>
    <text x="200" y="108" font-family="monospace" font-size="6" fill="#64748B" text-anchor="middle">C1</text>
  </g>

  <g>
    <rect x="505" y="145" width="10" height="16" fill="#1a1a2e" stroke="#64748B" stroke-width="1" rx="1"/>
    <line x1="510" y1="145" x2="510" y2="141" stroke="#64748B" stroke-width="1"/>
    <line x1="510" y1="161" x2="510" y2="165" stroke="#64748B" stroke-width="1"/>
    <text x="510" y="158" font-family="monospace" font-size="6" fill="#64748B" text-anchor="middle">C2</text>
  </g>

  <!-- RESISTORS -->
  <g>
    <rect x="355" y="147" width="20" height="6" fill="#2a1810" stroke="#B45309" stroke-width="1" rx="1"/>
    <line x1="350" y1="150" x2="355" y2="150" stroke="#B45309" stroke-width="1"/>
    <line x1="375" y1="150" x2="380" y2="150" stroke="#B45309" stroke-width="1"/>
    <text x="365" y="153" font-family="monospace" font-size="5" fill="#B45309" text-anchor="middle">R1</text>
  </g>

  <g>
    <rect x="645" y="77" width="20" height="6" fill="#2a1810" stroke="#B45309" stroke-width="1" rx="1"/>
    <line x1="640" y1="80" x2="645" y2="80" stroke="#B45309" stroke-width="1"/>
    <line x1="665" y1="80" x2="670" y2="80" stroke="#B45309" stroke-width="1"/>
    <text x="655" y="83" font-family="monospace" font-size="5" fill="#B45309" text-anchor="middle">R2</text>
  </g>

  <g>
    <rect x="255" y="147" width="20" height="6" fill="#2a1810" stroke="#B45309" stroke-width="1" rx="1"/>
    <line x1="250" y1="150" x2="255" y2="150" stroke="#B45309" stroke-width="1"/>
    <line x1="275" y1="150" x2="280" y2="150" stroke="#B45309" stroke-width="1"/>
    <text x="265" y="153" font-family="monospace" font-size="5" fill="#B45309" text-anchor="middle">R3</text>
  </g>

  <!-- LED INDICATORS -->
  <!-- Red LED - fast blink -->
  <circle cx="300" cy="60" r="4" fill="#EF4444">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Green LED - medium blink -->
  <circle cx="315" cy="60" r="4" fill="#34D399">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Blue LED - slow blink -->
  <circle cx="330" cy="60" r="4" fill="#06B6D4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Yellow LED - irregular -->
  <circle cx="345" cy="60" r="4" fill="#F59E0B">
    <animate attributeName="opacity" values="0.3;1;0.3;1;0.3" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Amber LED -->
  <circle cx="360" cy="60" r="4" fill="#F97316">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- SIGNAL FLOW - Traveling dots along traces -->
  <!-- Dot 1 - green on main power trace -->
  <circle r="2.5" fill="#34D399" opacity="0.9">
    <animate attributeName="cx" values="50;150;150;250" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;50;100;100" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 2 - cyan on continuation -->
  <circle r="2.5" fill="#06B6D4" opacity="0.9">
    <animate attributeName="cx" values="250;250;350;350" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;150;150;200" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 3 - gold on signal trace -->
  <circle r="2.5" fill="#F59E0B" opacity="0.9">
    <animate attributeName="cx" values="100;180;180;260" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;120;180;180" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 4 - green on continuation -->
  <circle r="2.5" fill="#34D399" opacity="0.9">
    <animate attributeName="cx" values="260;260;340" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;220;220" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 5 - cyan on upper trace -->
  <circle r="2.5" fill="#06B6D4" opacity="0.9">
    <animate attributeName="cx" values="400;480;480;560" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;60;110;110" dur="19s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 6 - gold continuation -->
  <circle r="2.5" fill="#F59E0B" opacity="0.9">
    <animate attributeName="cx" values="560;560;640" dur="23s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;170;170" dur="23s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 7 - green on lower trace -->
  <circle r="2.5" fill="#34D399" opacity="0.9">
    <animate attributeName="cx" values="120;200;200;280" dur="29s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="240;240;190;190" dur="29s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 8 - cyan on right side -->
  <circle r="2.5" fill="#06B6D4" opacity="0.9">
    <animate attributeName="cx" values="450;530;530;610" dur="31s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;200;250;250" dur="31s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 9 - gold on left trace -->
  <circle r="2.5" fill="#F59E0B" opacity="0.9">
    <animate attributeName="cx" values="70;130;130;190" dur="37s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160;210;210" dur="37s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 10 - green on mid trace -->
  <circle r="2.5" fill="#34D399" opacity="0.9">
    <animate attributeName="cx" values="320;380;380;440" dur="41s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;70;120;120" dur="41s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 11 - cyan on top right -->
  <circle r="2.5" fill="#06B6D4" opacity="0.9">
    <animate attributeName="cx" values="550;650;650;750" dur="43s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;80;140;140" dur="43s" repeatCount="indefinite"/>
  </circle>

  <!-- Dot 12 - gold on bottom -->
  <circle r="2.5" fill="#F59E0B" opacity="0.9">
    <animate attributeName="cx" values="150;230;230;310" dur="47s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="270;270;230;230" dur="47s" repeatCount="indefinite"/>
  </circle>

  <!-- Data bus synchronized signals -->
  <circle r="2" fill="#34D399" opacity="0.8">
    <animate attributeName="cx" values="380;460;460;540" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160;190;190" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#06B6D4" opacity="0.8">
    <animate attributeName="cx" values="380;460;460;540" dur="5s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;170;200;200" dur="5s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#F59E0B" opacity="0.8">
    <animate attributeName="cx" values="380;460;460;540" dur="5s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="180;180;210;210" dur="5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- SOLDER POINT HIGHLIGHTS - occasional flashes -->
  <circle cx="150" cy="50" r="2" fill="#F59E0B" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="100" r="2" fill="#34D399" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="150" r="2" fill="#06B6D4" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="80" r="2" fill="#F59E0B" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="17s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="180" r="2" fill="#34D399" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="19s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="60" r="2" fill="#06B6D4" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="23s" begin="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="110" r="2" fill="#F59E0B" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="29s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Additional trace connections for complexity -->
  <path d="M 220 130 L 240 130" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 320 130 L 340 130 L 340 90" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 500 130 L 525 130" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 595 110 L 620 110 L 620 90" stroke="#64748B" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>