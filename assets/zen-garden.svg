<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Japanese Zen Garden at Moonlight">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#080810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f18;stop-opacity:1" />
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E2E8F0;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#E2E8F0;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#94A3B8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#94A3B8;stop-opacity:0" />
    </radialGradient>

    <!-- Lantern glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.8">
        <animate attributeName="stop-opacity"
          values="0.8;0.5;0.9;0.6;0.85;0.7;0.8"
          keyTimes="0;0.2;0.3;0.5;0.6;0.8;1"
          dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0">
        <animate attributeName="stop-opacity"
          values="0;0.1;0.05;0.15;0.08;0.12;0"
          keyTimes="0;0.2;0.3;0.5;0.6;0.8;1"
          dur="7s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>

    <!-- Ripple animation for water basin -->
    <circle id="ripple" cx="0" cy="0" r="8" fill="none" stroke="#4A5568" stroke-width="0.3" opacity="0">
      <animate attributeName="r" values="8;14;20" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="300" fill="url(#skyGrad)"/>

  <!-- Moon with glow -->
  <circle cx="650" cy="60" r="45" fill="url(#moonGlow)"/>
  <circle cx="650" cy="60" r="28" fill="#E2E8F0" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.85;0.95" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Bamboo fence (背景) -->
  <g id="bamboofence" opacity="0.3">
    <!-- Horizontal rails -->
    <line x1="0" y1="85" x2="800" y2="85" stroke="#2a2a3e" stroke-width="1.5"/>
    <line x1="0" y1="105" x2="800" y2="105" stroke="#2a2a3e" stroke-width="1.5"/>
    <!-- Vertical slats -->
    <line x1="40" y1="75" x2="40" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="90" y1="75" x2="90" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="140" y1="75" x2="140" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="190" y1="75" x2="190" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="240" y1="75" x2="240" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="290" y1="75" x2="290" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="340" y1="75" x2="340" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="390" y1="75" x2="390" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="440" y1="75" x2="440" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="490" y1="75" x2="490" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="540" y1="75" x2="540" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="590" y1="75" x2="590" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="640" y1="75" x2="640" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="690" y1="75" x2="690" y2="115" stroke="#25253a" stroke-width="2"/>
    <line x1="740" y1="75" x2="740" y2="115" stroke="#25253a" stroke-width="2"/>
  </g>

  <!-- Sand garden base -->
  <rect x="0" y="120" width="800" height="180" fill="#1a1a28"/>

  <!-- Stepping stones path -->
  <ellipse cx="120" cy="240" rx="22" ry="18" fill="#2a2a38" opacity="0.8"/>
  <ellipse cx="185" cy="255" rx="20" ry="16" fill="#252532" opacity="0.8"/>
  <ellipse cx="245" cy="245" rx="24" ry="19" fill="#2a2a38" opacity="0.8"/>
  <ellipse cx="310" cy="260" rx="21" ry="17" fill="#282835" opacity="0.8"/>
  <ellipse cx="370" cy="250" rx="23" ry="18" fill="#2a2a38" opacity="0.8"/>

  <!-- Rock 1 (left, largest) -->
  <path d="M 200 220 L 240 200 L 270 210 L 280 230 L 270 260 L 240 270 L 210 265 L 190 245 Z"
    fill="#15151f" stroke="#0a0a12" stroke-width="0.5"/>
  <path d="M 210 220 L 245 205 L 265 215 L 255 230 Z"
    fill="#25253a" opacity="0.3"/>

  <!-- Moss near rock 1 -->
  <ellipse cx="195" cy="270" rx="12" ry="6" fill="#1a3a2a" opacity="0.6"/>
  <ellipse cx="280" cy="265" rx="10" ry="5" fill="#0f2a1f" opacity="0.5"/>

  <!-- Raked circles around rock 1 -->
  <circle cx="240" cy="240" r="50" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.5"/>
  <circle cx="240" cy="240" r="55" fill="none" stroke="#2a2a3e" stroke-width="0.5" opacity="0.45"/>
  <circle cx="240" cy="240" r="60" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.4"/>
  <circle cx="240" cy="240" r="65" fill="none" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>
  <circle cx="240" cy="240" r="70" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.3"/>
  <circle cx="240" cy="240" r="76" fill="none" stroke="#2a2a3e" stroke-width="0.5" opacity="0.25"/>

  <!-- Rock 2 (center-right, medium) -->
  <path d="M 500 210 L 530 200 L 550 215 L 545 240 L 525 250 L 505 245 L 495 230 Z"
    fill="#1a1a25" stroke="#0a0a12" stroke-width="0.5"/>
  <path d="M 508 215 L 532 205 L 542 220 L 530 230 Z"
    fill="#28283d" opacity="0.3"/>

  <!-- Moss near rock 2 -->
  <ellipse cx="495" cy="250" rx="9" ry="5" fill="#1a3a2a" opacity="0.5"/>

  <!-- Raked circles around rock 2 -->
  <circle cx="520" cy="225" r="40" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.5"/>
  <circle cx="520" cy="225" r="45" fill="none" stroke="#2a2a3e" stroke-width="0.5" opacity="0.45"/>
  <circle cx="520" cy="225" r="50" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.4"/>
  <circle cx="520" cy="225" r="56" fill="none" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>

  <!-- Rock 3 (right, smallest) -->
  <path d="M 680 240 L 700 235 L 710 245 L 705 260 L 690 265 L 675 258 Z"
    fill="#15151f" stroke="#0a0a12" stroke-width="0.5"/>
  <path d="M 684 243 L 698 238 L 705 248 L 695 253 Z"
    fill="#25253a" opacity="0.3"/>

  <!-- Moss near rock 3 -->
  <ellipse cx="673" cy="265" rx="7" ry="4" fill="#0f2a1f" opacity="0.5"/>

  <!-- Raked circles around rock 3 -->
  <circle cx="692" cy="250" r="28" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.5"/>
  <circle cx="692" cy="250" r="33" fill="none" stroke="#2a2a3e" stroke-width="0.5" opacity="0.45"/>
  <circle cx="692" cy="250" r="38" fill="none" stroke="#2a2a3e" stroke-width="0.6" opacity="0.4"/>

  <!-- Parallel raked lines (horizontal sections between rocks) -->
  <line x1="0" y1="145" x2="150" y2="145" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="152" x2="150" y2="152" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>
  <line x1="0" y1="159" x2="150" y2="159" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="166" x2="150" y2="166" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>
  <line x1="0" y1="173" x2="150" y2="173" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>

  <line x1="350" y1="160" x2="450" y2="160" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>
  <line x1="350" y1="167" x2="450" y2="167" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>
  <line x1="350" y1="174" x2="450" y2="174" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>
  <line x1="350" y1="181" x2="450" y2="181" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>
  <line x1="350" y1="188" x2="450" y2="188" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>

  <line x1="590" y1="175" x2="650" y2="175" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>
  <line x1="590" y1="182" x2="650" y2="182" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>
  <line x1="590" y1="189" x2="650" y2="189" stroke="#2a2a3e" stroke-width="0.5" opacity="0.4"/>
  <line x1="590" y1="196" x2="650" y2="196" stroke="#2a2a3e" stroke-width="0.5" opacity="0.35"/>

  <!-- Water basin (tsukubai) -->
  <ellipse cx="85" cy="170" rx="18" ry="14" fill="#0f0f1a" stroke="#2a2a3e" stroke-width="0.8"/>
  <ellipse cx="85" cy="168" rx="12" ry="9" fill="#1a1a28" opacity="0.7"/>
  <!-- Water surface -->
  <ellipse cx="85" cy="168" rx="10" ry="7" fill="#2a3a48" opacity="0.4"/>
  <!-- Ripples -->
  <use href="#ripple" x="85" y="168"/>
  <use href="#ripple" x="85" y="168">
    <animate attributeName="r" values="8;14;20" dur="5s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="5s" begin="1.7s" repeatCount="indefinite"/>
  </use>

  <!-- Stone lantern (灯籠 tōrō) -->
  <g id="lantern">
    <!-- Base -->
    <rect x="720" y="155" width="20" height="8" fill="#1a1a25"/>
    <!-- Post -->
    <rect x="726" y="140" width="8" height="15" fill="#1a1a25"/>
    <!-- Light chamber -->
    <rect x="722" y="130" width="16" height="12" fill="#15151f" stroke="#0a0a12" stroke-width="0.5"/>
    <!-- Glow window -->
    <rect x="726" y="134" width="8" height="6" fill="url(#lanternGlow)"/>
    <!-- Roof -->
    <path d="M 718 130 L 730 122 L 742 130 Z" fill="#1a1a25"/>
    <!-- Top ornament -->
    <circle cx="730" cy="120" r="2" fill="#1a1a25"/>
  </g>

  <!-- Glow halo around lantern -->
  <ellipse cx="730" cy="137" rx="25" ry="20" fill="url(#lanternGlow)" opacity="0.15">
    <animate attributeName="opacity"
      values="0.15;0.08;0.18;0.1;0.16;0.12;0.15"
      keyTimes="0;0.2;0.3;0.5;0.6;0.8;1"
      dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Maple tree branch from left -->
  <g id="mapletree">
    <!-- Branch -->
    <path d="M 0 100 Q 40 95 80 100 T 140 110"
      fill="none" stroke="#2a2a3e" stroke-width="2.5" opacity="0.7"/>
    <path d="M 80 100 Q 90 85 100 80"
      fill="none" stroke="#2a2a3e" stroke-width="1.8" opacity="0.6"/>
    <path d="M 110 105 Q 125 95 135 92"
      fill="none" stroke="#2a2a3e" stroke-width="1.5" opacity="0.6"/>

    <!-- Leaf clusters (small stylized maple leaves) -->
    <g id="leaf1" opacity="0.7">
      <path d="M 95 75 L 98 70 L 101 75 L 98 78 Z" fill="#4a2a2a"/>
      <path d="M 93 73 L 98 70 L 103 73 L 98 76 Z" fill="#5a3535"/>
    </g>
    <g id="leaf2" opacity="0.65">
      <path d="M 130 88 L 133 83 L 136 88 L 133 91 Z" fill="#4a2a2a"/>
      <path d="M 128 86 L 133 83 L 138 86 L 133 89 Z" fill="#5a3535"/>
    </g>
    <g id="leaf3" opacity="0.7">
      <path d="M 75 98 L 78 93 L 81 98 L 78 101 Z" fill="#4a2a2a"/>
      <path d="M 73 96 L 78 93 L 83 96 L 78 99 Z" fill="#5a3535"/>
    </g>
  </g>

  <!-- Falling maple leaves (animated) -->
  <g id="fallingLeaf1" opacity="0.6">
    <path d="M 0 0 L 2.5 -4 L 5 0 L 2.5 3 Z" fill="#4a2a2a">
      <animateTransform attributeName="transform" type="translate"
        values="120,60; 140,120; 160,180; 185,240; 210,295"
        dur="23s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0 2.5 0; 45 2.5 0; -30 2.5 0; 60 2.5 0; 0 2.5 0"
        dur="23s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.8;0.5;0.7;0.3;0" dur="23s" repeatCount="indefinite"/>
    </path>
  </g>

  <g id="fallingLeaf2" opacity="0.5">
    <path d="M 0 0 L 2 -3.5 L 4 0 L 2 2.5 Z" fill="#5a3535">
      <animateTransform attributeName="transform" type="translate"
        values="85,80; 95,140; 110,200; 130,260; 155,295"
        dur="31s" begin="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0 2 0; -50 2 0; 40 2 0; -35 2 0; 0 2 0"
        dur="31s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.7;0.4;0.6;0.2;0" dur="31s" begin="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Cherry blossom petals drifting -->
  <g id="petal1">
    <ellipse rx="3" ry="5" fill="#FBC4D4" opacity="0.6">
      <animateTransform attributeName="transform" type="translate"
        values="600,120; 580,160; 565,200; 555,240; 548,280"
        dur="29s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0; 120; 240; 360; 480"
        dur="29s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.8;0.5;0.7;0.3" dur="29s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g id="petal2">
    <ellipse rx="2.5" ry="4.5" fill="#FBC4D4" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="550,100; 535,145; 525,190; 518,235; 512,275"
        dur="37s" begin="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0; -100; -200; -300; -400"
        dur="37s" begin="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.7;0.4;0.6;0.2" dur="37s" begin="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g id="petal3">
    <ellipse rx="3" ry="5.5" fill="#FFD4E4" opacity="0.55">
      <animateTransform attributeName="transform" type="translate"
        values="450,90; 440,140; 435,190; 432,240; 430,285"
        dur="41s" begin="13s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0; 90; 180; 270; 360"
        dur="41s" begin="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.75;0.45;0.65;0.25" dur="41s" begin="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g id="petal4">
    <ellipse rx="2.8" ry="4.8" fill="#FBC4D4" opacity="0.5">
      <animateTransform attributeName="transform" type="translate"
        values="350,110; 355,155; 362,200; 370,245; 380,290"
        dur="43s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum"
        values="0; -80; -160; -240; -320"
        dur="43s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.7;0.4;0.6;0.2" dur="43s" begin="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
