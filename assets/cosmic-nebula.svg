<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Cosmic Nebula">
  <title>Cosmic Nebula - An animated deep space vista</title>

  <defs>
    <!-- [LAW:one-source-of-truth] All filter definitions centralized in defs -->

    <!-- Turbulence filters for nebula clouds -->
    <filter id="nebula-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" seed="1">
        <animate attributeName="baseFrequency"
                 values="0.012;0.015;0.012"
                 dur="157s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="2"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="nebula-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="4" seed="42">
        <animate attributeName="seed"
                 values="42;142;42"
                 dur="211s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="1.8"/>
      <feGaussianBlur stdDeviation="15"/>
    </filter>

    <filter id="nebula-rose" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="99">
        <animate attributeName="baseFrequency"
                 values="0.018;0.022;0.018"
                 dur="127s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="nebula-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7">
        <animate attributeName="seed"
                 values="7;77;7"
                 dur="179s"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Glow filter for bright stars -->
    <filter id="star-glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial gradients for star halos -->
    <radialGradient id="halo-blue">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo-white">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E0E7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo-warm">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="halo-cyan">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Central star gradient -->
    <radialGradient id="central-star">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="20%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FDE68A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: pitch black space -->
  <rect width="800" height="300" fill="#010108"/>

  <!-- Background star field: scattered tiny stars -->
  <!-- [LAW:dataflow-not-control-flow] Stars generated as static data, animation varies by value not control flow -->

  <!-- Static background stars (no animation) -->
  <circle cx="45" cy="28" r="0.5" fill="#E0E7FF" opacity="0.7"/>
  <circle cx="123" cy="89" r="0.8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="234" cy="34" r="0.6" fill="#93C5FD" opacity="0.5"/>
  <circle cx="312" cy="145" r="0.7" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="421" cy="67" r="0.5" fill="#C7D2FE" opacity="0.7"/>
  <circle cx="534" cy="198" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="623" cy="76" r="0.6" fill="#93C5FD" opacity="0.6"/>
  <circle cx="712" cy="234" r="0.7" fill="#E0E7FF" opacity="0.5"/>
  <circle cx="156" cy="267" r="0.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="267" cy="178" r="0.6" fill="#C7D2FE" opacity="0.7"/>
  <circle cx="378" cy="289" r="0.8" fill="#93C5FD" opacity="0.5"/>
  <circle cx="489" cy="123" r="0.7" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="598" cy="45" r="0.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="701" cy="156" r="0.6" fill="#93C5FD" opacity="0.5"/>
  <circle cx="78" cy="189" r="0.8" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="189" cy="112" r="0.5" fill="#C7D2FE" opacity="0.7"/>
  <circle cx="345" cy="223" r="0.7" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="456" cy="34" r="0.6" fill="#93C5FD" opacity="0.6"/>
  <circle cx="567" cy="278" r="0.8" fill="#E0E7FF" opacity="0.5"/>
  <circle cx="678" cy="89" r="0.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="98" cy="145" r="0.6" fill="#93C5FD" opacity="0.6"/>
  <circle cx="210" cy="256" r="0.7" fill="#C7D2FE" opacity="0.5"/>
  <circle cx="321" cy="67" r="0.8" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="432" cy="189" r="0.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="543" cy="98" r="0.6" fill="#93C5FD" opacity="0.5"/>
  <circle cx="654" cy="212" r="0.7" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="765" cy="123" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="134" cy="234" r="0.6" fill="#93C5FD" opacity="0.6"/>
  <circle cx="245" cy="45" r="0.5" fill="#C7D2FE" opacity="0.7"/>
  <circle cx="356" cy="167" r="0.7" fill="#E0E7FF" opacity="0.5"/>

  <!-- Twinkling stars (with opacity animation on prime cycles) -->
  <circle cx="67" cy="56" r="1" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="178" cy="23" r="1.2" fill="#93C5FD" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="289" cy="267" r="0.9" fill="#E0E7FF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="401" cy="145" r="1.1" fill="#FFFFFF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="17s" repeatCount="indefinite"/>
  </circle>
  <circle cx="512" cy="234" r="1" fill="#C7D2FE" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="634" cy="123" r="1.3" fill="#93C5FD" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="23s" repeatCount="indefinite"/>
  </circle>
  <circle cx="723" cy="267" r="1" fill="#FFFFFF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="29s" repeatCount="indefinite"/>
  </circle>
  <circle cx="112" cy="198" r="1.2" fill="#E0E7FF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="31s" repeatCount="indefinite"/>
  </circle>
  <circle cx="223" cy="89" r="0.9" fill="#93C5FD" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="37s" repeatCount="indefinite"/>
  </circle>
  <circle cx="334" cy="256" r="1.1" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="41s" repeatCount="indefinite"/>
  </circle>
  <circle cx="445" cy="67" r="1" fill="#C7D2FE" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="43s" repeatCount="indefinite"/>
  </circle>
  <circle cx="556" cy="178" r="1.2" fill="#E0E7FF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="47s" repeatCount="indefinite"/>
  </circle>
  <circle cx="667" cy="34" r="0.9" fill="#93C5FD" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="53s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="123" r="1.1" fill="#FFFFFF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="59s" repeatCount="indefinite"/>
  </circle>
  <circle cx="778" cy="189" r="1.3" fill="#E0E7FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="61s" repeatCount="indefinite"/>
  </circle>

  <!-- Nebula clouds: overlapping ellipses with turbulence filters -->
  <!-- [LAW:dataflow-not-control-flow] Cloud layers always render, filters drive visual variation -->

  <!-- Violet/Purple cloud - left of center -->
  <ellipse cx="280" cy="150" rx="200" ry="140" fill="#8B5CF6" opacity="0.25" filter="url(#nebula-violet)">
    <animateTransform attributeName="transform" type="rotate"
                      values="0 280 150;15 280 150;0 280 150"
                      dur="241s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="250" cy="180" rx="160" ry="110" fill="#7C3AED" opacity="0.18" filter="url(#nebula-violet)">
    <animateTransform attributeName="transform" type="rotate"
                      values="0 250 180;-12 250 180;0 250 180"
                      dur="197s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Cyan/Teal cloud - right of center -->
  <ellipse cx="520" cy="140" rx="180" ry="130" fill="#06B6D4" opacity="0.22" filter="url(#nebula-cyan)">
    <animateTransform attributeName="transform" type="rotate"
                      values="0 520 140;-18 520 140;0 520 140"
                      dur="283s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="550" cy="170" rx="150" ry="100" fill="#0891B2" opacity="0.16" filter="url(#nebula-cyan)">
    <animateTransform attributeName="transform" type="rotate"
                      values="0 550 170;20 550 170;0 550 170"
                      dur="227s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Rose accent cloud - bottom -->
  <ellipse cx="400" cy="230" rx="120" ry="80" fill="#EC4899" opacity="0.2" filter="url(#nebula-rose)">
    <animateTransform attributeName="transform" type="rotate"
                      values="0 400 230;10 400 230;0 400 230"
                      dur="167s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Gold dust region - top -->
  <ellipse cx="450" cy="80" rx="140" ry="70" fill="#F59E0B" opacity="0.15" filter="url(#nebula-gold)">
    <animateTransform attributeName="transform" type="rotate"
                      values="0 450 80;-8 450 80;0 450 80"
                      dur="193s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Dark dust lane: subtle dark overlay suggesting interstellar dust -->
  <ellipse cx="350" cy="180" rx="280" ry="45" fill="#000000" opacity="0.35" transform="rotate(-25 350 180)">
    <animate attributeName="opacity" values="0.35;0.28;0.35" dur="103s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Faint filaments connecting bright regions -->
  <path d="M 320 120 Q 380 140 440 110" stroke="#C7D2FE" stroke-width="0.5" fill="none" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.08;0.15" dur="89s" repeatCount="indefinite"/>
  </path>
  <path d="M 280 180 Q 360 200 450 185" stroke="#A78BFA" stroke-width="0.4" fill="none" opacity="0.12">
    <animate attributeName="opacity" values="0.12;0.06;0.12" dur="107s" repeatCount="indefinite"/>
  </path>
  <path d="M 380 160 Q 420 180 480 150" stroke="#67E8F9" stroke-width="0.3" fill="none" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="113s" repeatCount="indefinite"/>
  </path>

  <!-- Bright star clusters with halos -->
  <!-- [LAW:dataflow-not-control-flow] All stars render, breathing glow varies by animation timing -->

  <!-- Cluster 1: Blue-white star with halo -->
  <circle cx="300" cy="120" r="12" fill="url(#halo-blue)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="120" r="2.5" fill="#FFFFFF" filter="url(#star-glow)">
    <animate attributeName="r" values="2.5;3;2.5" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Cluster 2: Warm golden star -->
  <circle cx="480" cy="100" r="14" fill="url(#halo-warm)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.25;0.5" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="100" r="2.8" fill="#FEF3C7" filter="url(#star-glow)">
    <animate attributeName="r" values="2.8;3.4;2.8" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- Cluster 3: Cyan star -->
  <circle cx="540" cy="180" r="11" fill="url(#halo-cyan)" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.28;0.55" dur="17s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="180" r="2.2" fill="#E0F2FE" filter="url(#star-glow)">
    <animate attributeName="r" values="2.2;2.8;2.2" dur="17s" repeatCount="indefinite"/>
  </circle>

  <!-- Cluster 4: White star -->
  <circle cx="260" cy="200" r="13" fill="url(#halo-white)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="200" r="2.6" fill="#FFFFFF" filter="url(#star-glow)">
    <animate attributeName="r" values="2.6;3.2;2.6" dur="19s" repeatCount="indefinite"/>
  </circle>

  <!-- Central bright star with diffraction spikes -->
  <!-- Large halo -->
  <circle cx="400" cy="150" r="20" fill="url(#central-star)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.45;0.7" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Diffraction spikes: four thin lines emanating from center -->
  <line x1="400" y1="130" x2="400" y2="100" stroke="#FFFFFF" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="7s" repeatCount="indefinite"/>
  </line>
  <line x1="400" y1="170" x2="400" y2="200" stroke="#FFFFFF" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="7s" repeatCount="indefinite"/>
  </line>
  <line x1="380" y1="150" x2="350" y2="150" stroke="#FFFFFF" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="7s" repeatCount="indefinite"/>
  </line>
  <line x1="420" y1="150" x2="450" y2="150" stroke="#FFFFFF" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- Central star core -->
  <circle cx="400" cy="150" r="3.5" fill="#FFFFFF" filter="url(#star-glow)">
    <animate attributeName="r" values="3.5;4.2;3.5" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
