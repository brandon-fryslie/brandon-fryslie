<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Celestial Orrery - An animated solar system model">
  <title>Celestial Orrery</title>
  <desc>A mechanical solar system model with planets orbiting a central sun, complete with asteroid belt and passing comet</desc>

  <defs>
    <!-- [LAW:one-source-of-truth] Sun gradient is canonical source for solar appearance -->
    <radialGradient id="sunGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FF8C00;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0" />
    </radialGradient>

    <!-- Sun corona/lens flare gradient -->
    <radialGradient id="sunCorona" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFE6A0;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0" />
    </radialGradient>

    <!-- Background gradient -->
    <linearGradient id="spaceBackground" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#010108" />
      <stop offset="50%" style="stop-color:#030310" />
      <stop offset="100%" style="stop-color:#050512" />
    </linearGradient>

    <!-- Planet gradients for subtle 3D effect -->
    <radialGradient id="mercuryGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#B4BCC8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B7280;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="venusGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="earthGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#67E8F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="marsGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#FCA5A5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="jupiterGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400E;stop-opacity:1" />
    </radialGradient>

    <radialGradient id="saturnGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </radialGradient>

    <!-- Comet tail gradient -->
    <linearGradient id="cometTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#BAE6FD;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:0" />
    </linearGradient>

    <!-- Filter for subtle glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#spaceBackground)"/>

  <!-- Constellation backdrop - very faint stars -->
  <g opacity="0.15">
    <!-- Ursa Major-like pattern -->
    <circle cx="120" cy="50" r="0.5" fill="#FFFFFF"/>
    <circle cx="140" cy="45" r="0.5" fill="#FFFFFF"/>
    <circle cx="160" cy="48" r="0.5" fill="#FFFFFF"/>
    <circle cx="180" cy="52" r="0.5" fill="#FFFFFF"/>
    <circle cx="185" cy="70" r="0.5" fill="#FFFFFF"/>
    <circle cx="165" cy="75" r="0.5" fill="#FFFFFF"/>
    <circle cx="145" cy="72" r="0.5" fill="#FFFFFF"/>
    <line x1="120" y1="50" x2="140" y2="45" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="140" y1="45" x2="160" y2="48" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="160" y1="48" x2="180" y2="52" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="180" y1="52" x2="185" y2="70" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="185" y1="70" x2="165" y2="75" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="165" y1="75" x2="145" y2="72" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>

    <!-- Cassiopeia-like pattern -->
    <circle cx="650" cy="60" r="0.5" fill="#FFFFFF"/>
    <circle cx="670" cy="50" r="0.5" fill="#FFFFFF"/>
    <circle cx="690" cy="55" r="0.5" fill="#FFFFFF"/>
    <circle cx="710" cy="45" r="0.5" fill="#FFFFFF"/>
    <circle cx="730" cy="52" r="0.5" fill="#FFFFFF"/>
    <line x1="650" y1="60" x2="670" y2="50" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="670" y1="50" x2="690" y2="55" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="690" y1="55" x2="710" y2="45" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>
    <line x1="710" y1="45" x2="730" y2="52" stroke="#FFFFFF" stroke-width="0.3" opacity="0.5"/>

    <!-- Random background stars -->
    <circle cx="100" cy="220" r="0.5" fill="#FFFFFF"/>
    <circle cx="250" cy="40" r="0.5" fill="#FFFFFF"/>
    <circle cx="550" cy="240" r="0.5" fill="#FFFFFF"/>
    <circle cx="720" cy="200" r="0.5" fill="#FFFFFF"/>
    <circle cx="80" cy="140" r="0.5" fill="#FFFFFF"/>
    <circle cx="760" cy="120" r="0.5" fill="#FFFFFF"/>
  </g>

  <!-- Zodiac symbols at edges (very faint) -->
  <g opacity="0.1" fill="#FFFFFF" font-family="serif" font-size="10">
    <text x="20" y="150" text-anchor="middle">♈</text>
    <text x="780" y="150" text-anchor="middle">♎</text>
    <text x="400" y="20" text-anchor="middle">♋</text>
    <text x="400" y="290" text-anchor="middle">♑</text>
  </g>

  <!-- Ecliptic plane line -->
  <line x1="50" y1="150" x2="750" y2="150" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>

  <!-- All orbital mechanics centered at 400, 150 -->
  <g id="orreryCenter" transform="translate(400, 150)">

    <!-- Sun lens flare rays -->
    <g opacity="0.2">
      <line x1="-35" y1="0" x2="-50" y2="0" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7s" repeatCount="indefinite"/>
      </line>
      <line x1="35" y1="0" x2="50" y2="0" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.3s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="-35" x2="0" y2="-50" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.7s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="35" x2="0" y2="50" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.1s" repeatCount="indefinite"/>
      </line>
      <line x1="-25" y1="-25" x2="-35" y2="-35" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.5s" repeatCount="indefinite"/>
      </line>
      <line x1="25" y1="-25" x2="35" y2="-35" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.9s" repeatCount="indefinite"/>
      </line>
      <line x1="-25" y1="25" x2="-35" y2="35" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.2s" repeatCount="indefinite"/>
      </line>
      <line x1="25" y1="25" x2="35" y2="35" stroke="#FFE6A0" stroke-width="0.5">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.6s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Orbital rings (ellipses with perspective) -->
    <!-- Mercury orbit -->
    <ellipse cx="0" cy="0" rx="40" ry="32" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>

    <!-- Venus orbit -->
    <ellipse cx="0" cy="0" rx="60" ry="48" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>

    <!-- Earth orbit -->
    <ellipse cx="0" cy="0" rx="80" ry="64" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>

    <!-- Mars orbit -->
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>

    <!-- Asteroid belt ring -->
    <ellipse cx="0" cy="0" rx="120" ry="96" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.2"/>

    <!-- Jupiter orbit -->
    <ellipse cx="0" cy="0" rx="145" ry="116" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>

    <!-- Saturn orbit -->
    <ellipse cx="0" cy="0" rx="175" ry="140" fill="none" stroke="#1a1a3e" stroke-width="0.5" opacity="0.3"/>

    <!-- Asteroid belt - ring of tiny dots between Mars and Jupiter -->
    <g id="asteroidBelt" opacity="0.4">
      <!-- [LAW:dataflow-not-control-flow] All asteroids animate uniformly, position determines appearance -->
      <circle cx="120" cy="0" r="0.5" fill="#6B7280"/>
      <circle cx="115" cy="15" r="0.7" fill="#9CA3AF"/>
      <circle cx="110" cy="-20" r="0.6" fill="#6B7280"/>
      <circle cx="85" cy="68" r="0.5" fill="#9CA3AF"/>
      <circle cx="-85" cy="68" r="0.6" fill="#6B7280"/>
      <circle cx="-120" cy="0" r="0.5" fill="#9CA3AF"/>
      <circle cx="-115" cy="-15" r="0.7" fill="#6B7280"/>
      <circle cx="-85" cy="-68" r="0.5" fill="#9CA3AF"/>
      <circle cx="0" cy="96" r="0.6" fill="#6B7280"/>
      <circle cx="0" cy="-96" r="0.5" fill="#9CA3AF"/>
      <circle cx="95" cy="40" r="0.6" fill="#6B7280"/>
      <circle cx="-95" cy="40" r="0.5" fill="#9CA3AF"/>
      <circle cx="95" cy="-40" r="0.7" fill="#6B7280"/>
      <circle cx="-95" cy="-40" r="0.5" fill="#9CA3AF"/>
      <circle cx="60" cy="80" r="0.6" fill="#6B7280"/>
      <circle cx="-60" cy="80" r="0.5" fill="#9CA3AF"/>
      <circle cx="60" cy="-80" r="0.6" fill="#6B7280"/>
      <circle cx="-60" cy="-80" r="0.7" fill="#9CA3AF"/>
      <circle cx="108" cy="30" r="0.5" fill="#6B7280"/>
      <circle cx="118" cy="-10" r="0.6" fill="#9CA3AF"/>
      <circle cx="-108" cy="30" r="0.5" fill="#6B7280"/>
      <circle cx="-118" cy="-10" r="0.7" fill="#9CA3AF"/>

      <!-- Slow rotation -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="97s"
        repeatCount="indefinite"/>
    </g>

    <!-- Mercury - fastest orbit -->
    <g id="mercuryOrbit">
      <circle cx="40" cy="0" r="3" fill="url(#mercuryGrad)" filter="url(#softGlow)"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="11s"
        repeatCount="indefinite"/>
    </g>

    <!-- Venus -->
    <g id="venusOrbit">
      <circle cx="60" cy="0" r="4" fill="url(#venusGrad)" filter="url(#softGlow)"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="17s"
        repeatCount="indefinite"/>
    </g>

    <!-- Earth with Moon -->
    <g id="earthOrbit">
      <g id="earthMoonSystem">
        <circle cx="80" cy="0" r="5" fill="url(#earthGrad)" filter="url(#softGlow)"/>
        <!-- Moon orbiting Earth -->
        <g id="moonOrbit">
          <circle cx="89" cy="0" r="1.5" fill="#E5E7EB"/>
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 80 0"
            to="360 80 0"
            dur="3s"
            repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="23s"
        repeatCount="indefinite"/>
    </g>

    <!-- Mars -->
    <g id="marsOrbit">
      <circle cx="100" cy="0" r="4" fill="url(#marsGrad)" filter="url(#softGlow)"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="29s"
        repeatCount="indefinite"/>
    </g>

    <!-- Jupiter -->
    <g id="jupiterOrbit">
      <circle cx="145" cy="0" r="8" fill="url(#jupiterGrad)" filter="url(#softGlow)"/>
      <!-- Jupiter bands suggestion -->
      <ellipse cx="145" cy="0" rx="8" ry="1.5" fill="#92400E" opacity="0.3"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="41s"
        repeatCount="indefinite"/>
    </g>

    <!-- Saturn with rings -->
    <g id="saturnOrbit">
      <!-- Saturn's rings (behind and in front) -->
      <ellipse cx="175" cy="0" rx="12" ry="3" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.6"/>
      <ellipse cx="175" cy="0" rx="14" ry="3.5" fill="none" stroke="#F59E0B" stroke-width="0.3" opacity="0.4"/>
      <circle cx="175" cy="0" r="7" fill="url(#saturnGrad)" filter="url(#softGlow)"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="53s"
        repeatCount="indefinite"/>
    </g>

    <!-- Comet on elongated elliptical path -->
    <g id="cometOrbit">
      <!-- Comet tail (pointing away from sun) -->
      <g id="cometTailGroup" transform="translate(250, -80)">
        <line x1="0" y1="0" x2="-25" y2="-8" stroke="url(#cometTail)" stroke-width="1.5" opacity="0.8"/>
        <line x1="0" y1="0" x2="-30" y2="-10" stroke="url(#cometTail)" stroke-width="1" opacity="0.5"/>
      </g>
      <!-- Comet nucleus -->
      <circle cx="250" cy="-80" r="2" fill="#E0F2FE" filter="url(#glow)"/>
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="67s"
        repeatCount="indefinite"/>
    </g>

    <!-- Sun corona (outer glow) -->
    <circle cx="0" cy="0" r="35" fill="url(#sunCorona)" opacity="0.6">
      <animate attributeName="r" values="35;40;35" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- Sun -->
    <circle cx="0" cy="0" r="20" fill="url(#sunGlow)" filter="url(#glow)">
      <!-- [LAW:dataflow-not-control-flow] Breathing animation always runs, intensity varies via values -->
      <animate attributeName="r" values="20;22;20" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Sun bright core -->
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Astronomical markers at bottom (very faint labels) -->
  <g opacity="0.15" fill="#8B9DC3" font-family="monospace" font-size="8">
    <text x="400" y="290" text-anchor="middle">☉ ORRERY MODEL ☉</text>
  </g>

  <style>
    /* [LAW:single-enforcer] All animation timing governed by SMIL, CSS only for static appearance */
    svg {
      background: transparent;
    }
  </style>
</svg>
